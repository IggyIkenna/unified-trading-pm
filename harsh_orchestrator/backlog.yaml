    title: "Add uptime_seconds field to /healthz response"
    tier: 1
    priority: 30
    repos:
      - orchestrator
    prereqs:
      completed_tasks: []
      conditions: []
    brief: |
      The /healthz endpoint currently returns status, ts, mode. Add an
      `uptime_seconds` integer field calculated as (now - server_started)
      so external monitors can see how long the process has been up
      without parsing timestamps themselves.

      The server start time is already tracked: `_state["started_at"]`
      (set in lifespan; accessible via get_started_at()).
    done_definition: |
      - curl http://localhost:8765/healthz returns
        {status: "ok", ts: "...", mode: "...", uptime_seconds: N}
        where N is a non-negative integer
      - No new tests required (this is a trivial extension)
      - Conventional commit: "feat(server): expose uptime_seconds in /healthz"
    plan_ref: "first live-mode validation task"
    est_hours: 0.5
    model: sonnet

