  - id: R-001
    title: "Better error when populate_demo.py can't reach the server"
    tier: 1
    priority: 10
    repos:
      - orchestrator
    prereqs:
      completed_tasks: []
      conditions: []
    brief: |
      In scripts/populate_demo.py, the script currently raises a urllib
      traceback if the server is not running on localhost:8765. Improve the
      error handling: catch ConnectionRefusedError / URLError at the top of
      main() and print a one-line message like:

          Cannot reach server at http://localhost:8765. Start it with:
            ORCHESTRATOR_MODE=mock python3 -m uvicorn server.server:app --port 8765

      Then exit(1). No stack trace.
    done_definition: |
      - Running `python3 scripts/populate_demo.py` with no server up prints
        the friendly message and exits with code 1 (not a traceback)
      - With server up, the script still works exactly as before
      - Commit with conventional message: "fix(scripts): friendlier error
        when populate_demo cannot reach the server"
    plan_ref: "first live-mode validation task"
    est_hours: 0.5
    model: sonnet

