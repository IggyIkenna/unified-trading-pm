# Canonical pre-commit config for documentation repos (PM, codex).
# Template SSOT: unified-trading-pm/scripts/pre-commit-templates/
# Rollout: bash unified-trading-pm/scripts/propagation/rollout-pre-commit-configs.sh
# Setup: pre-commit install --install-hooks

default_install_hook_types:
  - pre-commit
  - commit-msg
  # NEVER add pre-push here — .git/hooks/pre-push is the strict-quickmerge guard, not prek's.

repos:
  # Conventional commit validation (feat:/fix:/chore:/docs:/refactor:/test:/ci:)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Locked-plan deletion gate — MUST be commit-msg stage (same reason as
  # conventional-pre-commit above): .git/COMMIT_EDITMSG is not reliably the
  # message-to-be at the pre-commit stage. Blocks archiving/deleting a
  # plans/active/*.md doc whose frontmatter carries locked_by: unless the
  # commit message has [unlock-plan]. The quality-gates.sh copy of this check
  # never runs for docs(plans): commits (routed to prek-only) — this is the
  # gate that actually fires for the commit class that archives plans. SSOT:
  # scripts/hooks/check-locked-plan-deletion.sh.
  - repo: local
    hooks:
      - id: check-locked-plan-deletion
        name: Locked-plan deletion gate (blocks archiving a locked_by plan without [unlock-plan])
        entry:
          bash -c 'HOOK="${WORKSPACE_ROOT:-$(cd "$(git rev-parse --show-toplevel)/.." &&
          pwd)}/unified-trading-pm/scripts/hooks/check-locked-plan-deletion.sh"; [ -f "$HOOK" ] || exit 0; bash "$HOOK"
          "$@"' --
        language: system
        stages: [commit-msg]

  # Branch drift check - blocks commit if you're behind origin
  - repo: local
    hooks:
      - id: fix-commit-identity
        name: Enforce slot·host commit identity
        entry:
          bash -c 'HOOK="${WORKSPACE_ROOT:-$(cd "$(git rev-parse --show-toplevel)/.." &&
          pwd)}/unified-trading-pm/scripts/hooks/fix-commit-identity.sh"; [ -f "$HOOK" ] || exit 0; bash "$HOOK"'
        language: system
        always_run: true
        pass_filenames: false
        fail_fast: true # wrong identity -> STOP + re-run (git resolves author BEFORE hooks)

  - repo: local
    hooks:
      - id: check-branch-drift
        name: Check branch drift (are you behind origin?)
        entry:
          bash -c 'HOOK="${WORKSPACE_ROOT:-$(cd "$(git rev-parse --show-toplevel)/.." &&
          pwd)}/unified-trading-pm/scripts/hooks/check-branch-drift.sh"; [ -f "$HOOK" ] || exit 0; bash "$HOOK"'
        language: system
        always_run: true
        pass_filenames: false
        fail_fast: true # behind-origin -> STOP before any formatter mutates (no reflow residue that breaks slot FF-sync)

  # Quickmerge-provenance gate — the commit-TIME half of check_strict_quickmerge.py's
  # pre-push carve-out logic (SSOT there: commit_violates()/_is_source()/NONSOURCE_DIR).
  # A raw `git commit` of a source file with no `Quickmerge:` trailer was previously only
  # ever caught at PUSH time, after it had already sat in a shared checkout racing every
  # other concurrent session's pulls/rebases — this catches it before that window opens.
  # WARN-only (see the hook's own header) until QUICKMERGE_PROVENANCE_BLOCK=1 is set fleet-
  # wide, mirroring STRICT_QUICKMERGE_BLOCK's own unblocking-first rollout.
  - repo: local
    hooks:
      - id: check-quickmerge-provenance
        name: Quickmerge provenance (source commits need the Quickmerge trailer)
        entry:
          bash -c 'HOOK="${WORKSPACE_ROOT:-$(cd "$(git rev-parse --show-toplevel)/.." &&
          pwd)}/unified-trading-pm/scripts/hooks/check-quickmerge-provenance.sh"; [ -f "$HOOK" ] || exit 0; bash "$HOOK"
          "$@"' --
        language: system
        stages: [commit-msg]

  # Plan hygiene — STAGED-FILES-ONLY frontmatter gate on plan commits (incl. docs(plans): flips
  # that skip full QG). The sweep computes the staged plans itself and validates only those, so a
  # pre-existing violation in an unrelated plan never blocks your commit (RULE-11 blast-radius
  # safety). Fast (<4s), local, no origin fetch, no sentinel needed (files:^plans/ is the skip).
  # The origin-compare (todo-regression) + LLM contradiction checks stay at CI, not pre-commit.
  - repo: local
    hooks:
      - id: plan-hygiene
        name: Plan hygiene (staged plans + codex + runbooks — frontmatter/schema/todo-format/runbook-fields)
        entry:
          bash -c 'SWEEP="$(git rev-parse --show-toplevel)/scripts/plan-hygiene/run_hygiene_sweep.sh"; [ -f "$SWEEP" ]
          || { echo "plan-hygiene sweep NOT FOUND at $SWEEP — REFUSING to commit plans/codex without the frontmatter
          gate (fail-open here shipped 3 fleet-blocking broken docs on 2026-07-17; fix the workspace layout)"; exit 1;
          }; bash "$SWEEP" --precommit'
        language: system
        files: ^(plans/|codex/)
        pass_filenames: false

  # Agent-rules size cap (CLAUDE.md / SUB_AGENT_MANDATORY_RULES.md) — the corpus-wide QG copy of
  # this check (scripts/quality_gates/check_agent_rules_size_cap.py) only ran inside the full
  # quality-gates.sh, so a commit that edits CLAUDE.md/SUB_AGENT_MANDATORY_RULES.md alongside a
  # plan/codex doc (the "pure doc/plan-flip -> prek only" carve-out) could land over the hard cap
  # with nobody catching it until the next agent ran the full gate (ao_kpi_done_vs_detail_mismatch_
  # 2026_08_05 follow-up — a 40,960-byte zero-margin cap made the very next legitimate edit from
  # ANYONE fail). Fires only when one of the two capped files is actually staged (files: below), so
  # it's a no-op for every other commit and for repos where these paths don't exist.
  - repo: local
    hooks:
      - id: agent-rules-size-cap
        name: Agent-rules size cap (CLAUDE.md / SUB_AGENT_MANDATORY_RULES.md)
        entry:
          bash -c 'CHECK="${WORKSPACE_ROOT:-$(cd "$(git rev-parse --show-toplevel)/.." &&
          pwd)}/unified-trading-pm/scripts/quality_gates/check_agent_rules_size_cap.py"; [ -f "$CHECK" ] || exit 0;
          python3 "$CHECK"'
        language: system
        files: ^cursor-configs/(CLAUDE|SUB_AGENT_MANDATORY_RULES)\.md$
        pass_filenames: false

  # Ruff - Python linter/formatter for scripts
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        name: Lint with Ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: Format with Ruff

  # Prettier - TypeScript/JSON/Markdown/YAML formatter (auto-stage wrapper).
  # Wrapper replaces upstream mirrors-prettier because that hook aborts the commit
  # when it reformats anything, forcing a manual re-stage + re-commit loop. The
  # wrapper runs prettier --write then re-stages the SUBSET of input files that
  # were already in the index (never touches foreign-dirty files held by other
  # parallel slots). SSOT: scripts/hooks/prettier-autostage.sh.
  - repo: local
    hooks:
      - id: prettier-autostage
        name: Format with Prettier (auto-stage)
        entry:
          bash -c 'HOOK="${WORKSPACE_ROOT:-$(cd "$(git rev-parse --show-toplevel)/.." &&
          pwd)}/unified-trading-pm/scripts/hooks/prettier-autostage.sh"; [ -f "$HOOK" ] || exit 0; bash "$HOOK" "$@"' --
        language: system
        types_or: [ts, tsx, javascript, jsx, json, markdown, yaml]
        # require_serial (HARD, 2026-08-06): this hook runs `git add` internally to
        # auto-restage files prettier reformats. Without require_serial, prek/pre-commit
        # splits a large changed-file set into multiple PARALLEL batch invocations of this
        # same hook, each racing on the same repo's .git/index.lock — confirmed reproduction:
        # a 131-file commit deterministically hit `fatal: Unable to create '.git/index.lock':
        # File exists` across 10+ consecutive retry attempts, never converging. One serial
        # invocation eliminates the race entirely (this hook already loops over all its own
        # input files internally, so serial execution costs nothing but a bit of wall time).
        require_serial: true

  # Secret scanning — gitleaks (catches GCP SA keys, GitHub PATs, API keys)
  # Config SSOT: unified-trading-pm/.gitleaks.toml (this repo IS the SSOT)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.27.2
    hooks:
      - id: gitleaks
        name: Detect secrets with gitleaks
        args: ["--config", ".gitleaks.toml"]

  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
