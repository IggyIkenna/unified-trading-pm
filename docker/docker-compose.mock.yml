# Mock infrastructure for local development and CI
# All services run with CLOUD_MOCK_MODE=true and CLOUD_PROVIDER=local
# No credentials required.
#
# Usage:
#   docker compose -f docker-compose.mock.yml up                   # all default services
#   docker compose -f docker-compose.mock.yml --profile v1 up -d  # SIT deployment-tests (v1 services)
#   docker compose -f docker-compose.mock.yml --profile gcp-emulators up -d  # GCP emulators only
#
# Profile overview:
#   services      — for local dev (default service set)
#   v1            — for SIT deployment-tests in CI; includes all mock services and GCP emulators
#                   smoke-test-gate.yml runs with --profile v1; only >=1.0.0 repos land on staging
#                   (enforced by staging-version-gate.yml), so all v1-profiled services are v1+ by design
#   gcp-emulators — Pub/Sub, GCS, BigQuery emulators only
#
# GCP Emulators:
#   Pub/Sub: gcr.io/google.com/cloudsdktool/google-cloud-cli on port 8085
#   GCS: fsouza/fake-gcs-server on port 4443
#   BigQuery: ghcr.io/goccy/bigquery-emulator on port 9050

version: "3.9"

x-mock-env: &mock-env
  CLOUD_PROVIDER: local
  CLOUD_MOCK_MODE: "true"
  LOG_LEVEL: INFO

services:
  # ─── GCP Emulators (optional) ───────────────────────────────────────────────
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:latest
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=mock-project
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["gcp-emulators", "v1"]

  gcs-emulator:
    image: fsouza/fake-gcs-server:latest
    ports:
      - "4443:4443"
    command: -scheme http -port 4443
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4443/storage/v1/b"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["gcp-emulators", "v1"]

  bigquery-emulator:
    image: ghcr.io/goccy/bigquery-emulator:latest
    ports:
      - "9050:9050"
      - "9060:9060"
    command: --project=mock-project --dataset=trading_analytics
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9050/discovery/v1/apis/bigquery/v2/rest"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["gcp-emulators", "v1"]

  # ─── T2 Core Services (local-dev `services` profile only) ───────────────────
  # NOTE (2026-06-07): these are EXCLUDED from the `v1` profile that the SIT
  # deployment-tests run (`docker compose --profile v1 up`). The SIT CI cannot build
  # these images: their Dockerfiles `FROM` the PRIVATE Artifact Registry base
  # (asia-northeast1-docker.pkg.dev/${PROJECT_ID}/unified-trading-library/...:latest)
  # and the deployment-tests job has no docker/GCP registry auth, so `up` fell back to
  # pulling the nonexistent `unified-trading/*:mock` tags → `pull access denied` → the
  # whole stack failed to start → every deployment_test failed → the v0.2.0 cascade SIT
  # never dispatched staging-validated. The deployment_test suite (tests/smoke/) targets
  # the GCP EMULATORS (pubsub/gcs/bigquery) and skips gracefully when a service container
  # is absent — it does not connect to :8001/:8002 — so `--profile v1` = emulators-only is
  # the functional CI stack. `market-data-service` was also REMOVED outright: the repo was
  # consolidated into `market-tick-data-service`, so its build context never existed.
  # Follow-up (to restore service-container integration testing): wire GCP Artifact Registry
  # auth (google-github-actions/auth + configure-docker + PROJECT_ID + pip.conf) into the SIT
  # deployment-tests job, then re-add the current services to the `v1` profile.
  # Tracked: plans/active/issues/sit_uac_orphan_cap_stale_consumer_list_2026_06_07.md
  execution-service:
    image: unified-trading/execution-service:mock
    build:
      context: ../../execution-service
      dockerfile: Dockerfile
    environment:
      <<: *mock-env
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
    ports:
      - "8002:8000"
    depends_on:
      pubsub-emulator:
        condition: service_healthy
        required: false
    profiles: ["services"]

  # trading-analytics-api removed 2026-03: repo archived under workspace-root archive/.
  # Domain routes live on unified-trading-api (local dev: port 8030, see ui-api-mapping.json).
