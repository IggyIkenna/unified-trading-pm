# Mock infrastructure for local development and CI
# All services run with CLOUD_MOCK_MODE=true and CLOUD_PROVIDER=local
# No credentials required.
#
# Usage:
#   docker compose -f docker-compose.mock.yml up                   # all default services
#   docker compose -f docker-compose.mock.yml --profile v1 up -d  # SIT deployment-tests (v1 services)
#   docker compose -f docker-compose.mock.yml --profile gcp-emulators up -d  # GCP emulators only
#
# Profile overview:
#   services      — for local dev (default service set)
#   v1            — for SIT deployment-tests in CI; includes all mock services and GCP emulators
#                   smoke-test-gate.yml runs with --profile v1; only >=1.0.0 repos land on staging
#                   (enforced by staging-version-gate.yml), so all v1-profiled services are v1+ by design
#   gcp-emulators — Pub/Sub, GCS, BigQuery emulators only
#
# GCP Emulators:
#   Pub/Sub: gcr.io/google.com/cloudsdktool/google-cloud-cli on port 8085
#   GCS: fsouza/fake-gcs-server on port 4443
#   BigQuery: ghcr.io/goccy/bigquery-emulator on port 9050

version: "3.9"

x-mock-env: &mock-env
  CLOUD_PROVIDER: local
  CLOUD_MOCK_MODE: "true"
  LOG_LEVEL: INFO

services:
  # ─── GCP Emulators (optional) ───────────────────────────────────────────────
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:latest
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=mock-project
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["gcp-emulators", "v1"]

  gcs-emulator:
    image: fsouza/fake-gcs-server:latest
    ports:
      - "4443:4443"
    command: -scheme http -port 4443
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4443/storage/v1/b"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["gcp-emulators", "v1"]

  bigquery-emulator:
    image: ghcr.io/goccy/bigquery-emulator:latest
    ports:
      - "9050:9050"
      - "9060:9060"
    command: --project=mock-project --dataset=trading_analytics
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9050/discovery/v1/apis/bigquery/v2/rest"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["gcp-emulators", "v1"]

  # ─── T2 Core Services ────────────────────────────────────────────────────────
  market-data-service:
    image: unified-trading/market-data-service:mock
    build:
      context: ../../market-data-service
      dockerfile: Dockerfile
    environment:
      <<: *mock-env
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      STORAGE_EMULATOR_HOST: http://gcs-emulator:4443
    ports:
      - "8001:8000"
    depends_on:
      pubsub-emulator:
        condition: service_healthy
        required: false
    profiles: ["services", "v1"]

  execution-service:
    image: unified-trading/execution-service:mock
    build:
      context: ../../execution-service
      dockerfile: Dockerfile
    environment:
      <<: *mock-env
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
    ports:
      - "8002:8000"
    depends_on:
      pubsub-emulator:
        condition: service_healthy
        required: false
    profiles: ["services", "v1"]

  # trading-analytics-api removed 2026-03: repo archived under workspace-root archive/.
  # Domain routes live on unified-trading-api (local dev: port 8030, see ui-api-mapping.json).
