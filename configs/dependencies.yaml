services:
  instruments-service:
    description: Generate instrument definitions from exchange APIs
    upstream: []
    outputs:
      - name: instrument_definitions
        bucket_template: instruments-store-{category_lower}-{project_id}
        path_template: instrument_availability/by_date/day={date}/instruments.parquet
        required_dimensions:
          - category
          - date
    external_dependencies:
      - name: tardis_api
        description: CeFi exchange data
        required_for:
          - CEFI
      - name: databento_api
        description: TradFi market data
        required_for:
          - TRADFI
      - name: the_graph_api
        description: DeFi protocol data
        required_for:
          - DEFI
      - name: polymarket_gamma_api
        description: Polymarket prediction market metadata (no auth)
        required_for:
          - PREDICTION
      - name: kalshi_api
        description: Kalshi prediction market metadata
        required_for:
          - PREDICTION
      - name: api_football_api
        description: API-Football for fixtures, teams, injuries, standings
        required_for:
          - SPORTS
      - name: footystats_api
        description: FootyStats for advanced stats
        required_for:
          - SPORTS
      - name: transfermarkt_api
        description: Transfermarkt for transfers, player values
        required_for:
          - SPORTS
  # Upstream: required=true = must have; required=false = optional deployment flexibility (can_use).
  corporate-actions:
    description: Corporate actions for TradFi equities (dividends, splits, earnings)
    upstream:
      - service: instruments-service
        required: true
        description: Needs TRADFI instrument definitions to derive equity tickers
        check:
          bucket_template: instruments-store-{category_lower}-{project_id}
          path_template: instrument_availability/by_date/day={date}/instruments.parquet
        categories:
          - TRADFI
    outputs:
      - name: corporate_actions
        bucket_template: instruments-store-{category_lower}-{project_id}
        path_template: corporate_actions/by_date/day={date}/
        required_dimensions:
          - category
          - date
    external_dependencies:
      - name: yfinance_api
        description: Equity corporate actions (dividends, splits, earnings)
        required_for:
          - TRADFI
  market-tick-data-service:
    description: Download raw tick data from exchanges
    upstream:
      - service: instruments-service
        required: true
        description: Needs instrument definitions to know what to download
        check:
          bucket_template: instruments-store-{category_lower}-{project_id}
          path_template: instrument_availability/by_date/day={date}/instruments.parquet
    outputs:
      - name: raw_tick_data
        bucket_template: market-data-tick-{category_lower}-{project_id}
        path_template: raw_tick_data/by_date/day={date}/data_type={data_type}/instrument_type={asset_class}/venue={venue}/{instrument}.parquet
        required_dimensions:
          - category
          - venue
          - data_type
          - date
    external_dependencies:
      - name: tardis_api
        description: CeFi tick data
        required_for:
          - CEFI
      - name: databento_api
        description: TradFi tick data
        required_for:
          - TRADFI
      - name: protocol_apis
        description: DeFi protocol APIs
        required_for:
          - DEFI
      - name: polymarket_data_api
        description: Polymarket CLOB + Data API trade fills (no auth)
        required_for:
          - PREDICTION
      - name: kalshi_api
        description: Kalshi trade data
        required_for:
          - PREDICTION
      - name: odds_api
        description: Cross-bookmaker odds aggregation for sports
        required_for:
          - SPORTS
  market-data-processing-service:
    description: Process raw tick data into candles
    upstream:
      - service: market-tick-data-service
        required: true
        description: Needs raw tick data to aggregate
        check:
          bucket_template: market-data-tick-{category_lower}-{project_id}
          path_template: raw_tick_data/by_date/day={date}/
      - service: instruments-service
        required: true
        description: Needs instrument definitions for trading hours (TradFi market schedule)
        check:
          bucket_template: instruments-store-{category_lower}-{project_id}
          path_template: instrument_availability/by_date/day={date}/instruments.parquet
    outputs:
      - name: processed_candles
        bucket_template: market-data-tick-{category_lower}-{project_id}
        path_template: processed_candles/by_date/day={date}/timeframe={timeframe}/data_type={data_type}/{asset_class}/{instrument}.parquet
        required_dimensions:
          - category
          - timeframe
          - date
      # NOTE: separate `candles` data-source block retired 2026-04-18.
      # MDPS output is co-located under market-data-tick-{category}-* in the
      # `processed_candles/` subprefix above. The standalone
      # market-data-candles-* buckets were empty shells; see
      # unified-trading-pm/plans/active/data_pipeline_completion_2026_04_18.plan.md Phase 5a.
    external_dependencies: []
  features-calendar-service:
    description: Generate calendar and temporal features (batch service)
    upstream: []
    outputs:
      - name: temporal_features
        bucket_template: features-calendar-{project_id}
        path_template: calendar/category=temporal/by_date/day={date}/features.parquet
        required_dimensions:
          - date
      - name: scheduled_events
        bucket_template: features-calendar-{project_id}
        path_template: calendar/category=scheduled_events/by_date/day={date}/events.parquet
        required_dimensions:
          - date
      - name: event_actuals
        bucket_template: features-calendar-{project_id}
        path_template: calendar/category=event_actuals/by_date/day={date}/actuals.parquet
        required_dimensions:
          - date
    is_library: false
    external_dependencies:
      - name: fred_api
        description: FRED API for economic actuals (NFP, CPI, GDP, Jobless Claims)
        required_for:
          - CEFI
          - TRADFI
        status: TODO - requires FRED_API_KEY
      - name: earnings_api
        description: Earnings data provider (Alpha Vantage, Polygon.io, or Financial Modeling Prep)
        required_for:
          - TRADFI
        status: TODO - requires API key from chosen provider
  features-delta-one-service:
    description: Generate delta-one features (technical indicators, momentum, etc.)
    upstream:
      - service: market-data-processing-service
        required: true
        description: Needs processed candles
        check:
          bucket_template: market-data-tick-{category_lower}-{project_id}
          path_template: processed_candles/by_date/day={date}/
      - service: features-calendar-service
        required: true
        description: Reads pre-computed calendar features from GCS (shared bucket, no category)
        check:
          bucket_template: features-calendar-{project_id}
          path_template: calendar/category=temporal/by_date/day={date}/
      - service: market-tick-data-service
        required: false
        description: Optional - deployment flexibility for alternative tick data paths
        check:
          bucket_template: market-data-tick-{category_lower}-{project_id}
          path_template: raw_tick_data/by_date/day={date}/
    outputs:
      - name: delta_one_features
        bucket_template: features-delta-one-{category_lower}-{project_id}
        path_template: by_date/day={date}/feature_group={feature_group}/timeframe={timeframe}/{instrument}.parquet
        required_dimensions:
          - category
          - feature_group
          - timeframe
          - date
    external_dependencies: []
  features-volatility-service:
    description: Generate volatility features (IV, term structure, etc.)
    upstream:
      - service: market-tick-data-service
        required: true
        description: Reads raw options/futures chain data directly
        check:
          bucket_template: market-data-tick-{category_lower}-{project_id}
          path_template: raw_tick_data/by_date/day={date}/data_type=options_chain/
      - service: market-data-processing-service
        required: false
        description: Optional - deployment flexibility for candle-based volatility
        check:
          bucket_template: market-data-tick-{category_lower}-{project_id}
          path_template: processed_candles/by_date/day={date}/
      - service: features-calendar-service
        required: false
        description: Optional - deployment flexibility for calendar features
        check:
          bucket_template: features-calendar-{project_id}
          path_template: calendar/category=temporal/by_date/day={date}/
    outputs:
      - name: volatility_features
        bucket_template: features-volatility-{category_lower}-{project_id}
        path_template: by_date/day={date}/feature_group={feature_group}/timeframe={timeframe}/{underlying}.parquet
        required_dimensions:
          - category
          - feature_group
          - timeframe
          - date
    external_dependencies: []
  features-onchain-service:
    description: Generate on-chain features (TVL, sentiment, etc.)
    upstream:
      - service: market-data-processing-service
        required: true
        description: Needs processed DeFi candles
        check:
          bucket_template: market-data-tick-{category_lower}-{project_id}
          path_template: processed_candles/by_date/day={date}/
        categories:
          - CEFI
          - DEFI
      - service: features-calendar-service
        required: false
        description: Optional - deployment flexibility for calendar features
        check:
          bucket_template: features-calendar-{project_id}
          path_template: calendar/category=temporal/by_date/day={date}/
      - service: market-tick-data-service
        required: false
        description: Optional - deployment flexibility for raw tick paths
        check:
          bucket_template: market-data-tick-{category_lower}-{project_id}
          path_template: raw_tick_data/by_date/day={date}/
    outputs:
      - name: onchain_features
        bucket_template: features-onchain-{category_lower}-{project_id}
        path_template: by_date/day={date}/feature_group={feature_group}/features.parquet
        required_dimensions:
          - category
          - feature_group
          - date
    external_dependencies: []
  ml-training-service:
    description: Train ML models for predictions (3-stage pipeline)
    upstream:
      - service: features-delta-one-service
        required: true
        description: Training features
        check:
          bucket_template: features-delta-one-{category_lower}-{project_id}
          path_template: by_date/day={date}/
      - service: features-volatility-service
        required: false
        description: Optional volatility features
        check:
          bucket_template: features-volatility-{category_lower}-{project_id}
          path_template: by_date/day={date}/
      - service: features-onchain-service
        required: false
        description: Optional on-chain features (shared bucket, no category)
        check:
          bucket_template: features-onchain-{category_lower}-{project_id}
          path_template: by_date/day={date}/
      - service: market-tick-data-service
        required: false
        description: Optional - deployment flexibility for tick-level features
        check:
          bucket_template: market-data-tick-{category_lower}-{project_id}
          path_template: raw_tick_data/by_date/day={date}/
      - service: features-calendar-service
        required: false
        description: Optional - deployment flexibility for calendar features
        check:
          bucket_template: features-calendar-{project_id}
          path_template: calendar/category=temporal/by_date/day={date}/
      - service: market-data-processing-service
        required: false
        description: Optional - deployment flexibility for candle-based features
        check:
          bucket_template: market-data-tick-{category_lower}-{project_id}
          path_template: processed_candles/by_date/day={date}/
    stage_dependencies:
      pre-selection:
        requires_stages: []
        outputs:
          bucket_template: ml-training-artifacts-{project_id}
          path_template: stage1-preselection/model-{model_id}/training-period-{period}/selected_features.json
      hyperparameter-grid:
        requires_stages:
          - pre-selection
        inputs:
          bucket_template: ml-training-artifacts-{project_id}
          path_template: stage1-preselection/model-{model_id}/training-period-{period}/selected_features.json
        outputs:
          bucket_template: ml-training-artifacts-{project_id}
          path_template: stage2-hyperparams/model-{model_id}/training-period-{period}/best_hyperparams.json
      final-training:
        requires_stages:
          - hyperparameter-grid
          - pre-selection
        inputs:
          bucket_template: ml-training-artifacts-{project_id}
          path_templates:
            - stage1-preselection/model-{model_id}/training-period-{period}/selected_features.json
            - stage2-hyperparams/model-{model_id}/training-period-{period}/best_hyperparams.json
        outputs:
          bucket_template: ml-models-store-{project_id}
          path_template: models/{model_id}/training-period-{period}/model.joblib
    outputs:
      - name: trained_models
        bucket_template: ml-models-store-{project_id}
        path_template: models/{model_id}/{version}/model.joblib
        required_dimensions:
          - instrument
          - timeframe
          - target_type
      - name: model_registry
        bucket_template: ml-models-store-{project_id}
        path_template: model_registry/metadata/{model_id}/{version}/metadata.json
    external_dependencies: []
  ml-inference-service:
    description: Generate ML predictions
    upstream:
      - service: ml-training-service
        required: true
        description: Needs trained models
        check:
          bucket_template: ml-models-store-{project_id}
          path_template: model_registry/
      - service: features-delta-one-service
        required: true
        description: Real-time features for inference
        check:
          bucket_template: features-delta-one-{category_lower}-{project_id}
          path_template: by_date/day={date}/
      - service: features-calendar-service
        required: false
        description: Optional - deployment flexibility for calendar features
        check:
          bucket_template: features-calendar-{project_id}
          path_template: calendar/category=temporal/by_date/day={date}/
      - service: features-volatility-service
        required: false
        description: Optional - deployment flexibility for volatility features
        check:
          bucket_template: features-volatility-{category_lower}-{project_id}
          path_template: by_date/day={date}/
      - service: features-onchain-service
        required: false
        description: Optional - deployment flexibility for on-chain features
        check:
          bucket_template: features-onchain-{category_lower}-{project_id}
          path_template: by_date/day={date}/
    outputs:
      - name: predictions
        bucket_template: ml-predictions-store-{project_id}
        path_template: predictions/{mode}/{date}/
        required_dimensions:
          - mode
          - instrument
          - date
    external_dependencies: []
  features-cross-instrument-service:
    description: Cross-instrument features for prediction markets (correlation, relative value)
    upstream:
      - service: features-delta-one-service
        required: true
        description: Needs base features for cross-instrument analysis
        check:
          bucket_template: features-delta-one-{category_lower}-{project_id}
          path_template: by_date/day={date}/
    outputs:
      - name: cross_instrument_features
        bucket_template: features-cross-instrument-{category_lower}-{project_id}
        path_template: by_date/day={date}/feature_group={feature_group}/features.parquet
        required_dimensions:
          - category
          - feature_group
          - date
    external_dependencies: []
  strategy-service:
    description: Test trading signals and strategy logic
    upstream:
      - service: ml-inference-service
        required: false
        description: ML predictions for ML-driven strategies
        check:
          bucket_template: ml-predictions-store-{project_id}
          path_template: predictions/
      - service: features-delta-one-service
        required: true
        description: Features for strategy logic
        check:
          bucket_template: features-delta-one-{category_lower}-{project_id}
          path_template: by_date/day={date}/
      - service: instruments-service
        required: true
        description: Instrument definitions
        check:
          bucket_template: instruments-store-{category_lower}-{project_id}
          path_template: instrument_availability/by_date/day={date}/
      - service: market-data-processing-service
        required: false
        description: Optional - deployment flexibility for candle-based features
        check:
          bucket_template: market-data-tick-{category_lower}-{project_id}
          path_template: processed_candles/by_date/day={date}/
      - service: features-volatility-service
        required: false
        description: Optional - deployment flexibility for volatility features
        check:
          bucket_template: features-volatility-{category_lower}-{project_id}
          path_template: by_date/day={date}/
      - service: features-onchain-service
        required: false
        description: Optional - deployment flexibility for on-chain features
        check:
          bucket_template: features-onchain-{category_lower}-{project_id}
          path_template: by_date/day={date}/
      - service: market-tick-data-service
        required: false
        description: Optional - deployment flexibility for tick-level features
        check:
          bucket_template: market-data-tick-{category_lower}-{project_id}
          path_template: raw_tick_data/by_date/day={date}/
      - service: features-calendar-service
        required: false
        description: Optional - deployment flexibility for calendar features
        check:
          bucket_template: features-calendar-{project_id}
          path_template: calendar/category=temporal/by_date/day={date}/
      - service: risk-and-exposure-service
        required: false
        description: Optional - deployment flexibility for pre-trade risk checks (talks to strategy)
        check:
          bucket_template: risk-store-{project_id}-{category_lower}
          path_template: risk/{venue}/{date}/
      - service: position-balance-monitor-service
        required: false
        description: Optional - deployment flexibility for position queries
        check:
          bucket_template: positions-store-{project_id}-{category_lower}
          path_template: positions/{venue}/{date}/
    outputs:
      - name: strategy_instructions
        bucket_template: strategy-store-{category_lower}-{project_id}
        path_template: strategy_instructions/strategy_id={strategy_id}/day={date}/instructions.parquet
        required_dimensions:
          - strategy_id
          - date
      - name: backtest_results
        bucket_template: strategy-store-{category_lower}-{project_id}
        path_template: backtest_results/{strategy_id}/{run_id}/
    external_dependencies: []
  execution-service:
    description: Backtest execution on tick-level data
    upstream:
      - service: strategy-service
        required: true
        description: Strategy instructions to execute
        check:
          bucket_template: strategy-store-{category_lower}-{project_id}
          path_template: strategy_instructions/strategy_id={strategy_id}/day={date}/instructions.parquet
      - service: market-tick-data-service
        required: true
        description: Tick data for execution simulation
        check:
          bucket_template: market-data-tick-{category_lower}-{project_id}
          path_template: raw_tick_data/by_date/day={date}/data_type=trades/{instrument_type}/
      - service: instruments-service
        required: true
        description: Instrument definitions for trading hours, precision, etc.
        check:
          bucket_template: instruments-store-{category_lower}-{project_id}
          path_template: instrument_availability/by_date/day={date}/instruments.parquet
      - service: features-delta-one-service
        required: false
        description: Optional - deployment flexibility for feature-based execution
        check:
          bucket_template: features-delta-one-{category_lower}-{project_id}
          path_template: by_date/day={date}/
      - service: features-calendar-service
        required: false
        description: Optional - deployment flexibility for calendar features
        check:
          bucket_template: features-calendar-{project_id}
          path_template: calendar/category=temporal/by_date/day={date}/
    inputs:
      - name: execution_config
        bucket_template: execution-store-{category_lower}-{project_id}
        path_template: configs/V{version}/{strategy_base}/{mode}/{timeframe}/{config_filename}.json
        required: true
        description: Execution config specifying strategy, instruments, and algorithms
    outputs:
      - name: execution_results
        bucket_template: execution-store-{category_lower}-{project_id}
        path_template: results/date={date}/strategy_id={strategy_id}/instruction_type={instruction_type}/run_id={run_id}/
        required_dimensions:
          - strategy_id
          - config
          - date
          - instruction_type
    external_dependencies: []
  position-balance-monitor-service:
    upstream:
      - execution-service
      - instruments-service
    description: Monitor and reconcile positions from execution fills
    inputs:
      - name: execution_fills
        bucket_template: execution-store-{project_id}
        path_template: results/date={date}/strategy_id=*/instruction_type=*/run_id=*/positions.parquet
        required: true
        description: Position data from execution-service (execution writes positions, not just fills)
      - name: execution_positions
        bucket_template: execution-store-{project_id}
        path_template: results/date={date}/strategy_id={strategy_id}/instruction_type={instruction_type}/run_id={run_id}/positions.parquet
        required: true
        description: Position snapshots from execution-service backtest engine
      - name: instruments
        bucket_template: instruments-store-{category_lower}-{project_id}
        path_template: instrument_availability/by_date/day={date}/instruments.parquet
        required: true
        description: Instrument definitions for position normalization
    outputs:
      - name: reconciled_positions
        bucket_template: positions-store-{project_id}
        path_template: by_date/day={date}/account={account_key}/snapshot_type={snapshot_type}/positions.parquet
        required_dimensions:
          - date
          - account_key
          - snapshot_type
        description: Hive-partitioned positions by date and account (venue_client_accounttype)
      - name: reconciliation_snapshots
        bucket_template: positions-store-{project_id}
        path_template: reconciliation/by_date/day={date}/account={account_key}/snapshots.parquet
        required_dimensions:
          - date
          - account_key
        description: Reconciliation results comparing internal vs exchange positions
    external_dependencies: []
  risk-and-exposure-service:
    upstream:
      - service: position-balance-monitor-service
        required: true
        description: Reconciled positions for risk calculation
        check:
          bucket_template: positions-store-{project_id}-{category_lower}
          path_template: positions/{venue}/{date}/
      - service: market-data-processing-service
        required: true
        description: Market prices for mark-to-market risk
        check:
          bucket_template: market-data-tick-{category_lower}-{project_id}
          path_template: processed_candles/by_date/day={date}/
      - service: pnl-attribution-service
        required: false
        description: Optional - deployment flexibility for P&L-based risk attribution
        check:
          bucket_template: pnl-store-{project_id}-{category_lower}
          path_template: pnl/{venue}/{date}/
    description:
      Calculate risk metrics and exposure limits from positions and market data. Does NOT execute orders - talks to
      strategy-service for risk management.
    inputs:
      - name: reconciled_positions
        bucket_template: positions-store-{project_id}-{category_lower}
        path_template: positions/{venue}/{date}/positions_*.parquet
        required: true
        description: Reconciled positions from position-balance-monitor-service
      - name: processed_candles
        bucket_template: market-data-tick-{category_lower}-{project_id}
        path_template: by_date/day={date}/data_type=tbbo/instrument_type=*/venue={venue}/*.parquet
        required: true
        description: Market prices for mark-to-market risk calculations
    outputs:
      - name: risk_metrics
        bucket_template: risk-store-{project_id}-{category_lower}
        path_template: risk/{venue}/{date}/risk_metrics_*.parquet
        required_dimensions:
          - category
          - venue
          - date
    external_dependencies: []
  pnl-attribution-service:
    upstream:
      - position-balance-monitor-service
      - market-data-processing-service
      - instruments-service
    description: Calculate P&L attribution from positions and market prices
    inputs:
      - name: positions
        bucket_template: positions-store-{project_id}-{category_lower}
        path_template: positions/{venue}/{date}/positions_*.parquet
        required: true
        description: Position data for P&L calculation
      - name: mark_prices
        bucket_template: market-data-tick-{category_lower}-{project_id}
        path_template: by_date/day={date}/data_type=tbbo/instrument_type=*/venue={venue}/*.parquet
        required: true
        description: Mark prices for mark-to-market P&L
      - name: instruments
        bucket_template: instruments-store-{project_id}
        path_template: instruments/{category}/{venue}/{date}/instruments_*.parquet
        required: true
        description: Instrument metadata for P&L calculations
    outputs:
      - name: pnl_attribution
        bucket_template: pnl-store-{project_id}-{category_lower}
        path_template: pnl/{client_id}/{date}/pnl_attribution_*.parquet
        required_dimensions:
          - category
          - client_id
          - date
    external_dependencies: []
  features-sports-service:
    description: >-
      Pre-match ML features for sports (team form, H2H, referee, venue, weather, market odds). Post-commercialization
      service — not part of financial markets MVP.
    upstream:
      - service: instruments-service
        required: true
        description: Needs fixture calendar, team rosters, injuries, standings from GCS
        check:
          bucket_template: instruments-store-sports-{project_id}
          path_template: sports_reference/by_date/day={date}/
        categories:
          - SPORTS
      - service: market-tick-data-service
        required: true
        description: Needs odds data (Odds API) from GCS for odds-based features
        check:
          bucket_template: market-data-tick-sports-{project_id}
          path_template: raw_tick_data/by_date/day={date}/
        categories:
          - SPORTS
    outputs:
      - name: sports_features
        bucket_template: features-sports-{project_id}
        path_template: by_date/day={date}/league={league}/feature_group={feature_group}/features.parquet
        required_dimensions:
          - league
          - feature_group
          - date
    external_dependencies:
      - name: api_football_api
        description: API-Football (api-sports.io) for fixture data, team stats, lineups
        required_for:
          - SPORTS
      - name: footystats_api
        description: FootyStats for xG data, advanced stats, weather
        required_for:
          - SPORTS
      - name: odds_api
        description: The Odds API for cross-bookmaker odds aggregation
        required_for:
          - SPORTS
      - name: open_meteo_api
        description: Open-Meteo for weather forecasts (optional — free tier available)
        required_for: []
      - name: soccer_football_info_api
        description: Soccer-Football-Info for referee data, additional stats
        required_for:
          - SPORTS
  alerting-service:
    description: >-
      Alert routing, deduplication, cooldown, and delivery to PagerDuty, Telegram, Slack. Shared service — not
      per-category. Persists alert history and cooldown state to GCS.
    upstream: []
    outputs:
      - name: alert_history
        bucket_template: alerting-service-{project_id}
        path_template: alerting/history/date={date}/
        required_dimensions:
          - date
    external_dependencies: []

  batch-live-reconciliation-service:
    description: >-
      T+1 batch vs live reconciliation. Polls GCS for upstream data availability, compares batch and live outputs.
    upstream:
      - service: execution-service
        required: true
        description: Needs execution results to reconcile
      - service: strategy-service
        required: true
        description: Needs strategy outputs to compare batch vs live
      - service: ml-inference-service
        required: false
        description: Optional — ML predictions for quality comparison
    outputs:
      - name: reconciliation_results
        bucket_template: reconciliation-store-{project_id}
        path_template: recon/date={date}/
        required_dimensions:
          - date
    external_dependencies: []
  features-multi-timeframe-service:
    description: Multi-timeframe features (cross-timeframe momentum, divergence, regime detection)
    upstream:
      - service: market-data-processing-service
        required: true
        description: Needs processed candles at multiple timeframes
        check:
          bucket_template: market-data-tick-{category_lower}-{project_id}
          path_template: processed_candles/by_date/day={date}/
      - service: features-delta-one-service
        required: false
        description: Optional — base features for multi-timeframe aggregation
        check:
          bucket_template: features-delta-one-{category_lower}-{project_id}
          path_template: by_date/day={date}/
    outputs:
      - name: multi_timeframe_features
        bucket_template: features-multi-timeframe-{category_lower}-{project_id}
        path_template: by_date/day={date}/feature_group={feature_group}/features.parquet
        required_dimensions:
          - category
          - feature_group
          - date
    external_dependencies: []
  features-commodity-service:
    description: Commodity-specific features (term structure, roll yield, seasonality, weather impact)
    upstream:
      - service: market-data-processing-service
        required: true
        description: Needs processed candles for commodity instruments
        check:
          bucket_template: market-data-tick-{category_lower}-{project_id}
          path_template: processed_candles/by_date/day={date}/
      - service: features-calendar-service
        required: false
        description: Optional — calendar features for seasonality
        check:
          bucket_template: features-calendar-{project_id}
          path_template: calendar/category=temporal/by_date/day={date}/
    outputs:
      - name: commodity_features
        bucket_template: features-commodity-{category_lower}-{project_id}
        path_template: by_date/day={date}/feature_group={feature_group}/features.parquet
        required_dimensions:
          - category
          - feature_group
          - date
    external_dependencies: []

