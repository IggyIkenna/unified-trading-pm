# Cloud Build Template — Unified Trading System Infrastructure (Wheel + Terraform Image)
#
# For infrastructure repos with Python client package + Terraform (e.g. ibkr-gateway-infra).
# Builds: wheel to unified-libraries, Terraform runner image to unified-trading-system.
#
# Placeholders: {{PKG_NAME}}, {{TERRAFORM_DIR}}, {{TERRAFORM_IMAGE_NAME}}.
# {{PKG_NAME}} = Python package (underscores, e.g. ibkr_gateway_client).
# {{TERRAFORM_DIR}} = Terraform module directory (e.g. ibkr-gateway).
# {{TERRAFORM_IMAGE_NAME}} = Docker image name for Terraform runner (e.g. ibkr-gateway-terraform).
#
# Generated from PM template. Rollout: rollout-cloudbuild.py
#
# Required steps:
#   - auth-precheck   (GCP token, Python AR, Docker AR)
#   - ensure-repo     (unified-libraries, unified-trading-system)
#   - lint            (ruff)
#   - run-tests       (pytest)
#   - terraform-validate
#   - build-wheel     (python -m build --wheel)
#   - publish-python  (twine upload)
#   - build-terraform-image (Docker build)
#   - push-terraform-image
#   - scan-check      (CVE scan on deps)

substitutions:
  _PKG_NAME: "{{PKG_NAME}}"
  _TERRAFORM_DIR: "{{TERRAFORM_DIR}}"
  _TERRAFORM_IMAGE_NAME: "{{TERRAFORM_IMAGE_NAME}}"

steps:
  # ── Auth pre-check ─
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:alpine"
    id: "auth-precheck"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        echo "=== Auth pre-check ==="
        TOKEN=$$(gcloud auth print-access-token) || { echo "FAIL: No GCP token"; exit 1; }
        echo "GCP token OK"
        STATUS=$$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $$TOKEN" "https://asia-northeast1-python.pkg.dev/$PROJECT_ID/unified-libraries/simple/" || echo "000")
        if [ "$$STATUS" != "200" ] && [ "$$STATUS" != "404" ]; then
          echo "FAIL: Python AR HTTP $$STATUS"; exit 1
        fi
        echo "Python AR OK"
        gcloud artifacts repositories describe unified-trading-system --location=asia-northeast1 --quiet || { echo "FAIL: Docker AR"; exit 1; }
        echo "Docker AR OK"
        echo "=== Auth pre-check passed ==="
    waitFor: ["-"]

  - name: "gcr.io/cloud-builders/gcloud"
    id: "ensure-repo"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud artifacts repositories describe unified-libraries --location=asia-northeast1 &>/dev/null || \
          gcloud artifacts repositories create unified-libraries --repository-format=python --location=asia-northeast1 --description="Unified Python libraries"
    waitFor: ["auth-precheck"]

  - name: "python:3.13-slim"
    id: "lint"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pip install uv && uv pip install --system ruff==0.15.0
        ruff check ${_PKG_NAME}/
        ruff format --check ${_PKG_NAME}/
    waitFor: ["ensure-repo"]

  - name: "python:3.13-slim"
    id: "run-tests"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pip install uv
        uv pip install --system -e .
        python -m pytest tests/ -v --tb=short \
          --cov=${_PKG_NAME} \
          --cov-fail-under=51 \
          --cov-report=xml \
          --cov-report=term-missing
    waitFor: ["lint"]

  - name: "hashicorp/terraform:1.6"
    id: "terraform-validate"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        cd ${_TERRAFORM_DIR}
        terraform init -backend=false
        terraform validate
    waitFor: ["-"]

  - name: "gcr.io/cloud-builders/gcloud"
    id: "configure-docker"
    args: ["auth", "configure-docker", "asia-northeast1-docker.pkg.dev", "--quiet"]
    waitFor: ["auth-precheck"]

  # ── Fetch tags into /workspace for setuptools-scm (wheel step) ─────────────
  # Unshallow so tagged commits are reachable for setuptools-scm (a plain tag-ref
  # fetch on a shallow clone leaves git describe unable to compute the version).
  # No-op on non-trigger builds (no /workspace/.git) — the wheel step reports any
  # real error. Forward-ported 2026-08-06 from ibkr-gateway-infra.
  - name: "gcr.io/cloud-builders/git"
    id: "fetch-tags"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        if [ ! -d /workspace/.git ]; then
          echo "fetch-tags: /workspace/.git absent (non-trigger build) — skipping (wheel step reports any real error)"
          exit 0
        fi
        GH_PAT=$$(gcloud secrets versions access latest --secret=GH_PAT --project=$PROJECT_ID 2>/dev/null || echo "")
        REMOTE="https://github.com/IggyIkenna/$REPO_NAME.git"
        [ -n "$$GH_PAT" ] && REMOTE="https://$$GH_PAT@github.com/IggyIkenna/$REPO_NAME.git"
        git -C /workspace fetch --unshallow --tags --force "$$REMOTE" "+refs/tags/*:refs/tags/*" 2>/dev/null \
          || git -C /workspace fetch --tags --force "$$REMOTE" "+refs/tags/*:refs/tags/*"
        echo "fetch-tags: $$(git -C /workspace tag --list 'v*' | wc -l | tr -d ' ') v* tags present"
    waitFor: ["run-tests"]

  - name: "python:3.13-slim"
    id: "build-wheel"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        pip install uv && uv pip install --system build
        # fetch-tags-fix: git for setuptools-scm
        command -v git >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y --no-install-recommends git; }
        git config --global --add safe.directory /workspace || true
        python -m build --wheel --outdir dist/
        ls -lh dist/
    waitFor: ["run-tests"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:alpine"
    id: "publish-python"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        apk add --no-cache python3 py3-pip
        pip3 install --break-system-packages twine keyrings.google-artifactregistry-auth
        python3 -m twine upload \
          --repository-url https://asia-northeast1-python.pkg.dev/$PROJECT_ID/unified-libraries/ \
          --non-interactive dist/*.whl
        echo "Published wheel to unified-libraries"
    waitFor: ["build-wheel"]

  - name: "gcr.io/cloud-builders/docker"
    id: "build-terraform-image"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        # FAIL-FAST on an empty image tag (guard, landed 2026-08-06). SHORT-SHA is a Cloud Build
        # built-in populated ONLY for repoSource (trigger) builds; a manual `gcloud builds submit`
        # uses a storageSource and leaves it EMPTY, so the tag becomes `<img>:` and docker dies
        # with a cryptic `invalid reference format` / exit 125. Diagnose it up front. This repo has
        # no extract-version step, so there is no VERSION fallback — an empty SHORT_SHA is
        # genuinely unresolvable.
        SAFE_SHA="$SHORT_SHA"
        if [ -z "$$SAFE_SHA" ]; then
          echo "FATAL: cannot build an image tag — SHORT_SHA is empty." >&2
          echo "  SHORT_SHA is set only for trigger (repoSource) builds; a manual" >&2
          echo "  'gcloud builds submit' must pass --substitutions SHORT_SHA=<sha>." >&2
          exit 1
        fi
        docker build -f Dockerfile.terraform \
          -t asia-northeast1-docker.pkg.dev/$PROJECT_ID/unified-trading-system/${_TERRAFORM_IMAGE_NAME}:$$SAFE_SHA \
          -t asia-northeast1-docker.pkg.dev/$PROJECT_ID/unified-trading-system/${_TERRAFORM_IMAGE_NAME}:latest \
          .
    waitFor: ["configure-docker", "terraform-validate"]

  # ── Immutable sha-tag guard (first push wins) ──────────────────────────────
  # Rebuilds of the same commit are NOT bit-reproducible, so re-pushing
  # :$SHORT_SHA re-points the git-sha tag at a different digest — silent drift
  # for anything resolving the sha tag (mutable-tag incident: deployment-api
  # 7da9baf, 2026-07-13). First push wins: if AR already has :$SHORT_SHA, keep
  # it; push only :latest. :latest stays mutable by design.
  - name: "gcr.io/cloud-builders/gcloud"
    id: "sha-tag-guard"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        IMG="asia-northeast1-docker.pkg.dev/$PROJECT_ID/unified-trading-system/${_TERRAFORM_IMAGE_NAME}:$SHORT_SHA"
        EXISTING="$$(gcloud artifacts docker images describe "$$IMG" --format='value(image_summary.digest)' 2>/dev/null || true)"
        if [ -n "$$EXISTING" ]; then
          printf '%s' "$$EXISTING" > /workspace/.sha_tag_preexists
          echo "sha-tag-guard: $$IMG already exists ($$EXISTING) — push will NOT re-stamp it"
        else
          echo "sha-tag-guard: $$IMG absent — this build's push creates it"
        fi
    waitFor: ["configure-docker"]

  - name: "gcr.io/cloud-builders/docker"
    id: "push-terraform-image"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        REPO_IMG="asia-northeast1-docker.pkg.dev/$PROJECT_ID/unified-trading-system/${_TERRAFORM_IMAGE_NAME}"
        if [ -f /workspace/.sha_tag_preexists ]; then
          echo "push: :$SHORT_SHA pre-exists (digest $$(cat /workspace/.sha_tag_preexists)) — immutable, pushing :latest only"
          docker push "$$REPO_IMG:latest"
        else
          docker push --all-tags "$$REPO_IMG"
        fi
    waitFor: ["build-terraform-image", "sha-tag-guard"]

  - name: "python:3.13-slim"
    id: "scan-check"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pip install uv --quiet
        uv pip install --system safety --quiet || { echo "WARNING: safety not available"; exit 0; }
        safety check --full-report 2>/dev/null || exit 0
        echo "Scan complete"
    waitFor: ["run-tests"]

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_MEDIUM"

timeout: "900s"
