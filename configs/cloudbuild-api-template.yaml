# Cloud Build Template — Unified Trading System API Services
#
# API variant: NO pull-base-image (APIs use slimmer base, no UTL dependency).
# Generated from PM template. Placeholders: {{SERVICE_NAME}}, {{REGISTRY_REPO}}.
#
# Required step IDs:
#   - configure-docker, ensure-repo, build, quality-gates, push, scan-check
#
# Add "# deploy-via-dispatch" after title if deploy_via_dispatch: true in manifest.
#
# Variable conventions:
#   {{SERVICE_NAME}}   — e.g. unified-trading-api or deployment-api
#   {{REGISTRY_REPO}}  — e.g. unified-trading-system

substitutions:
  _SERVICE_NAME: "{{SERVICE_NAME}}"
  _REGISTRY_REPO: "{{REGISTRY_REPO}}"
  # Branch the UI-bundling step (fetch-ui) clones deployment-ui at. Cloud Build
  # triggers set BRANCH_NAME automatically; manual `gcloud builds submit` runs
  # pass --substitutions=_BRANCH=<name>. Only deployment-api consumes it.
  _BRANCH: "live-defi-rollout"
  # Whether to actually run the in-image quality-gates step. Default false: QG is
  # already enforced at quickmerge + the quality-gates-v2 promotion gate, and the
  # in-image harness (unified-trading-pm/base-service.sh) is absent from the image,
  # so re-running it inside the build is redundant+impossible (exit 127). Deploy
  # triggers may set _RUN_INIMAGE_QG=true to keep the gate on feature/LDR builds.
  _RUN_INIMAGE_QG: "false"

steps:
  # ── Fetch deployment-ui (SPA bundle source) — deployment-api ONLY ──────────
  # deployment-api's Dockerfile Stage 0 builds the deployment-ui SPA into ./ui;
  # Cloud Build must populate ./ui before `docker build` or the COPY fails. This
  # step is a guarded NO-OP for every other api-service repo (none bundle a UI),
  # so it is safe in the shared template. Restored 2026-06-14 after a template
  # rollout dropped it (issue: deployment_api_build_broken_fetch_ui_dropped).
  - name: "gcr.io/cloud-builders/gcloud"
    id: "fetch-ui"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        if [ "${_SERVICE_NAME}" != "deployment-api" ]; then
          echo "fetch-ui: ${_SERVICE_NAME} does not bundle a UI — skipping"
          exit 0
        fi
        if [ -f ./ui/package.json ]; then
          echo "ui/ pre-bundled in build context — skipping clone"
          exit 0
        fi
        BRANCH="${_BRANCH:-${BRANCH_NAME:-live-defi-rollout}}"
        echo "Cloning deployment-ui (private) at branch=$$BRANCH (fallback main) into ./ui"
        # deployment-ui is a PRIVATE repo — auth via the GH_PAT secret (the default
        # Cloud Build SA has secretAccessor). Token is passed as an http Basic
        # extraheader (the format GitHub accepts for a PAT) so it never lands in
        # git's URL/log output.
        TOKEN="$$(gcloud secrets versions access latest --secret=GH_PAT)"
        AUTH="$$(printf 'x-access-token:%s' "$$TOKEN" | base64 | tr -d '\n')"
        git -c http.extraheader="AUTHORIZATION: basic $$AUTH" clone --depth 1 \
          --branch "$$BRANCH" https://github.com/IggyIkenna/deployment-ui ./ui \
          || git -c http.extraheader="AUTHORIZATION: basic $$AUTH" clone --depth 1 \
          --branch main https://github.com/IggyIkenna/deployment-ui ./ui
        echo "deployment-ui HEAD: $$(cd ui && git rev-parse --short HEAD)"
    waitFor: ["-"]

  # ── Auth pre-check: fail fast if SA lacks AR access ─
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:alpine"
    id: "auth-precheck"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        TOKEN=$$(gcloud auth print-access-token) || { echo "FAIL: No GCP token"; exit 1; }
        STATUS=$$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $$TOKEN" "https://asia-northeast1-python.pkg.dev/$PROJECT_ID/unified-libraries/simple/" || echo "000")
        if [ "$$STATUS" != "200" ] && [ "$$STATUS" != "404" ]; then echo "FAIL: Python AR $$STATUS"; exit 1; fi
        gcloud artifacts repositories describe unified-trading-system --location=asia-northeast1 --quiet || { echo "FAIL: Docker AR"; exit 1; }
        # Persisted for the "build" step's gar_token BuildKit secret (that step's own image,
        # gcr.io/cloud-builders/docker, has no gcloud CLI to mint its own token).
        echo "$$TOKEN" > /workspace/.gar_token
        echo "Auth pre-check passed"
    waitFor: ["-"]

  # ── STEP 1: Configure Docker authentication ───────────────────────────────
  - name: "gcr.io/cloud-builders/gcloud"
    id: "configure-docker"
    args: ["auth", "configure-docker", "asia-northeast1-docker.pkg.dev", "--quiet"]
    waitFor: ["-"]

  - name: "gcr.io/cloud-builders/gcloud"
    id: "ensure-repo"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud artifacts repositories describe ${_REGISTRY_REPO} \
          --location=asia-northeast1 &>/dev/null || \
        gcloud artifacts repositories create ${_REGISTRY_REPO} \
          --repository-format=docker \
          --location=asia-northeast1 \
          --description="${_SERVICE_NAME} Docker images"
        gcloud artifacts repositories update ${_REGISTRY_REPO} \
          --location=asia-northeast1 \
          --enable-vulnerability-scanning 2>/dev/null || true
    waitFor: ["-"]

  # ── Extract version for SCM bypass in docker build ──────────────────────
  # AUTHENTICATED --unshallow (forward-ported 2026-08-06 from client-reporting-api):
  # Cloud Build's shallow + UNAUTH clone leaves git describe unable to see the v-tag →
  # hatch-vcs `setuptools-scm was unable to detect version` inside the docker build.
  # GH_PAT (Secret Manager) authenticates the fetch; fall back to a plain
  # authenticated --tags fetch if the clone is already complete.
  - name: "gcr.io/cloud-builders/git"
    id: "extract-version"
    entrypoint: "bash"
    secretEnv: ["GH_PAT"]
    args:
      - "-c"
      - |
        git fetch "https://$$GH_PAT@github.com/IggyIkenna/{{SERVICE_NAME}}.git" --unshallow --tags --force 2>/dev/null \
          || git fetch "https://$$GH_PAT@github.com/IggyIkenna/{{SERVICE_NAME}}.git" --tags --force 2>/dev/null \
          || true
        VERSION=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed 's/^v//')
        if [ -z "$$VERSION" ]; then
          VERSION=$(git tag --list 'v[0-9]*' --sort=-v:refname 2>/dev/null | head -1 | sed 's/^v//')
        fi
        if [ -z "$$VERSION" ]; then
          VERSION=$(grep '^version' pyproject.toml 2>/dev/null | head -1 | sed 's/version = "//;s/"//')
        fi
        if [ -z "$$VERSION" ]; then
          # PEP440-VALID *and* docker-tag-safe fallback. VERSION is reused as a docker -t
          # image tag in several steps, so a `+local` segment is INVALID (docker tag chars).
          # 0.0.0.dev0 is both a valid PEP440 version (hatch-vcs accepts it) and a valid
          # docker tag.
          VERSION="0.0.0.dev0"
        fi
        echo "$$VERSION" > /workspace/VERSION
        echo "Building version $$VERSION"
    waitFor: ["-"]

  # ── Pull base image (digest-aware) — required for an authenticated FROM ────
  # When the Dockerfile pins `ARG BASE_IMAGE_DIGEST=sha256:<64-hex>` and its base
  # FROM is the UTL image (deployment-api does), pre-pull THAT digest with the
  # authenticated CLI so the in-build FROM @${...} hits the local cache instead
  # of an UNAUTHENTICATED daemon-side registry pull → "denied" (mtds incident
  # 2026-06-10). Harmless for api repos that don't pin / don't use the UTL base:
  # PIN is empty → only the best-effort `:latest || true` runs.
  - name: "gcr.io/cloud-builders/docker"
    id: "pull-base-image"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        BASE="asia-northeast1-docker.pkg.dev/$PROJECT_ID/unified-trading-library/unified-trading-library"
        PIN=$$(sed -n 's/^ARG BASE_IMAGE_DIGEST=\(sha256:[0-9a-f]\{64\}\).*/\1/p' Dockerfile | head -1 || true)
        if [ -n "$$PIN" ]; then
          echo "pinned base digest: $$PIN — pre-pulling the PINNED manifest"
          docker pull "$${BASE}@$${PIN}"
        fi
        docker pull "$${BASE}:latest" || true
    waitFor: ["configure-docker"]

  - name: "gcr.io/cloud-builders/docker"
    id: "build"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        VERSION=$(cat /workspace/VERSION 2>/dev/null || echo "$SHORT_SHA")
        # FAIL-FAST on an empty image tag (guard, forward-ported from the SERVICE
        # template 2026-08-06). SHORT-SHA is a Cloud Build built-in populated ONLY for
        # repoSource (trigger) builds; a manual `gcloud builds submit` uses a
        # storageSource and leaves it EMPTY. With `substitutionOption: ALLOW_LOOSE` that
        # empty value flows straight through, so the tag `<registry>/<svc>:<empty>`
        # becomes `<svc>:` and docker dies with a cryptic `invalid reference format` /
        # exit 125. Diagnose it in the first second instead, and say which var is empty.
        SAFE_SHA="$SHORT_SHA"
        if [ -z "$$SAFE_SHA" ]; then SAFE_SHA="$$VERSION"; fi
        if [ -z "$$VERSION" ]; then VERSION="$$SAFE_SHA"; fi
        if [ -z "$$SAFE_SHA" ] || [ -z "$$VERSION" ]; then
          echo "FATAL: cannot build an image tag — SHORT_SHA and VERSION are both empty." >&2
          echo "  SHORT_SHA is set only for trigger (repoSource) builds; a manual" >&2
          echo "  'gcloud builds submit' must pass --substitutions SHORT_SHA=<sha>," >&2
          echo "  or the extract-version step must write /workspace/VERSION." >&2
          exit 1
        fi
        PKG_UPPER=$(echo "${_SERVICE_NAME}" | tr '[:lower:]-' '[:upper:]_')
        DOCKER_BUILDKIT=1 docker build -f Dockerfile \
          --build-arg PROJECT_ID=$PROJECT_ID \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --build-arg SETUPTOOLS_SCM_PRETEND_VERSION_FOR_$$PKG_UPPER=$$VERSION \
          --cache-from asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:latest \
          -t asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:$$SAFE_SHA \
          -t asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:$$VERSION \
          -t asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:latest \
          .
    waitFor: ["pull-base-image", "ensure-repo", "fetch-ui", "extract-version"]

  # Forward-ported 2026-08-09 from client-reporting-api (which added this locally
  # without ever forward-porting it here — the exact pattern already proven in
  # cloudbuild-service-template.yaml's own quality-gates step) — SSOT for the
  # _RUN_INIMAGE_QG rationale is the substitutions comment above.
  - name: "gcr.io/cloud-builders/docker"
    id: "quality-gates"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        # _RUN_INIMAGE_QG default false (declared in substitutions): QG is already
        # enforced at quickmerge + the quality-gates-v2 promotion gate, and the
        # in-image harness (unified-trading-pm/base-service.sh) is absent from the
        # image, so re-running it here is redundant+impossible (exit 127). Deploy
        # triggers set _RUN_INIMAGE_QG=true to keep the gate on feature/LDR builds.
        if [ "${_RUN_INIMAGE_QG}" != "true" ]; then
          echo "quality-gates: skipped (_RUN_INIMAGE_QG=${_RUN_INIMAGE_QG}) — QG already enforced at quickmerge + promotion v2"
          exit 0
        fi
        VERSION=$(cat /workspace/VERSION 2>/dev/null || echo "$SHORT_SHA")
        echo "Running quality gates inside ${_SERVICE_NAME} image..."
        docker run --rm \
          --entrypoint "" \
          -e CLOUD_BUILD=true \
          -e CLOUD_MOCK_MODE=true \
          -e GCP_PROJECT_ID=$PROJECT_ID \
          asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:$$VERSION \
          /bin/bash -c "scripts/quality-gates.sh --no-fix --quick"
    waitFor: ["build"]

  # ── Immutable sha-tag guard (first push wins) ──────────────────────────────
  # Rebuilds of the same commit are NOT bit-reproducible (:latest cache seed,
  # build-time cloned/vendored deps), so re-pushing :$SHORT_SHA re-points the
  # git-sha tag at a different digest — silent drift for anything resolving the
  # sha tag (mutable-tag incident: deployment-api 7da9baf, 2026-07-13). First
  # push wins: if AR already has :$SHORT_SHA, keep it and push :latest only.
  # :latest stays mutable by design (AR immutable-tags would break it).
  - name: "gcr.io/cloud-builders/gcloud"
    id: "sha-tag-guard"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        IMG="asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:$SHORT_SHA"
        EXISTING="$$(gcloud artifacts docker images describe "$$IMG" --format='value(image_summary.digest)' 2>/dev/null || true)"
        if [ -n "$$EXISTING" ]; then
          printf '%s' "$$EXISTING" > /workspace/.sha_tag_preexists
          echo "sha-tag-guard: $$IMG already exists ($$EXISTING) — push will NOT re-stamp it"
        else
          echo "sha-tag-guard: $$IMG absent — this build's push creates it"
        fi
    waitFor: ["configure-docker"]

  - name: "gcr.io/cloud-builders/docker"
    id: "push"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        REPO_IMG="asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}"
        if [ -f /workspace/.sha_tag_preexists ]; then
          echo "push: :$SHORT_SHA pre-exists (digest $$(cat /workspace/.sha_tag_preexists)) — immutable, pushing :latest only"
          docker push "$$REPO_IMG:latest"
        else
          docker push --all-tags "$$REPO_IMG"
        fi
    waitFor: ["quality-gates", "sha-tag-guard"]

  - name: "gcr.io/cloud-builders/gcloud"
    id: "scan-check"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        IMAGE="asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:$SHORT_SHA"
        echo "Waiting for Container Analysis vulnerability scan on $$IMAGE..."
        for i in $(seq 1 18); do
          RESULT=$(gcloud artifacts docker images describe "$$IMAGE" \
            --show-package-vulnerability --format="json" 2>/dev/null)
          if [ -n "$$RESULT" ]; then
            CRITICAL=$(echo "$$RESULT" | python3 -c "import json,sys;d=json.load(sys.stdin);print(len(d.get('package_vulnerability_summary',{}).get('vulnerabilities',{}).get('CRITICAL',[])))" 2>/dev/null || echo "0")
            if [ "$$CRITICAL" != "0" ]; then
              echo "SCAN FAILED: $$CRITICAL CRITICAL CVEs found in $$IMAGE"
              exit 1
            fi
            echo "Scan complete: 0 CRITICAL CVEs"
            exit 0
          fi
          echo "Scan not ready (attempt $$i/18) — waiting 10s..."
          sleep 10
        done
        echo "WARNING: Vulnerability scan timed out — proceeding"
        exit 0
    waitFor: ["push"]

# NOTE: the :$SHORT_SHA tag is intentionally NOT listed here — the images: list
# is pushed unconditionally after all steps, which would re-stamp a pre-existing
# sha tag and defeat the sha-tag-guard (first push wins). The push step owns it.
images:
  - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:latest"

# Required by the extract-version step's AUTHENTICATED --unshallow fetch. Without it the tagged
# commits are unreachable in Cloud Build's shallow clone and hatch-vcs cannot detect the version
# inside the docker build. Forward-ported 2026-08-06 from client-reporting-api.
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/GH_PAT/versions/latest
      env: GH_PAT

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"

timeout: "600s"
