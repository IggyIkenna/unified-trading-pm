# CodeBuild buildspec template — Unified Trading System Services
#
# Service variant: Python 3.13, docker build, docker run QG, docker push.
# Optional GH dispatch for deploy_via_dispatch repos.
#
# Placeholders: {{SERVICE_NAME}}, {{REGISTRY_REPO}}.
# Registry image: {{REGISTRY_URI}}/{{REGISTRY_REPO}}/{{SERVICE_NAME}}

version: 0.2

env:
  variables:
    SERVICE_NAME: "{{SERVICE_NAME}}"
    REGISTRY_REPO: "{{REGISTRY_REPO}}"
    IMAGE_TAG: "latest"
  # AWS_ACCOUNT_ID, AWS_DEFAULT_REGION available in CodeBuild

phases:
  install:
    runtime-versions:
      python: "3.13"
    commands:
      - echo "Installing Docker..."
      - yum install -y docker || true
      - service docker start || true

  pre_build:
    commands:
      - echo "Logging in to ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin
        $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - echo "Creating ECR repo if needed..."
      - aws ecr describe-repositories --repository-names $REGISTRY_REPO --region $AWS_DEFAULT_REGION 2>/dev/null || aws
        ecr create-repository --repository-name $REGISTRY_REPO --region $AWS_DEFAULT_REGION
      - |
        if [ -n "$GCP_SA_KEY" ]; then
          echo "$GCP_SA_KEY" | docker login -u _json_key --password-stdin https://asia-northeast1-docker.pkg.dev
        else
          echo "WARNING: GCP_SA_KEY not set — Docker build may fail when pulling GAR base image"
        fi
      - IMAGE_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$REGISTRY_REPO/$SERVICE_NAME"
      - 'echo "Image URI: $IMAGE_URI"'

  build:
    commands:
      - echo "Building Docker image..."
      - |
        if [ -n "$GCP_SA_KEY" ]; then
          GCP_PROJECT_ID=$(echo "$GCP_SA_KEY" | python3 -c "import json,sys;print(json.load(sys.stdin).get('project_id','central-element-323112'))" 2>/dev/null || echo "central-element-323112")
          docker build -f Dockerfile --build-arg PROJECT_ID=$GCP_PROJECT_ID -t $IMAGE_URI:$IMAGE_TAG -t $IMAGE_URI:$CODEBUILD_RESOLVED_SOURCE_VERSION .
          echo "Running quality gates inside image..."
          docker run --rm \
            -e CLOUD_BUILD=true \
            -e CLOUD_MOCK_MODE=true \
            -e GCP_PROJECT_ID=test-project \
            $IMAGE_URI:$IMAGE_TAG \
            /bin/bash -c "bash scripts/quality-gates.sh --no-fix --quick"
          export DOCKER_IMAGE_BUILT=true
        else
          echo "GCP_SA_KEY unavailable: running quality gates directly without Docker build/push"
          bash scripts/quality-gates.sh --no-fix --quick
          export DOCKER_IMAGE_BUILT=false
        fi
      - echo "Quality gates passed"

  post_build:
    commands:
      - echo "Pushing image..."
      - |
        if [ "${DOCKER_IMAGE_BUILT:-false}" = "true" ]; then
          docker push $IMAGE_URI:$IMAGE_TAG
          docker push $IMAGE_URI:$CODEBUILD_RESOLVED_SOURCE_VERSION
        else
          echo "Skipping docker push because image build was skipped"
        fi
      - echo "Build complete"

artifacts:
  files:
    - "**/*"

cache:
  paths:
    - "/root/.cache/pip/**/*"
# Optional: add GH dispatch step for deploy_via_dispatch repos
# (inject via rollout script when manifest has deploy_via_dispatch: true)
