# Runtime Topology SSOT
# Defines runtime interaction behavior (messaging, API edges, storage flows).
# This file is machine-readable and consumed by deployment + quality gates.
# SVG visualization: unified-trading-pm/codex/04-architecture/RUNTIME_DEPLOYMENT_TOPOLOGY_DAG.svg
#
# Transport is parameterized by CLOUD_PROVIDER (gcp | aws | local).
# At deployment time, the deployment system reads CLOUD_PROVIDER to select
# the correct transport per edge. Services never see cloud-specific transports.

version: 8
ssot:
  purpose: Runtime interaction topology and deployment transport policy
  owner: unified-trading-pm
  paired_code_ssot: unified-trading-pm/workspace-manifest.json
  svg_diagram: unified-trading-pm/codex/04-architecture/RUNTIME_DEPLOYMENT_TOPOLOGY_DAG.svg
  decisions_doc: unified-trading-pm/codex/04-architecture/RUNTIME_TOPOLOGY_DECISIONS.md
  isolation_sla_doc: unified-trading-pm/codex/04-architecture/client-isolation-sla-and-runtime-profiles.md
  schema_changelog:
    v7_to_v8:
      - Added archetype_deployment_profile_mapping (reverse-index: deployment_profile → archetypes).
      - Populated from the 2026-08-10 per-family latency-category audit decision artifact.
      - New top-level section adjacent to deployment_profiles; does not modify existing keys.
    v6_to_v7:
      - Added isolation_policies (per-service shared|isolated choice with allowed overrides).
      - Added sla_tiers (premium|standard|basic with cost_multiplier and required isolation).
      - Added runtime_profiles (backtest|paper|mock-live|staging|prod collapses 5 legacy env vars).
      - Added chaos_hooks (enumerates injection points consumed by UTL ChaosController).
      - All additions are non-breaking; v6 consumers ignore unknown keys.

# ---------------------------------------------------------------------------
# KEY DISTINCTION: Transport vs Persistence
# ---------------------------------------------------------------------------
# Transport = how data moves between services at runtime
#   - batch: GCS (GCP) or S3 (AWS) — producer writes parquet, consumer reads parquet
#   - live: PubSub (GCP) or SQS (AWS) — producer publishes, consumer subscribes
#   - live co-located: in_memory (same VM, process-to-process; fast path when services share VM)
#   - Redis: hot transient state (execution-service order state); not transport between pipeline services
# Kernel bypass (e.g. DPDK, zero-copy kernel bypass): not used in this topology. in_memory is the
#   colocated fast path; kernel bypass would be a future option only if sub-microsecond latency required.
#
# Persistence = durable storage sink (ALL services persist output to cloud storage)
#   - In batch mode: transport and persistence are the SAME write (GCS or S3)
#   - In live mode: transport (PubSub/SQS) and persistence (GCS/S3 sink) are SEPARATE
#   - Every service that produces data MUST persist to cloud storage regardless of mode
#   - BigQuery is for OLAP analytics (not transport)
#   - Redis is for hot transient state (not persistence)
#   - CLOUD_PROVIDER env var selects GCP or AWS transport/persistence at deployment time

# ---------------------------------------------------------------------------
# Deployment profiles
# ---------------------------------------------------------------------------
deployment_profiles:
  distributed:
    description: Each service on its own VM / Cloud Run instance (cross-VM safe)
    allowed_transports: [gcs, pubsub, s3, sqs]
  co_located_vm:
    description: Bundled services on one VM for low-latency handoff
    allowed_transports: [gcs, pubsub, s3, sqs, in_memory]

# ---------------------------------------------------------------------------
# Archetype → deployment-profile mapping (reverse-index)
# ---------------------------------------------------------------------------
# Maps each deployment_profile back to the StrategyArchetype values that
# require it — the deployment-side half of the archetype↔deployment link.
# The archetype-side half is ARCHETYPE_TO_DEPLOYMENT_PROFILE in
# unified_api_contracts/internal/architecture_v2/enums.py.
#
# Populated 2026-08-10 from the per-family latency-category audit decision
# artifact at /codex/04-architecture/RUNTIME_TOPOLOGY_DECISIONS.md.
# Rationale for new section (not retrofitting co_location_rules or
# deployment_profiles): co_location_rules enumerates SERVICE GROUPS that
# share a VM; deployment_profiles defines profile CAPABILITIES. Neither
# models the archetype→profile relationship. A dedicated section makes the
# join table explicit, is machine-readable for deployment-service's
# derivation logic, and stays in sync with the UAC enum via the audit trail.
# ---------------------------------------------------------------------------
archetype_deployment_profile_mapping:
  description: >-
    Reverse-index: deployment_profile → set of StrategyArchetype values requiring it, with the per-family
    latency-category rationale. Consumers (deployment-service) compute the required deployment set as the UNION of
    profiles demanded by the currently-active archetype set.
  ssot_archetype_side: unified_api_contracts/internal/architecture_v2/enums.py::ARCHETYPE_TO_DEPLOYMENT_PROFILE
  decision_artifact: /codex/04-architecture/RUNTIME_TOPOLOGY_DECISIONS.md
  co_located_vm:
    reason: >-
      Low-latency families — ms-realm inter-leg execution gap per the 2026-08-10 operator ruling. These archetypes
      execute multi-leg trades where the lag-leg must follow the lead-leg at ms timing; co-located VM provides in_memory
      transport between strategy/execution/MTDH.
    min_sla_tier: premium
    families:
      market_making:
        reason: "<100ms total E2E; sub-ms shadow book + delta-proxy fast path"
        archetypes:
          - MARKET_MAKING_CONTINUOUS
          - MARKET_MAKING_EVENT_SETTLED
          - MARKET_MAKING_PASSIVE_SPREAD
          - MARKET_MAKING_INVENTORY_SKEW
          - MARKET_MAKING_ML_LEAN
          - MARKET_MAKING_QUEUE_MICROSTRUCTURE
          - MARKET_MAKING_PREDICTION
          - DEFI_LP_CONCENTRATED
          - DEFI_LP_POOL
          - DEFI_LP_VAULT
      arbitrage_structural:
        reason: "<200-300ms total E2E; cross-exchange two-legs-two-venues gap"
        archetypes:
          - ARBITRAGE_PRICE_DISPERSION
          - ARBITRAGE_SPORTS_DUTCHING
          - LIQUIDATION_CAPTURE
          - ARBITRAGE_MEV_SANDWICH
          - ARBITRAGE_MEV_JIT_LIQUIDITY
          - ARBITRAGE_MEV_BACKRUN
          - ARBITRAGE_MEV_LIQUIDATION_BUNDLE
          - ARBITRAGE_CROSS_DOMAIN_EVENT
      carry_and_yield_basis:
        reason: >-
          Multi-leg basis/staking-basis variants — spot-leg/perp-hedge-leg gap must be ms-realm (<500ms operating
          target). Two single-sided yield/staking archetypes are Medium→distributed (excluded here).
        archetypes:
          - CARRY_BASIS_DATED
          - CARRY_BASIS_DATED_INV
          - CARRY_BASIS_PERP
          - CARRY_BASIS_PERP_INV
          - CARRY_FUNDING_DISPERSION
          - CARRY_STAKED_BASIS
          - CARRY_STAKED_BASIS_DATED
          - CARRY_RECURSIVE_STAKED
          - CARRY_RECURSIVE_BORROW_LENDING_ONLY
      ml_directional:
        reason: "<200ms total E2E; greenfield — no prior latency doc existed"
        archetypes:
          - ML_DIRECTIONAL_CONTINUOUS
          - ML_DIRECTIONAL_EVENT_SETTLED
      rules_directional:
        reason: "<200ms total E2E; rule evaluator fires directly off features (no model-inference leg)"
        archetypes:
          - RULES_DIRECTIONAL_CONTINUOUS
          - RULES_DIRECTIONAL_EVENT_SETTLED
          - TSMOM_BTC_CTA
      stat_arb_pairs:
        reason: "<200-300ms total E2E; cross-venue / leader-lagger pairs at ms-realm"
        archetypes:
          - STAT_ARB_PAIRS_FIXED
          - STAT_ARB_CROSS_SECTIONAL
  distributed:
    reason: >-
      Medium/High-latency families — seconds-to-minutes decision cycles; standard Cloud Run / standalone VM deployment
      is sufficient.
    min_sla_tier: standard
    families:
      vol_trading:
        reason: "<15s total E2E (archived Volatility Arb row); intra-family fast subset edge case deferred"
        archetypes:
          - VOL_TRADING_OPTIONS
          - VOL_ARB_RV_IV
          - VOL_SPREAD_STRUCTURES
          - VOL_CARRY
          - VOL_OVERLAY_COVERED_CALLS
          - VOL_OVERLAY_PROTECTIVE_PUT
          - VOL_STRADDLE
          - VOL_SYNTHETIC_DELTA
          - VOL_MARKET_MAKING
          - VOL_ML_LEAN
          - VOL_0DTE_GAMMA_SCALPING
          - VOL_0DTE_PIN_RISK
          - VOL_TERM_STRUCTURE_ARB
          - VOL_TERM_STRUCTURE_SLOPE
          - VOL_DISPERSION
          - VOL_VARIANCE_SWAP
          - VOL_LEAPS_CONVEXITY
          - VOL_CROSS_ASSET_SPREAD
          - VOL_RATIO_SPREAD
      event_driven:
        reason: "Seconds-scale decision; pre-positioned + time-bounded; Momentum closest analog"
        archetypes:
          - EVENT_DRIVEN
      carry_and_yield_single_sided:
        reason: "Single-sided yield/staking — seconds-scale decision, no multi-leg inter-leg gap"
        archetypes:
          - YIELD_ROTATION_LENDING
          - YIELD_STAKING_SIMPLE
      portfolio:
        reason: "60s latency_budget_ms + 10s Alpha thesis; Yield Optimization analog"
        archetypes:
          - PORTFOLIO_MULTI_STRATEGY
          - PORTFOLIO_RISK_PARITY
          - PORTFOLIO_FACTOR_ALLOCATION
          - PORTFOLIO_TACTICAL_OVERLAY

# ---------------------------------------------------------------------------
# Defaults
# ---------------------------------------------------------------------------
defaults:
  deployment_profile: distributed
  transport_by_mode:
    batch:
      gcp:
        transport: gcs
        dependency_check: gcs
      aws:
        transport: s3
        dependency_check: s3
    live:
      gcp:
        transport: pubsub
        dependency_check: pubsub
      aws:
        transport: sqs
        dependency_check: sqs
  persistence:
    gcp:
      sink: gcs
      format: parquet
    aws:
      sink: s3
      format: parquet
    note: "CLOUD_PROVIDER env var determines which cloud's transport is used at deployment time"

# ---------------------------------------------------------------------------
# Messaging / storage primitives
# ---------------------------------------------------------------------------
message_bus:
  gcs:
    role: batch message bus + persistence sink (GCP)
    format: parquet
    scope: cross-service
    cloud: gcp
    note: In batch mode, GCS is BOTH transport and persistence (same write)
  s3:
    role: batch message bus + persistence sink (AWS)
    format: parquet
    scope: cross-service
    cloud: aws
    note: In batch mode, S3 is BOTH transport and persistence (same write)
  pubsub:
    role: live event bus (transport only, ephemeral)
    protocol: cloud_pubsub
    scope: cross-vm
    cloud: gcp
    note: Data published to PubSub must ALSO be persisted separately
  sqs:
    role: live event bus (transport only, ephemeral)
    protocol: aws_sqs
    scope: cross-vm
    cloud: aws
    note: Data published to SQS must ALSO be persisted separately
  in_memory:
    role: process-local live handoff (co-located services only)
    scope: same-vm-only
    note: Same as PubSub/SQS — still requires separate persistence
  redis:
    role: hot transient state (NOT persistence, NOT transport)
    scope: same-vm-only
    note: Used only by execution-service for order state; not a data sink

storage_systems:
  gcs:
    role: canonical timeseries, features, models, execution results
    cloud: gcp
    note: The universal persistence sink on GCP — every service writes here
  s3:
    role: canonical timeseries, features, models, execution results
    cloud: aws
    note: The universal persistence sink on AWS — every service writes here
  bigquery:
    role: OLAP analytics and reporting warehouse
    cloud: gcp
    note: Fed by services via UDC BigQueryCatalog; not a transport
  redis:
    role: low-latency transient state
    note: Execution-services hot order state only; ephemeral

# ---------------------------------------------------------------------------
# Service clusters (logical grouping for deployment)
# ---------------------------------------------------------------------------
clusters:
  data_pipeline:
    services:
      - instruments-service
      - market-tick-data-service
      - market-data-processing-service
    layer: "L1-L2"
  features:
    services:
      - features-calendar-service
      - features-delta-one-service
      - features-volatility-service
      - features-onchain-service
      - features-cross-instrument-service
      - features-multi-timeframe-service
      - features-sports-service
    layer: "L3"
  ml_pipeline:
    services:
      - ml-training-service
      - ml-inference-service
    layer: "L4"
  strategy_execution:
    services:
      - strategy-service
      - execution-service
    layer: "L5"
  monitoring:
    services:
      - position-balance-monitor-service
      - risk-and-exposure-service
      - pnl-attribution-service
      - alerting-service
    layer: "L6"
  api_services:
    services:
      - client-reporting-api
      - deployment-api
      - unified-trading-api
      - auth-api
    layer: "API"
  website:
    services: []
    layer: "Web"
    note: >
      odum-research-website archived (2026-03) under workspace-root archive/. Public or research web surfaces are
      handled outside this runtime topology or via unified-trading-system-ui as applicable.

# ---------------------------------------------------------------------------
# Isolation policies — per-service shared|isolated choice
# ---------------------------------------------------------------------------
# Each service declares:
#   default:  shared | isolated  — the policy applied when no client override
#   allowed:  [shared, isolated] — which policies a client subscription may pick
#   reason:   short explanation for why the default / allowed set is what it is
#
# Contract:
#   shared   = one process instance multiplexes N clients (topic_template contains {client})
#   isolated = one process instance per client (one pod/VM per client, topic_template fixed)
#
# L1-L4 (data pipeline, features, ML) default shared — market data and features are
# inherently multi-tenant. No client-specific information flows through them.
# L5 (strategy, execution) and L6 (position, risk, pnl, alerting) are where the
# isolation choice actually matters.
# ---------------------------------------------------------------------------
isolation_policies:
  # L1 — Data ingestion (always shared; market data is not per-client)
  instruments-service:
    default: shared
    allowed: [shared]
    reason: "Reference data is universal; no client dimension."
  market-tick-data-service:
    default: shared
    allowed: [shared]
    reason: "Tick ingestion is universal; sharding is by venue, not client."
  # L2 — Processing (always shared)
  market-data-processing-service:
    default: shared
    allowed: [shared]
    reason: "Candle aggregation is universal."
  # L3 — Features (always shared)
  features-delta-one-service:
    default: shared
    allowed: [shared]
    reason: "Features are universal inputs; sharded by instrument/timeframe, not client."
  features-volatility-service:
    default: shared
    allowed: [shared]
    reason: "Same as delta-one."
  features-onchain-service:
    default: shared
    allowed: [shared]
    reason: "On-chain features are universal."
  features-calendar-service:
    default: shared
    allowed: [shared]
    reason: "Calendar features are universal."
  features-cross-instrument-service:
    default: shared
    allowed: [shared]
    reason: "Cross-instrument features are universal."
  features-multi-timeframe-service:
    default: shared
    allowed: [shared]
    reason: "Multi-timeframe features are universal."
  features-sports-service:
    default: shared
    allowed: [shared]
    reason: "Sports features are universal (sharded by league/fixture, not client)."
  # L4 — ML (always shared for training; inference shared, can be isolated per client if model is client-specific)
  ml-training-service:
    default: shared
    allowed: [shared]
    reason: "Training is universal; model artifacts may differ per client but training is pooled."
  ml-inference-service:
    default: shared
    allowed: [shared, isolated]
    reason: "Default shared; isolate for clients running proprietary models on dedicated hardware."
  # L5 — Strategy + Execution (isolation choice matters)
  strategy-service:
    default: shared
    allowed: [shared, isolated]
    reason: >
      Shared default — multi-tenant strategy runs are cheaper. Archetypes with strict latency budgets (MM, arb) or
      proprietary logic (client-bespoke signals) demand isolated. Per-archetype requirements live in
      codex/09-strategy/architecture-v2/families/*.md.
  execution-service:
    default: isolated
    allowed: [isolated]
    reason: >
      Always isolated — per-client venue API keys, rate limits, entitlements, and order-flow confidentiality require a
      dedicated process per client.
  # L6 — Monitoring (default shared; premium clients can isolate)
  position-balance-monitor-service:
    default: shared
    allowed: [shared, isolated]
    reason: >
      Shared default — one process tracking N clients is cheaper and enables cross-client reconciliation for free.
      Premium clients may isolate for dedicated support and tighter SLAs.
  risk-and-exposure-service:
    default: shared
    allowed: [shared, isolated]
    reason: "Shared default; isolated available for premium clients with custom risk limits."
  pnl-attribution-service:
    default: shared
    allowed: [shared, isolated]
    reason: "Shared default; isolated for clients whose P&L attribution logic is bespoke."
  alerting-service:
    default: shared
    allowed: [shared, isolated]
    reason: "Shared default; isolated for clients with dedicated escalation contracts."
  # API services — always shared (multi-tenant by design)
  client-reporting-api:
    default: shared
    allowed: [shared]
    reason: "Multi-tenant reporting API; per-client auth at request layer."
  deployment-api:
    default: shared
    allowed: [shared]
    reason: "Platform control plane."
  unified-trading-api:
    default: shared
    allowed: [shared]
    reason: "Multi-tenant API gateway."
  auth-api:
    default: shared
    allowed: [shared]
    reason: "Global authentication surface."

# ---------------------------------------------------------------------------
# SLA tiers — premium / standard / basic
# ---------------------------------------------------------------------------
# Defines:
#   cost_multiplier           — how much this tier costs vs basic (for passthrough billing)
#   allowed_isolations        — which isolation policies a client on this tier may request
#   min_isolated_services     — services that MUST be isolated at this tier (overrides default)
#   latency_budget_ms         — end-to-end order latency target (for routing decisions)
#   support_response_sla_min  — first-response time for incidents
#
# Cost passthrough: when a client on `premium` pulls an additional isolated service,
# deployment-service records the delta as line-item cost and client-reporting-api
# includes it on the monthly invoice.
# ---------------------------------------------------------------------------
sla_tiers:
  basic:
    cost_multiplier: 1.0
    allowed_isolations: [shared]
    min_isolated_services: []
    latency_budget_ms: 500
    support_response_sla_min: 1440 # 24h
    note: "Fully multi-tenant; best-effort latency; business-hours support."
  standard:
    cost_multiplier: 2.5
    allowed_isolations: [shared, isolated]
    min_isolated_services: [execution-service]
    latency_budget_ms: 150
    support_response_sla_min: 240 # 4h
    note: "Isolated execution (required); optional isolation on monitoring; 4h support."
  premium:
    cost_multiplier: 6.0
    allowed_isolations: [shared, isolated]
    min_isolated_services:
      - execution-service
      - strategy-service
      - position-balance-monitor-service
      - risk-and-exposure-service
    latency_budget_ms: 40
    support_response_sla_min: 30 # 30 min
    note: >
      Dedicated execution+strategy+position+risk; co-located where archetype demands; 30-minute incident response;
      custom limits.

# ---------------------------------------------------------------------------
# Runtime profiles — single axis collapsing the 5 legacy mode env vars
# ---------------------------------------------------------------------------
# Deployment-api accepts `runtime_profile` on /deployments and fans out to the
# correct env var set at VM/pod boot. This is the single source of truth for
# "what mode is this deployment running in". The UI surfaces one dropdown, not five.
#
# Fields consumed by deployment-api when materialising a deployment:
#   cloud_mock_mode          — sets CLOUD_MOCK_MODE
#   mock_state_mode          — sets MOCK_STATE_MODE
#   auth_disabled            — sets DISABLE_AUTH
#   vite_mock_api            — sets VITE_MOCK_API (UI)
#   vite_skip_auth           — sets VITE_SKIP_AUTH (UI)
#   chaos_allowed            — whether ChaosController is permitted to inject
#   client_isolation_required — whether client_id must be provided and isolation enforced
#   storage_namespace        — GCS/S3 prefix for this profile (prevents collision with live)
#   allow_real_venue_calls   — whether execution-service may hit real venues
# ---------------------------------------------------------------------------
runtime_profiles:
  backtest:
    description: "Historical replay with simulated fills via matching engine; isolated storage."
    cloud_mock_mode: false
    mock_state_mode: deterministic
    auth_disabled: true
    vite_mock_api: false
    vite_skip_auth: true
    chaos_allowed: true
    client_isolation_required: false
    storage_namespace: "backtest/{run_id}/"
    allow_real_venue_calls: false
    note: >
      Batch = live code path with execution-service in simulated-fill mode. Own GCS namespace so concurrent live runs
      are untouched. Own Pub/Sub topic suffix.
  paper:
    description: "Live data, simulated fills (matching engine), real risk + position."
    cloud_mock_mode: false
    mock_state_mode: interactive
    auth_disabled: false
    vite_mock_api: false
    vite_skip_auth: false
    chaos_allowed: false
    client_isolation_required: true
    storage_namespace: "paper/{client_id}/"
    allow_real_venue_calls: false
    note: "Staging-equivalent for strategy validation without real fills."
  mock-live:
    description: "All services live-wired but CLOUD_MOCK_MODE=true; sample data, no real cloud."
    cloud_mock_mode: true
    mock_state_mode: interactive
    auth_disabled: true
    vite_mock_api: true
    vite_skip_auth: true
    chaos_allowed: true
    client_isolation_required: false
    storage_namespace: "mock/{run_id}/"
    allow_real_venue_calls: false
    note: "Local dev / UAT. Preferred profile for Tier-2 local fleet."
  staging:
    description: "Real cloud, real services, staging credentials, real (sandbox) venues."
    cloud_mock_mode: false
    mock_state_mode: interactive
    auth_disabled: false
    vite_mock_api: false
    vite_skip_auth: false
    chaos_allowed: true
    client_isolation_required: true
    storage_namespace: "staging/"
    allow_real_venue_calls: true
    note: "Chaos ALLOWED (prod is the only profile that forbids chaos)."
  prod:
    description: "Production. Chaos FORBIDDEN. Full auth. Real cloud. Real venues."
    cloud_mock_mode: false
    mock_state_mode: interactive
    auth_disabled: false
    vite_mock_api: false
    vite_skip_auth: false
    chaos_allowed: false
    client_isolation_required: true
    storage_namespace: "prod/"
    allow_real_venue_calls: true
    note: "The only profile where ChaosController must be no-op."

# ---------------------------------------------------------------------------
# Chaos hooks — enumerates injection points consumed by UTL ChaosController
# ---------------------------------------------------------------------------
# Every point listed here MUST have a corresponding hook in the implementing
# library (UCI / UAC / execution-service / UTL) or be explicitly marked planned.
# deployment-api validates ChaosInjectionSpec.point against this list.
# ---------------------------------------------------------------------------
chaos_hooks:
  - point: VENUE_LATENCY
    target_boundary: execution-service venue adapter
    hook_location: execution_service.adapters.venue_adapter_base
    parameters: [delay_ms, jitter_ms, venue]
    status: planned
  - point: RPC_TIMEOUT
    target_boundary: UCI cloud SDK wrappers
    hook_location: unified_cloud_interface.clients
    parameters: [timeout_ms, failure_rate, sdk]
    status: planned
  - point: RECON_MISMATCH
    target_boundary: position-balance-monitor-service reconciler
    hook_location: position_balance_monitor_service.recon
    parameters: [field, delta, probability]
    status: planned
  - point: PRICE_SHOCK
    target_boundary: market-tick-data-service live feed
    hook_location: market_tick_data_service.market_interface.feed
    parameters: [instrument, pct_move, duration_s]
    status: planned
  - point: INSTRUMENT_DELIST
    target_boundary: instruments-service publisher
    hook_location: instruments_service.publisher
    parameters: [symbol, at_ts]
    status: planned
  - point: CONFIG_FLIP
    target_boundary: UCI config reloaders
    hook_location: unified_trading_library.config_reloader
    parameters: [key, value, at_ts]
    status: planned
  - point: KILL_SWITCH_FIRE
    target_boundary: UTL KillSwitchBus
    hook_location: unified_trading_library.kill_switch
    parameters: [scope, client_id, venue, strategy_id]
    status: planned
  - point: COMPONENT_FAILURE
    target_boundary: ServiceBootstrap lifecycle
    hook_location: unified_trading_library.service_runtime
    parameters: [service, duration_s, at_ts]
    status: planned

# ---------------------------------------------------------------------------
# Complete service data flows (producer → consumer)
# ---------------------------------------------------------------------------
# NOTE: UDC is a library (Tier 3), NOT a service. Services use UDC to
# read/write GCS/BigQuery. UDC never appears as a flow participant.

service_flows:
  # === Layer 1 → Layer 2: Data Ingestion → Processing ===
  - producer: instruments-service
    consumer: market-tick-data-service
    data: instruments_universe
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }

  - producer: instruments-service
    consumer: market-data-processing-service
    data: instruments_universe
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }

  - producer: instruments-service
    consumer: features-delta-one-service
    data: instruments_universe
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }

  - producer: instruments-service
    consumer: features-volatility-service
    data: instruments_universe
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }

  - producer: instruments-service
    consumer: features-cross-instrument-service
    data: instruments_universe
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }

  - producer: instruments-service
    consumer: features-multi-timeframe-service
    data: instruments_universe
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }

  - producer: instruments-service
    consumer: ml-training-service
    data: instruments_universe
    modes:
      batch: { transport: gcs }

  - producer: instruments-service
    consumer: ml-inference-service
    data: instruments_universe
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }

  - producer: instruments-service
    consumer: strategy-service
    data: instruments_universe
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }

  - producer: instruments-service
    consumer: execution-service
    data: instruments_universe
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }

  - producer: market-tick-data-service
    consumer: market-data-processing-service
    data: raw_tick_data
    modes:
      batch: { transport: gcs }
      live:
        distributed:
          gcp: { transport: pubsub }
          aws: { transport: sqs }
        co_located_vm: { transport: in_memory }

  # === Layer 2 → Layer 3: Processing → Features ===
  - producer: market-data-processing-service
    consumer: features-delta-one-service
    data: processed_candles_ohlcv
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }

  - producer: market-data-processing-service
    consumer: features-volatility-service
    data: processed_candles_ohlcv
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }

  # === Layer 2 → API: Processing → Market Data API ===
  - producer: market-data-processing-service
    data: candles_stream
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }

  - producer: market-tick-data-service
    data: orderbook_stream
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }

  # === Layer 3 → Layer 4: Features → ML ===
  - producer: features-delta-one-service
    consumer: ml-training-service
    data: delta_one_features
    modes:
      batch: { transport: gcs }

  - producer: features-volatility-service
    consumer: ml-training-service
    data: volatility_features
    modes:
      batch: { transport: gcs }

  - producer: features-onchain-service
    consumer: ml-training-service
    data: onchain_features
    modes:
      batch: { transport: gcs }

  - producer: features-calendar-service
    consumer: ml-training-service
    data: calendar_features
    modes:
      batch: { transport: gcs }

  # === Layer 2-3 → Cross-Instrument: Inputs for cross-instrument aggregation ===
  - producer: features-delta-one-service
    consumer: features-cross-instrument-service
    data: delta_one_features_for_cross_instrument
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }
    note: Cross-instrument service aggregates features from multiple sources

  - producer: features-volatility-service
    consumer: features-cross-instrument-service
    data: volatility_features_for_cross_instrument
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }

  - producer: market-data-processing-service
    consumer: features-cross-instrument-service
    data: processed_market_data_multi_venue
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }
    note: Multi-venue candles for cross-venue spread calculations

  # === Cross-Instrument → ML ===
  - producer: features-cross-instrument-service
    consumer: ml-training-service
    data: cross_instrument_features
    modes:
      batch: { transport: gcs }

  - producer: features-cross-instrument-service
    consumer: ml-inference-service
    data: live_cross_instrument_features
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }

  # === Multi-Timeframe Service (L3b): FDS → FMTS → ML ===
  - producer: features-delta-one-service
    consumer: features-multi-timeframe-service
    data: delta_one_features_multi_tf
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }
    note: Multi-timeframe service aggregates delta-one features at 5m/15m/1h/4h/1d per instrument

  - producer: features-multi-timeframe-service
    consumer: ml-training-service
    data: multi_timeframe_features
    modes:
      batch: { transport: gcs }

  - producer: features-multi-timeframe-service
    consumer: ml-inference-service
    data: live_multi_timeframe_features
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }

  # === Layer 3 → Layer 4: Features → ML inference (live features) ===
  - producer: features-delta-one-service
    consumer: ml-inference-service
    data: live_delta_one_features
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }
    note: ML inference needs live features to generate predictions. Live→live = PubSub.

  - producer: features-volatility-service
    consumer: ml-inference-service
    data: live_volatility_features
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }
    note: Same reasoning as delta-one features.

  # === Sports Features (L3): instruments + market-data-processing → features-sports → ML ===
  - producer: instruments-service
    consumer: features-sports-service
    data: sports_reference_data
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }
    note: Leagues, teams, stadiums, venues from instruments-service

  - producer: market-data-processing-service
    consumer: features-sports-service
    data: sports_odds
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }
    note: Odds snapshots, HT snapshots for feature calculation

  - producer: features-sports-service
    consumer: ml-training-service
    data: sports_features
    modes:
      batch: { transport: gcs }

  - producer: features-sports-service
    consumer: ml-inference-service
    data: live_sports_features
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }

  # === Layer 4: ML training → ML inference (model artifacts only) ===
  - producer: ml-training-service
    consumer: ml-inference-service
    data: model_artifacts_registry
    modes:
      batch: { transport: gcs }
    # note: see comment below
  # Training is batch/infrequent (~quarterly). Inference reads models from GCS.
  # No PubSub needed — batch producer, live consumer = GCS read per messaging rules.
  #
  # === Layer 4 → Layer 5: ML → Strategy ===
  - producer: ml-inference-service
    consumer: strategy-service
    data: predictions
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }

  # === Layer 2 → Layer 5: Market data → Strategy ===
  - producer: market-data-processing-service
    consumer: strategy-service
    data: processed_market_data
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }

  # === Layer 6 → Layer 5: PBM → Strategy (position state) ===
  - producer: position-balance-monitor-service
    consumer: strategy-service
    data: position_state
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }
    # note: see comment below
  # Strategy gets position from PBM, NOT execution. PBM is the authoritative
  # position source — it reconciles exchange positions vs filled orders.
  # At startup, PBM publishes initial state so strategy knows current position.
  #
  # === Layer 5: Strategy → Execution ===
  - producer: strategy-service
    consumer: execution-service
    data: trade_signals_orders
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }

  # === Layer 5: Execution → Strategy (order handshake) ===
  - producer: execution-service
    consumer: strategy-service
    data: order_handshake
    modes:
      live: { transport: pubsub }
    # note: see comment below
  # Bidirectional: strategy sends orders, execution sends back order status
  # (created, filled, cancelled, rejected). Strategy needs this to know
  # whether its orders were accepted before deciding next action.
  #
  # === Layer 5 → Layer 6: Execution → Monitoring ===
  - producer: execution-service
    consumer: position-balance-monitor-service
    data: order_lifecycle_events
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }
    # note: see comment below
  # Full order lifecycle: ORDER_CREATED, ORDER_UPDATED, ORDER_CANCELLED,
  # ORDER_FILLED, ORDER_REJECTED. Not just fills.
  #
  - producer: execution-service
    consumer: pnl-attribution-service
    data: order_lifecycle_events
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }

  # === Layer 6 internal: Monitoring chain ===
  - producer: position-balance-monitor-service
    consumer: risk-and-exposure-service
    data: position_snapshots
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }

  - producer: market-data-processing-service
    consumer: risk-and-exposure-service
    data: market_data_for_risk
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }

  - producer: risk-and-exposure-service
    consumer: pnl-attribution-service
    data: risk_metrics
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }

  # === Layer 5 → API: Execution → consolidated gateway ===
  - producer: execution-service
    consumer: unified-trading-api
    data: execution_results
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }

  # === Layer 6 → API: PnL/Risk → Reporting ===
  - producer: pnl-attribution-service
    consumer: client-reporting-api
    data: pnl_reports
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }

  - producer: risk-and-exposure-service
    consumer: client-reporting-api
    data: risk_exposure_reports
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }

  - producer: position-balance-monitor-service
    consumer: client-reporting-api
    data: position_balance_reports
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }

  # === MTDH → Execution (live market feed, co-located) ===
  - producer: market-tick-data-service
    consumer: execution-service
    data: live_market_feed
    modes:
      batch: { transport: gcs }
      live:
        distributed:
          gcp: { transport: pubsub }
          aws: { transport: sqs }
        co_located_vm: { transport: in_memory }
    # note: see comment below
  # Execution needs live market feed for all allocation clients (one stream,
  # many consumers). Co-located with MTDH same as MDPS for low-latency.
  #
  # === Alerting (cross-cutting, one-to-many) ===
  - producer: risk-and-exposure-service
    consumer: alerting-service
    data: risk_alerts_circuit_breaker_triggers
    modes:
      live: { transport: pubsub }
      batch: { transport: gcs }

  - producer: position-balance-monitor-service
    consumer: alerting-service
    data: balance_discrepancy_alerts
    modes:
      live: { transport: pubsub }
      batch: { transport: gcs }

  - producer: execution-service
    consumer: alerting-service
    data: order_rejection_spikes
    modes:
      live: { transport: pubsub }

  - producer: alerting-service
    consumer: execution-service
    data: circuit_breaker_commands
    modes:
      live: { transport: pubsub }
    # note: see comment below
  # Alerting can publish circuit breaker commands (halt execution, flatten
  # positions) that services MUST honor. This is the disaster recovery trigger.
  #
  - producer: alerting-service
    consumer: strategy-service
    data: circuit_breaker_commands
    modes:
      live: { transport: pubsub }
    note: Strategy must honor halt commands from alerting system.

  # === Alerting → Deployment API: operational stop/restart triggers ===
  - producer: alerting-service
    consumer: deployment-api
    data: service_stop_restart_triggers
    modes:
      live: { transport: pubsub }
    note: Alerting publishes stop/restart commands; deployment-api executes them against Cloud Run services.

  # === Layer 1-2 → Commodity Features (L3): instruments + MDPS → features-commodity-service ===
  - producer: instruments-service
    consumer: features-commodity-service
    data: instruments_universe
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }

  - producer: market-data-processing-service
    consumer: features-commodity-service
    data: processed_candles_ohlcv
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }
    note: Commodity features consume OHLCV candles for fundamental factor and signal computation.

  # === Commodity Features → ML ===
  - producer: features-commodity-service
    consumer: ml-training-service
    data: commodity_features
    modes:
      batch: { transport: gcs }

  - producer: features-commodity-service
    consumer: ml-inference-service
    data: live_commodity_features
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }

  # === On-chain Features → ML inference (batch read of on-chain feature snapshots) ===
  - producer: features-onchain-service
    consumer: ml-inference-service
    data: onchain_feature_snapshots
    modes:
      batch: { transport: gcs }
    note: On-chain service is batch-only; inference reads latest on-chain feature snapshots from GCS.

  # === Layer 5-6 → Reconciliation: execution + position + strategy → batch-live-reconciliation-service ===
  - producer: execution-service
    consumer: batch-live-reconciliation-service
    data: execution_results_for_reconciliation
    modes:
      batch: { transport: gcs }
    note: T+1 reconciliation reads execution fills to compare live vs batch-replayed benchmark.

  - producer: position-balance-monitor-service
    consumer: batch-live-reconciliation-service
    data: position_snapshots_for_reconciliation
    modes:
      batch: { transport: gcs }
    note: Reconciliation validates live positions against batch-computed expected positions.

  - producer: strategy-service
    consumer: batch-live-reconciliation-service
    data: signals_for_reconciliation
    modes:
      batch: { transport: gcs }
    note: Reconciliation compares live signals to deterministic batch-replayed signals.

  # === Trading Agent: ML + strategy → trading-agent-service → execution ===
  - producer: ml-inference-service
    consumer: trading-agent-service
    data: predictions
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }
    note: Agent supervisor consumes ML predictions to drive autonomous TradFi commodity options/futures decisions.

  - producer: strategy-service
    consumer: trading-agent-service
    data: trade_signals
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }
    note: Agent observes strategy signals for supervised micro-loop decision-making.

  - producer: trading-agent-service
    consumer: execution-service
    data: agent_trade_orders
    modes:
      live: { transport: pubsub }
    note: Agent submits orders to execution-service; same pipeline as strategy-service orders.

  # === API read edges: pipeline services → API layer ===
  - producer: execution-service
    consumer: unified-trading-api
    data: execution_audit_events
    modes:
      batch: { transport: gcs }
    note: >
      Consolidated gateway reads execution audit trail from GCS/BigQuery. batch-audit-api archived under workspace-root
      archive/.

  - producer: pnl-attribution-service
    consumer: unified-trading-api
    data: pnl_reports
    modes:
      batch: { transport: gcs }
      live: { transport: pubsub }
