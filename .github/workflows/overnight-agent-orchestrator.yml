name: Overnight Agent Orchestrator

# Nightly (01:00 UTC) autonomous agent run across all repos in tier order.
# T0 (libraries) → T1 (contracts) → T2 (interfaces) → T3 (domain client) → Telegram summary.
# Each tier runs all repos in parallel. Cross-tier ordering enforced by GHA job dependencies.
#
# Secrets required:
#   GH_PAT              — dispatch workflow_dispatch + poll run status across repos
#   TELEGRAM_BOT_TOKEN  — morning summary notification
#   TELEGRAM_CHAT_ID    — target chat

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      tiers:
        description: "Tiers to run (comma-separated: 0,1,2,3 — or 'all')"
        required: false
        default: "all"
      dry_run:
        description: "Dispatch workflows but don't wait for results"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      agent_ref:
        description: "Branch to dispatch agent-audit.yml from (default: main)"
        required: false
        default: "main"

concurrency:
  group: overnight-orchestrator
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GH_PAT }}
  GH_ORG: IggyIkenna
  POLL_INTERVAL: 30
  POLL_TIMEOUT: 3600 # 1 hour max per tier
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_SYSHEALTH || secrets.ANTHROPIC_API_KEY }}

jobs:
  # ── TIER 0: Core Libraries ────────────────────────────────────────────────────
  t0:
    name: Tier 0 — Core Libraries
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: inputs.tiers == 'all' || contains(inputs.tiers, '0') || github.event_name == 'schedule'
    outputs:
      results: ${{ steps.poll.outputs.results }}

    steps:
      - name: Checkout PM for health check script
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          sparse-checkout: scripts/agents/

      - name: Claude API health precheck
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          CALLING_WORKFLOW: overnight-agent-orchestrator
        run: |
          source scripts/agents/claude-api-health-precheck.sh
          check_claude_api_health

      - name: Checkout unified-trading-codex (readiness checklists)
        uses: actions/checkout@v4
        with:
          repository: IggyIkenna/unified-trading-codex
          token: ${{ secrets.GH_PAT }}
          path: ../unified-trading-codex

      - name: Prepare readiness context for tier agents
        id: readiness-ctx
        run: |
          CONTEXT_FILE=$(mktemp)
          cat > "$CONTEXT_FILE" << 'READINESS_CONTEXT'
          ABSOLUTE RULE — MAJOR VERSION BUMP PROHIBITION:
          You are NOT permitted to bump any repo's MAJOR version (including 0.x.x → 1.0.0).
          - Do NOT edit pyproject.toml to increase the MAJOR component
          - Do NOT dispatch version-bump events with a higher MAJOR version
          - If a MAJOR bump is needed: stop, report it, do not proceed with the bump
          Only the issue-approval flow (major-bump-issue-handler.yml) may perform MAJOR bumps after human /approve.

          READINESS CONTEXT FOR THIS TIER:
          - Readiness SSOT: unified-trading-codex/10-audit/repos/{repo}.yaml for each repo
          - Before any quickmerge, check the repo's current CR stage and verify you are advancing it correctly
          - After any quickmerge, update unified-trading-codex/10-audit/repos/{repo}.yaml:
            Set cr5_quickmerge.status to "pass" and cr5_quickmerge.branch to the branch name.
            Commit the update to unified-trading-codex with:
            git -C ../unified-trading-codex add 10-audit/repos/{repo}.yaml &&
            git -C ../unified-trading-codex commit -m "chore: update {repo} readiness to CR5"
          - Per-repo semver rules: unified-trading-pm/docs/per-repo-semver-rules.yaml
            Before any bump proposal, read this file and classify the actual change.
          - NEVER set BR8 or v1.0.0 autonomously. Present readiness summary to user.
          - v1.0.0 gate: CR5(main-merged) + DR3 + DR4 + BR2 + BR3 + BR4 + BR8 (no exceptions, ever)
          READINESS_CONTEXT
          echo "context_file=$CONTEXT_FILE" >> $GITHUB_OUTPUT

      - name: Dispatch agent-audit.yml to T0 repos
        id: dispatch
        env:
          REPOS: >-
            unified-api-contracts unified-internal-contracts unified-events-interface unified-cloud-interface
            execution-algo-library matching-engine-library
          # Stagger dispatches to avoid GH API burst limits (1000 queue / 500 concurrent per org)
          DISPATCH_DELAY_SECONDS: "3"
        run: |
          echo "Dispatching to T0 repos (staggered: ${DISPATCH_DELAY_SECONDS}s between dispatches)..."
          RUN_IDS=""
          COUNT=0
          for repo in $REPOS; do
            COUNT=$((COUNT + 1))
            echo "  → $GH_ORG/$repo (#$COUNT)"
            gh workflow run agent-audit.yml \
              --repo "$GH_ORG/$repo" \
              --ref "${{ inputs.agent_ref || 'main' }}" 2>/dev/null || echo "    WARN: dispatch failed for $repo (workflow may not exist yet)"
            # Stagger to avoid burst throttling
            sleep "$DISPATCH_DELAY_SECONDS"
          done
          echo "T0 dispatches sent ($COUNT repos). Waiting 15s for runs to register..."
          sleep 15
          echo "repos=$REPOS" >> $GITHUB_OUTPUT

      - name: Poll T0 runs until complete
        id: poll
        if: inputs.dry_run != 'true'
        env:
          REPOS: ${{ steps.dispatch.outputs.repos }}
        run: |
          RESULTS=""
          for repo in $REPOS; do
            echo "Polling $GH_ORG/$repo..."
            START=$(date +%s)
            STATUS="unknown"
            while true; do
              ELAPSED=$(( $(date +%s) - START ))
              if [ "$ELAPSED" -gt "$POLL_TIMEOUT" ]; then
                STATUS="timeout"
                break
              fi
              RUN_STATUS=$(gh run list \
                --repo "$GH_ORG/$repo" \
                --workflow agent-audit.yml \
                --limit 1 \
                --json status,conclusion \
                --jq '.[0] | "\(.status)/\(.conclusion)"' 2>/dev/null || echo "unknown/unknown")
              RUN_STATUS_PART="${RUN_STATUS%%/*}"
              RUN_CONCLUSION="${RUN_STATUS##*/}"
              if [ "$RUN_STATUS_PART" = "completed" ]; then
                STATUS="$RUN_CONCLUSION"
                break
              fi
              echo "  $repo: $RUN_STATUS — waiting ${POLL_INTERVAL}s..."
              sleep "$POLL_INTERVAL"
            done
            echo "  $repo: $STATUS"
            RESULTS="${RESULTS} ${repo}:${STATUS}"
          done
          echo "results=$RESULTS" >> $GITHUB_OUTPUT
          # Fail tier if any repo failed
          echo "$RESULTS" | grep -q ":failure\|:timeout" && { echo "T0 FAILED: $RESULTS"; exit 1; } || echo "T0 PASSED"

  # ── T0 ESCALATION: Fire immediately if T0 fails ────────────────────────────
  t0-escalation:
    name: T0 Failure Escalation Alert
    runs-on: ubuntu-latest
    needs: [t0]
    if: always() && needs.t0.result == 'failure'

    steps:
      - name: Send T0 failure priority Telegram alert + open GH Issue
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          T0_DETAILS: ${{ needs.t0.outputs.results }}
        run: |
          DATE=$(date +"%Y-%m-%d %H:%M UTC")

          # Priority Telegram — separate from morning summary
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            TEXT="🚨 *T0 FAILURE — Overnight Audit*%0ADate: ${DATE}%0ACore libraries failing: ${T0_DETAILS}%0AT1-T3 results are unreliable.%0A*Immediate action required.*%0ARun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="$TEXT" \
              -d parse_mode="Markdown" > /dev/null 2>&1 || true
          fi

          # Open GH Issue for tracking
          ISSUE_URL=$(gh issue create \
            --repo IggyIkenna/unified-trading-pm \
            --title "Overnight T0 failure: ${DATE}" \
            --label "critical-audit-failure" \
            --body "## T0 Core Library Failure

          Overnight audit detected T0 failures at ${DATE}.

          **Failing repos/results:** \`${T0_DETAILS}\`

          T1, T2, T3 tiers were skipped because they depend on T0 passing.
          Results from T1-T3 in any prior run are now unreliable until T0 is green.

          ### Action required
          1. Check the failing repos' quality-gates output in the run link below
          2. Fix the root cause in the failing repo(s)
          3. Run overnight orchestrator again manually after fixing

          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            2>/dev/null || echo "")

          echo "T0 escalation complete. Issue: ${ISSUE_URL:-N/A}"

  # ── TIER 1: Contract + Config Tier ───────────────────────────────────────────
  t1:
    name: Tier 1 — Contracts & Config
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [t0]
    if:
      always() && (needs.t0.result == 'success') && (inputs.tiers == 'all' || contains(inputs.tiers, '1') ||
      github.event_name == 'schedule')
    outputs:
      results: ${{ steps.poll.outputs.results }}

    steps:
      - name: Checkout unified-trading-codex (readiness checklists)
        uses: actions/checkout@v4
        with:
          repository: IggyIkenna/unified-trading-codex
          token: ${{ secrets.GH_PAT }}
          path: ../unified-trading-codex

      - name: Prepare readiness context for tier agents
        id: readiness-ctx
        run: |
          CONTEXT_FILE=$(mktemp)
          cat > "$CONTEXT_FILE" << 'READINESS_CONTEXT'
          ABSOLUTE RULE — MAJOR VERSION BUMP PROHIBITION:
          You are NOT permitted to bump any repo's MAJOR version (including 0.x.x → 1.0.0).
          - Do NOT edit pyproject.toml to increase the MAJOR component
          - Do NOT dispatch version-bump events with a higher MAJOR version
          - If a MAJOR bump is needed: stop, report it, do not proceed with the bump
          Only the issue-approval flow (major-bump-issue-handler.yml) may perform MAJOR bumps after human /approve.

          READINESS CONTEXT FOR THIS TIER:
          - Readiness SSOT: unified-trading-codex/10-audit/repos/{repo}.yaml for each repo
          - Before any quickmerge, check the repo's current CR stage and verify you are advancing it correctly
          - After any quickmerge, update unified-trading-codex/10-audit/repos/{repo}.yaml:
            Set cr5_quickmerge.status to "pass" and cr5_quickmerge.branch to the branch name.
            Commit the update to unified-trading-codex with:
            git -C ../unified-trading-codex add 10-audit/repos/{repo}.yaml &&
            git -C ../unified-trading-codex commit -m "chore: update {repo} readiness to CR5"
          - Per-repo semver rules: unified-trading-pm/docs/per-repo-semver-rules.yaml
            Before any bump proposal, read this file and classify the actual change.
          - NEVER set BR8 or v1.0.0 autonomously. Present readiness summary to user.
          - v1.0.0 gate: CR5(main-merged) + DR3 + DR4 + BR2 + BR3 + BR4 + BR8 (no exceptions, ever)
          READINESS_CONTEXT
          echo "context_file=$CONTEXT_FILE" >> $GITHUB_OUTPUT

      - name: Dispatch agent-audit.yml to T1 repos
        id: dispatch
        env:
          REPOS: >-
            unified-reference-data-interface unified-config-interface unified-trading-library
          DISPATCH_DELAY_SECONDS: "3"
        run: |
          echo "Dispatching to T1 repos (staggered: ${DISPATCH_DELAY_SECONDS}s between dispatches)..."
          for repo in $REPOS; do
            echo "  → $GH_ORG/$repo"
            gh workflow run agent-audit.yml \
              --repo "$GH_ORG/$repo" \
              --ref "${{ inputs.agent_ref || 'main' }}" 2>/dev/null || echo "    WARN: dispatch failed for $repo"
            sleep "$DISPATCH_DELAY_SECONDS"
          done
          sleep 15
          echo "repos=$REPOS" >> $GITHUB_OUTPUT

      - name: Poll T1 runs until complete
        id: poll
        if: inputs.dry_run != 'true'
        env:
          REPOS: ${{ steps.dispatch.outputs.repos }}
        run: |
          RESULTS=""
          for repo in $REPOS; do
            START=$(date +%s)
            STATUS="unknown"
            while true; do
              [ $(( $(date +%s) - START )) -gt "$POLL_TIMEOUT" ] && { STATUS="timeout"; break; }
              RUN_STATUS=$(gh run list --repo "$GH_ORG/$repo" --workflow agent-audit.yml --limit 1 --json status,conclusion --jq '.[0] | "\(.status)/\(.conclusion)"' 2>/dev/null || echo "unknown/unknown")
              [ "${RUN_STATUS%%/*}" = "completed" ] && { STATUS="${RUN_STATUS##*/}"; break; }
              sleep "$POLL_INTERVAL"
            done
            echo "$repo: $STATUS"
            RESULTS="${RESULTS} ${repo}:${STATUS}"
          done
          echo "results=$RESULTS" >> $GITHUB_OUTPUT
          echo "$RESULTS" | grep -q ":failure\|:timeout" && { echo "T1 FAILED: $RESULTS"; exit 1; } || echo "T1 PASSED"

  # ── TIER 2: Interface Libraries ───────────────────────────────────────────────
  t2:
    name: Tier 2 — Interface Libraries
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [t1]
    if:
      always() && (needs.t1.result == 'success') && (inputs.tiers == 'all' || contains(inputs.tiers, '2') ||
      github.event_name == 'schedule')
    outputs:
      results: ${{ steps.poll.outputs.results }}

    steps:
      - name: Checkout unified-trading-codex (readiness checklists)
        uses: actions/checkout@v4
        with:
          repository: IggyIkenna/unified-trading-codex
          token: ${{ secrets.GH_PAT }}
          path: ../unified-trading-codex

      - name: Prepare readiness context for tier agents
        id: readiness-ctx
        run: |
          CONTEXT_FILE=$(mktemp)
          cat > "$CONTEXT_FILE" << 'READINESS_CONTEXT'
          ABSOLUTE RULE — MAJOR VERSION BUMP PROHIBITION:
          You are NOT permitted to bump any repo's MAJOR version (including 0.x.x → 1.0.0).
          - Do NOT edit pyproject.toml to increase the MAJOR component
          - Do NOT dispatch version-bump events with a higher MAJOR version
          - If a MAJOR bump is needed: stop, report it, do not proceed with the bump
          Only the issue-approval flow (major-bump-issue-handler.yml) may perform MAJOR bumps after human /approve.

          READINESS CONTEXT FOR THIS TIER:
          - Readiness SSOT: unified-trading-codex/10-audit/repos/{repo}.yaml for each repo
          - Before any quickmerge, check the repo's current CR stage and verify you are advancing it correctly
          - After any quickmerge, update unified-trading-codex/10-audit/repos/{repo}.yaml:
            Set cr5_quickmerge.status to "pass" and cr5_quickmerge.branch to the branch name.
            Commit the update to unified-trading-codex with:
            git -C ../unified-trading-codex add 10-audit/repos/{repo}.yaml &&
            git -C ../unified-trading-codex commit -m "chore: update {repo} readiness to CR5"
          - Per-repo semver rules: unified-trading-pm/docs/per-repo-semver-rules.yaml
            Before any bump proposal, read this file and classify the actual change.
          - NEVER set BR8 or v1.0.0 autonomously. Present readiness summary to user.
          - v1.0.0 gate: CR5(main-merged) + DR3 + DR4 + BR2 + BR3 + BR4 + BR8 (no exceptions, ever)
          READINESS_CONTEXT
          echo "context_file=$CONTEXT_FILE" >> $GITHUB_OUTPUT

      - name: Dispatch agent-audit.yml to T2 repos
        id: dispatch
        env:
          REPOS: >-
            unified-feature-calculator-library unified-market-interface unified-ml-interface
            unified-trade-execution-interface unified-sports-execution-interface unified-defi-execution-interface
          DISPATCH_DELAY_SECONDS: "3"
        run: |
          echo "Dispatching to T2 repos (staggered: ${DISPATCH_DELAY_SECONDS}s between dispatches)..."
          for repo in $REPOS; do
            echo "  → $GH_ORG/$repo"
            gh workflow run agent-audit.yml \
              --repo "$GH_ORG/$repo" \
              --ref "${{ inputs.agent_ref || 'main' }}" 2>/dev/null || echo "    WARN: dispatch failed for $repo"
            sleep "$DISPATCH_DELAY_SECONDS"
          done
          sleep 15
          echo "repos=$REPOS" >> $GITHUB_OUTPUT

      - name: Poll T2 runs until complete
        id: poll
        if: inputs.dry_run != 'true'
        env:
          REPOS: ${{ steps.dispatch.outputs.repos }}
        run: |
          RESULTS=""
          for repo in $REPOS; do
            START=$(date +%s)
            STATUS="unknown"
            while true; do
              [ $(( $(date +%s) - START )) -gt "$POLL_TIMEOUT" ] && { STATUS="timeout"; break; }
              RUN_STATUS=$(gh run list --repo "$GH_ORG/$repo" --workflow agent-audit.yml --limit 1 --json status,conclusion --jq '.[0] | "\(.status)/\(.conclusion)"' 2>/dev/null || echo "unknown/unknown")
              [ "${RUN_STATUS%%/*}" = "completed" ] && { STATUS="${RUN_STATUS##*/}"; break; }
              sleep "$POLL_INTERVAL"
            done
            echo "$repo: $STATUS"
            RESULTS="${RESULTS} ${repo}:${STATUS}"
          done
          echo "results=$RESULTS" >> $GITHUB_OUTPUT
          echo "$RESULTS" | grep -q ":failure\|:timeout" && { echo "T2 FAILED: $RESULTS"; exit 1; } || echo "T2 PASSED"

  # ── TIER 3: Domain Client ─────────────────────────────────────────────────────
  t3:
    name: Tier 3 — Domain Client
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [t2]
    if:
      always() && (needs.t2.result == 'success') && (inputs.tiers == 'all' || contains(inputs.tiers, '3') ||
      github.event_name == 'schedule')
    outputs:
      results: ${{ steps.poll.outputs.results }}

    steps:
      - name: Checkout unified-trading-codex (readiness checklists)
        uses: actions/checkout@v4
        with:
          repository: IggyIkenna/unified-trading-codex
          token: ${{ secrets.GH_PAT }}
          path: ../unified-trading-codex

      - name: Prepare readiness context for tier agents
        id: readiness-ctx
        run: |
          CONTEXT_FILE=$(mktemp)
          cat > "$CONTEXT_FILE" << 'READINESS_CONTEXT'
          ABSOLUTE RULE — MAJOR VERSION BUMP PROHIBITION:
          You are NOT permitted to bump any repo's MAJOR version (including 0.x.x → 1.0.0).
          - Do NOT edit pyproject.toml to increase the MAJOR component
          - Do NOT dispatch version-bump events with a higher MAJOR version
          - If a MAJOR bump is needed: stop, report it, do not proceed with the bump
          Only the issue-approval flow (major-bump-issue-handler.yml) may perform MAJOR bumps after human /approve.

          READINESS CONTEXT FOR THIS TIER:
          - Readiness SSOT: unified-trading-codex/10-audit/repos/{repo}.yaml for each repo
          - Before any quickmerge, check the repo's current CR stage and verify you are advancing it correctly
          - After any quickmerge, update unified-trading-codex/10-audit/repos/{repo}.yaml:
            Set cr5_quickmerge.status to "pass" and cr5_quickmerge.branch to the branch name.
            Commit the update to unified-trading-codex with:
            git -C ../unified-trading-codex add 10-audit/repos/{repo}.yaml &&
            git -C ../unified-trading-codex commit -m "chore: update {repo} readiness to CR5"
          - Per-repo semver rules: unified-trading-pm/docs/per-repo-semver-rules.yaml
            Before any bump proposal, read this file and classify the actual change.
          - NEVER set BR8 or v1.0.0 autonomously. Present readiness summary to user.
          - v1.0.0 gate: CR5(main-merged) + DR3 + DR4 + BR2 + BR3 + BR4 + BR8 (no exceptions, ever)
          READINESS_CONTEXT
          echo "context_file=$CONTEXT_FILE" >> $GITHUB_OUTPUT

      - name: Dispatch agent-audit.yml to T3 repos
        id: dispatch
        env:
          REPOS: unified-domain-client
          DISPATCH_DELAY_SECONDS: "3"
        run: |
          echo "Dispatching to T3 repos (staggered: ${DISPATCH_DELAY_SECONDS}s between dispatches)..."
          for repo in $REPOS; do
            echo "  → $GH_ORG/$repo"
            gh workflow run agent-audit.yml \
              --repo "$GH_ORG/$repo" \
              --ref "${{ inputs.agent_ref || 'main' }}" 2>/dev/null || echo "    WARN: dispatch failed for $repo"
            sleep "$DISPATCH_DELAY_SECONDS"
          done
          sleep 15
          echo "repos=$REPOS" >> $GITHUB_OUTPUT

      - name: Poll T3 runs until complete
        id: poll
        if: inputs.dry_run != 'true'
        env:
          REPOS: ${{ steps.dispatch.outputs.repos }}
        run: |
          RESULTS=""
          for repo in $REPOS; do
            START=$(date +%s)
            STATUS="unknown"
            while true; do
              [ $(( $(date +%s) - START )) -gt "$POLL_TIMEOUT" ] && { STATUS="timeout"; break; }
              RUN_STATUS=$(gh run list --repo "$GH_ORG/$repo" --workflow agent-audit.yml --limit 1 --json status,conclusion --jq '.[0] | "\(.status)/\(.conclusion)"' 2>/dev/null || echo "unknown/unknown")
              [ "${RUN_STATUS%%/*}" = "completed" ] && { STATUS="${RUN_STATUS##*/}"; break; }
              sleep "$POLL_INTERVAL"
            done
            echo "$repo: $STATUS"
            RESULTS="${RESULTS} ${repo}:${STATUS}"
          done
          echo "results=$RESULTS" >> $GITHUB_OUTPUT
          echo "$RESULTS" | grep -q ":failure\|:timeout" && { echo "T3 FAILED: $RESULTS"; exit 1; } || echo "T3 PASSED"

  # ── TELEGRAM MORNING SUMMARY ──────────────────────────────────────────────────
  notify:
    name: Telegram Morning Summary
    runs-on: ubuntu-latest
    needs: [t0, t1, t2, t3]
    if: always()

    steps:
      - name: Build and send Telegram summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          T0_RESULT: ${{ needs.t0.result }}
          T1_RESULT: ${{ needs.t1.result }}
          T2_RESULT: ${{ needs.t2.result }}
          T3_RESULT: ${{ needs.t3.result }}
          T0_DETAILS: ${{ needs.t0.outputs.results }}
          T1_DETAILS: ${{ needs.t1.outputs.results }}
          T2_DETAILS: ${{ needs.t2.outputs.results }}
          T3_DETAILS: ${{ needs.t3.outputs.results }}
        run: |
          DATE=$(date +"%Y-%m-%d")
          status_icon() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }

          TEXT="*Overnight QG Report ${DATE}*
          $(status_icon $T0_RESULT) T0 (libraries): ${T0_RESULT}
          $(status_icon $T1_RESULT) T1 (contracts): ${T1_RESULT}
          $(status_icon $T2_RESULT) T2 (interfaces): ${T2_RESULT}
          $(status_icon $T3_RESULT) T3 (domain): ${T3_RESULT}

          Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="${TEXT}" \
              -d parse_mode="Markdown" || true
          else
            echo "Telegram not configured — skipping notification"
            echo "Summary: $TEXT"
          fi
