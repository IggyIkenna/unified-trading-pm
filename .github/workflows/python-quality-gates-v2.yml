name: python-quality-gates-v2

# Reusable workflow — called by all Python service repos.
# V2: escape GitHub ghost-cache bug on the "quality-gates" check context (Option D).
# Job key is "quality-gates-v2" so this registers a fresh check context, bypassing
# GitHub's cached BuildFailed state on the old "quality-gates" context.
#
# Loaded at whatever ref is in the caller's `uses:` line (managed by
# rollout-quality-gates-ci-workflows.py which pins it to active_feature_branch
# from workspace-manifest.json). Inside the job, unified-trading-pm is cloned
# at DEP_BRANCH = github.head_ref || github.ref_name, so base-service.sh always
# runs from the branch that triggered CI.

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version
        type: string
        default: "3.13.9"
      dep_repos:
        description:
          Space-separated list of sibling repos to clone (e.g. "unified-trading-library unified-api-contracts")
        type: string
        default: ""
    outputs:
      metadata_only:
        description: "true when this run fast-pathed a metadata-only commit (chore(release) version bump OR chore(deps) pin)"
        value: ${{ jobs.quality-gates-v2.outputs.metadata_only }}
    secrets:
      GH_PAT:
        required: false
      GCP_PROJECT_ID:
        required: false
      SLACK_WEBHOOK_URL:
        required: false
      SLACK_CI_WEBHOOK_URL:
        required: false

jobs:
  quality-gates-v2:
    runs-on: ubuntu-latest
    outputs:
      # Consumed by the caller (quality-gates-v2.yml) to skip the qg-passed/image dispatch
      # for a metadata-only commit. SSOT: plan semver_version_bump_skip_ci_promotion_block.
      metadata_only: ${{ steps.vcheck.outputs.metadata_only }}
    # Backstop so a hung/runaway QG is killed cleanly (and the failure()||cancelled()
    # notify below fires) instead of silently burning a 6h default + never alerting.
    # 135m covers the slowest repo (execution ~120m tests) + margin; genuinely-slow
    # repos that exceed it get a Slack alert → drives the "speed up / don't time out" fix.
    timeout-minutes: 135
    env:
      CLOUD_MOCK_MODE: "true"
      CLOUD_PROVIDER: "local"
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'test-project' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # depth 2 so the version-only fast-path can diff the pushed commit vs its parent
          fetch-depth: 2

      - name: Detect metadata-only commit (fast-path)
        # A bot metadata commit whose entire diff is pyproject.toml needs NO gate work:
        #   chore(release): bump version to X   (semver-agent — version line)
        #   chore(deps): pin X to Y             (dependency-update minor/patch — dep pin line)
        # Both are trusted no-QG-needed metadata changes (the prior design [skip ci]'d them for
        # exactly that reason); they only need a check to ride the staging→main promotion PR
        # (whose HEAD is this commit) — without one the required `quality-gates-v2` context is
        # MISSING and the PR is permanently BLOCKED. So we DROP [skip ci] (in semver-agent +
        # update-dependency-version) and short-circuit here to GREEN in seconds instead of a
        # wasteful ~12-min run. A MAJOR dep update is a `feat!:` PR with full QG (not matched).
        # push = the auto bump/pin; workflow_dispatch = manual recovery of a stuck head.
        # SSOT: plan semver_version_bump_skip_ci_promotion_block.
        id: vcheck
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          git rev-parse --verify -q "${BEFORE}^{commit}" >/dev/null 2>&1 || BEFORE="HEAD~1"
          if ! git rev-parse --verify -q "${BEFORE}^{commit}" >/dev/null 2>&1; then
            echo "metadata_only=false" >> "$GITHUB_OUTPUT"
            echo "base commit unavailable (shallow / multi-commit push) → full QG"
            exit 0
          fi
          MSG="$(git log -1 --format=%s HEAD)"
          CHANGED="$(git diff --name-only "${BEFORE}" HEAD)"
          META=false
          case "${MSG}" in
            "chore(release): bump version to "*|"chore(deps): pin "*) META=true ;;
          esac
          # metadata-only iff every changed file is pyproject.toml or uv.lock (a dep pin stages
          # both; a version bump only pyproject.toml). Any other path (e.g. a .py) → full QG.
          EXTRA="$(printf '%s\n' "${CHANGED}" | grep -vE '^(pyproject\.toml|uv\.lock)$' || true)"
          if [ "${META}" = true ] && [ -n "${CHANGED}" ] && [ -z "${EXTRA}" ]; then
            echo "metadata_only=true" >> "$GITHUB_OUTPUT"
            echo "✓ metadata-only commit — skipping heavy gates, reporting GREEN: ${MSG}"
          else
            echo "metadata_only=false" >> "$GITHUB_OUTPUT"
            echo "not metadata-only (msg='${MSG}', changed='$(printf '%s' "${CHANGED:-none}" | tr '\n' ' ')') → full QG"
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        shell: bash
        # Pinned for uv.lock determinism — an unpinned uv reformats the lock (revision bump)
        # even with identical deps, so CI's `uv lock --check` would false-fail.
        # SSOT: plans/active/uv_lockfile_determinism_2026_06_02.md
        run: pip install "uv==0.10.8"

      - name: Cache tools (ripgrep, shellcheck, bats, actionlint)
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/act-tools
          key: act-tools-linux-rg14.1.1-sc0.10.0-bats-core-1.12-actionlint1.7.4

      - name: Install ripgrep
        if: steps.tools-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          RG_VER="14.1.1"
          mkdir -p ~/.local/act-tools/bin
          curl -fsSL "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VER}/ripgrep-${RG_VER}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C ~/.local/act-tools/bin "ripgrep-${RG_VER}-x86_64-unknown-linux-musl/rg"

      - name: Install shellcheck
        if: steps.tools-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          SC_VER="v0.10.0"
          mkdir -p ~/.local/act-tools/bin
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SC_VER}/shellcheck-${SC_VER}.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C ~/.local/act-tools/bin "shellcheck-${SC_VER}/shellcheck"

      - name: Install bats-core
        if: steps.tools-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth=1 --branch v1.12.0 https://github.com/bats-core/bats-core.git /tmp/bats-core
          /tmp/bats-core/install.sh ~/.local/act-tools

      - name: Install actionlint
        if: steps.tools-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          AL_VER="1.7.4"
          mkdir -p ~/.local/act-tools/bin
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${AL_VER}/actionlint_${AL_VER}_linux_amd64.tar.gz" \
            | tar -xz -C ~/.local/act-tools/bin actionlint

      - name: Add tools to PATH
        shell: bash
        run: echo "$HOME/.local/act-tools/bin" >> "$GITHUB_PATH"

      - name: Clone unified-trading-pm and dependencies
        if: steps.vcheck.outputs.metadata_only != 'true'
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DEP_BRANCH: ${{ github.head_ref || github.ref_name }}
          # The PR's TARGET tier (staging/main) — empty on a push event. A consumer PR into
          # `staging` must resolve its deps from the deps' `staging` (same promotion tier), else a
          # dep version that has reached the dep's staging but not yet main is unresolvable and the
          # range gate red-herrings (incident 2026-06-09: exec-service PR→staging pinned UAC>=0.5.0
          # which lived only on UAC/staging → clone fell back to main=0.3.0 → false range FAIL).
          DEP_BASE_REF: ${{ github.base_ref }}
          DEP_REPOS: ${{ inputs.dep_repos }}
          SLACK_CI_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
        run: |
          BRANCH="${DEP_BRANCH:-main}"
          BASE_REF="${DEP_BASE_REF:-}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"

          # Version-aware clone: read pyproject.toml constraint for each dep,
          # find the latest git tag matching the constraint, and clone at that tag.
          # Falls back to branch clone if no matching tag exists (pre-tagging era).
          get_version_tag() {
            local name="$1"
            # Read constraint from pyproject.toml (e.g., ">=0.2.0,<0.3.0" → extract upper bound <0.3.0)
            local constraint
            constraint=$(python3 -c "
          import re, sys
          try:
              with open('pyproject.toml') as f:
                  content = f.read()
              m = re.search(r'\"${name}([^\"]+)\"', content.replace('$name', '${name}'))
              if m:
                  spec = m.group(1)
                  # Extract upper bound: <X.Y.Z
                  ub = re.search(r'<(\d+\.\d+\.\d+)', spec)
                  if ub:
                      print(ub.group(1))
          except Exception:
              pass
          " 2>/dev/null || echo "")

            if [ -n "$constraint" ]; then
              # Find latest tag less than the upper bound
              local tag
              tag=$(git ls-remote --tags "https://x-access-token:${GH_PAT}@github.com/${OWNER}/${name}.git" 2>/dev/null \
                | grep -oE 'refs/tags/v?[0-9]+\.[0-9]+\.[0-9]+$' \
                | sed 's|refs/tags/||' \
                | sort -V \
                | python3 -c "
          import sys
          from packaging.version import Version
          upper = Version('${constraint}')
          tags = []
          for line in sys.stdin:
              t = line.strip()
              try:
                  v = Version(t.lstrip('v'))
                  if v < upper:
                      tags.append((v, t))
              except Exception:
                  pass
          if tags:
              tags.sort(key=lambda x: x[0])
              print(tags[-1][1])
          " 2>/dev/null || echo "")
              if [ -n "$tag" ]; then
                echo "$tag"
                return
              fi
            fi
            echo ""
          }

          clone_repo() {
            local name="$1"
            # Try version-aware clone first (Phase 3: version-aware cloning)
            local tag
            tag=$(get_version_tag "$name")
            if [ -n "$tag" ]; then
              echo "Cloning $name at tag $tag (version-aware)"
              git clone -b "$tag" --depth=1 "https://x-access-token:${GH_PAT}@github.com/${OWNER}/${name}.git" "../${name}" && return
              echo "WARN: Tag clone failed for $name@$tag — falling back to branch clone"
            fi
            # Fallback: clone at triggering branch, then main, then the repo's
            # DEFAULT branch. NOT silent — clone failures must be visible (debugged
            # 2026-05-17 trading-agent-service workspace-qg silent fail: '|| true'
            # swallowed real auth/branch errors, surfaced downstream as confusing
            # 'Distribution not found' at uv sync). The default-branch fallback
            # (no -b → remote HEAD) is required for consolidated dep repos that have
            # NO main branch (e.g. features-service default=live-defi-rollout) —
            # without it the hardcoded `-b main` failed with
            # `fatal: Remote branch main not found in upstream origin` → exit 128,
            # which was blocking system-integration-tests' quality-gates-v2 on main
            # (2026-06-01). If even the default-branch clone fails (genuine
            # auth/missing-repo), exit non-zero so the workflow surfaces it.
            echo "Cloning $name at branch $BRANCH (fallback)"
            git clone -b "$BRANCH" "https://x-access-token:${GH_PAT}@github.com/${OWNER}/${name}.git" "../${name}" && return
            # DEFECT-2 fix (2026-06-09): try the consumer-PR's BASE tier (staging/main) BEFORE the
            # manifest-release / main fallbacks. A consumer PR into `staging` is validating against
            # the deps AS THEY WILL BE post-promotion — i.e. the deps' `staging` — so a dep version
            # already on the dep's staging (but not yet main/tagged) must resolve here. Without this
            # the clone fell through to main (older) and the range gate produced a FALSE failure
            # (incident: exec-service PR→staging pinned UAC>=0.5.0, which lived only on UAC/staging).
            # Guard: only when BASE_REF is set (PR event) and differs from the head BRANCH already tried.
            if [ -n "$BASE_REF" ] && [ "$BASE_REF" != "$BRANCH" ]; then
              echo "WARN: Branch '$BRANCH' clone failed for $name — trying PR base tier '$BASE_REF' (same-tier dep resolution)"
              git clone -b "$BASE_REF" --depth=1 "https://x-access-token:${GH_PAT}@github.com/${OWNER}/${name}.git" "../${name}" && return
              echo "WARN: base-tier '$BASE_REF' clone failed for $name — trying manifest released version"
            fi
            # issue#2: DEP_BRANCH absent in this dep + no constraint-derived tag → use the dep's
            # CURRENT RELEASED version from the manifest (explicit, tested version) BEFORE falling
            # to `main` HEAD (which can be ahead of the release → tests an unpublished version).
            local mf mver
            mf="../unified-trading-pm/workspace-manifest.json"; [ -f "$mf" ] || mf="workspace-manifest.json"
            mver=$(python3 -c "import json,sys; print(json.load(open('$mf')).get('versions',{}).get('$name','') or '')" 2>/dev/null || echo "")
            if [ -n "$mver" ]; then
              echo "WARN: Branch '$BRANCH' clone failed for $name — trying manifest released version v$mver (explicit)"
              git clone -b "v$mver" --depth=1 "https://x-access-token:${GH_PAT}@github.com/${OWNER}/${name}.git" "../${name}" && return
              echo "WARN: manifest version tag v$mver clone failed for $name — trying main"
            else
              echo "WARN: Branch '$BRANCH' clone failed for $name — no manifest version; trying main"
            fi
            git clone -b main "https://x-access-token:${GH_PAT}@github.com/${OWNER}/${name}.git" "../${name}" && return
            echo "WARN: 'main' clone failed for $name (repo may have no main branch) — falling back to its default branch"
            git clone "https://x-access-token:${GH_PAT}@github.com/${OWNER}/${name}.git" "../${name}"
          }
          # Clone PM (base-service.sh lives here) — skip if running in PM itself
          # (checkout already placed the repo at ../unified-trading-pm, so a second
          # clone would fail with "already exists and is not an empty directory").
          if [ "${GITHUB_REPOSITORY}" = "${OWNER}/unified-trading-pm" ]; then
            echo "Running in unified-trading-pm — skipping self-clone (checkout already placed it)"
          else
            clone_repo unified-trading-pm
          fi
          assert_dep_in_range() {
            # Defense-in-depth (2026-06-09): after cloning a dep, FAIL LOUD if the cloned
            # version does NOT satisfy this repo's full constraint RANGE (>=floor,<upper).
            # The version-aware clone + its branch/main fallbacks can silently land on a stale
            # LOWER version (e.g. a force-sync-reverted / unpublished source) that violates the
            # pin — that produced the UTL-0.4.0 phantom (uv surfaced a cryptic "No solution
            # found" much later). We honor the RANGE (floor AND upper), never an exact tag, and
            # surface it HERE with a clear message + a #ci-failures Slack alert.
            local name="$1"
            [ -f "../${name}/pyproject.toml" ] || return 0
            local verdict
            # STDLIB ONLY — this step runs BEFORE `uv sync`, so `packaging` is NOT installed;
            # importing it here silently fails (the get_version_tag fallback bug). Tuple compare.
            verdict=$(DEP_NAME="$name" DEP_PYPROJECT="../${name}/pyproject.toml" python3 -c "
          import os, re
          def _v(s):
              return tuple(int(re.match(r'[0-9]+', p).group()) for p in s.split('.') if re.match(r'[0-9]+', p))
          def _lt(a, b):
              ta, tb = _v(a), _v(b); n = max(len(ta), len(tb))
              return ta + (0,)*(n-len(ta)) < tb + (0,)*(n-len(tb))
          name = os.environ['DEP_NAME']
          consumer = open('pyproject.toml').read()
          m = re.search(r'\"' + re.escape(name) + r'([^\"]*)\"', consumer)
          if not m:
              print('OK no-constraint'); raise SystemExit
          spec = m.group(1)
          lb = re.search(r'>=\s*([0-9]+\.[0-9]+\.[0-9]+)', spec)
          ub = re.search(r'<\s*([0-9]+\.[0-9]+\.[0-9]+)', spec)
          dm = re.search(r'^version\s*=\s*\"([^\"]+)\"', open(os.environ['DEP_PYPROJECT']).read(), re.M)
          if not dm:
              print('OK no-dep-version'); raise SystemExit
          ver = dm.group(1)
          if lb and _lt(ver, lb.group(1)):
              print(f'FAIL resolved {ver} < floor {lb.group(1)} (pin {spec.strip()})'); raise SystemExit
          if ub and not _lt(ver, ub.group(1)):
              print(f'FAIL resolved {ver} >= upper {ub.group(1)} (pin {spec.strip()})'); raise SystemExit
          print(f'OK {ver} satisfies {spec.strip()}')
          " 2>/dev/null || echo "OK parse-error")
            case "$verdict" in
              FAIL*)
                echo "::error::dependency ${name}: ${verdict#FAIL } — version-aware clone landed OUTSIDE the pinned range"
                if [ -n "${SLACK_CI_WEBHOOK_URL:-}" ]; then
                  MSG=":rotating_light: *QG dep-pin UNRESOLVABLE* — \`${GITHUB_REPOSITORY}\` on \`${BRANCH}\`: dependency \`${name}\` ${verdict#FAIL }. The version-aware clone fell back to a version OUTSIDE the pinned range (force-sync-reverted / unpublished version — the UTL-0.4.0 phantom class). Fix: publish the pinned version, or run assert_version_coherence.py. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                  BODY=$(MSG="$MSG" python3 -c 'import json,os; print(json.dumps({"text": os.environ["MSG"]}))')
                  curl -s -X POST "${SLACK_CI_WEBHOOK_URL}" -H "Content-Type: application/json" -d "${BODY}" >/dev/null && echo "Slack alert sent to #ci-failures" || true
                fi
                exit 1
                ;;
              *) echo "dep ${name}: ${verdict}" ;;
            esac
          }
          # Clone declared deps, then assert each satisfies its pinned RANGE (loud-fail, no silent stale)
          for repo in $DEP_REPOS; do
            clone_repo "$repo"
            assert_dep_in_range "$repo"
          done

      - name: Install dependencies
        if: steps.vcheck.outputs.metadata_only != 'true'
        shell: bash
        env:
          DEP_REPOS: ${{ inputs.dep_repos }}
        run: |
          uv venv .venv
          uv sync
          # Install test-only sibling deps that were cloned (DEP_REPOS) but are NOT in
          # [project.dependencies], so `uv sync` skips them — e.g. deployment-api for
          # deployment-service (a test-only peer; tests import deployment_api, but it was
          # dropped from pyproject to break the deployment-api<->deployment-service circular
          # dep + fix dependency-alignment). The local `quality-gates.sh` installs these via
          # its LOCAL_DEPS block, but that block is guarded `if [ -z GITHUB_ACTIONS ]` (= CI
          # has its own setup) — so in CI nothing installed the sibling clone → conftest
          # ImportError. The `uv pip show` guard makes this a strict NO-OP for every normal
          # pyproject dep (already installed by uv sync); it only installs a genuinely-missing
          # cloned peer, into the same .venv used by the gate step below.
          for dep in $DEP_REPOS; do
            if [ -d "../$dep" ] && ! uv pip show "$dep" >/dev/null 2>&1; then
              echo "Installing test-only sibling dep not in pyproject: ../$dep"
              uv pip install -e "../$dep" || echo "WARN: editable install of ../$dep failed (non-fatal)"
            fi
          done

      - name: Run quality gates
        if: steps.vcheck.outputs.metadata_only != 'true'
        shell: bash
        run: |
          export PATH="$(pwd)/.venv/bin:$PATH"
          set -o pipefail
          # cloud-providers.yaml SSOT for tests: deployment-service (canonical) is absent in
          # per-repo CI, so unified_trading_library.cloud_interface.bucket_naming can't locate
          # the workspace root via its sibling-deployment-service probe → any test that resolves
          # a bucket raises BucketNamingError ("SSOT not found"). PM (always cloned to
          # ../unified-trading-pm above) ships a HARDCODED test SSOT derived from the canonical
          # (env templates pre-substituted with test values, so it resolves with NO GCP_PROJECT_ID
          # / DEPLOYMENT_ENV_SHORT set). Point the documented env override at it so EVERY repo's
          # tests resolve buckets without a per-repo fixture. Only set when present + unset.
          if [ -z "${UNIFIED_TRADING_CLOUD_PROVIDERS_YAML:-}" ]; then
            _cp_yaml="$(cd "$(git rev-parse --show-toplevel)/.." && pwd)/unified-trading-pm/scripts/quality-gates-base/ci-test-cloud-providers.yaml"
            [ -f "$_cp_yaml" ] && export UNIFIED_TRADING_CLOUD_PROVIDERS_YAML="$_cp_yaml" \
              && echo "ci: UNIFIED_TRADING_CLOUD_PROVIDERS_YAML -> $_cp_yaml (PM CI test SSOT)"
          fi
          bash scripts/quality-gates.sh --no-fix 2>&1 | tee /tmp/qg_output.log

      - name: Record CI status (branch-aware lifecycle)
        if: always()
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TRIGGER_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          [ -z "${GH_PAT}" ] && echo "GH_PAT not set — skipping ci-status-update" && exit 0

          # Determine ci_status based on job result AND which branch triggered.
          # Branch→status mapping mirrors the ci_status lifecycle in ci-status-update.yml:
          #   main    → MAIN_GREEN  (dep-on-main gate signal for staging-to-main STAGE 1.8)
          #   staging → STAGING_GREEN
          #   other   → FEATURE_GREEN
          if [ "${{ job.status }}" != "success" ]; then
            STATUS="FAILING"
          elif [ "$TRIGGER_BRANCH" = "main" ]; then
            STATUS="MAIN_GREEN"
          elif [ "$TRIGGER_BRANCH" = "staging" ]; then
            STATUS="STAGING_GREEN"
          else
            STATUS="FEATURE_GREEN"
          fi

          # Capture failure excerpt (last 30 lines, ANSI-stripped, ~1500 char cap, base64 for JSON
          # transport). Empty on pass; receiver only renders when STATUS=FAILING.
          EXCERPT_B64=""
          if [ "${STATUS}" = "FAILING" ] && [ -f /tmp/qg_output.log ]; then
            EXCERPT_B64=$(sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' /tmp/qg_output.log | tail -n 30 | head -c 1500 | base64 | tr -d '\n')
          fi

          echo "Recording ci_status=${STATUS} for ${GITHUB_REPOSITORY#*/} (branch=${TRIGGER_BRANCH})"
          curl -s -X POST \
            -H "Authorization: token ${GH_PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/unified-trading-pm/dispatches" \
            -d "{\"event_type\": \"ci-status-update\", \"client_payload\": {\"repo\": \"${GITHUB_REPOSITORY#*/}\", \"status\": \"${STATUS}\", \"branch\": \"${TRIGGER_BRANCH}\", \"sha\": \"${GITHUB_SHA}\", \"failure_excerpt_b64\": \"${EXCERPT_B64}\"}}"

      # Fires on FAILURE *and* CANCELLED (timeout / OOM-kill / concurrency-cancel) so a job
      # that dies before reaching here never fails silently — the #1 robustness gap. The body
      # is built with python json.dumps so an excerpt containing "/\/newlines can't produce
      # an `invalid_payload` (the prior raw-interpolation bug).
      - name: Notify #ci-failures on failure or cancel
        if: failure() || cancelled()
        env:
          SLACK_CI_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "${SLACK_CI_WEBHOOK_URL}" ] && echo "SLACK_CI_WEBHOOK_URL not set — skipping" && exit 0
          SHORT_SHA="${SHA:0:7}"
          REPO_NAME="${REPO#*/}"
          if [ "${EVENT}" = "pull_request" ] && [ -n "${PR_NUMBER}" ]; then
            CONTEXT="PR <${PR_URL}|#${PR_NUMBER}> \`${SOURCE_BRANCH}\` → \`${TARGET_BRANCH}\`"
          else
            CONTEXT="push to \`${TARGET_BRANCH}\`"
          fi
          # cancelled() => timeout / OOM / concurrency-cancel (no QG log to excerpt).
          if [ "${JOB_STATUS}" = "cancelled" ]; then
            HEADER=":warning: *QG CANCELLED / TIMED-OUT* (timeout-minutes hit, OOM, or cancel)"
            EXCERPT=""
          else
            HEADER=":x: *QG FAILED*"
            EXCERPT=""
            [ -f /tmp/qg_output.log ] && EXCERPT=$(sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' /tmp/qg_output.log | grep -E "FAILED|ERROR|error|assert" | tail -5 | head -c 300)
          fi
          TEXT="${HEADER} | *${REPO_NAME}* | ${CONTEXT} | <${RUN_URL}|sha \`${SHORT_SHA}\`>"
          [ -n "${EXCERPT}" ] && TEXT="${TEXT}"$'\n'"\`\`\`${EXCERPT}\`\`\`"
          # json.dumps guarantees a valid payload regardless of excerpt contents.
          BODY=$(TEXT="${TEXT}" python3 -c 'import json,os; print(json.dumps({"text": os.environ["TEXT"]}))')
          curl -s -X POST "${SLACK_CI_WEBHOOK_URL}" -H "Content-Type: application/json" -d "${BODY}"
          echo "Slack notification sent to #ci-failures (status=${JOB_STATUS})"
