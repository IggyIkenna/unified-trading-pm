name: SIT Debounce Trigger
# Waits for a quiet period (no new staging merges for 60s) before triggering SIT.
# Batches multiple rapid staging merges into a single SIT run.
#
# Debounce logic:
#   1. Compare staging_versions vs versions for pending repos
#   2. If staging is already locked (SIT running), skip — but track pending repos
#   3. Check last staging-related commit timestamp (proxy for last staging merge)
#   4. If quiet for >= 60s, dispatch sit-gate.yml to start SIT
#
# Pending repo tracking:
#   staging_status.pending_repos[] is populated by sit-gate.yml on lock.
#   This workflow reads it to determine what to batch into the next SIT run.
#
# Retry tracking:
#   staging_status.sit_retry_count increments each time SIT is re-triggered
#   after a failure. Max retries (default 3) prevents infinite SIT loops.

on:
  schedule:
    # GitHub Actions never runs scheduled jobs more often than every 5 minutes, so
    # */2 was misleading (silently coalesced to ~*/5). The real low-latency trigger
    # is the repository_dispatch below; this cron is only a fallback poll.
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [staging-changed]
  workflow_dispatch:
    inputs:
      drain_pending:
        description: "Force-drain all pending repos into a SIT run (ignores debounce, resets retry counter)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  # manifest-mutating workflow → share the manifest-update group (cancel-in-progress:false) so it
  # serialises with every other manifest writer (sit-gate/staging-to-main/ci-status-*) and cannot
  # silently lose an update (finding H2). Was the per-poller `sit-debounce-check` group.
  group: manifest-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PM repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 20

      - name: Check debounce window
        id: check
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          DEBOUNCE_SECONDS: "60"
          MAX_SIT_RETRIES: "3"
          DRAIN_PENDING: ${{ github.event.inputs.drain_pending || 'false' }}
        run: |
          set -euo pipefail

          python3 - <<'PYEOF'
          import json, sys, subprocess, os
          from datetime import datetime, timezone

          debounce_seconds = int(os.environ.get("DEBOUNCE_SECONDS", "60"))
          max_sit_retries = int(os.environ.get("MAX_SIT_RETRIES", "3"))
          drain_pending = os.environ.get("DRAIN_PENDING", "false") == "true"

          with open("workspace-manifest.json") as f:
              m = json.load(f)

          staging_status = m.get("staging_status", {})
          staging_versions = m.get("staging_versions", {})
          stable_versions = m.get("versions", {})

          # Repos that promote LDR→main DIRECTLY (Option B) have no staging branch, so their
          # staging_versions entry is vestigial and can never converge to versions — leaving them
          # in pending_repos makes them a PERMANENT phantom that keeps the staging lock from ever
          # clearing (unified-trading-pm: staging 1.2.12 vs stable 1.2.24, never reconciles).
          # agent-orchestrator is mid-migration (staging 0.8.1 vs stable 0.8.0, no
          # version-reconciliation flow yet) → same phantom class; exclude until G6 lands.
          STAGING_EXCLUDED_REPOS = {"unified-trading-pm", "agent-orchestrator"}

          # Find repos with pending staging changes (staging_versions != versions)
          pending = []
          for repo, sv in staging_versions.items():
              if repo.startswith("_") or repo in STAGING_EXCLUDED_REPOS:
                  continue
              if sv != stable_versions.get(repo):
                  pending.append(repo)

          if not pending:
              print("No pending staging changes — nothing to trigger")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("trigger=false\n")
              sys.exit(0)

          print(f"Pending staging repos ({len(pending)}): {', '.join(pending)}")

          # Check SIT retry counter
          sit_retry_count = staging_status.get("sit_retry_count", 0)

          if drain_pending:
              print(f"DRAIN MODE: force-triggering SIT, resetting retry counter (was {sit_retry_count})")
              sit_retry_count = 0
          elif sit_retry_count >= max_sit_retries:
              print(f"SIT retry count ({sit_retry_count}) >= max ({max_sit_retries}) — halting auto-retrigger")
              print("Use workflow_dispatch with drain_pending=true to force a SIT run and reset counter")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("trigger=false\n")
                  f.write(f"halted=true\n")
                  f.write(f"retry_count={sit_retry_count}\n")
              sys.exit(0)

          # Check if staging is locked. Distinguish an ACTIVE sit-gate run (locked_reason
          # "SIT running" — skip to avoid double-triggering a SIT already in flight) from a
          # CASCADE lock set by update-repo-version on a breaking/major bump (locked_reason
          # "...bump cascade..."). A cascade lock MUST still trigger the SIT — the SIT is what
          # validates the pending repos, promotes them, and CLEARS the cascade lock. The old
          # unconditional skip meant no SIT ever ran while a cascade lock was held, so the lock
          # dangled forever (the fleet-wide staging→main deadlock this fixes).
          lock_reason = staging_status.get("locked_reason", "") or ""
          is_active_sit_run = "SIT running" in lock_reason
          if staging_status.get("locked", False) and is_active_sit_run and not drain_pending:
              print("SIT is locked (sit-gate run already in progress) — skipping debounce trigger")
              # Still update pending_repos in manifest for visibility
              staging_status["pending_repos"] = pending
              m["staging_status"] = staging_status
              tmp_path = "workspace-manifest.json.tmp"
              with open(tmp_path, "w") as f:
                  json.dump(m, f, indent=2, ensure_ascii=False)
                  f.write("\n")
              import os as _os
              _os.replace(tmp_path, "workspace-manifest.json")
              print(f"Updated staging_status.pending_repos with {len(pending)} repos (for next SIT batch)")

              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("trigger=false\n")
                  f.write("manifest_changed=true\n")
              sys.exit(0)

          # Check quiet period (skip if drain mode)
          if not drain_pending:
              result = subprocess.run(
                  ["git", "log", "-1", "--format=%ct",
                   "--grep=staging", "--grep=manifest", "--all-match",
                   "--", "workspace-manifest.json"],
                  capture_output=True, text=True
              )
              last_staging_ts = result.stdout.strip()

              if not last_staging_ts:
                  result = subprocess.run(
                      ["git", "log", "-1", "--format=%ct", "--", "workspace-manifest.json"],
                      capture_output=True, text=True
                  )
                  last_staging_ts = result.stdout.strip()

              if last_staging_ts:
                  last_ts = int(last_staging_ts)
                  now_ts = int(datetime.now(timezone.utc).timestamp())
                  age = now_ts - last_ts
                  print(f"Last staging manifest commit: {age}s ago (threshold: {debounce_seconds}s)")

                  if age < debounce_seconds:
                      print(f"Still within debounce window ({age}s < {debounce_seconds}s) — waiting")
                      with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                          f.write("trigger=false\n")
                      sys.exit(0)
                  else:
                      print(f"Quiet for {age}s >= {debounce_seconds}s — triggering SIT")
              else:
                  print("No manifest commits found — triggering SIT as fallback")

          # Update manifest: record pending_repos and increment retry counter
          staging_status["pending_repos"] = pending
          staging_status["sit_retry_count"] = sit_retry_count + 1
          m["staging_status"] = staging_status
          tmp_path = "workspace-manifest.json.tmp"
          with open(tmp_path, "w") as f:
              json.dump(m, f, indent=2, ensure_ascii=False)
              f.write("\n")
          import os as _os
          _os.replace(tmp_path, "workspace-manifest.json")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("trigger=true\n")
              f.write(f"pending_count={len(pending)}\n")
              f.write(f"pending_repos={','.join(pending)}\n")
              f.write(f"sit_retry_count={sit_retry_count + 1}\n")
              f.write("manifest_changed=true\n")
          PYEOF

      - name: Commit manifest updates (pending_repos tracking)
        if: steps.check.outputs.manifest_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet workspace-manifest.json; then
            echo "No manifest changes. Skipping commit."
            exit 0
          fi

          git add workspace-manifest.json
          git commit -m "chore(manifest): update staging_status.pending_repos [skip ci]"
          # Retry-with-rebase (finding H2): a concurrent manifest writer can land on main between our
          # checkout and push; a bare push then fails non-fast-forward and the update is lost. Rebase + retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed manifest update (attempt ${attempt})."
              break
            fi
            echo "Push rejected (attempt ${attempt}); rebasing onto origin/main and retrying."
            git pull --rebase --autostash origin main
            if [ "${attempt}" = "5" ]; then
              echo "FATAL: could not push manifest update after 5 attempts."
              exit 1
            fi
          done

      - name: Trigger SIT
        if: steps.check.outputs.trigger == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          PENDING="${{ steps.check.outputs.pending_repos }}"
          COUNT="${{ steps.check.outputs.pending_count }}"
          RETRY="${{ steps.check.outputs.sit_retry_count }}"

          echo "Triggering SIT after debounce quiet period"
          echo "Pending repos ($COUNT): $PENDING"
          echo "SIT retry count: $RETRY"

          # Dispatch to system-integration-tests to start SIT
          OWNER="${{ github.repository_owner }}"
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER}/system-integration-tests/dispatches" \
            -d "{\"event_type\": \"staging-changed\", \"client_payload\": {\"reason\": \"debounce-trigger\", \"pending_repos\": \"${PENDING}\", \"sit_retry_count\": ${RETRY}}}"

          echo "SIT triggered after quiet period (${COUNT} pending repos, retry #${RETRY})"

          echo "SIT dispatch complete"

  # ── SLACK NOTIFY — SIT triggered (reusable workflow) ──────────────────
  notify-sit-triggered:
    name: Slack — SIT Debounce Triggered
    needs: [check-and-trigger]
    if: always() && needs.check-and-trigger.result == 'success'
    uses: ./.github/workflows/notify-slack.yml
    with:
      message: "SIT Debounce Triggered — quiet period elapsed, starting SIT run."
      severity: "INFO"
      conclusion: ${{ needs.check-and-trigger.result }}
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets: inherit

  persist:
    name: Persist — SIT Debounce Event
    needs: [check-and-trigger, notify-sit-triggered]
    if: always()
    uses: ./.github/workflows/persist-cicd-event.yml
    secrets: inherit
    with:
      repo_name: unified-trading-pm
      workflow_name: ${{ github.workflow }}
      run_id: ${{ github.run_id }}
      conclusion: ${{ needs.check-and-trigger.result }}
      branch: ${{ github.ref_name }}
      commit_sha: ${{ github.sha }}
      details_json: '{"event": "sit-debounce-trigger"}'
