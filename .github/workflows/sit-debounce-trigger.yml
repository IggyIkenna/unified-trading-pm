name: SIT Debounce Trigger
# Waits for a quiet period (no new staging merges for 60s) before triggering SIT.
# Batches multiple rapid staging merges into a single SIT run.
#
# 2026-06-27: sit-starvation-detector.yml FOLDED IN here (sprawl consolidation).
# The check-stale-lock job (starvation detection) now runs on this */5 schedule,
# replacing the separate 30-min starvation cron. One fewer workflow.
#
# Debounce logic:
#   1. Compare staging_versions vs versions for pending repos
#   2. If staging is already locked (SIT running), skip — but track pending repos
#   3. Check last staging-related commit timestamp (proxy for last staging merge)
#   4. If quiet for >= 60s, dispatch sit-gate.yml to start SIT
#
# Starvation logic (check-stale-lock job):
#   - Runs in parallel with check-and-trigger on every tick
#   - If staging lock is >25 min old: auto-remediates (re-dispatches this workflow) + alerts Slack
#
# Pending repo tracking:
#   staging_status.pending_repos[] is populated by sit-gate.yml on lock.
#   This workflow reads it to determine what to batch into the next SIT run.
#
# Retry tracking:
#   staging_status.sit_retry_count increments each time SIT is re-triggered
#   after a failure. Max retries (default 3) prevents infinite SIT loops.

on:
  schedule:
    # GitHub Actions never runs scheduled jobs more often than every 5 minutes, so
    # */2 was misleading (silently coalesced to ~*/5). The real low-latency trigger
    # is the repository_dispatch below; this cron is only a fallback poll.
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [staging-changed]
  workflow_dispatch:
    inputs:
      drain_pending:
        description: "Force-drain all pending repos into a SIT run (ignores debounce, resets retry counter)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  # OWN group (2026-06-10) — de-grouped from the shared `manifest-update` group. Sharing it let the
  # near-continuous `ci-status-update` DISPLACE this workflow: GitHub keeps at most ONE queued run per
  # concurrency group, so each ci-status arrival cancelled the pending sit-debounce run (live evidence:
  # the 08:33Z run `completed/cancelled`). That starved the ONLY staging-unlock mechanism and a cascade
  # lock dangled ~1.5h (2026-06-10). Identical defect + fix as `staging-to-main` (its own group). Manifest
  # -write safety here is preserved by the 5-attempt rebase-retry loop in the commit step below, NOT by
  # group serialisation — so de-grouping cannot silently lose an update (a concurrent writer just forces
  # one rebase-retry). NEVER re-fold into `manifest-update`.
  group: sit-debounce-trigger
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-and-trigger:
    # CI-cost B1: off billed hosted minutes onto the self-hosted glue pool. Labels are a SUBSET
    # match, so [self-hosted, glue] lands ONLY on the JIT-ephemeral pool — never on glue-writer.
    # SSOT: scripts/self-hosted-runners/README.md
    runs-on: [self-hosted, glue]
    steps:
      - name: Checkout PM repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 20

      - name: Check debounce window
        id: check
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          DEBOUNCE_SECONDS: "60"
          MAX_SIT_RETRIES: "3"
          DRAIN_PENDING: ${{ github.event.inputs.drain_pending || 'false' }}
        run: |
          set -euo pipefail

          python3 - <<'PYEOF'
          import json, sys, subprocess, os
          from datetime import datetime, timezone

          debounce_seconds = int(os.environ.get("DEBOUNCE_SECONDS", "60"))
          max_sit_retries = int(os.environ.get("MAX_SIT_RETRIES", "3"))
          drain_pending = os.environ.get("DRAIN_PENDING", "false") == "true"

          with open("workspace-manifest.json") as f:
              m = json.load(f)

          staging_status = m.get("staging_status", {})
          staging_versions = m.get("staging_versions", {})
          stable_versions = m.get("versions", {})

          # Repos that promote LDR→main DIRECTLY (Option B) have no staging branch, so their
          # staging_versions entry is vestigial and can never converge to versions — leaving them
          # in pending_repos makes them a PERMANENT phantom that keeps the staging lock from ever
          # clearing (unified-trading-pm: staging 1.2.12 vs stable 1.2.24, never reconciles).
          # agent-orchestrator is mid-migration (staging 0.8.1 vs stable 0.8.0, no
          # version-reconciliation flow yet) → same phantom class; exclude until G6 lands.
          STAGING_EXCLUDED_REPOS = {"unified-trading-pm", "agent-orchestrator"}

          # Find repos with pending staging changes (staging_versions != versions)
          pending = []
          for repo, sv in staging_versions.items():
              if repo.startswith("_") or repo in STAGING_EXCLUDED_REPOS:
                  continue
              if sv != stable_versions.get(repo):
                  pending.append(repo)

          if not pending:
              print("No pending staging changes — nothing to trigger")
              # ── Auto-clear a DANGLING cascade lock (ROOT FIX 2026-06-09) ──
              # A breaking-bump lock (locked_reason "...bump cascade...") set by update-repo-version
              # only clears via SIT-validate or sit-unlock. But once every breaking repo has PROMOTED
              # (versions caught up → `pending` empty) NO SIT fires (nothing pending to validate), so
              # the lock dangles forever — wedging every LDR→staging promote (incident 2026-06-08/09:
              # uac=0.2.0 locked staging 7h+ with pending_repos=[]). The lock's REASON is resolved the
              # moment nothing is pending, so clear it here. Guarded: only a STALE (>10 min) CASCADE
              # lock — never an in-flight "SIT running" lock (that clears itself when SIT completes).
              import datetime as _dt
              _ss = m.get("staging_status", {})
              _lr = _ss.get("locked_reason") or ""
              _manifest_changed = False
              if _ss.get("locked") and "bump cascade" in _lr:
                  _stale = True
                  _since = _ss.get("locked_since")
                  if _since:
                      try:
                          _age = (_dt.datetime.now(_dt.timezone.utc)
                                  - _dt.datetime.fromisoformat(str(_since).replace("Z", "+00:00"))).total_seconds()
                          _stale = _age > 600
                      except ValueError:
                          _stale = True
                  if _stale:
                      _ss.update({
                          "locked": False, "locked_since": None,
                          "locked_reason": "Auto-cleared: breaking cascade resolved (no pending repos)",
                          "lock_version": None, "breaking_pending": [],
                          "pending_repos": [], "sit_retry_count": 0, "locked_alert_sent": False,
                      })
                      m["staging_status"] = _ss
                      _tmp = "workspace-manifest.json.tmp"
                      with open(_tmp, "w") as _f:
                          json.dump(m, _f, indent=2, ensure_ascii=False)
                          _f.write("\n")
                      os.replace(_tmp, "workspace-manifest.json")
                      _manifest_changed = True
                      print(f"AUTO-UNLOCK: cleared dangling cascade lock ({_lr!r}) — no pending repos, cascade resolved")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("trigger=false\n")
                  if _manifest_changed:
                      f.write("manifest_changed=true\n")
              sys.exit(0)

          print(f"Pending staging repos ({len(pending)}): {', '.join(pending)}")

          # ── Content-based SIT gate (2026-06-08) ──
          # SIT (the 30-min assembled cross-repo run) fires ONLY when a pending repo is a
          # REAL breaking change (public API / schema / contract surface change), tracked in
          # staging_status.breaking_pending — set by update-repo-version's content-based
          # is_breaking (the AST differ scripts/cicd/detect_breaking_change.py), NOT the old
          # 0.x-minor version-phase heuristic. Non-breaking pending repos drain
          # LDR->staging->main on QG / MAIN_GREEN alone (no SIT, no cascade lock), so the
          # fleet drain is QG-paced not SIT-paced. QG-v2 still gates every staging PR.
          # The intersection with `pending` self-cleans (a promoted repo leaves `pending`),
          # and we prune stale breaking_pending entries here so it never becomes a phantom.
          breaking_pending = set(staging_status.get("breaking_pending") or [])
          breaking_in_cohort = [r for r in pending if r in breaking_pending]
          if not breaking_in_cohort and not drain_pending:
              print(f"No breaking changes among {len(pending)} pending repos — SIT NOT required; "
                    "non-breaking promotions drain on QG / MAIN_GREEN alone (no SIT, no cascade lock).")
              stale = breaking_pending - set(pending)
              if stale:
                  staging_status["breaking_pending"] = sorted(breaking_pending & set(pending))
                  m["staging_status"] = staging_status
                  tmp_path = "workspace-manifest.json.tmp"
                  with open(tmp_path, "w") as f:
                      json.dump(m, f, indent=2, ensure_ascii=False)
                      f.write("\n")
                  os.replace(tmp_path, "workspace-manifest.json")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("trigger=false\n")
                  if stale:
                      f.write("manifest_changed=true\n")
              sys.exit(0)
          print(f"Breaking pending repos requiring SIT: {breaking_in_cohort}")

          # Check SIT retry counter
          sit_retry_count = staging_status.get("sit_retry_count", 0)

          if drain_pending:
              print(f"DRAIN MODE: force-triggering SIT, resetting retry counter (was {sit_retry_count})")
              sit_retry_count = 0
          elif sit_retry_count >= max_sit_retries:
              print(f"SIT retry count ({sit_retry_count}) >= max ({max_sit_retries}) — halting auto-retrigger")
              print("Use workflow_dispatch with drain_pending=true to force a SIT run and reset counter")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("trigger=false\n")
                  f.write(f"halted=true\n")
                  f.write(f"retry_count={sit_retry_count}\n")
              sys.exit(0)

          # Check if staging is locked. Distinguish an ACTIVE sit-gate run (locked_reason
          # "SIT running" — skip to avoid double-triggering a SIT already in flight) from a
          # CASCADE lock set by update-repo-version on a breaking/major bump (locked_reason
          # "...bump cascade..."). A cascade lock MUST still trigger the SIT — the SIT is what
          # validates the pending repos, promotes them, and CLEARS the cascade lock. The old
          # unconditional skip meant no SIT ever ran while a cascade lock was held, so the lock
          # dangled forever (the fleet-wide staging→main deadlock this fixes).
          lock_reason = staging_status.get("locked_reason", "") or ""
          is_active_sit_run = "SIT running" in lock_reason
          if staging_status.get("locked", False) and is_active_sit_run and not drain_pending:
              print("SIT is locked (sit-gate run already in progress) — skipping debounce trigger")
              # Still update pending_repos in manifest for visibility
              staging_status["pending_repos"] = pending
              m["staging_status"] = staging_status
              tmp_path = "workspace-manifest.json.tmp"
              with open(tmp_path, "w") as f:
                  json.dump(m, f, indent=2, ensure_ascii=False)
                  f.write("\n")
              import os as _os
              _os.replace(tmp_path, "workspace-manifest.json")
              print(f"Updated staging_status.pending_repos with {len(pending)} repos (for next SIT batch)")

              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("trigger=false\n")
                  f.write("manifest_changed=true\n")
              sys.exit(0)

          # Check quiet period (skip if drain mode)
          if not drain_pending:
              result = subprocess.run(
                  ["git", "log", "-1", "--format=%ct",
                   "--grep=staging", "--grep=manifest", "--all-match",
                   "--", "workspace-manifest.json"],
                  capture_output=True, text=True
              )
              last_staging_ts = result.stdout.strip()

              if not last_staging_ts:
                  result = subprocess.run(
                      ["git", "log", "-1", "--format=%ct", "--", "workspace-manifest.json"],
                      capture_output=True, text=True
                  )
                  last_staging_ts = result.stdout.strip()

              if last_staging_ts:
                  last_ts = int(last_staging_ts)
                  now_ts = int(datetime.now(timezone.utc).timestamp())
                  age = now_ts - last_ts
                  print(f"Last staging manifest commit: {age}s ago (threshold: {debounce_seconds}s)")

                  if age < debounce_seconds:
                      print(f"Still within debounce window ({age}s < {debounce_seconds}s) — waiting")
                      with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                          f.write("trigger=false\n")
                      sys.exit(0)
                  else:
                      print(f"Quiet for {age}s >= {debounce_seconds}s — triggering SIT")
              else:
                  print("No manifest commits found — triggering SIT as fallback")

          # Update manifest: record pending_repos and increment retry counter
          staging_status["pending_repos"] = pending
          staging_status["sit_retry_count"] = sit_retry_count + 1
          m["staging_status"] = staging_status
          tmp_path = "workspace-manifest.json.tmp"
          with open(tmp_path, "w") as f:
              json.dump(m, f, indent=2, ensure_ascii=False)
              f.write("\n")
          import os as _os
          _os.replace(tmp_path, "workspace-manifest.json")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("trigger=true\n")
              f.write(f"pending_count={len(pending)}\n")
              f.write(f"pending_repos={','.join(pending)}\n")
              f.write(f"sit_retry_count={sit_retry_count + 1}\n")
              f.write("manifest_changed=true\n")
          PYEOF

      - name: Dispatch fix on SIT retry cap
        # L797 — when the retry cap fires (N consecutive SIT failures), fetch the last
        # failed smoke-test-gate.yml run from system-integration-tests, extract the failing
        # slice names, then dispatch escalate-to-orchestrator so an agent can investigate.
        # Advisory (non-blocking) — a dispatch failure just warns; manual drain_pending=true
        # is always the recovery path.
        if: steps.check.outputs.halted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          RETRY="${{ steps.check.outputs.retry_count }}"

          # Find the last failed smoke-test-gate run to get the failing-slice context.
          LAST_RUN=$(gh api \
            "repos/${OWNER}/system-integration-tests/actions/workflows/smoke-test-gate.yml/runs?status=failure&per_page=1" \
            --jq '.workflow_runs[0] | {id: .id, html_url: .html_url}' 2>/dev/null || echo '{}')

          RUN_ID=$(echo "$LAST_RUN" | jq -r '.id // empty')
          RUN_URL=$(echo "$LAST_RUN" | jq -r '.html_url // "unknown"')

          # Get names of failed jobs (slices) from that run.
          FAILED_JOBS=""
          if [ -n "$RUN_ID" ]; then
            FAILED_JOBS=$(gh api \
              "repos/${OWNER}/system-integration-tests/actions/runs/${RUN_ID}/jobs" \
              --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")' 2>/dev/null || echo "")
          fi

          echo "SIT retry cap: retry_count=${RETRY}, last failed run=${RUN_URL}, failing slices=${FAILED_JOBS:-unknown}"

          CTX="SIT retry cap hit: ${RETRY} consecutive SIT failures. Last failed run: ${RUN_URL}. Failing slices: ${FAILED_JOBS:-unknown}. Recovery: workflow_dispatch sit-debounce-trigger with drain_pending=true."
          PAYLOAD=$(jq -n --arg ctx "$CTX" \
            '{event_type:"escalate-to-orchestrator",client_payload:{repo:"system-integration-tests",wall_type:"sit_retry_cap",context:$ctx,authoring_slot:"sit-debounce-trigger"}}')
          printf '%s' "$PAYLOAD" | gh api -X POST "repos/${OWNER}/unified-trading-pm/dispatches" --input - \
            && echo "Dispatched sit_retry_cap fixer to orchestrator." \
            || echo "::warning::sit_retry_cap escalation dispatch failed (non-fatal — use drain_pending=true to unblock)."

      - name: Commit manifest updates (pending_repos tracking)
        if: steps.check.outputs.manifest_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet workspace-manifest.json; then
            echo "No manifest changes. Skipping commit."
            exit 0
          fi

          git add workspace-manifest.json
          git commit -m "chore(manifest): update staging_status.pending_repos [skip ci]"
          # Retry-with-rebase (finding H2): a concurrent manifest writer can land on main between our
          # checkout and push; a bare push then fails non-fast-forward and the update is lost. Rebase + retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed manifest update (attempt ${attempt})."
              break
            fi
            echo "Push rejected (attempt ${attempt}); rebasing onto origin/main and retrying."
            git pull --rebase --autostash origin main
            if [ "${attempt}" = "5" ]; then
              echo "FATAL: could not push manifest update after 5 attempts."
              exit 1
            fi
          done

      - name: Trigger SIT
        if: steps.check.outputs.trigger == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          PENDING="${{ steps.check.outputs.pending_repos }}"
          COUNT="${{ steps.check.outputs.pending_count }}"
          RETRY="${{ steps.check.outputs.sit_retry_count }}"

          echo "Triggering SIT after debounce quiet period"
          echo "Pending repos ($COUNT): $PENDING"
          echo "SIT retry count: $RETRY"

          # Dispatch to system-integration-tests to start SIT
          OWNER="${{ github.repository_owner }}"
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER}/system-integration-tests/dispatches" \
            -d "{\"event_type\": \"staging-changed\", \"client_payload\": {\"reason\": \"debounce-trigger\", \"pending_repos\": \"${PENDING}\", \"sit_retry_count\": ${RETRY}}}"

          echo "SIT triggered after quiet period (${COUNT} pending repos, retry #${RETRY})"

          echo "SIT dispatch complete"

      - name: Persist CI/CD event
        # CI-cost STEP 2c: was a separate 1-billed-minute-minimum `persist:` job calling the
        # persist-cicd-event.yml reusable; as the LAST step it is free and runs on this job's runner.
        # `if: always()` + `job.status` reproduces the old `conclusion: needs.check-and-trigger.result`.
        # secrets/vars do not reach a composite action — passed explicitly (was `secrets: inherit`).
        if: always()
        uses: ./.github/actions/persist-event
        with:
          repo_name: unified-trading-pm
          workflow_name: ${{ github.workflow }}
          run_id: ${{ github.run_id }}
          conclusion: ${{ job.status }}
          branch: ${{ github.ref_name }}
          commit_sha: ${{ github.sha }}
          details_json: '{"event": "sit-debounce-trigger"}'
          cloud_provider: ${{ vars.CLOUD_PROVIDER }}
          events_bucket: ${{ vars.CICD_EVENTS_BUCKET }}
          gcp_sa_key: ${{ secrets.GCP_SA_KEY }}

  # ── SLACK NOTIFY — SIT triggered (reusable workflow) ──────────────────
  notify-sit-triggered:
    name: Slack — SIT Debounce Triggered
    needs: [check-and-trigger]
    if: always() && needs.check-and-trigger.result == 'success'
    uses: ./.github/workflows/notify-slack.yml
    with:
      message: "SIT Debounce Triggered — quiet period elapsed, starting SIT run."
      severity: "INFO"
      conclusion: ${{ needs.check-and-trigger.result }}
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets: inherit

  # ── STARVATION CHECK (folded from sit-starvation-detector.yml 2026-06-27) ──────────────
  # Runs every 5 min (this workflow's cron) — more frequent than the old 30-min schedule.
  # Checks if the staging lock is dangling (stale > 25 min) and auto-remediates + alerts.
  # Runs in parallel with check-and-trigger; each has its own retry-rebase manifest write loop.
  check-stale-lock:
    # CI-cost B1: off billed hosted minutes onto the self-hosted glue pool. Labels are a SUBSET
    # match, so [self-hosted, glue] lands ONLY on the JIT-ephemeral pool — never on glue-writer.
    # SSOT: scripts/self-hosted-runners/README.md
    runs-on: [self-hosted, glue]
    outputs:
      stale: ${{ steps.stale-check.outputs.stale }}
      alert: ${{ steps.stale-check.outputs.alert }}
      cleared: ${{ steps.stale-check.outputs.cleared }}
    steps:
      - name: Checkout PM repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Check for stale SIT lock
        id: stale-check
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set +e
          python3 << 'PYEOF'
          import json
          from datetime import datetime, timezone, timedelta

          with open('workspace-manifest.json') as f:
              m = json.load(f)

          staging = m.get('staging_status', {})
          locked = staging.get('locked', False)
          locked_alert_sent = staging.get('locked_alert_sent', False)

          def emit(stale, alert, cleared=False):
              with open('/tmp/starvation.out', 'w') as f:
                  f.write(f"stale={'true' if stale else 'false'}\n")
                  f.write(f"alert={'true' if alert else 'false'}\n")
                  f.write(f"cleared={'true' if cleared else 'false'}\n")

          if not locked:
              if locked_alert_sent:
                  print("SIT lock cleared — was stale+alerted, resetting locked_alert_sent flag")
                  m['staging_status']['locked_alert_sent'] = False
                  with open('workspace-manifest.json', 'w') as f:
                      json.dump(m, f, indent=2)
                  emit(False, False, True)
              else:
                  print("SIT not locked — no starvation")
                  emit(False, False, False)
              raise SystemExit(0)

          locked_since_str = staging.get('locked_since', '')
          if not locked_since_str:
              print("No locked_since timestamp")
              emit(False, False)
              raise SystemExit(0)

          locked_since = datetime.fromisoformat(locked_since_str.replace('Z', '+00:00'))
          age = datetime.now(timezone.utc) - locked_since
          stale = age > timedelta(minutes=25)
          alert_needed = stale and not locked_alert_sent

          if stale:
              print(f"STALE LOCK: locked for {age} (>25m) — remediation will be dispatched")
          else:
              print(f"Lock age {age} < 25m — OK")

          if alert_needed:
              m['staging_status']['locked_alert_sent'] = True
              with open('workspace-manifest.json', 'w') as f:
                  json.dump(m, f, indent=2)

          emit(stale, alert_needed)
          PYEOF
          set -e

          cat /tmp/starvation.out >> "$GITHUB_OUTPUT"
          ALERT=$(grep '^alert=' /tmp/starvation.out | cut -d= -f2)
          CLEARED=$(grep '^cleared=' /tmp/starvation.out | cut -d= -f2)

          if [ "$ALERT" = "true" ] || [ "$CLEARED" = "true" ]; then
            git config user.email "ci@unified-trading.com"
            git config user.name "CI Bot"
            git add workspace-manifest.json
            if [ "$ALERT" = "true" ]; then
              git commit -m "chore: mark SIT starvation alert sent [skip ci]" || true
            else
              git commit -m "chore: reset SIT starvation locked_alert_sent flag — lock cleared [skip ci]" || true
            fi
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "Pushed manifest update (attempt ${attempt})."
                break
              fi
              echo "Push rejected (attempt ${attempt}); rebasing onto origin/main and retrying."
              git pull --rebase --autostash origin main
              if [ "${attempt}" = "5" ]; then
                echo "FATAL: could not push manifest update after 5 attempts."
                exit 1
              fi
            done
          fi

      - name: Persist CI/CD event (starvation)
        # CI-cost STEP 2c: was the separate `stale-persist:` job calling the persist-cicd-event.yml
        # reusable (1-billed-minute minimum). Same guard as before: only when the stale-lock ALERT
        # fired, and the hardcoded `conclusion: failure` is kept — the ledger records the CONDITION
        # (starvation detected), not this job's mechanical result, which is `success` even when it
        # finds a dangling lock. secrets/vars do not reach a composite action — passed explicitly.
        if: always() && steps.stale-check.outputs.alert == 'true'
        uses: ./.github/actions/persist-event
        with:
          repo_name: unified-trading-pm
          workflow_name: ${{ github.workflow }}
          run_id: ${{ github.run_id }}
          conclusion: "failure"
          branch: ${{ github.ref_name }}
          commit_sha: ${{ github.sha }}
          details_json: '{"event": "sit-starvation-detected"}'
          cloud_provider: ${{ vars.CLOUD_PROVIDER }}
          events_bucket: ${{ vars.CICD_EVENTS_BUCKET }}
          gcp_sa_key: ${{ secrets.GCP_SA_KEY }}

  # ── AUTO-REMEDIATE dangling lock — dispatch a new debounce-trigger run ─────────────────
  stale-remediate:
    name: Auto-remediate — re-trigger SIT for dangling lock
    needs: [check-stale-lock]
    if: always() && needs.check-stale-lock.outputs.stale == 'true'
    # CI-cost B1: off billed hosted minutes onto the self-hosted glue pool. Labels are a SUBSET
    # match, so [self-hosted, glue] lands ONLY on the JIT-ephemeral pool — never on glue-writer.
    # SSOT: scripts/self-hosted-runners/README.md
    runs-on: [self-hosted, glue]
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout PM repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Re-trigger via workflow_dispatch (dispatches a fresh run of this workflow)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          echo "Lock dangling >25min — re-triggering sit-debounce-trigger to validate+promote pending repos and clear the lock."
          gh workflow run sit-debounce-trigger.yml --repo "${{ github.repository }}"
          echo "SIT re-trigger dispatched."

  # ── SLACK NOTIFY — stale lock alert (de-duped) ────────────────────────────────────────
  stale-notify:
    name: Slack — SIT Starvation Alert
    needs: [check-stale-lock]
    if: always() && needs.check-stale-lock.outputs.alert == 'true'
    uses: ./.github/workflows/notify-slack.yml
    with:
      message:
        "SIT lock stale — staging locked >25min (a SIT run is ~15min, so this lock is dangling and is blocking fleet
        merges). Auto-remediation (SIT re-trigger) has been dispatched; if the lock persists across runs, investigate
        SIT failures or force-drain: `gh workflow run sit-debounce-trigger.yml -f drain_pending=true`"
      severity: "WARNING"
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      dedup_key: "sit-lock-stale"
      cooldown_min: 30
    secrets: inherit

  # ── LOCK-CLEARED BOOKEND ──────────────────────────────────────────────────────────────
  stale-notify-resolved:
    name: Slack — SIT Lock Cleared
    needs: [check-stale-lock]
    if: always() && needs.check-stale-lock.outputs.cleared == 'true'
    uses: ./.github/workflows/notify-slack.yml
    with:
      message: ":ballot_box_with_check: *SIT LOCK CLEARED* — staging lock resolved (was dangling >25min)"
      severity: "INFO"
      conclusion: "success"
      recovery: true
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      dedup_key: "sit-lock-cleared"
      cooldown_min: 5
    secrets: inherit
