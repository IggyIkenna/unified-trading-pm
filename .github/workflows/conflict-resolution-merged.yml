name: Conflict Resolution Merged — Retry Promotion

# Fires when an auto-resolve/* PR is merged.
# If the PR body contains the AUTO_RETRY_PROMOTION marker, re-dispatches staging-validated
# to retry the staging→main promotion that was blocked by the conflict.
# See: wire-conflict-resolution-retry-promotion in cicd_audit_remediation_2026_03_13.md

on:
  pull_request:
    types: [closed]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retry-promotion:
    name: Retry staging→main promotion after conflict resolution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'auto-resolve/')
    outputs:
      blocked_pr: ${{ steps.blocked-pr.outputs.blocked_pr }}

    steps:
      - name: Check for AUTO_RETRY_PROMOTION marker
        id: check-marker
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if echo "$PR_BODY" | grep -q "AUTO_RETRY_PROMOTION: true"; then
            echo "retry=true" >> "$GITHUB_OUTPUT"
            echo "✓ AUTO_RETRY_PROMOTION marker found in PR #$PR_NUMBER — will retry promotion"
          else
            echo "retry=false" >> "$GITHUB_OUTPUT"
            echo "No AUTO_RETRY_PROMOTION marker in PR #$PR_NUMBER — skipping"
          fi

      - name: Extract the blocked PR this one supersedes
        # Alert-tracing fix (2026-08-12): the ONLY producer of auto-resolve/* PRs
        # (auto_resolve_version_promote.sh) always stamps "Supersedes stuck staging->main PR
        # #<N>" in the body — that number was already there, just never surfaced in the Slack
        # notify step below, so a reader watching #ci-failures had no way to connect a
        # branch-health "PR #<N> BLOCKED/CONFLICTING" alert to this "conflict resolved" one; both
        # named a different PR number with nothing linking them. Empty when absent (never blocks
        # the retry-promotion step above on a body-format miss).
        id: blocked-pr
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          BLOCKED="$(echo "$PR_BODY" | grep -oE 'stuck [a-zA-Z-]+->[a-zA-Z-]+ PR #[0-9]+' | grep -oE '[0-9]+' | head -1 || true)"
          echo "blocked_pr=${BLOCKED}" >> "$GITHUB_OUTPUT"

      - name: Wait for GitHub state to settle
        if: steps.check-marker.outputs.retry == 'true'
        run: sleep 30

      - name: Re-dispatch staging-validated to retry staging→main promotion
        if: steps.check-marker.outputs.retry == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          [ -z "${GH_PAT}" ] && echo "GH_PAT not set — cannot dispatch" && exit 0
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          # Extract repo name from auto-resolve/<source>-to-<target>-<sha> branch format
          SOURCE_INFO="${HEAD_REF#auto-resolve/}"
          echo "Dispatching staging-validated for conflict-resolved branch: $HEAD_REF"
          curl -s -X POST \
            -H "Authorization: token ${GH_PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${OWNER}/unified-trading-pm/dispatches" \
            -d "{\"event_type\": \"staging-validated\", \"client_payload\": {\"source\": \"conflict-resolution-merged\", \"branch\": \"${SOURCE_INFO}\", \"pr_title\": \"${PR_TITLE}\"}}" \
            && echo "✓ staging-validated dispatched" \
            || echo "⚠ dispatch failed (non-fatal — human can manually re-trigger staging-to-main)"

      - name: Check out the persist-event composite action
        # CI-cost STEP 2c: `uses: ./…` resolves against the WORKSPACE, so the local composite
        # action must be on disk — this job had no checkout, hence sparse. Default `if:` (success)
        # on both steps mirrors the old persist job's `needs.retry-promotion.result == 'success'`
        # guard. This workflow is a KEEP (pull_request bot, hosted) — the steps ride inside the
        # already-billed job.
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Persist CI/CD event
        # Was the separate 1-billed-minute-minimum `persist:` job. `job.status` here is always
        # `success` (default step condition), matching the old success-only guard + conclusion.
        uses: ./.github/actions/persist-event
        with:
          repo_name: unified-trading-pm
          workflow_name: ${{ github.workflow }}
          run_id: ${{ github.run_id }}
          conclusion: ${{ job.status }}
          branch: ${{ github.ref_name }}
          commit_sha: ${{ github.sha }}
          details_json: '{"pr_number": "${{ github.event.pull_request.number }}"}'
          cloud_provider: ${{ vars.CLOUD_PROVIDER }}
          events_bucket: ${{ vars.CICD_EVENTS_BUCKET }}
          gcp_sa_key: ${{ secrets.GCP_SA_KEY }}

  # ── SLACK NOTIFY (reusable workflow) ──────────────────────────────────
  notify:
    name: Slack — Conflict Resolution Merged
    needs: [retry-promotion]
    if: always() && needs.retry-promotion.result == 'success'
    uses: ./.github/workflows/notify-slack.yml
    with:
      # blocked_pr present -> explicit "resolves #<old> via #<new>" so a reader can trace this
      # back to the branch-health BLOCKED/CONFLICTING alert that named the same old PR number
      # (2026-08-12 alert-tracing fix — see the blocked-pr step above for why this was missing).
      message: >-
        ${{ needs.retry-promotion.outputs.blocked_pr != '' && format('Conflict resolved — PR #{0} (was
        BLOCKED/CONFLICTING) is now resolved via auto-resolve PR #{1}, retrying staging→main promotion | {2}',
        needs.retry-promotion.outputs.blocked_pr, github.event.pull_request.number, github.event.pull_request.html_url)
        || format('Conflict resolved — retrying staging→main promotion | PR #{0}: {1} | {2}',
        github.event.pull_request.number, github.event.pull_request.title, github.event.pull_request.html_url) }}
      severity: "INFO"
      conclusion: ${{ needs.retry-promotion.result }}
      recovery: true # genuine recovery — a blocking promotion conflict was resolved (keep; message says "resolved" lowercase, no marker)
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets: inherit
