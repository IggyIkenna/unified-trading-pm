name: Plan Health Agent

# Checks active plans for contradictions and archives fully-completed plans.
# Uses claude-haiku-4-5 (cheap, targeted).
#
# Triggers:
#   - push to plans/active/** (plan changes)
#   - daily 02:00 UTC
#   - manual workflow_dispatch

on:
  push:
    branches: [main]
    paths:
      - "plans/active/**"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (report only, no archiving)"
        default: "false"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}

    steps:
      - name: Checkout unified-trading-pm
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Claude API health precheck
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_ORG: IggyIkenna
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          CALLING_WORKFLOW: plan-health-agent
        run: |
          source scripts/agents/claude-api-health-precheck.sh
          check_claude_api_health

      - name: Configure git identity
        run: |
          git config --global user.email "agent@ci.local"
          git config --global user.name "Plan Health Agent"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code --quiet

      - name: Load mandatory rules into env
        run: |
          # Agents in --print mode CANNOT read files from disk.
          # Rules MUST be injected into the prompt text itself.
          if [ -f "cursor-configs/SUB_AGENT_MANDATORY_RULES.md" ]; then
            {
              echo "MANDATORY_RULES<<RULES_EOF"
              cat "cursor-configs/SUB_AGENT_MANDATORY_RULES.md"
              echo "RULES_EOF"
            } >> "$GITHUB_ENV"
          else
            echo "ERROR: SUB_AGENT_MANDATORY_RULES.md not found — agent must not run without rules"
            exit 1
          fi

      - name: Run plan health agent
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          PLAN_DIR="plans/active"
          ARCHIVE_DIR="plans/archive"

          PROMPT="# ══════════════════════════════════════════════════════════════════
          # MANDATORY RULES — READ BEFORE ANY ACTION
          # ══════════════════════════════════════════════════════════════════

          ${MANDATORY_RULES}

          # ══════════════════════════════════════════════════════════════════
          # TASK
          # ══════════════════════════════════════════════════════════════════

          You are a plan health agent for the unified-trading-system. Follow these rules exactly:
          - No chain-of-thought, no prose explanations
          - Output only: JSON summary + shell commands to run (if any)
          - Be minimal and precise

          TASK 1 — CONTRADICTION CHECK:
          Read every .plan.md file in ${PLAN_DIR}/. For each pair of plans that share overlapping scope (same service, same architectural area, same todo ID pattern):
          - Check if they assign contradictory statuses (e.g. one marks a todo completed, another marks it pending with different implementation)
          - Check if they mandate contradictory architectural decisions
          Output: JSON array of contradictions: [{plan_a, plan_b, description}] or [] if none.

          TASK 1.5 — PLAN LOCK CHECK:
          Before archiving ANY plan, check its YAML frontmatter for 'locked_by' field.
          If 'locked_by' is present and non-empty: DO NOT archive. Report: \"LOCKED: {plan} locked by {branch} since {date} — skipping archival.\"
          Also check for plan-level 'depends_on' in frontmatter: if plan X has depends_on listing plan Y's name, and plan Y is being considered for archival, BLOCK the archive. Report: \"BLOCKED: {Y} cannot be archived — plan {X} depends on it.\"

          TASK 2 — ARCHIVE FULLY-COMPLETED PLANS:
          A plan is fully completed if ALL of its todos have status: completed (or it has no todos and is marked completed).
          For each fully-completed plan:
          - Move the file from ${PLAN_DIR}/ to ${ARCHIVE_DIR}/ using: git mv plans/active/PLAN.plan.md plans/archive/PLAN.plan.md
          - Update plans/active/INDEX.md to remove the plan entry
          List the plans you moved.

          $([ \"$DRY_RUN\" = \"true\" ] && echo \"DRY RUN: Report what would be archived but do NOT run git mv or make any changes.\" || true)

          After moving files (if any), run:
            bash scripts/quickmerge.sh 'chore: archive completed plans, plan health check' --files 'plans/active/INDEX.md' --quick

          If no changes needed, output: {\"status\": \"healthy\", \"contradictions\": [], \"archived\": []}"

          claude --print --dangerously-skip-permissions --model claude-haiku-4-5-20251001 "$PROMPT" \
            || echo "Plan health agent exited non-zero — check logs"

      - name: Skip — no API key
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "ANTHROPIC_API_KEY not set — skipping plan health agent"

  # ── TELEGRAM NOTIFY (reusable workflow) ──────────────────────────────────
  notify:
    name: Telegram — Plan Health Agent
    needs: [plan-health]
    if: always()
    uses: ./.github/workflows/notify-telegram.yml
    with:
      message: "plan-health-agent | PM plans checked"
      severity: "INFO"
      conclusion: ${{ needs.plan-health.result }}
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

  persist:
    name: Persist — Plan Health Event
    needs: [plan-health, notify]
    if: always()
    uses: ./.github/workflows/persist-cicd-event.yml
    secrets: inherit
    with:
      repo_name: unified-trading-pm
      workflow_name: ${{ github.workflow }}
      run_id: ${{ github.run_id }}
      conclusion: ${{ needs.plan-health.result }}
      branch: ${{ github.ref_name }}
      commit_sha: ${{ github.sha }}
      details_json: '{"event": "plan-health-check"}'
