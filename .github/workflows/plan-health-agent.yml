name: Plan Health Agent

# Two modes:
#   1. DAILY/dispatch (job `plan-health`): full report — deterministic digest + Haiku
#      contradiction/doc-drift detection. REPORT-ONLY, never mutates plans.
#   2. PR→main HARD GATE (job `plan-health-gate`): PM is staging-less (LDR→main direct),
#      so this deterministic plan-hygiene sweep is PM's fast "pseudo-staging" check on the
#      promotion PR. `run_hygiene_sweep.sh --ci` exits 1 on any HARD failure → blocks the
#      PR until plans are pristine; the fix then FF's main→LDR so everyone pulls clean.
#      Deterministic + $0 (no LLM). Becomes a REQUIRED check once the sweep is green.
#
# Design: do EVERYTHING deterministic in a script (plan counts, the canonical hygiene
# sweep — frontmatter / todo-format / line-caps / SSOT plan formatting / CLAUDE↔SUB_AGENT
# topic parity — archive candidate × locked_by cross-reference, inventory regen) and hand
# the agent a compact digest. The cheap Haiku agent then does the TWO things a script
# cannot: (1) cross-plan contradiction detection, and (2) doc-drift detection — where a
# CLAUDE.md / SUB_AGENT rule claim is contradicted/superseded by the live active plans.
# Findings are surfaced to the GHA run summary + Slack.
#
# ── PHASE 2 (item I) NOTE — the Haiku-via-API report MOVES to the planning-VM slot ──
# The daily `plan-health` job still runs the contradiction/doc-drift check via the paid
# ANTHROPIC_API_KEY (`claude --model claude-haiku-4-5 …`). Phase 2 of cicd plan
# § "CI/CD Observability + Reconciliation Hardening" I MOVES that LLM step OFF this paid
# API onto a planning-VM **orchestrator slot** (Claude Max-plan setup-token account →
# $0 marginal API cost — the B-block pattern). The orchestrator-side dispatch is BUILT:
# agent-orchestrator `agents/plan-health.md` + `server/plan_health.py` +
# `POST /api/plan-health/{dispatch,result}` reuse THIS step's prompt logic. It will be
# wired to feed this gate once the planning-VM orchestrator is LIVE (idle Max-plan slot +
# AutoSpawn). Until that slot is PROVEN live, the paid API path below STAYS as-is — do NOT
# rip it out. Cross-link: agent_orchestrator_e2e_..._2026_06_02.md § G9.
#
# Only the PM repo is checked out, to keep agent context (and cost) small.
#
# Triggers:
#   - daily 02:00 UTC
#   - manual workflow_dispatch

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  # HARD GATE on the PM→main promotion PR (PM is staging-less → LDR→main direct;
  # this deterministic plan-hygiene sweep is PM's fast "pseudo-staging" check).
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── HARD GATE (PR→main only): deterministic plan-hygiene sweep, $0 (no LLM) ──
  # exit 1 on any HARD failure → blocks the PM→main PR until plans are pristine.
  # Make it a REQUIRED check on main branch protection ONLY once the sweep is
  # green (today it has 3 hard failures — fix those first or it deadlocks merges).
  # Phase 2 (tracked in cicd plan): auto-fix the fixable findings + commit to the
  # PR head (fix_frontmatter.py), and run the Haiku contradiction check on a
  # planning-VM orchestrator slot (Max-plan, $0 API) feeding this same gate.
  plan-health-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout unified-trading-pm (PR head branch — auto-fix commits push back to it)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          # Check out the PR HEAD branch (not the detached merge commit) so the
          # deterministic auto-fix step can commit + push fixes back to the PR.
          ref: ${{ github.head_ref }}
          fetch-depth: 0 # the todo-regression check diffs against origin
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ── Phase 2 (item I): deterministic auto-fix BEFORE the sweep ──────────
      # Run the fixable-hygiene auto-fixer and, if it changed plans, commit +
      # push to the PR head branch so FIXABLE findings auto-resolve at the gate.
      # The sweep then runs on the fixed tree; only genuinely UNFIXABLE hard
      # failures still exit 1 (the hard gate stays intact). Loop-guard: the
      # commit is skipped on a no-op AND when HEAD is already an auto-fix commit
      # (the pushed commit re-triggers the PR check → without the guard it could
      # re-commit forever).
      - name: Auto-fix fixable plan hygiene (fix_frontmatter.py) + commit to PR head
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          # Pass the PR head ref via env (NOT an inline GitHub expression) to avoid script-injection.
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          LOOP_GUARD_MARKER="[plan-health-autofix]"
          LAST_MSG="$(git log -1 --pretty=%s || true)"
          if printf '%s' "$LAST_MSG" | grep -qF "$LOOP_GUARD_MARKER"; then
            echo "HEAD is already an auto-fix commit ($LAST_MSG) — skip to avoid a commit loop."
            exit 0
          fi
          echo "Running deterministic frontmatter auto-fix…"
          python3 scripts/plan-hygiene/fix_frontmatter.py || true
          if git diff --quiet; then
            echo "No fixable hygiene changes — nothing to commit."
            exit 0
          fi
          echo "Auto-fix changed files — committing to PR head branch '${PR_HEAD_REF}':"
          git diff --stat
          git config user.name "plan-health-bot"
          git config user.email "plan-health-bot@users.noreply.github.com"
          # Stage ONLY the plan dirs the auto-fixer touches (never -A — keep scope tight).
          git add plans/active plans/epics
          git commit -m "docs(plans): auto-fix plan hygiene at the gate ${LOOP_GUARD_MARKER}"
          git push origin "HEAD:${PR_HEAD_REF}"
          echo "Pushed auto-fix; the re-triggered PR check runs the sweep on the fixed tree."
      - name: Plan-hygiene hard gate (deterministic, --ci exits 1 on hard failures)
        run: |
          echo "PM is staging-less; this is the LDR→main pseudo-staging gate (plan hygiene)."
          bash scripts/plan-hygiene/run_hygiene_sweep.sh --ci

  plan-health:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    outputs:
      summary: ${{ steps.report.outputs.summary }}

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ secrets.GH_PAT }}

    steps:
      - name: Checkout unified-trading-pm
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0 # hygiene sweep's todo-regression check diffs against origin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Claude API health precheck
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_ORG: IggyIkenna
          SLACK_CI_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          CALLING_WORKFLOW: plan-health-agent
        run: |
          source scripts/agents/claude-api-health-precheck.sh
          check_claude_api_health

      # ── STEP 1: deterministic digest (the heavy lifting — no LLM) ──────────
      - name: Build deterministic plan-health digest
        id: digest
        run: |
          SUMMARY_LINE=$(bash scripts/plan-hygiene/build_health_digest.sh plan_health_digest.md | sed -n 's/^SUMMARY=//p')
          echo "summary=${SUMMARY_LINE}" >> "$GITHUB_OUTPUT"
          echo "=== Deterministic digest ==="
          cat plan_health_digest.md

      # ── STEP 1b: deterministic plan skeleton (slim contradiction-detection input) ──
      # Full epics+active+issues corpus is ~3 MB (~800K tokens) — 4x Haiku's window.
      # Extract frontmatter + headers + open todos (~30K tokens) so the agent gets a
      # reliable, bounded, full-corpus view instead of sampling whole plan bodies.
      - name: Extract plan skeletons
        run: |
          bash scripts/plan-hygiene/extract_plan_skeleton.sh plan_skeleton.md
          echo "skeleton size: $(wc -c < plan_skeleton.md) bytes (~$(( $(wc -c < plan_skeleton.md) / 4 )) tokens)"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code --quiet

      - name: Load mandatory rules into env
        run: |
          # Agents in --print mode CANNOT read files from disk.
          # Rules MUST be injected into the prompt text itself.
          if [ -f "cursor-configs/SUB_AGENT_MANDATORY_RULES.md" ]; then
            {
              echo "MANDATORY_RULES<<RULES_EOF"
              cat "cursor-configs/SUB_AGENT_MANDATORY_RULES.md"
              echo "RULES_EOF"
            } >> "$GITHUB_ENV"
          else
            echo "ERROR: SUB_AGENT_MANDATORY_RULES.md not found — agent must not run without rules"
            exit 1
          fi

      - name: Load CLAUDE.md into env (for doc-drift check)
        run: |
          # CLAUDE.md is the workspace rule index; feed it so the agent can flag where a
          # CLAUDE.md / SUB_AGENT rule claim is CONTRADICTED by an active plan or epic
          # (the semantic counterpart to the deterministic check_claude_subagent_parity.sh).
          if [ -f "cursor-configs/CLAUDE.md" ]; then
            {
              echo "WORKSPACE_RULES_CLAUDE<<CLAUDE_EOF"
              cat "cursor-configs/CLAUDE.md"
              echo "CLAUDE_EOF"
            } >> "$GITHUB_ENV"
          else
            echo "ERROR: cursor-configs/CLAUDE.md not found"
            exit 1
          fi

      # ── STEP 2: minimal Haiku agent — contradiction + doc-drift detection ──
      # PHASE 2 (item I): this paid Haiku-via-API step MOVES to a planning-VM
      # orchestrator Max-plan slot ($0 API) once that orchestrator is live — the
      # dispatch is BUILT (agent-orchestrator agents/plan-health.md +
      # server/plan_health.py reuse this prompt's logic). Kept as the live path
      # until the slot is proven live. See top-of-file Phase 2 note.
      - name: Run plan health agent (contradiction detection)
        id: agent
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          DIGEST="$(cat plan_health_digest.md)"
          SKELETON="$(cat plan_skeleton.md)"

          PROMPT="# ══════════════════════════════════════════════════════════════════
          # MANDATORY RULES — READ BEFORE ANY ACTION
          # ══════════════════════════════════════════════════════════════════

          ${MANDATORY_RULES}

          # ══════════════════════════════════════════════════════════════════
          # TASK — REPORT ONLY. DO NOT EDIT, MOVE, COMMIT, OR git mv ANY FILE.
          # ══════════════════════════════════════════════════════════════════

          You are the plan health agent for unified-trading-pm. Counts, hygiene checks,
          formatting, and archive/lock status are ALREADY computed deterministically — do
          NOT recompute or second-guess them. Your job is the TWO things a script cannot
          do: (1) detect cross-plan contradictions, and (2) detect doc-drift — where a
          governance-doc rule (CLAUDE.md / SUB_AGENT_MANDATORY_RULES.md) is CONTRADICTED
          by the live active plans/epics.

          Rules: no chain-of-thought, no prose. Output ONLY a single JSON object.
          Work from the pre-computed inputs below. Do NOT read full plan files — the
          full corpus is ~4x your context window; the skeleton is the authoritative,
          complete, bounded view of every in-scope plan.

          ── Pre-computed digest (authoritative — trust these numbers) ──────────────
          ${DIGEST}

          ── Plan skeletons (frontmatter + headers + open todos for EVERY in-scope plan;
             scope = plans/active + plans/epics + plans/active/issues; archive + non-plan
             files already excluded) ─────────────────────────────────────────────────
          ${SKELETON}

          ── CLAUDE.md (workspace rule index — the governance SSOT to drift-check) ────
          ${WORKSPACE_RULES_CLAUDE}
          ──────────────────────────────────────────────────────────────────────────

          CHECK 1 — CONTRADICTION (cross-plan):
          Using ONLY the skeletons above, for each pair of plans with overlapping scope
          (same service, same architectural area, or same todo-ID/topic), flag clear
          contradictions where they:
            - assign contradictory statuses to the same work (one done, one pending), or
            - mandate contradictory architectural decisions (incl. an active plan
              contradicting its parent_epic).
          Be conservative — only flag clear contradictions, not mere overlap. If a pair
          looks contradictory but the skeleton lacks detail to be sure, omit it.

          CHECK 2 — DOC-DRIFT (CLAUDE.md / SUB_AGENT vs live plans):
          Compare rule CLAIMS in CLAUDE.md and SUB_AGENT_MANDATORY_RULES.md (the
          MANDATORY RULES block at the top) against the plan skeletons. Flag a doc rule
          that is clearly CONTRADICTED or SUPERSEDED by an active plan/epic — e.g. the
          doc states a scope/value/status as X, but a plan's title/frontmatter/todos say
          the canonical answer is now Y (the kind of staleness where the doc narrows or
          contradicts shipped/in-flight plan scope). Be conservative — only flag clear
          contradictions a reader could verify from the skeleton; omit mere elaboration
          or topics a plan simply doesn't mention.

          Output EXACTLY this JSON shape and nothing else:
          {\"contradictions\": [{\"plan_a\": \"...\", \"plan_b\": \"...\", \"description\": \"...\"}], \"doc_drift\": [{\"doc\": \"CLAUDE.md|SUB_AGENT_MANDATORY_RULES.md\", \"claim\": \"...\", \"contradicted_by\": \"<plan file>\", \"description\": \"...\"}]}
          If none: {\"contradictions\": [], \"doc_drift\": []}"

          claude --print --dangerously-skip-permissions --model claude-haiku-4-5-20251001 "$PROMPT" \
            > agent_out.txt 2>&1 || echo "Plan health agent exited non-zero — check logs"

          echo "=== Agent output ==="
          cat agent_out.txt

      - name: Skip agent — no API key
        if: env.ANTHROPIC_API_KEY == ''
        run: |
          echo '{"contradictions": [], "doc_drift": []}' > agent_out.txt

      # ── STEP 3: assemble report → GHA run summary + Slack one-liner ────────
      - name: Assemble report
        id: report
        if: always()
        run: |
          # Extract the agent's JSON object (last {...} block), default empty.
          CONTRA_JSON=$(grep -oE '\{.*"contradictions".*\}' agent_out.txt 2>/dev/null | tail -1 || true)
          [ -z "$CONTRA_JSON" ] && CONTRA_JSON='{"contradictions": [], "doc_drift": []}'
          CONTRA_COUNT=$(printf '%s' "$CONTRA_JSON" | grep -oE '"plan_a"' | wc -l | tr -d ' ')
          DRIFT_COUNT=$(printf '%s' "$CONTRA_JSON" | grep -oE '"contradicted_by"' | wc -l | tr -d ' ')

          SUMMARY="${{ steps.digest.outputs.summary }} | contradictions: ${CONTRA_COUNT} | doc-drift: ${DRIFT_COUNT}"
          echo "summary=${SUMMARY}" >> "$GITHUB_OUTPUT"

          {
            echo "# Plan Health Agent — daily report"
            echo ""
            cat plan_health_digest.md 2>/dev/null || echo "_(digest unavailable)_"
            echo ""
            echo "## Cross-plan contradictions: ${CONTRA_COUNT}"
            echo "## CLAUDE.md/SUB_AGENT doc-drift vs live plans: ${DRIFT_COUNT}"
            echo ""
            echo '```json'
            printf '%s\n' "$CONTRA_JSON"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── SLACK NOTIFY (reusable workflow) ──────────────────────────────────
  notify:
    name: Slack — Plan Health Agent
    needs: [plan-health]
    # Daily/dispatch report only — the PR hard-gate surfaces its result on the PR check itself.
    if: always() && github.event_name != 'pull_request'
    # Best-effort telemetry — a Slack/webhook hiccup must NOT redden the plan-health badge
    # (the badge should reflect the `plan-health` sweep, not a notification side-channel).
    continue-on-error: true
    uses: ./.github/workflows/notify-slack.yml
    with:
      message: "plan-health-agent (daily) | ${{ needs.plan-health.outputs.summary || 'run failed — see logs' }}"
      severity: "INFO"
      conclusion: ${{ needs.plan-health.result }}
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets: inherit

  persist:
    name: Persist — Plan Health Event
    needs: [plan-health, notify]
    # Daily/dispatch only — on a PR the `plan-health`/`notify` jobs are skipped (the
    # hard gate surfaces its own result on the PR check), so persisting a "skipped"
    # plan-health conclusion would (a) be meaningless and (b) mark the whole PR run
    # `failure` even though the gate passed. Scope persist to non-PR events, like notify.
    if: always() && github.event_name != 'pull_request'
    # Best-effort event-logging (GCS/S3) — a cloud-auth/persist hiccup must NOT redden the
    # plan-health badge. This is the fix for the 06-05→06-08 "all jobs green but run=failure"
    # badge: the persist reusable-caller was failing and gating the scheduled run conclusion.
    continue-on-error: true
    uses: ./.github/workflows/persist-cicd-event.yml
    secrets: inherit
    with:
      repo_name: unified-trading-pm
      workflow_name: ${{ github.workflow }}
      run_id: ${{ github.run_id }}
      conclusion: ${{ needs.plan-health.result }}
      branch: ${{ github.ref_name }}
      commit_sha: ${{ github.sha }}
      details_json: '{"event": "plan-health-check"}'
