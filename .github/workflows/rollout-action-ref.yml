name: rollout-action-ref

# Re-pins composite action refs across all repos when active_feature_branch
# changes in workspace-manifest.json (e.g. after a branch merges to main).
# Also triggerable manually with a custom ref.

on:
  push:
    branches: [main, staging]
    paths:
      - workspace-manifest.json
  workflow_dispatch:
    inputs:
      action_ref:
        description: "Composite action ref to pin (leave blank to use active_feature_branch from manifest)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout unified-trading-pm
        uses: actions/checkout@v5
        with:
          path: unified-trading-pm
          token: ${{ secrets.GH_PAT }}

      - name: Checkout all service repos
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 - <<'PYEOF'
          import json, subprocess, os, sys
          from pathlib import Path

          manifest = json.loads(Path("unified-trading-pm/workspace-manifest.json").read_text())
          repos = manifest.get("repositories", {})
          skip = {"unified-trading-pm"}
          pat = os.environ["GH_PAT"]
          owner = "IggyIkenna"

          for name in sorted(repos):
              if name in skip:
                  continue
              dest = Path(name)
              if dest.exists():
                  continue
              url = f"https://x-access-token:{pat}@github.com/{owner}/{name}.git"
              result = subprocess.run(
                  ["git", "clone", "--depth=1", url, name],
                  capture_output=True, text=True
              )
              if result.returncode != 0:
                  print(f"WARN: could not clone {name}: {result.stderr.strip()}", file=sys.stderr)
          PYEOF

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.9"

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Run rollout
        env:
          ACTION_REF: ${{ inputs.action_ref }}
        run: |
          EXTRA_ARGS=""
          [ -n "$ACTION_REF" ] && EXTRA_ARGS="--action-ref $ACTION_REF"
          python3 unified-trading-pm/scripts/propagation/rollout-quality-gates-ci-workflows.py $EXTRA_ARGS

      - name: Commit and push changed repos
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PYEOF'
          import json, subprocess, os
          from pathlib import Path

          manifest = json.loads(Path("unified-trading-pm/workspace-manifest.json").read_text())
          action_ref = manifest.get("active_feature_branch") or "main"
          skip = {"unified-trading-pm"}
          pat = os.environ["GH_PAT"]
          owner = "IggyIkenna"
          branch = os.environ.get("BRANCH", "main")

          for name in sorted(manifest.get("repositories", {})):
              if name in skip:
                  continue
              repo_path = Path(name)
              if not repo_path.exists():
                  continue
              result = subprocess.run(
                  ["git", "diff", "--name-only"],
                  cwd=repo_path, capture_output=True, text=True
              )
              changed = result.stdout.strip()
              if not changed:
                  continue

              subprocess.run(["git", "config", "user.email", "agent@ci.local"], cwd=repo_path)
              subprocess.run(["git", "config", "user.name", "Rollout Agent"], cwd=repo_path)
              subprocess.run(["git", "add", ".github/workflows/quality-gates.yml"], cwd=repo_path)
              subprocess.run([
                  "git", "commit", "-m",
                  f"chore(ci): pin composite action ref to @{action_ref}"
              ], cwd=repo_path)

              remote_url = f"https://x-access-token:{pat}@github.com/{owner}/{name}.git"
              subprocess.run(["git", "remote", "set-url", "origin", remote_url], cwd=repo_path)
              r = subprocess.run(
                  ["git", "push", "origin", f"HEAD:{branch}"],
                  cwd=repo_path, capture_output=True, text=True
              )
              if r.returncode == 0:
                  print(f"PUSHED {name}")
              else:
                  print(f"FAILED {name}: {r.stderr.strip()}")
          PYEOF
