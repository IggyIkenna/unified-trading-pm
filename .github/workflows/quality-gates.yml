name: quality-gates

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout unified-trading-pm
        uses: actions/checkout@v4
        with:
          path: unified-trading-pm

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install ripgrep
        run: |
          # Install via GitHub release — works in both real GHA runners and act containers
          # where apt universe may not have ripgrep in its package lists.
          RG_VER="14.1.1"
          curl -fsSL "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VER}/ripgrep-${RG_VER}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C /tmp "ripgrep-${RG_VER}-x86_64-unknown-linux-musl/rg"
          sudo mv /tmp/rg /usr/local/bin/rg
          rg --version

      - name: Install PM dev deps (ruff, basedpyright, pytest)
        working-directory: unified-trading-pm
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install ruff==0.15.0 basedpyright pytest pre-commit pytest-asyncio pytest-mock pytest-timeout pytest-xdist pytest-cov

      - name: Simulate sibling workspace layout
        # Scripts infer workspace root as parent of unified-trading-pm/.
        # In CI the checkout lands at $GITHUB_WORKSPACE/unified-trading-pm,
        # so $GITHUB_WORKSPACE is the workspace root — perfect sibling layout.
        # We just need to create .cursor/rules/ and one sibling so validation passes.
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cursor/rules"
          touch "$GITHUB_WORKSPACE/.cursorrules"
          mkdir -p "$GITHUB_WORKSPACE/unified-trading-codex"

      - name: Install shellcheck
        run: |
          # Install via GitHub release — same reason as ripgrep above.
          SC_VER="v0.10.0"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SC_VER}/shellcheck-${SC_VER}.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C /tmp "shellcheck-${SC_VER}/shellcheck"
          sudo mv /tmp/shellcheck /usr/local/bin/shellcheck
          shellcheck --version

      - name: Install bats-core
        run: |
          git clone --depth=1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local

      - name: Run quality gates
        working-directory: unified-trading-pm
        run: |
          source .venv/bin/activate
          bash scripts/quality-gates.sh
