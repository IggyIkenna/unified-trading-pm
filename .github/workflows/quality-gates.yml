name: quality-gates

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --no-deprecation
    steps:
      - name: Checkout unified-trading-pm
        uses: actions/checkout@v4

      - name: Checkout Codex (sibling, for background agents / cursor rules context)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # actions/checkout rejects path outside GITHUB_WORKSPACE; use git clone to sibling
          PARENT="$(dirname "$GITHUB_WORKSPACE")"
          if [ -d "$PARENT/unified-trading-codex/.git" ]; then
            (cd "$PARENT/unified-trading-codex" && git fetch --depth 1 origin main && git checkout main) || true
          elif [ -n "${GH_PAT}" ]; then
            git clone --depth 1 "https://x-access-token:${GH_PAT}@github.com/${{ github.repository_owner }}/unified-trading-codex.git" "$PARENT/unified-trading-codex"
          fi

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install ripgrep, shellcheck, bats
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep shellcheck bats
          rg --version
          shellcheck --version
          bats --version

      - name: Install PM dev deps (ruff, basedpyright, pytest, pyyaml)
        working-directory: .
        run: |
          uv sync --extra dev
          source .venv/bin/activate

      - name: Simulate workspace layout (for validation)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cursor/rules"
          touch "$GITHUB_WORKSPACE/.cursorrules"

      - name: Run quality gates
        working-directory: .
        run: |
          source .venv/bin/activate
          bash scripts/quality-gates.sh
