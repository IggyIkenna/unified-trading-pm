name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  quality-gates:
    uses: IggyIkenna/unified-trading-pm/.github/workflows/infra-quality-gates.yml@live-defi-rollout
    with:
      repo_name: unified-trading-pm
      run_quality_gates_sh: true
      run_basedpyright: true
      run_actionlint: true
      run_flow_coverage: true
      sibling_deps: "unified-events-interface unified-internal-contracts"
    secrets: inherit
