name: Cassette Drift Check

# Nightly schema-level drift detection for VCR cassettes in unified-api-contracts.
# Re-records cassettes against real APIs and diffs Pydantic model schemas.
# Alerting-only — NOT CI-blocking. Drift creates a GH issue + Slack alert (#ci-failures).
#
# Secrets required:
#   GH_PAT                    — checkout unified-api-contracts + create issues
#   BINANCE_API_KEY_DRIFT     — read-only key for Binance re-record
#   COINBASE_API_KEY_DRIFT    — read-only key for Coinbase re-record
#   DERIBIT_CLIENT_ID_DRIFT   — read-only credential for Deribit re-record
#   SLACK_CI_WEBHOOK_URL      — alert notification → #ci-failures

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (detect drift but do not create issue)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-cassette-drift:
    name: Detect Cassette Schema Drift
    # CI-cost B1: off billed hosted minutes onto the self-hosted glue pool. Labels are a SUBSET
    # match, so [self-hosted, glue] lands ONLY on the JIT-ephemeral pool — never on glue-writer.
    # SSOT: scripts/self-hosted-runners/README.md
    runs-on: [self-hosted, glue]
    timeout-minutes: 30

    steps:
      - name: Checkout unified-trading-pm
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          path: unified-trading-pm

      - name: Checkout unified-api-contracts
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/unified-api-contracts
          token: ${{ secrets.GH_PAT }}
          path: unified-api-contracts

      # No actions/setup-python and no `pip install uv`: this runs on the self-hosted glue pool,
      # whose python3 IS the slot venv on 3.13 (first on the unit PATH) — the version UAC's
      # requires-python = ">=3.13,<3.14" demands — and which already provides uv
      # (scripts/self-hosted-runners/slot-venv-requirements.txt). Re-adding either would
      # re-download tools that are already resident on a box we pay for 24/7. Provisioning lives
      # in scripts/self-hosted-runners/bootstrap-ci-host.sh; if the version is ever wrong, fix it
      # THERE, not here. The step this replaced pinned "3.12", which CONTRADICTED UAC's
      # requires-python and silently made `uv pip install -e .` unresolvable every night.
      # Self-hosted-ONLY: restoring runs-on: ubuntu-latest requires restoring BOTH steps
      # (see scripts/self-hosted-runners/hosted-baseline/cassette-drift-check.yml).

      - name: Install unified-api-contracts (isolated venv)
        run: |
          # The detector ships INSIDE the UAC package (unified_api_contracts.testing.
          # detect_cassette_drift) since c2e58f200 relocated it out of PM, so an editable
          # install is REQUIRED — there is no pydantic/pyyaml fallback that can satisfy the
          # import, and pretending there was is what hid this failure for weeks.
          #
          # The venv lives in RUNNER_TEMP, NEVER inside the checkout: the detector does
          # cassette_dir.rglob("*.yaml"), so a venv under the cassette dir is scanned AS
          # cassettes — measured locally, it flags .venv/…/markdown_it/port.yaml as drift.
          # And NEVER `--system`: on the self-hosted glue pool python3 IS the SHARED slot venv
          # (scripts/self-hosted-runners/slot-venv-requirements.txt), so an editable install
          # pointing at a _work dir the JIT runner deletes would poison every later job.
          uv venv "${RUNNER_TEMP}/uac" --python 3.13
          uv pip install -e ./unified-api-contracts --python "${RUNNER_TEMP}/uac/bin/python"

      - name: Run drift detection
        id: drift_check
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY_DRIFT }}
          COINBASE_API_KEY: ${{ secrets.COINBASE_API_KEY_DRIFT }}
          DERIBIT_CLIENT_ID: ${{ secrets.DERIBIT_CLIENT_ID_DRIFT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_SYSHEALTH || secrets.ANTHROPIC_API_KEY }}
        run: |
          # Scope = the PACKAGE dir, not the repo root. The root additionally carries ~9
          # non-cassette yaml (tests/, .github/) plus any venv, and rglob would scan them all.
          # Measured: root => 188 checked / 29 "drifted" (one a site-packages false positive);
          # package dir => 179 checked / 28 drifted, all real cassettes.
          #
          # Exit contract of detect_cassette_drift.main(): 0 = no drift · 1 = drift · 2 = tool
          # error (e.g. cassette-dir missing). Do NOT collapse 2 into "drift" — collapsing every
          # non-zero into drift_detected=true is precisely what let this job run GREEN against a
          # deleted script, and report a missing file as a positive detection.
          rc=0
          "${RUNNER_TEMP}/uac/bin/python" -m unified_api_contracts.testing.detect_cassette_drift \
            --cassette-dir unified-api-contracts/unified_api_contracts \
            --output-json drift_report.json || rc=$?
          case "${rc}" in
            0) echo "drift_detected=false" >> "$GITHUB_OUTPUT"; echo "No cassette drift." ;;
            1) echo "drift_detected=true" >> "$GITHUB_OUTPUT"; echo "::warning::Cassette schema drift detected — see the report below." ;;
            *) echo "::error::detect_cassette_drift FAILED (exit ${rc}) — tool/environment error, NOT drift."; exit "${rc}" ;;
          esac

      - name: Show drift report
        if: always()
        run: |
          if [ -f drift_report.json ]; then
            echo "=== Drift Report ==="
            cat drift_report.json
          else
            echo "No drift_report.json produced."
          fi

      - name: Create GitHub Issue on drift
        if: steps.drift_check.outputs.drift_detected == 'true' && !inputs.dry_run
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const fs = require('fs');
            let report = { summary: 'No report file found.', drifted_cassettes: [], total_checked: 0 };
            try {
              report = JSON.parse(fs.readFileSync('drift_report.json', 'utf8'));
            } catch (e) {
              console.log('Could not read drift_report.json:', e.message);
            }

            const date = new Date().toISOString().split('T')[0];
            const cassettes = report.drifted_cassettes || [];
            const cassettesSection = cassettes.length > 0
              ? cassettes.map(c => `- \`${c}\``).join('\n')
              : '_None listed_';

            const body = [
              '## Cassette Schema Drift Detected',
              '',
              `**Date:** ${date}`,
              `**Total cassettes checked:** ${report.total_checked ?? 'unknown'}`,
              `**Drifted:** ${cassettes.length}`,
              '',
              '### Summary',
              report.summary || '_No summary provided._',
              '',
              '### Affected Cassettes',
              cassettesSection,
              '',
              '### Action Required',
              '- Review the drifted cassettes and update Pydantic models in `unified-api-contracts`.',
              '- Re-record cassettes once schema changes are understood.',
              '',
              `[Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: 'unified-api-contracts',
              title: `[Cassette Drift] Schema changes detected ${date}`,
              body,
              labels: ['cassette-drift', 'automated'],
            });

      - name: Persist CI/CD event
        # CI-cost STEP 2c: was a separate 1-billed-minute-minimum `persist:` job calling the
        # persist-cicd-event.yml reusable; as the LAST step it is free and runs on this job's runner.
        # `if: always()` + `job.status` reproduces `conclusion: needs.detect-cassette-drift.result`.
        # PM is checked out at `path: unified-trading-pm` (not the workspace root), so the local
        # action path carries that prefix. secrets/vars do not reach a composite action — passed
        # explicitly (was `secrets: inherit`).
        if: always()
        uses: ./unified-trading-pm/.github/actions/persist-event
        with:
          repo_name: unified-api-contracts
          workflow_name: ${{ github.workflow }}
          run_id: ${{ github.run_id }}
          conclusion: ${{ job.status }}
          branch: ${{ github.ref_name }}
          commit_sha: ${{ github.sha }}
          details_json: '{"event": "cassette-drift-check"}'
          cloud_provider: ${{ vars.CLOUD_PROVIDER }}
          events_bucket: ${{ vars.CICD_EVENTS_BUCKET }}
          gcp_sa_key: ${{ secrets.GCP_SA_KEY }}

  # ── SLACK NOTIFY (reusable workflow) ──────────────────────────────────
  notify:
    name: Slack — Cassette Drift Check
    needs: [detect-cassette-drift]
    if: always()
    uses: ./.github/workflows/notify-slack.yml
    with:
      message: "[Cassette Drift] Check complete"
      severity: "INFO"
      conclusion: ${{ needs.detect-cassette-drift.result }}
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets: inherit
