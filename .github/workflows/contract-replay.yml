name: Contract Replay

on:
  workflow_call:
    inputs:
      repo:
        type: string
        required: true
      cassette_dir:
        type: string
        default: "external/*/mocks/"

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/${{ inputs.repo }}
          token: ${{ secrets.GH_PAT }}

