name: pm-staging-to-main-bypass

# PM SIT-BYPASS PROMOTER (design: plan cicd_contract_hardening_2026_06_01 §299 —
# "unified-trading-pm is a docs/devops repo → special bypass (PR→QG→straight to
# staging+main, no SIT)").
#
# WHY: PM carries plans/docs/scripts/workflows — validated by quality-gates-v2 but NOT
# relevant to cross-repo runtime SIT. PM had no PR→QG→main path of its own (it is the
# SIT-chain DISPATCHER, not a gated repo), so plan/doc updates piled onto live-defi-rollout
# and never auto-promoted → the recurring PM main↔LDR drift (one incident: 326 commits).
# This promoter closes that: when quality-gates-v2 passes on staging, promote staging→main
# directly, SKIPPING the SIT chain. Combined with quickmerge (LDR→staging, v2-auto-merge)
# + main-backmerge-to-ldr.yml (main→LDR), PM stays fully synced with NO manual reconcile.
#
# SAFETY: promotes ONLY on a green quality-gates-v2 (staging is green-by-construction).
# SIT-bypass is scoped to THIS repo only (PM); all other repos still go staging→SIT→main.
#
# Trigger: quality-gates-v2 completes successfully on `staging`.

on:
  workflow_run:
    workflows: ["quality-gates-v2"]
    types: [completed]
    branches: [staging]
  workflow_dispatch: {} # manual promote (operator)

permissions:
  contents: write

concurrency:
  group: pm-staging-to-main
  cancel-in-progress: false

jobs:
  promote:
    # Only on a green QG (dispatch runs unconditionally for operator use).
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Promote staging → main (QG-green, SIT-bypassed)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main staging --quiet

          STAGING_SHA="$(git rev-parse origin/staging)"
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "${STAGING_SHA}" = "${MAIN_SHA}" ]; then
            echo "main already == staging (${STAGING_SHA:0:9}); nothing to promote."
            exit 0
          fi

          if git merge-base --is-ancestor "${MAIN_SHA}" "${STAGING_SHA}"; then
            echo "main strictly behind staging → fast-forward main to staging"
            git push origin "${STAGING_SHA}:refs/heads/main"
          else
            echo "main has its own commits (e.g. [skip ci] version bumps) → merge staging into main"
            git checkout -B _promote_main "${MAIN_SHA}"
            git merge --no-ff "${STAGING_SHA}" \
              -m "chore: promote PM staging→main (QG-green, SIT-bypassed) [skip ci]"
            git push origin _promote_main:refs/heads/main
          fi
          echo "PM main promoted to staging-green ${STAGING_SHA:0:9}"
