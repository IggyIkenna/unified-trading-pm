# quality-gates-v2.yml — unified-trading-pm per-repo caller (v2, escapes GHA ghost cache)
#
# DESIGN: PM-specific caller for python-quality-gates-v2.yml. Since 2026-08-06, the reusable
# workflow is hosted in unified-trading-ci (extracted from PM so the fleet's CI never again
# breaks if PM's own visibility changes — see
# plans/active/shared_ci_workflow_repo_extraction_2026_08_06.md) — PM calls the same remote ref
# every other repo uses (IggyIkenna/unified-trading-ci/.github/workflows/python-quality-gates-v2.yml@main).
# The former chicken-and-egg self-reference problem no longer applies: PM is just another
# caller now, not the host. The job key "quality-gates-v2" registers a fresh check context,
# bypassing the GitHub ghost-cache bug on the old "quality-gates" context (Option D).
#
# dep_repos: unified-trading-library unified-api-contracts
#   (mirrors sibling_deps in the legacy quality-gates.yml)

name: quality-gates-v2

on:
  push:
    branches: [main]
    # workspace-manifest.json-only commits (ci-status-consolidator.yml's hourly Firestore->manifest
    # projection) don't need a full gate re-run -- excluding them here (instead of the consolidator's
    # blanket `[skip ci]` commit-message marker) lets OTHER push-triggered workflows on main, notably
    # main-backmerge-to-ldr.yml, still fire normally on that commit. See
    # plans/active/issues/ci_status_consolidator_skip_ci_starves_ldr_backmerge_2026_08_03.md.
    paths-ignore: ["workspace-manifest.json"]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

# Concurrency: cancel in-progress runs for the same ref on a new push OR a new commit to an open PR
# (saves Action minutes). PR runs used to only serialize (queue), which meant a standing promote PR
# with a moving head (e.g. PM's own LDR->main PR) billed a full run for every superseded intermediate
# commit instead of collapsing to the latest — the group is already scoped per-ref (a PR's ref is
# refs/pull/<n>/merge, unique per PR), so cancelling in-progress here can never cross-cancel a
# different PR or a push to main.
# PROMOTE PRs ARE EXEMPT FROM CANCELLATION (2026-08-10). The rationale above is BILLING — it was
# written while PM was private and every superseded promote-PR run cost metered minutes. PM went
# PUBLIC 2026-08-06, so ubuntu-latest is free/unmetered for it and that saving is now worth zero.
# What the cancellation costs instead is the promotion itself: the tests leg needs 70-135 min (job
# `timeout-minutes: 135`), while the promote bot refreshes the LDR->main PR's head every ~15 min, and
# every refresh cancelled the in-flight run. A gate that takes longer than its own trigger interval
# can NEVER report, so the required `quality-gates-v2` check stayed permanently un-reported and
# `main` fell 1533 commits behind. Measured 2026-08-10: run 31387254830 (12:01Z, sha 41cf4ad)
# `cancelled` the moment the 12:16Z run superseded it.
# This was MASKED until today: while the checks leg was hard-failing in 4-5 min, every promote run
# died long before any refresh could cancel it, so cancellation looked free. Fixing the checks leg
# (the NA-corpus/promote-gate work) is what let runs live long enough to hit this.
# Non-promote PRs and pushes keep the original collapse-to-latest behaviour — `github.head_ref` is
# empty for a push, so that path still evaluates true and still cancels.
concurrency:
  group: quality-gates-v2-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.head_ref, 'promote/') }}

permissions:
  contents: read
  pull-requests: read

jobs:
  quality-gates-v2:
    name: Quality Gates (unified-trading-pm)
    uses: IggyIkenna/unified-trading-ci/.github/workflows/python-quality-gates-v2.yml@main
    with:
      dep_repos: "unified-trading-library unified-api-contracts"
      # REVERTED 2026-08-07 (self_hosted_runner_public_repo_revert_2026_08_05.md todo 24): PM
      # itself went PUBLIC 2026-08-06, which makes ubuntu-latest free/unmetered for it (the
      # 2026-08-05 "single largest ubuntu-latest cost driver" framing below no longer applies) and
      # makes self-hosted-on-a-public-repo a fork-PR security exposure instead of a savings.
      # `self_hosted_runner_labels` empty -> the reusable's `runs-on:` input falls back to
      # ubuntu-latest (see python-quality-gates-v2.yml's own default). PM's local `uses: ./...`
      # self-call fell outside rollout-workflow-templates.sh's scope (it targets REMOTE-ref
      # callers), which is why this was hand-set instead of template-derived.
      self_hosted_runner_labels: ""
    secrets: inherit
    # Note: PM calls the same unified-trading-ci remote ref every other repo uses. See
    # codex/08-workflows/ci-cd-flow.md for the current SSOT on the reusable-workflow host.

  # Dispatch qg-passed to PM cloud-build-router on staging merge so Cloud Build runs the image build.
  # cloud-build-router.yml in PM listens for this event and triggers the GCP Cloud Build pipeline.
  dispatch-cloud-build:
    name: Dispatch cloud-build trigger (staging only)
    needs: quality-gates-v2
    # docs_only (A1): a documentation-only push changes no code — no image to rebuild.
    if:
      github.event_name == 'push' && github.ref == 'refs/heads/staging' && needs.quality-gates-v2.outputs.docs_only !=
      'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch qg-passed → cloud-build-router
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_ORG: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Trigger cloud-build-router.yml in unified-trading-pm via repository_dispatch qg-passed
          curl -s -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GH_ORG}/unified-trading-pm/dispatches" \
            -d "{\"event_type\": \"qg-passed\", \"client_payload\": {\"repo\": \"${REPO}\", \"branch\": \"${BRANCH}\", \"commit_sha\": \"${COMMIT_SHA}\", \"repo_type\": \"pm\"}}"
          echo "Dispatched qg-passed for ${REPO}@${COMMIT_SHA} on ${BRANCH}"
