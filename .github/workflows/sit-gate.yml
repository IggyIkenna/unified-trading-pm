name: sit-gate

# Triggered by system-integration-tests at the START of a SIT run.
# Sets staging_status.locked=true and records the exact commit SHAs being tested.
# Payload: { repos: ["repo1", "repo2", ...], commit_shas: {"repo1": "abc123", ...} }

on:
  repository_dispatch:
    types: [sit-lock]

permissions:
  contents: write
  issues: write

concurrency:
  group: manifest-update
  cancel-in-progress: false

jobs:
  lock-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Verify all pending repos are STAGING_GREEN
        id: ci_check
        run: |
          set -euo pipefail
          python3 - <<PYEOF
          import json, sys

          with open("workspace-manifest.json") as f:
              manifest = json.load(f)

          repos = manifest.get("repositories", {})
          staging_versions = manifest.get("staging_versions", {})
          stable_versions = manifest.get("versions", {})

          # Repos that have staging changes
          pending = [r for r, sv in staging_versions.items()
                     if not r.startswith("_") and sv != stable_versions.get(r)]

          # Check ci_status for each pending repo. A repo is SIT-ready when its ci_status is AT OR
          # ABOVE STAGING_GREEN in the lifecycle hierarchy (STAGING_GREEN | SIT_VALIDATED |
          # MAIN_GREEN). The ci_status no-downgrade guard (ci-status-update.yml) DELIBERATELY keeps
          # an on-main repo at MAIN_GREEN even when it has fresh staging changes — a green staging v2
          # cannot knock MAIN_GREEN(rank 4) down to STAGING_GREEN(rank 2). So requiring EXACTLY
          # STAGING_GREEN here made sit-gate's precheck UNSATISFIABLE for any MAIN_GREEN pending repo
          # → SIT never ran → the breaking-cascade lock never cleared → the whole staging→main drain
          # dammed (incident 2026-06-07: uac=0.2.0 / utl=0.4.0 / features=0.1.0 cascade stuck with
          # every pending repo MAIN_GREEN). Accept rank >= STAGING_GREEN. A repo that genuinely
          # failed its staging v2 is written FAILING (FAILING is never suppressed by no-downgrade),
          # so this does not let a red staging in.
          SIT_READY = {"STAGING_GREEN", "SIT_VALIDATED", "MAIN_GREEN"}
          not_green = []
          for repo in pending:
              ci = repos.get(repo, {}).get("ci_status", "NOT_CONFIGURED")
              if ci not in SIT_READY:
                  not_green.append(f"  {repo}: ci_status={ci} (need >= STAGING_GREEN)")

          if not_green:
              print("BLOCKED: SIT cannot run — not all pending repos are SIT-ready (>= STAGING_GREEN):")
              for line in not_green:
                  print(line)
              print(f"\n{len(not_green)}/{len(pending)} repos not ready. SIT blocked.")
              sys.exit(1)

          print(f"All {len(pending)} pending repos are SIT-ready (>= STAGING_GREEN). SIT can proceed.")
          PYEOF

      - name: Lock staging and record commit SHAs
        run: |
          set -euo pipefail
          python3 - <<PYEOF
          import json, datetime

          with open("workspace-manifest.json") as f:
              manifest = json.load(f)

          # Lock staging
          if "staging_status" not in manifest:
              manifest["staging_status"] = {}
          manifest["staging_status"]["locked"] = True
          manifest["staging_status"]["locked_since"] = datetime.datetime.utcnow().isoformat() + "Z"
          manifest["staging_status"]["locked_reason"] = "SIT running"
          manifest["staging_status"]["lock_version"] = None
          # Fresh lock cycle → re-arm the starvation alarm (finding H3: sit-starvation-detector sets
          # locked_alert_sent=True and never resets it, so the dangling-lock alert fires once then is
          # suppressed fleet-wide forever).
          manifest["staging_status"]["locked_alert_sent"] = False

          # Populate pending_repos from staging_versions that differ from stable versions
          staging_versions = manifest.get("staging_versions", {})
          stable_versions = manifest.get("versions", {})
          pending = [r for r, sv in staging_versions.items()
                     if not r.startswith("_") and sv != stable_versions.get(r)]
          manifest["staging_status"]["pending_repos"] = pending
          print(f"Pending repos for this SIT run: {pending}")

          # Record commit SHAs from payload
          payload_shas_raw = '${{ toJson(github.event.client_payload.commit_shas) }}'
          try:
              import sys
              payload_shas = json.loads(payload_shas_raw)
          except Exception:
              payload_shas = {}

          if "staging_commits" not in manifest:
              manifest["staging_commits"] = {"_note": "Exact commit SHAs under test in the current SIT run."}

          # Merge payload SHAs into staging_commits (preserve _note)
          for repo, sha in payload_shas.items():
              manifest["staging_commits"][repo] = sha

          tmp_path = "workspace-manifest.json.tmp"
          with open(tmp_path, "w") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
              f.write("\n")
          import os as _os
          _os.replace(tmp_path, "workspace-manifest.json")

          print(f"Staging locked. Recorded {len(payload_shas)} commit SHAs.")
          for repo, sha in payload_shas.items():
              print(f"  {repo}: {sha}")
          PYEOF
          python3 -c "import json; d=json.load(open('workspace-manifest.json')); assert 'versions' in d, 'FATAL: manifest missing versions key'" \
            || { git checkout -- workspace-manifest.json; echo "FATAL: manifest corruption detected — reverted"; exit 1; }

      - name: Commit manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet workspace-manifest.json; then
            echo "No changes. Skipping commit."
            exit 0
          fi

          git add workspace-manifest.json
          git commit -m "chore(manifest): SIT lock — staging_status.locked=true, commit SHAs recorded [skip ci]"

          # Retry-with-rebase: a concurrent sit-unlock/staging-to-main manifest commit can land on
          # main between our checkout and push. A bare `git push` then fails non-fast-forward and
          # the lock never records → the SIT promotion gate silently no-ops. Rebase + retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed manifest update (attempt ${attempt})."
              break
            fi
            echo "Push rejected (attempt ${attempt}); rebasing onto origin/main and retrying."
            git pull --rebase --autostash origin main
            if [ "${attempt}" = "5" ]; then
              echo "FATAL: could not push manifest update after 5 attempts."
              exit 1
            fi
          done

      - name: Dispatch staging-locked to all repos (re-runs Staging Lock Check on open PRs)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          OWNER="IggyIkenna"
          REPOS=$(python3 -c "import json; m=json.load(open('workspace-manifest.json')); print('\n'.join(m.get('repositories',{}).keys()))")
          FAILED=""
          while IFS= read -r REPO; do
            [ -z "$REPO" ] && continue
            gh api "repos/$OWNER/$REPO/dispatches" \
              -X POST \
              -f event_type="staging-locked" \
              2>/dev/null || FAILED="$FAILED $REPO"
          done <<< "$REPOS"
          if [ -n "$FAILED" ]; then
            echo "WARNING: Failed to dispatch to:$FAILED (repos may not exist or be archived)"
          fi
          echo "Dispatched staging-locked to all repos"

  # ── NOTIFICATION (reusable workflow) ─────────────────────────────────────────
  notify:
    name: Slack — SIT Gate
    needs: [lock-staging]
    if: always()
    uses: ./.github/workflows/notify-slack.yml
    with:
      message: "SIT gate: staging locked. Commit SHAs recorded. Dispatched staging-locked to all repos."
      severity: "INFO"
      conclusion: ${{ needs.lock-staging.result }}
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets: inherit

  persist:
    name: Persist — SIT Gate Event
    needs: [lock-staging, notify]
    if: always()
    uses: ./.github/workflows/persist-cicd-event.yml
    secrets: inherit
    with:
      repo_name: unified-trading-pm
      workflow_name: ${{ github.workflow }}
      run_id: ${{ github.run_id }}
      conclusion: ${{ needs.lock-staging.result }}
      branch: ${{ github.ref_name }}
      commit_sha: ${{ github.sha }}
      details_json: '{"event": "sit-lock"}'
