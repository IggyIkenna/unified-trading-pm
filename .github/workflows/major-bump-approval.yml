name: Major Bump Approval Handler

# Handles /approve and /reject comments on GitHub Issues with label 'major-bump-pending'.
# Created by request-major-bump.yml when a human requests a MAJOR version bump.
#
# Flow:
#   Human comments "/approve" on issue → this workflow promotes MAJOR version
#   Human comments "/reject" on issue → closes issue as rejected
#
# Gate: Only users with write/maintain/admin permission on the repo may approve/reject.
# The MAJOR version bump is the ONLY place autonomous action crosses a version boundary.
# Pre-1.0.0 bumps (0.x → 1.0.0) are equally guarded.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: manifest-update # unify-manifest-concurrency-groups: all manifest-mutating workflows share this group
  cancel-in-progress: false

jobs:
  handle-approval:
    name: Handle major-bump approval or rejection
    runs-on: ubuntu-latest
    # Only run when: issue has major-bump-pending label AND comment starts with /approve or /reject
    if: |
      contains(github.event.issue.labels.*.name, 'major-bump-pending') &&
      (startsWith(github.event.comment.body, '/approve') || startsWith(github.event.comment.body, '/reject'))

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Verify commenter has write/maintain/admin permission
        id: permission-check
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail

          PERMISSION=$(gh api \
            "repos/${{ github.repository }}/collaborators/$COMMENTER/permission" \
            --jq '.permission' 2>/dev/null || echo "none")

          echo "Commenter: $COMMENTER, Permission: $PERMISSION"

          if [[ "$PERMISSION" != "write" && "$PERMISSION" != "maintain" && "$PERMISSION" != "admin" ]]; then
            echo "DENIED: $COMMENTER has permission '$PERMISSION' — write/maintain/admin required"
            gh issue comment "${{ github.event.issue.number }}" \
              --body "❌ Permission denied: @$COMMENTER does not have write access to this repo. Only maintainers may approve MAJOR bumps."
            exit 1
          fi

          echo "permission=$PERMISSION" >> "$GITHUB_OUTPUT"
          echo "Permission verified: $COMMENTER ($PERMISSION)"

      - name: Extract major-bump metadata from issue body
        id: metadata
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail

          # The issue body embeds JSON in an HTML comment:
          # <!-- major-bump-metadata {"repo": "...", "proposed_version": "...", ...} -->
          # ISSUE_BODY is passed via env (untrusted github.event.* must not be inlined).

          METADATA=$(echo "$ISSUE_BODY" | \
            grep -oP '(?<=<!-- major-bump-metadata ).*?(?= -->)' || echo "")

          if [ -z "$METADATA" ]; then
            echo "ERROR: Could not find major-bump-metadata JSON in issue body"
            gh issue comment "${{ github.event.issue.number }}" \
              --body "❌ Could not parse major-bump metadata from issue body. Manual bump required."
            exit 1
          fi

          BUMP_REPO=$(echo "$METADATA" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['repo'])")
          PROPOSED_VERSION=$(echo "$METADATA" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['proposed_version'])")
          CURRENT_VERSION=$(echo "$METADATA" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('current_version','unknown'))")
          REASON=$(echo "$METADATA" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('reason',''))")

          echo "bump_repo=$BUMP_REPO" >> "$GITHUB_OUTPUT"
          echo "proposed_version=$PROPOSED_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

          echo "MAJOR bump request: $BUMP_REPO $CURRENT_VERSION → $PROPOSED_VERSION"
          echo "Reason: $REASON"

      - name: Handle /approve — bump version and dispatch
        if: startsWith(github.event.comment.body, '/approve')
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          BUMP_REPO: ${{ steps.metadata.outputs.bump_repo }}
          PROPOSED_VERSION: ${{ steps.metadata.outputs.proposed_version }}
          CURRENT_VERSION: ${{ steps.metadata.outputs.current_version }}
          COMMENTER: ${{ github.event.comment.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          echo "APPROVED by $COMMENTER: $BUMP_REPO $CURRENT_VERSION → $PROPOSED_VERSION"

          # 1. Clone the target repo
          git clone --depth=5 \
            "https://x-access-token:${GH_TOKEN}@github.com/IggyIkenna/${BUMP_REPO}.git" \
            "${BUMP_REPO}"

          cd "${BUMP_REPO}"

          git config user.name "major-bump-approval[bot]"
          git config user.email "major-bump-approval[bot]@users.noreply.github.com"

          # Checkout staging (MAJOR bumps always go to staging first)
          git checkout staging 2>/dev/null || git checkout -b staging "origin/staging"

          # 2. Update pyproject.toml version
          CURRENT_IN_FILE=$(grep -oP '^version\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' pyproject.toml)
          sed -i "s/^version = \"${CURRENT_IN_FILE}\"/version = \"${PROPOSED_VERSION}\"/" pyproject.toml

          git add pyproject.toml
          git commit -m "feat!: bump to MAJOR version ${PROPOSED_VERSION} (approved by @${COMMENTER})

          MAJOR version bump approved via GitHub issue #${ISSUE_NUMBER}.
          Previous version: ${CURRENT_IN_FILE}
          Approved by: @${COMMENTER}

          Co-Authored-By: major-bump-approval[bot] <major-bump-approval[bot]@users.noreply.github.com>"

          git push "https://x-access-token:${GH_TOKEN}@github.com/IggyIkenna/${BUMP_REPO}.git" staging

          # 3. Dispatch version-bump to PM
          curl -s -X POST \
            "https://api.github.com/repos/IggyIkenna/unified-trading-pm/dispatches" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"event_type\": \"version-bump\", \"client_payload\": {\"repo\": \"${BUMP_REPO}\", \"version\": \"${PROPOSED_VERSION}\", \"branch\": \"staging\", \"commit_sha\": \"$(git rev-parse HEAD)\"}}"

          echo "Version-bump dispatched to PM"

          # 4. Update issue
          cd ..
          gh issue comment "$ISSUE_NUMBER" \
            --body "✅ **MAJOR bump APPROVED** by @${COMMENTER}

          **$BUMP_REPO**: \`$CURRENT_VERSION\` → \`$PROPOSED_VERSION\`

          - Commit pushed to staging branch
          - Version-bump dispatched to PM
          - Staging lock will be set (MAJOR bump triggers staging lock)
          - SIT must pass before main promotion"

          gh issue edit "$ISSUE_NUMBER" --remove-label "major-bump-pending" --add-label "major-bump-approved"
          gh issue close "$ISSUE_NUMBER"

          # Telegram alert migrated to notify job

          echo "MAJOR bump approved and dispatched: $BUMP_REPO $PROPOSED_VERSION"

      - name: Handle /reject — close issue as rejected
        if: startsWith(github.event.comment.body, '/reject')
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          BUMP_REPO: ${{ steps.metadata.outputs.bump_repo }}
          PROPOSED_VERSION: ${{ steps.metadata.outputs.proposed_version }}
          CURRENT_VERSION: ${{ steps.metadata.outputs.current_version }}
          COMMENTER: ${{ github.event.comment.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          echo "REJECTED by $COMMENTER: $BUMP_REPO $CURRENT_VERSION → $PROPOSED_VERSION"

          gh issue comment "$ISSUE_NUMBER" \
            --body "❌ **MAJOR bump REJECTED** by @${COMMENTER}

          **$BUMP_REPO** will stay at \`$CURRENT_VERSION\`.
          To request a MAJOR bump again, run the request-major-bump workflow."

          gh issue edit "$ISSUE_NUMBER" --remove-label "major-bump-pending" --add-label "major-bump-rejected"
          gh issue close "$ISSUE_NUMBER"
          # Telegram alert migrated to notify job

  # ── SLACK NOTIFY (reusable workflow) ──────────────────────────────────
  notify:
    name: Slack — Major Bump Approval
    needs: [handle-approval]
    if: always() && needs.handle-approval.result == 'success'
    uses: ./.github/workflows/notify-slack.yml
    with:
      message: "Major Bump Approval handled | Issue #${{ github.event.issue.number }}"
      severity: "INFO"
      conclusion: ${{ needs.handle-approval.result }}
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets: inherit

  persist:
    name: Persist — Major Bump Approval Event
    needs: [handle-approval, notify]
    if: always() && needs.handle-approval.result == 'success'
    uses: ./.github/workflows/persist-cicd-event.yml
    secrets: inherit
    with:
      repo_name: unified-trading-pm
      workflow_name: ${{ github.workflow }}
      run_id: ${{ github.run_id }}
      conclusion: ${{ needs.handle-approval.result }}
      branch: ${{ github.ref_name }}
      commit_sha: ${{ github.sha }}
      details_json: '{"issue_number": "${{ github.event.issue.number }}"}'
