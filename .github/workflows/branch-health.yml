name: branch-health

# Branch health monitor — PM-local consolidation (sprawl consolidation 2026-06-27).
#
# Folds two previously separate cron workflows into one:
#   1. main-backmerge drift-tick (the hourly schedule that swept [skip ci] drift)
#      → now a dispatch job here; main-backmerge-to-ldr.yml keeps its push trigger.
#   2. promotion-lag-monitor.yml (LDR↔staging↔main lag alerts)
#      → absorbed as the lag-monitor job below; promotion-lag-monitor.yml deleted.
#   3. AR lag metric (Task 4 — published-vs-required Artifact Registry lag, G9a).
#
# SSOT: codex/08-workflows/ci-cd-flow.md § "Branch health monitor"
# Gate: drift dispatch fires; lag alert fires; AR lag surfaces.

on:
  schedule:
    - cron: "0 * * * *" # hourly (Phase-3 ci-cost 2026-07-17: alert-only surface, dedup is state-transition based — an hourly tick still fires every alert exactly once; was */30)
  workflow_dispatch:
    inputs:
      threshold_min:
        description: "Lag threshold in minutes (lag-monitor job)"
        default: "60"
      ldr_main_threshold_min:
        description: "LDR→main lag threshold in minutes, all repos (default 120)"
        default: "120"

permissions:
  contents: read

concurrency:
  group: branch-health
  cancel-in-progress: true

jobs:
  # ── JOB 1: Drift-tick — dispatch main-backmerge-to-ldr (fleet-wide) ──────────────────
  # Replaces the hourly `schedule:` trigger that was in main-backmerge-to-ldr.yml.
  # The push trigger on that workflow still handles the common case; this job is the
  # safety-net for [skip ci] commits to main that suppress the push trigger.
  # FLEET-WIDE (2026-08-19, main_backmerge_to_ldr_no_retry_safety_net_for_non_pm_repos_2026_08_18.md):
  # dispatches for unified-trading-pm + every `promotion_model: ldr_main` repo in
  # workspace-manifest.json — the same repo-set _main_direct_repos() in
  # scripts/cicd/promotion_lag_monitor.py computes — so a transient GHA failure (e.g. a
  # codeload 429) on one repo's backmerge run is re-driven on the next tick instead of
  # stranding that repo's LDR until a human or a conflict_resolver notices. A repo toggled
  # off `ldr_main` drops out on the next tick (reversible, like the promote fleet).
  # Main-backmerge-to-ldr.yml's schedule trigger is removed (template updated separately).
  drift-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Dispatch main-backmerge-to-ldr (fleet-wide drift safety-net)
        env:
          # Cross-repo dispatch → must use GH_PAT (GITHUB_TOKEN cannot trigger workflows).
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set +e
          # Prefer the LDR copy of the manifest — the same staleness guard
          # ldr-to-main-promote-fleet.yml uses (main may lag LDR when PM's own promotion is
          # stuck), so a promotion_model change takes effect on the next drift-tick, not only
          # after the next promote. On an LDR-read failure the checked-out (main) copy stands.
          git fetch origin live-defi-rollout --depth=1 --quiet 2>/dev/null || true
          if git show origin/live-defi-rollout:workspace-manifest.json > .bh-manifest.json 2>/dev/null && [ -s .bh-manifest.json ]; then
            mv -f .bh-manifest.json workspace-manifest.json
          fi
          # Repo set = unified-trading-pm (always main-direct, even though the manifest stamps
          # no promotion_model on it) ∪ every repo flagged promotion_model == "ldr_main". Same
          # logic as scripts/cicd/promotion_lag_monitor.py::_main_direct_repos(); an unreadable
          # manifest falls back to PM-only (prior behavior).
          REPOS=$(python3 -c "
          import json
          out = {'unified-trading-pm'}
          try:
              m = json.load(open('workspace-manifest.json'))
              repos = m.get('repositories', {})
              if isinstance(repos, dict):
                  for name, cfg in repos.items():
                      if isinstance(cfg, dict) and cfg.get('promotion_model') == 'ldr_main':
                          out.add(str(name))
          except (OSError, json.JSONDecodeError, ValueError):
              pass  # manifest unreadable -> PM-only fallback (prior behavior)
          print('\n'.join(sorted(out)))
          " 2>/dev/null || echo "unified-trading-pm")
          OWNER="${GITHUB_REPOSITORY_OWNER:-IggyIkenna}"
          for REPO in $REPOS; do
            [ -z "$REPO" ] && continue
            if gh workflow run main-backmerge-to-ldr.yml --repo "${OWNER}/${REPO}" 2>/dev/null; then
              echo "[branch-health:drift-tick] dispatched main-backmerge-to-ldr for ${OWNER}/${REPO}"
            else
              echo "[branch-health:drift-tick] dispatch FAILED for ${OWNER}/${REPO} (best-effort; push trigger still active)"
            fi
          done
          exit 0

  # ── JOB 2: Promotion-lag monitor ─────────────────────────────────────────────────────
  # Absorbed from promotion-lag-monitor.yml (deleted as part of sprawl consolidation).
  # Alerts #ci-failures when commits are stuck on a branch pair for >threshold_min.
  lag-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      lag: ${{ steps.scan.outputs.lag }}
      cleared: ${{ steps.scan.outputs.cleared }}
      cleared_key: ${{ steps.scan.outputs.cleared_key }}
      cleared_report: ${{ steps.scan.outputs.cleared_report }}
      report: ${{ steps.scan.outputs.report }}
      backmerge_failed: ${{ steps.scan.outputs.backmerge_failed }}
      backmerge_failure_key: ${{ steps.scan.outputs.backmerge_failure_key }}
      backmerge_failure_report: ${{ steps.scan.outputs.backmerge_failure_report }}
      backmerge_recovered: ${{ steps.scan.outputs.backmerge_recovered }}
      backmerge_recovery_key: ${{ steps.scan.outputs.backmerge_recovery_key }}
      backmerge_recovery_report: ${{ steps.scan.outputs.backmerge_recovery_report }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_CI_POLLER_APP_ID }}
          private-key: ${{ secrets.GH_APP_CI_POLLER_PRIVATE_KEY }}
          owner: IggyIkenna
      - name: Restore GitHub ETag cache
        uses: actions/cache@v5
        with:
          path: .gh-etag-cache.json
          key: gh-etag-lag-${{ github.run_id }}
          restore-keys: |
            gh-etag-lag-
      - name: Restore lag state cache
        uses: actions/cache@v5
        with:
          path: |
            .lag-state.json
            .backmerge-failure-state.json
          key: promotion-lag-state-${{ github.run_id }}
          restore-keys: |
            promotion-lag-state-
      - name: Authenticate to GCP (Firestore — best-effort)
        id: gcp_auth_lag
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Install Firestore SDK (best-effort)
        if: steps.gcp_auth_lag.outcome == 'success'
        continue-on-error: true
        run: python3 -m pip install --quiet "google-cloud-firestore>=2,<3"
      - name: Scan promotion lag
        id: scan
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_ETAG_CACHE_FILE: .gh-etag-cache.json
          THRESH: ${{ github.event.inputs.threshold_min || '60' }}
          # LDR→main gets a longer threshold for ALL repos — the promote floor is a ~40-min throttled
          # cadence, plus a full SIT round-trip (~156m; agent-orchestrator 2026-07-18 = 3 rounds) for
          # SIT-gated repos — so the base 60m self-clears on a healthy promote. Only LDR→main affected.
          LDR_MAIN_THRESH: ${{ github.event.inputs.ldr_main_threshold_min || '120' }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set +e
          # `.lag-state.json` (restored from the prior run's actions/cache) is the PREVIOUS lagging
          # set. The monitor diffs prev→current PER branch-pair: any pair that WAS lagging and now is
          # not writes a NAMED CLEARED block to .lag-cleared.txt (line 1 = per-set dedup key, line 2 =
          # the Slack message). It writes the NEW lagging set to .lag-state.next.json, which we move
          # into place so the post-job cache save persists it for the next run's diff. This replaces
          # the old fleet-wide "any-lag→no-lag" edge, which only fired when the WHOLE fleet went green
          # and never named which repair cleared.
          REPORT=$(python3 scripts/cicd/promotion_lag_monitor.py \
            --threshold-min "$THRESH" --ldr-main-threshold-min "$LDR_MAIN_THRESH" --slack \
            --state-in .lag-state.json --state-out .lag-state.next.json --cleared-out .lag-cleared.txt)
          RC=$?
          echo "$REPORT"
          if [ "$RC" -eq 1 ]; then LAG=true; else LAG=false; fi
          # Persist the new lagging set (overwrite the restored prev) so the post-job cache save carries
          # it forward. Skip if the monitor did not write it (crash) — keep the prev rather than wipe it.
          [ -f .lag-state.next.json ] && mv -f .lag-state.next.json .lag-state.json
          CLEARED=false
          CLEARED_KEY=""
          CLEARED_REPORT=""
          if [ -s .lag-cleared.txt ]; then
            CLEARED=true
            CLEARED_KEY=$(head -n 1 .lag-cleared.txt)
            CLEARED_REPORT=$(tail -n +2 .lag-cleared.txt)
          fi
          {
            echo "lag=$LAG"
            echo "cleared=$CLEARED"
            echo "cleared_key=$CLEARED_KEY"
            echo "report<<__EOR__"
            echo "$REPORT"
            echo "__EOR__"
            echo "cleared_report<<__EOR__"
            echo "$CLEARED_REPORT"
            echo "__EOR__"
          } >> "$GITHUB_OUTPUT"
          # Detect the latest completed backmerge run per main-direct repo. The cached run ID
          # makes failure alerts state-transitioned, and a later success emits the recovery edge.
          python3 - <<'PY' > .backmerge-failure-output
          import json
          import os
          import subprocess

          try:
              with open(".backmerge-failure-state.json", encoding="utf-8") as fh:
                  previous = json.load(fh)
          except (OSError, ValueError):
              previous = {}
          try:
              with open("workspace-manifest.json", encoding="utf-8") as fh:
                  manifest = json.load(fh)
              repos = {"unified-trading-pm"}
              repos.update(
                  name for name, config in manifest.get("repositories", {}).items()
                  if isinstance(config, dict) and config.get("promotion_model") == "ldr_main"
              )
          except (OSError, ValueError, AttributeError):
              repos = {"unified-trading-pm"}
          owner = os.environ.get("GITHUB_REPOSITORY_OWNER", "IggyIkenna")
          current = dict(previous)
          failures = []
          recoveries = []
          for repo in sorted(repos):
              try:
                  result = subprocess.run(
                      ["gh", "run", "list", "--repo", f"{owner}/{repo}",
                       "--workflow", "main-backmerge-to-ldr.yml", "--status", "completed",
                       "--limit", "1", "--json", "databaseId,conclusion,createdAt,url,headSha"],
                      capture_output=True, text=True, timeout=10, check=False
                  )
                  runs = json.loads(result.stdout) if result.returncode == 0 else []
              except (OSError, subprocess.TimeoutExpired, ValueError):
                  runs = []
              if not runs:
                  continue
              run = runs[0]
              run_id = str(run.get("databaseId", ""))
              conclusion = str(run.get("conclusion", "")).lower()
              if not run_id:
                  continue
              record = {"run_id": run_id, "url": run.get("url", ""),
                        "created_at": run.get("createdAt", "unknown"),
                        "head_sha": run.get("headSha", "unknown")}
              if conclusion == "failure":
                  current[repo] = record
                  if previous.get(repo, {}).get("run_id") != run_id:
                      failures.append((repo, record))
              elif conclusion == "success" and repo in previous:
                  recoveries.append((repo, record))
                  current.pop(repo, None)
          with open(".backmerge-failure-state.json", "w", encoding="utf-8") as fh:
              json.dump(current, fh, sort_keys=True)
          if failures:
              print("backmerge_failed=true")
              print("backmerge_failure_key=main-backmerge-to-ldr:failure:" + ",".join(f"{r}:{v['run_id']}" for r, v in failures))
              print("backmerge_failure_report<<__EOR__")
              print(":rotating_light: *FAILED main-backmerge-to-ldr run detected*")
              for repo, run in failures:
                  print(f"*{repo}*: run [{run['run_id']}]({run['url']}) failed ({run['created_at']}, head {str(run['head_sha'])[:12]})")
              print("__EOR__")
          else:
              print("backmerge_failed=false")
              print("backmerge_failure_key=")
              print("backmerge_failure_report<<__EOR__")
              print("__EOR__")
          if recoveries:
              print("backmerge_recovered=true")
              print("backmerge_recovery_key=main-backmerge-to-ldr:recovered:" + ",".join(f"{r}:{v['run_id']}" for r, v in recoveries))
              print("backmerge_recovery_report<<__EOR__")
              print(":large_green_circle: *main-backmerge-to-ldr RECOVERED*")
              for repo, run in recoveries:
                  print(f"*{repo}*: healthy run [{run['run_id']}]({run['url']}) for main {str(run['head_sha'])[:12]}")
              print("__EOR__")
          else:
              print("backmerge_recovered=false")
              print("backmerge_recovery_key=")
              print("backmerge_recovery_report<<__EOR__")
              print("__EOR__")
          PY
          cat .backmerge-failure-output >> "$GITHUB_OUTPUT"

  lag-notify:
    needs: lag-monitor
    if: needs.lag-monitor.outputs.lag == 'true'
    uses: ./.github/workflows/notify-slack.yml
    with:
      message: ${{ needs.lag-monitor.outputs.report }}
      severity: WARNING
      workflow_name: branch-health
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      dedup_key: promotion-lag
      # ci_failures_channel_cleanup WS-1 (D1): re-remind every 2h while a lag persists, not
      # hourly. The measured promote cadence is ~40 min (declared */15 is throttled to ~37%),
      # so a standing lag re-fired ~hourly (~24/day). 120 = ~3 real promote cycles.
      cooldown_min: 120
      # Distinct concurrency lane — this run also fires lag-notify-resolved and ar-lag-notify; without
      # per-caller suffixes GitHub would cancel a previously-pending sibling in the shared group.
      concurrency_suffix: lag
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
      # Was missing fleet-wide (incident 2026-07-25): an explicit `secrets:` block only forwards
      # what's named here, so every one of this repo's notify-slack.yml callers that used this
      # exact block silently ran the carrier's alert-ledger auth without a credential — fail-open
      # (continue-on-error), so the Slack post itself still went out, but dedup + the GCS ledger
      # (deployment-ui Alerts page) silently never ran.
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

  lag-notify-resolved:
    needs: lag-monitor
    if: needs.lag-monitor.outputs.cleared == 'true'
    uses: ./.github/workflows/notify-slack.yml
    with:
      # Names the specific branch-pair(s) that just cleared (per-pair diff in promotion_lag_monitor),
      # not a generic fleet all-clear — so a repair is visible AS it lands, even while others still lag.
      message: ${{ needs.lag-monitor.outputs.cleared_report }}
      severity: INFO
      recovery: true
      workflow_name: branch-health
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Per-cleared-SET key (from the monitor) so two distinct clears each post once; a static key would
      # let the first clear's cooldown swallow a second repo's clear.
      dedup_key: ${{ needs.lag-monitor.outputs.cleared_key }}
      cooldown_min: 30
      # Own concurrency lane so a same-run lag-notify/ar-lag-notify never cancels this pending all-clear.
      concurrency_suffix: lag-cleared
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
      # Was missing fleet-wide (incident 2026-07-25): an explicit `secrets:` block only forwards
      # what's named here, so every one of this repo's notify-slack.yml callers that used this
      # exact block silently ran the carrier's alert-ledger auth without a credential — fail-open
      # (continue-on-error), so the Slack post itself still went out, but dedup + the GCS ledger
      # (deployment-ui Alerts page) silently never ran.
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

  backmerge-failure-notify:
    needs: lag-monitor
    if: needs.lag-monitor.outputs.backmerge_failed == 'true'
    uses: ./.github/workflows/notify-slack.yml
    with:
      message: ${{ needs.lag-monitor.outputs.backmerge_failure_report }}
      severity: CRITICAL
      conclusion: failure
      workflow_name: branch-health
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      dedup_key: ${{ needs.lag-monitor.outputs.backmerge_failure_key }}
      cooldown_min: 60
      concurrency_suffix: backmerge-failure
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

  backmerge-recovery-notify:
    needs: lag-monitor
    if: needs.lag-monitor.outputs.backmerge_recovered == 'true'
    uses: ./.github/workflows/notify-slack.yml
    with:
      message: ${{ needs.lag-monitor.outputs.backmerge_recovery_report }}
      severity: INFO
      conclusion: success
      recovery: true
      workflow_name: branch-health
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      dedup_key: ${{ needs.lag-monitor.outputs.backmerge_recovery_key }}
      cooldown_min: 30
      concurrency_suffix: backmerge-recovery
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

  # ── JOB 3: AR lag metric (G9a) ───────────────────────────────────────────────────────
  # Checks published-vs-required Artifact Registry lag: for each repo on main, asserts its
  # internal dep floors are published to GCP AR. Surfaces any unpublished gap as a WARNING.
  # Fail-open design: GCP auth errors / missing gcloud → exit 0 (never blocks promotion).
  # Wire this into the image-build gate when cloud-build cutover lands (see assert_deps_published_to_ar.py).
  ar-lag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      lag: ${{ steps.scan.outputs.lag }}
      report: ${{ steps.scan.outputs.report }}
      cleared: ${{ steps.scan.outputs.cleared }}
      cleared_key: ${{ steps.scan.outputs.cleared_key }}
      cleared_report: ${{ steps.scan.outputs.cleared_report }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Restore AR lag state cache
        uses: actions/cache@v5
        with:
          path: .ar-lag-state.json
          key: ar-lag-state-${{ github.run_id }}
          restore-keys: |
            ar-lag-state-
      - name: Authenticate to GCP (AR query — best-effort)
        id: gcp_auth_ar
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Install gcloud SDK (best-effort)
        if: steps.gcp_auth_ar.outcome == 'success'
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2
      - name: Scan AR lag across fleet
        id: scan
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set +e
          LAG=false
          REPORT_LINES=""
          CURRENT_LAGGING=()

          # Read the fleet's repo list from workspace-manifest.json.
          REPOS=$(python3 -c "
          import json
          m = json.load(open('workspace-manifest.json'))
          repos = m.get('repositories', {})
          print('\n'.join(r for r in repos if not r.startswith('_')))
          " 2>/dev/null || echo "")

          if [ -z "$REPOS" ]; then
            echo "AR-lag: no repos found in manifest — fail-open"
            echo "lag=false" >> "$GITHUB_OUTPUT"
            echo "report=AR-lag: no repos to check" >> "$GITHUB_OUTPUT"
            echo "cleared=false" >> "$GITHUB_OUTPUT"
            echo "cleared_key=" >> "$GITHUB_OUTPUT"
            echo "cleared_report=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Run per-repo AR check (fail-open: errors are suppressed, not reported as lag).
          while IFS= read -r REPO; do
            [ -z "$REPO" ] && continue
            RESULT=$(python3 scripts/cicd/assert_deps_published_to_ar.py "$REPO" --json 2>/dev/null || echo '{"satisfied":true,"fail_open_reason":"script-error"}')
            SATISFIED=$(echo "$RESULT" | python3 -c "import json,sys; d=json.load(sys.stdin); print('true' if d.get('satisfied',True) else 'false')" 2>/dev/null || echo "true")
            if [ "$SATISFIED" = "false" ]; then
              LAG=true
              CURRENT_LAGGING+=("$REPO")
              UNPUBLISHED=$(echo "$RESULT" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          for u in d.get('unpublished', []):
              print(f\"  {u['dep']}: needs >={u['floor']}, latest in AR={u['latest_in_ar']}\")
          " 2>/dev/null || echo "  (parse error)")
              REPORT_LINES="${REPORT_LINES}\n*${REPO}*: AR dep gap:\n${UNPUBLISHED}"
            fi
          done <<< "$REPOS"

          echo "lag=$LAG" >> "$GITHUB_OUTPUT"
          if [ "$LAG" = "true" ]; then
            FULL_REPORT=":warning: *AR Dep-Publish Lag* — internal deps not yet in Artifact Registry:${REPORT_LINES}\nFull-workspace SIT and image builds may fail until the producer publishes. Check publish-package.yml."
            printf "report<<__EOR__\n%s\n__EOR__\n" "$FULL_REPORT" >> "$GITHUB_OUTPUT"
          else
            echo "report=AR-lag: all internal deps published at floor" >> "$GITHUB_OUTPUT"
          fi

          # State-diff (mirrors lag-monitor's own prev→current per-set diff, done inline here
          # since this job's state is a flat repo-name set, not a structured branch-pair record):
          # .ar-lag-state.json (restored from the prior run's actions/cache) is the PREVIOUS
          # lagging repo set. Any repo that WAS lagging and is not in CURRENT_LAGGING just
          # cleared — named in cleared_report so ar-lag-notify-resolved can post which repo(s)
          # recovered, not a generic all-clear.
          PREV_LAGGING=""
          if [ -f .ar-lag-state.json ]; then
            PREV_LAGGING=$(python3 -c "import json; print('\n'.join(json.load(open('.ar-lag-state.json'))))" 2>/dev/null || echo "")
          fi
          printf '%s\n' "${CURRENT_LAGGING[@]}" | sed '/^$/d' | sort -u > .ar-lag-current.txt
          printf '%s\n' "$PREV_LAGGING" | sed '/^$/d' | sort -u > .ar-lag-prev.txt
          CLEARED_REPOS=$(comm -23 .ar-lag-prev.txt .ar-lag-current.txt | sed '/^$/d')
          if [ -n "$CLEARED_REPOS" ]; then
            CLEARED_LIST=$(echo "$CLEARED_REPOS" | paste -sd, -)
            CLEARED_REPORT=":large_green_circle: *AR Dep-Publish Lag RESOLVED* for: ${CLEARED_LIST//,/, } — internal deps now published at floor."
            echo "cleared=true" >> "$GITHUB_OUTPUT"
            # Per-cleared-set key (mirrors lag-monitor's cleared_key) so two distinct clears each
            # post once — a static key would let the first clear's cooldown swallow a second.
            echo "cleared_key=ar-dep-publish-lag-cleared:${CLEARED_LIST}" >> "$GITHUB_OUTPUT"
            printf "cleared_report<<__EOR__\n%s\n__EOR__\n" "$CLEARED_REPORT" >> "$GITHUB_OUTPUT"
          else
            echo "cleared=false" >> "$GITHUB_OUTPUT"
            echo "cleared_key=" >> "$GITHUB_OUTPUT"
            echo "cleared_report=" >> "$GITHUB_OUTPUT"
          fi
          # Persist current lagging set (overwrite the restored prev) so the post-job cache save
          # carries it forward — same convention as lag-monitor's .lag-state.json handoff.
          python3 -c "import json; json.dump(sorted(set(l.strip() for l in open('.ar-lag-current.txt') if l.strip())), open('.ar-lag-state.json', 'w'))"

  ar-lag-notify:
    needs: ar-lag
    if: needs.ar-lag.outputs.lag == 'true'
    uses: ./.github/workflows/notify-slack.yml
    with:
      message: ${{ needs.ar-lag.outputs.report }}
      severity: WARNING
      workflow_name: branch-health
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      dedup_key: ar-dep-publish-lag
      cooldown_min: 60
      # Own concurrency lane (see lag-notify) so this never cancels a pending promotion-lag notify.
      concurrency_suffix: ar-lag
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
      # Was missing fleet-wide (incident 2026-07-25): an explicit `secrets:` block only forwards
      # what's named here, so every one of this repo's notify-slack.yml callers that used this
      # exact block silently ran the carrier's alert-ledger auth without a credential — fail-open
      # (continue-on-error), so the Slack post itself still went out, but dedup + the GCS ledger
      # (deployment-ui Alerts page) silently never ran.
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

  ar-lag-notify-resolved:
    needs: ar-lag
    if: needs.ar-lag.outputs.cleared == 'true'
    uses: ./.github/workflows/notify-slack.yml
    with:
      # Names the specific repo(s) whose AR dep-publish gap just cleared (per-set diff in the
      # ar-lag scan step), not a generic fleet all-clear — mirrors lag-notify-resolved.
      message: ${{ needs.ar-lag.outputs.cleared_report }}
      severity: INFO
      recovery: true
      workflow_name: branch-health
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Per-cleared-SET key (from the scan step) so two distinct clears each post once; a static
      # key would let the first clear's cooldown swallow a second repo's clear.
      dedup_key: ${{ needs.ar-lag.outputs.cleared_key }}
      cooldown_min: 30
      # Own concurrency lane so a same-run ar-lag-notify never cancels this pending all-clear.
      concurrency_suffix: ar-lag-cleared
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
      # Was missing fleet-wide (incident 2026-07-25): an explicit `secrets:` block only forwards
      # what's named here, so every one of this repo's notify-slack.yml callers that used this
      # exact block silently ran the carrier's alert-ledger auth without a credential — fail-open
      # (continue-on-error), so the Slack post itself still went out, but dedup + the GCS ledger
      # (deployment-ui Alerts page) silently never ran.
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
