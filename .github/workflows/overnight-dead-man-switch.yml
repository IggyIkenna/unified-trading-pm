name: Overnight Dead Man Switch

# Runs at 03:00 UTC — 2 hours after the overnight orchestrator (01:00 UTC).
# Checks if the orchestrator had a successful run in the last 3 hours.
# If not, sends a Telegram alert so silent failures don't go unnoticed.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-orchestrator:
    runs-on: ubuntu-latest
    steps:
      - name: Check overnight orchestrator last successful run
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          echo "Checking overnight-agent-orchestrator.yml last run..."

          # Get the most recent run of the overnight orchestrator
          LAST_RUN_JSON=$(gh api "repos/${{ github.repository }}/actions/workflows/overnight-agent-orchestrator.yml/runs?per_page=1" \
            --jq '.workflow_runs[0]' 2>/dev/null || echo "{}")

          if [ "$LAST_RUN_JSON" = "{}" ] || [ "$LAST_RUN_JSON" = "null" ]; then
            echo "No runs found for overnight-agent-orchestrator.yml"
            ALERT="true"
            REASON="No runs found at all"
          else
            CONCLUSION=$(echo "$LAST_RUN_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('conclusion','unknown'))")
            UPDATED_AT=$(echo "$LAST_RUN_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('updated_at',''))")
            STATUS=$(echo "$LAST_RUN_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('status','unknown'))")
            RUN_URL=$(echo "$LAST_RUN_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('html_url',''))")

            echo "Last run: status=$STATUS conclusion=$CONCLUSION updated_at=$UPDATED_AT"

            # Check if the run completed within the last 3 hours
            if [ -n "$UPDATED_AT" ]; then
              LAST_EPOCH=$(date -d "$UPDATED_AT" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$UPDATED_AT" +%s 2>/dev/null || echo "0")
              NOW_EPOCH=$(date +%s)
              AGE_SECONDS=$((NOW_EPOCH - LAST_EPOCH))
              THREE_HOURS=10800

              if [ "$AGE_SECONDS" -gt "$THREE_HOURS" ]; then
                ALERT="true"
                AGE_HOURS=$((AGE_SECONDS / 3600))
                REASON="Last run was ${AGE_HOURS}h ago (expected within 3h)"
              elif [ "$CONCLUSION" != "success" ] && [ "$STATUS" = "completed" ]; then
                ALERT="true"
                REASON="Last run concluded with: $CONCLUSION"
              else
                ALERT="false"
                echo "Orchestrator ran recently and succeeded. All good."
              fi
            else
              ALERT="true"
              REASON="Could not determine last run time"
            fi
          fi

          if [ "$ALERT" = "true" ]; then
            echo "ALERT: $REASON"
            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
              TEXT="⚠️ *Overnight Dead Man Switch*%0A%0AOvernnight orchestrator may have failed silently.%0AReason: ${REASON}%0A%0ACheck: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/overnight-agent-orchestrator.yml"
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="${TELEGRAM_CHAT_ID}" \
                -d text="$TEXT" \
                -d parse_mode="Markdown" || true
            else
              echo "Telegram not configured — alert printed to logs only"
            fi
          fi
