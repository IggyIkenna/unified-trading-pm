name: Overnight Dead Man Switch

# Runs at 03:00 UTC — 2 hours after the overnight orchestrator (01:00 UTC).
# Checks if the orchestrator completed successfully within the last 24 hours.
# Also detects hung runs (still in_progress after 2+ hours).
# If no healthy completion found, sends a Slack alert (#ci-failures) so silent failures
# don't go unnoticed.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check overnight orchestrator completion status
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          echo "=== Overnight Dead Man Switch ==="
          echo "Checking overnight-agent-orchestrator.yml last run..."

          # Get the most recent runs (up to 3) to handle in-progress + previous
          RUNS_JSON=$(gh api "repos/${{ github.repository }}/actions/workflows/overnight-agent-orchestrator.yml/runs?per_page=3" \
            --jq '.workflow_runs' 2>/dev/null || echo "[]")

          RUN_COUNT=$(echo "$RUNS_JSON" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))" 2>/dev/null || echo "0")

          if [ "$RUN_COUNT" = "0" ]; then
            echo "No runs found for overnight-agent-orchestrator.yml"
            ALERT="true"
            REASON="No runs found at all — orchestrator may never have been triggered"
          else
            # Parse the most recent run
            CONCLUSION=$(echo "$RUNS_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0].get('conclusion') or 'null')")
            UPDATED_AT=$(echo "$RUNS_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0].get('updated_at',''))")
            CREATED_AT=$(echo "$RUNS_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0].get('created_at',''))")
            STATUS=$(echo "$RUNS_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0].get('status','unknown'))")
            RUN_URL=$(echo "$RUNS_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0].get('html_url',''))")

            echo "Last run: status=$STATUS conclusion=$CONCLUSION updated_at=$UPDATED_AT"

            ALERT="false"
            REASON=""

            # Case 1: Run is still in_progress — check if it's been running too long (hung)
            if [ "$STATUS" = "in_progress" ] || [ "$STATUS" = "queued" ]; then
              if [ -n "$CREATED_AT" ]; then
                CREATED_EPOCH=$(date -d "$CREATED_AT" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$CREATED_AT" +%s 2>/dev/null || echo "0")
                NOW_EPOCH=$(date +%s)
                RUNNING_SECONDS=$((NOW_EPOCH - CREATED_EPOCH))
                TWO_HOURS=7200

                if [ "$RUNNING_SECONDS" -gt "$TWO_HOURS" ]; then
                  RUNNING_HOURS=$((RUNNING_SECONDS / 3600))
                  ALERT="true"
                  REASON="Orchestrator appears HUNG — status=$STATUS for ${RUNNING_HOURS}h (started: $CREATED_AT)"
                else
                  echo "Orchestrator still running (${RUNNING_SECONDS}s elapsed) — likely normal, no alert."
                  # Check previous run as fallback
                  if [ "$RUN_COUNT" -gt "1" ]; then
                    PREV_CONCLUSION=$(echo "$RUNS_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[1].get('conclusion') or 'null')")
                    PREV_UPDATED=$(echo "$RUNS_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[1].get('updated_at',''))")
                    echo "Previous run: conclusion=$PREV_CONCLUSION updated=$PREV_UPDATED"
                  fi
                fi
              fi

            # Case 2: Run completed — check recency and conclusion
            elif [ "$STATUS" = "completed" ]; then
              if [ -n "$UPDATED_AT" ]; then
                LAST_EPOCH=$(date -d "$UPDATED_AT" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$UPDATED_AT" +%s 2>/dev/null || echo "0")
                NOW_EPOCH=$(date +%s)
                AGE_SECONDS=$((NOW_EPOCH - LAST_EPOCH))
                TWENTY_FOUR_HOURS=86400

                if [ "$AGE_SECONDS" -gt "$TWENTY_FOUR_HOURS" ]; then
                  AGE_HOURS=$((AGE_SECONDS / 3600))
                  ALERT="true"
                  REASON="Overnight orchestrator did not complete within last 24h — last run was ${AGE_HOURS}h ago"
                elif [ "$CONCLUSION" != "success" ]; then
                  ALERT="true"
                  REASON="Overnight orchestrator completed with conclusion=$CONCLUSION (expected success)"
                else
                  echo "Orchestrator completed successfully within 24h. All good."
                fi
              else
                ALERT="true"
                REASON="Could not determine last run completion time"
              fi

            # Case 3: Unknown status
            else
              ALERT="true"
              REASON="Unexpected orchestrator status: $STATUS"
            fi
          fi

          # Send alert if needed
          if [ "$ALERT" = "true" ]; then
            echo ""
            echo "ALERT: $REASON"
            # Slack alert fired via notify job (Telegram retired 2026-06-02)
            # Exit non-zero so the workflow shows as failed in GHA UI
            exit 1
          fi

      - name: Check out the persist-event composite action
        # CI-cost STEP 2c: `uses: ./…` resolves against the WORKSPACE, so the local composite
        # action must be on disk — this job had no checkout, hence sparse. `if: failure()` mirrors
        # the old persist job's `needs.check-orchestrator.result == 'failure'` guard: the ledger
        # only records the dead-man-switch FIRING. This workflow is KEEP-M (hosted) — these steps
        # run on GitHub's runners inside the already-billed job, independent of our VM.
        if: failure()
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Persist CI/CD event
        # Was the separate 1-billed-minute-minimum `persist:` job. Hardcoded `conclusion: failure`
        # kept — it records the CONDITION (orchestrator did not complete). secrets/vars passed
        # explicitly (composite actions get neither ambiently).
        if: failure()
        uses: ./.github/actions/persist-event
        with:
          repo_name: unified-trading-pm
          workflow_name: ${{ github.workflow }}
          run_id: ${{ github.run_id }}
          conclusion: "failure"
          branch: ${{ github.ref_name }}
          commit_sha: ${{ github.sha }}
          details_json: '{"event": "dead-man-switch-fired"}'
          cloud_provider: ${{ vars.CLOUD_PROVIDER }}
          events_bucket: ${{ vars.CICD_EVENTS_BUCKET }}
          gcp_sa_key: ${{ secrets.GCP_SA_KEY }}

  # ── SLACK NOTIFY (reusable workflow) ──────────────────────────────────
  notify:
    name: Slack — Overnight Dead Man Switch
    needs: [check-orchestrator]
    if: always() && needs.check-orchestrator.result == 'failure'
    uses: ./.github/workflows/notify-slack.yml
    with:
      message:
        "Overnight Dead Man Switch — orchestrator did not complete. Check GHA status: ${{ github.server_url }}/${{
        github.repository }}/actions/workflows/overnight-agent-orchestrator.yml"
      severity: "WARNING"
      conclusion: "failure"
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets: inherit
