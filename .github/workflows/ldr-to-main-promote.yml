name: ldr-to-main-promote

# PM-ONLY LDR→main auto-drain bot (codified 2026-06-09; the LDR→main analogue of ldr-to-staging-promote).
#
# WHY: unified-trading-pm is Option-B main-direct with NO staging, so the ldr-to-staging / staging-to-main
# drain does not apply. The ONLY path LDR→main is the PR quickmerge opens — a STANDING sweep whose head is
# the live-defi-rollout branch ref. The moment that PR squash-merges, the sweep is gone, and any LATER
# sanctioned direct push (docs(plans) flips, scripts/.github carve-out) piles up on LDR with no path to main
# until the next quickmerge. This bot closes that gap: whenever PM's LDR has real content ahead of main and
# no LDR→main PR is open, it opens one and enables v2-gated auto-merge — so direct pushes drain within the
# operator's 1-hour SLA instead of relying on the next quickmerge.
#
# FROZEN HEAD (2026-07-18): the promote PR head is an IMMUTABLE per-SHA ref `promote/<repo>/<sha12>`, NOT
# the live live-defi-rollout branch. Ported from ldr-to-main-promote-fleet.yml (which has worked this way
# since 2026-06-30) after PM's LDR-headed PR #1149 deadlocked. See the frozen-head block in the drain step
# for the two defects this closes (moving-head TOCTOU + the App-authored `action_required` deadlock).
#
# SAFETY: never force-pushes; opens a PR and enables auto-merge → quality-gates-v2 on the main PR is what
# actually merges it (a red gate leaves the PR open + BLOCKED, surfaced by ci-failure-watcher). Idempotent:
# reuses an existing open LDR→main PR (incl. quickmerge's) rather than opening a duplicate. `dry_run` lists
# what WOULD promote.
#
# CONTENT, not commit-count: a squash-merge keeps LDR perpetually ahead_by=N/behind_by=0 even when content
# matches, so the drift gate is the CHANGED-FILE count of compare/main...LDR (0 files → nothing to drain).
#
# SSOT: codex/08-workflows/ci-cd-flow.md § "PM Option-B standing LDR→main PR".

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 min → drains within a ~30-min LDR→main SLA (tightened from */30 2026-06-10)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report the drift decision without opening a PR"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ldr-to-main-promote
  cancel-in-progress: false

jobs:
  promote-ldr-to-main:
    # ubuntu-latest is now PERMANENT, not just the 2026-08-06 emergency revert this comment
    # originally recorded (agt-80c470, a then-broken glue pool). Superseded 2026-08-07
    # (self_hosted_runner_public_repo_revert_2026_08_05.md todo 24): PM went PUBLIC 2026-08-06, so
    # ubuntu-latest is free/unmetered for it, and self-hosted-on-a-public-repo is a fork-PR security
    # exposure — do NOT flip this back to `[self-hosted, glue]` even once/if the pool is repaired.
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.promote.outputs.action }}
      pr: ${{ steps.promote.outputs.pr }}
      arm_failed: ${{ steps.promote.outputs.arm_failed }}
    steps:
      # Token-pool split (sprawl consolidation 2026-06-27):
      # checkout uses GITHUB_TOKEN (same-repo read + LDR push, which is unprotected).
      # GitHub App token is reserved for cross-repo PR creation / auto-merge / dispatch
      # (GITHUB_TOKEN cannot trigger downstream workflows on other repos).
      - name: Checkout PM
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      # App token: used for cross-repo PR creation + enabling auto-merge + workflow dispatch.
      # Separate 5000/hr pool; owner-scoped so it reaches all repos under IggyIkenna.
      # App perms: Contents+PullRequests+Actions R/W.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_CI_POLLER_APP_ID }}
          private-key: ${{ secrets.GH_APP_CI_POLLER_PRIVATE_KEY }}
          owner: IggyIkenna

      - name: Drain LDR → main (content-gated, reuse open PR, self-recover v2-never-reported)
        id: promote
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          SLACK_CI_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
          # PAT for ref writes + PR authorship + the auto-merge ARM. The App token can do none of
          # those three correctly here: it cannot enablePullRequestAutoMerge (WS-L canary
          # 2026-06-26), and a PR it authors lands quality-gates-v2 in `action_required` (see the
          # frozen-head block below). Same secret + same usage as the fleet bot's GH_PAT_FOR_ARM.
          GH_PAT_FOR_ARM: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          ACTION="noop"; PR=""
          # Hardening (2026-08-03, ci_satellite_ao_dispatch_batch1 [CI] P1 — mirrors
          # unified-trading-pm@4bf65b67c's ldr-to-main-promote-fleet.yml fix): every
          # `gh pr merge --auto` arm-call site below used to swallow its own exit status
          # (`2>/dev/null || true` / `|| echo WARN`) and never tallied the failure anywhere a
          # human or Slack would see it — review agt-39a53d confirmed this failing LIVE (gh run
          # view 30774619258: "WARN: auto-merge unavailable", zero alert). ARM_FAILED now tracks
          # the outcome of the LAST arm attempt made this run (a later successful re-arm in the
          # same tick — close+reopen recovery, dirty-state reconcile — overwrites an earlier
          # failure back to "false", since only the final state matters).
          ARM_FAILED="false"

          # ── Provenance gate (D1 mirror, ldr_trunk_promotion_decoupling_2026_06_10): PM's LDR→main
          # promotes only quickmerge-provenanced content. PM is checked out here (fetch-depth 0), so
          # check the range directly. FAIL-OPEN on a checker error (never jam the PM main drain). PM
          # content is mostly carve-outs (docs(plans)/scripts/.github), so this rarely fires.
          git fetch -q --no-tags origin main live-defi-rollout 2>/dev/null || true
          PROV_BLOCKED=0
          # D1 squash-blind fix (provenance_gate_squash_perpetual_block_2026_06_17): SINCE-LAST-PROMOTE range —
          # the head SHA of the last merged LDR→main drain PR, NOT raw main..LDR. A squash-promote never lands the
          # promoted commit's SHA on main, so the raw range re-flags an already-drained trailer-less commit on EVERY
          # drain forever (06a83fb6). Fail-safe: no merged drain yet / unreachable marker → origin/main..LDR fallback.
          PROV_RANGE="$(python3 scripts/cicd/promote_provenance_range.py \
            --repo "$REPO" --owner "$OWNER" --base-branch main --fetch-remote origin)" || PROV_RANGE=""
          [ -n "$PROV_RANGE" ] || PROV_RANGE="origin/main..origin/live-defi-rollout"
          # Hardening (2026-08-11, ci_reconcile silent-exit-1 investigation): this scan does
          # O(commits) git subprocess spawns and has been measured taking 15-40s locally over PM's
          # ~425-commit marker=∅ fallback range (no merged promote PR yet to shrink it to an
          # incremental one) — 3 consecutive scheduled ticks (06:25/06:30/06:45Z) died with exit 1
          # and ZERO further output anywhere in this ~15s window, self-recovering on the next tick
          # with no root cause ever pinned down (the call site is otherwise airtight under
          # set -euo pipefail — `"$(cmd)" && A || B` never propagates cmd's failure to -e). Whatever
          # the true cause (a hang, an OOM/SIGKILL of the python3 subprocess, or a runner hiccup),
          # its output was being captured silently into $PROV_OUT either way — this bounds the
          # worst case to 60s and turns any nonzero/timeout exit into a VISIBLE line instead of an
          # opaque "Process completed with exit code 1" with nothing printed.
          echo "  provenance scan: check_strict_quickmerge.py over $PROV_RANGE (bounded 60s)…"
          PROV_OUT="$(timeout 60 python3 scripts/cicd/check_strict_quickmerge.py --range "$PROV_RANGE" --block 2>&1)" && PROV_RC=0 || PROV_RC=$?
          if [ "${PROV_RC:-0}" -eq 124 ]; then
            echo "⚠️  provenance checker TIMED OUT after 60s scanning $PROV_RANGE — failing OPEN (never reported as '0 violations')"
          fi
          if [ "${PROV_RC:-0}" -ne 0 ] && printf '%s' "$PROV_OUT" | grep -q 'bypassed quickmerge'; then
            PROV_BLOCKED=1
            echo "⛔ provenance: PM LDR carries non-quickmerge CODE — LDR→main auto-merge will NOT be armed:"
            printf '%s\n' "$PROV_OUT" | sed 's/^/    /'
            # Level-2 WARN to #ci-failures (drain-time detection; the block is the enforcement).
            if [ -n "${SLACK_CI_WEBHOOK_URL:-}" ]; then
              # Pure bash (no printf|grep|head pipeline) — ldr_to_main_promote_fleet_sigpipe_silent_drop
              # (2026-07-21): under `set -euo pipefail`, `head` closing its read end before an upstream
              # producer finishes writing a large payload SIGPIPEs the producer. This step is NOT
              # backgrounded here (unlike the fleet bot's per-repo subshell), so a SIGPIPE would abort the
              # whole step loudly rather than silently — lower risk, per the original finding — but not
              # proven safe either; closed the same way for consistency.
              PROV_DETAIL=""; _pd_n=0
              while IFS= read -r _pd_line; do
                case "$_pd_line" in *"- "*) : ;; *) continue ;; esac
                PROV_DETAIL="${PROV_DETAIL}${_pd_line}"$'\n'
                _pd_n=$((_pd_n + 1))
                [ "$_pd_n" -ge 5 ] && break
              done <<< "$PROV_OUT"
              PROV_DETAIL="$(printf '%s' "$PROV_DETAIL" | sed 's/"/'"'"'/g')"
              curl -s -X POST "$SLACK_CI_WEBHOOK_URL" -H 'Content-Type: application/json' \
                -d "{\"text\":\":no_entry: *Provenance gate BLOCKED a promotion* — \`$OWNER/$REPO\` LDR→main carries code that bypassed quickmerge (auto-merge NOT armed). Re-ship via quickmerge or revert on live-defi-rollout.\n\`\`\`$PROV_DETAIL\`\`\`\"}" >/dev/null 2>&1 || true
            fi
          elif [ "${PROV_RC:-0}" -ne 0 ]; then
            echo "WARN: provenance checker errored (rc=$PROV_RC) — failing OPEN. $PROV_OUT"
          fi

          # ── Frozen-head migration (2026-07-18) ───────────────────────────────────────────────
          # This bot (2026-06-09) predates the fleet bot's frozen-head design (2026-06-30) and was
          # never migrated: it opened its promote PR with `--head live-defi-rollout`. Two defects
          # came with that, both already solved in ldr-to-main-promote-fleet.yml:
          #
          #  [1] TOCTOU + a land-mine. The PR head IS the SSOT branch, so it advances under every
          #      push while quality-gates-v2 runs (PM's LDR moves 18-26 commits/hr; v2 takes 1-3
          #      min) and auto-merge fires ASYNCHRONOUSLY on whatever head is current — so an
          #      UN-validated tree can merge. Worse, an LDR-headed PR armed with --delete-branch
          #      DELETES live-defi-rollout on merge (it deleted deployment-ui's LDR 2026-06-29),
          #      which is why this bot could never safely reclaim its own refs.
          #  [2] action_required deadlock. A promote PR authored by the uts-ci-poller APP lands
          #      quality-gates-v2 in `action_required` — held for approval, 0s, never executes — so
          #      the required context never reports and the PR sits BLOCKED forever. A/B-proven on a
          #      held head SHA (WS-L 2026-06-27): App-created → action_required; PAT-created → ran →
          #      success → merged. The close+reopen recovery below is the REACTIVE band-aid for this;
          #      authoring with the PAT removes the cause. Measured 2026-07-18: PR #1149 sat BLOCKED
          #      with zero runs on its head while the glue pool was down, so the band-aid (which
          #      needs a bot tick) could not fire either.
          #
          # Fix, ported from the fleet bot: an IMMUTABLE per-SHA ref as the head + a PAT-authored PR,
          # with fleet bug#5 (legacy no-slash ref D/F-conflicts the per-SHA ref) and bug#7 (a stale
          # LDR-headed promote PR is a land-mine) guards.
          # SSOT: codex/08-workflows/ci-cd-flow.md § "PM Option-B standing LDR→main PR".
          [ -n "${GH_PAT_FOR_ARM:-}" ] || GH_PAT_FOR_ARM="$GH_TOKEN" # fail-safe: never empty-token a gh call
          LDR_SHA=$(gh api "repos/$OWNER/$REPO/commits/live-defi-rollout" --jq '.sha' 2>/dev/null || echo "")
          if [ -z "$LDR_SHA" ] || [ "$LDR_SHA" = "null" ]; then
            echo "WARN: could not resolve live-defi-rollout tip — skipping this tick (retry in 15m)"
            { echo "action=noop"; echo "pr="; echo "arm_failed=$ARM_FAILED"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PROMOTE_HEAD="promote/$REPO/${LDR_SHA:0:12}"

          # bug#7 guard: close any stale head=live-defi-rollout promote PR into main — including the
          # ones THIS bot opened before this migration. Backmerge PRs are base=live-defi-rollout, so
          # they are not matched.
          if [ "$DRY_RUN" != "true" ]; then
            for _LDR_PR in $(gh pr list --repo "$OWNER/$REPO" --base main --head live-defi-rollout \
                --state open --json number --jq '.[].number' 2>/dev/null); do
              gh pr close "$_LDR_PR" --repo "$OWNER/$REPO" \
                --comment "Closed by the PM Option-B drain bot (frozen-head migration 2026-07-18): promotes now open from an immutable per-SHA ref (\`promote/<repo>/<sha>\`). A head=live-defi-rollout promote PR merges an unvalidated moving head, and would DELETE the SSOT branch if ever armed with --delete-branch." 2>/dev/null \
                && echo "  🛡️  bug#7 guard: closed stale LDR-headed promote PR #$_LDR_PR" || true
            done
          fi

          # ── Reuse an open promote PR from the CURRENT per-SHA ref ──
          PR_NUM=$(gh pr list --repo "$OWNER/$REPO" --base main --head "$PROMOTE_HEAD" \
            --state open --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -z "$PR_NUM" ] || [ "$PR_NUM" = "null" ]; then
            # ── No open PR → only open one if there is REAL content drift. TREE equality is the ──
            # ── exact check (2026-06-12): compare/...files is computed from the MERGE-BASE, so   ──
            # ── after a squash-merge it reports phantom changed-files forever even when the two  ──
            # ── trees are byte-identical (the bug that empty-promote-looped ldr-to-staging 375×/ ──
            # ── day). PM was shielded only because main-backmerge's merge-commit advances the    ──
            # ── merge-base — make the gate exact, not incidentally-correct.                      ──
            LDR_TREE=$(gh api "repos/$OWNER/$REPO/commits/live-defi-rollout" --jq '.commit.tree.sha' 2>/dev/null || echo "ERR_LDR")
            MAIN_TREE=$(gh api "repos/$OWNER/$REPO/commits/main" --jq '.commit.tree.sha' 2>/dev/null || echo "ERR_MAIN")
            if [ "$LDR_TREE" = "$MAIN_TREE" ]; then
              echo "✅ main tree == LDR tree (content-identical; any ahead_by gap is squash-accounting noise) — nothing to drain"
              { echo "action=noop"; echo "pr="; echo "arm_failed=$ARM_FAILED"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            FILES=$(gh api "repos/$OWNER/$REPO/compare/main...live-defi-rollout" --jq '.files | length' 2>/dev/null || echo "0")
            if [ -z "$FILES" ] || [ "$FILES" = "0" ]; then
              echo "✅ main is content-current with LDR (0 changed files) — nothing to drain"
              { echo "action=noop"; echo "pr="; echo "arm_failed=$ARM_FAILED"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # ── Don't preempt an in-flight validation (2026-07-27) ──────────────────────────
            # Without this, the superseded-ref cleanup below closes whatever promote PR is
            # currently open the moment LDR's tip moves at all — even if that PR's
            # quality-gates-v2 run is mid-flight and about to pass. Under PM's commit velocity
            # (18-26/hr) almost every tick observes a new tip, so almost every attempt got
            # killed before its ~1-3 min v2 run could finish — only a tick landing in a window
            # with ZERO new commits for that whole duration ever survived to merge (observed:
            # v2 re-ran 15-20x in 45 min). Fix: if an existing open promote/* PR's v2 run for
            # its own head SHA hasn't reached a terminal state yet, skip this tick entirely —
            # let it finish (merges on success; superseded on the NEXT tick if it fails). This
            # doesn't skip validating any commit — it just stops restarting validation from zero
            # every time one lands mid-run, the same batching a merge queue gives you natively.
            # Fail-open on a query error (never let a broken check wedge the drain forever).
            _INFLIGHT_HEAD=$(gh pr list --repo "$OWNER/$REPO" --base main --state open \
              --json headRefName --jq ".[] | select(.headRefName | startswith(\"promote/$REPO/\")) | .headRefName" 2>/dev/null | head -1)
            if [ -n "$_INFLIGHT_HEAD" ] && [ "$_INFLIGHT_HEAD" != "$PROMOTE_HEAD" ]; then
              _INFLIGHT_SHA=$(gh pr list --repo "$OWNER/$REPO" --base main --head "$_INFLIGHT_HEAD" \
                --state open --json headRefOid --jq '.[0].headRefOid' 2>/dev/null || echo "")
              if [ -n "$_INFLIGHT_SHA" ]; then
                _V2_INFLIGHT=$(gh run list --repo "$OWNER/$REPO" --workflow quality-gates-v2.yml --limit 20 \
                  --json headSha,status --jq "[.[]|select(.headSha==\"$_INFLIGHT_SHA\" and .status!=\"completed\")]|length" 2>/dev/null || echo "0")
                if [ "${_V2_INFLIGHT:-0}" != "0" ]; then
                  # Doomed-run detection (2026-08-10): a run whose checks/tests slice has ALREADY
                  # concluded `failure` cannot pass — inflight_wait on it only wedges the drain
                  # behind a slow remaining leg (PM tests take 70-135 min) for a known-failure
                  # outcome. Supersede it immediately. Measured live: a stale promote PR
                  # (head=promote/unified-trading-pm/12bb896a446c) sat un-superseded for 80+ min
                  # while its checks slice had already failed and only the tests leg kept the run
                  # non-terminal; LDR grew 1627 commits ahead of main behind it.
                  # Fail-open: a query error → _V2_DOOMED=0 → fall through to the original
                  # inflight_wait behaviour below (never supersede on a broken check).
                  _V2_DOOMED=$(gh api "repos/$OWNER/$REPO/commits/$_INFLIGHT_SHA/check-runs" \
                    --jq '[.check_runs[] | select(.name | contains("QG slice")) | select(.conclusion == "failure")] | length' 2>/dev/null || echo "0")
                  if [ "${_V2_DOOMED:-0}" != "0" ]; then
                    echo "⏭ existing promote PR (head=$_INFLIGHT_HEAD) has a FAILED QG slice (doomed run) — superseding this tick instead of waiting it out"
                  else
                    echo "⏳ existing promote PR (head=$_INFLIGHT_HEAD) has quality-gates-v2 still running — not superseding this tick, letting it finish"
                    { echo "action=inflight_wait"; echo "pr="; echo "arm_failed=$ARM_FAILED"; } >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                fi
              fi
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "DRY-RUN: would open LDR→main PR ($FILES changed file(s))"
              { echo "action=would-open"; echo "pr="; echo "arm_failed=$ARM_FAILED"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # bug#5 hardening: delete the LEGACY no-slash `promote/$REPO` ref FIRST — it
            # directory/file-conflicts `promote/$REPO/<sha>` (HTTP 422) and the superseded-ref
            # cleanup below (which filters on "promote/$REPO/") can never catch it. Left unhandled
            # it froze 15/21 fleet repos at ref-creation on 2026-06-29.
            if gh api "repos/$OWNER/$REPO/git/refs/heads/promote/$REPO" >/dev/null 2>&1; then
              GH_TOKEN="$GH_PAT_FOR_ARM" gh api -X DELETE "repos/$OWNER/$REPO/git/refs/heads/promote/$REPO" >/dev/null 2>&1 \
                && echo "  🛡️  bug#5: deleted legacy no-slash ref refs/heads/promote/$REPO (D/F-conflicts the per-SHA ref)" || true
            fi
            # Create-only (POST). A 409 means a prior tick already created it for this SAME SHA —
            # correct, not an error: verify it resolves and continue. The ref is immutable (its name
            # encodes the SHA), so it never needs a force-update.
            if ! GH_TOKEN="$GH_PAT_FOR_ARM" gh api -X POST "repos/$OWNER/$REPO/git/refs" \
                 -f ref="refs/heads/$PROMOTE_HEAD" -f sha="$LDR_SHA" >/dev/null 2>&1; then
              if ! gh api "repos/$OWNER/$REPO/git/refs/heads/$PROMOTE_HEAD" >/dev/null 2>&1; then
                echo "  ⛔ could not create immutable promote ref $PROMOTE_HEAD @ ${LDR_SHA:0:8} — retry next tick"
                { echo "action=noop"; echo "pr="; echo "arm_failed=$ARM_FAILED"; } >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            echo "  frozen-head: $PROMOTE_HEAD → ${LDR_SHA:0:12} (tree ${LDR_TREE:0:12}) — PR opens from this immutable ref"
            # Superseded-ref cleanup: when LDR advances, the previous tick's ref is stale. Close its
            # open PR and delete the ref so orphan promote/* branches don't accumulate.
            for _STALE_HEAD in $(gh pr list --repo "$OWNER/$REPO" --base main --state open \
                --json headRefName \
                --jq ".[] | select(.headRefName | startswith(\"promote/$REPO/\")) | select(.headRefName != \"$PROMOTE_HEAD\") | .headRefName" 2>/dev/null); do
              _STALE_NUM=$(gh pr list --repo "$OWNER/$REPO" --base main --head "$_STALE_HEAD" \
                --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
              if [ -n "$_STALE_NUM" ] && [ "$_STALE_NUM" != "null" ]; then
                gh pr close "$_STALE_NUM" --repo "$OWNER/$REPO" \
                  --comment "Closed by the PM Option-B drain bot: superseded by a newer LDR tip (new ref: \`$PROMOTE_HEAD\`)." 2>/dev/null || true
                echo "  closed superseded promote PR #$_STALE_NUM (head=$_STALE_HEAD)"
              fi
              GH_TOKEN="$GH_PAT_FOR_ARM" gh api -X DELETE "repos/$OWNER/$REPO/git/refs/heads/$_STALE_HEAD" >/dev/null 2>&1 \
                && echo "  deleted orphan promote ref refs/heads/$_STALE_HEAD" || true
            done
            BODY="PM Option-B auto-drain: live-defi-rollout → main ($FILES changed file(s)) from the immutable per-SHA ref \`$PROMOTE_HEAD\` @ ${LDR_SHA:0:12}. Sweeps sanctioned direct pushes (docs(plans) flips, scripts/.github carve-out) to main. Merges when quality-gates-v2 passes. SSOT: ldr-to-main-promote.yml."
            # PAT-authored, NOT App-authored — an App-created promote PR deadlocks in
            # `action_required` forever (see [2] in the frozen-head block above).
            PR_URL=$(GH_TOKEN="$GH_PAT_FOR_ARM" gh pr create --repo "$OWNER/$REPO" \
              --title "chore(promote): LDR → main (Option-B auto-drain)" \
              --body "$BODY" --base main --head "$PROMOTE_HEAD" 2>/dev/null || true)
            if [ -z "$PR_URL" ]; then
              # Race: another run opened it between the list and the create.
              PR_NUM=$(gh pr list --repo "$OWNER/$REPO" --base main --head "$PROMOTE_HEAD" \
                --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
              [ -z "$PR_NUM" ] && { echo "WARN: PR create failed and none found"; { echo "action=noop"; echo "pr="; echo "arm_failed=$ARM_FAILED"; } >> "$GITHUB_OUTPUT"; exit 0; }
            else
              echo "  opened $PR_URL ($FILES changed file(s))"
              if [ "$PROV_BLOCKED" = 1 ]; then
                echo "  ⛔ provenance-blocked — NOT arming auto-merge (PR left open)"
                gh pr comment "$PR_URL" --repo "$OWNER/$REPO" --body "⛔ **Provenance gate (Option-B drain)** — PM's LDR→main carries code that bypassed quickmerge. Auto-merge not armed; re-ship via \`quickmerge\` or revert on \`live-defi-rollout\`." 2>/dev/null || true
                { echo "action=provenance_blocked"; echo "pr=$PR_URL"; echo "arm_failed=$ARM_FAILED"; } >> "$GITHUB_OUTPUT"
                exit 0
              fi
              # --delete-branch is safe ONLY because the head is the bot's per-SHA ref. It is
              # COUPLED to the frozen head: with head=live-defi-rollout this flag deletes the SSOT
              # branch on merge (deployment-ui, 2026-06-29). Never re-add one without the other.
              # PAT-armed: the App token cannot enablePullRequestAutoMerge (WS-L 2026-06-26).
              if GH_TOKEN="$GH_PAT_FOR_ARM" gh pr merge "$PR_URL" --auto --merge --delete-branch --repo "$OWNER/$REPO" 2>/dev/null; then
                echo "  ✅ auto-merge armed on $PR_URL"
              else
                echo "  ⛔ WARN: auto-merge ARM FAILED for $REPO — merge manually: $PR_URL"
                ARM_FAILED="true"
              fi
              { echo "action=opened"; echo "pr=$PR_URL"; echo "arm_failed=$ARM_FAILED"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # ── An open PR exists → ensure auto-merge is on, and self-recover the v2-never-reported ──
          # ── deadlock (required check ABSENT on the current head → close+reopen re-fires v2).     ──
          PR="https://github.com/$OWNER/$REPO/pull/$PR_NUM"
          echo "  existing open LDR→main PR #$PR_NUM ($PR)"
          if [ "$PROV_BLOCKED" = 1 ]; then
            echo "  ⛔ provenance-blocked — leaving PR open, not arming auto-merge"
            gh pr comment "$PR_NUM" --repo "$OWNER/$REPO" --body "⛔ **Provenance gate (Option-B drain)** — non-quickmerge code on \`live-defi-rollout\`; auto-merge not armed until LDR is clean." 2>/dev/null || true
            { echo "action=provenance_blocked"; echo "pr=$PR"; echo "arm_failed=$ARM_FAILED"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Hardening (2026-08-03, mirrors 4bf65b67c): this routine per-tick re-arm attempt used to
          # silently swallow its own failure (`|| true`) into the same untallied nothing as a genuine
          # arm. A later successful re-arm below (close+reopen recovery / dirty-state reconcile) in
          # this same tick overwrites this back to "false" — only the final state matters.
          if GH_TOKEN="$GH_PAT_FOR_ARM" gh pr merge "$PR_NUM" --auto --merge --delete-branch --repo "$OWNER/$REPO" 2>/dev/null; then
            ARM_FAILED="false"
          else
            echo "  ⛔ WARN: auto-merge ARM FAILED for $REPO on existing PR #$PR_NUM — merge manually"
            ARM_FAILED="true"
          fi

          MSTATE=$(gh api "repos/$OWNER/$REPO/pulls/$PR_NUM" --jq '.mergeable_state' 2>/dev/null || echo "")
          if [ "$MSTATE" = "blocked" ]; then
            HEAD_SHA=$(gh api "repos/$OWNER/$REPO/pulls/$PR_NUM" --jq '.head.sha' 2>/dev/null || echo "")
            # Actions-API run lookup, NOT REST /check-runs and NOT GraphQL rollup (2026-06-10):
            # fine-grained PATs can never hold a "Checks" permission (GitHub's picker doesn't
            # offer one) → BOTH check-read paths 403, and the old `|| echo 0` made EVERY blocked
            # PR read as v2-never-reported → spurious close+reopen churn. The Actions API works
            # with the PAT ("Actions" permission), and "a v2 RUN exists for this head SHA" is the
            # same signal. ERR ≠ 0: on query failure we fail-SAFE (leave the PR alone).
            # Exclude action_required/cancelled (mirrors fleet + staging): an App/bot-actor push to
            # LDR (e.g. the main-backmerge merge commit) lands the pull_request v2 run in
            # `action_required` (held for approval, 0s, never executes) — counting it as "present"
            # made this recovery conclude "genuine gate fail" and leave the PR deadlocked forever
            # (PR #1117, 2026-07-17). A held/cancelled run is NOT a report.
            HAS_V2=$(gh run list --repo "$OWNER/$REPO" --workflow quality-gates-v2.yml --limit 50 \
              --json headSha,conclusion --jq "[.[]|select(.headSha==\"$HEAD_SHA\" and .conclusion!=\"action_required\" and .conclusion!=\"cancelled\")]|length" 2>/dev/null || echo "ERR")
            if [ "$HAS_V2" = "ERR" ]; then
              echo "  WARN: statusCheckRollup query failed for PR #$PR_NUM — leaving it (no blind recovery)"
            fi
            if [ -n "$HEAD_SHA" ] && [ "${HAS_V2:-0}" = "0" ] && [ "$DRY_RUN" != "true" ]; then
              echo "  v2-never-reported on head ${HEAD_SHA:0:8} — close+reopen to re-fire quality-gates-v2"
              gh pr close "$PR_NUM" --repo "$OWNER/$REPO" 2>/dev/null && sleep 3 \
                && gh pr reopen "$PR_NUM" --repo "$OWNER/$REPO" 2>/dev/null || true
              # Hardening (2026-08-03, mirrors 4bf65b67c): tested independently of the close/reopen
              # chain above (which keeps its own `|| true` fail-safety) so a genuine arm failure here
              # is tallied instead of silently folded into the unconditional "recovered" action.
              if GH_TOKEN="$GH_PAT_FOR_ARM" gh pr merge "$PR_NUM" --auto --merge --delete-branch --repo "$OWNER/$REPO" 2>/dev/null; then
                ARM_FAILED="false"
              else
                echo "  ⛔ WARN: auto-merge ARM FAILED for $REPO on close+reopen re-arm #$PR_NUM — merge manually"
                ARM_FAILED="true"
              fi
              ACTION="recovered"
            else
              echo "  PR #$PR_NUM blocked but v2 present on head (genuine gate fail or in-progress) — leaving it"
              ACTION="blocked"
              # ao_worker_context_lifecycle_gap_2026_07_25.md / ao_fleet_throughput_incident_2026_07_25.md finding
              # (2026-07-25): a genuine quality-gates-v2 FAILURE on this promote PR previously had NO escalation
              # path at all — every other wall type here (dirty/conflict) escalates via main-backmerge-to-ldr, but
              # a real test/typecheck/lint failure just sat until the next */15 tick superseded the PR with a
              # fresh attempt from a (hopefully by-then-different) LDR tip, silently re-trying the SAME failure
              # indefinitely with no one ever notified to fix the root cause. Purely additive — does not alter any
              # existing branch above; only fires when the v2 run for this exact head SHA CONCLUDED as a failure
              # (not in-progress, not action_required/cancelled, already excluded by HAS_V2 above). Dedup/cooldown
              # is handled server-side by the orchestrator's escalation wall-cooldown key
              # (server/escalation.py::_wall_cooldown_key), so it's safe to fire this on every tick the failure
              # persists — repeat dispatches for the same (repo, wall_type) within the cooldown window are dropped.
              V2_FAILED=$(gh run list --repo "$OWNER/$REPO" --workflow quality-gates-v2.yml --limit 50 \
                --json headSha,conclusion --jq "[.[]|select(.headSha==\"$HEAD_SHA\" and .conclusion==\"failure\")]|length" 2>/dev/null || echo "0")
              if [ "${V2_FAILED:-0}" != "0" ] && [ "$DRY_RUN" != "true" ]; then
                V2_RUN_URL=$(gh run list --repo "$OWNER/$REPO" --workflow quality-gates-v2.yml --limit 50 \
                  --json headSha,conclusion,url --jq "[.[]|select(.headSha==\"$HEAD_SHA\" and .conclusion==\"failure\")][0].url" 2>/dev/null || echo "unknown")
                CTX="LDR->main promote PR #$PR_NUM (head ${HEAD_SHA:0:8}) blocked on a genuine quality-gates-v2 FAILURE, not a conflict. Run: ${V2_RUN_URL}. This promote PR will be superseded by a fresh attempt on the next */15 tick unless the underlying failure is fixed on live-defi-rollout."
                PAYLOAD=$(jq -n --arg ctx "$CTX" --arg pr "$PR_NUM" \
                  '{event_type:"escalate-to-orchestrator",client_payload:{repo:"unified-trading-pm",pr_number:$pr,wall_type:"ldr_main_qg_failure",context:$ctx,authoring_slot:"ldr-to-main-promote"}}')
                printf '%s' "$PAYLOAD" | GH_TOKEN="$GH_PAT_FOR_ARM" gh api -X POST "repos/$OWNER/unified-trading-pm/dispatches" --input - \
                  && echo "  dispatched ldr_main_qg_failure escalation for PR #$PR_NUM" \
                  || echo "::warning::ldr_main_qg_failure escalation dispatch failed for PR #$PR_NUM (non-fatal)"
              fi
            fi
          elif [ "$MSTATE" = "dirty" ]; then
            # ── L146 inline forward-drain reconcile (promotion_queue_conflict_wall_pileup_2026_06_17): ──
            # main churns workspace-manifest.json `ci_status`/version-surface every few minutes (every
            # repo's v2 result writes a [skip ci] commit to main), so the standing LDR→main PR perpetually
            # re-`dirty`s on the manifest FASTER than it can merge. The main→LDR back-merge resolver
            # (main-backmerge-to-ldr, Guard 2) fixes this — but it runs on a SEPARATE */20 tick, so the PR
            # re-diverges within ~1-3 min of each back-merge → the drain never lands. Fix: run the SAME
            # Guard-2 reconcile INLINE here on every */15 drain tick (collapse the race window to one run):
            # merge origin/main into LDR, resolve the manifest conflict via reconcile_manifest_backmerge.py
            # (CI fields → main; both-bumped version-surface → semver-max), push to LDR → the PR goes clean
            # → arm auto-merge same run. Manifest-only conflicts are auto-resolved here; a non-manifest /
            # genuine-conflict `dirty` is LEFT for the main-backmerge-to-ldr escalation (visible PR +
            # orchestrator) — do not duplicate that path. Mirrors main-backmerge-to-ldr.yml lines ~114-156.
            if [ "$DRY_RUN" = "true" ]; then
              echo "  DRY-RUN: PR #$PR_NUM dirty — would inline-reconcile main→LDR (Guard 2)"
              ACTION="would-reconcile"
            else
              git config user.name "ldr-to-main-promote[bot]"
              git config user.email "ldr-to-main-promote[bot]@users.noreply.github.com"
              git checkout -B _fwd_reconcile origin/live-defi-rollout --quiet
              if git merge --no-ff --no-edit origin/main 2>/dev/null; then
                # The `dirty` cleared between the API read and now (race) → clean merge → push + arm.
                if git push origin "HEAD:live-defi-rollout" 2>/dev/null; then
                  echo "  inline reconcile: clean merge of main→LDR pushed — PR will go clean"
                  ACTION="reconciled"
                else
                  echo "  WARN: clean-merge push rejected (LDR moved) — next */15 tick retries"
                  ACTION="reconcile_race"
                fi
              else
                CONFLICTED="$(git diff --name-only --diff-filter=U | tr '\n' ' ' | sed 's/ *$//')"
                if [ "$CONFLICTED" = "workspace-manifest.json" ] && [ -f scripts/cicd/reconcile_manifest_backmerge.py ]; then
                  MB="$(git merge-base HEAD MERGE_HEAD)"
                  git show "$MB:workspace-manifest.json" > /tmp/fwd_mb.json
                  git show HEAD:workspace-manifest.json > /tmp/fwd_ours.json        # LDR side (--ours)
                  git show MERGE_HEAD:workspace-manifest.json > /tmp/fwd_theirs.json # main side (--theirs)
                  if python3 scripts/cicd/reconcile_manifest_backmerge.py \
                       --base /tmp/fwd_mb.json --ours /tmp/fwd_ours.json --theirs /tmp/fwd_theirs.json \
                       --out workspace-manifest.json; then
                    git add workspace-manifest.json
                    git commit --no-edit --quiet
                    if git push origin "HEAD:live-defi-rollout" 2>/dev/null; then
                      echo "  inline Guard-2 reconcile pushed to LDR → PR goes clean"
                      ACTION="reconciled"
                    else
                      echo "  WARN: reconcile push rejected (LDR moved) — next */15 tick retries"
                      git merge --abort 2>/dev/null || true
                      ACTION="reconcile_race"
                    fi
                  else
                    echo "  genuine non-CI manifest conflict — leaving to main-backmerge-to-ldr escalation"
                    git merge --abort 2>/dev/null || true
                    ACTION="conflict_escalated"
                  fi
                else
                  echo "  PR #$PR_NUM dirty on non-manifest files ($CONFLICTED) — leaving to main-backmerge-to-ldr"
                  git merge --abort 2>/dev/null || true
                  ACTION="dirty_nonmanifest"
                fi
              fi
              # Re-arm auto-merge. Under FROZEN HEAD (2026-07-18) this is best-effort: the reconcile
              # above pushes to live-defi-rollout, which no longer moves THIS PR's head (that head is
              # the immutable snapshot ref), so a genuinely-dirty PR stays dirty here. It self-heals
              # on the NEXT tick — the new LDR tip (now carrying the reconcile merge) gets a new
              # per-SHA ref and a fresh, clean PR, and this stale one is closed by the superseded-ref
              # cleanup. One tick (~15 min) slower than the old head==LDR behaviour, and correct
              # instead of merging a moving head. Kept for the race where `dirty` already cleared.
              # Hardening (2026-08-03, mirrors 4bf65b67c): tally instead of silently swallowing.
              if GH_TOKEN="$GH_PAT_FOR_ARM" gh pr merge "$PR_NUM" --auto --merge --delete-branch --repo "$OWNER/$REPO" 2>/dev/null; then
                ARM_FAILED="false"
              else
                echo "  ⛔ WARN: auto-merge ARM FAILED for $REPO after dirty-state reconcile on #$PR_NUM — merge manually"
                ARM_FAILED="true"
              fi
            fi
          else
            echo "  PR #$PR_NUM mergeable_state=${MSTATE:-unknown} (auto-merge pending)"
            ACTION="pending"
          fi
          # Escalation gap hardening (2026-08-11, ci_reconcile): the QG-failure wall (above) has
          # dispatched an orchestrator escalation since 2026-07-25 — a genuine dirty/conflict wall
          # never did (the comment at that call site literally says "every other wall type here
          # (dirty/conflict) escalates via main-backmerge-to-ldr", but that workflow runs its own
          # independent reconcile and has no visibility into THIS PR being stuck — it is not an
          # escalation path for THIS bot's state). Observed live: PR #2779 sat DIRTY on a genuine
          # workspace-manifest.json published_packages version/timestamp conflict across multiple
          # ticks, superseded-and-recreated every time LDR advanced, with zero human notification —
          # `ahead_by` grew (425→432) instead of shrinking and nobody was ever paged. Mirrors the
          # ldr_main_qg_failure dispatch above; same server-side wall-cooldown dedup applies, so
          # it's safe to fire on every tick the condition persists.
          case "$ACTION" in
            conflict_escalated | dirty_nonmanifest)
              if [ "$DRY_RUN" != "true" ]; then
                CTX="LDR->main promote PR #$PR_NUM ($PR) is DIRTY on a GENUINE conflict (action=$ACTION), not a checker crash. The inline forward-drain reconcile could not auto-resolve it — either a non-CI workspace-manifest.json conflict (e.g. published_packages version/published_at bumped on both main and live-defi-rollout) or a conflict outside workspace-manifest.json entirely. This blocks the ENTIRE LDR->main drain until a human resolves the conflict (reconcile the manifest / merge main into live-defi-rollout by hand); every subsequent */15 tick just supersedes this PR with a fresh attempt against the SAME unresolved conflict."
                PAYLOAD=$(jq -n --arg ctx "$CTX" --arg pr "$PR_NUM" \
                  '{event_type:"escalate-to-orchestrator",client_payload:{repo:"unified-trading-pm",pr_number:$pr,wall_type:"ldr_main_dirty_conflict",context:$ctx,authoring_slot:"ldr-to-main-promote"}}')
                printf '%s' "$PAYLOAD" | GH_TOKEN="$GH_PAT_FOR_ARM" gh api -X POST "repos/$OWNER/unified-trading-pm/dispatches" --input - \
                  && echo "  dispatched ldr_main_dirty_conflict escalation for PR #$PR_NUM" \
                  || echo "::warning::ldr_main_dirty_conflict escalation dispatch failed for PR #$PR_NUM (non-fatal)"
              fi
              ;;
          esac
          { echo "action=$ACTION"; echo "pr=$PR"; echo "arm_failed=$ARM_FAILED"; } >> "$GITHUB_OUTPUT"

  # Hardening (2026-08-03, ci_satellite_ao_dispatch_batch1 [CI] P1 — mirrors
  # unified-trading-pm@4bf65b67c's ldr-to-main-promote-fleet.yml notify-arm-failed job): an arm
  # failure previously had NO alert surface at all (see the ARM_FAILED hardening comments in the
  # promote step above) — exactly the "sits green, nobody notices" shape the source incident
  # (ldr_to_main_promote_workflows_sustained_startup_failure_2026_07_30.md) described.
  notify-arm-failed:
    name: Slack — LDR→main auto-merge ARM FAILED alert
    needs: [promote-ldr-to-main]
    if: always() && needs.promote-ldr-to-main.outputs.arm_failed == 'true'
    uses: ./.github/workflows/notify-slack.yml
    with:
      message: >
        PM LDR→main auto-drain bot: auto-merge ARM FAILED for ${{ needs.promote-ldr-to-main.outputs.pr }} — PR exists +
        provenance-clean but needs a MANUAL `gh pr merge --auto` (or plain merge once green); check repo
        `allow_auto_merge` + branch protection. SSOT: ldr-to-main-promote.yml.
      # Standing condition on a `*/15` cron — without a dedup_key a stuck arm-failed PR re-paged
      # every 15 min (ci_monitor_recovery_bookend_residual_gaps finding 1). This workflow promotes
      # only unified-trading-pm itself, so the key is stable without needing a repo suffix.
      dedup_key: ldr-main-arm-failed-pm
      cooldown_min: 60
    secrets: inherit
