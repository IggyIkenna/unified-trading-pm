# flow-health-reporter.yml — unified "is everything flowing?" surface
#
# Today only main→LDR drift is watched (main-backmerge-to-ldr.yml opens a PR on
# conflict). staging↔LDR + main↔staging drift is invisible, and there is no single
# firm-wide flow-health verdict. This workflow closes that gap: hourly it gathers
# per-repo branch-compare facts across the THREE axes (main↔staging, main↔LDR,
# staging↔LDR) + the oldest open-PR age, runs the hermetic compute core
# (scripts/cicd/flow_health.py), and posts a SINGLE transition-gated Slack alert —
# 🔴 flow-blocked / 🟢 flow-recovered — only on a state CHANGE (mirrors
# ci-status-update.yml's notify_worthy anti-spam, via the GH Actions cache).
#
# Compute is I/O-free + hermetically tested (tests/unit/test_flow_health.py). This
# workflow only does the gh-api fact-gathering + the cache-backed transition gate.
#
# SSOT: this file lives canonically in unified-trading-pm/.github/workflows/.
# Companion: scripts/cicd/flow_health.py. Plan: CI/CD Observability item G + F2.

name: flow-health-reporter

on:
  schedule:
    - cron: "7 * * * *" # hourly, offset 7m to dodge the top-of-hour rush
  workflow_dispatch:

permissions:
  contents: read
  actions: write # cache read/write for the transition gate

concurrency:
  group: flow-health-reporter
  cancel-in-progress: true

jobs:
  flow-health:
    name: Compute flow-health verdict
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      state: ${{ steps.compute.outputs.state }}
      prev_state: ${{ steps.gate.outputs.prev_state }}
      notify_worthy: ${{ steps.gate.outputs.notify_worthy }}
      summary_b64: ${{ steps.compute.outputs.summary_b64 }}
    steps:
      - name: Checkout (manifest + compute core)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Restore the previous flow-state token (written at the end of the last run).
      # actions/cache is the cross-run store; a cache miss = first-ever run.
      - name: Restore previous flow-state
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: .flow_state
          key: flow-health-state-${{ github.run_id }}
          restore-keys: |
            flow-health-state-

      - name: Gather per-repo branch-compare facts
        id: gather
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail

          # Build facts.json by comparing the three branch pairs per ACTIVE repo.
          # gh api compare(base=A, head=B) → .ahead_by = commits on B not on A,
          #                                  .behind_by = commits on A not on B.
          # A 404 (branch absent / repo main-only) → omit that pair (no drift).
          python3 - <<'PYEOF'
          import json, os, subprocess
          from pathlib import Path

          owner = os.environ["OWNER"]
          manifest = json.loads(Path("workspace-manifest.json").read_text())
          repos = manifest.get("repositories", {})

          PAIRS = {
              "main_vs_staging": ("main", "staging"),
              "main_vs_ldr": ("main", "live-defi-rollout"),
              "staging_vs_ldr": ("staging", "live-defi-rollout"),
          }

          def gh_json(args: list[str]) -> dict | None:
              try:
                  out = subprocess.run(
                      ["gh", "api", *args], capture_output=True, text=True, timeout=30
                  )
              except Exception:
                  return None
              if out.returncode != 0:
                  return None
              try:
                  return json.loads(out.stdout)
              except Exception:
                  return None

          def repo_owner(info: dict) -> str:
              url = info.get("github_url", "") or ""
              # https://github.com/<owner>/<repo>
              parts = url.rstrip("/").split("/")
              return parts[-2] if len(parts) >= 2 and parts[-2] else owner

          facts: dict[str, dict] = {}
          for name, info in repos.items():
              if not isinstance(info, dict):
                  continue
              if info.get("status") != "active":
                  continue
              ro = repo_owner(info)
              rf: dict = {"branches": {}, "compare": {}, "oldest_open_pr_age_hours": None}

              # Branch existence (a 404 ref = absent).
              for br in ("main", "staging", "live-defi-rollout"):
                  ref = gh_json([f"repos/{ro}/{name}/branches/{br}", "--jq", ".name"])
                  rf["branches"][br] = bool(ref)

              for key, (base, head) in PAIRS.items():
                  if not (rf["branches"].get(base) and rf["branches"].get(head)):
                      continue
                  cmp_obj = gh_json([
                      f"repos/{ro}/{name}/compare/{base}...{head}",
                      "--jq", "{ahead_by: .ahead_by, behind_by: .behind_by}",
                  ])
                  if cmp_obj:
                      rf["compare"][key] = {
                          "ahead_by": cmp_obj.get("ahead_by", 0),
                          "behind_by": cmp_obj.get("behind_by", 0),
                      }

              # Oldest open PR age (hours) across all open PRs in the repo.
              prs = gh_json([
                  f"repos/{ro}/{name}/pulls",
                  "-X", "GET", "-f", "state=open", "-f", "sort=created", "-f", "direction=asc",
                  "-f", "per_page=1",
                  "--jq", ".[0].created_at // empty",
              ])
              if isinstance(prs, str) and prs:
                  from datetime import datetime, timezone
                  created = datetime.fromisoformat(prs.replace("Z", "+00:00"))
                  age_h = (datetime.now(timezone.utc) - created).total_seconds() / 3600.0
                  rf["oldest_open_pr_age_hours"] = round(age_h, 2)

              facts[name] = rf

          Path("facts.json").write_text(json.dumps({"repos": facts}, indent=2))
          print(f"Gathered facts for {len(facts)} active repo(s)")
          PYEOF

      - name: Compute verdict
        id: compute
        run: |
          set -uo pipefail
          python3 scripts/cicd/flow_health.py --facts facts.json --json > verdict.json || true
          STATE=$(python3 -c "import json;print(json.load(open('verdict.json')).get('state','flow-flowing'))")
          SUMMARY=$(python3 -c "import json;print(json.load(open('verdict.json')).get('summary',''))")
          echo "state=${STATE}" >> "$GITHUB_OUTPUT"
          echo "summary_b64=$(printf '%s' "${SUMMARY}" | base64 -w0 2>/dev/null || printf '%s' "${SUMMARY}" | base64)" >> "$GITHUB_OUTPUT"
          echo "${SUMMARY}"

      - name: Transition gate (cache-backed anti-spam)
        id: gate
        env:
          NEW_STATE: ${{ steps.compute.outputs.state }}
        run: |
          set -uo pipefail
          PREV_STATE=$(cat .flow_state 2>/dev/null || echo "")
          echo "prev_state=${PREV_STATE:-none}" >> "$GITHUB_OUTPUT"

          # Transition gate (mirror of flow_health.is_transition + ci-status-update.yml):
          #   - first observation (no prev): announce ONLY when blocked
          #   - otherwise: announce on any change between blocked/flowing
          NOTIFY="false"
          if [ -z "${PREV_STATE}" ]; then
            [ "${NEW_STATE}" = "flow-blocked" ] && NOTIFY="true"
          elif [ "${PREV_STATE}" != "${NEW_STATE}" ]; then
            NOTIFY="true"
          fi
          echo "notify_worthy=${NOTIFY}" >> "$GITHUB_OUTPUT"
          echo "prev=${PREV_STATE:-none} new=${NEW_STATE} notify=${NOTIFY}"

          # Persist the new state for the next run.
          printf '%s' "${NEW_STATE}" > .flow_state

      - name: Save new flow-state
        uses: actions/cache/save@v4
        with:
          path: .flow_state
          key: flow-health-state-${{ github.run_id }}

  build-message:
    name: Build notification message
    runs-on: ubuntu-latest
    needs: [flow-health]
    if: always() && needs.flow-health.outputs.notify_worthy == 'true'
    outputs:
      message: ${{ steps.build.outputs.message }}
    steps:
      - id: build
        env:
          STATE: ${{ needs.flow-health.outputs.state }}
          PREV: ${{ needs.flow-health.outputs.prev_state }}
          SUMMARY_B64: ${{ needs.flow-health.outputs.summary_b64 }}
        run: |
          set -euo pipefail
          SUMMARY=$(printf '%s' "${SUMMARY_B64}" | base64 -d 2>/dev/null || true)
          if [ "${STATE}" = "flow-blocked" ]; then
            HEAD="🔴 CI/CD FLOW-BLOCKED (was ${PREV})"
          else
            HEAD="🟢 CI/CD FLOW-RECOVERED — ${PREV} → flowing"
          fi
          MSG=$(printf '%s\n\n%s' "${HEAD}" "${SUMMARY}")
          {
            echo "message<<MSGEOF"
            echo "${MSG}"
            echo "MSGEOF"
          } >> "$GITHUB_OUTPUT"

  notify:
    name: Slack — Flow Health
    needs: [flow-health, build-message]
    if: always() && needs.flow-health.outputs.notify_worthy == 'true'
    uses: ./.github/workflows/notify-slack.yml
    with:
      message: ${{ needs.build-message.outputs.message }}
      severity: ${{ needs.flow-health.outputs.state == 'flow-blocked' && 'CRITICAL' || 'INFO' }}
      conclusion: ${{ needs.flow-health.outputs.state == 'flow-blocked' && 'failure' || 'success' }}
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets: inherit
