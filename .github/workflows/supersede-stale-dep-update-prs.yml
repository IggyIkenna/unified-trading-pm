name: supersede-stale-dep-update-prs

# PM-CENTRAL bot — close SUPERSEDED dep-update PRs fleet-wide (promotion_queue_conflict_wall_pileup_2026_06_17).
#
# WHY: the dependency-update fan-out opens a `dep-update/<dep>-<version>` PR per consumer on a
# breaking/major bump. When a NEWER version of the same dep bumps, a new PR opens but the OLDER one
# is left open — they stack and conflict-wall (e.g. batch-live-reconciliation #82 (UTL-0.11.0)
# alongside #83 (UTL-0.12.0); market-tick-data #223 (0.11.0) alongside #224 (0.12.0)). A consumer
# bumping to `>=0.12.0` fully supersedes `>=0.11.0`, so the older PR is pure noise that walls the queue.
#
# WHAT: for each repo, group open PRs by their `dep-update/<dep>` prefix; within a group keep only the
# HIGHEST-semver-version PR and close the rest with a "superseded by #N" comment. STRICTLY bounded +
# safe: only ever closes a dep-update PR when a strictly-higher-version dep-update PR for the SAME
# (repo, dep) is ALSO open. Never rebases, never merges, never touches non-dep-update PRs.
#
# NB (companion fixes): update-dependency-version.yml is now digest-only on a non-breaking minor
# internal bump (no floor churn → no future staging-staleness conflict), and promotion_lag_monitor.py
# alerts on any dep-update/promote PR parked CONFLICTING > SLA. This bot is the supersede-cleanup leg.
#
# SAFETY: opens/merges nothing; only `gh pr close` on a provably-superseded PR. `dry_run` lists what
# WOULD close. Uses the GH App token (cross-repo).
#
# SSOT: plans/active/issues/promotion_queue_conflict_wall_pileup_2026_06_17.md.

on:
  schedule:
    - cron: "23 */2 * * *" # every 2h, offset; supersession is low-urgency cleanup
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List superseded PRs that WOULD close, without closing them"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: supersede-stale-dep-update-prs
  cancel-in-progress: false

jobs:
  supersede:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_CI_POLLER_APP_ID }}
          private-key: ${{ secrets.GH_APP_CI_POLLER_PRIVATE_KEY }}
          owner: IggyIkenna
      - name: Checkout PM (for the repo list)
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Close superseded dep-update PRs (highest version per dep wins)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          REPOS=$(python3 - <<'PYEOF'
          import json
          with open("workspace-manifest.json") as f:
              m = json.load(f)
          print("\n".join(k for k in m.get("repositories", {}) if not k.startswith("_")))
          PYEOF
          )

          CLOSED=0
          while IFS= read -r REPO; do
            [ -z "$REPO" ] && continue
            # Open dep-update PRs in this repo (head branch dep-update/<dep>-<version>).
            PRS=$(gh pr list --repo "$OWNER/$REPO" --state open --limit 100 \
              --json number,headRefName --jq '.[] | select(.headRefName | startswith("dep-update/")) | "\(.number) \(.headRefName)"' 2>/dev/null || true)
            [ -z "$PRS" ] && continue

            # Group by dep (everything before the trailing -<version>); emit "PR_TO_CLOSE SUPERSEDER" pairs.
            # Pass the PR list via an env var (NOT a pipe): `python3 - <<EOF` already consumes stdin
            # for the program text, so a piped stdin would be discarded.
            TOCLOSE=$(PRS_DATA="$PRS" python3 - <<'PYEOF'
          import os, re
          groups = {}  # dep -> list of (version_tuple, version_str, pr_number)
          for line in os.environ.get("PRS_DATA", "").splitlines():
              line = line.strip()
              if not line:
                  continue
              num, ref = line.split(" ", 1)
              body = ref[len("dep-update/"):]
              # version = trailing -X.Y.Z (semver has no hyphens); dep = the rest
              m = re.match(r"^(.*)-(\d+\.\d+\.\d+)$", body)
              if not m:
                  continue
              dep, ver = m.group(1), m.group(2)
              try:
                  vt = tuple(int(x) for x in ver.split("."))
              except ValueError:
                  continue
              groups.setdefault(dep, []).append((vt, ver, int(num)))
          for dep, items in groups.items():
              if len(items) < 2:
                  continue
              items.sort()  # ascending by version tuple
              winner = items[-1]  # highest version
              for vt, ver, num in items[:-1]:
                  print(f"{num} {winner[2]} {dep} {ver} {winner[1]}")
          PYEOF
          )
            [ -z "$TOCLOSE" ] && continue

            while IFS= read -r row; do
              [ -z "$row" ] && continue
              set -- $row
              CLOSE_NUM="$1"; KEEP_NUM="$2"; DEP="$3"; OLD_VER="$4"; NEW_VER="$5"
              if [ "$DRY_RUN" = "true" ]; then
                echo "DRY-RUN: would close $REPO #$CLOSE_NUM (dep-update/$DEP-$OLD_VER) — superseded by #$KEEP_NUM ($DEP-$NEW_VER)"
              else
                echo "Closing $REPO #$CLOSE_NUM (dep-update/$DEP-$OLD_VER) — superseded by #$KEEP_NUM ($DEP-$NEW_VER)"
                gh pr close "$CLOSE_NUM" --repo "$OWNER/$REPO" --delete-branch \
                  --comment "Superseded by #$KEEP_NUM ($DEP $NEW_VER ≥ $OLD_VER — the higher floor encompasses this one). Auto-closed by supersede-stale-dep-update-prs to unwall the promotion queue. SSOT: promotion_queue_conflict_wall_pileup_2026_06_17.md." 2>/dev/null \
                  && CLOSED=$((CLOSED + 1)) || echo "  WARN: close failed for $REPO #$CLOSE_NUM"
              fi
            done <<< "$TOCLOSE"
          done <<< "$REPOS"

          echo "=== Superseded dep-update PRs closed: $CLOSED ==="
