name: workspace-quickmerge-validation

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours — catches drift sooner than weekly
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout unified-trading-pm
        uses: actions/checkout@v5
        with:
          path: unified-trading-pm

      - name: Set up Python
        # setup.sh (which each canary repo's quickmerge --unit-only runs) requires the EXACT
        # workspace-pinned patch (3.13.9), and ubuntu-latest now ships a newer patch — without
        # provisioning it here every tick failed "[FAIL] Python 3.13.9 not found" + "[FAIL]
        # ripgrep not found" (measured: 12 consecutive red runs 2026-08-03→08-10, silent — the
        # workflow has no notify job). Mirrors python-quality-gates-v2.yml's setup-python.
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.9"

      - name: Ensure ripgrep
        # ubuntu-latest does NOT ship ripgrep; setup.sh step 9 hard-fails without it.
        run: |
          if command -v rg >/dev/null 2>&1; then
            echo "ripgrep present: $(rg --version | head -1)"
          else
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi

      - name: Clone canary repos (levels 0-2)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          cd $GITHUB_WORKSPACE
          MANIFEST="unified-trading-pm/workspace-manifest.json"
          # Use GH_PAT for private repos (full repo access); fallback to GITHUB_TOKEN
          TOKEN="${GH_PAT:-$GITHUB_TOKEN}"
          for repo in $(jq -r ".topologicalOrder.levels[0:3][].repos[]?" "$MANIFEST" 2>/dev/null | sort -u); do
            [ "$repo" = "unified-trading-pm" ] && continue
            [ -d "$repo" ] && continue
            url=$(jq -r --arg r "$repo" '.repositories[$r].github_url // empty' "$MANIFEST")
            if [ -n "$url" ]; then
              if [ -n "$TOKEN" ]; then
                # Inject token for auth (https://token@github.com/org/repo)
                auth_url=$(echo "$url" | sed "s|https://github.com/|https://x-access-token:${TOKEN}@github.com/|")
                git clone --depth 1 "$auth_url" "$repo" 2>/dev/null || echo "  Skip $repo (clone failed)"
              else
                git clone --depth 1 "$url" "$repo" 2>/dev/null || echo "  Skip $repo (clone failed)"
              fi
            fi
          done

      - name: Provision Python deps for cloned repos (uv sync)
        # Root-cause fix (2026-08-16 /ci-reconcile sweep, 15+ consecutive failures 2026-08-13->
        # 2026-08-16): each cloned canary repo's own `scripts/setup.sh` unconditionally SKIPS
        # every install step in CI mode ("CI detected — skipping venv/deps setup (CI manages
        # its own env)" — setup.sh's own comment) because that assumption is true for
        # quality-gates-v2.yml (its reusable unified-trading-ci/python-quality-gates-v2.yml DOES
        # `pip install uv==<pinned>` + `uv venv .venv` + `uv sync --frozen` before any check
        # runs) but was NEVER true here — this workflow shallow-clones canary repos and goes
        # straight to `quickmerge.sh --unit-only`, so nothing ever installed unified-api-
        # contracts' own deps. Symptom: setup.sh's "Import smoke test" step failed
        # "ModuleNotFoundError: No module named 'pydantic'" on every run. Fix mirrors the
        # EXISTING quality-gates-v2.yml pattern exactly (same UV_VERSION resolution, same
        # `uv venv` + `uv sync --frozen` shape) rather than inventing a new one — applied
        # generically to every cloned dir with both pyproject.toml + uv.lock (unified-trading-pm
        # itself included; unified-trading-ci has neither and is a no-op skip).
        run: |
          cd $GITHUB_WORKSPACE
          UV_VERSION="$(grep -oP '^UV_VERSION = "\K[^"]+' unified-trading-pm/scripts/workspace/resolve-canonical-versions.py 2>/dev/null)"
          if [ -z "$UV_VERSION" ]; then
            echo "::error::could not resolve canonical UV_VERSION from resolve-canonical-versions.py"
            exit 1
          fi
          pip install "uv==$UV_VERSION"
          for d in */; do
            d="${d%/}"
            { [ -f "$d/pyproject.toml" ] && [ -f "$d/uv.lock" ]; } || continue
            echo "  Provisioning $d ..."
            (
              cd "$d"
              uv venv .venv --quiet
              attempt=0
              until uv sync --frozen --quiet; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 3 ]; then
                  echo "::warning::uv sync --frozen failed for $d after $attempt attempts — quickmerge --unit-only will surface a real import failure below if deps are genuinely missing"
                  break
                fi
                echo "  WARN: uv sync --frozen attempt $attempt/3 failed for $d — retrying in 5s"
                sleep 5
              done
            )
          done

      - name: Ensure jq
        # Guarded because this now runs on a SHARED, long-lived host, not a throwaway hosted VM.
        # Unguarded `sudo apt-get update && install` would mutate the live orchestrator box on every
        # 6-hourly tick and can fail outright on an apt lock held by something else — a red canary
        # for a reason that has nothing to do with the job. jq is provisioned by
        # bootstrap-ci-host.sh, so on this runner the install never fires; on hosted, jq is
        # pre-installed too, so this is strictly faster there as well.
        run: |
          if command -v jq >/dev/null 2>&1; then
            echo "jq present: $(command -v jq) ($(jq --version))"
          else
            echo "jq missing — installing (expected only on a host outside bootstrap-ci-host.sh)"
            sudo apt-get update && sudo apt-get install -y jq
          fi

      - name: Run workspace quickmerge validation
        run: |
          cd unified-trading-pm
          bash scripts/validate-workspace-quickmerge.sh

      - name: Upload matrix artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quickmerge-matrix
          path: unified-trading-pm/artifacts/quickmerge-matrix.json
          if-no-files-found: ignore

      - name: Workflow summary
        if: always()
        run: |
          if [ -f unified-trading-pm/artifacts/quickmerge-matrix.json ]; then
            echo "## Workspace Quickmerge Validation" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Repo | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
            jq -r '.repos[] | "| \(.repo) | \(.status) |"' unified-trading-pm/artifacts/quickmerge-matrix.json >> $GITHUB_STEP_SUMMARY
          fi
