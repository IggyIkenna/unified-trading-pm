name: cloud-build-failure-watcher

# Cloud Build failure/rejection watcher — Gap 2 of
# plans/active/issues/cloudbuild_silent_failures_no_alerting_no_validation_2026_06_10.md.
#
# The webhook-triggered per-repo GCB image builds run OUTSIDE GitHub Actions, so
# ci-failure-watcher (which watches GH workflow runs) never sees them, and there is no
# Pub/Sub -> Slack pipe on the cloud-builds topic. This poller closes that hole:
# every 30 min it lists recent Cloud Builds (regional + global) and pages
# #ci-failures for every FAILURE / TIMEOUT / INTERNAL_ERROR / EXPIRED build.
#
# It also calls out the SILENT CONFIG-REJECTION class: a push whose cloudbuild.yaml
# fails Cloud Build's substitution validation leaves a FAILURE record with EMPTY
# substitutions (no repo, no SHA, no trigger context) and reports NOTHING to GitHub —
# from the developer's side it is indistinguishable from "no build configured".
#
# Dedup window: we look back 20 minutes on a 30-minute cron (overlap so a build created
# right at a tick boundary is never missed). Routing through notify-slack.yml (below) adds a
# CONTENT dedup_key (the sorted set of failing build IDs) so the SAME failure-set inside the
# carrier cooldown posts ONCE — collapsing the boundary-overlap double-fire to a single,
# transition-based alert (alert_quality_audit_2026_06_18 item: route via carrier + transition).
#
# DEFAULT-BRANCH GOTCHA: GitHub `schedule:` triggers fire ONLY from the DEFAULT branch
# (main). This workflow is INERT on live-defi-rollout until it reaches main via the
# standing LDR->main promote (ldr-to-main-promote.yml). Use workflow_dispatch to run
# on demand meanwhile.
#
# Auth: WIF (OIDC) preferred, GCP_SA_KEY fallback — same dual-path pattern as
# cloud-build-router.yml; see codex/07-security/gha-wif-migration.md. If neither
# auth secret is present (forks / unprovisioned clones), the run no-ops gracefully.

on:
  schedule:
    - cron: "0 * * * *" # hourly (Phase-3 ci-cost 2026-07-17; watcher backstop — was */30, before that */15)
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for GCP Workload Identity Federation (OIDC) auth

env:
  GCP_PROJECT: central-element-323112
  CLOUD_BUILD_REGION: asia-northeast1
  LOOKBACK_MINUTES: "20"

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      alert: ${{ steps.poll.outputs.alert }}
      report: ${{ steps.poll.outputs.report }}
      dedup_key: ${{ steps.poll.outputs.dedup_key }}
      recovered: ${{ steps.poll.outputs.recovered }}
      escalation_repos: ${{ steps.poll.outputs.escalation_repos }}
    steps:
      # Secrets are not directly testable in `if:` without exposing them; map to env
      # in a probe step and emit presence flags so the auth steps can be skipped
      # cleanly when unprovisioned (graceful no-op on forks).
      - name: Detect GCP auth secrets
        id: detect
        env:
          WIF_PROVIDER: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${WIF_PROVIDER:-}" ]; then
            echo "has_wif=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_wif=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${SA_KEY:-}" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No GCP auth available — graceful no-op
        if: steps.detect.outputs.has_wif != 'true' && steps.detect.outputs.has_key != 'true'
        run: |
          set -euo pipefail
          echo "::notice::cloud-build-failure-watcher: neither WORKLOAD_IDENTITY_PROVIDER nor GCP_SA_KEY secret is present — skipping Cloud Build poll (fork / unprovisioned repo)."

      # Auth is dual-path: WIF (keyless OIDC) preferred, SA-key fallback — mirrors
      # cloud-build-router.yml. WIF impersonates
      # github-actions-deploy@central-element-323112. If WIF fails (e.g. pool not yet
      # provisioned), it falls through to the GCP_SA_KEY path.
      - name: Authenticate to GCP via WIF (preferred)
        id: auth-wif
        if: steps.detect.outputs.has_wif == 'true'
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to GCP via SA key (fallback)
        id: auth-key
        if: steps.detect.outputs.has_key == 'true' && steps.auth-wif.outcome != 'success'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: steps.auth-wif.outcome == 'success' || steps.auth-key.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v3

      # Recovery detection (2026-07-25): this watcher only ever PAGES on a failure tick — there
      # was no all-clear, so a repo could sit red for hours (or be fixed in 11 minutes) and Slack
      # never said so, mirroring the exact gap ci-status-update.yml had before its own operator
      # ruling 2026-07-18 ("the failure and the recovery should be recorded at all times"). This
      # watcher is stateless across ticks (nothing it writes persists whether the LAST tick had a
      # failure), so recovery needs an explicit marker — read the prior tick's alert state
      # (best-effort; a missing/unreadable marker reads as "no prior alert", so a fresh watcher
      # never fires a spurious recovery on its first-ever tick).
      - name: Read previous tick's alert state
        id: prev-state
        if: steps.auth-wif.outcome == 'success' || steps.auth-key.outcome == 'success'
        env:
          CICD_EVENTS_BUCKET: ${{ vars.CICD_EVENTS_BUCKET }}
        run: |
          set -euo pipefail
          PREV_ALERT="false"
          if [ -n "${CICD_EVENTS_BUCKET:-}" ]; then
            if gsutil cp "gs://${CICD_EVENTS_BUCKET}/cicd/watchers/cloud-build-failure-watcher/state.json" /tmp/cb_prev_state.json 2>/dev/null; then
              PREV_ALERT=$(python3 -c "import json; print(str(json.load(open('/tmp/cb_prev_state.json')).get('alert', False)).lower())" 2>/dev/null || echo "false")
            fi
          fi
          echo "prev_alert=${PREV_ALERT}" >> "$GITHUB_OUTPUT"
          echo "Previous tick alert state: ${PREV_ALERT}"

      - name: Poll recent Cloud Builds + classify failures
        id: poll
        if: steps.auth-wif.outcome == 'success' || steps.auth-key.outcome == 'success'
        env:
          PREV_ALERT: ${{ steps.prev-state.outputs.prev_alert }}
          CICD_EVENTS_BUCKET: ${{ vars.CICD_EVENTS_BUCKET }}
        run: |
          set -euo pipefail

          # List recent builds newest-first (gcloud default ordering) from BOTH the
          # regional pool (router-triggered image builds) and global, then filter
          # locally by createTime + status — server-side create_time filters proved
          # flaky across regions, so the time window is enforced in python below.
          #
          # LIMIT RAISED 30 -> 150 (2026-08-10, cloud_build_failure_watcher_limit_30_coverage_gap
          # _silently_drops_failures_under_load_2026_08_10.md): a fixed --limit=30 silently drops
          # builds OLDER than the fetch window whenever fleet-wide Cloud Build volume exceeds ~30
          # builds within LOOKBACK_MINUTES — the python cutoff filter below only ever sees what
          # gcloud actually returned, so a build that fell off the --limit=30 page is
          # indistinguishable from "did not fail." MEASURED live 2026-08-10: at normal fleet
          # load, the oldest of the top-30 most-recent builds (both pools) was only ~55 MINUTES
          # old — meaning a --limit=30 fetch could not reliably see even one full 20-minute
          # lookback window, let alone the 20-minute window used here. Root-caused via a real
          # miss: a deployment-api Cloud Build failed at 15:20:28Z, squarely inside the
          # 15:23:06Z tick's own declared [15:03,15:23] lookback, and that tick's own gcloud
          # fetch never returned it — confirmed via the job log ("No failed Cloud Builds ... All
          # clear"). 150 is not a permanent fix for further fleet growth — see the
          # OLDEST-fetched-build self-check below, which now makes a recurrence of THIS class
          # LOUD instead of silent.
          gcloud builds list \
            --project="$GCP_PROJECT" \
            --region="$CLOUD_BUILD_REGION" \
            --limit=150 \
            --format=json > /tmp/cb_builds_regional.json \
            || echo "[]" > /tmp/cb_builds_regional.json
          gcloud builds list \
            --project="$GCP_PROJECT" \
            --limit=150 \
            --format=json > /tmp/cb_builds_global.json \
            || echo "[]" > /tmp/cb_builds_global.json

          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone

          import hashlib

          FAILURE_STATUSES = {"FAILURE", "TIMEOUT", "INTERNAL_ERROR", "EXPIRED"}
          # Builtins a GitHub-trigger build carries + the router-passed user subs.
          REPO_KEYS = ("_REPO_NAME", "REPO_NAME", "REPO_FULL_NAME")
          SHA_KEYS = ("_SHA", "COMMIT_SHA", "SHORT_SHA", "REVISION_ID")
          MAX_LINES = 8  # cap per tick; overflow collapses to "+N more"
          failed_ids: list[str] = []  # for the carrier content dedup_key (sorted set of build IDs)
          # AO escalation fan-out (cloud_build_failure wall_type, 2026-08-11): the distinct set of
          # REAL, repo-attributable failing builds this tick -- deliberately excludes the silent
          # config-rejection class (no repo to check out / fix) and the manual-submit class (no
          # trigger/commit context either) below, only ever populated in the genuine "else" branch.
          escalation_repos: set[str] = set()

          lookback = timedelta(minutes=int(os.environ.get("LOOKBACK_MINUTES", "20")))
          cutoff = datetime.now(timezone.utc) - lookback

          builds: dict[str, dict] = {}
          per_pool_oldest: dict[str, datetime] = {}  # pool label -> oldest createTime FETCHED
          for label, path in (
              ("regional", "/tmp/cb_builds_regional.json"),
              ("global", "/tmp/cb_builds_global.json"),
          ):
              try:
                  with open(path, encoding="utf-8") as fh:
                      payload = json.load(fh)
              except (OSError, json.JSONDecodeError):
                  continue
              if not isinstance(payload, list):
                  continue
              for build in payload:
                  if isinstance(build, dict) and build.get("id"):
                      builds.setdefault(str(build["id"]), build)
                  ts_raw = str((build or {}).get("createTime", ""))
                  try:
                      ts = datetime.strptime(ts_raw[:19], "%Y-%m-%dT%H:%M:%S").replace(tzinfo=timezone.utc)
                  except ValueError:
                      continue
                  if label not in per_pool_oldest or ts < per_pool_oldest[label]:
                      per_pool_oldest[label] = ts

          # COVERAGE-GAP self-check (2026-08-10, cloud_build_failure_watcher_limit_30_coverage_gap
          # _silently_drops_failures_under_load_2026_08_10.md): if a pool's OLDEST fetched build is
          # still NEWER than the declared lookback cutoff, the --limit fetch may not have reached
          # far enough back to see everything in-window — a real failure just outside the fetched
          # page would be silently invisible to the filter below, indistinguishable from
          # "genuinely no failures." Surface this LOUDLY (as its own alertable finding) rather than
          # let a future volume spike quietly repeat the exact miss this fix was written for.
          coverage_gap_pools = sorted(
              label for label, oldest in per_pool_oldest.items() if oldest > cutoff
          )

          failed: list[tuple[bool, str]] = []  # (is_silent_rejection, message_line)
          for build in builds.values():
              status = str(build.get("status", ""))
              if status not in FAILURE_STATUSES:
                  continue
              # createTime is RFC3339 with nanosecond fractions; parse the stable
              # first 19 chars (YYYY-MM-DDTHH:MM:SS, always UTC from GCB).
              raw_ts = str(build.get("createTime", ""))
              try:
                  created = datetime.strptime(raw_ts[:19], "%Y-%m-%dT%H:%M:%S").replace(
                      tzinfo=timezone.utc
                  )
              except ValueError:
                  continue  # unparseable timestamp -> not a recent-window candidate
              if created < cutoff:
                  continue

              build_id = str(build.get("id", "unknown-id"))
              failed_ids.append(build_id)
              log_url = str(build.get("logUrl") or "no logUrl")
              # The rejection class: substitutions may be missing entirely, None, or
              # an empty map — never assume the key exists or is a dict.
              subs = build.get("substitutions")
              if not isinstance(subs, dict):
                  subs = {}
              repo = next((subs[k] for k in REPO_KEYS if subs.get(k)), "")
              sha = next((subs[k] for k in SHA_KEYS if subs.get(k)), "")

              # A build that RAN steps is NOT a config rejection, however few substitutions it
              # carries (fixed 2026-07-20). Absent repo/sha was the only signal before, but a
              # manual `gcloud builds submit` (storageSource, not a repoSource trigger) also has
              # no REPO_NAME/COMMIT_SHA — so a real step failure got reported as
              # "cloudbuild.yaml failed validation; no build ran, GitHub shows nothing".
              # MEASURED 2026-07-20: build 7c7aedaf (market-tick-data-service) ran 14 steps and
              # died at step 6 on an invalid docker tag, and was alerted as a silent config
              # rejection — sending triage to look for a malformed YAML that did not exist.
              # A genuine validation rejection never reaches a build step, so classify on the
              # authoritative signal: failureInfo.type (USER_BUILD_STEP == steps ran) and the
              # presence of a steps list.
              failure_type = str((build.get("failureInfo") or {}).get("type", ""))
              ran_steps = bool(build.get("steps")) or failure_type == "USER_BUILD_STEP"
              if not repo and not sha and not ran_steps:
                  # Silent config-rejection signature: the trigger never got far
                  # enough to stamp repo/sha — the push's cloudbuild.yaml was
                  # rejected at validation and GitHub shows NOTHING.
                  failed.append(
                      (
                          True,
                          ":rotating_light: Cloud Build CONFIG REJECTED (silent class) — "
                          "a push's cloudbuild.yaml failed validation; no build ran, "
                          f"GitHub shows nothing — build {build_id} ({status}) — {log_url}",
                      )
                  )
              elif not repo and not sha:
                  # Ran steps but carries no repo/sha => a MANUAL submit. Name it as such so
                  # nobody hunts for a trigger/commit that does not exist, and surface the
                  # failing step, which is the only useful handle on this class.
                  detail = str((build.get("failureInfo") or {}).get("detail", ""))[:160]
                  failed.append(
                      (
                          False,
                          ":x: Cloud Build FAILURE (manual submit — no trigger/commit) — "
                          f"build {build_id} ({status}) — {detail or 'see log'} — {log_url}",
                      )
                  )
              else:
                  repo_label = repo or "unknown-repo"
                  sha_label = (sha[:7] if sha else "unknown-sha")
                  failed.append(
                      (
                          False,
                          f":x: Cloud Build {status} {repo_label}@{sha_label} — "
                          f"build {build_id} — {log_url}",
                      )
                  )
                  if repo:
                      escalation_repos.add(repo)

          # Silent rejections first — they are the invisible class.
          failed.sort(key=lambda item: (not item[0]))
          silent_count = sum(1 for is_silent, _ in failed if is_silent)

          lines = [msg for _, msg in failed[:MAX_LINES]]
          if len(failed) > MAX_LINES:
              lines.append(f"... +{len(failed) - MAX_LINES} more failed build(s) this tick")

          if coverage_gap_pools:
              gap_desc = ", ".join(
                  f"{label} (oldest fetched build is only {int((datetime.now(timezone.utc) - per_pool_oldest[label]).total_seconds() // 60)}m old)"
                  for label in coverage_gap_pools
              )
              lines.append(
                  f":warning: COVERAGE GAP: the {gap_desc} fetch did not reach back the full "
                  f"{int(lookback.total_seconds() // 60)}m lookback — fleet build volume may have "
                  "pushed an older failing build off the page; treat this tick's result as "
                  "INCOMPLETE, not a confirmed all-clear. See "
                  "cloud_build_failure_watcher_limit_30_coverage_gap_silently_drops_failures_under_load_2026_08_10.md"
              )

          report = ""
          dedup_key = ""
          alertable = bool(failed) or bool(coverage_gap_pools)
          if alertable:
              count_desc = f"{len(failed)} failed" if failed else "0 failed (but see coverage gap)"
              header = (
                  f":building_construction: *cloud-build-failure-watcher: {count_desc} "
                  f"Cloud Build(s)* in the last {int(lookback.total_seconds() // 60)}m "
                  f"({silent_count} silent config-rejection(s)) — project "
                  f"{os.environ.get('GCP_PROJECT', 'central-element-323112')}"
              )
              report = header + "\n" + "\n".join(lines)
              print(report)
              # CONTENT dedup_key: the sorted SET of failing build IDs (+ the coverage-gap pool
              # names, so a gap alone still gets its own stable, re-arming dedup identity distinct
              # from any concurrent real-failure dedup_key). The carrier suppresses a repeat of the
              # SAME set within its cooldown -> the boundary-overlap re-detect posts once
              # (transition-based), while a NEW failing build or a NEW gap re-arms it.
              digest_input = "\n".join(sorted(failed_ids)) + "\n" + "\n".join(coverage_gap_pools)
              digest = hashlib.sha256(digest_input.encode()).hexdigest()[:16]
              dedup_key = f"cloud-build-fail:{digest}"
          else:
              print(
                  f"No failed Cloud Builds in the last "
                  f"{int(lookback.total_seconds() // 60)}m across "
                  f"{len(builds)} recent build(s). All clear."
              )

          # RECOVERED: last tick paged (prev_alert=true) and this tick has nothing (not failed).
          # Steady-state (prev=false, now=false) and steady-red (prev=true, now=true, a DIFFERENT
          # failure set) are NOT recoveries — the latter is still red, just a new dedup_key, and
          # the existing `notify` job (gated on alert==true) already re-pages it correctly.
          prev_alert = os.environ.get("PREV_ALERT", "false") == "true"
          recovered = prev_alert and not alertable

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"alert={'true' if alertable else 'false'}\n")
              fh.write(f"count={len(failed)}\n")
              fh.write(f"silent={silent_count}\n")
              fh.write(f"dedup_key={dedup_key}\n")
              fh.write(f"recovered={'true' if recovered else 'false'}\n")
              # cloud_build_failure escalation fan-out (2026-08-11): one matrix job per
              # distinct real-failure repo this tick, consumed by the "escalate" job below
              # (mirrors ldr-ci-monitor.yml's red_transitions_json -> escalate matrix pattern).
              fh.write(f"escalation_repos={json.dumps(sorted(escalation_repos))}\n")
              # Multiline report via a randomized heredoc delimiter (GitHub-recommended).
              fh.write("report<<__CB_RPT__\n")
              fh.write(report + "\n")
              fh.write("__CB_RPT__\n")

          # Persist THIS tick's alert state for the NEXT tick's recovery check. Best-effort:
          # `state.json` staying stale just means the next tick's recovery detection degrades to
          # "no prior alert" (never a spurious recovery, at worst a missed one) — it must never
          # fail the watcher itself.
          import subprocess

          bucket = os.environ.get("CICD_EVENTS_BUCKET", "")
          if bucket:
              state = json.dumps({"alert": alertable, "silent_count": silent_count})
              proc = subprocess.run(
                  ["gsutil", "cp", "-", f"gs://{bucket}/cicd/watchers/cloud-build-failure-watcher/state.json"],
                  input=state.encode(),
                  capture_output=True,
                  check=False,
              )
              if proc.returncode != 0:
                  print(f"::warning::failed to persist watcher state: {proc.stderr.decode(errors='replace')}")
          PY

      - name: Job-log summary
        if: steps.poll.outputs.alert == 'true'
        env:
          FAILED_COUNT: ${{ steps.poll.outputs.count }}
          SILENT_COUNT: ${{ steps.poll.outputs.silent }}
        run: |
          set -euo pipefail
          echo "::warning::cloud-build-failure-watcher: ${FAILED_COUNT} failed Cloud Build(s) in the last ${LOOKBACK_MINUTES}m (${SILENT_COUNT} silent config-rejection(s)) — see the job above"

      - name: Job-log summary (recovery)
        if: steps.poll.outputs.recovered == 'true'
        run: |
          set -euo pipefail
          echo "::notice::cloud-build-failure-watcher: all failing Cloud Builds from the prior tick have cleared — no failures this tick"

  # ── SLACK NOTIFY (via the shared carrier) ────────────────────────────────────
  # Routed through notify-slack.yml instead of the old inline `curl` (alert_quality_audit_2026_06_18):
  # this GAINS read-back dedup (the content dedup_key collapses the boundary-overlap double-fire),
  # the alert ledger (deployment-ui Alerts page lifecycle), and truthful-severity classification —
  # the three things the bypassing inline curl lacked. A Cloud Build failure freezes that repo's
  # image promotion, so it pages CRITICAL.
  notify:
    needs: watch
    if: needs.watch.outputs.alert == 'true'
    uses: ./.github/workflows/notify-slack.yml
    with:
      message: ${{ needs.watch.outputs.report }}
      severity: CRITICAL
      workflow_name: cloud-build-failure-watcher
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Transition-based: the same set of failing build IDs posts ONCE per cooldown; a NEW failing
      # build (different ID set → different key) re-arms. 45m > the 30m cron so the overlap re-detect
      # is suppressed, but a genuinely-new failure on the next tick still pages.
      dedup_key: ${{ needs.watch.outputs.dedup_key }}
      cooldown_min: 45
    secrets: inherit

  # ── SLACK RECOVERY NOTIFY (2026-07-25) ────────────────────────────────────────
  # This watcher previously had NO all-clear path — `notify` above only fires on
  # `alert == 'true'`, so a repo could sit red for hours or be fixed in one tick and Slack would
  # never say either way. Same operator ruling as ci-status-update.yml (2026-07-18): "the failure
  # and the recovery should be recorded at all times." Mutually exclusive with `notify` above (a
  # tick is either a failure tick, a recovery tick, or silent steady-state) so this never
  # double-posts alongside it.
  notify-recovery:
    needs: watch
    if: needs.watch.outputs.recovered == 'true'
    uses: ./.github/workflows/notify-slack.yml
    with:
      message: ":white_check_mark: *cloud-build-failure-watcher: recovered* — no failed Cloud Builds this tick (prior
        tick had\
        \ failure(s)) — project central-element-323112"
      severity: INFO
      conclusion: success
      workflow_name: cloud-build-failure-watcher
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Explicit recovery flag — the carrier's routine-green suppressor only posts an INFO/success
      # message when `recovery: true` (same belt-and-suspenders as ci-status-update.yml's notify job).
      recovery: true
    secrets: inherit

  # ── ESCALATE REAL FAILURES TO THE ORCHESTRATOR (2026-08-11, cloud_build_failure wall_type) ──
  # Closes Structural Finding A (ci_reconcile_overnight_batch_2026_08_11.md): GH Actions
  # quality-gates-v2 can stay green while a repo's Cloud Build image pipeline is completely
  # broken (a separate pipeline) -- before this, the ONLY path from a CRITICAL Cloud Build alert
  # to an actual fix was a human reading this workflow's Slack post and manually running
  # `gcloud builds log`/`gcloud builds list` (confirmed live: both real fixes in that session --
  # features-service's stale uv.lock, unified-api-contracts' qg-governor livelock -- sat
  # FAILING/TIMEOUT for 9+ hours with zero AO-dispatched attempt). One matrix job per DISTINCT
  # repo among this tick's REAL (non-silent-config-rejection, non-manual-submit -- see the `poll`
  # step's `escalation_repos` set, only populated in the genuine per-repo failure branch) failing
  # builds -- mirrors ldr-ci-monitor.yml's existing red_transitions_json -> escalate matrix
  # pattern exactly. Not PR-scoped (pr_number: 0) -- the worker fixes it directly on
  # live-defi-rollout. escalate-to-orchestrator.yml's OWN notify job already pages on both
  # outcomes (dispatched ✅ / hard-failure ⚠️, deduped), so this job has no notify step of its own.
  escalate:
    needs: watch
    if: needs.watch.outputs.escalation_repos != '' && needs.watch.outputs.escalation_repos != '[]'
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.watch.outputs.escalation_repos) }}
    uses: ./.github/workflows/escalate-to-orchestrator.yml
    with:
      repo: ${{ matrix.repo }}
      pr_number: 0
      wall_type: cloud_build_failure
      context:
        "cloud-build-failure-watcher detected a Cloud Build FAILURE/TIMEOUT/INTERNAL_ERROR/EXPIRED
        for ${{ matrix.repo }} in the last ~20m. GH Actions quality-gates-v2 can be green while
        this repo's Cloud Build image pipeline is broken -- they are separate pipelines. Diagnose
        via `gcloud builds list --project=central-element-323112 --filter='substitutions.REPO_NAME=\"${{
        matrix.repo }}\" OR substitutions._REPO_NAME=\"${{ matrix.repo }}\"' --limit=5` (check both
