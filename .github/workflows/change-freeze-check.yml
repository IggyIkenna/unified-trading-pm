# Reusable workflow: Change Freeze Window Check
#
# Reads plans/ops/change-freeze-calendar.csv and checks if the current UTC time
# falls within an active freeze window. Exits with annotated failure if frozen.
#
# Usage from other workflows:
#   jobs:
#     freeze-check:
#       uses: ./.github/workflows/change-freeze-check.yml
#       with:
#         check_type: PROD_DEPLOY   # or AUTONOMOUS
#       secrets: inherit
#     deploy:
#       needs: freeze-check
#       if: needs.freeze-check.outputs.blocked != 'true'
#       ...
name: Change Freeze Check

on:
  workflow_call:
    inputs:
      check_type:
        description: "Type of operation to check: AUTONOMOUS or PROD_DEPLOY"
        required: false
        type: string
        default: "PROD_DEPLOY"
    outputs:
      blocked:
        description: "Whether the operation is blocked by a freeze window (true/false)"
        value: ${{ jobs.check.outputs.blocked }}
      reason:
        description: "Description of the blocking freeze window (empty if not blocked)"
        value: ${{ jobs.check.outputs.reason }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # CI-cost B1: off billed hosted minutes onto the self-hosted glue pool. Labels are a SUBSET
    # match, so [self-hosted, glue] lands ONLY on the JIT-ephemeral pool — never on glue-writer.
    # SSOT: scripts/self-hosted-runners/README.md
    runs-on: [self-hosted, glue]
    outputs:
      blocked: ${{ steps.freeze.outputs.blocked }}
      reason: ${{ steps.freeze.outputs.reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            plans/ops/change-freeze-calendar.csv
            scripts/telegram-helpers.sh

      - name: Check freeze windows
        id: freeze
        shell: bash
        env:
          CHECK_TYPE: ${{ inputs.check_type }}
        run: |
          set -euo pipefail

          CALENDAR="plans/ops/change-freeze-calendar.csv"
          if [ ! -f "$CALENDAR" ]; then
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            echo "reason=" >> "$GITHUB_OUTPUT"
            echo "::notice::No change-freeze-calendar.csv found — no freeze windows configured"
            exit 0
          fi

          NOW_UTC=$(date -u +"%Y-%m-%dT%H:%M")
          NOW_EPOCH=$(date -u -d "$NOW_UTC" +%s 2>/dev/null || date -j -u -f "%Y-%m-%dT%H:%M" "$NOW_UTC" +%s 2>/dev/null || date -u +%s)
          NOW_TIME=$(date -u +"%H:%M")
          NOW_DOW=$(date -u +"%u")  # 1=Monday, 7=Sunday

          echo "Current UTC time: $NOW_UTC (time=$NOW_TIME, dow=$NOW_DOW)"
          echo "Check type: $CHECK_TYPE"

          BLOCKED="false"
          REASON=""

          # Determine which CSV column to check based on check_type
          # AUTONOMOUS -> block_autonomous (column 8)
          # PROD_DEPLOY -> block_prod_deploy (column 9)

          # Skip header line, read CSV
          tail -n +2 "$CALENDAR" | while IFS=, read -r window_id event_name event_type recurrence start_utc end_utc dst_note block_autonomous block_prod_deploy affects_venues notes; do
            # Skip empty lines
            [ -z "$window_id" ] && continue

            MATCH="false"

            case "$recurrence" in
              daily)
                # Time-only windows (HH:MM format)
                if [[ "$start_utc" =~ ^[0-9]{2}:[0-9]{2}$ ]]; then
                  if [[ "$NOW_TIME" > "$start_utc" || "$NOW_TIME" == "$start_utc" ]] && [[ "$NOW_TIME" < "$end_utc" ]]; then
                    MATCH="true"
                  fi
                  # Handle midnight crossing (e.g., 23:55 - 00:05)
                  if [[ "$start_utc" > "$end_utc" ]]; then
                    if [[ "$NOW_TIME" > "$start_utc" || "$NOW_TIME" == "$start_utc" ]] || [[ "$NOW_TIME" < "$end_utc" ]]; then
                      MATCH="true"
                    fi
                  fi
                fi
                ;;
              every_8h)
                # Same as daily — time-only windows
                if [[ "$start_utc" =~ ^[0-9]{2}:[0-9]{2}$ ]]; then
                  if [[ "$NOW_TIME" > "$start_utc" || "$NOW_TIME" == "$start_utc" ]] && [[ "$NOW_TIME" < "$end_utc" ]]; then
                    MATCH="true"
                  fi
                  if [[ "$start_utc" > "$end_utc" ]]; then
                    if [[ "$NOW_TIME" > "$start_utc" || "$NOW_TIME" == "$start_utc" ]] || [[ "$NOW_TIME" < "$end_utc" ]]; then
                      MATCH="true"
                    fi
                  fi
                fi
                ;;
              1st_friday_monthly|3rd_friday_monthly|quarterly|8x_yearly)
                # Full datetime windows (ISO format)
                if [[ "$start_utc" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]; then
                  START_EPOCH=$(date -u -d "$start_utc" +%s 2>/dev/null || date -j -u -f "%Y-%m-%dT%H:%M" "$start_utc" +%s 2>/dev/null || echo "0")
                  END_EPOCH=$(date -u -d "$end_utc" +%s 2>/dev/null || date -j -u -f "%Y-%m-%dT%H:%M" "$end_utc" +%s 2>/dev/null || echo "0")
                  if [ "$NOW_EPOCH" -ge "$START_EPOCH" ] && [ "$NOW_EPOCH" -le "$END_EPOCH" ]; then
                    MATCH="true"
                  fi
                fi
                ;;
            esac

            if [ "$MATCH" = "true" ]; then
              # Check the appropriate blocking column based on check_type
              SHOULD_BLOCK="false"
              if [ "$CHECK_TYPE" = "AUTONOMOUS" ] && [ "$block_autonomous" = "true" ]; then
                SHOULD_BLOCK="true"
              elif [ "$CHECK_TYPE" = "PROD_DEPLOY" ] && [ "$block_prod_deploy" = "true" ]; then
                SHOULD_BLOCK="true"
              fi

              if [ "$SHOULD_BLOCK" = "true" ]; then
                # NB: `notes`/`affects_venues` are intentionally NOT in the reason — `affects_venues`
                # is a quoted CSV field containing commas (e.g. "databento,ibkr"), which the naive
                # `IFS=, read` mis-splits into `notes` (this produced the garbled `ibkr",NYSE/...`
                # alert string). The block columns (8-9) sit BEFORE that field so they parse
                # correctly; the reason uses only cleanly-parsed columns.
                BLOCK_REASON="$event_name ($window_id): $start_utc to $end_utc UTC"
                echo "blocked=true" >> "$GITHUB_OUTPUT"
                echo "reason=$BLOCK_REASON" >> "$GITHUB_OUTPUT"
                # ::warning:: (not ::error::) — a freeze block is an EXPECTED, intended outcome,
                # not a CI fault. Keeps the run annotation from reading as a red error.
                echo "::warning::CHANGE FREEZE ACTIVE [$CHECK_TYPE]: $BLOCK_REASON"
                # Signal to the alert step
                echo "FREEZE_BLOCKED=true" >> "$GITHUB_ENV"
                echo "FREEZE_REASON=$BLOCK_REASON" >> "$GITHUB_ENV"
                exit 1
              fi
            fi
          done

          # If we get here, no freeze window is active
          echo "blocked=false" >> "$GITHUB_OUTPUT"
          echo "reason=" >> "$GITHUB_OUTPUT"
          echo "::notice::No active freeze window — $CHECK_TYPE operations allowed"

  # ── NO SLACK NOTIFY ON A FREEZE BLOCK (operator ruling 2026-07-20) ────────────────────────────
  #
  # A freeze block is NOT actionable: the window is short (every window is now capped at <= 30 min,
  # see scripts/ops/generate-freeze-calendar.py) and the deferred prod build is PERSISTED and
  # auto-replayed by freeze-deferred-build-replay.yml once the window lifts. Nobody does anything
  # with the advisory, so it is pure noise on a channel whose value depends on everything in it
  # being worth reading — the same actionable-only principle the AO alert channel already follows
  # (codex/04-architecture/agent-orchestrator-alerting.md).
  #
  # The block itself is NOT silent: the `check` job still exit-1s as the gate (cloud-build-router
  # depends on that), still emits a ::notice:: naming the window, and the deferral is recorded for
  # replay. What is removed is only the human page for an expected, self-resolving control outcome.
  #
  # The FAILURE mode — a deferral that never replays — is covered by the stale-deferral guard in
  # freeze-deferred-build-replay.yml, which pages when a marker outlives every window. That guard
  # was ADDED alongside this removal: before it, a stuck deferral was genuinely unalerted, so
  # deleting this job on its own would have gone dark on the one case that actually matters.
  #
  # Previous history, kept so it is not re-litigated: this alert was first a CRITICAL (conclusion:
  # failure forced notify-slack's truthful-severity rule to :x:), then downgraded to a WARNING
  # advisory with a 30-min dedup on 2026-07-17 after 4 identical alerts fired in a single 5-min
  # US-open window. Silencing it entirely is the end of that same arc, not a new judgement.
