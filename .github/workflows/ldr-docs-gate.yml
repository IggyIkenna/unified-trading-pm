name: ldr-docs-gate

# ── WHY THIS EXISTS (2026-07-17) ──────────────────────────────────────────────
# Docs (`plans/**`, `codex/**`) are a quickmerge carve-out (direct push to LDR is legal) and
# LDR runs no server QG by design — so the ONLY defense against broken doc frontmatter is the
# local prek hook, which was bypassed on TWO different hosts on 2026-07-17 (3 broken docs →
# the lint-codex slice went RED on EVERY PR into PM main for ~1h, plus a false MAIN-RED on
# UTL, ~12 CRITICAL alerts). This backstop closes the detection gap: it validates the doc
# corpus on `live-defi-rollout` and pages once with the offending doc(s) — instead of the
# breakage surfacing as fleet-wide red gates.
# SSOT: plans/active/issues/prek_plan_hygiene_hook_fail_open_unhooked_clone_2026_07_17.md
# (fix direction 2) + codex/11-project-management/doc-frontmatter-schema.md.
#
# ── WHY HOURLY, NOT PER-PUSH (operator-suggested 2026-07-22) ─────────────────
# Per-push firing measured 2026-07-22 (5 days live): ~1200 triggers, ~240/day, ~10/hour — far
# more than a health check whose only failure consequence (a broken doc sitting undetected a
# bit longer) needs. Per-push was never the right model here; hourly cuts this workflow's own
# contribution to shared self-hosted-runner load ~10x for a check whose latency doesn't matter
# at that granularity. Full-corpus scan (not diff-since-last-push) is KEPT deliberately — it
# runs in ~2s for the whole 1670-doc live corpus (measured), so scoping it further buys
# negligible performance and a periodic health check should audit CURRENT total state, not one
# push's diff. What per-push attribution DID give — naming who broke it — is recovered instead
# via a per-violating-file `git log` lookup (below), which is actually MORE precise than the
# old `head_commit` attribution: with hourly batching, several commits can land between checks,
# and `head_commit` would often name the WRONG (merely most-recent) one.
#
# ── THREE BUGS FOUND AND FIXED 2026-07-22, in order ───────────────────────────
# (1) `cancel-in-progress: true` killed every ACTIVELY RUNNING job the instant a newer push
#     landed — 39/40 sampled runs cancelled, 0 ever completed. Fixed: cancel-in-progress: false.
# (2) Even after (1), still 0 completions (1198/1200 total population cancelled). Root cause:
#     `runs-on: [self-hosted, Linux, X64, glue]` required 4 labels, but the JIT-ephemeral glue
#     pool (scripts/self-hosted-runners/glue-runner-run.sh) registers each runner with ONLY
#     ["self-hosted","glue"] — Linux/X64 are never advertised, so this job could never match ANY
#     runner, full stop (confirmed via journalctl: the same 5 runners completed sibling jobs in
#     seconds throughout the exact window this one sat queued). Every other of the 36 workflows
#     on this pool already used the correct 2-label form. Fixed: runs-on: [self-hosted, glue].
# (3) A dead run created under the pre-fix (2) config was parked in the concurrency queue with
#     nothing able to clear it, silently blocking every run behind it across ~15 pushes.
#     Cancelled manually (one-time; can't recur once (2) means no future run gets stuck the
#     same way). First real completion: 12s, glue-ip-172-31-5-118-5, run 29910893758.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: # manual re-run / testing

concurrency:
  group: ldr-docs-gate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  frontmatter-gate:
    name: Doc frontmatter gate (LDR)
    # REVERTED 2026-08-07 (self_hosted_runner_public_repo_revert_2026_08_05.md todo 24): PM went
    # PUBLIC 2026-08-06, so ubuntu-latest is free/unmetered for it, and self-hosted-on-a-public-repo
    # is a fork-PR security exposure. This job was BORN self-hosted (created 2026-07-17 directly on
    # the glue pool) — added the setup-python + pyyaml install below since there is no ambient venv
    # on a hosted runner (check_frontmatter_schema.py imports yaml).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
      excerpt: ${{ steps.gate.outputs.excerpt }}
      attribution: ${{ steps.gate.outputs.attribution }}
      recovered: ${{ steps.recovery.outputs.recovered }}
    steps:
      - name: Checkout live-defi-rollout
        uses: actions/checkout@v5
        with:
          # Explicit ref: schedule/workflow_dispatch have no natural "the branch that pushed"
          # like a push event does — they'd otherwise resolve to the repo's default branch
          # (main), not the branch this gate actually needs to validate (LDR).
          ref: live-defi-rollout
          # Deep enough for `git log -1 -- <file>` attribution below to find the real last-touch
          # commit even a day or two back (measured ~280 commits/day touching plans/+codex/ ⇒
          # 500 comfortably covers 40+ hours), while staying far short of full history.
          fetch-depth: 500

      - name: Restore ldr-docs-gate alert state cache
        uses: actions/cache@v5
        with:
          path: .ldr-docs-gate-alert-state.json
          key: ldr-docs-gate-alert-state-${{ github.run_id }}
          restore-keys: |
            ldr-docs-gate-alert-state-

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install checker dependencies
        run: python3 -m pip install --quiet pyyaml

      - name: Corpus frontmatter check + per-file attribution
        id: gate
        shell: bash
        run: |
          set -uo pipefail
          # `set +e` is REQUIRED, not redundant with the `set -uo pipefail` above: GitHub Actions'
          # default shell is `bash --noprofile --norc -e -o pipefail`, and `set -uo pipefail` does
          # NOT clear that inherited `-e`. Without this, a RED gate aborts the step at the capture
          # below — before `RC=$?`, before `echo "$OUT"`, and before the `$GITHUB_OUTPUT` block —
          # so `verdict` is never written. Every downstream job here keys on
          # `needs.frontmatter-gate.outputs.verdict == 'red'` (notify-broken-docs,
          # escalate-plan-health, the RESOLVED bookend), so ALL of them silently skip and a red
          # docs gate pages NOBODY. The `if: always()` note below covers later STEPS being skipped;
          # it does not cover the abort happening INSIDE this step. Measured 2026-08-10: 10+
          # consecutive hourly failures from 2026-08-09T22:07Z, every one emitting zero stdout and
          # zero Slack — the gate was red for 10h and looked quiet. SSOT:
          # plans/active/issues/ldr_docs_gate_red_but_silent_inherited_e_aborts_verdict_2026_08_10.md
          set +e
          OUT="$(python3 scripts/plan-hygiene/check_frontmatter_schema.py --quiet 2>&1)"
          RC=$?
          echo "$OUT"

          ATTR=""
          if [ "$RC" -ne 0 ]; then
            # No single head_commit to blame (schedule/dispatch, not push) — and even for a push
            # event, hourly batching means head_commit is often the WRONG commit anyway. Instead,
            # blame each VIOLATING doc individually via its own last-touch commit.
            while IFS= read -r f; do
              [ -n "$f" ] && [ -f "$f" ] || continue
              LAST="$(git log -1 --format='%an <%h> %cs: %s' -- "$f" 2>/dev/null || echo 'unknown (no history in fetch-depth)')"
              ATTR="${ATTR}${f}\n  last touched by ${LAST}\n"
            done < <(printf '%s\n' "$OUT" | grep -E '^  [^ ].*:$' | sed 's/^  //;s/:$//')
          fi

          {
            echo "verdict=$([ "$RC" -eq 0 ] && echo green || echo red)"
            echo "excerpt<<__EOX__"
            printf '%s\n' "$OUT" | head -20
            echo "__EOX__"
            echo "attribution<<__ATTR_EOF__"
            printf '%b' "$ATTR"
            echo "__ATTR_EOF__"
          } >> "$GITHUB_OUTPUT"
          exit "$RC"

      # `if: always()` — the gate step above deliberately exits non-zero on red, which would
      # otherwise skip every later step in this job (Actions' default `if: success()`).
      - name: Compute recovery transition (state-diffed)
        id: recovery
        if: always()
        run: |
          CURRENT_ALERT="false"
          [ "${{ steps.gate.outputs.verdict }}" = "red" ] && CURRENT_ALERT="true"
          python3 scripts/cicd/alert_recovery.py \
            --state-file .ldr-docs-gate-alert-state.json \
            --current "$CURRENT_ALERT" >> "$GITHUB_OUTPUT"

  notify-broken-docs:
    needs: frontmatter-gate
    if: always() && needs.frontmatter-gate.outputs.verdict == 'red'
    uses: ./.github/workflows/notify-slack.yml
    with:
      message:
        ":page_facing_up: *BROKEN DOC FRONTMATTER ON live-defi-rollout* (hourly check). Every PM-corpus lint-codex slice
        fleet-wide goes RED until this is repaired — fix the frontmatter NOW (remedy: `python3
        scripts/docs/seed_frontmatter.py --apply <path>`, schema:
        codex/11-project-management/doc-frontmatter-schema.md).\nAttribution:\n${{
        needs.frontmatter-gate.outputs.attribution }}\nViolations:\n${{ needs.frontmatter-gate.outputs.excerpt }}"
      severity: "CRITICAL"
      workflow_name: "ldr-docs-gate"
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # One page per breakage episode, not per subsequent hourly recheck while red.
      dedup_key: "ldr-docs-gate-red"
      cooldown_min: 60
    secrets: inherit

  # ── RESOLVED bookend (2026-08-08) ──────────────────────────────────────────────────────
  # Previously only `notify-broken-docs` existed — silence on the NEXT green hourly tick was
  # the only signal the corpus was fixed. State-diffed via the shared alert_recovery.py helper
  # (mirrors branch-health.yml's lag-notify-resolved pattern).
  notify-docs-resolved:
    name: Slack — ldr-docs-gate RESOLVED
    needs: frontmatter-gate
    if: always() && needs.frontmatter-gate.outputs.recovered == 'true'
    uses: ./.github/workflows/notify-slack.yml
    with:
      message:
        ":ballot_box_with_check: *BROKEN DOC FRONTMATTER RESOLVED* on live-defi-rollout — the corpus frontmatter gate is
        green again (prior hourly tick was red)"
      severity: "INFO"
      conclusion: "success"
      recovery: true
      workflow_name: "ldr-docs-gate"
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      dedup_key: "ldr-docs-gate-resolved"
      cooldown_min: 15
    secrets: inherit

  escalate-plan-health:
    # Hands the wall to the SAME already-built resolver plan-health-agent.yml's PR-gate uses
    # (server/plan_health.py + agents/plan-health.md — cleans plan-hygiene issues, including
    # frontmatter, on live-defi-rollout) instead of only paging a human. Not PR-scoped (pr_number:
    # 0, sanctioned by escalate-to-orchestrator.yml's own contract). Kept deliberately simple — no
    # extra dedup layer of our own: escalate-to-orchestrator.yml's own concurrency group
    # (escalate-unified-trading-pm-0) already serializes repeat dispatches for the same non-PR
    # wall, so a redundant hourly re-dispatch while a worker is still resolving just queues
    # behind it rather than piling up.
    needs: frontmatter-gate
    if: always() && needs.frontmatter-gate.outputs.verdict == 'red'
    uses: ./.github/workflows/escalate-to-orchestrator.yml
    with:
      repo: unified-trading-pm
      pr_number: 0
      wall_type: plan_health
      context:
        "ldr-docs-gate hourly check found broken frontmatter on live-defi-rollout:\n${{
        needs.frontmatter-gate.outputs.attribution }}\n${{ needs.frontmatter-gate.outputs.excerpt }}"
      authoring_slot: "ldr-docs-gate"
    secrets: inherit
