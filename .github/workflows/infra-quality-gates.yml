name: Infrastructure Quality Gates (reusable)

# Reusable QG for infra repos (PM, codex) that aren't Python services/libraries.
# Handles: bash syntax, Python syntax, YAML validation, actionlint, shellcheck,
# ruff, basedpyright, repo-specific quality-gates.sh, and ci-status dispatch.
#
# Callers pass repo_name and optional flags to control which checks run.

on:
  workflow_call:
    inputs:
      repo_name:
        description: "Repository name (e.g. unified-trading-pm, unified-trading-codex)"
        required: true
        type: string
      run_quality_gates_sh:
        description: "Run scripts/quality-gates.sh if it exists (default: true)"
        required: false
        type: boolean
        default: true
      run_basedpyright:
        description: "Run basedpyright type checking (default: false — only PM has Python source)"
        required: false
        type: boolean
        default: false
      run_actionlint:
        description: "Run actionlint on .github/workflows/*.yml (default: true)"
        required: false
        type: boolean
        default: true
      run_flow_coverage:
        description: "Run UI/API flow coverage checker (default: false — only PM has it)"
        required: false
        type: boolean
        default: false
      sibling_deps:
        description:
          "Space-separated sibling repos to clone for basedpyright (e.g. 'unified-events-interface
          unified-internal-contracts')"
        required: false
        type: string
        default: ""
    secrets:
      GH_PAT:
        required: true
      TELEGRAM_BOT_TOKEN:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    env:
      CLOUD_MOCK_MODE: "true"
      CLOUD_PROVIDER: "local"
      GCP_PROJECT_ID: "unified-trading-ci"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          path: ${{ inputs.repo_name }}
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.9"

      - name: Install uv
        run: pip install uv

      # ── Tool installation (cached) ──────────────────────────────────────
      - name: Cache tools (ripgrep, shellcheck, actionlint)
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/act-tools
          key: act-tools-linux-rg14.1.1-sc0.10.0-actionlint1.7.4

      - name: Install ripgrep
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          RG_VER="14.1.1"
          mkdir -p ~/.local/act-tools/bin
          curl -fsSL "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VER}/ripgrep-${RG_VER}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C ~/.local/act-tools/bin "ripgrep-${RG_VER}-x86_64-unknown-linux-musl/rg"

      - name: Install shellcheck
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          SC_VER="v0.10.0"
          mkdir -p ~/.local/act-tools/bin
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SC_VER}/shellcheck-${SC_VER}.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C ~/.local/act-tools/bin "shellcheck-${SC_VER}/shellcheck"

      - name: Install actionlint
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          AL_VER="1.7.4"
          mkdir -p ~/.local/act-tools/bin
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${AL_VER}/actionlint_${AL_VER}_linux_amd64.tar.gz" \
            | tar -xz -C ~/.local/act-tools/bin actionlint

      - name: Add tools to PATH
        run: echo "$HOME/.local/act-tools/bin" >> "$GITHUB_PATH"

      # ── Install repo deps (if pyproject.toml exists) ────────────────────
      - name: Install repo deps
        working-directory: ${{ inputs.repo_name }}
        run: |
          if [ -f "pyproject.toml" ]; then
            uv venv --clear .venv
            uv sync
            echo "$(pwd)/.venv/bin" >> "$GITHUB_PATH"
          fi

      # ── Checkout siblings (PM needs codex, codex needs PM) ──────────────
      - name: Checkout PM (sibling)
        if: inputs.repo_name != 'unified-trading-pm'
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          repository: ${{ github.repository_owner }}/unified-trading-pm
          path: unified-trading-pm
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Checkout Codex (sibling)
        if: inputs.repo_name != 'unified-trading-codex'
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          repository: ${{ github.repository_owner }}/unified-trading-codex
          path: unified-trading-codex
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Clone basedpyright sibling deps
        if: inputs.sibling_deps != ''
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DEP_BRANCH: ${{ github.head_ref || github.ref_name }}
          SIBLING_DEPS: ${{ inputs.sibling_deps }}
        run: |
          BRANCH="${DEP_BRANCH:-main}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          for name in $SIBLING_DEPS; do
            git clone --depth=1 -b "$BRANCH" "https://x-access-token:${GH_PAT}@github.com/${OWNER}/${name}.git" "$name" 2>/dev/null \
              || git clone --depth=1 -b main "https://x-access-token:${GH_PAT}@github.com/${OWNER}/${name}.git" "$name" 2>/dev/null \
              || echo "Warning: could not clone $name (skipping)"
          done

      - name: Simulate sibling workspace layout
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cursor/rules"
          touch "$GITHUB_WORKSPACE/.cursorrules"

      # ── Core checks ─────────────────────────────────────────────────────
      - name: Check bash scripts syntax
        working-directory: ${{ inputs.repo_name }}
        run: |
          echo "Checking bash scripts syntax..."
          FAIL=0
          while IFS= read -r script; do
            bash -n "$script" || { echo "Syntax error: $script"; FAIL=1; }
          done < <(find . -name "*.sh" -type f -not -path "./.venv/*")
          [ "$FAIL" = 0 ] && echo "All bash scripts valid" || exit 1

      - name: Check Python scripts syntax
        working-directory: ${{ inputs.repo_name }}
        run: |
          echo "Checking Python scripts syntax..."
          FAIL=0
          while IFS= read -r script; do
            python3 -m py_compile "$script" || { echo "Syntax error: $script"; FAIL=1; }
          done < <(find . -name "*.py" -type f -not -path "./.venv/*")
          [ "$FAIL" = 0 ] && echo "All Python scripts valid" || exit 1

      - name: Run actionlint
        if: inputs.run_actionlint
        working-directory: ${{ inputs.repo_name }}
        run: |
          if [ -d ".github/workflows" ]; then
            echo "Running actionlint..."
            actionlint .github/workflows/*.yml || { echo "actionlint failed"; exit 1; }
            echo "actionlint passed"
          fi

      - name: Run quality-gates.sh
        if: inputs.run_quality_gates_sh
        working-directory: ${{ inputs.repo_name }}
        run: |
          if [ -f "scripts/quality-gates.sh" ]; then
            bash scripts/quality-gates.sh --no-fix
          else
            echo "No scripts/quality-gates.sh — skipping"
          fi

      # ── PM-specific: flow coverage ──────────────────────────────────────
      - name: UI/API flow coverage check (WARNING only)
        if: inputs.run_flow_coverage && always()
        working-directory: ${{ inputs.repo_name }}
        continue-on-error: true
        run: |
          if [ -f "scripts/checkers/check_ui_api_flow_coverage.py" ]; then
            python scripts/checkers/check_ui_api_flow_coverage.py \
              --warning-only --discover --workspace-root "$GITHUB_WORKSPACE" \
              2>&1 | tee flow-coverage-report.txt || :
            python scripts/checkers/flow_coverage_scorecard.py \
              --workspace-root "$GITHUB_WORKSPACE" \
              2>&1 | tee flow-coverage-scorecard.txt || :
          fi

      - name: Upload flow coverage report
        if: inputs.run_flow_coverage && always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: flow-coverage-report
          path: |
            ${{ inputs.repo_name }}/flow-coverage-report.txt
            ${{ inputs.repo_name }}/flow-coverage-scorecard.txt
          retention-days: 30

      # ── Record CI status (dispatches to PM) ─────────────────────────────
      - name: Record CI status
        if: always()
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO_NAME: ${{ inputs.repo_name }}
          TRIGGER_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          [ -z "${GH_PAT}" ] && echo "GH_PAT not set — skipping ci-status-update" && exit 0

          if [ "${{ job.status }}" != "success" ]; then
            STATUS="FAILING"
          elif [ "$TRIGGER_BRANCH" = "staging" ]; then
            STATUS="STAGING_GREEN"
          else
            STATUS="FEATURE_GREEN"
          fi

          echo "Recording ci_status=${STATUS} for ${REPO_NAME} (branch=${TRIGGER_BRANCH})"
          curl -s -X POST \
            -H "Authorization: token ${GH_PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/unified-trading-pm/dispatches" \
            -d "{\"event_type\": \"ci-status-update\", \"client_payload\": {\"repo\": \"${REPO_NAME}\", \"status\": \"${STATUS}\", \"branch\": \"${TRIGGER_BRANCH}\", \"sha\": \"${GITHUB_SHA}\"}}"

  notify-failure:
    name: Telegram — QG Failure
    needs: [quality-gates]
    if: always() && needs.quality-gates.result == 'failure'
    uses: ./.github/workflows/notify-telegram.yml
    with:
      message:
        "QG FAILED — ${{ inputs.repo_name }} (${{ github.head_ref || github.ref_name }}). View: ${{ github.server_url
        }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      severity: "CRITICAL"
      conclusion: "failure"
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
