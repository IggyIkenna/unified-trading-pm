name: publish-package

# repository_dispatch-triggered workflow (type: publish-package): publishes Python library wheels to GCP Artifact Registry.
#
# Triggered by repository_dispatch from per-repo workflows on push to main.
# AR repo: unified-libraries in central-element-323112/asia-northeast1
#
# Payload: { repo, version, commit_sha }
#
# Flow:
#   1. Checkout the library repo at the given commit
#   2. Build wheel using `python -m build`
#   3. Authenticate to GCP Artifact Registry via SA key
#   4. Upload wheel using `twine` to AR Python repository
#   5. Update workspace-manifest.json with published version

on:
  repository_dispatch:
    types: [publish-package]

permissions:
  contents: write

concurrency:
  group: publish-package-${{ github.event.client_payload.repo }}
  cancel-in-progress: false

env:
  AR_REGION: asia-northeast1
  AR_PROJECT: central-element-323112
  AR_REPOSITORY: unified-libraries

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      recovery: ${{ steps.recovery.outputs.recovery }}
    steps:
      - name: Validate payload
        id: payload
        run: |
          set -euo pipefail

          REPO="${{ github.event.client_payload.repo }}"
          VERSION="${{ github.event.client_payload.version }}"
          COMMIT_SHA="${{ github.event.client_payload.commit_sha }}"

          if [ -z "$REPO" ] || [ -z "$VERSION" ]; then
            echo "ERROR: Missing required payload fields (repo, version)"
            echo "Received: repo=$REPO version=$VERSION commit_sha=$COMMIT_SHA"
            exit 1
          fi

          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

          echo "Publishing $REPO v$VERSION (sha: ${COMMIT_SHA:-HEAD})"

      - name: Checkout library repo
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/${{ steps.payload.outputs.repo }}
          ref: ${{ steps.payload.outputs.commit_sha || 'main' }}
          token: ${{ secrets.GH_PAT }}
          path: library-source
          # MANDATORY for hatch-vcs repos (fixed 2026-07-23). Every repo is now
          # `dynamic = ["version"]` + `[tool.hatch.version] source = "vcs"`, so the version is
          # computed from `git describe`. The default shallow checkout (fetch-depth: 1) carries
          # NO history and NO tags, so hatch-vcs silently fell back to its no-history sentinel
          # and this job published a wheel literally versioned `0.0.0.dev0` — that is the
          # instruments-service artifact sitting in AR from 2026-07-03, carrying neither a
          # version nor a commit sha. Full history is required for the version to exist at all.
          fetch-depth: 0

      - name: Checkout PM repo (for manifest update)
        uses: actions/checkout@v5
        with:
          path: pm
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          pip install uv
          uv pip install --system build twine keyring keyrings.google-artifactregistry-auth

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v3
        with:
          # Was `secrets.GCP_SA_KEY_PROD` (2026-03-13, semver-rollout[bot]) — that secret was
          # NEVER PROVISIONED in this repo (only GCP_SA_KEY + WORKLOAD_IDENTITY_PROVIDER exist,
          # confirmed via `gh secret list`), so every dispatch through this workflow since its
          # creation hit "must specify exactly one of workload_identity_provider or
          # credentials_json" and failed before the checkout even ran. Found 2026-07-25 via a real
          # `unified-trading-library` publish-package FAILED alert.
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Build wheel
        working-directory: library-source
        run: |
          set -euo pipefail

          REPO="${{ steps.payload.outputs.repo }}"
          VERSION="${{ steps.payload.outputs.version }}"

          echo "=== Building wheel for $REPO v$VERSION ==="

          # Version provenance. Rewritten 2026-07-23: the previous check grepped a static
          # `version = "X.Y.Z"` out of pyproject.toml, which matches NOTHING under
          # `dynamic = ["version"]` — it resolved to "unknown", printed a WARNING, and
          # published anyway. Combined with the shallow checkout that is exactly how a
          # `0.0.0.dev0` wheel reached Artifact Registry. Assert against what was actually
          # BUILT, not what a config file claims, and FAIL rather than warn.
          echo "Expected version (from dispatch payload): $VERSION"
          echo "git describe: $(git describe --tags --always --dirty 2>&1 || echo '<no tags reachable>')"

          python -m build --wheel --outdir dist/

          echo "Built wheels:"
          ls -la dist/*.whl

          # Wheel filenames are `{name}-{version}-{pytag}-...whl`; field 2 is the real version.
          WHEEL_PATH=$(ls dist/*.whl | head -1)
          BUILT_VERSION=$(basename "$WHEEL_PATH" | awk -F- '{print $2}')
          echo "Built version (authoritative, from the wheel): $BUILT_VERSION"

          # FAIL CLOSED on an unidentifiable build. `0.0.0.dev0` is hatch-vcs's no-history
          # sentinel — publishing it is strictly worse than not publishing, because the
          # artifact then exists, outranks nothing, and names neither a release nor a commit.
          if [ "$BUILT_VERSION" = "0.0.0.dev0" ] || [ -z "$BUILT_VERSION" ]; then
            echo "::error::Refusing to publish $REPO: built version is '$BUILT_VERSION' (hatch-vcs found no reachable tag)."
            echo "  The checkout must include full history + tags (fetch-depth: 0) and the repo must have at least one v* tag."
            exit 1
          fi

          # A mismatch against the payload is a real provenance problem (the dispatch asked for
          # one version, the tree builds another), but the WHEEL is the truth — publish that and
          # make the disagreement loud rather than silently relabelling.
          #
          # SPLIT INTO TWO CASES 2026-08-21 (ci_reconciler). This used to `::warning::` on EVERY
          # mismatch and publish the mislabelled wheel regardless — which is precisely how a
          # tagged release silently ends up with no wheel at all. Measured: unified-api-contracts
          # v0.157.0 + v0.158.0 have NO wheel in AR (it went 0.157.1.dev1 → 0.158.1.dev1 →
          # 0.159.0), and unified-trading-library published only `.devN` for 11 of its last 12
          # tags. Consumers are pinned to the RELEASE floor by the version-bump fan-out, so each
          # lost release wheel breaks every dependent repo's image build on a version that will
          # never resolve — discovered hours later via a failed Cloud Build instead of here.
          #
          #   - `.devN`/unknown PAYLOAD  → the ordinary commit-push run, firing before the tag
          #     exists. Publishing a devN there is correct and expected; stays a warning.
          #   - CLEAN RELEASE payload    → the tag-push run. If it cannot build the matching
          #     wheel, the release is LOST. Fail loudly (this workflow already pages #ci-failures
          #     on failure) rather than publishing a devN nobody can consume.
          if [ "$BUILT_VERSION" != "$VERSION" ]; then
            case "$VERSION" in
              *.dev*|unknown|"")
                echo "::warning::Version mismatch — dispatch payload=$VERSION, built wheel=$BUILT_VERSION. Publishing the BUILT version (dev-hint payload = normal commit-push path)."
                ;;
              *)
                echo "::error::Release wheel NOT produced — dispatch named release $VERSION but the build produced $BUILT_VERSION."
                echo "  Refusing to publish: $VERSION would never reach Artifact Registry, and every consumer the"
                echo "  version-bump fan-out pins to >=$VERSION would fail its image build on an unresolvable version."
                echo "  Usual cause: the checkout's HEAD is AHEAD of the v$VERSION tag, so hatch-vcs computes a .devN."
                echo "  Recovery: re-dispatch publish-package with commit_sha = the v$VERSION tag target."
                exit 1
                ;;
            esac
          fi
          echo "built_version=$BUILT_VERSION" >> "$GITHUB_ENV"

      - name: Upload to Artifact Registry
        working-directory: library-source
        run: |
          set -euo pipefail

          REPO="${{ steps.payload.outputs.repo }}"
          # built_version is exported by the Build step (the wheel is the truth).
          VERSION="${built_version:-${{ steps.payload.outputs.version }}}"
          AR_URL="https://${AR_REGION}-python.pkg.dev/${AR_PROJECT}/${AR_REPOSITORY}/"

          echo "=== Uploading to Artifact Registry ==="
          echo "AR URL: $AR_URL"

          # twine uses keyring + keyrings.google-artifactregistry-auth for auth
          python -m twine upload \
            --repository-url "$AR_URL" \
            dist/*.whl \
            --verbose

          echo "Successfully published $REPO v$VERSION to $AR_URL"

      - name: Update manifest with published version
        working-directory: pm
        run: |
          set -euo pipefail

          REPO="${{ steps.payload.outputs.repo }}"
          # Record what was actually PUBLISHED (the wheel), not what the dispatch asked for —
          # otherwise published_packages re-acquires the identity gap this fix closes.
          VERSION="${built_version:-${{ steps.payload.outputs.version }}}"
          PUBLISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          echo "=== Updating manifest: published_packages.$REPO ==="

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # `main` sees heavy concurrent-push volume (fleet-wide promotes + every repo's own
          # publish-package run editing this same file) — a bare `git push origin main` here was
          # observed REJECTED ("! [rejected] main -> main (fetch first)") under load on 2026-07-26,
          # failing the whole job even though the wheel itself had ALREADY published successfully —
          # only the manifest bookkeeping commit was lost. Retry: on rejection, fetch fresh main and
          # re-derive the jq edit against it (idempotent + deterministic + keyed per-repo, so redoing
          # it from a fresh base is always safe) rather than rebasing a stale local commit.
          for attempt in 1 2 3 4 5; do
            jq --arg repo "$REPO" \
               --arg version "$VERSION" \
               --arg ts "$PUBLISHED_AT" \
               '(.published_packages //= {}) | .published_packages[$repo] = {version: $version, published_at: $ts, registry: "artifact-registry"}' \
               workspace-manifest.json > workspace-manifest.json.tmp \
              && mv workspace-manifest.json.tmp workspace-manifest.json

            if git diff --quiet workspace-manifest.json; then
              echo "No manifest change to commit."
              break
            fi

            git add workspace-manifest.json
            git commit -q -m "chore: publish $REPO v$VERSION to Artifact Registry [skip ci]"

            if git push origin main; then
              echo "Manifest update pushed (attempt $attempt/5)."
              break
            fi

            if [ "$attempt" = 5 ]; then
              echo "::error::Manifest push failed after 5 attempts — main kept moving under concurrent load."
              exit 1
            fi

            echo "Push rejected (attempt $attempt/5) — main moved, fetching fresh + retrying."
            git reset --hard HEAD~1
            git fetch origin main --quiet
            git reset --hard origin/main
            sleep $((attempt * 2))
          done

      - name: Persist CI/CD event
        # CI-cost STEP 2c: was a separate 1-billed-minute-minimum `persist:` job calling the
        # persist-cicd-event.yml reusable; as the LAST step it rides inside this already-billed
        # hosted job (KEEP — heavy wheel build stays on GitHub-hosted). PM is checked out at
        # `path: pm`, so the local action path carries that prefix. `if: always()` + `job.status`
        # reproduces the old `conclusion: needs.publish.result`. secrets/vars passed explicitly.
        if: always()
        uses: ./pm/.github/actions/persist-event
        with:
          repo_name: ${{ github.event.client_payload.repo }}
          workflow_name: ${{ github.workflow }}
          run_id: ${{ github.run_id }}
          conclusion: ${{ job.status }}
          branch: main
          commit_sha: ${{ github.event.client_payload.commit_sha }}
          details_json: '{"version": "${{ github.event.client_payload.version }}"}'
          cloud_provider: ${{ vars.CLOUD_PROVIDER }}
          events_bucket: ${{ vars.CICD_EVENTS_BUCKET }}
          gcp_sa_key: ${{ secrets.GCP_SA_KEY }}

      # Recovery detection (2026-07-25): notify-slack.yml's carrier SUPPRESSES a routine
      # INFO/success post ("routine green/INFO success — not a recovery; suppressed") unless
      # `recovery: true` is set — so a successful publish following a failed one was silently
      # dropped (a real gap: `unified-trading-library` v0.57.0 published cleanly after the
      # GCP_SA_KEY_PROD auth-bug fix, but nothing said so in Slack, only the FAILURE alerts that
      # preceded it were visible). Per-repo GCS marker (mirrors cloud-build-failure-watcher's
      # same-day fix) tracks the LAST conclusion for this repo so a genuine fail→success
      # transition can flag `recovery: true`; a routine repeat success (already green) does not.
      - name: Check publish recovery state
        id: recovery
        if: always()
        env:
          CICD_EVENTS_BUCKET: ${{ vars.CICD_EVENTS_BUCKET }}
        run: |
          set -uo pipefail
          REPO="${{ steps.payload.outputs.repo }}"
          CONCLUSION="${{ job.status }}"
          RECOVERED="false"
          if [ -n "${CICD_EVENTS_BUCKET:-}" ] && [ -n "$REPO" ]; then
            MARKER_URI="gs://${CICD_EVENTS_BUCKET}/cicd/watchers/publish-package/${REPO}.json"
            PREV_CONCLUSION="unknown"
            if gsutil cp "$MARKER_URI" /tmp/pp_prev_state.json 2>/dev/null; then
              PREV_CONCLUSION=$(python3 -c "import json; print(json.load(open('/tmp/pp_prev_state.json')).get('conclusion','unknown'))" 2>/dev/null || echo "unknown")
            fi
            if [ "$PREV_CONCLUSION" = "failure" ] && [ "$CONCLUSION" = "success" ]; then
              RECOVERED="true"
            fi
            echo "Previous publish conclusion for ${REPO}: ${PREV_CONCLUSION}; this run: ${CONCLUSION}; recovery=${RECOVERED}"
            STATE_JSON=$(python3 -c "import json; print(json.dumps({'conclusion': '${CONCLUSION}'}))")
            printf '%s' "$STATE_JSON" | gsutil cp - "$MARKER_URI" 2>/dev/null \
              || echo "::warning::failed to persist publish-package recovery marker for ${REPO}"
          fi
          echo "recovery=${RECOVERED}" >> "$GITHUB_OUTPUT"

  # ── SLACK NOTIFY (reusable workflow) ──────────────────────────────────
  notify:
    name: Slack — Publish Package
    needs: [publish]
    if: always()
    uses: ./.github/workflows/notify-slack.yml
    with:
      message: "Package publish | ${{ github.event.client_payload.repo }} v${{ github.event.client_payload.version }} |
        Registry: asia-northeast1-python.pkg.dev/central-element-323112/unified-libraries"
      # This job runs IN unified-trading-pm; the alert is ABOUT the published repo
      # (deployment_alerts_ingestion_completeness_2026_07_20.md todo 4).
      subject_repo: ${{ github.event.client_payload.repo }}
      severity: "INFO"
      conclusion: ${{ needs.publish.result }}
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      recovery: ${{ needs.publish.outputs.recovery == 'true' }}
    secrets: inherit
