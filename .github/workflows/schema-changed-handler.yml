name: Schema Changed Handler

# Receives repository_dispatch from T0 library repos (UAC, UTL) when a
# version bump includes changes to __init__.py exports or Pydantic model fields.
# Actions:
#   (a) Clones the changed repo to read the actual diff
#   (b) Searches cursor-rules/ and codex/ (folded into PM) for references to changed symbols
#   (c) If references found: dispatches rules-alignment-check to PM
#   (d) Sends Telegram summary
#
# Payload shape:
#   { repo, version, changed_files, diff_summary }
#
# Requires: GH_PAT secret — cross-repo clone and dispatch

on:
  repository_dispatch:
    types: [schema-changed]

permissions:
  contents: read

concurrency:
  group: schema-changed-${{ github.event.client_payload.repo }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GH_PAT }}
  GH_ORG: ${{ github.repository_owner }}

jobs:
  handle-schema-change:
    name: Handle Schema Change
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      repo: ${{ steps.parse.outputs.repo }}
      version: ${{ steps.parse.outputs.version }}
      symbols_changed: ${{ steps.check-refs.outputs.symbols_changed }}
      refs_found: ${{ steps.check-refs.outputs.refs_found }}

    steps:
      # ── CHECKOUT PM ────────────────────────────────────────────────────────
      - name: Checkout unified-trading-pm
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}

      # ── PARSE DISPATCH PAYLOAD ─────────────────────────────────────────────
      - name: Parse dispatch payload
        id: parse
        run: |
          set -euo pipefail

          REPO="${{ github.event.client_payload.repo }}"
          VERSION="${{ github.event.client_payload.version }}"
          CHANGED_FILES="${{ github.event.client_payload.changed_files }}"
          DIFF_SUMMARY="${{ github.event.client_payload.diff_summary }}"

          if [ -z "$REPO" ] || [ -z "$VERSION" ]; then
            echo "Missing repo or version in client_payload. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "=== Schema Changed Handler ==="
          echo "Repo:          $REPO"
          echo "Version:       $VERSION"
          echo "Changed files: $CHANGED_FILES"
          echo "Diff summary:  $DIFF_SUMMARY"

          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "changed_files=$CHANGED_FILES" >> "$GITHUB_OUTPUT"
          echo "diff_summary=$DIFF_SUMMARY" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # ── CLONE CHANGED REPO (shallow) ───────────────────────────────────────
      - name: Clone changed repo for diff analysis
        if: steps.parse.outputs.skip != 'true'
        run: |
          set -euo pipefail

          REPO="${{ steps.parse.outputs.repo }}"
          OWNER="${{ github.repository_owner }}"

          git clone --depth=2 "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${OWNER}/${REPO}.git" /tmp/changed-repo
          echo "Cloned $REPO (depth=2) for diff analysis"

      # ── EXTRACT CHANGED SYMBOLS ────────────────────────────────────────────
      - name: Extract changed symbols from diff
        if: steps.parse.outputs.skip != 'true'
        id: extract-symbols
        run: |
          set -euo pipefail

          cd /tmp/changed-repo

          # Get the actual diff for schema-relevant files
          DIFF_OUTPUT=$(git diff HEAD~1 --unified=0 -- '**/__init__.py' '**/*models*.py' '**/*schemas*.py' '**/*types*.py' 2>/dev/null || echo "")

          if [ -z "$DIFF_OUTPUT" ]; then
            echo "No schema-relevant diff found in HEAD~1"
            echo "symbols=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract added/removed symbol names from import lines, class definitions, and __all__ entries
          SYMBOLS=$(echo "$DIFF_OUTPUT" | grep -E '^[+-]' | grep -v '^[+-]{3}' | \
            grep -oE '\b[A-Z][A-Za-z0-9_]+\b' | \
            sort -u | tr '\n' ' ' || true)

          echo "Extracted symbols: $SYMBOLS"
          echo "symbols=$SYMBOLS" >> "$GITHUB_OUTPUT"

          # Count symbols for summary
          SYMBOL_COUNT=$(echo "$SYMBOLS" | wc -w | tr -d ' ')
          echo "symbol_count=$SYMBOL_COUNT" >> "$GITHUB_OUTPUT"

      # ── CHECK CURSOR-RULES AND CODEX FOR REFERENCES ────────────────────────
      - name: Check cursor-rules and codex for symbol references
        if: steps.parse.outputs.skip != 'true' && steps.extract-symbols.outputs.symbols != ''
        id: check-refs
        run: |
          set -euo pipefail

          SYMBOLS="${{ steps.extract-symbols.outputs.symbols }}"
          SYMBOL_COUNT="${{ steps.extract-symbols.outputs.symbol_count }}"
          REFS_FOUND=0
          MATCHED_SYMBOLS=""

          echo "Checking $SYMBOL_COUNT symbols against cursor-rules/ and codex..."

          for SYMBOL in $SYMBOLS; do
            # Skip very short symbols (likely false positives)
            if [ ${#SYMBOL} -lt 4 ]; then
              continue
            fi

            # Search cursor-rules/ — swallow grep's exit-1-on-no-match BEFORE the pipe:
            # under `set -euo pipefail` a no-match grep (exit 1) makes the whole pipe fail and
            # aborts the step on the first unmatched symbol (incident 2026-06-07: 55 symbols
            # extracted but the step crashed on symbol #1, so the notify job fell back to the
            # misleading "0 symbols changed, refs_found=false" default).
            RULES_HITS=$({ grep -rl "$SYMBOL" cursor-rules/ 2>/dev/null || true; } | wc -l | tr -d ' ')

            # Search codex/ (folded into this repo)
            CODEX_HITS=0
            if [ -d "codex" ]; then
              CODEX_HITS=$({ grep -rl "$SYMBOL" codex/ 2>/dev/null || true; } | wc -l | tr -d ' ')
            fi

            TOTAL_HITS=$((RULES_HITS + CODEX_HITS))
            if [ "$TOTAL_HITS" -gt 0 ]; then
              REFS_FOUND=$((REFS_FOUND + TOTAL_HITS))
              MATCHED_SYMBOLS="${MATCHED_SYMBOLS} ${SYMBOL}(${TOTAL_HITS})"
              echo "  Found: $SYMBOL — $RULES_HITS in cursor-rules, $CODEX_HITS in codex"
            fi
          done

          echo "symbols_changed=$SYMBOL_COUNT" >> "$GITHUB_OUTPUT"

          if [ "$REFS_FOUND" -gt 0 ]; then
            echo "refs_found=true" >> "$GITHUB_OUTPUT"
            echo "matched_symbols=$MATCHED_SYMBOLS" >> "$GITHUB_OUTPUT"
            echo "Total references found: $REFS_FOUND (symbols: $MATCHED_SYMBOLS)"
          else
            echo "refs_found=false" >> "$GITHUB_OUTPUT"
            echo "matched_symbols=" >> "$GITHUB_OUTPUT"
            echo "No docs/rules reference changed symbols — no dispatch needed"
          fi

      # ── DISPATCH: rules-alignment-check to PM ─────────────────────────────
      - name: Dispatch rules-alignment-check to PM
        if: steps.check-refs.outputs.refs_found == 'true'
        run: |
          set -euo pipefail

          OWNER="${{ github.repository_owner }}"
          REPO="${{ steps.parse.outputs.repo }}"
          VERSION="${{ steps.parse.outputs.version }}"
          DIFF_SUMMARY="${{ steps.parse.outputs.diff_summary }}"
          MATCHED="${{ steps.check-refs.outputs.matched_symbols }}"

          echo "Dispatching rules-alignment-check to PM..."

          HTTP_STATUS=$(curl -s -o /tmp/dispatch_response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER}/unified-trading-pm/dispatches" \
            -d "{\"event_type\": \"rules-alignment-check\", \"client_payload\": {\"source\": \"schema-changed-handler\", \"repo\": \"${REPO}\", \"version\": \"${VERSION}\", \"diff_summary\": \"${DIFF_SUMMARY}\", \"matched_symbols\": \"${MATCHED}\"}}")

          if [ "$HTTP_STATUS" = "204" ]; then
            echo "Dispatched rules-alignment-check to PM"
          else
            echo "WARNING: HTTP $HTTP_STATUS dispatching rules-alignment-check to PM"
            cat /tmp/dispatch_response.json 2>/dev/null || true
          fi

      # ── NO REFERENCES FOUND ────────────────────────────────────────────────
      - name: Log no references found
        if: steps.check-refs.outputs.refs_found != 'true' && steps.parse.outputs.skip != 'true'
        run: |
          echo "No docs/rules reference changed symbols in ${{ steps.parse.outputs.repo }} v${{ steps.parse.outputs.version }}"
          echo "Skipping rules-alignment dispatch."

  # ── SLACK NOTIFY (reusable workflow) ──────────────────────────────────
  notify:
    name: Slack — Schema Changed Handler
    needs: [handle-schema-change]
    if: always() && needs.handle-schema-change.outputs.repo != ''
    uses: ./.github/workflows/notify-slack.yml
    with:
      message:
        "Schema change in ${{ needs.handle-schema-change.outputs.repo }} v${{ needs.handle-schema-change.outputs.version
        }}: ${{ needs.handle-schema-change.outputs.symbols_changed || '0' }} symbols changed, refs_found=${{
        needs.handle-schema-change.outputs.refs_found || 'false' }}"
      severity: "INFO"
      conclusion: ${{ needs.handle-schema-change.result }}
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets: inherit

  persist:
    name: Persist — Schema Changed Event
    needs: [handle-schema-change, notify]
    if: always() && needs.handle-schema-change.outputs.repo != ''
    uses: ./.github/workflows/persist-cicd-event.yml
    secrets: inherit
    with:
      repo_name: ${{ needs.handle-schema-change.outputs.repo || 'unified-trading-pm' }}
      workflow_name: ${{ github.workflow }}
      run_id: ${{ github.run_id }}
      conclusion: ${{ needs.handle-schema-change.result }}
      branch: ${{ github.ref_name }}
      commit_sha: ${{ github.sha }}
      details_json:
        '{"event": "schema-changed", "repo": "${{ needs.handle-schema-change.outputs.repo }}", "refs_found": "${{
        needs.handle-schema-change.outputs.refs_found }}"}'
