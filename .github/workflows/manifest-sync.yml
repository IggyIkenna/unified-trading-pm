name: manifest-sync

# Fires repository_dispatch to dependent repos when PM manifest changes.
# Dependent repos add: on: repository_dispatch: types: [manifest-updated]
# Set vars.MANIFEST_DISPATCH_TARGET to override (e.g. "org/unified-trading-codex").

on:
  push:
    branches: [main]
    paths:
      - workspace-manifest.json
      - "plans/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Repository dispatch to codex
        env:
          TARGET: ${{ vars.MANIFEST_DISPATCH_TARGET || format('{0}/unified-trading-codex', github.repository_owner) }}
        run: |
          echo "Dispatching manifest-updated to $TARGET"
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$TARGET/dispatches" \
            -d '{"event_type":"manifest-updated","client_payload":{"source":"unified-trading-pm","ref":"${{ github.sha }}"}}' || true

  notify-failure:
    name: Telegram — Manifest Sync Failure
    needs: [dispatch]
    if: always() && needs.dispatch.result == 'failure'
    uses: ./.github/workflows/notify-telegram.yml
    with:
      message:
        "Manifest sync dispatch FAILED. View: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
        github.run_id }}"
      severity: "WARNING"
      conclusion: "failure"
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
