name: Contract Drift Recording

on:
  schedule:
    - cron: "0 2 * * *" # nightly at 2am UTC
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30

    steps:
      - name: Checkout unified-trading-pm
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Checkout unified-api-contracts
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/unified-api-contracts
          token: ${{ secrets.GH_PAT }}
          path: unified-api-contracts

      - name: Record fresh API responses
        run: |
          echo "Recording drift for staging"
          # Re-record cassettes against live/staging APIs
          # Store fresh responses alongside existing cassettes

      - name: Compare to existing cassettes
        id: compare
        run: |
          echo "Comparing responses"
          # Diff fresh recordings against committed cassettes
          # Output structured drift report

      - name: Create PR if drift detected
        run: |
          echo "Creating approval-gated PR"
          # If diff is non-empty, create a PR in unified-api-contracts
          # with updated cassettes for human review

  notify-failure:
    name: Slack — Contract Drift Failure
    needs: [record]
    if: always() && needs.record.result == 'failure'
    uses: ./.github/workflows/notify-slack.yml
    with:
      message:
        "Contract drift recording FAILED. View: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
        github.run_id }}"
      severity: "WARNING"
      conclusion: "failure"
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets: inherit
