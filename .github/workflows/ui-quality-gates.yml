name: ui-quality-gates

# Reusable workflow — called by all TypeScript/React UI repos.
# Loaded at the ref pinned by rollout-quality-gates-ci-workflows.py
# (active_feature_branch from workspace-manifest.json).

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version
        type: string
        default: "22"
    secrets:
      GH_PAT:
        required: true
      TELEGRAM_BOT_TOKEN:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUD_MOCK_MODE: "true"
      CLOUD_PROVIDER: "local"
      GCP_PROJECT_ID: "test-project"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Clone unified-trading-pm
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DEP_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          BRANCH="${DEP_BRANCH:-main}"
          (git clone -b "$BRANCH" "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY_OWNER}/unified-trading-pm.git" ../unified-trading-pm 2>/dev/null \
            || git clone -b main "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY_OWNER}/unified-trading-pm.git" ../unified-trading-pm 2>/dev/null) || true

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Run quality gates
        shell: bash
        run: |
          set -o pipefail
          bash scripts/quality-gates.sh --no-fix 2>&1 | tee /tmp/qg_output.log

      - name: Record CI status (branch-aware lifecycle)
        if: always()
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TRIGGER_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          [ -z "${GH_PAT}" ] && echo "GH_PAT not set — skipping ci-status-update" && exit 0

          # Determine ci_status based on job result AND which branch triggered
          if [ "${{ job.status }}" != "success" ]; then
            STATUS="FAILING"
          elif [ "$TRIGGER_BRANCH" = "staging" ]; then
            STATUS="STAGING_GREEN"
          else
            STATUS="FEATURE_GREEN"
          fi

          # Capture failure excerpt (last 30 lines, ANSI-stripped, ~1500 char cap, base64 for JSON
          # transport). Empty on pass; receiver only renders when STATUS=FAILING.
          EXCERPT_B64=""
          if [ "${STATUS}" = "FAILING" ] && [ -f /tmp/qg_output.log ]; then
            EXCERPT_B64=$(sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' /tmp/qg_output.log | tail -n 30 | head -c 1500 | base64 | tr -d '\n')
          fi

          echo "Recording ci_status=${STATUS} for ${GITHUB_REPOSITORY#*/} (branch=${TRIGGER_BRANCH})"
          curl -s -X POST \
            -H "Authorization: token ${GH_PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/unified-trading-pm/dispatches" \
            -d "{\"event_type\": \"ci-status-update\", \"client_payload\": {\"repo\": \"${GITHUB_REPOSITORY#*/}\", \"status\": \"${STATUS}\", \"branch\": \"${TRIGGER_BRANCH}\", \"sha\": \"${GITHUB_SHA}\", \"failure_excerpt_b64\": \"${EXCERPT_B64}\"}}"

  notify-failure:
    name: Telegram — QG Failure
    needs: [quality-gates]
    if: always() && needs.quality-gates.result == 'failure'
    uses: ./.github/workflows/notify-telegram.yml
    with:
      message:
        "QG FAILED — ${{ github.event.repository.name }} (${{ github.head_ref || github.ref_name }}). View: ${{
        github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      severity: "CRITICAL"
      conclusion: "failure"
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets: inherit
