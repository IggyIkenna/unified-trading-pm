name: Claude API Health Monitor

# State-transition-only health monitoring for Claude API.
# Runs every 15 min. Sends Telegram ONLY when state changes: healthy→degraded or degraded→healthy.
# No spam — if API is continuously down, only ONE alert fires (on transition).
# Uses ANTHROPIC_API_KEY_SYSHEALTH (syshealth tier — low priority, won't block CICD agents).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health-check:
    name: Claude API health ping
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      should_alert: ${{ steps.health-ping.outputs.should_alert }}
      health_state: ${{ steps.health-ping.outputs.health_state }}
      error_class: ${{ steps.health-ping.outputs.error_class }}

    steps:
      - name: Install Claude CLI
        run: |
          npm install -g @anthropic-ai/claude-code 2>/dev/null || true
          which claude || echo "Claude CLI install failed"

      - name: Ping Claude API and detect state change
        id: health-ping
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_SYSHEALTH || secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e  # Don't fail the job — health monitor should always complete

          CACHE_KEY="claude-health-state"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%MZ")

          # Read previous state from cache (written by previous run)
          PREV_STATE=$(cat /tmp/claude_health_prev 2>/dev/null || echo "unknown")

          # Ping Claude API with 30s timeout
          NEW_STATE="healthy"
          ERROR_CLASS="none"
          if ! timeout 30 claude --print "ping: respond with the single word OK" \
            2>/tmp/health_err.txt | grep -qi "ok"; then

            ERR=$(head -c 200 /tmp/health_err.txt 2>/dev/null || echo "")
            if echo "$ERR" | grep -qiE '401|403|unauthorized|invalid.*key'; then
              ERROR_CLASS="auth_error"
            elif echo "$ERR" | grep -qiE '429|529|rate.limit|overload'; then
              ERROR_CLASS="rate_limited"
            elif echo "$ERR" | grep -qiE '503|502|connection.refused|unreachable'; then
              ERROR_CLASS="service_down"
            else
              ERROR_CLASS="unknown"
            fi
            NEW_STATE="degraded"
          fi

          echo "Previous state: $PREV_STATE → New state: $NEW_STATE ($ERROR_CLASS)"

          # Determine if we should send an alert (state transition only)
          SHOULD_ALERT="false"
          if [ "$NEW_STATE" != "$PREV_STATE" ] && [ "$PREV_STATE" != "unknown" ]; then
            SHOULD_ALERT="true"
          elif [ "$PREV_STATE" = "unknown" ] && [ "$NEW_STATE" = "degraded" ]; then
            SHOULD_ALERT="true"
          else
            echo "State unchanged ($NEW_STATE) — no Telegram alert"
          fi

          # Write new state for next run (using GH Actions cache would be ideal;
          # for simplicity we use a workflow artifact approach here)
          echo "$NEW_STATE" > /tmp/claude_health_current
          echo "health_state=$NEW_STATE" >> "$GITHUB_OUTPUT" 2>/dev/null || true
          echo "error_class=$ERROR_CLASS" >> "$GITHUB_OUTPUT" 2>/dev/null || true
          echo "should_alert=$SHOULD_ALERT" >> "$GITHUB_OUTPUT" 2>/dev/null || true
          echo "prev_state=$PREV_STATE" >> "$GITHUB_OUTPUT" 2>/dev/null || true

  # ── TELEGRAM NOTIFY (reusable workflow) ──────────────────────────────────
  notify:
    name: Telegram — Claude API Health
    needs: [health-check]
    if: always() && needs.health-check.outputs.should_alert == 'true'
    uses: ./.github/workflows/notify-telegram.yml
    with:
      message: "Claude API Health Monitor — state transition detected"
      severity: "WARNING"
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets: inherit

  persist:
    name: Persist — Claude API Health Event
    needs: [health-check, notify]
    if: always() && needs.health-check.outputs.should_alert == 'true'
    uses: ./.github/workflows/persist-cicd-event.yml
    secrets: inherit
    with:
      repo_name: unified-trading-pm
      workflow_name: ${{ github.workflow }}
      run_id: ${{ github.run_id }}
      conclusion: ${{ needs.health-check.outputs.health_state == 'healthy' && 'success' || 'failure' }}
      branch: ${{ github.ref_name }}
      commit_sha: ${{ github.sha }}
      details_json:
        '{"health_state": "${{ needs.health-check.outputs.health_state }}", "error_class": "${{
        needs.health-check.outputs.error_class }}"}'
