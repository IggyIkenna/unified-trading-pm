name: codex-freshness-sweep

# Daily ASYNC sweep for codex/*.md freshness violations (authoring defects: missing/invalid
# last_reviewed:, malformed frontmatter; plus the advisory staleness digest). Previously this
# check (scripts/quality_gates/check_codex_doc_freshness.py) ran as a BLOCKING post-gate step
# inside quality-gates.sh — a time-triggered ratchet (a doc cohort ageing past its 90-day
# window with NOTHING actually edited) blocked every unrelated PM commit on the calendar day
# it tipped, and the only fast exits were a banned re-baseline or a dishonest date stamp. See
# plans/active/issues/codex_freshness_ratchet_trips_on_calendar_blocking_all_pm_code_commits_2026_08_11.md.
#
# This workflow keeps the review-debt signal (still real) but moves it OFF the commit path: a
# violation here files a tracked agent-orchestrator escalation (wall_type=codex_freshness_stale)
# instead of blocking a stranger's commit. --strict mode is deliberate here (unlike the retired
# quality-gates.sh call, which used ratchet mode): a daily sweep should surface the FULL current
# violation set, not just new-vs-baseline, since nothing downstream of this workflow gates on it.
#
# Resolution signal: this workflow's OWN next run concluding "success" (0 violations) is what
# agent-orchestrator's escalation.py polls for auto-resolution — see server/escalation.py's
# _poll_wall_resolution codex_freshness_stale branch. Mirrors backmerge_sync_failure's "next
# scheduled run green" resolution shape (same as here: no PR involved, pr_number=0 sentinel).
#
# SSOT: codex/04-architecture/agent-orchestrator-ci-escalation-wall-types.md

on:
  schedule:
    - cron: "0 6 * * *" # once daily
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: codex-freshness-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    outputs:
      violation_report: ${{ steps.check.outputs.violation_report }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install checker deps
        run: python3 -m pip install --quiet pyyaml

      - name: Run codex doc freshness check (--strict — full current violation set)
        id: check
        run: |
          set +e
          OUT=$(python3 scripts/quality_gates/check_codex_doc_freshness.py --workspace-root . --strict 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          {
            echo "violation_report<<__EOR__"
            echo "$OUT" | tail -n 30
            echo "__EOR__"
          } >> "$GITHUB_OUTPUT"
          exit $RC

  # ── Escalate to an agent — files a real tracked issue, not just a Slack post ──────────
  escalate:
    needs: sweep
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch codex_freshness_stale escalation
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPORT: ${{ needs.sweep.outputs.violation_report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -z "${GH_PAT}" ] && echo "GH_PAT not set — skipping escalation dispatch (Slack alert still fires separately)" && exit 0
          GH_TOKEN="${GH_PAT}" gh api "repos/${{ github.repository }}/dispatches" \
            -f event_type=escalate-to-orchestrator \
            -f "client_payload[repo]=${{ github.event.repository.name }}" \
            -f "client_payload[pr_number]=0" \
            -f 'client_payload[wall_type]=codex_freshness_stale' \
            -f "client_payload[context]=Daily codex-freshness-sweep.yml found violation(s): ${REPORT}. Run: ${RUN_URL}. Fix each on live-defi-rollout via quickmerge (add/fix last_reviewed:, repair malformed frontmatter, or genuinely re-read+re-date a stale doc — never stamp last_reviewed unread). This wall auto-resolves once codex-freshness-sweep.yml runs clean (0 violations) again — no manual close needed." \
            -f 'client_payload[model]=sonnet' \
            >/dev/null 2>&1 && echo "escalated codex_freshness_stale to orchestrator" \
            || echo "::warning::orchestrator escalation dispatch failed (non-fatal — Slack alert still fires)"

  notify:
    needs: sweep
    if: failure()
    uses: ./.github/workflows/notify-slack.yml
    with:
      message: ${{ needs.sweep.outputs.violation_report }}
      severity: WARNING
      workflow_name: codex-freshness-sweep
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      dedup_key: codex-freshness-stale
      # A freshness violation persists until someone re-reviews the doc(s) — re-remind
      # every ~12h rather than every daily tick spamming a standing condition.
      cooldown_min: 720
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

  notify-resolved:
    needs: sweep
    if: success()
    uses: ./.github/workflows/notify-slack.yml
    with:
      message: "✅ codex-freshness-sweep.yml is clean again (0 violations)."
      severity: INFO
      recovery: true
      workflow_name: codex-freshness-sweep
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      dedup_key: codex-freshness-stale
      cooldown_min: 60
      concurrency_suffix: resolved
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
