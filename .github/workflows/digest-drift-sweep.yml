# digest-drift-sweep.yml — periodic sweep that refreshes stale BASE_IMAGE_DIGEST pins fleet-wide.
#
# Runs every 6 hours (and on manual dispatch). For each image-building service repo, fetches the
# repo's Dockerfile via GitHub API, compares its ARG BASE_IMAGE_DIGEST against the current UTL
# :latest digest, and dispatches `dependency-update` (base_image_digest only — dep-version is
# in-range so consumers set skip=true but the digest-refresh step still rides and commits the
# refreshed pin to LDR). This covers:
#   (b) UAC/other-base-layer republishes that don't ride a UTL version-bump
#   (c) new repos not yet in the UTL dep-graph (no prior dependency-update dispatch received)
# SSOT: plans/active/build_operability_smoke_all_repos_2026_06_19.md Phase 5 fix-c.

name: digest-drift-sweep

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_all:
        description: "Dispatch to ALL repos even if digest is already current"
        required: false
        default: "false"
      max_dispatches:
        description: "Cap on dispatches per run (bounds the fan-out to a fraction of the fleet per tick)"
        required: false
        default: "5"

jobs:
  sweep:
    # CI-cost B1: off billed hosted minutes onto the self-hosted glue pool. Labels are a SUBSET
    # match, so [self-hosted, glue] lands ONLY on the JIT-ephemeral pool — never on glue-writer.
    # SSOT: scripts/self-hosted-runners/README.md
    runs-on: [self-hosted, glue]
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout PM repo
        uses: actions/checkout@v4

      - name: Authenticate to GCP via WIF
        id: auth-wif
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to GCP via SA key (fallback)
        id: auth-key
        if: steps.auth-wif.outcome != 'success'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: steps.auth-wif.outcome == 'success' || steps.auth-key.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve current UTL :latest digest
        id: current-digest
        if: steps.auth-wif.outcome == 'success' || steps.auth-key.outcome == 'success'
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          PROJECT_ID="${GCP_PROJECT_ID:-central-element-323112}"
          IMAGE="asia-northeast1-docker.pkg.dev/${PROJECT_ID}/unified-trading-library/unified-trading-library:latest"
          DIGEST=$(gcloud artifacts docker images describe "$IMAGE" --format='value(image_summary.digest)' 2>/dev/null || echo "")
          if ! echo "$DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "ERROR: Could not resolve a valid digest (got: '$DIGEST')" >&2
            exit 1
          fi
          echo "Current UTL digest: $DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Sweep stale repos and dispatch digest refresh
        if: steps.current-digest.outputs.digest != ''
        env:
          # Cross-repo Contents-API reads + repository_dispatch REQUIRE a full-repo PAT — the
          # ambient repo-scoped ${{ secrets.GITHUB_TOKEN }} cannot read another repo's contents,
          # so every IMAGE_REPO silently hit "Dockerfile not found" and the sweep NEVER dispatched
          # (fleet stayed stale-pinned; see issues/base_image_digest_sweep_broken_fleet_builds_red_2026_07_18.md).
          # GH_PAT is the same cross-repo token update-repo-version.yml / UTL clone-pm-scripts use.
          GH_PAT: ${{ secrets.GH_PAT }}
          CURRENT_DIGEST: ${{ steps.current-digest.outputs.digest }}
          FORCE_ALL: ${{ inputs.force_all || 'false' }}
          MAX_DISPATCHES: ${{ inputs.max_dispatches || '5' }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # All image-building service repos that use the UTL base image with ARG BASE_IMAGE_DIGEST.
          # List derived from workspace-manifest.json image-building repos + QG STEP 5.79 converted set.
          # Add new repos here when they adopt the FROM-digest ratchet.
          IMAGE_REPOS=(
            "agent-orchestrator"
            "alerting-service"
            "batch-live-reconciliation-service"
            "client-reporting-api"
            "deployment-api"
            "deployment-service"
            "execution-service"
            "features-service"
            "fund-administration-service"
            "greeks-service"
            "instruments-service"
            "market-data-processing-service"
            "market-tick-data-service"
            "ml-service"
            "strategy-service"
            "trading-agent-service"
          )

          # Resolve current UTL version from PM manifest (used as a stable non-breaking dep_version
          # for the dispatch payload so consumers set skip=true but digest-refresh still runs).
          UTL_VERSION=$(python3 -c "
          import json
          with open('workspace-manifest.json') as f:
              m = json.load(f)
          print(m.get('versions', {}).get('unified-trading-library', '0.1.0'))
          " 2>/dev/null || echo "0.1.0")
          echo "UTL version for dispatch payload: $UTL_VERSION"
          echo "Current digest: $CURRENT_DIGEST"

          TOKEN="${GH_PAT}"
          DISPATCHED=0
          ALREADY_FRESH=0
          SKIPPED_NO_ARG=0
          ERRORS=0
          CAPPED=0

          for REPO in "${IMAGE_REPOS[@]}"; do
            # Fetch Dockerfile content from default branch (live-defi-rollout or main).
            # Try LDR first (it's the live tip), fall back to main. The HTTP status is captured
            # and branched on explicitly (never folded into a swallowed empty string): 404 =
            # genuinely absent (benign skip, tried on both branches); 401/403/anything else =
            # an auth/permission failure and must FAIL THE STEP LOUDLY — conflating that with a
            # benign skip is exactly how this sweep went silently no-op for 27 days (see
            # issues/digest_drift_sweep_silent_noop_github_token_scope_2026_07_16.md).
            DOCKERFILE_CONTENT=""
            FOUND=false
            for BRANCH in "live-defi-rollout" "main"; do
              BODY_FILE=$(mktemp)
              HTTP_STATUS=$(curl -s -o "$BODY_FILE" -w '%{http_code}' \
                -H "Authorization: Bearer $TOKEN" \
                -H "Accept: application/vnd.github.raw+json" \
                "https://api.github.com/repos/$OWNER/$REPO/contents/Dockerfile?ref=$BRANCH")
              if [ "$HTTP_STATUS" = "200" ]; then
                DOCKERFILE_CONTENT=$(cat "$BODY_FILE")
                rm -f "$BODY_FILE"
                FOUND=true
                break
              elif [ "$HTTP_STATUS" = "404" ]; then
                rm -f "$BODY_FILE"
                continue
              else
                echo "  $REPO: HTTP $HTTP_STATUS fetching Dockerfile@$BRANCH — auth/permission failure, NOT a benign absence" >&2
                cat "$BODY_FILE" >&2
                rm -f "$BODY_FILE"
                exit 1
              fi
            done

            if [ "$FOUND" != "true" ]; then
              echo "  $REPO: Dockerfile not found on live-defi-rollout or main — skipping (repo may not be image-building)"
              SKIPPED_NO_ARG=$((SKIPPED_NO_ARG + 1))
              continue
            fi

            # Extract pinned digest from the Dockerfile
            PINNED_DIGEST=$(echo "$DOCKERFILE_CONTENT" | grep -oE '^ARG BASE_IMAGE_DIGEST=sha256:[0-9a-f]{64}' | grep -oE 'sha256:[0-9a-f]{64}' || echo "")

            if [ -z "$PINNED_DIGEST" ]; then
              echo "  $REPO: no ARG BASE_IMAGE_DIGEST found — not yet converted to FROM-digest ratchet; skipping"
              SKIPPED_NO_ARG=$((SKIPPED_NO_ARG + 1))
              continue
            fi

            if [ "$PINNED_DIGEST" = "$CURRENT_DIGEST" ] && [ "$FORCE_ALL" != "true" ]; then
              echo "  $REPO: digest current ($PINNED_DIGEST) — no dispatch needed"
              ALREADY_FRESH=$((ALREADY_FRESH + 1))
              continue
            fi

            if [ "$DISPATCHED" -ge "$MAX_DISPATCHES" ]; then
              echo "  $REPO: STALE ($PINNED_DIGEST → $CURRENT_DIGEST) — dispatch cap ($MAX_DISPATCHES) reached this run, deferring to next tick"
              CAPPED=$((CAPPED + 1))
              continue
            fi

            echo "  $REPO: STALE ($PINNED_DIGEST → $CURRENT_DIGEST) — dispatching digest refresh"
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$OWNER/$REPO/dispatches" \
              -d "{
                \"event_type\": \"dependency-update\",
                \"client_payload\": {
                  \"dep_name\": \"unified-trading-library\",
                  \"dep_version\": \"$UTL_VERSION\",
                  \"constraint\": \">=0.1.0,<1.0.0\",
                  \"bump_type\": \"patch\",
                  \"is_breaking\": \"false\",
                  \"chain_depth\": 1,
                  \"cascade_depth\": 1,
                  \"base_image_digest\": \"$CURRENT_DIGEST\"
                }
              }")
            if [ "$HTTP_STATUS" = "204" ]; then
              echo "    ✅ Dispatched to $REPO"
              DISPATCHED=$((DISPATCHED + 1))
            else
              echo "    ⚠️  HTTP $HTTP_STATUS for $REPO — may not have update-dependency-version.yml yet"
              ERRORS=$((ERRORS + 1))
            fi
          done

          echo ""
          echo "=== Digest drift sweep complete ==="
          echo "  Dispatched:    $DISPATCHED"
          echo "  Already fresh: $ALREADY_FRESH"
          echo "  Capped (deferred to next tick): $CAPPED"
          echo "  No ARG found:  $SKIPPED_NO_ARG"
          echo "  Errors:        $ERRORS"
          if [ "$ERRORS" -gt 0 ]; then
            echo "WARNING: $ERRORS dispatch(es) failed — check that repos have update-dependency-version.yml workflow" >&2
          fi

          # Self-auditing assertion: a sweep that never successfully read/acted on a single repo
          # (Dispatched + Already fresh + Capped all zero) despite a non-empty IMAGE_REPOS list is
          # the exact silent-no-op failure mode this workflow shipped with for 27 days — fail loudly
          # instead of reporting a benign-looking all-skipped green run. CAPPED counts as "found and
          # would have dispatched", so a cap-bound run is never mistaken for this failure.
          if [ "${#IMAGE_REPOS[@]}" -gt 0 ] && [ "$((DISPATCHED + ALREADY_FRESH + CAPPED))" -eq 0 ]; then
            echo "ERROR: Dispatched + Already fresh + Capped == 0 across ${#IMAGE_REPOS[@]} repos — the sweep never successfully read a single Dockerfile. See issues/digest_drift_sweep_silent_noop_github_token_scope_2026_07_16.md." >&2
            exit 1
          fi
