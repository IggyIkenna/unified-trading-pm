name: Plan Notification & Approval Gate

# Gate 1 of 2 in the plan-driven governance model.
# Fires when any plan in plans/active/*.plan.md is created or updated on PM main.
# Sends Telegram notification for human review.
# Human replies /approve-plan [name] → plan frontmatter updated to status: approved.
# Agents check status: approved before implementing plan todos.

on:
  push:
    branches: [main]
    paths:
      - "plans/active/*.plan.md"
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  # ── Notify on plan change ──────────────────────────────────────────────────
  notify-plan-change:
    name: Notify Telegram on plan creation/update
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed plans
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          # Find plan files changed in this push
          CHANGED_PLANS=$(git diff --name-only HEAD~1 HEAD -- 'plans/active/*.plan.md' 2>/dev/null || true)

          if [ -z "$CHANGED_PLANS" ]; then
            echo "No plan files changed in this push."
            exit 0
          fi

          echo "Changed plans:"
          echo "$CHANGED_PLANS"

          while IFS= read -r PLAN_FILE; do
            [ -z "$PLAN_FILE" ] || [ ! -f "$PLAN_FILE" ] && continue

            PLAN_NAME=$(basename "$PLAN_FILE" .plan.md)

            # Count pending todos
            TODO_COUNT=$(grep -c "status: pending" "$PLAN_FILE" 2>/dev/null || echo "?")

            # GitHub file link
            REPO_URL="https://github.com/${{ github.repository }}"
            FILE_URL="${REPO_URL}/blob/main/${PLAN_FILE}"

            echo "Plan changed: $PLAN_NAME (pending todos: $TODO_COUNT) — $FILE_URL"

          done <<< "$CHANGED_PLANS"

  # ── Handle /approve-plan comments ─────────────────────────────────────────
  handle-plan-approval:
    name: Handle /approve-plan comment
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'issue_comment' &&
      startsWith(github.event.comment.body, '/approve-plan')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Verify permission and approve plan
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          COMMENTER: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          # Verify permission
          PERMISSION=$(gh api \
            "repos/${{ github.repository }}/collaborators/$COMMENTER/permission" \
            --jq '.permission' 2>/dev/null || echo "none")
          if [[ "$PERMISSION" != "write" && "$PERMISSION" != "maintain" && "$PERMISSION" != "admin" ]]; then
            echo "DENIED: $COMMENTER has $PERMISSION access — write+ required"
            exit 0
          fi

          # Extract plan name from comment: /approve-plan plan_name_here
          PLAN_NAME=$(echo "$COMMENT_BODY" | sed 's|/approve-plan\s*||' | tr -d '[:space:]')
          if [ -z "$PLAN_NAME" ]; then
            echo "No plan name provided in comment."
            exit 0
          fi

          # Find the plan file
          PLAN_FILE="plans/active/${PLAN_NAME}.plan.md"
          if [ ! -f "$PLAN_FILE" ]; then
            # Try without .plan suffix
            PLAN_FILE=$(find plans/active/ -name "*${PLAN_NAME}*.plan.md" | head -1 || true)
          fi
          if [ -z "$PLAN_FILE" ] || [ ! -f "$PLAN_FILE" ]; then
            echo "Plan not found: $PLAN_NAME"
            exit 0
          fi

          echo "Approving plan: $PLAN_FILE"

          # Update status: active → approved in frontmatter
          git config user.name "plan-approval[bot]"
          git config user.email "plan-approval[bot]@users.noreply.github.com"

          python3 - <<PYEOF
          import re, pathlib
          content = pathlib.Path("$PLAN_FILE").read_text()
          # Update status field in YAML frontmatter
          updated = re.sub(r'^(status:\s*)active', r'\1approved', content, flags=re.MULTILINE)
          if updated == content:
              # Try inserting status: approved if not present
              updated = re.sub(r'^(status:\s*\w+)', r'status: approved', content, flags=re.MULTILINE)
          pathlib.Path("$PLAN_FILE").write_text(updated)
          print(f"Plan status updated to approved: $PLAN_FILE")
          PYEOF

          git add "$PLAN_FILE"
          git diff --staged --quiet && { echo "No frontmatter change needed."; exit 0; }
          git commit -m "chore(plans): approve plan ${PLAN_NAME} (by @${COMMENTER}) [skip ci]"
          git push

          echo "Plan approved: $PLAN_NAME"

  # ── TELEGRAM NOTIFICATIONS (reusable workflow) ───────────────────────────

  notify-plan-change-telegram:
    name: Telegram — Plan Change
    needs: [notify-plan-change]
    if: always() && needs.notify-plan-change.result == 'success'
    uses: ./.github/workflows/notify-telegram.yml
    with:
      message: "Plan Ready for Review — new or updated plans in plans/active/"
      severity: "INFO"
      conclusion: ${{ needs.notify-plan-change.result }}
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

  notify-plan-approval-telegram:
    name: Telegram — Plan Approval
    needs: [handle-plan-approval]
    if: always() && needs.handle-plan-approval.result == 'success'
    uses: ./.github/workflows/notify-telegram.yml
    with:
      message: "Plan Approved by @${{ github.event.comment.user.login }} — agents may now begin implementation."
      severity: "INFO"
      conclusion: ${{ needs.handle-plan-approval.result }}
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

  persist:
    name: Persist — Plan Notification Event
    needs: [notify-plan-change, handle-plan-approval]
    if: always()
    uses: ./.github/workflows/persist-cicd-event.yml
    with:
      repo_name: unified-trading-pm
      workflow_name: ${{ github.workflow }}
      run_id: ${{ github.run_id }}
      conclusion: "success"
      branch: ${{ github.ref_name }}
      commit_sha: ${{ github.sha }}
      details_json: '{"event": "plan-notification"}'
