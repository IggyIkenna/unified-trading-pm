name: Auto-Merge Minor Fixes

# Auto-merges downstream fix PRs for non-breaking MINOR dependency updates
# when QG + SIT pass. Fires after SIT validates repos (sit-validated dispatch).
#
# Safety gates (CRITICAL — never bypass):
#   1. NEVER auto-merge if is_breaking=true (label or PR body contains "breaking")
#   2. NEVER auto-merge if repo version < 1.0.0 (pre-1.0.0 ALWAYS requires human approval)
#   3. NEVER auto-merge MAJOR bumps
#   4. dry_run=true by default (safe for initial rollout)
#
# Flow:
#   SIT passes → dispatches sit-validated → this workflow runs →
#   reads workspace-manifest.json for SIT_VALIDATED repos →
#   checks for eligible PRs (breaking-fix-pending / dependency-update labels) →
#   auto-merges non-breaking MINOR/PATCH PRs on 1.0.0+ repos →
#   sends Telegram summary

on:
  repository_dispatch:
    types: [sit-validated]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — log what would be merged without actually merging"
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-merge-minor-fixes
  cancel-in-progress: true

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    outputs:
      merged_summary: ${{ steps.merge.outputs.merged_summary }}
      skipped_summary: ${{ steps.merge.outputs.skipped_summary }}
      merged_count: ${{ steps.merge.outputs.merged_count }}
      skipped_count: ${{ steps.merge.outputs.skipped_count }}
    steps:
      - name: Checkout PM
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Determine dry_run mode
        id: mode
        run: |
          # repository_dispatch has no inputs — default to dry_run=true for safety
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Find SIT_VALIDATED repos and auto-merge eligible PRs
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          python3 - <<'PYEOF'
          import json
          import os
          import subprocess
          import sys
          sys.path.insert(0, "scripts/cicd")

          owner = os.environ["OWNER"]
          dry_run = os.environ.get("DRY_RUN", "true").lower() == "true"
          github_output = os.environ.get("GITHUB_OUTPUT", "")

          with open("workspace-manifest.json") as f:
              manifest = json.load(f)

          # Phase 2: Firestore-authoritative ci_status (manifest fallback when Firestore unavailable).
          try:
              from ci_status_store import resolve_ci_status_map
              _ci_map = resolve_ci_status_map(manifest, project_id=os.environ.get("GCP_PROJECT_ID"))
          except Exception:
              _rd = manifest.get("repositories", {})
              _ci_map = {k: v.get("ci_status", "") for k, v in _rd.items() if isinstance(v, dict)}

          repos_data = manifest.get("repositories", {})
          versions = manifest.get("versions", {})

          # Step 1: Find all repos with ci_status=SIT_VALIDATED
          sit_validated_repos = []
          for repo_name in repos_data:
              if _ci_map.get(repo_name) == "SIT_VALIDATED":
                  sit_validated_repos.append(repo_name)

          if not sit_validated_repos:
              print("No repos with ci_status=SIT_VALIDATED. Nothing to do.")
              if github_output:
                  with open(github_output, "a") as f:
                      f.write("merged_count=0\n")
                      f.write("skipped_count=0\n")
                      f.write("merged_summary=\n")
                      f.write("skipped_summary=\n")
              sys.exit(0)

          print(f"Found {len(sit_validated_repos)} SIT_VALIDATED repo(s):")
          for r in sit_validated_repos:
              print(f"  {r} (v{versions.get(r, 'unknown')})")
          print()

          def run_gh(args: list[str]) -> tuple[int, str]:
              result = subprocess.run(args, capture_output=True, text=True)
              return result.returncode, result.stdout.strip()

          def parse_version(v: str) -> tuple[int, int, int]:
              parts = v.split(".")
              return (int(parts[0]), int(parts[1]), int(parts[2]))

          def is_pre_1_0(version_str: str) -> bool:
              try:
                  major, _, _ = parse_version(version_str)
                  return major < 1
              except (ValueError, IndexError):
                  return True  # Unknown version = treat as pre-1.0.0 (safe default)

          def is_breaking(pr_labels: list[str], pr_body: str) -> bool:
              # Check labels
              breaking_labels = {"breaking", "breaking-change", "is_breaking"}
              for label in pr_labels:
                  if label.lower() in breaking_labels:
                      return True
              # Check PR body for "breaking" keyword
              body_lower = pr_body.lower()
              if "is_breaking: true" in body_lower or "is_breaking=true" in body_lower:
                  return True
              return False

          def is_major_bump(pr_title: str, pr_labels: list[str]) -> bool:
              title_lower = pr_title.lower()
              if "major" in title_lower and "bump" in title_lower:
                  return True
              for label in pr_labels:
                  if "major" in label.lower():
                      return True
              return False

          merged_list: list[str] = []
          skipped_list: list[str] = []

          for repo in sit_validated_repos:
              version = versions.get(repo, "0.0.0")
              print(f"=== {repo} (v{version}) ===")

              # Gate: pre-1.0.0 repos ALWAYS require human approval
              if is_pre_1_0(version):
                  print(f"  SKIP: pre-1.0.0 (v{version}) — requires human approval")
                  skipped_list.append(f"{repo} (pre-1.0.0)")
                  continue

              # Find open PRs with eligible labels
              target_labels = ["breaking-fix-pending", "dependency-update"]
              for label in target_labels:
                  rc, pr_json = run_gh([
                      "gh", "pr", "list",
                      "--repo", f"{owner}/{repo}",
                      "--label", label,
                      "--state", "open",
                      "--json", "number,title,labels,body,statusCheckRollup,headRefName",
                      "--limit", "50",
                  ])

                  if rc != 0 or not pr_json:
                      continue

                  try:
                      prs = json.loads(pr_json)
                  except json.JSONDecodeError:
                      print(f"  WARN: Failed to parse PR JSON for {repo} (label={label})")
                      continue

                  for pr in prs:
                      pr_num = pr.get("number", "?")
                      pr_title = pr.get("title", "")
                      pr_body = pr.get("body", "")
                      pr_labels = [lbl.get("name", "") for lbl in pr.get("labels", [])]
                      pr_branch = pr.get("headRefName", "")

                      print(f"  PR #{pr_num}: {pr_title}")
                      print(f"    Labels: {pr_labels}")

                      # Gate: NEVER auto-merge if is_breaking
                      if is_breaking(pr_labels, pr_body):
                          print(f"    SKIP: breaking change detected")
                          skipped_list.append(f"{repo} PR#{pr_num} (breaking)")
                          continue

                      # Gate: NEVER auto-merge MAJOR bumps
                      if is_major_bump(pr_title, pr_labels):
                          print(f"    SKIP: major bump detected")
                          skipped_list.append(f"{repo} PR#{pr_num} (major bump)")
                          continue

                      # Gate: Verify PR checks are passing
                      checks = pr.get("statusCheckRollup", [])
                      has_failing = False
                      for check in (checks or []):
                          conclusion = check.get("conclusion", "")
                          state = check.get("state", "")
                          if conclusion in ("FAILURE", "ERROR", "CANCELLED"):
                              has_failing = True
                              break
                          if state in ("FAILURE", "ERROR"):
                              has_failing = True
                              break

                      if has_failing:
                          print(f"    SKIP: failing checks")
                          skipped_list.append(f"{repo} PR#{pr_num} (failing checks)")
                          continue

                      # All gates passed — merge (or dry-run log)
                      if dry_run:
                          print(f"    DRY RUN: would auto-merge PR #{pr_num}")
                          merged_list.append(f"{repo} PR#{pr_num} (dry-run)")
                      else:
                          print(f"    MERGING PR #{pr_num}...")

                          # Squash merge
                          rc_merge, out_merge = run_gh([
                              "gh", "pr", "merge", str(pr_num),
                              "--repo", f"{owner}/{repo}",
                              "--squash",
                              "--body", "Auto-merged: non-breaking dependency update, QG + SIT passed.",
                          ])

                          if rc_merge == 0:
                              print(f"    MERGED PR #{pr_num}")
                              merged_list.append(f"{repo} PR#{pr_num}")

                              # Add comment
                              run_gh([
                                  "gh", "pr", "comment", str(pr_num),
                                  "--repo", f"{owner}/{repo}",
                                  "--body", "Auto-merged: non-breaking dependency update, QG + SIT passed.",
                              ])

                              # Close associated issue if referenced in PR body
                              # Look for "Closes #N" or "Fixes #N" patterns
                              import re
                              issue_refs = re.findall(
                                  r"(?:closes|fixes|resolves)\s+#(\d+)",
                                  pr_body,
                                  re.IGNORECASE,
                              )
                              for issue_num in issue_refs:
                                  rc_close, _ = run_gh([
                                      "gh", "issue", "close", issue_num,
                                      "--repo", f"{owner}/{repo}",
                                      "--reason", "completed",
                                      "--comment", "Closed via auto-merge of non-breaking dependency update PR.",
                                  ])
                                  if rc_close == 0:
                                      print(f"    Closed issue #{issue_num}")
                                  else:
                                      print(f"    WARN: Failed to close issue #{issue_num}")
                          else:
                              print(f"    FAILED to merge PR #{pr_num}: {out_merge}")
                              skipped_list.append(f"{repo} PR#{pr_num} (merge failed)")

          # Summary
          print()
          print("=== Auto-Merge Summary ===")
          mode_str = "DRY RUN" if dry_run else "LIVE"
          print(f"Mode: {mode_str}")
          print(f"Merged: {len(merged_list)}")
          for m in merged_list:
              print(f"  {m}")
          print(f"Skipped (require human approval): {len(skipped_list)}")
          for s in skipped_list:
              print(f"  {s}")

          # Write outputs
          if github_output:
              with open(github_output, "a") as f:
                  f.write(f"merged_count={len(merged_list)}\n")
                  f.write(f"skipped_count={len(skipped_list)}\n")
                  # Truncate summaries to avoid output size limits
                  merged_str = ", ".join(merged_list[:20])
                  skipped_str = ", ".join(skipped_list[:20])
                  f.write(f"merged_summary={merged_str}\n")
                  f.write(f"skipped_summary={skipped_str}\n")

          PYEOF

  # ── TELEGRAM NOTIFICATIONS (reusable workflow) ───────────────────────────

  notify-summary:
    name: Slack — Auto-Merge Summary
    needs: [auto-merge]
    if: always() && (needs.auto-merge.outputs.merged_count != '0' || needs.auto-merge.outputs.skipped_count != '0')
    uses: ./.github/workflows/notify-slack.yml
    with:
      message:
        "Auto-Merge Minor Fixes | Merged: ${{ needs.auto-merge.outputs.merged_count }} [${{
        needs.auto-merge.outputs.merged_summary }}] | Skipped (human approval required): ${{
        needs.auto-merge.outputs.skipped_count }} [${{ needs.auto-merge.outputs.skipped_summary }}]"
      severity: "INFO"
      conclusion: ${{ needs.auto-merge.result }}
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets: inherit
