name: update-repo-version

# Receives repository_dispatch from individual repos after their version-bump.
# Actions:
#   (a) Updates workspace-manifest.json with the new repo version
#   (b) Bumps PM's own pyproject.toml patch version (so PM version tracks manifest changes)
#   (c) Dispatches dependency-update events to all downstream repos that depend on the bumped repo
#
# Requires: GH_PAT secret in PM repo and all dispatching repos — full-repo PAT for cross-repo dispatch.

on:
  repository_dispatch:
    types: [version-bump]

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Update manifest, bump PM version, compute dependents
        id: update
        run: |
          set -euo pipefail

          REPO="${{ github.event.client_payload.repo }}"
          VERSION="${{ github.event.client_payload.version }}"

          if [ -z "$REPO" ] || [ -z "$VERSION" ]; then
            echo "Missing repo or version in client_payload. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Updating workspace-manifest.json: $REPO → $VERSION"

          # (a) Update the bumped repo's version entry
          if ! grep -q "\"${REPO}\"" workspace-manifest.json; then
            echo "Repo $REPO not found in workspace-manifest.json — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sed -i "s/\"${REPO}\": \"[0-9]*\.[0-9]*\.[0-9]*\"/\"${REPO}\": \"${VERSION}\"/" workspace-manifest.json

          # (b) Bump PM's own patch version in pyproject.toml
          CURRENT=$(grep -oP '^version\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' pyproject.toml)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_PATCH=$((PATCH + 1))
          NEW_PM_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          sed -i "s/^version = \"${CURRENT}\"/version = \"${NEW_PM_VERSION}\"/" pyproject.toml

          # Also update PM's own version entry in the manifest
          sed -i "s/\"unified-trading-pm\": \"[0-9]*\.[0-9]*\.[0-9]*\"/\"unified-trading-pm\": \"${NEW_PM_VERSION}\"/" workspace-manifest.json

          echo "PM version: $CURRENT → $NEW_PM_VERSION"

          # (c) Find all direct dependents and build their new constraint
          python3 - > /tmp/dependents.txt <<PYEOF
          import json, sys
          with open("workspace-manifest.json") as f:
              m = json.load(f)
          repo = "${REPO}"
          version = "${VERSION}"
          parts = version.split(".")
          major = int(parts[0])
          minor = int(parts[1])
          for name, data in m.get("repositories", {}).items():
              for dep in data.get("dependencies", []):
                  if dep.get("name") == repo:
                      constraint = f">={major}.{minor}.0,<{major+1}.0.0"
                      print(json.dumps({"repo": name, "dep_name": repo, "dep_version": version, "constraint": constraint}))
          PYEOF

          echo "Dependents of $REPO:"
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            dep_repo=$(echo "$line" | python3 -c "import json,sys; print(json.load(sys.stdin)['repo'])")
            echo "  - $dep_repo"
          done < /tmp/dependents.txt

          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pm_version=$NEW_PM_VERSION" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Commit manifest and PM version bump
        if: steps.update.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet workspace-manifest.json pyproject.toml; then
            echo "No changes. Skipping commit."
            exit 0
          fi

          git add workspace-manifest.json pyproject.toml
          git commit -m "chore(manifest): update ${{ steps.update.outputs.repo }} to ${{ steps.update.outputs.version }}, bump PM to ${{ steps.update.outputs.pm_version }} [skip ci]"
          git push

      - name: Dispatch dependency-update to downstream repos
        if: steps.update.outputs.skip != 'true'
        run: |
          set -euo pipefail

          OWNER="${{ github.repository_owner }}"
          TOKEN="${{ secrets.GH_PAT }}"

          if [ -z "$TOKEN" ]; then
            echo "GH_PAT not set — skipping downstream dispatch."
            exit 0
          fi

          while IFS= read -r line; do
            [ -z "$line" ] && continue

            DEPENDENT_REPO=$(echo "$line" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['repo'])")
            DEP_NAME=$(echo "$line" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['dep_name'])")
            DEP_VERSION=$(echo "$line" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['dep_version'])")
            CONSTRAINT=$(echo "$line" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['constraint'])")

            echo "Dispatching dependency-update to $DEPENDENT_REPO: $DEP_NAME=$DEP_VERSION (constraint: $CONSTRAINT)"

            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$OWNER/$DEPENDENT_REPO/dispatches" \
              -d "{\"event_type\": \"dependency-update\", \"client_payload\": {\"dep_name\": \"$DEP_NAME\", \"dep_version\": \"$DEP_VERSION\", \"constraint\": \"$CONSTRAINT\"}}")

            if [ "$HTTP_STATUS" = "204" ]; then
              echo "  ✅ Dispatched to $DEPENDENT_REPO"
            else
              echo "  ⚠️  HTTP $HTTP_STATUS for $DEPENDENT_REPO (repo may not have receiver workflow yet)"
            fi
          done < /tmp/dependents.txt
