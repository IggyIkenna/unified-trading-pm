name: Nightly Smoke Matrix

# Nightly institutional-smoke-matrix runner (Phase 5 of
# institutional_smoke_matrix_2026_04_20.plan.md).
#
# Runs every service's scripts/smoke_matrix.py in dep-order (Tier 0 →
# Tier 3 features-*) against -test- buckets with IS_TEST_RUN=true +
# --max-results 1. Pass/fail of the most recent run gates production
# deployments.
#
# Troubleshooting: see
# unified-trading-pm/codex/14-playbooks/smoke-testing-playbook.md — every
# failure mode (TEST bucket missing, IS_TEST_RUN not propagated, dep
# cascade broken, api-football missing, rate limits) has a recipe there.
#
# Orchestrator SSOT: deployment-service/scripts/run-smoke-matrix.sh
# Floor enforcer SSOT: deployment-service/scripts/enforce-smoke-coverage-floor.py

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch:
    inputs:
      fail_fast:
        description: "Abort on first service failure (default: continue on error)"
        required: false
        type: boolean
        default: false
      include_ml:
        description: "Include ml-training + ml-inference (P2 — default excluded)"
        required: false
        type: boolean
        default: false
      service:
        description: "Scope to one service (empty = full matrix)"
        required: false
        type: string
        default: ""
      category:
        description: "Scope to one category: CEFI|TRADFI|DEFI|SPORTS|PREDICTION (empty = all)"
        required: false
        type: string
        default: ""

  # Exposed for downstream promotion workflows that gate staging → main on
  # the most recent smoke-matrix result. Callers read the `smoke_green`
  # output; they MUST refuse to merge when it is false.
  workflow_call:
    outputs:
      smoke_green:
        description: "True if the most recent smoke matrix run had zero FAIL cells."
        value: ${{ jobs.smoke-matrix.outputs.smoke_green }}

permissions:
  contents: read
  id-token: write # Workload-identity auth to GCP

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  WORKSPACE_ROOT: ${{ github.workspace }}
  REPORT_DIR: ${{ github.workspace }}/smoke-reports

jobs:
  smoke-matrix:
    name: Run institutional smoke matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      smoke_green: ${{ steps.summarise.outputs.smoke_green }}
      summary_total: ${{ steps.summarise.outputs.summary_total }}
      summary_pass: ${{ steps.summarise.outputs.summary_pass }}
      summary_fail: ${{ steps.summarise.outputs.summary_fail }}
      summary_skip: ${{ steps.summarise.outputs.summary_skip }}
      telegram_message: ${{ steps.summarise.outputs.telegram_message }}
    steps:
      - name: Checkout unified-trading-pm (codex + this workflow)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: unified-trading-pm
          ref: live-defi-rollout

      - name: Checkout sibling repos (workspace layout)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deployment-service
          path: deployment-service
          ref: live-defi-rollout
          token: ${{ secrets.GH_PAT || github.token }}

      # Every service in the dep DAG must be present at WORKSPACE_ROOT/<svc>
      # for the orchestrator to resolve `<svc>/scripts/smoke_matrix.py`. We
      # clone only the services in the matrix — ~12 repos.
      - name: Checkout Tier 0/1/2 services
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/instruments-service
          path: instruments-service
          ref: live-defi-rollout
          token: ${{ secrets.GH_PAT || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/market-tick-data-service
          path: market-tick-data-service
          ref: live-defi-rollout
          token: ${{ secrets.GH_PAT || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/market-data-processing-service
          path: market-data-processing-service
          ref: live-defi-rollout
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Checkout Tier 3 features-* services
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/features-sports-service
          path: features-sports-service
          ref: live-defi-rollout
          token: ${{ secrets.GH_PAT || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/features-calendar-service
          path: features-calendar-service
          ref: live-defi-rollout
          token: ${{ secrets.GH_PAT || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/features-onchain-service
          path: features-onchain-service
          ref: live-defi-rollout
          token: ${{ secrets.GH_PAT || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/features-delta-one-service
          path: features-delta-one-service
          ref: live-defi-rollout
          token: ${{ secrets.GH_PAT || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/features-volatility-service
          path: features-volatility-service
          ref: live-defi-rollout
          token: ${{ secrets.GH_PAT || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/features-cross-instrument-service
          path: features-cross-instrument-service
          ref: live-defi-rollout
          token: ${{ secrets.GH_PAT || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/features-multi-timeframe-service
          path: features-multi-timeframe-service
          ref: live-defi-rollout
          token: ${{ secrets.GH_PAT || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/features-commodity-service
          path: features-commodity-service
          ref: live-defi-rollout
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system tooling (gsutil via gcloud SDK)
        run: |
          set -euo pipefail
          echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" \
            | sudo tee /etc/apt/sources.list.d/google-cloud-sdk.list
          curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg
          sudo apt-get update -qq
          sudo apt-get install -y google-cloud-cli
          gsutil version

      - name: Authenticate to GCP (workload identity)
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_NIGHTLY_SMOKE_SA }}
        continue-on-error: true

      - name: Install pytest + runtime deps (flat, no extras)
        working-directory: deployment-service
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip uv
          # Flat-deps rule: uv pip install -e . (no .[dev])
          uv pip install --system -e .

      - name: Validate smoke-matrix plan via --dry-run
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p "${REPORT_DIR}-dryrun"

          DRY_ARGS=(--dry-run --report-dir "${REPORT_DIR}-dryrun")
          if [ -n "${{ inputs.service || '' }}" ]; then
            DRY_ARGS+=(--service "${{ inputs.service }}")
          fi
          if [ -n "${{ inputs.category || '' }}" ]; then
            DRY_ARGS+=(--category "${{ inputs.category }}")
          fi
          if [ "${{ inputs.include_ml || 'false' }}" = "true" ]; then
            DRY_ARGS+=(--include-ml)
          fi

          bash deployment-service/scripts/run-smoke-matrix.sh "${DRY_ARGS[@]}"

      - name: Run smoke matrix (live)
        id: run-matrix
        working-directory: ${{ github.workspace }}
        # Shard-level isolation: orchestrator returns rc=1 when any cell fails.
        # We capture that into a step output for the gate; never set
        # continue-on-error:true at the job level (that would let a red matrix
        # masquerade as green to downstream consumers).
        run: |
          set -euo pipefail
          mkdir -p "${REPORT_DIR}"

          RUN_ARGS=(--report-dir "${REPORT_DIR}")
          if [ "${{ inputs.fail_fast || 'false' }}" = "true" ]; then
            RUN_ARGS+=(--fail-fast)
          fi
          if [ "${{ inputs.include_ml || 'false' }}" = "true" ]; then
            RUN_ARGS+=(--include-ml)
          fi
          if [ -n "${{ inputs.service || '' }}" ]; then
            RUN_ARGS+=(--service "${{ inputs.service }}")
          fi
          if [ -n "${{ inputs.category || '' }}" ]; then
            RUN_ARGS+=(--category "${{ inputs.category }}")
          fi

          RC=0
          bash deployment-service/scripts/run-smoke-matrix.sh "${RUN_ARGS[@]}" || RC=$?
          echo "matrix_rc=${RC}" >> "$GITHUB_OUTPUT"

      - name: Enforce smoke-coverage floor
        id: floor-gate
        if: always() && steps.run-matrix.outputs.matrix_rc != ''
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          FLOOR_CFG="deployment-service/configs/smoke-coverage-floor.yaml"
          if [ ! -f "${FLOOR_CFG}" ]; then
            echo "::warning::floor config missing at ${FLOOR_CFG}; skipping gate."
            echo "floor_rc=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RC=0
          python deployment-service/scripts/enforce-smoke-coverage-floor.py \
              --summary "${REPORT_DIR}/summary.json" \
              --floor-config "${FLOOR_CFG}" || RC=$?
          echo "floor_rc=${RC}" >> "$GITHUB_OUTPUT"

      - name: Summarise for gate + Telegram
        id: summarise
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          MATRIX_RC: ${{ steps.run-matrix.outputs.matrix_rc }}
          FLOOR_RC: ${{ steps.floor-gate.outputs.floor_rc }}
        run: |
          set -euo pipefail

          SUMMARY="${REPORT_DIR}/summary.json"
          if [ ! -f "${SUMMARY}" ]; then
            echo "smoke_green=false" >> "$GITHUB_OUTPUT"
            echo "summary_total=0" >> "$GITHUB_OUTPUT"
            echo "summary_pass=0" >> "$GITHUB_OUTPUT"
            echo "summary_fail=0" >> "$GITHUB_OUTPUT"
            echo "summary_skip=0" >> "$GITHUB_OUTPUT"
            MSG="Nightly smoke matrix: FAILED before summary was written (setup error). See workflow run."
            echo "telegram_message=${MSG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TOTAL=$(python -c "import json,sys;print(json.load(open('${SUMMARY}')).get('total',0))")
          PASS=$(python -c "import json,sys;print(json.load(open('${SUMMARY}')).get('passed',0))")
          FAIL=$(python -c "import json,sys;print(json.load(open('${SUMMARY}')).get('failed',0))")
          SKIP=$(python -c "import json,sys;print(json.load(open('${SUMMARY}')).get('skipped',0))")

          echo "summary_total=${TOTAL}" >> "$GITHUB_OUTPUT"
          echo "summary_pass=${PASS}" >> "$GITHUB_OUTPUT"
          echo "summary_fail=${FAIL}" >> "$GITHUB_OUTPUT"
          echo "summary_skip=${SKIP}" >> "$GITHUB_OUTPUT"

          # Green = matrix rc 0 AND floor rc 0 (or floor not configured).
          GREEN=false
          if [ "${MATRIX_RC}" = "0" ] && { [ "${FLOOR_RC}" = "0" ] || [ -z "${FLOOR_RC}" ]; }; then
            GREEN=true
          fi
          echo "smoke_green=${GREEN}" >> "$GITHUB_OUTPUT"

          if [ "${GREEN}" = "true" ]; then
            MSG="Nightly smoke matrix GREEN: ${TOTAL} cells | ${PASS} PASS | ${FAIL} FAIL | ${SKIP} SKIP"
          else
            MSG="Nightly smoke matrix RED: ${TOTAL} cells | ${PASS} PASS | ${FAIL} FAIL | ${SKIP} SKIP (matrix_rc=${MATRIX_RC} floor_rc=${FLOOR_RC}). See playbook: codex/14-playbooks/smoke-testing-playbook.md"
          fi
          echo "telegram_message=${MSG}" >> "$GITHUB_OUTPUT"

      - name: Upload per-service + summary JSON artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-matrix-reports
          path: ${{ env.REPORT_DIR }}
          retention-days: 30
          if-no-files-found: warn

      - name: Gate — fail job when any cell FAILed or floor regressed
        if: always()
        env:
          MATRIX_RC: ${{ steps.run-matrix.outputs.matrix_rc }}
          FLOOR_RC: ${{ steps.floor-gate.outputs.floor_rc }}
        run: |
          set -euo pipefail
          if [ "${MATRIX_RC:-1}" != "0" ]; then
            echo "::error::Smoke matrix reported FAIL cells (matrix_rc=${MATRIX_RC}). See playbook § 3."
            exit 1
          fi
          if [ "${FLOOR_RC:-0}" != "0" ]; then
            echo "::error::Smoke-coverage floor regressed (floor_rc=${FLOOR_RC}). See playbook § 8."
            exit 1
          fi
          echo "Smoke matrix GREEN + floor OK."

  # ── Telegram notification (reuses PM's notify-telegram.yml) ─────────────
  notify:
    name: Telegram — Nightly Smoke Matrix
    needs: [smoke-matrix]
    if: always()
    uses: ./.github/workflows/notify-telegram.yml
    with:
      message:
        ${{ needs.smoke-matrix.outputs.telegram_message || 'Nightly smoke matrix completed. Check workflow run for
        details.' }}
      severity: ${{ needs.smoke-matrix.outputs.smoke_green == 'true' && 'INFO' || 'CRITICAL' }}
      conclusion: ${{ needs.smoke-matrix.result }}
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
