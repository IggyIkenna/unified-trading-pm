name: SIT Starvation Detector
# Runs every 15 minutes — alerts if SIT lock is stale for >25 minutes
# (a SIT run is ~15 min; a lock older than ~25 min is dangling, not in-progress).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  # manifest-mutating workflow → share the manifest-update group (cancel-in-progress:false) so it
  # serialises with every other manifest writer and cannot silently lose an update (finding H2).
  # Was the per-poller `sit-starvation-check` group.
  group: manifest-update
  cancel-in-progress: false

jobs:
  check-stale-lock:
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.stale-check.outputs.stale }}
    steps:
      - name: Checkout PM repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Check for stale SIT lock
        id: stale-check
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          MANIFEST="workspace-manifest.json"

          set +e
          python3 << 'PYEOF'
          import json, sys
          from datetime import datetime, timezone, timedelta

          with open('workspace-manifest.json') as f:
              m = json.load(f)

          staging = m.get('staging_status', {})
          locked = staging.get('locked', False)
          locked_alert_sent = staging.get('locked_alert_sent', False)

          if not locked:
              print("SIT not locked — no starvation")
              sys.exit(0)

          if locked_alert_sent:
              print("Alert already sent — no duplicate")
              sys.exit(0)

          # sit-gate.yml writes staging_status.locked_since (NOT locked_at) — read that field.
          locked_since_str = staging.get('locked_since', '')
          if not locked_since_str:
              print("No locked_since timestamp")
              sys.exit(0)

          locked_since = datetime.fromisoformat(locked_since_str.replace('Z', '+00:00'))
          age = datetime.now(timezone.utc) - locked_since

          if age > timedelta(minutes=25):
              print(f"STALE LOCK: locked for {age} — sending alert")
              # Mark alert as sent
              m['staging_status']['locked_alert_sent'] = True
              with open('workspace-manifest.json', 'w') as f:
                  json.dump(m, f, indent=2)
              sys.exit(2)  # exit 2 = send alert
          else:
              print(f"Lock age {age} < 25m — OK")
              sys.exit(0)
          PYEOF

          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 2 ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            git config user.email "ci@unified-trading.com"
            git config user.name "CI Bot"
            git add workspace-manifest.json
            git commit -m "chore: mark SIT starvation alert sent [skip ci]"
            # Retry-with-rebase (finding H2): a concurrent manifest writer can land between checkout and
            # push; a bare push fails non-fast-forward and the alert-sent flag is lost. Rebase + retry.
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "Pushed manifest update (attempt ${attempt})."
                break
              fi
              echo "Push rejected (attempt ${attempt}); rebasing onto origin/main and retrying."
              git pull --rebase --autostash origin main
              if [ "${attempt}" = "5" ]; then
                echo "FATAL: could not push manifest update after 5 attempts."
                exit 1
              fi
            done
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

  # ── SLACK NOTIFY (reusable workflow) ──────────────────────────────────
  notify:
    name: Slack — SIT Starvation Detector
    needs: [check-stale-lock]
    if: always() && needs.check-stale-lock.outputs.stale == 'true'
    uses: ./.github/workflows/notify-slack.yml
    with:
      message:
        "SIT lock stale — staging has been locked for >25min (a SIT run is ~15min, so this lock is dangling and is
        blocking fleet merges). Check SIT status or force-unlock: gh workflow run sit-unlock.yml"
      severity: "WARNING"
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets: inherit

  persist:
    name: Persist — SIT Starvation Event
    needs: [check-stale-lock, notify]
    if: always() && needs.check-stale-lock.outputs.stale == 'true'
    uses: ./.github/workflows/persist-cicd-event.yml
    secrets: inherit
    with:
      repo_name: unified-trading-pm
      workflow_name: ${{ github.workflow }}
      run_id: ${{ github.run_id }}
      conclusion: "failure"
      branch: ${{ github.ref_name }}
      commit_sha: ${{ github.sha }}
      details_json: '{"event": "sit-starvation-detected"}'
