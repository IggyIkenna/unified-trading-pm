name: SIT Starvation Detector
# Runs every 15 minutes — alerts if SIT lock is stale for >1 hour

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: sit-starvation-check
  cancel-in-progress: true

jobs:
  check-stale-lock:
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.stale-check.outputs.stale }}
    steps:
      - name: Checkout PM repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Check for stale SIT lock
        id: stale-check
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          MANIFEST="workspace-manifest.json"

          set +e
          python3 << 'PYEOF'
          import json, sys
          from datetime import datetime, timezone, timedelta

          with open('workspace-manifest.json') as f:
              m = json.load(f)

          staging = m.get('staging_status', {})
          locked = staging.get('locked', False)
          locked_alert_sent = staging.get('locked_alert_sent', False)

          if not locked:
              print("SIT not locked — no starvation")
              sys.exit(0)

          if locked_alert_sent:
              print("Alert already sent — no duplicate")
              sys.exit(0)

          locked_at_str = staging.get('locked_at', '')
          if not locked_at_str:
              print("No locked_at timestamp")
              sys.exit(0)

          locked_at = datetime.fromisoformat(locked_at_str.replace('Z', '+00:00'))
          age = datetime.now(timezone.utc) - locked_at

          if age > timedelta(hours=1):
              print(f"STALE LOCK: locked for {age} — sending alert")
              # Mark alert as sent
              m['staging_status']['locked_alert_sent'] = True
              with open('workspace-manifest.json', 'w') as f:
                  json.dump(m, f, indent=2)
              sys.exit(2)  # exit 2 = send alert
          else:
              print(f"Lock age {age} < 1h — OK")
              sys.exit(0)
          PYEOF

          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 2 ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            git config user.email "ci@unified-trading.com"
            git config user.name "CI Bot"
            git add workspace-manifest.json
            git commit -m "chore: mark SIT starvation alert sent [skip ci]"
            git push
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

  # ── TELEGRAM NOTIFY (reusable workflow) ──────────────────────────────────
  notify:
    name: Telegram — SIT Starvation Detector
    needs: [check-stale-lock]
    if: always() && needs.check-stale-lock.outputs.stale == 'true'
    uses: ./.github/workflows/notify-telegram.yml
    with:
      message:
        "SIT lock stale — staging has been locked for >1hr. Check SIT status or force-unlock: gh workflow run
        sit-unlock.yml"
      severity: "WARNING"
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

  persist:
    name: Persist — SIT Starvation Event
    needs: [check-stale-lock, notify]
    if: always() && needs.check-stale-lock.outputs.stale == 'true'
    uses: ./.github/workflows/persist-cicd-event.yml
    with:
      repo_name: unified-trading-pm
      workflow_name: ${{ github.workflow }}
      run_id: ${{ github.run_id }}
      conclusion: "failure"
      branch: ${{ github.ref_name }}
      commit_sha: ${{ github.sha }}
      details_json: '{"event": "sit-starvation-detected"}'
