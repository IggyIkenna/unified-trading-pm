name: Secret Health Check

# Weekly validation that critical secrets are still functional.
# Does NOT expose secret values — only checks if they work.

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Validate GH_PAT
        id: gh-pat
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "status=missing" >> "$GITHUB_OUTPUT"
            echo "GH_PAT: MISSING (not set)"
          else
            USER=$(gh api user --jq '.login' 2>/dev/null || echo "")
            if [ -n "$USER" ]; then
              echo "status=valid" >> "$GITHUB_OUTPUT"
              echo "GH_PAT: VALID (authenticated as $USER)"
            else
              echo "status=invalid" >> "$GITHUB_OUTPUT"
              echo "GH_PAT: INVALID (authentication failed)"
            fi
          fi

      - name: Validate TELEGRAM_BOT_TOKEN (per-env)
        id: telegram
        env:
          TELEGRAM_BOT_TOKEN_PROD: ${{ secrets.TELEGRAM_BOT_TOKEN_PROD }}
          TELEGRAM_BOT_TOKEN_STAGING: ${{ secrets.TELEGRAM_BOT_TOKEN_STAGING }}
          TELEGRAM_BOT_TOKEN_DEV: ${{ secrets.TELEGRAM_BOT_TOKEN_DEV }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          check_token() {
            local name="$1" token="$2"
            if [ -z "$token" ]; then
              echo "${name}: MISSING"
            else
              RESULT=$(curl -s "https://api.telegram.org/bot${token}/getMe" | python3 -c "import json,sys; d=json.load(sys.stdin); print('ok' if d.get('ok') else 'fail')" 2>/dev/null || echo "fail")
              if [ "$RESULT" = "ok" ]; then echo "${name}: VALID"; else echo "${name}: INVALID"; fi
            fi
          }
          check_token "TELEGRAM_BOT_TOKEN_PROD" "$TELEGRAM_BOT_TOKEN_PROD"
          check_token "TELEGRAM_BOT_TOKEN_STAGING" "$TELEGRAM_BOT_TOKEN_STAGING"
          check_token "TELEGRAM_BOT_TOKEN_DEV" "$TELEGRAM_BOT_TOKEN_DEV"
          # Legacy fallback presence check
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN (legacy): PRESENT"
            echo "status=valid" >> "$GITHUB_OUTPUT"
          elif [ -n "$TELEGRAM_BOT_TOKEN_PROD" ]; then
            echo "status=valid" >> "$GITHUB_OUTPUT"
          else
            echo "status=missing" >> "$GITHUB_OUTPUT"
            echo "::error::Fix: gh secret set TELEGRAM_BOT_TOKEN_PROD --repo ${GH_ORG}/${REPO}"
          fi

      - name: Validate ANTHROPIC_API_KEY_SYSHEALTH
        id: anthropic
        env:
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY_SYSHEALTH }}
        run: |
          if [ -z "$ANTHROPIC_KEY" ]; then
            echo "status=missing" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY_SYSHEALTH: MISSING"
          else
            # Light validation: check key format (sk-ant-...)
            if echo "$ANTHROPIC_KEY" | grep -qE '^sk-ant-'; then
              echo "status=valid_format" >> "$GITHUB_OUTPUT"
              echo "ANTHROPIC_API_KEY_SYSHEALTH: VALID FORMAT (runtime check deferred to agent workflows)"
            else
              echo "status=unknown_format" >> "$GITHUB_OUTPUT"
              echo "ANTHROPIC_API_KEY_SYSHEALTH: PRESENT (format not recognized — may still be valid)"
            fi
          fi

      - name: Report summary
        env:
          GH_PAT_STATUS: ${{ steps.gh-pat.outputs.status }}
          TELEGRAM_STATUS: ${{ steps.telegram.outputs.status }}
          ANTHROPIC_STATUS: ${{ steps.anthropic.outputs.status }}
        run: |
          echo "=== Secret Health Check Summary ==="
          echo "GH_PAT: $GH_PAT_STATUS"
          echo "TELEGRAM_BOT_TOKEN: $TELEGRAM_STATUS"
          echo "ANTHROPIC_API_KEY_SYSHEALTH: $ANTHROPIC_STATUS"

          # Alert on any failures
          FAILURES=""
          [ "$GH_PAT_STATUS" = "invalid" ] || [ "$GH_PAT_STATUS" = "missing" ] && FAILURES="$FAILURES GH_PAT($GH_PAT_STATUS)"
          [ "$TELEGRAM_STATUS" = "invalid" ] || [ "$TELEGRAM_STATUS" = "missing" ] && FAILURES="$FAILURES TELEGRAM($TELEGRAM_STATUS)"
          [ "$ANTHROPIC_STATUS" = "missing" ] && FAILURES="$FAILURES ANTHROPIC($ANTHROPIC_STATUS)"

          if [ -n "$FAILURES" ]; then
            echo ""
            echo "FAILURES DETECTED:$FAILURES"
            # Telegram alert migrated to notify job
            exit 1
          fi

          echo ""
          echo "All secrets healthy."

  # ── TELEGRAM NOTIFY (reusable workflow) ──────────────────────────────────
  notify:
    name: Telegram — Secret Health Check
    needs: [check-secrets]
    if: always() && needs.check-secrets.result == 'failure'
    uses: ./.github/workflows/notify-telegram.yml
    with:
      message:
        "Secret Health Check Failed — one or more secrets are invalid or missing. See rotation guide:
        plans/ops/secret-rotation-plan.md"
      severity: "WARNING"
      conclusion: "failure"
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets: inherit

  persist:
    name: Persist — Secret Health Check Event
    needs: [check-secrets, notify]
    if: always()
    uses: ./.github/workflows/persist-cicd-event.yml
    secrets: inherit
    with:
      repo_name: unified-trading-pm
      workflow_name: ${{ github.workflow }}
      run_id: ${{ github.run_id }}
      conclusion: ${{ needs.check-secrets.result }}
      branch: ${{ github.ref_name }}
      commit_sha: ${{ github.sha }}
      details_json: '{"event": "secret-health-check"}'
