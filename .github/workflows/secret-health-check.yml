name: Secret Health Check

# Weekly validation that critical secrets are still functional.
# Does NOT expose secret values — only checks if they work.

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Validate GH_PAT
        id: gh-pat
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "status=missing" >> "$GITHUB_OUTPUT"
            echo "GH_PAT: MISSING (not set)"
          else
            USER=$(gh api user --jq '.login' 2>/dev/null || echo "")
            if [ -n "$USER" ]; then
              echo "status=valid" >> "$GITHUB_OUTPUT"
              echo "GH_PAT: VALID (authenticated as $USER)"
            else
              echo "status=invalid" >> "$GITHUB_OUTPUT"
              echo "GH_PAT: INVALID (authentication failed)"
            fi
          fi

      - name: Validate SLACK_CI_WEBHOOK_URL
        id: telegram
        env:
          SLACK_CI_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
        run: |
          # Validate the #ci-failures Slack incoming webhook (retired Telegram, operator-decided 2026-06-02)
          if [ -z "${SLACK_CI_WEBHOOK_URL:-}" ]; then
            echo "SLACK_CI_WEBHOOK_URL: MISSING"
            echo "status=missing" >> "$GITHUB_OUTPUT"
            echo "::error::Fix: gh secret set SLACK_CI_WEBHOOK_URL --repo <org>/<repo> with the #ci-failures incoming webhook URL"
          else
            case "${SLACK_CI_WEBHOOK_URL}" in
              https://*)
                HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${SLACK_CI_WEBHOOK_URL}" \
                  -H 'Content-Type: application/json' \
                  --data '{"text":"[secret-health-check probe — ignore]"}' 2>/dev/null || echo "000")
                if [ "$HTTP" = "200" ]; then
                  echo "SLACK_CI_WEBHOOK_URL: VALID"
                  echo "status=valid" >> "$GITHUB_OUTPUT"
                else
                  echo "SLACK_CI_WEBHOOK_URL: INVALID (HTTP $HTTP)"
                  echo "status=invalid" >> "$GITHUB_OUTPUT"
                fi ;;
              *)
                echo "SLACK_CI_WEBHOOK_URL: PRESENT but not an https URL"
                echo "status=invalid" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Validate ANTHROPIC_API_KEY_SYSHEALTH
        id: anthropic
        env:
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY_SYSHEALTH }}
        run: |
          if [ -z "$ANTHROPIC_KEY" ]; then
            echo "status=missing" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY_SYSHEALTH: MISSING"
          else
            # Light validation: check key format (sk-ant-...)
            if echo "$ANTHROPIC_KEY" | grep -qE '^sk-ant-'; then
              echo "status=valid_format" >> "$GITHUB_OUTPUT"
              echo "ANTHROPIC_API_KEY_SYSHEALTH: VALID FORMAT (runtime check deferred to agent workflows)"
            else
              echo "status=unknown_format" >> "$GITHUB_OUTPUT"
              echo "ANTHROPIC_API_KEY_SYSHEALTH: PRESENT (format not recognized — may still be valid)"
            fi
          fi

      - name: Report summary
        env:
          GH_PAT_STATUS: ${{ steps.gh-pat.outputs.status }}
          SLACK_STATUS: ${{ steps.telegram.outputs.status }}
          ANTHROPIC_STATUS: ${{ steps.anthropic.outputs.status }}
        run: |
          echo "=== Secret Health Check Summary ==="
          echo "GH_PAT: $GH_PAT_STATUS"
          echo "SLACK_CI_WEBHOOK_URL: $SLACK_STATUS"
          echo "ANTHROPIC_API_KEY_SYSHEALTH: $ANTHROPIC_STATUS"

          # Alert on any failures
          FAILURES=""
          [ "$GH_PAT_STATUS" = "invalid" ] || [ "$GH_PAT_STATUS" = "missing" ] && FAILURES="$FAILURES GH_PAT($GH_PAT_STATUS)"
          [ "$SLACK_STATUS" = "invalid" ] || [ "$SLACK_STATUS" = "missing" ] && FAILURES="$FAILURES SLACK_CI_WEBHOOK_URL($SLACK_STATUS)"
          [ "$ANTHROPIC_STATUS" = "missing" ] && FAILURES="$FAILURES ANTHROPIC($ANTHROPIC_STATUS)"

          if [ -n "$FAILURES" ]; then
            echo ""
            echo "FAILURES DETECTED:$FAILURES"
            # Telegram alert migrated to notify job
            exit 1
          fi

          echo ""
          echo "All secrets healthy."

  # ── SLACK NOTIFY (reusable workflow) ──────────────────────────────────
  notify:
    name: Slack — Secret Health Check
    needs: [check-secrets]
    if: always() && needs.check-secrets.result == 'failure'
    uses: ./.github/workflows/notify-slack.yml
    with:
      message:
        "Secret Health Check Failed — one or more secrets are invalid or missing. See rotation guide:
        plans/ops/secret-rotation-plan.md"
      severity: "WARNING"
      conclusion: "failure"
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}

  persist:
    name: Persist — Secret Health Check Event
    needs: [check-secrets, notify]
    if: always()
    uses: ./.github/workflows/persist-cicd-event.yml
    secrets: inherit
    with:
      repo_name: unified-trading-pm
      workflow_name: ${{ github.workflow }}
      run_id: ${{ github.run_id }}
      conclusion: ${{ needs.check-secrets.result }}
      branch: ${{ github.ref_name }}
      commit_sha: ${{ github.sha }}
      details_json: '{"event": "secret-health-check"}'
