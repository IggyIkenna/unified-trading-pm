name: staging-to-main

# Triggered by system-integration-tests dispatching 'staging-validated' after SIT passes.
# Merges staging → main in topological order for all repos that have staging changes,
# then clears staging_status.locked and promotes staging_versions → versions.
#
# Flow:
#   SIT passes → dispatches staging-validated → this workflow runs →
#   each repo: merge staging → main (via gh pr create --base main --head staging) →
#   PM manifest: staging_versions → versions, staging_status.locked = false →
#   PM commits manifest update [skip ci]
#
# Requires: GH_PAT with repo + workflow scope (to push to protected main branches).

on:
  repository_dispatch:
    types: [staging-validated]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual promotion (e.g. hotfix fast-track)"
        required: false
        default: "manual hotfix fast-track"
      start_from_repo:
        description: "Resume from this repo (skip repos before it in topo order). Leave empty for full run."
        required: false
        default: ""
      resume_from_repo:
        description: "Alias for start_from_repo — resume promotion from this repo, skipping already-promoted repos."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: manifest-update # unify-manifest-concurrency-groups: all manifest-mutating workflows share this group
  cancel-in-progress: false

jobs:
  promote-staging-to-main:
    runs-on: ubuntu-latest
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
      failed: ${{ steps.promote.outputs.failed }}
      promoted_count: ${{ steps.promote.outputs.promoted_count }}
      failed_count: ${{ steps.promote.outputs.failed_count }}
    steps:
      - name: Checkout PM
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      # codex/ is folded into PM at codex/ — no separate checkout needed; the
      # readiness gate below reads from PM's local codex/ directory.

      - name: Idempotency check — skip if staging already promoted (add-staging-to-main-idempotency)
        id: idempotency
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import json, sys

          with open("workspace-manifest.json") as f:
              manifest = json.load(f)

          staging_commits = {k: v for k, v in manifest.get("staging_commits", {}).items() if not k.startswith("_")}
          history = manifest.get("main_commits", {}).get("history", [])
          last_promoted = history[0].get("commits", {}) if history else {}

          if not staging_commits:
              print("No staging_commits recorded — nothing to promote, exiting early.")
              sys.exit(0)

          # Check if all staging commits are already in main_commits.history[0]
          already_promoted = all(
              last_promoted.get(repo) == sha
              for repo, sha in staging_commits.items()
          )
          if already_promoted:
              print("IDEMPOTENT: staging_commits already in main_commits.history[0] — skipping duplicate promotion.")
              sys.exit(0)

          print(f"Proceeding with promotion: {len(staging_commits)} repos in staging_commits")
          PYEOF
          echo "idempotent_skip=$?" >> "$GITHUB_OUTPUT"

      - name: Readiness gate — block if any promoted repo has explicit fail
        # Blocks promotion only on EXPLICIT fail status in codex readiness YAML.
        # not_assessed = advisory (promotion proceeds). fail = hard block.
        # Gate checks: cr4_quality_gate and dr4_sit_pass sections.
        run: |
          python3 - <<'PYEOF'
          import json
          import pathlib
          import sys

          with open("workspace-manifest.json") as f:
              manifest = json.load(f)

          staging = manifest.get("staging_versions", {})
          stable = manifest.get("versions", {})

          # Repos being promoted in this run
          promoting = [
              r for r, sv in staging.items()
              if not r.startswith("_") and sv != stable.get(r)
          ]

          codex = pathlib.Path("codex/10-audit/repos")
          blocked: list[str] = []
          warnings: list[str] = []

          # Minimal line-by-line gate: no yaml dep required
          GATE_SECTIONS = {"cr4_quality_gate", "dr4_sit_pass"}

          for repo in promoting:
              yaml_file = codex / f"{repo}.yaml"
              if not yaml_file.exists():
                  warnings.append(f"  WARN {repo}: no codex YAML — gate skipped")
                  continue

              lines = yaml_file.read_text().splitlines()
              active_section: str | None = None

              for line in lines:
                  stripped = line.strip()
                  # Detect entry into a gate section
                  for section in GATE_SECTIONS:
                      if stripped.startswith(f"{section}:"):
                          active_section = section
                          break
                  # If we're in a gate section, look for explicit fail
                  if active_section and stripped.startswith("status:"):
                      val = stripped.split(":", 1)[1].strip().strip("\"'")
                      if val == "fail":
                          blocked.append(f"  BLOCK {repo}: {active_section}=fail")
                      active_section = None  # only check first status line per section

          print("=== Readiness Gate ===")
          print(f"Repos being promoted: {len(promoting)}")
          for r in promoting:
              print(f"  {r}")
          print()

          if warnings:
              for w in warnings:
                  print(w)
              print()

          if blocked:
              print("BLOCKED — explicit readiness failures (fix in codex/10-audit/repos/{{repo}}.yaml):")
              for b in blocked:
                  print(b)
              print()
              print("To override: set cr4_quality_gate.status or dr4_sit_pass.status to 'partial' or 'not_assessed'.")
              sys.exit(1)

          print("OK: No explicit readiness failures. Promotion proceeding.")
          PYEOF

      - name: SHA verification — ensure staging HEADs match tested SHA set (fix-sha-pinning-toctou)
        # Guards against [skip ci] or other commits landing in staging AFTER the debounce
        # but BEFORE staging-validated was dispatched. Such commits would be promoted untested.
        # Only [skip ci] descendants are allowed; non-skip-ci untested commits trigger SIT re-run.
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          python3 - <<'PYEOF'
          import json
          import os
          import subprocess
          import sys

          with open("workspace-manifest.json") as f:
              manifest = json.load(f)

          staging_commits = manifest.get("staging_commits", {})
          staging_versions = manifest.get("staging_versions", {})
          owner = os.environ["OWNER"]

          def get_staging_head(repo: str) -> str:
              result = subprocess.run(
                  ["gh", "api", f"repos/{owner}/{repo}/git/ref/heads/staging", "--jq", ".object.sha"],
                  capture_output=True, text=True
              )
              return result.stdout.strip() if result.returncode == 0 else ""

          def get_commit_messages_between(repo: str, base_sha: str, head_sha: str) -> list[str]:
              if base_sha == head_sha:
                  return []
              result = subprocess.run(
                  ["gh", "api",
                   f"repos/{owner}/{repo}/compare/{base_sha}...{head_sha}",
                   "--jq", ".commits[].commit.message"],
                  capture_output=True, text=True
              )
              if result.returncode != 0:
                  return []
              return [line.strip() for line in result.stdout.strip().splitlines() if line.strip()]

          blocked: list[str] = []
          for repo, tested_sha in staging_commits.items():
              if repo.startswith("_") or not tested_sha:
                  continue
              if repo not in staging_versions:
                  continue

              current_sha = get_staging_head(repo)
              if not current_sha:
                  print(f"  WARN {repo}: staging branch not found — skipping SHA check")
                  continue

              if current_sha == tested_sha:
                  print(f"  OK   {repo}: SHA matches ({current_sha[:8]})")
                  continue

              msgs = get_commit_messages_between(repo, tested_sha, current_sha)
              non_skip = [m for m in msgs if "[skip ci]" not in m]
              if not non_skip:
                  print(f"  SAFE {repo}: {len(msgs)} [skip ci]-only commit(s) since tested SHA — safe to promote")
              else:
                  print(f"  FAIL {repo}: {len(non_skip)} UNTESTED non-[skip ci] commit(s):")
                  for m in non_skip[:3]:
                      print(f"       {m[:80]}")
                  blocked.append(repo)

          if blocked:
              print(f"\nSHA PINNING VIOLATION: repos with untested commits: {blocked}")
              print("Exiting 1 — will re-trigger SIT in next step.")
              sys.exit(1)

          print("\nSHA pinning: all staging HEADs are within tested set or [skip ci]-only descendants.")
          PYEOF

      - name: Re-trigger SIT if SHA verification failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Telegram alert migrated to notify-sha-failure job
          OWNER="${{ github.repository_owner }}"
          echo "SHA pinning violation — re-triggering SIT for untested staging commits."
          curl -s -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER}/system-integration-tests/dispatches" \
            -d '{"event_type": "staging-changed", "client_payload": {"reason": "sha-pinning-retest"}}' \
            || true

      # ─────────────────────────────────────────────────────────────────────────
      # STAGE 1.8: DEP-ORDER GATE (staging → main)
      # Complement to quickmerge.sh STAGE 1.7 (LDR→staging dep-order gate).
      # Prevents the UTL-before-UAC main race: before promoting repo X to main,
      # every dep D must already be on main (ci_status = MAIN_GREEN or SIT_VALIDATED).
      #
      # ci_status on-main signal: python-quality-gates-v2.yml emits MAIN_GREEN when
      # a QG push run passes on the `main` branch (landed with this commit).
      # SIT_VALIDATED is also accepted as "dep is on main" because the promotion
      # lifecycle resets ci_status from SIT_VALIDATED→FEATURE_GREEN only AFTER the
      # dep is already merged to main — so SIT_VALIDATED is always a valid on-main
      # signal during the promotion window.
      #
      # Safe-defaults (match STAGE 1.7 from quickmerge.sh):
      #   - manifest file missing       → PASS  (no gate data available)
      #   - repo not in manifest        → PASS  (repo has no recorded deps)
      #   - dep not in manifest         → PASS  (dep not tracked; can't assert)
      #   - dep ci_status unset/None    → PASS  (not configured, treat as external)
      # A gate error (e.g. Python crash) logs a warning and does NOT block the
      # promotion — consistent with how the existing readiness gate treats missing
      # codex YAML (advisory-only).
      # ─────────────────────────────────────────────────────────────────────────
      - name: STAGE 1.8 — Dep-order gate (staging → main)
        run: |
          set -euo pipefail

          python3 - <<'PYEOF'
          import json
          import sys

          MANIFEST = "workspace-manifest.json"

          # Statuses that mean dep IS on main (PASS)
          ON_MAIN_STATUSES = {"MAIN_GREEN", "SIT_VALIDATED"}

          try:
              with open(MANIFEST) as f:
                  manifest = json.load(f)
          except Exception as e:
              print(f"STAGE 1.8: manifest read error ({e}) — gate skipped (safe-default: pass)")
              sys.exit(0)

          staging_versions = manifest.get("staging_versions", {})
          stable_versions = manifest.get("versions", {})
          repos_data = manifest.get("repositories", {})

          # Collect repos being promoted in this run (staging_versions differs from stable)
          promoting = [
              r for r, sv in staging_versions.items()
              if not r.startswith("_") and sv != stable_versions.get(r)
          ]

          if not promoting:
              print("STAGE 1.8: no repos being promoted — gate skipped")
              sys.exit(0)

          print(f"STAGE 1.8: Dep-Order Gate (staging → main)")
          print(f"  Checking {len(promoting)} repo(s) for dep-on-main readiness")

          blocked_pairs: list[str] = []

          for repo in promoting:
              repo_info = repos_data.get(repo)
              if repo_info is None:
                  print(f"  PASS (no manifest entry): {repo}")
                  continue

              deps = repo_info.get("dependencies", [])
              if not deps:
                  print(f"  PASS (no deps): {repo}")
                  continue

              repo_blocked: list[str] = []
              for dep in deps:
                  dep_name = dep.get("name", dep) if isinstance(dep, dict) else str(dep)
                  if not dep_name or dep_name not in repos_data:
                      # Dep not in manifest → safe-default pass
                      continue
                  dep_status = repos_data[dep_name].get("ci_status") or ""
                  if not dep_status:
                      # ci_status not set → safe-default pass (treat as external / not tracked)
                      continue
                  if dep_status not in ON_MAIN_STATUSES:
                      repo_blocked.append(f"{dep_name}:{dep_status}")

              if repo_blocked:
                  for entry in repo_blocked:
                      dep_name_only = entry.split(":")[0]
                      dep_status_only = entry.split(":")[1]
                      print(f"  ❌ DEP-ORDER BLOCK: {repo} → dep {dep_name_only} is {dep_status_only} (not yet on main).")
                      print(f"     Fix: promote {dep_name_only} to main first, wait for its QG-on-main to emit MAIN_GREEN,")
                      print(f"          then re-trigger SIT / staging-validated to promote {repo}.")
                      blocked_pairs.append(entry)
              else:
                  print(f"  ✅ PASS: {repo} — all deps on main")

          if blocked_pairs:
              print()
              print("══════════════════════════════════════════════════════════════")
              print("❌ STAGE 1.8 DEP-ORDER GATE BLOCKED staging→main promotion.")
              print(f"   {len(blocked_pairs)} dep(s) are NOT yet on main.")
              print("   ci_status lifecycle: FEATURE_GREEN → STAGING_GREEN → SIT_VALIDATED → MAIN_GREEN")
              print("   Required for staging→main: MAIN_GREEN or SIT_VALIDATED")
              print("══════════════════════════════════════════════════════════════")
              sys.exit(1)

          print()
          print("STAGE 1.8: ✅ All promoted repos have deps on main — dep-order safe")
          PYEOF

      - name: Merge staging → main for all repos with staging changes
        id: promote
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          START_FROM_REPO: ${{ inputs.resume_from_repo || inputs.start_from_repo || '' }}
        run: |
          set -euo pipefail

          OWNER="${{ github.repository_owner }}"
          MANIFEST="workspace-manifest.json"

          # Get topological order (all tiers, T0 first)
          REPOS=$(python3 - <<PYEOF
          import json
          with open("${MANIFEST}") as f:
              m = json.load(f)

          staging_versions = m.get("staging_versions", {})
          stable_versions = m.get("versions", {})
          topo = m.get("topologicalOrder", {}).get("levels", [])

          # Collect repos where staging_versions differs from versions
          changed = set()
          for repo, sv in staging_versions.items():
              if repo.startswith("_"):
                  continue
              if sv != stable_versions.get(repo):
                  changed.add(repo)

          # Emit in topological order
          for level in topo:
              for repo in level.get("repos", []):
                  if repo in changed:
                      print(repo)
          PYEOF
          )

          if [ -z "$REPOS" ]; then
            echo "No repos with staging changes found. staging_status may already be clear."
            exit 0
          fi

          echo "Repos to promote (staging → main):"
          echo "$REPOS" | while read -r r; do echo "  $r"; done

          # Resume support: skip repos before start_from_repo
          SKIP_MODE="false"
          if [ -n "$START_FROM_REPO" ]; then
            SKIP_MODE="true"
            echo ""
            echo "RESUME MODE: skipping repos before '$START_FROM_REPO'"
          fi

          PROMOTED=""
          FAILED=""
          SKIPPED=""
          TOTAL_COUNT=0
          PROMOTED_COUNT=0
          FAILED_COUNT=0

          while IFS= read -r REPO; do
            [ -z "$REPO" ] && continue
            TOTAL_COUNT=$((TOTAL_COUNT + 1))

            # Resume: skip until we reach start_from_repo
            if [ "$SKIP_MODE" = "true" ]; then
              if [ "$REPO" = "$START_FROM_REPO" ]; then
                SKIP_MODE="false"
                echo "  Resuming from $REPO"
              else
                echo "  SKIP (resume): $REPO"
                SKIPPED="$SKIPPED $REPO"
                continue
              fi
            fi

            echo ""
            echo "=== Promoting $REPO ($((PROMOTED_COUNT + FAILED_COUNT + 1))/$TOTAL_COUNT) ==="

            # Check if staging branch exists
            STAGING_EXISTS=$(gh api "repos/$OWNER/$REPO/branches/staging" --jq '.name' 2>/dev/null || true)
            if [ -z "$STAGING_EXISTS" ]; then
              echo "  SKIP: staging branch not found in $REPO"
              continue
            fi

            # Check if main and staging differ
            COMPARE=$(gh api "repos/$OWNER/$REPO/compare/main...staging" --jq '.ahead_by' 2>/dev/null || echo "0")
            if [ "$COMPARE" = "0" ]; then
              echo "  SKIP: staging is already merged to main in $REPO (ahead_by=0)"
              PROMOTED="$PROMOTED $REPO"
              PROMOTED_COUNT=$((PROMOTED_COUNT + 1))
              continue
            fi

            # Create PR staging → main and auto-merge
            BODY="Automated: SIT validated staging. Promoting staging → main. Triggered by: staging-validated dispatch from system-integration-tests. Staging lock will be cleared after all repos are promoted."
            PR_URL=$(gh pr create \
              --repo "$OWNER/$REPO" \
              --title "chore(release): promote staging to main" \
              --body "$BODY" \
              --base main \
              --head staging \
              2>/dev/null || true)

            if [ -n "$PR_URL" ]; then
              echo "  PR created: $PR_URL"
              # Enable auto-merge (requires branch protection to be configured)
              gh pr merge "$PR_URL" --auto --merge --repo "$OWNER/$REPO" 2>/dev/null || \
                echo "  WARNING: auto-merge not available for $REPO — merge PR manually: $PR_URL"
              PROMOTED="$PROMOTED $REPO"
              PROMOTED_COUNT=$((PROMOTED_COUNT + 1))
            else
              echo "  PR already exists or merge conflict — checking mergeable state..."
              FAILED="$FAILED $REPO"
              FAILED_COUNT=$((FAILED_COUNT + 1))

              # Check if an existing staging→main PR is blocked by a content conflict
              EXISTING_PR_NUM=$(gh pr list \
                --repo "$OWNER/$REPO" \
                --base main \
                --head staging \
                --state open \
                --json number \
                --jq '.[0].number' 2>/dev/null || echo "")

              if [ -n "$EXISTING_PR_NUM" ] && [ "$EXISTING_PR_NUM" != "null" ]; then
                # Poll for mergeable_state (GitHub computes it asynchronously — may be null briefly)
                MERGEABLE_STATE=""
                for _i in 1 2 3; do
                  MERGEABLE_STATE=$(gh api "repos/$OWNER/$REPO/pulls/$EXISTING_PR_NUM" \
                    --jq '.mergeable_state' 2>/dev/null || echo "")
                  [ "$MERGEABLE_STATE" != "null" ] && [ -n "$MERGEABLE_STATE" ] && break
                  sleep 5
                done

                if [ "$MERGEABLE_STATE" = "dirty" ]; then
                  # "dirty" = content conflict in GitHub REST API
                  PR_URL_CONFLICT="https://github.com/$OWNER/$REPO/pull/$EXISTING_PR_NUM"
                  echo "  CONFLICT detected on PR #$EXISTING_PR_NUM ($PR_URL_CONFLICT)"

                  # NOTE: Telegram notification handled by conflict-resolution-agent's
                  # notify-working job (reusable workflow). No inline curl needed here.

                  # Dispatch conflict-resolution-agent
                  curl -s -X POST \
                    "https://api.github.com/repos/$OWNER/unified-trading-pm/dispatches" \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    -H "Content-Type: application/json" \
                    -d "{\"event_type\":\"merge-conflict-detected\",\"client_payload\":{\"repo_name\":\"${REPO}\",\"source_branch\":\"staging\",\"target_branch\":\"main\",\"original_pr_url\":\"${PR_URL_CONFLICT}\"}}" \
                    && echo "  Dispatched conflict-resolution-agent for $REPO" \
                    || echo "  WARNING: Failed to dispatch conflict-resolution-agent for $REPO"
                else
                  echo "  PR #$EXISTING_PR_NUM mergeable_state=$MERGEABLE_STATE (not a conflict)"
                fi
              else
                echo "  No open staging→main PR found for $REPO (PR creation may have failed for another reason)"
              fi

              # NOTE: Partial failure Telegram notification handled by
              # notify-partial-failure job (reusable workflow). No inline curl needed here.
            fi

          done <<< "$REPOS"

          # Write promotion progress to outputs for downstream steps
          echo "promoted=$PROMOTED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "promoted_count=$PROMOTED_COUNT" >> "$GITHUB_OUTPUT"
          echo "failed_count=$FAILED_COUNT" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=== Promotion Summary ==="
          echo "Promoted ($PROMOTED_COUNT):$PROMOTED"
          echo "Failed ($FAILED_COUNT):$FAILED"
          if [ -n "$SKIPPED" ]; then
            echo "Skipped (resume):$SKIPPED"
          fi

          if [ -n "$FAILED" ]; then
            echo ""
            echo "WARNING: Failed to create PRs for:$FAILED"
            echo "These repos may need manual merge conflict resolution."
            echo "To resume: re-run with start_from_repo set to the first failed repo."
          fi

      - name: Record promotion progress in manifest
        if: always()
        env:
          PROMOTED: ${{ steps.promote.outputs.promoted }}
          FAILED: ${{ steps.promote.outputs.failed }}
        run: |
          set -euo pipefail

          python3 - <<'PYEOF'
          import json, datetime, os

          promoted_str = os.environ.get("PROMOTED", "").strip()
          failed_str = os.environ.get("FAILED", "").strip()

          promoted_list = [r for r in promoted_str.split() if r]
          failed_list = [r for r in failed_str.split() if r]

          with open("workspace-manifest.json") as f:
              manifest = json.load(f)

          # Record promotion progress under staging_status so a resume run
          # can read which repos have already been promoted
          if "staging_status" not in manifest:
              manifest["staging_status"] = {}

          manifest["staging_status"]["promoted_repos"] = promoted_list
          manifest["staging_status"]["failed_repos"] = failed_list
          manifest["staging_status"]["promotion_updated_at"] = datetime.datetime.utcnow().isoformat() + "Z"

          with open("workspace-manifest.json", "w") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print(f"Recorded promotion progress: {len(promoted_list)} promoted, {len(failed_list)} failed")
          PYEOF

      # Partial promotion failure Telegram alert migrated to notify-partial-failure job

      - name: Promote staging_versions → versions, clear staging lock
        run: |
          set -euo pipefail

          python3 - <<PYEOF
          import json, datetime, os

          with open("workspace-manifest.json") as f:
              manifest = json.load(f)

          staging_versions = manifest.get("staging_versions", {})
          stable_versions = manifest.get("versions", {})

          # Capture old→new version pairs BEFORE clearing staging_versions
          # so the cascade step can compute bump_type correctly.
          promoted_map = {}
          for repo, new_version in staging_versions.items():
              if repo.startswith("_"):
                  continue
              old_version = stable_versions.get(repo, "0.0.0")
              promoted_map[repo] = {"old": old_version, "new": new_version}

          # Write to GITHUB_ENV for the cascade step (JSON, single line)
          github_env = os.environ.get("GITHUB_ENV", "")
          if github_env:
              import json as _json
              with open(github_env, "a") as ef:
                  ef.write("PROMOTED_JSON<<PROMOTED_EOF\n")
                  ef.write(_json.dumps(promoted_map))
                  ef.write("\nPROMOTED_EOF\n")

          # Promote each staging version to the stable versions map
          promoted = []
          for repo, version in staging_versions.items():
              if repo.startswith("_"):
                  continue
              manifest["versions"][repo] = version
              promoted.append(f"  {repo}={version}")

          # Append current staging_commits to main_commits.history (keep last 5 entries)
          staging_commits = manifest.get("staging_commits", {})
          entry = {
              "promoted_at": datetime.datetime.utcnow().isoformat() + "Z",
              "commits": {k: v for k, v in staging_commits.items() if not k.startswith("_")}
          }
          if "main_commits" not in manifest:
              manifest["main_commits"] = {"history": []}
          history = manifest["main_commits"].get("history", [])
          history.insert(0, entry)
          if len(history) > 5:
              history = history[:5]
          manifest["main_commits"]["history"] = history

          # Clear staging_versions (keep the _note)
          note = staging_versions.get("_note", "")
          manifest["staging_versions"] = {"_note": note}

          # Clear staging_commits (keep the _note if present)
          staging_commits_note = staging_commits.get("_note", "")
          manifest["staging_commits"] = {"_note": staging_commits_note} if staging_commits_note else {}

          # Reset ci_status for promoted repos: SIT_VALIDATED → FEATURE_GREEN
          # (main is the new baseline; staging status no longer applies)
          repos_data = manifest.get("repositories", {})
          for repo in promoted:
              repo_name = repo.strip().split("=")[0]  # promoted list has "repo=version" format
              if repo_name in repos_data:
                  old_ci = repos_data[repo_name].get("ci_status", "")
                  if old_ci in ("SIT_VALIDATED", "STAGING_GREEN"):
                      repos_data[repo_name]["ci_status"] = "FEATURE_GREEN"
                      print(f"  ci_status reset: {repo_name} {old_ci} → FEATURE_GREEN")

          # Clear staging lock (guard against missing field)
          if "staging_status" not in manifest:
              manifest["staging_status"] = {"locked": False, "locked_since": None, "locked_reason": None, "lock_version": None}
          manifest["staging_status"]["locked"] = False
          manifest["staging_status"]["locked_since"] = None
          manifest["staging_status"]["locked_reason"] = None
          manifest["staging_status"]["lock_version"] = None
          # Clear promotion progress tracking (full promotion complete)
          manifest["staging_status"].pop("promoted_repos", None)
          manifest["staging_status"].pop("failed_repos", None)
          manifest["staging_status"].pop("promotion_updated_at", None)

          tmp_path = "workspace-manifest.json.tmp"
          with open(tmp_path, "w") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
              f.write("\n")
          import os as _os
          _os.replace(tmp_path, "workspace-manifest.json")

          print(f"Promoted {len(promoted)} repos to stable versions:")
          for p in promoted:
              print(p)
          print(f"Appended staging_commits to main_commits.history (history length: {len(history)})")
          print("staging_status.locked = false")
          PYEOF
          python3 -c "import json; d=json.load(open('workspace-manifest.json')); assert 'versions' in d, 'FATAL: manifest missing versions key'" \
            || { git checkout -- workspace-manifest.json; echo "FATAL: manifest corruption detected — reverted"; exit 1; }

      - name: Commit manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet workspace-manifest.json; then
            echo "No manifest changes. Nothing to commit."
            exit 0
          fi

          git add workspace-manifest.json
          git commit -m "chore(manifest): promote staging_versions → versions, clear staging lock [skip ci]"

          # Retry-with-rebase: a concurrent sit-gate/sit-unlock manifest commit can land on main
          # between our checkout and push. A bare `git push` then fails non-fast-forward and the
          # promotion's manifest update (versions + lock clear) never lands. Rebase + retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed manifest update (attempt ${attempt})."
              break
            fi
            echo "Push rejected (attempt ${attempt}); rebasing onto origin/main and retrying."
            git pull --rebase --autostash origin main
            if [ "${attempt}" = "5" ]; then
              echo "FATAL: could not push manifest update after 5 attempts."
              exit 1
            fi
          done

      - name: Dispatch dependency-update cascade for promoted repos
        # Fires dependency-update events to all direct downstream dependents of each promoted repo.
        # version-bump.yml on each repo skips staging→main merge commits (chore(release): prefix),
        # so this step ensures the cascade fires even when version-bump.yml cannot detect the bump.
        # bump_type is computed from the old stable version vs new promoted version (not always patch).
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          # Exported into the env so the python heredoc below can read os.environ["OWNER"/"TOKEN"];
          # plain shell vars are NOT inherited by the heredoc → previously KeyError: 'OWNER' on
          # every promotion (cicd P1 #257 — surfaced by the GH013-fix e2e).
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          if [ -z "${TOKEN:-}" ]; then
            echo "GH_PAT not set — skipping cascade dispatch."
            exit 0
          fi

          if [ -z "${PROMOTED_JSON:-}" ] || [ "${PROMOTED_JSON}" = "{}" ]; then
            echo "PROMOTED_JSON empty (nothing was promoted or no staging_versions existed). Skipping cascade."
            exit 0
          fi

          python3 - <<'PYEOF'
          import json, os, subprocess, sys

          promoted = json.loads(os.environ["PROMOTED_JSON"])
          owner = os.environ["OWNER"]
          token = os.environ["TOKEN"]

          with open("workspace-manifest.json") as f:
              manifest = json.load(f)

          repos_data = manifest.get("repositories", {})

          def compute_bump_type(old: str, new: str) -> str:
              try:
                  om, omin, op = (int(x) for x in old.split("."))
                  nm, nmin, np = (int(x) for x in new.split("."))
              except ValueError:
                  return "patch"
              if nm > om:
                  return "major"
              if nmin > omin:
                  return "minor"
              return "patch"

          def find_dependents(repo_name: str) -> list[str]:
              deps = []
              for name, data in repos_data.items():
                  for dep in data.get("dependencies", []):
                      dep_name = dep.get("name") if isinstance(dep, dict) else dep
                      if dep_name == repo_name:
                          deps.append(name)
              return deps

          dispatched_total = 0
          failed_total = 0

          for repo, info in promoted.items():
              old_v = info.get("old") or "0.0.0"
              new_v = info["new"]
              bump_type = compute_bump_type(old_v, new_v)

              parts = new_v.split(".")
              major = int(parts[0])
              minor = int(parts[1])
              constraint = f">={major}.{minor}.0,<{major+1}.0.0"

              dependents = find_dependents(repo)
              if not dependents:
                  print(f"  {repo} {old_v}→{new_v} ({bump_type}): no dependents")
                  continue

              print(f"  {repo} {old_v}→{new_v} ({bump_type}): cascading to {len(dependents)} dependent(s)")

              for dep_repo in dependents:
                  payload = json.dumps({
                      "event_type": "dependency-update",
                      "client_payload": {
                          "dep_name": repo,
                          "dep_version": new_v,
                          "constraint": constraint,
                          "bump_type": bump_type,
                      }
                  })
                  result = subprocess.run(
                      ["curl", "-s", "-o", "/dev/null", "-w", "%{http_code}",
                       "-X", "POST",
                       "-H", f"Authorization: Bearer {token}",
                       "-H", "Accept: application/vnd.github+json",
                       f"https://api.github.com/repos/{owner}/{dep_repo}/dispatches",
                       "-d", payload],
                      capture_output=True, text=True
                  )
                  http_status = result.stdout.strip()
                  if http_status == "204":
                      print(f"    ✅ {dep_repo}")
                      dispatched_total += 1
                  else:
                      print(f"    ⚠️  {dep_repo} HTTP {http_status}")
                      failed_total += 1

          print(f"\nCascade complete: {dispatched_total} dispatched, {failed_total} failed")
          if failed_total > 0:
              sys.exit(1)
          PYEOF

      - name: Dispatch staging-unlocked to all repos (re-runs Staging Lock Check on open PRs)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          OWNER="IggyIkenna"
          REPOS=$(python3 -c "import json; m=json.load(open('workspace-manifest.json')); print('\n'.join(m.get('repositories',{}).keys()))")
          FAILED=""
          while IFS= read -r REPO; do
            [ -z "$REPO" ] && continue
            gh api "repos/$OWNER/$REPO/dispatches" \
              -X POST \
              -f event_type="staging-unlocked" \
              2>/dev/null || FAILED="$FAILED $REPO"
          done <<< "$REPOS"
          if [ -n "$FAILED" ]; then
            echo "WARNING: Failed to dispatch to:$FAILED (repos may not exist or be archived)"
          fi
          echo "Dispatched staging-unlocked to all repos"

  # ── TELEGRAM NOTIFICATIONS (reusable workflow) ───────────────────────────

  notify-partial-failure:
    name: Slack — Partial Promotion Failure
    needs: [promote-staging-to-main]
    if:
      always() && needs.promote-staging-to-main.outputs.failed_count != '0' &&
      needs.promote-staging-to-main.outputs.failed_count != ''
    uses: ./.github/workflows/notify-slack.yml
    with:
      message:
        "Partial Staging Promotion Failure | Promoted: ${{ needs.promote-staging-to-main.outputs.promoted_count }} |
        Failed: ${{ needs.promote-staging-to-main.outputs.failed_count }} | Failed repos: ${{
        needs.promote-staging-to-main.outputs.failed }}"
      severity: "CRITICAL"
      conclusion: "failure"
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets: inherit

  notify-promotion-complete:
    name: Slack — Staging Promotion
    needs: [promote-staging-to-main]
    if:
      always() && (needs.promote-staging-to-main.outputs.failed_count == '0' ||
      needs.promote-staging-to-main.outputs.failed_count == '')
    uses: ./.github/workflows/notify-slack.yml
    with:
      message: "Staging → main promotion complete"
      severity: "INFO"
      conclusion: ${{ needs.promote-staging-to-main.result }}
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets: inherit

  persist:
    name: Persist — Staging Promotion Event
    needs: [promote-staging-to-main, notify-partial-failure, notify-promotion-complete]
    if: always()
    uses: ./.github/workflows/persist-cicd-event.yml
    secrets: inherit
    with:
      repo_name: unified-trading-pm
      workflow_name: ${{ github.workflow }}
      run_id: ${{ github.run_id }}
      conclusion: ${{ needs.promote-staging-to-main.result }}
      branch: ${{ github.ref_name }}
      commit_sha: ${{ github.sha }}
      details_json:
        '{"promoted": "${{ needs.promote-staging-to-main.outputs.promoted_count }}", "failed": "${{
        needs.promote-staging-to-main.outputs.failed_count }}"}'
