name: glue-runner-health-monitor

# Runner-health monitor for the self-hosted `glue` pool — pages when fewer than `min_online`
# `glue`-labelled runners are `online`.
#
# Incident (2026-08-06, issues/fleet_promoter_glue_runner_stall_2026_08_06.md): the LDR→main fleet
# promoter stalled 3+ hours because the `glue` pool ran at 25% capacity (2 of 4 runners online, one
# busy) — every `*/5` schedule event queued a run that cancelled its queued predecessor before any
# runner picked it up, so ZERO promotions completed. The sibling glue-pool-starvation-monitor
# catches "glue jobs queued, nothing in progress"; this monitor closes the DEPLETED-pool gap at the
# cheapest honest signal: count the `glue`-labelled runners actually `online` right now. The check
# script is FAIL-CLOSED — if it cannot query the runner API (permission/network), it pages too,
# because a monitor that goes dark is the original incident class.
#
# MUST run on a GitHub-hosted runner, never `glue` itself — see
# scripts/self-hosted-runners/classify-glue-workflows.sh KEEP_MONITORS: a dead-man-switch that ran
# on the pool it watches would go dark exactly when it is needed.
#
# SSOT: codex/04-architecture/ci-alerting.md (notify-slack.yml dedup contract).
# Source: issues/fleet_promoter_glue_runner_stall_2026_08_06.md
#         ([INFRA] P1 "Add a runner-health monitor for the glue pool: alert when fewer than N
#          runners are online")

on:
  # SCHEDULE DISABLED 2026-08-07: the `glue` self-hosted pool this monitor watches was permanently
  # deregistered fleet-wide (plans/active/self_hosted_runner_public_repo_revert_2026_08_05.md, todo
  # #21, DONE — self-hosted runners retired for security reasons once these repos went public;
  # nothing is ever coming back online for this pool). With the pool gone by design, "0 online"
  # isn't a depleted-pool incident anymore, it's the permanent, correct end state — the fail-closed
  # `min_online` check paged CRITICAL every hour, forever, on a condition that will never resolve.
  # Re-enable the schedule only if the glue pool is ever deliberately re-established.
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      min_online:
        description: "Minimum online glue runners before paging"
        default: "3"

permissions:
  contents: read
  actions: read

concurrency:
  group: glue-runner-health-monitor
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      low: ${{ steps.scan.outputs.low }}
      report: ${{ steps.scan.outputs.report }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Count online glue runners
        id: scan
        env:
          # NOT secrets.GITHUB_TOKEN: `GET /repos/{owner}/{repo}/actions/runners` requires the
          # `administration` permission, which is NOT one of the grantable keys in a workflow's
          # `permissions:` block for the automatic token (confirmed against GitHub's workflow-syntax
          # docs — actions/attestations/checks/contents/deployments/discussions/id-token/issues/
          # packages/pages/pull-requests/security-events/statuses only) — so `actions: read` can
          # never satisfy this endpoint no matter how the block is tuned, and every run 403s
          # (root-caused 2026-08-07: 13/13 sampled runs failed the query 100% of the time; it only
          # LOOKED intermittent because `set +e` keeps the job green regardless of the script's exit
          # code, and notify-slack's 60-min dedup cooldown means the same standing failure only pages
          # once an hour). GH_PAT is the same fine-grained PAT already used to REGISTER the glue pool
          # (setup-glue-runners.sh / refresh-gh-token.sh, which need Administration:write — a
          # superset of the Administration:read this call needs) and the same repo's existing
          # pattern for anything GITHUB_TOKEN structurally can't reach (ci-status-update.yml,
          # escalate-to-orchestrator.yml).
          GH_TOKEN: ${{ secrets.GH_PAT }}
          MIN_ONLINE: ${{ github.event.inputs.min_online || '3' }}
        run: |
          set +e
          REPORT=$(python3 scripts/cicd/glue_runner_health_monitor.py \
            --repo "${{ github.repository }}" --min-online "$MIN_ONLINE" --slack)
          RC=$?
          echo "$REPORT"
          # RC 1 = depleted pool OR monitor-query failure (both page — fail-closed); RC 0 = healthy.
          [ "$RC" -eq 0 ] && LOW=false || LOW=true
          {
            echo "low=$LOW"
            echo "report<<__EOR__"
            echo "$REPORT"
            echo "__EOR__"
          } >> "$GITHUB_OUTPUT"

  notify:
    needs: check
    if: needs.check.outputs.low == 'true'
    uses: ./.github/workflows/notify-slack.yml
    with:
      message: ${{ needs.check.outputs.report }}
      severity: CRITICAL
      workflow_name: glue-runner-health-monitor
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Standing condition (the pool stays depleted tick-to-tick until fixed) — page on the
      # false->true transition, re-remind every hour while it persists. Distinct key from
      # glue-pool-starved / promotion-lag / promote-fleet-startup-failure so the independent
      # conditions never share a cooldown.
      dedup_key: glue-runner-pool-low
      cooldown_min: 60
    secrets: inherit
