name: version-bump

# Run only AFTER quality-gates passes on main. This ensures version-bump
# never runs when quality-gates fails — the merge is already on main,
# but we gate the bump on CI success.
on:
  workflow_run:
    workflows: [quality-gates]
    types: [completed]
    branches: [main, staging]

permissions:
  contents: write

jobs:
  version-bump:
    runs-on: ubuntu-latest
    # DISABLED: semver-agent.yml is the sole owner of version bumping (Claude-Haiku decides
    # patch/minor/major from commit message + API diff). version-bump.yml is kept for reference
    # but must not run alongside semver-agent.yml to avoid race conditions on pyproject.toml.
    # To re-enable: remove `if: false` and restore the original condition below.
    if: false
    # Original condition (preserved for reference):
    # if: |
    #   github.event.workflow_run.conclusion == 'success' &&
    #   (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'staging') &&
    #   !contains(github.event.workflow_run.head_commit.message, '[skip ci]')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Parse commit and bump version
        run: |
          set -euo pipefail

          COMMIT_MSG="${{ github.event.workflow_run.head_commit.message }}"
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -n1)

          BUMP=""
          if echo "$COMMIT_MSG" | grep -q "BREAKING CHANGE:"; then
            BUMP="major"
          elif echo "$FIRST_LINE" | grep -qE "^[a-z]+!(\(.+\))?:"; then
            BUMP="major"
          elif echo "$FIRST_LINE" | grep -qE "^feat(\(.+\))?:"; then
            BUMP="minor"
          elif echo "$FIRST_LINE" | grep -qE "^fix(\(.+\))?:"; then
            BUMP="patch"
          fi

          if [ -z "$BUMP" ]; then
            echo "No version-bump prefix found (feat:/fix:/BREAKING CHANGE:). Skipping."
            echo "SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi

          CURRENT=$(grep -oP '^version\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' pyproject.toml)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP" in
            major)
              # Pre-1.0.0 rule: breaking changes bump minor, not major (never auto-cross to 1.0.0).
              # 1.0.0 is only set manually when the repo passes full quickmerge under the new
              # CI/CD pipeline and all plan items are complete. See workspace-manifest versions_policy.
              if [ "$MAJOR" = "0" ]; then
                MINOR=$((MINOR + 1)); PATCH=0
              else
                MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
              fi ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Bumping $CURRENT → $NEW_VERSION ($BUMP)"

          sed -i "s/^version = \"${CURRENT}\"/version = \"${NEW_VERSION}\"/" pyproject.toml

          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          echo "SKIP=false" >> "$GITHUB_ENV"

      - name: Update workspace-manifest.json versions map
        if: env.SKIP != 'true'
        run: |
          set -euo pipefail

          NEW_VERSION="${{ env.NEW_VERSION }}"
          BRANCH="${{ github.event.workflow_run.head_branch }}"

          # Update versions map entry (always — versions tracks main and staging)
          if grep -q '"unified-trading-pm"' workspace-manifest.json; then
            sed -i "s/\"unified-trading-pm\": \"[0-9]*\.[0-9]*\.[0-9]*\"/\"unified-trading-pm\": \"${NEW_VERSION}\"/" workspace-manifest.json
          fi

          # On staging: also update staging_versions."unified-trading-pm"
          if [ "$BRANCH" = "staging" ]; then
            python3 - <<PYEOF
          import json, re

          with open("workspace-manifest.json") as f:
              manifest = json.load(f)

          if "staging_versions" not in manifest:
              manifest["staging_versions"] = {"_note": manifest.get("staging_versions", {}).get("_note", "")}

          manifest["staging_versions"]["unified-trading-pm"] = "${NEW_VERSION}"

          with open("workspace-manifest.json", "w") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PYEOF
            echo "Updated staging_versions[unified-trading-pm] = ${NEW_VERSION}"
          fi

      - name: Commit version bump
        if: env.SKIP != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml workspace-manifest.json
          git commit -m "chore(release): bump version to ${{ env.NEW_VERSION }} [skip ci]"
          git push
