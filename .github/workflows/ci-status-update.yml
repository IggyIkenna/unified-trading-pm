name: ci-status-update

# Receives repository_dispatch from the quality-gates workflows (python-quality-gates-v2.yml /
# ui-quality-gates-v2.yml; the v1 callers/callee were retired 2026-05-29) when QG completes.
# Updates workspace-manifest.json ci_status
# for the repo, regenerates the DAG SVG, and commits. ci_status is the single source
# of truth for QG state — quality_gate_status is removed.
#
# Trigger: repository_dispatch event_type=ci-status-update
# Payload: { repo, status, branch, sha }
#   status: FEATURE_GREEN | STAGING_GREEN | MAIN_GREEN | FAILING
#   branch: the branch that triggered the QG run (used to determine status)
#
# ci_status lifecycle (9 states):
#   NOT_CONFIGURED → LOCAL_PASS → FEATURE_GREEN → STAGING_PENDING → STAGING_GREEN → SIT_VALIDATED
#   SIT_VALIDATED → MAIN_GREEN  (written by python-quality-gates-v2.yml when QG passes on main)
#   Any state can regress to FAILING on QG failure.
# MAIN_GREEN is the dep-on-main gate signal used by staging-to-main.yml STAGE 1.8:
#   before promoting repo X to main, every dep D must have ci_status=MAIN_GREEN (or SIT_VALIDATED).
# See rollout plan § ci_status Lifecycle State Machine for full spec.

on:
  repository_dispatch:
    types: [ci-status-update]

permissions:
  contents: write
  issues: write

concurrency:
  group: manifest-update
  cancel-in-progress: false

jobs:
  update-ci-status:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.update.outputs.skip }}
      notify_worthy: ${{ steps.update.outputs.notify_worthy }}
      prev_status: ${{ steps.update.outputs.prev_status }}
      severity_class: ${{ steps.update.outputs.severity_class }}
      sit_pass: ${{ steps.update.outputs.sit_pass }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Update manifest ci_status and regenerate DAG
        id: update
        env:
          REPO: ${{ github.event.client_payload.repo }}
          STATUS: ${{ github.event.client_payload.status }}
          SHA: ${{ github.event.client_payload.sha || '' }}
          BRANCH: ${{ github.event.client_payload.branch || '' }}
        run: |
          set -euo pipefail

          if [ -z "$REPO" ] || [ -z "$STATUS" ]; then
            echo "Missing repo or status in client_payload. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VALID_STATUSES="FEATURE_GREEN STAGING_GREEN MAIN_GREEN FAILING LOCAL_PASS SIT_VALIDATED"
          if ! echo "$VALID_STATUSES" | tr ' ' '\n' | grep -qx "$STATUS"; then
            echo "Invalid status '$STATUS'. Must be one of: $VALID_STATUSES. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Updating ci_status: $REPO → $STATUS"

          python3 - <<PYEOF
          import json
          import os
          from pathlib import Path

          repo = os.environ["REPO"]
          status = os.environ["STATUS"]
          branch = os.environ.get("BRANCH", "")

          manifest_path = Path("workspace-manifest.json")
          with open(manifest_path) as f:
              manifest = json.load(f)

          repos = manifest.get("repositories", {})
          if repo not in repos:
              print(f"Repo {repo} not in manifest — skipping.")
              exit(0)

          prev = repos[repo].get("ci_status", "NONE")
          # No-downgrade guard: do NOT knock an on-main repo (MAIN_GREEN / SIT_VALIDATED)
          # down to a LOWER green tier just because a non-main (staging/ldr) v2 re-ran.
          # The live ldr->staging promoter re-runs staging v2 on already-promoted repos;
          # an unconditional overwrite flapped MAIN_GREEN->STAGING_GREEN, which deadlocked
          # the staging-to-main dep-order gate (a base dep like uac/utl never stayed
          # MAIN_GREEN, so its dependents never became promote-ready). Keep the higher tier
          # UNLESS the incoming is FAILING (a real regression must always surface) or the
          # update is from the `main` branch itself (the authoritative on-main signal).
          _GREEN_RANK = {
              "LOCAL_PASS": 1, "FEATURE_GREEN": 1, "STAGING_PENDING": 2,
              "STAGING_GREEN": 2, "SIT_VALIDATED": 3, "MAIN_GREEN": 4,
          }
          if (
              status != "FAILING"
              and branch != "main"
              and _GREEN_RANK.get(status, 0) < _GREEN_RANK.get(prev, 0)
          ):
              print(f"No-downgrade: keeping {repo} ci_status={prev} (ignoring lower non-main {branch} v2 -> {status})")
              status = prev
          repos[repo]["ci_status"] = status
          # Remove deprecated quality_gate_status from all repos (ci_status is SSOT)
          for r in repos.values():
              r.pop("quality_gate_status", None)

          with open(manifest_path, "w") as f:
              json.dump(manifest, f, indent=2)
          print(f"Updated {repo} ci_status: {prev} -> {status}")

          # Transition-gate the Slack notify: only alert on a state CHANGE that matters —
          # a regression TO FAILING, a recovery FROM FAILING, OR a transition INTO
          # SIT_VALIDATED (the explicit SIT-pass alert — previously SIT-green was only
          # implied via promotion, never surfaced). Steady-state (prev==status) and
          # green<->green tier moves (FEATURE_GREEN<->STAGING_GREEN) are NOT alerted —
          # those were spam ("telling us things are fine"). The manifest write + persist
          # (dashboard data) still ALWAYS run; only the #ci-failures Slack ping is gated.
          sit_pass = status == "SIT_VALIDATED" and prev != "SIT_VALIDATED"
          notify_worthy = (
              (status == "FAILING")
              or (prev == "FAILING" and status != "FAILING")
              or sit_pass
          )
          # Severity class for the alert (consumed by build-message + the Slack notify):
          #   main-branch FAILING  → CRITICAL  (a break on main is the worst case — the
          #                          released/promoted line is red, distinct from a
          #                          staging-PR fail which is caught pre-promotion)
          #   any other FAILING    → WARNING
          #   SIT-pass / recovery  → INFO
          if status == "FAILING":
              severity_class = "CRITICAL" if branch == "main" else "WARNING"
          else:
              severity_class = "INFO"
          gh_out = os.environ.get("GITHUB_OUTPUT")
          if gh_out:
              with open(gh_out, "a") as out:
                  out.write(f"notify_worthy={'true' if notify_worthy else 'false'}\n")
                  out.write(f"prev_status={prev}\n")
                  out.write(f"severity_class={severity_class}\n")
                  out.write(f"sit_pass={'true' if sit_pass else 'false'}\n")
          PYEOF

          python3 scripts/manifest/generate_workspace_dag.py

      - name: Commit and push
        if: steps.update.outputs.skip != 'true'
        run: |
          # WORKSPACE_MANIFEST_DAG.svg is a gitignored regen artifact (2026-06-03 canonical
          # ignore set) — `git add` of an ignored path exits 1 and froze ci_status fleet-wide.
          # Only the manifest (the SSOT) is committed; the DAG regenerates from it on demand.
          if git diff --quiet workspace-manifest.json 2>/dev/null; then
            echo "No manifest changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add workspace-manifest.json
          git commit -m "ci: update ci_status for ${{ github.event.client_payload.repo }} (${{ github.event.client_payload.status }}) [skip ci]"
          git push origin HEAD

      # Event-driven LDR→staging cascade (was: only the 6h cron advanced one dep-tier
      # per run). When a repo reaches the staging line, its dependents become promotable
      # → re-fire ldr-to-staging-promote NOW instead of waiting up to 6h. The promoter's
      # concurrency group (cancel-in-progress:false) serialises runs and it no-ops when
      # nothing new is promotable, so the chain advances one tier per hop and
      # self-terminates. SSOT: ldr-to-staging-promote.yml (repository_dispatch: tier-ab-green).
      - name: Re-fire LDR→staging promoter on a staging-line transition
        if: steps.update.outputs.skip != 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          STATUS: ${{ github.event.client_payload.status }}
          REPO: ${{ github.event.client_payload.repo }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          case "$STATUS" in
            STAGING_GREEN | SIT_VALIDATED | MAIN_GREEN)
              echo "→ $REPO reached $STATUS; re-firing tier-ab-green to ldr-to-staging-promote"
              curl -sf -X POST \
                -H "Authorization: token ${GH_PAT}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${OWNER}/unified-trading-pm/dispatches" \
                -d "{\"event_type\":\"tier-ab-green\",\"client_payload\":{\"trigger_repo\":\"${REPO}\",\"trigger_status\":\"${STATUS}\"}}" \
                && echo "promoter re-fired" || echo "dispatch failed (non-fatal; 6h cron remains the backstop)"
              ;;
            *)
              echo "Status $STATUS is not a staging-line transition — no promoter re-fire."
              ;;
          esac

  # ── BUILD MESSAGE BODY (decodes optional failure excerpt) ────────────────────
  build-message:
    name: Build notification message
    runs-on: ubuntu-latest
    needs: [update-ci-status]
    # Only build/notify on a meaningful TRANSITION (regression to FAILING, or recovery
    # from FAILING). Steady-green + green<->green tier moves are suppressed (anti-spam).
    if:
      always() && needs.update-ci-status.outputs.skip != 'true' && needs.update-ci-status.outputs.notify_worthy ==
      'true'
    outputs:
      message: ${{ steps.build.outputs.message }}
    steps:
      - id: build
        env:
          REPO: ${{ github.event.client_payload.repo }}
          STATUS: ${{ github.event.client_payload.status }}
          PREV: ${{ needs.update-ci-status.outputs.prev_status }}
          BRANCH: ${{ github.event.client_payload.branch || '' }}
          SEVERITY_CLASS: ${{ needs.update-ci-status.outputs.severity_class }}
          SIT_PASS: ${{ needs.update-ci-status.outputs.sit_pass }}
          EXCERPT_B64: ${{ github.event.client_payload.failure_excerpt_b64 }}
          SHA: ${{ github.event.client_payload.sha || '' }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ "${STATUS}" = "FAILING" ]; then
            if [ "${BRANCH}" = "main" ]; then
              # A break on main = the released/promoted line is red → CRITICAL, distinct
              # from a staging-PR fail (caught pre-promotion). Make the branch explicit.
              MSG="🚨 CI REGRESSION on *main*: *${REPO}* is *FAILING* (was ${PREV}) — the promoted/main line is RED"
            else
              MSG="🔴 CI REGRESSION: *${REPO}* is now *FAILING* (was ${PREV})${BRANCH:+ [branch: ${BRANCH}]}"
            fi
          elif [ "${SIT_PASS}" = "true" ]; then
            # Explicit SIT-pass alert — SIT-green was previously only implied via promotion.
            MSG="✅ SIT PASSED: *${REPO}* ${PREV} → *SIT_VALIDATED* (system-integration-tests green; clear to promote staging→main)"
          else
            MSG="🟢 CI RECOVERED: *${REPO}* ${PREV} → *${STATUS}*"
          fi
          # Decode the QG failure excerpt (last 30 lines of QG output) into a code block.
          # Senders only populate failure_excerpt_b64 when STATUS=FAILING; double-check here.
          if [ -n "${EXCERPT_B64:-}" ] && [ "${STATUS}" = "FAILING" ]; then
            EXCERPT=$(printf '%s' "${EXCERPT_B64}" | base64 -d 2>/dev/null || true)
            if [ -n "${EXCERPT}" ]; then
              MSG=$(printf '%s\n\n*Failure excerpt (last lines of QG output):*\n```\n%s\n```' "${MSG}" "${EXCERPT}")
            fi
          fi
          # ── Push-author attribution (operator-approved 2026-06-02) ─────────────
          # Classification mirror of ci_failure_watcher.py::_classify_commit_data:
          #   automation  = committer is "github-actions[bot]" or "GitHub"
          #   background-agent = message contains "Co-Authored-By: Claude"
          #   human       = author name in {IggyIkenna, CosmicTrader} (case-insensitive)
          #   unknown     = anything else
          # Gracefully skips if SHA is empty or the gh api call fails.
          if [ -n "${SHA:-}" ]; then
            COMMIT_JSON=$(gh api "repos/${GITHUB_REPOSITORY_OWNER}/${REPO}/commits/${SHA}" \
              --jq '{author:.commit.author.name,committer:.commit.committer.name,message:.commit.message}' \
              2>/dev/null || true)
            if [ -n "${COMMIT_JSON:-}" ]; then
              COMMIT_AUTHOR=$(printf '%s' "${COMMIT_JSON}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('author',''))" 2>/dev/null || true)
              COMMIT_COMMITTER=$(printf '%s' "${COMMIT_JSON}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('committer',''))" 2>/dev/null || true)
              COMMIT_MESSAGE=$(printf '%s' "${COMMIT_JSON}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('message',''))" 2>/dev/null || true)
              COMMITTER_LC=$(printf '%s' "${COMMIT_COMMITTER}" | tr '[:upper:]' '[:lower:]')
              AUTHOR_LC=$(printf '%s' "${COMMIT_AUTHOR}" | tr '[:upper:]' '[:lower:]')
              MSG_LC=$(printf '%s' "${COMMIT_MESSAGE}" | tr '[:upper:]' '[:lower:]')
              if [ "${COMMITTER_LC}" = "github-actions[bot]" ] || [ "${COMMITTER_LC}" = "github" ]; then
                PUSHER_ROLE="automation"
                PUSHER_NAME="${COMMIT_AUTHOR}"
              elif printf '%s' "${MSG_LC}" | grep -q "co-authored-by: claude"; then
                PUSHER_ROLE="background-agent"
                PUSHER_NAME="${COMMIT_AUTHOR}"
              elif [ "${AUTHOR_LC}" = "iggyikenna" ] || [ "${AUTHOR_LC}" = "cosmictrader" ]; then
                PUSHER_ROLE="human"
                PUSHER_NAME="${COMMIT_AUTHOR}"
              else
                PUSHER_ROLE="unknown"
                PUSHER_NAME="${COMMIT_AUTHOR:-unknown}"
              fi
              MSG=$(printf '%s\n👤 pushed by %s [%s]' "${MSG}" "${PUSHER_NAME}" "${PUSHER_ROLE}")
            fi
          fi
          {
            echo "message<<MSGEOF"
            echo "${MSG}"
            echo "MSGEOF"
          } >> "$GITHUB_OUTPUT"

  # ── NOTIFICATION (Slack) ─────────────────────────────────────────────────────
  notify:
    name: Slack — CI Status Update
    needs: [update-ci-status, build-message]
    # Transition-gated (anti-spam): only ping Slack on regression-to-FAILING or recovery-from-FAILING.
    if:
      always() && needs.update-ci-status.outputs.skip != 'true' && needs.update-ci-status.outputs.notify_worthy ==
      'true'
    uses: ./.github/workflows/notify-slack.yml
    with:
      message: ${{ needs.build-message.outputs.message }}
      # severity + conclusion derive from the UNDERLYING repo's CI status, NOT this
      # meta-job's result. Otherwise FAILING repos render with ✅/Conclusion: success
      # because the manifest write itself succeeded. Manifest-job failure also flips to
      # failure so degraded ci-status writes don't mask under a green tick.
      # severity_class is computed by update-ci-status: CRITICAL for a main-branch FAILING
      # (worst case — the promoted line is red), WARNING for any other FAILING, INFO for a
      # SIT-pass / recovery. Falls back to the old status-only rule if unset.
      severity:
        ${{ needs.update-ci-status.outputs.severity_class || (github.event.client_payload.status == 'FAILING' &&
        'CRITICAL' || 'INFO') }}
      conclusion:
        ${{ (github.event.client_payload.status == 'FAILING' || needs.update-ci-status.result != 'success') && 'failure'
        || 'success' }}
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets: inherit

  persist:
    name: Persist — CI Status Event
    needs: [update-ci-status, notify]
    if: always() && needs.update-ci-status.outputs.skip != 'true'
    uses: ./.github/workflows/persist-cicd-event.yml
    secrets: inherit
    with:
      repo_name: ${{ github.event.client_payload.repo }}
      workflow_name: ${{ github.workflow }}
      run_id: ${{ github.run_id }}
      conclusion: ${{ needs.update-ci-status.result }}
      branch: ${{ github.ref_name }}
      commit_sha: ${{ github.event.client_payload.sha }}
      details_json: '{"status": "${{ github.event.client_payload.status }}"}'
