name: Conflict Resolution Agent

# A merge conflict blocked a promotion PR (feat→staging / staging→main / LDR→staging). This
# workflow ESCALATES it to the agent-orchestrator instead of resolving it in-GHA.
#
# CUT OVER 2026-06-03: the in-GHA Anthropic-API path (ANTHROPIC_API_KEY_CICD + claude-code CLI)
# is REMOVED. Conflict resolution is the HARD judgment task and must run on a long-lived
# Max-plan setup-token worker, not pay-per-call API credits. This now dispatches
# escalate-to-orchestrator → POST /api/escalate → the orchestrator spawns a worker that clones,
# resolves the conflict ON live-defi-rollout (preserving both sides + active-plan intent),
# pushes, and lets quality-gates-v2 re-gate. The worker NEVER force-pushes / never self-merges.
# Enabled by the ORCHESTRATOR_INTERNAL_SECRET bridge fix (PM Actions, 2026-06-03 — escalate
# verified green). SSOT: codex/08-workflows/ci-cd-flow.md § "Convergence + conflict-resolution model".

on:
  repository_dispatch:
    types: [merge-conflict-detected]
  workflow_dispatch:
    inputs:
      repo_name:
        description: "Repository name (e.g. market-tick-data-service)"
        required: true
      source_branch:
        description: "Source branch (the incoming branch — e.g. staging, live-defi-rollout)"
        required: true
      target_branch:
        description: "Target branch (the base — e.g. main, staging)"
        required: true
      original_pr_url:
        description: "URL of the blocked PR (optional)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group:
    conflict-resolution-${{ github.event.client_payload.repo_name || inputs.repo_name }}-${{
    github.event.client_payload.source_branch || inputs.source_branch }}
  cancel-in-progress: false

jobs:
  escalate:
    name: Escalate merge conflict to orchestrator (Max-plan worker)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve inputs (repository_dispatch / workflow_dispatch)
        id: in
        env:
          REPO_NAME: ${{ github.event.client_payload.repo_name || inputs.repo_name }}
          SOURCE_BRANCH: ${{ github.event.client_payload.source_branch || inputs.source_branch }}
          TARGET_BRANCH: ${{ github.event.client_payload.target_branch || inputs.target_branch }}
          PR_URL: ${{ github.event.client_payload.original_pr_url || inputs.original_pr_url }}
        run: |
          set -uo pipefail
          : "${REPO_NAME:?repo_name required}"
          : "${SOURCE_BRANCH:?source_branch required}"
          : "${TARGET_BRANCH:?target_branch required}"
          # Derive the PR number from a …/pull/NN URL if one was supplied; else 0.
          PR_NUMBER=$(printf '%s' "${PR_URL:-}" | sed -n 's#.*/pull/\([0-9][0-9]*\).*#\1#p')
          PR_NUMBER="${PR_NUMBER:-0}"
          {
            echo "repo_name=${REPO_NAME}"
            echo "source_branch=${SOURCE_BRANCH}"
            echo "target_branch=${TARGET_BRANCH}"
            echo "pr_number=${PR_NUMBER}"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch escalate-to-orchestrator (merge_conflict → Max-plan worker)
        env:
          # MUST be GH_PAT: a repository_dispatch fired with GITHUB_TOKEN does NOT trigger workflows.
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -uo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type=escalate-to-orchestrator \
            -f "client_payload[repo]=${{ steps.in.outputs.repo_name }}" \
            -f "client_payload[pr_number]=${{ steps.in.outputs.pr_number }}" \
            -f 'client_payload[wall_type]=merge_conflict' \
            -f "client_payload[context]=Merge conflict ${{ steps.in.outputs.source_branch }} -> ${{ steps.in.outputs.target_branch }} in ${{ steps.in.outputs.repo_name }} (PR ${{ steps.in.outputs.pr_number }}). Resolve ON live-defi-rollout preserving both sides + active-plan intent; never force-push; quality-gates-v2 re-gates." \
            -f 'client_payload[model]=opus'
          echo "Escalated merge conflict to orchestrator (opus Max-plan worker). escalate-to-orchestrator notifies Slack on dispatch."
