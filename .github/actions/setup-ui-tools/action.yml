name: Setup UI CI Tools
description: >
  Set up Node.js for TypeScript/React UI repos. Used by all UI repos via quality-gates.yml.

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: "22"

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
