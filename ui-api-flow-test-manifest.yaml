# UI/API Flow Test Manifest — Citadel-Grade Validation
#
# SSOT for critical UI interaction journeys and their required test layers.
# Referenced by: check_ui_api_flow_coverage.py
# Plan: ui_api_flow_validation_citadel_grade_2026_03_14.plan.md
#
# Schema:
#   repo:                      Git repo name (e.g. deployment-ui)
#   journey_id:                Unique slug for this journey (kebab-case)
#   page_or_route:             UI page path or route (e.g. /deployments)
#   control_id:                DOM element identifier (data-testid, button text, selector)
#   interaction_type:          click | dropdown_select | form_submit | navigation | toggle
#   expected_request:          HTTP method + path (e.g. POST /api/deployments)
#   expected_response_contract: UIC/UAC model name that validates the response
#   expected_ui_update:        Observable UI change after response (text, badge, state)
#   required_layers:           List of [ui_mock, api_mock, real_flow]
#   criticality:               critical | high | medium
#
# Criticality cadence:
#   critical = every staging deploy
#   high     = nightly SIT
#   medium   = weekly SIT

# ---------------------------------------------------------------------------
# Severity Taxonomy — defines what each criticality level means and when
# real-flow tests for that level must run.
# ---------------------------------------------------------------------------
severity_definitions:
  critical:
    description: "Blocks trading or deployment. Failure means money at risk or services unreachable."
    examples:
      - "Order execution (submit, fill, cancel)"
      - "Kill switch toggle"
      - "Service deployment trigger"
      - "Position/balance queries"
    real_flow_cadence: "every staging deploy"
    sit_schedule: "on_staging_deploy"
    coverage_rule: "COV-001 — all 3 layers required (ui_mock + api_mock + real_flow)"
    failure_action: "BLOCK — prevents promotion to staging"

  high:
    description: "Degrades UX or causes data staleness. Not immediately dangerous but impacts user confidence."
    examples:
      - "Log filtering and search"
      - "Alert routing configuration"
      - "Config save (start dates, regions)"
      - "Report download"
    real_flow_cadence: "nightly SIT"
    sit_schedule: "nightly"
    coverage_rule: "COV-002 — ui_mock + api_mock required; real_flow recommended"
    failure_action: "WARNING — logged and reported, does not block promotion"

  medium:
    description: "Cosmetic or non-blocking. Navigation, branding, tooltips, non-critical table rendering."
    examples:
      - "Branding and theme"
      - "Tooltip text"
      - "Non-critical table sorting"
      - "Navigation breadcrumbs"
    real_flow_cadence: "weekly SIT"
    sit_schedule: "weekly"
    coverage_rule: "COV-003 — at least one test in any layer"
    failure_action: "INFO — reported only, no point deduction"

journeys:
  - repo: deployment-ui
    journey_id: deploy-service
    page_or_route: /deployments
    control_id: "[data-testid='deploy-button']"
    interaction_type: click
    expected_request: POST /api/deployments
    expected_response_contract: DeploymentState
    expected_ui_update: Status badge transitions to 'deploying', then 'deployed'
    required_layers:
      - ui_mock
      - api_mock
      - real_flow
    criticality: critical
  - repo: deployment-ui
    journey_id: kill-switch-toggle
    page_or_route: /services/{id}
    control_id: "[data-testid='kill-switch-toggle']"
    interaction_type: toggle
    expected_request: POST /api/services/{id}/kill-switch
    expected_response_contract: ServiceState
    expected_ui_update: Kill switch badge toggles between 'active' and 'killed'
    required_layers:
      - ui_mock
      - api_mock
      - real_flow
    criticality: critical
  - repo: deployment-ui
    journey_id: start-dates-config
    page_or_route: /config/start-dates
    control_id: "[data-testid='start-dates-dropdown']"
    interaction_type: dropdown_select
    expected_request: PUT /api/config/start-dates
    expected_response_contract: ConfigUpdateResponse
    expected_ui_update: Confirmation toast shown, dropdown reflects new selection
    required_layers:
      - ui_mock
      - api_mock
      - real_flow
    criticality: high
  - repo: deployment-ui
    journey_id: region-selection
    page_or_route: /config/region
    control_id: "[data-testid='region-dropdown']"
    interaction_type: dropdown_select
    expected_request: PUT /api/config/region
    expected_response_contract: ConfigUpdateResponse
    expected_ui_update: Region badge updates to selected region
    required_layers:
      - ui_mock
      - api_mock
      - real_flow
    criticality: high
