name: freeze-deferred-build-replay

# Defer-and-replay for change-freeze-blocked prod builds (cicd_contract_hardening § "freeze defer-and-replay").
#
# WHY: cloud-build-router.yml builds prod images on `repository_dispatch: qg-passed`. When a change-freeze
# window is active (e.g. ECB rate decision), the freeze-check job blocks the build and route-build is skipped
# — and because repository_dispatch payloads are NOT replayable, the qg-passed is DROPPED, leaving the repo
# without a prod image until a brand-new qg-passed happens to fire. cloud-build-router now persists each
# freeze-blocked payload as a `deferred-build-*` artifact (its defer-on-freeze job). THIS workflow drains
# those artifacts once the freeze lifts and re-dispatches qg-passed, so the deferred builds run themselves —
# no manual re-trigger.
#
# Self-gating: it inlines a PROD_DEPLOY freeze check (intentionally NON-failing — unlike the canonical
# change-freeze-check.yml which exit-1s on the prod-deploy path; the canonical CSV at
# plans/ops/change-freeze-calendar.csv remains the SSOT for window definitions). If still frozen it no-ops
# quietly (no ci-failures noise every tick); only when the window has lifted does it replay. Re-dispatching
# while frozen would just get re-blocked + re-deferred into a loop, so the gate is required.
#
# Idempotent: each artifact is DELETED immediately after its payload is re-dispatched, so a build replays
# exactly once. dry_run lists what WOULD replay without dispatching or deleting.

on:
  schedule:
    # F4 vacuous-cron fix (2026-08-14, post_cutover_silent_assumption_sweep_2026_07_23.md): hourly
    # was nearly always a no-op ("No active PROD_DEPLOY freeze" on every sampled run — freeze windows
    # are <=30min and rare) while occupying the shared self-hosted glue pool ~174x/week. The
    # stale-deferral guard below already tolerates 6h before paging, and GitHub itself only delivers
    # ~37% of scheduled runs under load (see ldr-to-main-promote-fleet.yml's own measured note), so an
    # "hourly" cron already ticks more like every 2-3h in practice. Widening to */2h stays comfortably
    # inside the 6h stale threshold (2 missed ticks = 4h) while roughly halving vacuous occupancy.
    - cron: "0 */2 * * *" # every 2h (was hourly; Phase-3 ci-cost 2026-07-17 set hourly, was */30)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List deferred builds that WOULD replay, without dispatching or deleting"
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  actions: write # delete drained artifacts

concurrency:
  group: freeze-deferred-build-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    outputs:
      replayed_count: ${{ steps.drain.outputs.replayed_count }}
      stale: ${{ steps.stale.outputs.stale }}
      stale_detail: ${{ steps.stale.outputs.stale_detail }}
      recovered: ${{ steps.recovery.outputs.recovered }}
    steps:
      - name: Checkout PM (freeze calendar + alert-recovery helper)
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            plans/ops/change-freeze-calendar.csv
            scripts/cicd/alert_recovery.py

      - name: Restore freeze-deferred-stale alert state cache
        uses: actions/cache@v5
        with:
          path: .freeze-deferred-stale-alert-state.json
          key: freeze-deferred-stale-alert-state-${{ github.run_id }}
          restore-keys: |
            freeze-deferred-stale-alert-state-

      - name: Am I in a PROD_DEPLOY freeze window now? (non-failing — SSOT logic mirrors change-freeze-check.yml)
        id: freeze
        shell: bash
        run: |
          set -uo pipefail
          CALENDAR="plans/ops/change-freeze-calendar.csv"
          FROZEN="false"; REASON=""
          if [ -f "$CALENDAR" ]; then
            NOW_EPOCH=$(date -u +%s)
            NOW_TIME=$(date -u +"%H:%M")
            BLOCKFILE="$(mktemp)"
            tail -n +2 "$CALENDAR" | while IFS=, read -r window_id event_name event_type recurrence start_utc end_utc dst_note block_autonomous block_prod_deploy affects_venues notes; do
              [ -z "$window_id" ] && continue
              [ "$block_prod_deploy" = "true" ] || continue
              MATCH="false"
              if [[ "$start_utc" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]; then
                S=$(date -u -d "$start_utc" +%s 2>/dev/null || echo 0)
                E=$(date -u -d "$end_utc" +%s 2>/dev/null || echo 0)
                if [ "$NOW_EPOCH" -ge "$S" ] && [ "$NOW_EPOCH" -le "$E" ]; then MATCH="true"; fi
              elif [[ "$start_utc" =~ ^[0-9]{2}:[0-9]{2}$ ]]; then
                if { [[ "$NOW_TIME" > "$start_utc" ]] || [[ "$NOW_TIME" == "$start_utc" ]]; } && [[ "$NOW_TIME" < "$end_utc" ]]; then MATCH="true"; fi
                if [[ "$start_utc" > "$end_utc" ]]; then
                  if [[ "$NOW_TIME" > "$start_utc" ]] || [[ "$NOW_TIME" == "$start_utc" ]] || [[ "$NOW_TIME" < "$end_utc" ]]; then MATCH="true"; fi
                fi
              fi
              if [ "$MATCH" = "true" ]; then
                printf '%s' "$event_name ($window_id): $start_utc to $end_utc UTC" > "$BLOCKFILE"
                break
              fi
            done
            if [ -s "$BLOCKFILE" ]; then FROZEN="true"; REASON="$(cat "$BLOCKFILE")"; fi
            rm -f "$BLOCKFILE"
          fi
          echo "frozen=$FROZEN" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          if [ "$FROZEN" = "true" ]; then
            echo "::notice::PROD_DEPLOY freeze still active ($REASON) — deferring replay to a later tick"
          else
            echo "::notice::No active PROD_DEPLOY freeze — draining any deferred builds"
          fi

      - name: Drain deferred-build artifacts → re-dispatch qg-passed
        id: drain
        if: steps.freeze.outputs.frozen != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          OWNER: ${{ github.repository_owner }}
          DRY_RUN: ${{ inputs.dry_run == false && 'false' || (github.event_name == 'schedule' && 'false' || 'true') }}
        shell: bash
        run: |
          set -uo pipefail
          # On a scheduled tick we always replay; manual dispatch honours dry_run (default true).
          echo "dry_run=$DRY_RUN"
          ARTS=$(gh api --paginate "repos/${OWNER}/unified-trading-pm/actions/artifacts" \
            --jq '.artifacts[] | select((.name | startswith("deferred-build-")) or (.name | startswith("deferred-aws-build-"))) | select(.expired == false) | "\(.id)\t\(.name)"' 2>/dev/null || true)
          if [ -z "$ARTS" ]; then
            echo "No deferred-build artifacts to replay."
            exit 0
          fi
          COUNT=0
          while IFS=$'\t' read -r ART_ID ART_NAME; do
            [ -z "$ART_ID" ] && continue
            echo "── deferred artifact: $ART_NAME (id=$ART_ID)"
            TMP="$(mktemp -d)"
            if ! gh api "repos/${OWNER}/unified-trading-pm/actions/artifacts/${ART_ID}/zip" > "$TMP/a.zip" 2>/dev/null; then
              echo "  WARN: download failed — skipping"; continue
            fi
            unzip -o -q "$TMP/a.zip" -d "$TMP" || { echo "  WARN: unzip failed — skipping"; continue; }
            # cloud-build-router.yml (GCP) emits payload.json; cloud-build-router-aws.yml emits
            # payload-aws.json — same schema (repo/branch/version/commit_sha/repo_type), different
            # filename. This search only matched the GCP name, so every deferred-aws-build-*
            # artifact was silently un-drainable from day one (found 2026-08-08: a real deferral
            # sat 162h, 27x past the 6h stale-guard threshold, until this exact bug was found).
            PAYLOAD_FILE="$(find "$TMP" \( -name 'payload.json' -o -name 'payload-aws.json' \) | head -1)"
            [ -z "$PAYLOAD_FILE" ] && { echo "  WARN: no payload.json/payload-aws.json — skipping"; continue; }
            REPO=$(jq -r '.repo' "$PAYLOAD_FILE"); BRANCH=$(jq -r '.branch' "$PAYLOAD_FILE")
            VERSION=$(jq -r '.version' "$PAYLOAD_FILE"); SHA=$(jq -r '.commit_sha' "$PAYLOAD_FILE")
            RTYPE=$(jq -r '.repo_type' "$PAYLOAD_FILE")
            echo "  replay qg-passed: repo=$REPO branch=$BRANCH version=$VERSION type=$RTYPE"
            if [ "$DRY_RUN" = "true" ]; then
              echo "  DRY-RUN: would re-dispatch qg-passed + delete artifact $ART_ID"
            else
              # Build the dispatch body with jq (valid nested JSON + correct escaping) and
              # POST via curl — the proven pattern used by ci-status-reconciler.yml. (gh api's
              # `-F client_payload[k]=v` does NOT build nested JSON, so it is NOT used here.)
              BODY=$(jq -n --arg repo "$REPO" --arg branch "$BRANCH" --arg version "$VERSION" \
                --arg sha "$SHA" --arg rtype "$RTYPE" \
                '{event_type:"qg-passed",client_payload:{repo:$repo,branch:$branch,version:$version,commit_sha:$sha,repo_type:$rtype,replayed_from_freeze:true}}')
              if curl -sf -X POST -H "Authorization: token ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
                   "https://api.github.com/repos/${OWNER}/unified-trading-pm/dispatches" -d "$BODY" 2>/dev/null; then
                echo "  re-dispatched qg-passed for $REPO"
                gh api -X DELETE "repos/${OWNER}/unified-trading-pm/actions/artifacts/${ART_ID}" 2>/dev/null \
                  && echo "  deleted artifact $ART_ID (replay-once)" || echo "  WARN: artifact delete failed (may replay again)"
                COUNT=$((COUNT + 1))
              else
                echo "  WARN: re-dispatch failed for $REPO — artifact kept for next tick"
              fi
            fi
          done <<< "$ARTS"
          echo "replayed_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "=== freeze-deferred replay: $COUNT build(s) re-dispatched (dry_run=$DRY_RUN) ==="

      # ── STALE-DEFERRAL GUARD (added 2026-07-20 with the freeze-block alert removal) ────────────
      # change-freeze-check.yml no longer pages on a routine block, on the operator's reasoning that
      # the windows are short and a genuinely stuck deferral "comes up under a separate alert anyway".
      # That was NOT true when the advisory was removed: the notify below fires only when a replay
      # SUCCEEDS (replayed_count != 0), so a deferral that never drains was completely unalerted —
      # exactly the silent-failure shape that let UTL's main sit red for 9h on 2026-07-20.
      # This closes it: page when a deferred build outlives every plausible window + drain cycle.
      #
      # Threshold 6h, not 1h. Windows are <= 30 min and this cron is hourly, so a healthy deferral
      # drains within ~1-2 ticks — BUT GitHub delivers only ~37% of scheduled runs under load
      # (measured, see ldr-to-main-promote-fleet.yml), so an "hourly" job can really tick every
      # ~2-3h. 6h is comfortably past legitimate slowness while still catching a genuine wedge the
      # same working day. Runs even while frozen (no `if:` on the freeze gate) — a marker aging out
      # DURING a long freeze cluster is precisely the case worth knowing about.
      - name: Stale-deferral guard — page if a deferred build never drained
        id: stale
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          OWNER: ${{ github.repository_owner }}
          STALE_HOURS: "6"
        shell: bash
        run: |
          set -uo pipefail
          NOW=$(date -u +%s)
          OLDEST_H=0
          OLDEST_NAME=""
          # Re-list AFTER the drain so anything successfully replayed is already gone.
          while IFS=$'\t' read -r created name; do
            [ -n "${created:-}" ] || continue
            C=$(date -u -d "$created" +%s 2>/dev/null || echo "$NOW")
            AGE_H=$(( (NOW - C) / 3600 ))
            if [ "$AGE_H" -gt "$OLDEST_H" ]; then OLDEST_H=$AGE_H; OLDEST_NAME="$name"; fi
          done <<< "$(gh api --paginate "repos/${OWNER}/unified-trading-pm/actions/artifacts" \
            --jq '.artifacts[] | select((.name | startswith("deferred-build-")) or (.name | startswith("deferred-aws-build-"))) | select(.expired == false) | "\(.created_at)\t\(.name)"' 2>/dev/null || true)"

          echo "oldest deferred-build artifact: ${OLDEST_NAME:-<none>} (${OLDEST_H}h old; threshold ${STALE_HOURS}h)"
          if [ -n "$OLDEST_NAME" ] && [ "$OLDEST_H" -ge "$STALE_HOURS" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "stale_detail=${OLDEST_NAME} has been deferred ${OLDEST_H}h (threshold ${STALE_HOURS}h)" >> "$GITHUB_OUTPUT"
            echo "::warning::STALE DEFERRAL — ${OLDEST_NAME} deferred ${OLDEST_H}h and still not replayed"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute recovery transition (state-diffed)
        id: recovery
        if: always()
        run: |
          python3 scripts/cicd/alert_recovery.py \
            --state-file .freeze-deferred-stale-alert-state.json \
            --current "${{ steps.stale.outputs.stale }}" >> "$GITHUB_OUTPUT"

  # The ONLY actionable alert on this path (2026-07-20). change-freeze-check.yml deliberately no
  # longer pages on a routine block — a short, self-resolving window is not news. A deferral that
  # has NOT drained after 6h is: either the freeze calendar is wedged, the drain is failing, or the
  # dispatch is being rejected — and in every case a repo is sitting without the prod image it was
  # supposed to get. Paged as a real failure (conclusion: failure) because unlike a freeze block,
  # nothing self-heals this. Deduped so a persistent wedge re-reminds rather than spams each tick.
  notify-stale-deferral:
    name: Slack — STALE freeze deferral
    needs: [replay]
    if: always() && needs.replay.outputs.stale == 'true'
    uses: ./.github/workflows/notify-slack.yml
    with:
      message:
        "STALE FREEZE DEFERRAL: ${{ needs.replay.outputs.stale_detail }} — a prod build has been deferred far longer
        than any freeze window. Check the freeze calendar for a wedged window and this workflow's drain step."
      severity: "CRITICAL"
      conclusion: "failure"
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      dedup_key: "stale-freeze-deferral"
      cooldown_min: 720
    secrets: inherit

  # ── RESOLVED bookend (2026-08-08) ──────────────────────────────────────────────────────
  # notify-stale-deferral above never announced when a stuck deferral finally drained — an
  # operator watching #ci-failures had no way to tell "still stuck" from "silently forgotten
  # about". State-diffed via the shared alert_recovery.py helper.
  notify-stale-deferral-resolved:
    name: Slack — STALE freeze deferral RESOLVED
    needs: [replay]
    if: always() && needs.replay.outputs.recovered == 'true'
    uses: ./.github/workflows/notify-slack.yml
    with:
      message:
        ":ballot_box_with_check: *STALE FREEZE DEFERRAL RESOLVED* — the previously-stuck deferred prod build has drained
        (prior tick paged CRITICAL)"
      severity: "INFO"
      conclusion: "success"
      recovery: true
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      dedup_key: "stale-freeze-deferral-resolved"
      cooldown_min: 30
    secrets: inherit

  notify:
    name: Slack — freeze-deferred replay
    needs: [replay]
    if: always() && needs.replay.outputs.replayed_count != '0' && needs.replay.outputs.replayed_count != ''
    uses: ./.github/workflows/notify-slack.yml
    with:
      message:
        "freeze-deferred-build-replay re-dispatched ${{ needs.replay.outputs.replayed_count }} freeze-deferred prod
        build(s) after the freeze window lifted"
      severity: "INFO"
      conclusion: ${{ needs.replay.result }}
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets: inherit
