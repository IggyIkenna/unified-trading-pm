name: ldr-to-main-promote-fleet

# WS-L Phase-0 canary (2026-06-25): fleet-wide LDR→main direct promote bot.
#
# INERT until TWO conditions are both true:
#   (a) This file reaches the DEFAULT branch (main): schedule/push triggers only
#       fire from the default branch — while this lives only on LDR it can't auto-fire.
#       Test via `workflow_dispatch --ref live-defi-rollout` (the proven canary pattern).
#   (b) A repo opts in: set `repositories.<repo>.promotion_model = "ldr_main"` in
#       workspace-manifest.json (quickmerge to LDR; takes effect on the next tick after
#       the manifest reaches main). No repo has this set until Phase-1 canary-enables one.
#
# WHY (D12, 2026-06-25): staging→main is a projection-to-projection squash merge that
# invents a stale merge-base on every run — identical content, divergent SHA graph →
# git conflict that never self-heals. LDR→main breaks this: LDR is already the backmerge
# sink (main-backmerge-to-ldr keeps LDR ⊇ main), so LDR→main is always a clean merge.
# Every quality GATE is preserved: v2 (always) + SIT-green (breaking repos). Fewer
# moving parts = fewer failure modes.
#
# PHASE-0 scope (this file): per-repo opt-in flag, LDR→main PR open + auto-merge,
# Tier-A CI gate, breaking_pending block, provenance gate, runaway breaker, stale-check
# recovery. Conflict dispatcher mirrors ldr-to-staging-promote.
#
# PHASE-1 adds: [DONE] dep-order gate (ported from staging-to-main STAGE 1.8 — a
# dependent cannot merge to main ahead of its deps); [DONE] SIT-gate relocation —
# part 1 breaking_pending block (released by sit-unlock on SIT pass) + part 2 a
# breaking-detection race-closer (AST differ on main..LDR; a BREAKING delta must be
# SIT-validated = ci_status SIT_VALIDATED + LDR tree == staging tree). REMAINING
# (separate items): quickmerge retarget (staging-lock fold-away under ldr_main), atomic
# PROMOTION_MODEL flag switch (monitors/alerts shift with it, old staging→main goes
# INERT per repo).
#
# staging STAYS as the SIT/v2 sandbox (ldr-to-staging drain continues for SIT);
# only the MERGE-to-main relocates here, gated by v2 (always) + SIT-green (breaking).
# The live staging→main pipeline is UNTOUCHED for repos without promotion_model=ldr_main.
#
# SSOT: plans/active/cicd_consolidated_remaining_2026_06_24.md WS-L (D12, Phase-0).

on:
  schedule:
    # CORRECTED 2026-08-07 (was over-declared to */5 since 2026-07-18): that over-declaration was
    # compensating for GitHub's own unreliable schedule delivery (measured ~37% at the time, later
    # ~80-90%) by tripling the tick rate so ~1/3 surviving ticks still landed ~every 15 min. Since
    # then, ldr-to-main-promote-heartbeat.timer (a deterministic systemd `*/15` on the orchestrator
    # VM, `gh workflow run`, NOT subject to GHA schedule-drop) was added as the reliable backstop —
    # this native schedule is now redundant on top of it, and the extra tick volume was found to be
    # a contributing factor in a 2+ hour queued-run-starvation livelock (see
    # plans/active/issues/ldr_to_main_promote_fleet_queued_run_cancelled_livelock_2026_08_07.md).
    # Matching the heartbeat's own cadence removes that redundant load without changing the
    # effective promotion SLA (still ≤15 min worst case, now delivered deterministically by the
    # heartbeat rather than probabilistically by this schedule).
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what WOULD promote without opening PRs (safe for LDR dispatch testing)"
        type: boolean
        required: false
        default: false
      only_repo:
        description: "Limit to a single repo (leave empty for the full fleet sweep)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ldr-to-main-promote-fleet
  cancel-in-progress: false

jobs:
  promote-ldr-to-main:
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
      blocked: ${{ steps.promote.outputs.blocked }}
      conflicted: ${{ steps.promote.outputs.conflicted }}
      arm_failed: ${{ steps.promote.outputs.arm_failed }}
      promoted_count: ${{ steps.promote.outputs.promoted_count }}
      blocked_count: ${{ steps.promote.outputs.blocked_count }}
      conflicted_count: ${{ steps.promote.outputs.conflicted_count }}
      arm_failed_count: ${{ steps.promote.outputs.arm_failed_count }}
      ldr_main_repos: ${{ steps.promote.outputs.ldr_main_repos }}
    steps:
      # GitHub App token — separate 5000/hr pool from the shared user PAT.
      # owner-scoped; can create/merge PRs and trigger downstream workflows.
      # App perms: Contents + PullRequests + Actions R/W.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_CI_POLLER_APP_ID }}
          private-key: ${{ secrets.GH_APP_CI_POLLER_PRIVATE_KEY }}
          owner: IggyIkenna

      - name: Checkout PM
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      # Read workspace-manifest.json from live-defi-rollout, not main.
      #
      # WHY: this workflow is scheduled / workflow_dispatch and therefore runs in the context of
      # the DEFAULT branch (main), so `actions/checkout` checks out the MAIN copy of PM.
      # workspace-manifest.json on main may lag LDR when PM's own LDR→main promotion is stuck
      # (e.g. behind a qg_red repo-blocker). That staleness window caused #804 and #816 —
      # two spurious agent-orchestrator LDR→main PRs opened ~28 h after its manifest entry
      # was already changed to `ldr_terminal` on LDR (2026-08-05→2026-08-07). Reading from
      # LDR makes every promotion_model change effective on the next scheduled tick, independent
      # of PM's own stuck promotion.
      # fetch-depth: 0 above ensures full history is fetched; we still need an explicit fetch
      # for the live-defi-rollout ref since checkout only checks out the default branch.
      - name: Read workspace-manifest.json from live-defi-rollout (not main)
        run: |
          git fetch origin live-defi-rollout --depth=1 --quiet
          git show origin/live-defi-rollout:workspace-manifest.json > workspace-manifest.json
          echo "Manifest loaded from live-defi-rollout — promotion_model changes effective immediately, independent of PM promotion lag"

      - name: Authenticate to GCP (Firestore ci_status overlay — best-effort)
        id: gcp_auth
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install Firestore SDK (best-effort)
        if: steps.gcp_auth.outcome == 'success'
        continue-on-error: true
        run: python3 -m pip install --quiet "google-cloud-firestore>=2,<3"

      - name: Promote LDR → main (opt-in repos; v2 + SIT gated)
        id: promote
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          ONLY_REPO: ${{ inputs.only_repo || '' }}
          SLACK_CI_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
          # PAT for the auto-merge ARM only: the App token cannot enablePullRequestAutoMerge
          # (WS-L canary finding 2026-06-26); the PAT can. 1 call per promote — negligible vs the App pool.
          GH_PAT_FOR_ARM: ${{ secrets.GH_PAT }}
        run: bash scripts/cicd/ldr_to_main_fleet_promote.sh

  notify:
    name: Slack — LDR→main conflict alert
    needs: [promote-ldr-to-main]
    if: >
      always() && needs.promote-ldr-to-main.outputs.conflicted_count != '0' &&
      needs.promote-ldr-to-main.outputs.conflicted_count != ''
    uses: ./.github/workflows/notify-slack.yml
    with:
      message: >
        LDR→main fleet bot: ${{ needs.promote-ldr-to-main.outputs.promoted_count }} promoted, ${{
        needs.promote-ldr-to-main.outputs.blocked_count }} blocked, ${{
        needs.promote-ldr-to-main.outputs.conflicted_count }} conflicted (repos: ${{
        needs.promote-ldr-to-main.outputs.ldr_main_repos }}). Conflict resolver dispatched for: ${{
        needs.promote-ldr-to-main.outputs.conflicted }}. WS-L Phase-0 canary — SSOT: ldr-to-main-promote-fleet.yml.
      # Standing condition on a `*/15` cron — job-level key (not per-repo: the message already
      # aggregates every currently-conflicted repo into one post, and the conflicted-repo set can
      # shift tick-to-tick, so "any conflict exists in the fleet" is the condition worth deduping,
      # matching promote-fleet-startup-failure-monitor.yml's single-key pattern). Without this a
      # standing conflict re-paged every 15 min (ci_monitor_recovery_bookend_residual_gaps finding 1).
      dedup_key: ldr-main-conflict
      cooldown_min: 60
    secrets: inherit

  # Hardening (2026-08-02, ci_satellite_ao_dispatch_batch1 [CI] P1 — MTDS auto-merge-arm
  # investigation): an arm failure previously fell through to the same PROMOTED tally as a
  # genuinely-armed PR (see ldr_to_main_fleet_promote.sh), so a PR silently needing a manual
  # merge click had NO alert surface at all — exactly the "sits green, nobody notices" shape
  # the source incident (ldr_to_main_promote_workflows_sustained_startup_failure_2026_07_30.md)
  # described. Separate job (distinct message shape from the conflict alert above — an
  # arm-failed repo needs a manual `gh pr merge`, not the conflict resolver).
  notify-arm-failed:
    name: Slack — LDR→main auto-merge ARM FAILED alert
    needs: [promote-ldr-to-main]
    if: >
      always() && needs.promote-ldr-to-main.outputs.arm_failed_count != '0' &&
      needs.promote-ldr-to-main.outputs.arm_failed_count != ''
    uses: ./.github/workflows/notify-slack.yml
    with:
      message: >
        LDR→main fleet bot: auto-merge ARM FAILED for ${{ needs.promote-ldr-to-main.outputs.arm_failed_count }} repo(s):
        ${{ needs.promote-ldr-to-main.outputs.arm_failed }} — PR exists + provenance-clean but needs a MANUAL `gh pr
        merge --auto` (or plain merge once green); check repo `allow_auto_merge` + branch protection. WS-L Phase-0
        canary — SSOT: ldr-to-main-promote-fleet.yml.
      # Standing condition on a `*/15` cron — see the `notify` job's comment above for the
      # job-level-vs-per-repo dedup rationale (ci_monitor_recovery_bookend_residual_gaps finding 1).
      dedup_key: ldr-main-arm-failed
      cooldown_min: 60
    secrets: inherit
