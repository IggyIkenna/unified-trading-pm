name: Plan Health Agent

# PR→main HARD GATE (job `plan-health-gate`): PM is staging-less (LDR→main direct), so
# this deterministic plan-hygiene sweep is PM's fast "pseudo-staging" check on the
# promotion PR. `run_hygiene_sweep.sh --ci` exits 1 on any HARD failure → blocks the PR
# until plans are pristine; the fix then FF's main→LDR so everyone pulls clean.
# Deterministic + $0 (no LLM).
#
# ── RULE-11 RETIREMENT (2026-07-28) — the daily Haiku contradiction/doc-drift job is
# GONE. It is superseded by the daily deep `plan-reconciler` agent (opus, effort max) on
# a systemd timer on the central orchestrator VM — DETECTS **and** FIXES, unlike this
# job's report-only Haiku pass (design-supersession decision, operator 2026-06-12; RULE-11
# prove-then-retire executed once the reconciler cleared its ≥3-green-runs proof gate —
# see `plan_hygiene_precommit_and_agentic_resolution_2026_06_10.md` / operator approval
# `june_2026_vintage_audit_findings_2026_07_27.md` §5-RESOLVED #21). The reconciler is
# canary-watched by `plan_reconciler_liveness_canary.py` (pages if the timer goes inactive
# or no successful run lands in >26h) — see `/codex/11-project-management/plan-hygiene.md`.
#
# Only the PM repo is checked out, to keep the gate fast.
#
# Triggers:
#   - PM→main promotion PR only (no schedule, no manual dispatch — nothing else to fire)

on:
  # HARD GATE on the PM→main promotion PR (PM is staging-less → LDR→main direct;
  # this deterministic plan-hygiene sweep is PM's fast "pseudo-staging" check).
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── HARD GATE (PR→main only): deterministic plan-hygiene sweep, $0 (no LLM) ──
  # exit 1 on any HARD failure → blocks the PM→main PR until plans are pristine.
  # Make it a REQUIRED check on main branch protection ONLY once the sweep is
  # green (today it has 3 hard failures — fix those first or it deadlocks merges).
  # Phase 2 (tracked in cicd plan): auto-fix the fixable findings + commit to the
  # PR head (fix_frontmatter.py), and run the Haiku contradiction check on a
  # planning-VM orchestrator slot (Max-plan, $0 API) feeding this same gate.
  plan-health-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout unified-trading-pm (PR head branch — auto-fix commits push back to it)
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          # Check out the PR HEAD branch (not the detached merge commit) so the
          # deterministic auto-fix step can commit + push fixes back to the PR.
          ref: ${{ github.head_ref }}
          fetch-depth: 0 # the todo-regression check diffs against origin
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python deps (PyYAML for check_frontmatter_yaml.py)
        run: pip install PyYAML
      # ── Phase 2 (item I): deterministic auto-fix BEFORE the sweep ──────────
      # Run the fixable-hygiene auto-fixer and, if it changed plans, commit +
      # push to the PR head branch so FIXABLE findings auto-resolve at the gate.
      # The sweep then runs on the fixed tree; only genuinely UNFIXABLE hard
      # failures still exit 1 (the hard gate stays intact). Loop-guard: the
      # commit is skipped on a no-op AND when HEAD is already an auto-fix commit
      # (the pushed commit re-triggers the PR check → without the guard it could
      # re-commit forever).
      - name: Auto-fix fixable plan hygiene (fix_frontmatter.py) + commit to PR head
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          # Pass the PR head ref via env (NOT an inline GitHub expression) to avoid script-injection.
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          LOOP_GUARD_MARKER="[plan-health-autofix]"
          LAST_MSG="$(git log -1 --pretty=%s || true)"
          if printf '%s' "$LAST_MSG" | grep -qF "$LOOP_GUARD_MARKER"; then
            echo "HEAD is already an auto-fix commit ($LAST_MSG) — skip to avoid a commit loop."
            exit 0
          fi
          echo "Running deterministic frontmatter auto-fix…"
          python3 scripts/plan-hygiene/fix_frontmatter.py || true
          if git diff --quiet; then
            echo "No fixable hygiene changes — nothing to commit."
            exit 0
          fi
          echo "Auto-fix changed files — committing to PR head branch '${PR_HEAD_REF}':"
          git diff --stat
          git config user.name "plan-health-bot"
          git config user.email "plan-health-bot@users.noreply.github.com"
          # Stage ONLY the plan dirs the auto-fixer touches (never -A — keep scope tight).
          git add plans/active plans/epics
          git commit -m "docs(plans): auto-fix plan hygiene at the gate ${LOOP_GUARD_MARKER}"
          git push origin "HEAD:${PR_HEAD_REF}"
          echo "Pushed auto-fix; the re-triggered PR check runs the sweep on the fixed tree."
      - name: Plan-hygiene hard gate + dispatch vm-planning fixer on residue
        # Step 1 (deterministic auto-fix) already ran above. Here: run the hard gate; if HARD
        # failures REMAIN (the judgment residue the auto-fixer can't resolve — todo-regression,
        # orphan plans, contradictions), dispatch the vm-planning `plan_health` fixer worker
        # (escalate-to-orchestrator → agents/escalate.md § plan_health) which cleans the plans on
        # live-defi-rollout so they converge; the PR re-gates green + FF's main→LDR. NON-BLOCKING:
        # plan-health-gate is advisory (only quality-gates-v2 is a required check on main), so a
        # residue surfaces as a red advisory + a dispatched fix, never a wedged PM→main.
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "PM is staging-less; this is the LDR→main pseudo-staging gate (plan hygiene)."
          set +e
          OUT=$(bash scripts/plan-hygiene/run_hygiene_sweep.sh --ci 2>&1)
          RC=$?
          echo "$OUT"
          if [ "$RC" -eq 0 ]; then
            echo "Plans pristine — no remediation needed."
            exit 0
          fi
          echo "::warning::Plan-hygiene HARD failures remain after deterministic auto-fix — dispatching the vm-planning plan_health fixer (advisory gate; quality-gates-v2 still governs merge)."
          CTX=$(printf '%s\n' "$OUT" | grep -iE "FAIL|lost todos|orphan|regression|contradiction" | head -40)
          PAYLOAD=$(jq -n --arg ctx "$CTX" --argjson pr "${PR_NUMBER:-0}" \
            '{event_type:"escalate-to-orchestrator", client_payload:{repo:"unified-trading-pm", pr_number:$pr, wall_type:"plan_health", context:$ctx, authoring_slot:"ci"}}')
          printf '%s' "$PAYLOAD" | gh api -X POST "repos/${OWNER}/unified-trading-pm/dispatches" --input - \
            && echo "Dispatched plan_health fixer." || echo "::warning::plan_health dispatch failed (non-fatal)."
          # Advisory gate: surface the residue (red) without blocking the merge.
          exit "$RC"

