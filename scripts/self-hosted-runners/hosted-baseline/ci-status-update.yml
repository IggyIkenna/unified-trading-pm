name: ci-status-update

# Receives repository_dispatch from the quality-gates workflows (python-quality-gates-v2.yml /
# ui-quality-gates-v2.yml) when QG completes, and writes the repo's ci_status to the Firestore
# SSOT (scripts/cicd/ci_status_store.py — one document per repo, CAS-on-rank + a stale-write
# ordering guard). ci_status is the single source of truth for QG state.
#
# WS-A Phase-3 (plan cicd_consolidated_remaining_2026_06_24): Firestore is the SSOT; this workflow
# NO LONGER commits workspace-manifest.json. The hourly ci-status-consolidator.yml projects the
# Firestore aggregate into the manifest (the offline-fallback cache) in ONE commit/interval,
# replacing the per-transition `ci: update ci_status … [skip ci]` manifest commit (the dominant
# PM-LDR commit-noise + manifest write-contention class). With the git commit gone, this workflow
# needs no manifest-update concurrency group (Firestore CAS handles same-repo ordering; per-repo
# docs handle cross-repo) — so its runs no longer cancel each other, which removes the
# dropped-transition class the (now retired) ci-status-reconciler.yml used to backstop.
#
# Trigger: repository_dispatch event_type=ci-status-update
# Payload: { repo, status, branch, sha, codebase_health_b64?, failure_excerpt_b64? }
#   status: FEATURE_GREEN | STAGING_GREEN | MAIN_GREEN | FAILING | LOCAL_PASS | SIT_VALIDATED
#   branch: the branch that triggered the QG run (used to determine status)
#
# ci_status lifecycle:
#   NOT_CONFIGURED → LOCAL_PASS → FEATURE_GREEN → STAGING_PENDING → STAGING_GREEN → SIT_VALIDATED
#   → MAIN_GREEN ; any state regresses to FAILING on QG failure. The no-downgrade + stale-write
#   ordering semantics live in ci_status_store.resolve_status / is_stale_write — the store applies
#   them transactionally and returns the RESOLVED transition (prev -> written).
# MAIN_GREEN is the dep-on-main gate signal staging-to-main.yml STAGE 1.8 reads.

on:
  repository_dispatch:
    types: [ci-status-update]

permissions:
  contents: read

# No concurrency group (WS-A Phase-3): this workflow no longer commits workspace-manifest.json, so
# there is no git write-contention to serialise. The Firestore SSOT write (ci_status_store.set_status)
# is a per-repo-document CAS transaction — same-repo transitions serialise transactionally and
# different repos touch disjoint documents — so unbounded concurrency is safe. The previous
# `group: manifest-update / cancel-in-progress: false` CANCELLED pending runs under burst (many repos'
# v2 completing at once), silently dropping ci_status transitions; removing it eliminates that class.

jobs:
  update-ci-status:
    # CI-cost B1 + STEP 2b: the ~13k/mo ci_status writer. Runs GitHub-hosted (not the self-hosted
    # glue pool) — comment corrected 2026-08-07, see plans/archive/issues/glue_runner_health_monitor_github_token_403_2026_08_07.md
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.validate.outputs.skip }}
      notify_worthy: ${{ steps.update.outputs.notify_worthy }}
      recovered: ${{ steps.update.outputs.recovered }}
      prev_status: ${{ steps.update.outputs.prev_status }}
      severity_class: ${{ steps.update.outputs.severity_class }}
      sit_pass: ${{ steps.update.outputs.sit_pass }}
    steps:
      - name: Checkout (sparse — STEP 2b trim)
        # STEP 2b (ci-cost plan, 2026-07-17): this job needs exactly TWO paths — the store script
        # it runs and the persist-event composite it `uses:` — not the whole PM tree. Sparse
        # checkout keeps the highest-frequency workflow (~13k runs/mo) light on the warm writer
        # slot. (Literal zero-checkout is off the table per the D1 resolution: `uses: ./…`
        # resolves against the WORKSPACE, so .github/actions must exist on disk.)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/actions
            scripts/cicd/ci_status_store.py
          sparse-checkout-cone-mode: false

      - name: Validate payload
        id: validate
        env:
          REPO: ${{ github.event.client_payload.repo }}
          STATUS: ${{ github.event.client_payload.status }}
        run: |
          set -euo pipefail
          if [ -z "${REPO:-}" ] || [ -z "${STATUS:-}" ]; then
            echo "Missing repo or status in client_payload. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VALID_STATUSES="FEATURE_GREEN STAGING_GREEN MAIN_GREEN FAILING LOCAL_PASS SIT_VALIDATED"
          if ! echo "$VALID_STATUSES" | tr ' ' '\n' | grep -qx "$STATUS"; then
            echo "Invalid status '$STATUS'. Must be one of: $VALID_STATUSES. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Updating ci_status: $REPO → $STATUS"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # STEP 2b (2026-07-17) dropped the per-run `google-github-actions/auth@v3` step, relying on
      # the self-hosted glue-writer pool's ambient ADC
      # (~ubuntu/.config/gcloud/application_default_credentials.json) for the python Firestore
      # client — probed working at the time. RESTORED 2026-07-25 (ci_status_firestore_write_permission_denied_fleet_wide_2026_07_25.md):
      # that ambient ADC identity (unified-trading-sa@central-element-323112.iam.gserviceaccount.com)
      # started 403'ing on the Firestore write sometime before 2026-07-25T10:36Z (0/95 sampled runs
      # succeeded since) — reproduced live via a direct Firestore REST PATCH using the SAME ADC
      # identity. `secrets.GCP_SA_KEY` (a separate, key-based credential — same secret ci-health.yml
      # uses for its own Firestore write) is NOT affected: ci-health.yml runs using it succeeded
      # repeatedly inside this exact incident window (e.g. 2026-07-25T13:28:30Z). Explicit auth via
      # that key sidesteps whatever broke the box's ambient ADC (key rotation, IAM binding change,
      # or ADC-specific scoping — root cause not yet determined) without requiring a new IAM grant.
      - name: Authenticate to GCP (Firestore SSOT write)
        id: gcp_auth
        if: steps.validate.outputs.skip != 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Write ci_status to the Firestore SSOT + compute Slack notify gating
        id: update
        if: steps.validate.outputs.skip != 'true'
        env:
          REPO: ${{ github.event.client_payload.repo }}
          STATUS: ${{ github.event.client_payload.status }}
          BRANCH: ${{ github.event.client_payload.branch || '' }}
          SHA: ${{ github.event.client_payload.sha || '' }}
          CODEBASE_HEALTH_B64: ${{ github.event.client_payload.codebase_health_b64 || '' }}
          SIT_VALIDATED_TREE: ${{ github.event.client_payload.sit_validated_tree || '' }}
          SIT_VALIDATED_WORKSPACE_DIGEST: ${{ github.event.client_payload.sit_validated_workspace_digest || '' }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          # SSOT write — the Firestore write must succeed (a failure reddens this run; the next
          # v2 event re-dispatches). STEP 2b: the writer slot's dedicated venv PRE-INSTALLS
          # google-cloud-firestore (probed on the box), so the per-run pip install is now a
          # verify-only no-op that self-heals if the venv is ever rebuilt without the lib.
          python3 -c "import google.cloud.firestore" 2>/dev/null \
            || python3 -m pip install --quiet "google-cloud-firestore>=2,<3"
          # Resolve the committer date of the tested sha (the stale-write ordering key for the
          # set_status guard) via the API — the consumer sha is NOT in PM's git history, so a local
          # `git show` cannot. Best-effort: an empty value leaves the guard inert for this write
          # (identical to a no-ts call), never blocking the write.
          COMMIT_TS=""
          if [ -n "${SHA}" ]; then
            COMMIT_TS=$(gh api "repos/${OWNER}/${REPO}/commits/${SHA}" --jq '.commit.committer.date' 2>/dev/null || echo "")
          fi
          # The store applies no-downgrade (resolve_status) + the stale-write ordering guard
          # (is_stale_write) inside a per-repo CAS transaction; --emit-transition prints the RESOLVED
          # "<prev>\t<written>" — what was ACTUALLY stored (a stale / no-downgrade rejection yields
          # written==prev). --codebase-health-b64 is merge-preserved; an empty blob is a no-op.
          TRANSITION=$(python3 scripts/cicd/ci_status_store.py "$REPO" "$STATUS" "$BRANCH" "$SHA" \
            --codebase-health-b64 "${CODEBASE_HEALTH_B64}" \
            --commit-ts "${COMMIT_TS}" \
            --sit-validated-tree "${SIT_VALIDATED_TREE}" \
            --sit-validated-workspace-digest "${SIT_VALIDATED_WORKSPACE_DIGEST}" \
            --emit-transition)
          PREV="$(printf '%s' "$TRANSITION" | cut -f1)"
          WRITTEN="$(printf '%s' "$TRANSITION" | cut -f2)"
          echo "ci_status/${REPO}: ${PREV} -> ${WRITTEN} (branch=${BRANCH:-none})"

          # Transition-gate the Slack notify on the STORED transition (prev -> written): a
          # stale-rejected / no-downgrade write (written == prev) must never fire a spurious recovery
          # alert. Same semantics as the legacy manifest writer — alert on a regression TO FAILING, a
          # recovery FROM FAILING, OR a transition INTO SIT_VALIDATED (steady-state + green↔green tier
          # moves are anti-spam). severity: a main-branch FAILING is CRITICAL (the promoted line is
          # red), any other FAILING is WARNING, a SIT-pass / recovery is INFO.
          SIT_PASS=false
          if [ "$WRITTEN" = "SIT_VALIDATED" ] && [ "$PREV" != "SIT_VALIDATED" ]; then SIT_PASS=true; fi
          # A genuine TRANSITION into FAILING (prev != FAILING) — NOT a steady-state re-confirmation.
          # Bug (fired 2026-06-26): the old `[ "$WRITTEN" = "FAILING" ]` clause lacked the prev-guard,
          # so every push to an already-red branch re-fired a spurious "is now FAILING (was FAILING)"
          # CRITICAL. The recovery clause was already transition-gated; this makes the regression clause
          # symmetric (the documented "steady-state is anti-spam" intent).
          FAIL_REGRESSION=false
          if [ "$WRITTEN" = "FAILING" ] && [ "$PREV" != "FAILING" ]; then FAIL_REGRESSION=true; fi
          # A genuine RECOVERY: we were FAILING and are no longer. Distinct from a routine green
          # (e.g. SIT_PASS into SIT_VALIDATED), which is normal activity nobody needs paged about.
          # Operator ruling 2026-07-18: "recovery is not a normal activity — the failure and the
          # recovery should be recorded at all times." A red that pages and then goes silent leaves
          # you unable to tell "fixed in 11 min" from "still broken 3 hours later" without going to
          # look (measured: deployment-ui went FAILING 10:31 and FEATURE_GREEN 10:43, and the green
          # was never sent because the notify job was gated `status == FAILING`).
          RECOVERED=false
          if [ "$PREV" = "FAILING" ] && [ "$WRITTEN" != "FAILING" ]; then RECOVERED=true; fi
          NOTIFY_WORTHY=false
          if [ "$FAIL_REGRESSION" = "true" ] || [ "$RECOVERED" = "true" ] || [ "$SIT_PASS" = "true" ]; then
            NOTIFY_WORTHY=true
          fi
          SEVERITY_CLASS=INFO
          if [ "$WRITTEN" = "FAILING" ]; then
            SEVERITY_CLASS=WARNING
            if [ "$BRANCH" = "main" ]; then SEVERITY_CLASS=CRITICAL; fi
          fi
          {
            echo "notify_worthy=${NOTIFY_WORTHY}"
            echo "recovered=${RECOVERED}"
            echo "prev_status=${PREV}"
            echo "written_status=${WRITTEN}"
            echo "severity_class=${SEVERITY_CLASS}"
            echo "sit_pass=${SIT_PASS}"
          } >> "$GITHUB_OUTPUT"

      # Event-driven LDR→staging cascade (was: only the 6h cron advanced one dep-tier
      # per run). When a repo reaches the staging line, its dependents become promotable
      # → re-fire ldr-to-staging-promote NOW instead of waiting up to 6h. The promoter's
      # concurrency group (cancel-in-progress:false) serialises runs and it no-ops when
      # nothing new is promotable, so the chain advances one tier per hop and
      # self-terminates. SSOT: ldr-to-staging-promote.yml (repository_dispatch: tier-ab-green).
      - name: Re-fire LDR→staging promoter on a staging-line transition
        if: steps.validate.outputs.skip != 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          PREV: ${{ steps.update.outputs.prev_status }}
          WRITTEN: ${{ steps.update.outputs.written_status }}
          REPO: ${{ github.event.client_payload.repo }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          # LOOP-GUARD (2026-06-15): re-fire ONLY on a genuine ci_status transition (prev != written,
          # the RESOLVED store transition — not the incoming payload, which the store may no-downgrade
          # /stale-reject). The ldr-to-staging promoter re-runs staging v2 on a repo it JUST promoted,
          # which re-enters here as STAGING_GREEN while prev is ALREADY STAGING_GREEN. An unconditional
          # re-fire turned that into a self-sustaining promote loop (drain-merge → staging push →
          # ci-status-update → tier-ab-green → drain-merge …) firing every ~40s, tripping the runaway
          # breaker fleet-wide. Steady-state (prev==written) is the bot re-confirming its own merge, NOT
          # new dev content, so it must not advance the cascade. Mirrors the notify transition-gate
          # above; the */15 ldr-to-staging-promote cron remains the backstop for genuine backlog.
          if [ "${PREV:-}" = "${WRITTEN}" ]; then
            echo "Steady-state $REPO ($PREV==$WRITTEN) — no transition; no re-fire (loop-guard)."
            exit 0
          fi
          case "$WRITTEN" in
            STAGING_GREEN | SIT_VALIDATED | MAIN_GREEN)
              echo "→ $REPO reached $WRITTEN; re-firing tier-ab-green to ldr-to-staging-promote"
              curl -sf -X POST \
                -H "Authorization: token ${GH_PAT}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${OWNER}/unified-trading-pm/dispatches" \
                -d "{\"event_type\":\"tier-ab-green\",\"client_payload\":{\"trigger_repo\":\"${REPO}\",\"trigger_status\":\"${WRITTEN}\"}}" \
                && echo "promoter re-fired" || echo "dispatch failed (non-fatal; 6h cron remains the backstop)"
              ;;
            *)
              echo "Status $WRITTEN is not a staging-line transition — no promoter re-fire."
              ;;
          esac

      - name: Persist CI/CD event
        # CI-cost STEP 2c, THE PRIZE CALLER (~14.3k runs/30d ⇒ the old separate `persist:` job alone
        # billed ~$86/mo at GitHub's 1-minute-per-job minimum). As the LAST step it is free on this
        # writer runner. Same skip-guard as the old job (`steps.validate.outputs.skip` is what the
        # job output `skip` maps from); `job.status` reproduces `conclusion:
        # needs.update-ci-status.result`. This job's existing full checkout satisfies the local
        # `uses: ./…` resolution — the STEP 2b slim-down (sparse checkout etc.) is a separate,
        # later change so this conversion stays one variable. secrets/vars passed explicitly.
        if: always() && steps.validate.outputs.skip != 'true'
        uses: ./.github/actions/persist-event
        with:
          repo_name: ${{ github.event.client_payload.repo }}
          workflow_name: ${{ github.workflow }}
          run_id: ${{ github.run_id }}
          conclusion: ${{ job.status }}
          branch: ${{ github.ref_name }}
          commit_sha: ${{ github.event.client_payload.sha }}
          details_json: '{"status": "${{ github.event.client_payload.status }}"}'
          cloud_provider: ${{ vars.CLOUD_PROVIDER }}
          events_bucket: ${{ vars.CICD_EVENTS_BUCKET }}
          gcp_sa_key: ${{ secrets.GCP_SA_KEY }}

  # ── BUILD MESSAGE BODY (decodes optional failure excerpt) ────────────────────
  build-message:
    name: Build notification message
    # CI-cost B1 + STEP 2b: the ~13k/mo ci_status writer. Runs GitHub-hosted (not the self-hosted
    # glue pool) — comment corrected 2026-08-07, see plans/archive/issues/glue_runner_health_monitor_github_token_403_2026_08_07.md
    runs-on: ubuntu-latest
    needs: [update-ci-status]
    # Only build/notify on a meaningful TRANSITION (regression to FAILING, or recovery
    # from FAILING). Steady-green + green<->green tier moves are suppressed (anti-spam).
    if:
      always() && needs.update-ci-status.outputs.skip != 'true' && needs.update-ci-status.outputs.notify_worthy ==
      'true'
    outputs:
      message: ${{ steps.build.outputs.message }}
    steps:
      - id: build
        env:
          REPO: ${{ github.event.client_payload.repo }}
          STATUS: ${{ github.event.client_payload.status }}
          PREV: ${{ needs.update-ci-status.outputs.prev_status }}
          BRANCH: ${{ github.event.client_payload.branch || '' }}
          SEVERITY_CLASS: ${{ needs.update-ci-status.outputs.severity_class }}
          SIT_PASS: ${{ needs.update-ci-status.outputs.sit_pass }}
          EXCERPT_B64: ${{ github.event.client_payload.failure_excerpt_b64 }}
          SHA: ${{ github.event.client_payload.sha || '' }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ "${STATUS}" = "FAILING" ]; then
            if [ "${BRANCH}" = "main" ]; then
              # A break on main = the released/promoted line is red → CRITICAL, distinct
              # from a staging-PR fail (caught pre-promotion). Make the branch explicit.
              MSG="🚨 CI REGRESSION on *main*: *${REPO}* is *FAILING* (was ${PREV}) — the promoted/main line is RED"
            else
              MSG="🔴 CI REGRESSION: *${REPO}* is now *FAILING* (was ${PREV})${BRANCH:+ [branch: ${BRANCH}]}"
            fi
          elif [ "${SIT_PASS}" = "true" ]; then
            # Explicit SIT-pass alert — SIT-green was previously only implied via promotion.
            # Wording fixed 2026-07-20 on two counts. (1) "staging→main" is stale: the fleet default is
            # LDR→main DIRECT with staging BYPASSED (all 24 repos are promotion_model=ldr_main), so it
            # named a hop that does not exist for this repo. (2) "clear to promote" was an unconditional
            # readiness claim this workflow is not entitled to make — actual clearance additionally
            # requires sit_validated_tree == the CURRENT LDR tree AND ci_status != FAILING, evaluated by
            # ldr-to-main-promote-fleet.yml. SIT's guarantee is content-scoped to the tree it saw; say
            # exactly that and let the promote gate be the arbiter.
            MSG="✅ SIT PASSED: *${REPO}* ${PREV} → *SIT_VALIDATED* (cross-repo API-surface contracts green on the LDR tree — NOT proof this repo's own quality-gates-v2 passed; the promote gate re-checks tree-match + ci_status before promoting)"
          else
            MSG="🟢 CI RECOVERED: *${REPO}* ${PREV} → *${STATUS}*"
          fi
          # Decode the QG failure excerpt (last 30 lines of QG output) into a code block.
          # Senders only populate failure_excerpt_b64 when STATUS=FAILING; double-check here.
          if [ -n "${EXCERPT_B64:-}" ] && [ "${STATUS}" = "FAILING" ]; then
            EXCERPT=$(printf '%s' "${EXCERPT_B64}" | base64 -d 2>/dev/null || true)
            if [ -n "${EXCERPT}" ]; then
              MSG=$(printf '%s\n\n*Failure excerpt (last lines of QG output):*\n```\n%s\n```' "${MSG}" "${EXCERPT}")
            fi
          fi
          # ── Push-author attribution (operator-approved 2026-06-02) ─────────────
          # Classification mirror of ci_failure_watcher.py::_classify_commit_data:
          #   automation  = committer is "github-actions[bot]" or "GitHub"
          #   background-agent = message contains "Co-Authored-By: Claude"
          #   human       = author name in {IggyIkenna, CosmicTrader} (case-insensitive)
          #   unknown     = anything else
          # Gracefully skips if SHA is empty or the gh api call fails.
          if [ -n "${SHA:-}" ]; then
            COMMIT_JSON=$(gh api "repos/${GITHUB_REPOSITORY_OWNER}/${REPO}/commits/${SHA}" \
              --jq '{author:.commit.author.name,committer:.commit.committer.name,message:.commit.message}' \
              2>/dev/null || true)
            if [ -n "${COMMIT_JSON:-}" ]; then
              COMMIT_AUTHOR=$(printf '%s' "${COMMIT_JSON}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('author',''))" 2>/dev/null || true)
              COMMIT_COMMITTER=$(printf '%s' "${COMMIT_JSON}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('committer',''))" 2>/dev/null || true)
              COMMIT_MESSAGE=$(printf '%s' "${COMMIT_JSON}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('message',''))" 2>/dev/null || true)
              COMMITTER_LC=$(printf '%s' "${COMMIT_COMMITTER}" | tr '[:upper:]' '[:lower:]')
              AUTHOR_LC=$(printf '%s' "${COMMIT_AUTHOR}" | tr '[:upper:]' '[:lower:]')
              MSG_LC=$(printf '%s' "${COMMIT_MESSAGE}" | tr '[:upper:]' '[:lower:]')
              if [ "${COMMITTER_LC}" = "github-actions[bot]" ] || [ "${COMMITTER_LC}" = "github" ]; then
                PUSHER_ROLE="automation"
                PUSHER_NAME="${COMMIT_AUTHOR}"
              elif printf '%s' "${MSG_LC}" | grep -q "co-authored-by: claude"; then
                PUSHER_ROLE="background-agent"
                PUSHER_NAME="${COMMIT_AUTHOR}"
              elif [ "${AUTHOR_LC}" = "iggyikenna" ] || [ "${AUTHOR_LC}" = "cosmictrader" ]; then
                PUSHER_ROLE="human"
                PUSHER_NAME="${COMMIT_AUTHOR}"
              else
                PUSHER_ROLE="unknown"
                PUSHER_NAME="${COMMIT_AUTHOR:-unknown}"
              fi
              MSG=$(printf '%s\n👤 pushed by %s [%s]' "${MSG}" "${PUSHER_NAME}" "${PUSHER_ROLE}")
            fi
          fi
          {
            echo "message<<MSGEOF"
            echo "${MSG}"
            echo "MSGEOF"
          } >> "$GITHUB_OUTPUT"

  # ── NOTIFICATION (Slack) ─────────────────────────────────────────────────────
  notify:
    name: Slack — CI Status Update
    needs: [update-ci-status, build-message]
    # Transition-gated (anti-spam): ping Slack on a regression TO FAILING or a genuine RECOVERY from
    # FAILING — and on nothing else.
    #
    # History: WS-2 (D3) dropped ALL green all-clears by gating `status == 'FAILING'`, to stop the
    # channel saying "everything is OK" on every run. That over-corrected: it also silenced the
    # recovery of a red that had PAGED. Measured 2026-07-18 — deployment-ui went FAILING at 10:31
    # (CRITICAL, paged) and recovered to FEATURE_GREEN at 10:43; the recovery was detected and
    # written to Firestore + the GCS ledger, but the Slack job was SKIPPED, so the operator saw a
    # CRITICAL that never closed. Operator ruling 2026-07-18: "we just don't need to know when normal
    # activities happen — recovery is NOT a normal activity; the failure and the recovery should be
    # recorded at all times."
    #
    # So: gate on FAILING **or** `recovered` (PREV=FAILING and no longer). A routine green — notably
    # SIT_PASS into SIT_VALIDATED, which is normal activity — is still NOT notified, because it sets
    # notify_worthy but not `recovered`. The carrier's own routine-green suppressor is the second
    # belt: a success/neutral INFO post is dropped unless `recovery: true` (passed below).
    if:
      always() && needs.update-ci-status.outputs.skip != 'true' && needs.update-ci-status.outputs.notify_worthy ==
      'true' && (github.event.client_payload.status == 'FAILING' || needs.update-ci-status.outputs.recovered == 'true')
    uses: ./.github/workflows/notify-slack.yml
    with:
      message: ${{ needs.build-message.outputs.message }}
      # This job runs IN unified-trading-pm (the fleet-wide ci-status consolidator) but reports on
      # the repo whose dispatch triggered it — without this the ledger's `repo` field wrongly
      # records unified-trading-pm as the alert's subject (deployment_alerts_ingestion_completeness
      # _2026_07_20.md todo 4; ~14.3k runs/30d, the highest-volume caller of this reusable workflow).
      subject_repo: ${{ github.event.client_payload.repo }}
      # severity + conclusion derive from the UNDERLYING repo's CI status, NOT this
      # meta-job's result. Otherwise FAILING repos render with ✅/Conclusion: success
      # because the manifest write itself succeeded. Manifest-job failure also flips to
      # failure so degraded ci-status writes don't mask under a green tick.
      # severity_class is computed by update-ci-status: CRITICAL for a main-branch FAILING
      # (worst case — the promoted line is red), WARNING for any other FAILING, INFO for a
      # SIT-pass / recovery. Falls back to the old status-only rule if unset.
      severity:
        ${{ needs.update-ci-status.outputs.severity_class || (github.event.client_payload.status == 'FAILING' &&
        'CRITICAL' || 'INFO') }}
      conclusion:
        ${{ (github.event.client_payload.status == 'FAILING' || needs.update-ci-status.result != 'success') && 'failure'
        || 'success' }}
      # Explicit recovery flag (belt-and-suspenders to the carrier's marker heuristic): true ONLY on the
      # recovery-FROM-FAILING transition (a green/INFO post that the routine-green gate would otherwise drop
      # if the message wording ever changed). A regression-TO-FAILING is a failure conclusion → always posts.
      # Uses the job's explicit `recovered` output (PREV=FAILING and no longer) rather than inferring from
      # `status != FAILING`, which would ALSO be true for a routine SIT_PASS green and wrongly mark it a
      # recovery — the carrier would then post it instead of dropping it as normal activity.
      recovery: ${{ needs.update-ci-status.outputs.recovered == 'true' }}
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets: inherit
