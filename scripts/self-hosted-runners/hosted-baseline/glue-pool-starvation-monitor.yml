name: glue-pool-starvation-monitor

# The cheapest-honest-signal dead-man-switch for the self-hosted `glue` runner pool.
#
# Root incident (2026-07-16/17): the `glue` pool went fully dead for 16h — all 5 runners
# crash-looping on a missing IAM grant, swallowed by a `|| true` — and NOT ONE alert fired. The
# only visible symptom was a generic `PROMOTION LAG > 60m` warning that read exactly like routine
# latency, so it was mis-triaged as "normal SIT latency". A naive "is the host up" check would
# ALSO have missed it: the sibling `glue-writer` pool lives on the same host and stayed healthy
# throughout, so host-level liveness cannot distinguish "the box is up" from "the `glue` pool
# specifically stopped picking up jobs".
#
# This workflow implements the issue doc's own design: alert when a `glue`-labelled job has been
# `queued` longer than the threshold while ZERO `glue` jobs are `in_progress` anywhere in the repo
# — unambiguous, and it needs no VM access.
#
# MUST run on a GitHub-hosted runner, never `glue` itself — see
# scripts/self-hosted-runners/classify-glue-workflows.sh KEEP_MONITORS: a dead-man-switch that ran
# on the pool it watches would go dark exactly when it is needed.
#
# SSOT: codex/04-architecture/ci-alerting.md (notify-slack.yml dedup contract).
# Source: issues/silent_failures_surfacing_as_generic_promotion_lag_2026_07_17.md
#         ([DEVOPS] P1 "A self-hosted pool with 0 runners listening must page on its OWN cause.")

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 min — the pool serves ~37 low-frequency movers; a starvation
      # episode should page well inside the hour, not once a day like the AR-lag check.
  workflow_dispatch:
    inputs:
      threshold_min:
        description: "Minutes a glue job may sit queued (while the pool is idle) before paging"
        default: "20"

permissions:
  contents: read
  actions: read

concurrency:
  group: glue-pool-starvation-monitor
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      starved: ${{ steps.scan.outputs.starved }}
      report: ${{ steps.scan.outputs.report }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Scan glue-pool queue depth
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THRESH: ${{ github.event.inputs.threshold_min || '20' }}
        run: |
          set +e
          REPORT=$(python3 scripts/cicd/glue_pool_starvation_monitor.py \
            --repo "${{ github.repository }}" --threshold-min "$THRESH" --slack)
          RC=$?
          echo "$REPORT"
          [ "$RC" -eq 1 ] && STARVED=true || STARVED=false
          {
            echo "starved=$STARVED"
            echo "report<<__EOR__"
            echo "$REPORT"
            echo "__EOR__"
          } >> "$GITHUB_OUTPUT"

  notify:
    needs: check
    if: needs.check.outputs.starved == 'true'
    uses: ./.github/workflows/notify-slack.yml
    with:
      message: ${{ needs.check.outputs.report }}
      severity: CRITICAL
      workflow_name: glue-pool-starvation-monitor
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Standing condition (the pool stays starved tick-to-tick until fixed) — page on the
      # false->true transition, re-remind every hour while it persists. Distinct from
      # promotion-lag's key so the two independent conditions never share a cooldown.
      dedup_key: glue-pool-starved
      cooldown_min: 60
    secrets: inherit
