name: reconcile-release-tags

# PM-only release-tag reconciler — closes the tag-creation gap in the release machinery (2026-06-11).
#
# WHY: the release flow had a MISSING LINK. semver-agent pushes `chore(release): bump version to X` to
# `staging` and dispatches the bump to PM (update-repo-version writes the manifest); `publish-package`
# triggers ON a `v*` tag — but NOTHING creates that tag. Every release tag to date was hand-created
# (`v0.4.0` by slot-1 2026-06-09; `v0.6.0`/`v0.6.1` during the 2026-06-11 keystone recovery). So a
# staging→main promotion — automated drain OR a manual `gh pr create --base main --head staging` — leaves
# `main` at the new version with no tag → `publish-package` never fires → consumers' version-aware dep-clone
# keeps resolving the stale tag (the exact dep-floor class that jammed the fleet 2026-06-11).
#
# WHAT: for every manifest repo, compare `main`'s `pyproject.toml` version to the existing `v*` tags and
# create the matching `vX.Y.Z` tag on `main` HEAD when absent. Idempotent (skips if the tag exists),
# path-independent (catches the automated drain AND a manual promote), guarded (never tags a pre-release or
# a version BELOW the latest tag — no backfill of a reverted version). Creating the tag is what then fires
# each repo's `publish-package` (`push: tags: v*`).
#
# SAFETY: only CREATES tags (never moves/deletes); a tag is created solely when `main`'s own source version
# has no matching tag, so it always agrees with the promoted source. SSOT:
# codex/08-workflows/ci-cd-flow.md § "Release tag reconciler".

on:
  schedule:
    - cron: "*/30 * * * *" # within ~30 min of a release reaching main → publish-package fires (relaxed */15→*/30 to cut Actions spend 2026-06-11)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what WOULD be tagged without creating"
        type: boolean
        required: false
        default: false
  repository_dispatch:
    types: [reconcile-release-tags]

permissions:
  contents: write

concurrency:
  group: reconcile-release-tags
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    outputs:
      stalled: ${{ steps.reconcile.outputs.stalled }}
      stall_report: ${{ steps.reconcile.outputs.stall_report }}
      cleared: ${{ steps.reconcile.outputs.cleared }}
      cleared_key: ${{ steps.reconcile.outputs.cleared_key }}
      cleared_report: ${{ steps.reconcile.outputs.cleared_report }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Restore release-tag stall state cache
        # Persists the stalled-repo set across runs so the RESOLVED bookend below can name WHICH
        # repo(s) just cleared (mirrors branch-health.yml's lag-monitor `.lag-state.json` cache).
        uses: actions/cache@v5
        with:
          path: .release-tag-stall-state.json
          key: release-tag-stall-state-${{ github.run_id }}
          restore-keys: |
            release-tag-stall-state-

      - name: Authenticate to GCP (Firestore repo-state write — best-effort)
        id: gcp_auth_tags
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Install Firestore SDK (best-effort)
        if: steps.gcp_auth_tags.outcome == 'success'
        continue-on-error: true
        run: python3 -m pip install --quiet "google-cloud-firestore>=2,<3"
      - name: Reconcile release tags
        id: reconcile
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          DRY=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          set +e
          # --max-creates 5: a one-time fleet backlog (≈20 untagged released versions, 2026-06-11) drains
          # over a few */15 ticks instead of firing 20 publish-package runs at once (shared-rate-limit safe);
          # a normal single release is well under the cap and tags within one tick.
          # --state-in/--state-out/--cleared-out/--stall-out: route the STALL verdict to Slack (2026-08-02)
          # instead of only a `::warning::` GH annotation nobody reads. SSOT: codex/04-architecture/ci-alerting.md.
          python3 scripts/cicd/reconcile_release_tags.py $DRY --max-creates 5 \
            --state-in .release-tag-stall-state.json \
            --state-out .release-tag-stall-state.next.json \
            --stall-out .release-tag-stall.txt \
            --cleared-out .release-tag-stall-cleared.txt
          RC=$?
          set -e
          # Persist the new stalled set (overwrite the restored prev) so the post-job cache save
          # carries it forward. Skip if the script did not write it (crash) — keep the prev rather
          # than wipe it.
          [ -f .release-tag-stall-state.next.json ] && mv -f .release-tag-stall-state.next.json .release-tag-stall-state.json
          STALLED=false
          STALL_REPORT=""
          if [ -s .release-tag-stall.txt ]; then
            STALLED=true
            STALL_REPORT=$(tail -n +2 .release-tag-stall.txt)
          fi
          CLEARED=false
          CLEARED_KEY=""
          CLEARED_REPORT=""
          if [ -s .release-tag-stall-cleared.txt ]; then
            CLEARED=true
            CLEARED_KEY=$(head -n 1 .release-tag-stall-cleared.txt)
            CLEARED_REPORT=$(tail -n +2 .release-tag-stall-cleared.txt)
          fi
          {
            echo "stalled=$STALLED"
            echo "stall_report<<__EOR__"
            echo "$STALL_REPORT"
            echo "__EOR__"
            echo "cleared=$CLEARED"
            echo "cleared_key=$CLEARED_KEY"
            echo "cleared_report<<__EOR__"
            echo "$CLEARED_REPORT"
            echo "__EOR__"
          } >> "$GITHUB_OUTPUT"
          exit $RC

  # ── Escalate to an agent (2026-08-12) ─────────────────────────────────────────────────
  # Previously Slack-only — confirmed via a fleet-wide audit of every CRITICAL/WARNING-
  # posting workflow cross-referenced against an actual escalate-to-orchestrator dispatch.
  # Fires alongside stall-notify (not gated on it) so a dispatch-failure never blocks the
  # Slack post; escalation.py's own server-side cooldown (dedup_key) absorbs repeat fires
  # on every */30 tick the stall persists, same as every other wall type. SSOT:
  # codex/04-architecture/agent-orchestrator-ci-escalation-wall-types.md.
  escalate:
    needs: reconcile
    if: needs.reconcile.outputs.stalled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch release_tag_stall escalation
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          STALL_REPORT: ${{ needs.reconcile.outputs.stall_report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -z "${GH_PAT}" ] && echo "GH_PAT not set — skipping escalation dispatch (Slack alert already fires separately)" && exit 0
          GH_TOKEN="${GH_PAT}" gh api "repos/${{ github.repository }}/dispatches" \
            -f event_type=escalate-to-orchestrator \
            -f "client_payload[repo]=${{ github.event.repository.name }}" \
            -f "client_payload[pr_number]=0" \
            -f 'client_payload[wall_type]=release_tag_stall' \
            -f "client_payload[context]=Release-tag reconciler found stalled repo(s): ${STALL_REPORT}. Run: ${RUN_URL}. For each: verify the semver-agent trigger actually resolves to real code (check source_dir against the repo's real package layout — a stall can mean the detector's own config is pointed at nothing, not just that no release happened), then either the tag genuinely needs a manual catch-up or the underlying minter is broken." \
            -f 'client_payload[model]=sonnet' \
            >/dev/null 2>&1 && echo "escalated release_tag_stall to orchestrator" \
            || echo "::warning::orchestrator escalation dispatch failed (non-fatal — Slack alert still fires)"

  stall-notify:
    needs: reconcile
    if: needs.reconcile.outputs.stalled == 'true'
    uses: ./.github/workflows/notify-slack.yml
    with:
      message: ${{ needs.reconcile.outputs.stall_report }}
      severity: WARNING
      workflow_name: reconcile-release-tags
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      dedup_key: release-tag-stall
      # A release-tag stall persists for days once it starts (the 2026-06-27 incident ran 26-29
      # days) — re-remind every ~6h (not every */30 tick) so a standing stall doesn't spam the
      # channel while still surfacing well inside a single workday.
      cooldown_min: 360
      # Distinct concurrency lane from stall-notify-resolved (both can fire in one run if some
      # repos clear while others newly stall).
      concurrency_suffix: stall
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

  stall-notify-resolved:
    needs: reconcile
    if: needs.reconcile.outputs.cleared == 'true'
    uses: ./.github/workflows/notify-slack.yml
    with:
      # Names the specific repo(s) that just cleared (per-set diff in reconcile_release_tags.py),
      # not a generic fleet all-clear.
      message: ${{ needs.reconcile.outputs.cleared_report }}
      severity: INFO
      recovery: true
      workflow_name: reconcile-release-tags
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      dedup_key: ${{ needs.reconcile.outputs.cleared_key }}
      cooldown_min: 60
      concurrency_suffix: stall-cleared
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
