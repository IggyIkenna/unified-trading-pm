# quality-gates-v2.yml — unified-trading-pm per-repo caller (v2, escapes GHA ghost cache)
#
# DESIGN: PM-specific caller for python-quality-gates-v2.yml. Unlike service repos that
# reference the remote PM ref (IggyIkenna/unified-trading-pm/.github/workflows/...@live-defi-rollout),
# PM calls the LOCAL reusable workflow (./.github/workflows/python-quality-gates-v2.yml)
# because PM IS the host — it cannot reference itself via a remote ref without a chicken-and-egg
# problem. The job key "quality-gates-v2" registers a fresh check context, bypassing the
# GitHub ghost-cache bug on the old "quality-gates" context (Option D).
#
# dep_repos: unified-trading-library unified-api-contracts
#   (mirrors sibling_deps in the legacy quality-gates.yml)

name: quality-gates-v2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

# Concurrency: cancel in-progress runs for the same ref on new push (saves Action minutes during
# rapid push cadence). PR runs serialize per-PR.
concurrency:
  group: quality-gates-v2-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  quality-gates-v2:
    name: Quality Gates (unified-trading-pm)
    uses: ./.github/workflows/python-quality-gates-v2.yml
    with:
      dep_repos: "unified-trading-library unified-api-contracts"
    secrets: inherit
    # Note: PM calls the LOCAL reusable workflow (not the remote PM ref) because
    # PM cannot reference itself via IggyIkenna/unified-trading-pm@<ref>. All other
    # service repos use the remote ref. This is the only repo where uses: is local.

  # Dispatch qg-passed to PM cloud-build-router on staging merge so Cloud Build runs the image build.
  # cloud-build-router.yml in PM listens for this event and triggers the GCP Cloud Build pipeline.
  dispatch-cloud-build:
    name: Dispatch cloud-build trigger (staging only)
    needs: quality-gates-v2
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch qg-passed → cloud-build-router
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_ORG: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Trigger cloud-build-router.yml in unified-trading-pm via repository_dispatch qg-passed
          curl -s -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GH_ORG}/unified-trading-pm/dispatches" \
            -d "{\"event_type\": \"qg-passed\", \"client_payload\": {\"repo\": \"${REPO}\", \"branch\": \"${BRANCH}\", \"commit_sha\": \"${COMMIT_SHA}\", \"repo_type\": \"pm\"}}"
          echo "Dispatched qg-passed for ${REPO}@${COMMIT_SHA} on ${BRANCH}"
