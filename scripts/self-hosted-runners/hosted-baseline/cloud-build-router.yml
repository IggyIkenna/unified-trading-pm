    # on EVERY staging QG pass for every non-library service (alerting-service, etc.) = pure noise about a
    # known-incomplete state. Gate to env=='prod' so the channel only pages when it's actionable; provision
    # staging triggers separately via `gcloud builds triggers create github --name='<repo>-staging' ...`
    # (NOT via `scripts/create-cloud-build-feature-triggers.sh` — that script creates feat/* feature-build
    # triggers named `<repo>-feature-build`, not staging/prod-deploy triggers) when ready.
    #
    # BUILD-ONLY PRE-CUTOVER (2026-06-21, alerts-triage L150 / orchestrator_human_central_vm_split):
    # the SAME reasoning now applies to PROD too. We are PRE live-cutover — core service/trading repos
