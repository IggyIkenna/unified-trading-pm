      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets: inherit

  # Alert when the unified-trading-library base-image publish trigger is missing (2026-07-25).
  # This is a NARROWER, ALWAYS-ON counterpart to notify-build-not-configured — that job is
  # correctly gated behind vars.CLOUD_BUILD_PROD_DEPLOY_EXPECTED (unset fleet-wide today) because
  # a missing <repo>-prod trigger is OFTEN an intentional pre-cutover build-only posture for a
  # trading-critical service. unified-trading-library-prod is never that: every service Dockerfile
  # FROMs this base image, so a missing/NOT_FOUND trigger here is ALWAYS a config bug, mirroring
  # notify-permission-denied's own "never an intentional pre-cutover state" reasoning immediately
  # above. Root cause (found 2026-07-25): unified-trading-library-prod went missing at/after
  # 2026-07-23T09:12:10Z and this exact WARNING sat silent for 51+ hours with zero alerting because
  # the only wired notification was the gated one — see
  # plans/active/issues/utl_prod_cloud_build_trigger_missing_fleet_stale_base_image_2026_07_25.md.
  # dedup_key + a long cooldown converts "page on every UTL main push while the trigger stays
  # missing" into "page once on the transition, then again if it's still broken after a full day".
  notify-utl-base-image-not-configured:
    name: Slack — UTL Base-Image Trigger Not Configured
    needs: [route-build]
    if: |
      always() &&
      needs.route-build.outputs.repo == 'unified-trading-library' &&
      needs.route-build.outputs.repo_type != 'library' &&
      needs.route-build.outputs.build_triggered == 'false' &&
      needs.route-build.outputs.build_failure_reason == 'not-configured'
    uses: ./.github/workflows/notify-slack.yml
    with:
      message:
        "unified-trading-library-prod Cloud Build trigger did not fire — the base Docker image every service Dockerfile
        FROMs has stopped republishing. This is NEVER an intentional pre-cutover state (unlike other repos' prod
        triggers). Actual error: `${{ needs.route-build.outputs.build_error_detail }}`. If that says NOT_FOUND, the
        trigger itself is gone — recreate `unified-trading-library-prod` in GCP project central-element-323112, region
        asia-northeast1 (mirror instruments-service-prod's config). Any OTHER error (e.g. INVALID_ARGUMENT /
        source.revision) means the trigger exists but the router's `gcloud builds triggers run` invocation itself is
        failing — check `cloud-build-router.yml`'s `trigger_build_in_region` first, do NOT assume the trigger is
        missing. See plans/active/issues/utl_prod_cloud_build_trigger_missing_fleet_stale_base_image_2026_07_25.md."
      subject_repo: unified-trading-library
      severity: "CRITICAL"
      conclusion: "failure"
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      dedup_key: "cloud-build-not-configured:unified-trading-library-prod"
      cooldown_min: 1440
    secrets: inherit

  # ── UTL CLOUD-BUILD RESULT MEMORY — recovered bookend (operator ruling 2026-07-27) ──────────
  # notify-utl-base-image-not-configured (above) has no green counterpart, same class of gap as
  # python-quality-gates-v2.yml's notify-qg-fail before its own recovered-bookend fix earlier
  # today: it pages CRITICAL when the trigger call fails but never says anything when a later
  # dispatch succeeds, so a fixed pipeline reads as "still broken" until someone checks by hand
  # (exactly what happened after the --branch fix above — the fix was verified with a real prod
  # build, but nothing in this workflow would have announced it). Tracks its own state in a
  # dedicated Firestore doc (`cloud_build_last_conclusion/{key}`, key mirrors the existing
  # dedup_key shape) — separate from ci_status, same reasoning as the QG fix: this only answers
  # "did unified-trading-library-prod's build verdict just flip not-configured -> success?".
  # Best-effort/fail-open: an auth/network hiccup only costs a missed recovery post.
  record-cloud-build-result:
    name: Record UTL Cloud Build result (recovery memory)
    needs: [route-build]
    if: |
      always() &&
      needs.route-build.outputs.repo == 'unified-trading-library' &&
      needs.route-build.outputs.repo_type != 'library'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      recovered: ${{ steps.decide.outputs.recovered }}
    steps:
      - name: Authenticate to GCP (state doc read+write)
        id: gcp_auth
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          token_format: access_token
      - name: Read prior verdict, decide recovery, persist current verdict
        id: decide
        shell: bash
        env:
          TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
          PROJECT: ${{ steps.gcp_auth.outputs.project_id }}
          BUILD_TRIGGERED: ${{ needs.route-build.outputs.build_triggered }}
          BUILD_EXIT_CODE: ${{ needs.route-build.outputs.build_exit_code }}
          FAILURE_REASON: ${{ needs.route-build.outputs.build_failure_reason }}
        run: |
          set -uo pipefail
          # Only the two states notify-utl-base-image-not-configured actually cares about update
          # the memory — a genuine full-pipeline SUCCESS (triggered AND polled to exit 0), or the
          # exact 'not-configured' failure that job pages on. Any other outcome (permission-denied,
          # a real Cloud Build FAILURE/TIMEOUT once triggered, POLL_EXHAUSTED) is a DIFFERENT
          # problem class with its own dedicated alert job — leave the memory untouched so it can't
          # manufacture a false 'recovered' out of an unrelated failure mode clearing.
          CURRENT=""
          if [ "${BUILD_TRIGGERED}" = "true" ] && [ "${BUILD_EXIT_CODE}" = "0" ]; then
            CURRENT=success
          elif [ "${FAILURE_REASON}" = "not-configured" ]; then
            CURRENT=failure
          else
            echo "build_triggered=${BUILD_TRIGGERED} build_exit_code=${BUILD_EXIT_CODE} failure_reason=${FAILURE_REASON} — not a tracked state, leaving memory untouched"
            echo "recovered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RECOVERED=false
          if [ -n "${TOKEN:-}" ] && [ -n "${PROJECT:-}" ]; then
            DOC_URL="https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/cloud_build_last_conclusion/cloud-build_unified-trading-library-prod"
            PREV="$(curl -s --max-time 15 -H "Authorization: Bearer ${TOKEN}" "${DOC_URL}" \
              | jq -r '.fields.conclusion.stringValue // empty' 2>/dev/null || echo "")"
            if [ "${PREV}" = "failure" ] && [ "${CURRENT}" = "success" ]; then
              RECOVERED=true
            fi
            NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            CODE="$(curl -s -o /tmp/cb-result-save.json -w '%{http_code}' --max-time 15 -X PATCH \
              -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" \
              "${DOC_URL}" \
              -d "{\"fields\": {
                    \"conclusion\": {\"stringValue\": \"${CURRENT}\"},
                    \"updated_at\": {\"timestampValue\": \"${NOW}\"}
                  }}" || echo 000)"
            [ "${CODE}" = "200" ] || echo "::warning::cloud_build_last_conclusion save failed (HTTP ${CODE}) — best-effort, next run retries."
            echo "cloud-build-result-memory: prev=${PREV:-<none>} current=${CURRENT} recovered=${RECOVERED}"
          else
            echo "GCP auth unavailable — skipping Cloud Build result memory this run (fail-open)."
          fi
          echo "recovered=${RECOVERED}" >> "$GITHUB_OUTPUT"

  notify-utl-base-image-recovered:
    name: Slack INFO — UTL Base-Image Trigger Recovered
    needs: [route-build, record-cloud-build-result]
    if: always() && needs.record-cloud-build-result.outputs.recovered == 'true'
    uses: ./.github/workflows/notify-slack.yml
    with:
      message:
        "🟢 *unified-trading-library-prod Cloud Build RECOVERED* — the base Docker image is publishing again (build
        succeeded after a prior not-configured failure). <${{ github.server_url }}/${{ github.repository
        }}/actions/runs/${{ github.run_id }}|run>"
      subject_repo: unified-trading-library
      severity: "INFO"
      conclusion: "success"
      recovery: true
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      dedup_key: "cloud-build-recovered:unified-trading-library-prod"
      cooldown_min: 15
    secrets: inherit

  # Route instruments-service build failures to #data-pipeline-alerts (2026-06-26).
  # instruments-service builds the image used by all Cloud Run data-pipeline jobs
  # (sports-trigger-instruments, catalogue refresh, etc.). A build failure means jobs
  # will run stale code — a data-pipeline correctness event, not just a CI event.
  # Posts to #data-pipeline-alerts via the DATA_PIPELINE_ALERTS_SLACK_WEBHOOK SM secret
  # (project central-element-323112). Both build FAILURE (exit_code=1) and poll
  # exhaustion (exit_code=2) are routed. Success is quiet (no post to data-pipeline channel).
  # The existing notify-build-failed job still posts to #ci-failures — this is additive.
  notify-instruments-build-data-pipeline:
    name: "#data-pipeline-alerts — instruments-service build failure"
    needs: [route-build]
    if: |
      always() &&
      needs.route-build.outputs.repo == 'instruments-service' &&
      needs.route-build.outputs.repo_type != 'library' &&
      (needs.route-build.outputs.build_exit_code == '1' || needs.route-build.outputs.build_exit_code == '2')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Auth to GCP to read DATA_PIPELINE_ALERTS_SLACK_WEBHOOK from Secret Manager.
      # WIF preferred, SA key fallback — mirrors cloud-build-router's own auth pattern.
      - name: Authenticate to GCP via WIF (preferred)
        id: auth-wif
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to GCP via SA key (fallback)
        id: auth-key
        if: steps.auth-wif.outcome != 'success'
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v3

      - name: Post to #data-pipeline-alerts
        # Best-effort: a missing webhook or SM auth failure must NEVER fail the caller.
        # All inputs are passed via environment variables (shell-set + GHA expressions) so
        # the inline python3 heredoc reads them safely from os.environ without injection risk.
        continue-on-error: true
        env:
          GCP_PROJECT: central-element-323112
          REPO: ${{ needs.route-build.outputs.repo }}
          ENV: ${{ needs.route-build.outputs.env }}
          BRANCH: ${{ needs.route-build.outputs.branch }}
          BUILD_EXIT_CODE: ${{ needs.route-build.outputs.build_exit_code }}
          BUILD_FAILURE_REASON: ${{ needs.route-build.outputs.build_failure_reason }}
          BUILD_LOG_URL: ${{ needs.route-build.outputs.build_log_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Fetch webhook URL from Secret Manager (best-effort — fail-open if SM unreadable).
          WEBHOOK_URL=$(gcloud secrets versions access latest \
            --secret="DATA_PIPELINE_ALERTS_SLACK_WEBHOOK" \
            --project="${GCP_PROJECT}" 2>/dev/null || echo "")

          if [ -z "${WEBHOOK_URL}" ]; then
            echo "WARNING: DATA_PIPELINE_ALERTS_SLACK_WEBHOOK unreadable from SM — skipping #data-pipeline-alerts post (best-effort)"
            exit 0
          fi

          case "${WEBHOOK_URL}" in
            https://*) : ;;
            *) echo "WARNING: fetched webhook is not an https URL — skipping (best-effort)"; exit 0 ;;
          esac

          # Determine severity and label from build exit code.
          if [ "${BUILD_EXIT_CODE}" = "1" ]; then
            SEVERITY=":rotating_light: *CRITICAL*"
            REASON_LABEL="${BUILD_FAILURE_REASON:-FAILURE}"
          else
            SEVERITY=":warning: *WARNING*"
            REASON_LABEL="POLL_EXHAUSTED (build may still be running)"
          fi

          # Export shell-computed values so the quoted heredoc python3 sees them.
          export WEBHOOK_URL SEVERITY REASON_LABEL

          python3 - <<'PYEOF'
          import json, os, sys, urllib.request

          webhook    = os.environ["WEBHOOK_URL"]
          repo       = os.environ.get("REPO", "instruments-service")
          env        = os.environ.get("ENV", "prod")
          branch     = os.environ.get("BRANCH", "main")
          severity   = os.environ.get("SEVERITY", ":rotating_light: *CRITICAL*")
          reason     = os.environ.get("REASON_LABEL", "FAILURE")
          log_url    = os.environ.get("BUILD_LOG_URL", "")
          run_url    = os.environ.get("RUN_URL", "")

          msg = (
              f"{severity} — *instruments-service image build {reason}*\n"
              f"Cloud Run data-pipeline jobs (sports-trigger-instruments, catalogue, etc.) "
              f"will run a *stale image* until this build is resolved.\n"
              f"• Repo: `{repo}` | Env: `{env}` | Branch: `{branch}`\n"
              + (f"• Build log: <{log_url}|View Cloud Build log>\n" if log_url else "")
              + (f"• CI run: <{run_url}|View GHA run>\n" if run_url else "")
              + "• Action: re-push to main or re-run the `instruments-service-prod` Cloud Build trigger."
          )

          blocks = [
              {"type": "section", "text": {"type": "mrkdwn", "text": msg}},
          ]
          if run_url:
              blocks.append({"type": "context", "elements": [{"type": "mrkdwn", "text": f"<{run_url}|View CI run>"}]})

          payload = json.dumps({
              "text": f":rotating_light: instruments-service image build {reason} — data pipeline jobs at risk",
              "blocks": blocks
          }).encode()

          req = urllib.request.Request(
              webhook,
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST"
          )
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  print(f"Posted to #data-pipeline-alerts (HTTP {resp.status})")
          except Exception as e:
              print(f"#data-pipeline-alerts post failed: {e}", file=sys.stderr)
              sys.exit(1)
          PYEOF
