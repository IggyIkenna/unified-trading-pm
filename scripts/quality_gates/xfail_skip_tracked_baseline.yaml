doc: Known xfail/skip markers whose reason does NOT cite a tracked plan/issue slug.
why:
  Every pytest.xfail / unconditional @pytest.mark.skip must cite a tracked plan/issue slug in its reason — an xfail with
  a good reason and no remediation todo is indistinguishable, six months later, from coverage that was never written.
  These are the CURRENT violations, tolerated as WARNINGS; they must shrink to zero (each entry is removed the moment
  its marker cites a real slug or the test is fixed to run). Never ADD a new entry.
status_explanation: pending_removal = known violation, must be fixed, tolerated as a warning.
default_successor: cite a tracked plan/issue slug in the xfail/skip reason, or fix the test so it runs
