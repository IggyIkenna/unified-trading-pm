# Baseline for QG STEP 5.95 — ruff DTZ (UTC-datetime) + TID251 (cloud-SDK) count ratchet.
#
# This is a SHRINKING ratchet. `repos[<repo>].{dtz,tid251}` is the number of
# ruff violations (tests/ excluded; UTL cloud_interface/ exempt for tid251)
# the gate tolerates in that repo. A repo whose live count EXCEEDS its
# baseline fails CI — a NEW naive-datetime / direct-SDK site landed; fix it
# (`datetime.now(timezone.utc)` / `get_storage_client()`), or add a ruff
# `# noqa: DTZ00x` / `# noqa: TID251` with a one-line reason.
#
# LOWER counts (re-run `--update-baseline`) as violations are fixed.
# NEVER raise a count. Repos not listed default to 0.
