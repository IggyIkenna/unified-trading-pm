# Baseline for QG STEP 5.5 — broad `except Exception[ as X]:` ratchet.
#
# This is a SHRINKING ratchet. `repos[<repo>].count` is the number of
# `except Exception:` / `except Exception as X:` sites (WITHOUT a
# `# noqa: broad-except` marker) the gate tolerates in that repo (tests/
# excluded; scripts/ INCLUDED). A repo whose live count EXCEEDS its
# baseline fails CI — a NEW broad-except site landed; narrow to the
# specific exception type(s) the block actually expects, or add
# `# noqa: broad-except` on the `except` line with a one-line reason.
#
# LOWER a count (re-run `--update-baseline`) the moment sites are narrowed.
# NEVER raise a count. Repos not listed default to count=0.
