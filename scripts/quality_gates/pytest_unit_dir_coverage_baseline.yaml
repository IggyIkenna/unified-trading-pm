  plans/active/issues/mtds_ungated_test_families_2026_07_17.md todo 5 follow-up): the checker''s scan widened from
  tests/<family>/unit/-only to any dir holding a test_*.py file (see check_pytest_unit_dir_coverage.py''s module
  docstring for why — it missed unified-trading-pm''s own scripts/plan-hygiene/, 24 tests across 4 files, fixed in
  4a4716151f). The 6 counts below that increased are NOT new debt landing now — they are pre-existing gaps v1 was
  structurally blind to (measured + spot-checked real, e.g. execution-service tests/sports_execution/unit/ was ALREADY
  known-gapped per this note''s original text, just undercounted at 1 instead of the true 8 sub-paths;
  unified-api-contracts scripts/test_mock_loading.py, unified-trading-library''s ml/tests + testing/, PM''s own
  github-integration/tests/, instruments-service tests/scripts/, e2e-testing''s 4 dirs — all confirmed real test_*.py
