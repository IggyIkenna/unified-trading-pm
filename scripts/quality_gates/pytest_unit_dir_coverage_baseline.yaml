# Baseline for the PYTEST_UNIT_DIR coverage fleet sweep — SHRINKING ratchet.
#
# repos[<repo>] is the number of directories anywhere in that repo holding a
# test_*.py file this checker tolerates as UNGATED (not reachable via that
# repo's PYTEST_UNIT_DIR) — NOT limited to tests/<family>/unit/ shapes; a
# co-located scripts/<name>/test_*.py dir counts too (v2, 2026-08-15 — v1's
# tests/<family>/unit/-only scan missed unified-trading-pm's own
# scripts/plan-hygiene/ shipping 24 uncollected tests, see check_pytest_unit_
# dir_coverage.py's module docstring). A repo whose live ungated-dir count
# EXCEEDS its baseline fails the gate — a NEW test dir landed without being
# wired into PYTEST_UNIT_DIR (the exact MTDS bug this checker exists to catch).
# Fix by adding the test dir (or its parent) to that repo's
# `PYTEST_UNIT_DIR=` in scripts/quality-gates.sh, proving the widened gate
# is still GREEN (rule 11a), then re-run `--update-baseline`.
#
# LOWER counts as dirs get gated. NEVER raise a count. Repos not
# listed (or not using the PYTEST_UNIT_DIR contract) default to 0.
#
# SSOT: plans/active/issues/mtds_ungated_test_families_2026_07_17.md
# (todo 5) + plans/active/ci_satellite_ao_dispatch_batch2_2026_07_29.md
# (todo 12).
note:
