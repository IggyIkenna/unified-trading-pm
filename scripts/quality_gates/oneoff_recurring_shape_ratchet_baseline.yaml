# Baseline for the oneoff-recurring-shape ratchet.
#
# This is a SHRINKING ratchet. `repos[<repo>].count` is the number of
# `scripts/` files carrying `# Lifecycle: oneoff` whose basename matches a
# Phase 0b canonical-template operation shape (purge/canonicalize/
# reconcile/backfill/audit — the founding plan's own §Discovery regex),
# without a `# QG-allow:` marker on that line. A repo whose live count
# EXCEEDS its baseline fails: a NEW oneoff-marked, shape-matching script
# landed — adapt the matching `deployment-service/scripts/migrations/lib/
# templates/template_*.py` instead, or add `# QG-allow: <reason>` if it
# genuinely isn't shape-matching despite the name.
#
# LOWER a count (re-run --update-baseline) as legacy files get resolved
# (relocated + wired to a template, or deleted once genuinely dead).
# NEVER raise a count. Repos not listed default to count=0.
#
# SSOT: /codex/05-infrastructure/migration-script-ssot.md.
