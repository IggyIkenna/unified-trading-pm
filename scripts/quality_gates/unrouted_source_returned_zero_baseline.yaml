# Baseline for QG STEP 5.86 — fleet-wide SOURCE_RETURNED_ZERO routing ratchet (A10c-fleet).
#
# Each entry: `baseline[<workspace-relative-file>].count` = MAX allowed count of unrouted
# `record_empty(...SOURCE_RETURNED_ZERO...)` callsites (no inline `# QG-allow:` waiver) in that
# file. The gate FAILS (exit 1) for any file whose live count EXCEEDS its baseline (a NEW
# unrouted callsite) OR any non-baselined file with >0 unrouted callsites.
#
# This is a GRIND-DOWN ratchet: migration to `record_zero_rows` only LOWERS counts (always
# passes). After an AG migrates, re-run `--regenerate-baseline` to LOCK the lower count so a
# re-added raw callsite fails. A genuinely-typed-reason callsite where `record_zero_rows` does
# not apply (service-output / computed output / pipeline-mode-not-applicable) gets an inline
# `# QG-allow: <reason>` marker instead of a baseline entry.
#
# DO NOT hand-edit; auto-generated by check_unrouted_source_returned_zero.py --regenerate-baseline.
#
