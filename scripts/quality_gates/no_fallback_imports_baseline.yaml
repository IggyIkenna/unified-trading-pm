# Baseline for QG STEP 5.94 — try/except-ImportError fallback-import ratchet.
#
# This is a SHRINKING ratchet. `repos[<repo>].count` is the number of
# `try: import X … except (ImportError|ModuleNotFoundError|broad)` fallback
# shims (WITHOUT a `# noqa: fallback-import` marker) the gate tolerates in
# that repo (tests/ excluded; scripts/ INCLUDED). A repo whose live count
# EXCEEDS its baseline fails CI — a NEW shim landed; import directly +
# declare the dep in pyproject, or add `# noqa: fallback-import` on the
# try: line with a one-line reason.
#
# LOWER a count (re-run `--update-baseline`) the moment shims are removed.
# NEVER raise a count. Repos not listed default to count=0.
#
# SSOT: .cursor/rules/standards/no-empty-fallbacks.mdc § 'No try/except
# ImportError Fallbacks' + plans/active/harden_grepable_rules_into_ci_gates_2026_06_02.md.
