# Baseline for QG STEP 5.69 — inline `f"gs://..."` / `f"s3://..."` cloud-URI formatter ratchet.
#
# This is a SHRINKING ratchet. `repos[<repo>].count` is the number of inline
# `f"gs://...`/`f"s3://...` formatters (WITHOUT a `# noqa: gs-uri` marker) the
# gate tolerates in that repo's service source (scripts/ + tests/ excluded). A
# repo whose live count EXCEEDS its baseline fails CI — a NEW inline formatter
# landed; route it through `unified_trading_library.cloud_interface.bucket_naming.
# resolve_bucket_uri(...)` or add `# noqa: gs-uri` with a one-line reason.
#
# LOWER a count (re-run `--update-baseline`) the moment a migration removes inline
# formatters — e.g. when the to-be-removed inline bucket-name templates land in
# code_freeze Phase 2.6 (bucket_name_ssot_canonicalisation_2026_05_10.md Done-def
# #3 / GAP-2.4.D deployment-api reader-repoint). NEVER raise a count.
#
# Repos not listed default to count=0 (zero tolerance — any inline formatter fails).
#
# SSOT for WHY: CLAUDE.md "Bucket-name SSOT (b+)" + bucket_name_ssot_canonicalisation_2026_05_10.md
# (pre-audit manifest Layers 1-5 + "QG STEP 5.6X design"). The `# noqa: gs-uri` marker
# convention is documented in execution-service/BYPASS_AUDIT.md + strategy-service/pyproject.toml.
