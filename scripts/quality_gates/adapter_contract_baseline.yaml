# Baseline for QG STEP 5.83 — adapter contract-call regression ratchet (per-file).
#
# Each entry: `baseline[<workspace-relative-file>].count` = minimum required
# count of the 5 adapter-contract patterns in that file:
#   classify_venue_error | ADAPTER_FETCH_FAILED | record_captured | record_empty | record_failed
#
# The gate fails (exit 1) for any file whose live count is BELOW its baseline.
# Files NOT listed are reported as INFO on a workspace scan; the operator
# decides when to add them via `--regenerate-baseline`.
#
# This is a NON-SHRINKING ratchet. A lower count is always a regression. To
# RAISE a baseline (legit refactor intentionally adds contract calls) or to
# LOWER a baseline (file was deleted / contract calls intentionally consolidated):
# re-run with `--regenerate-baseline` from a known-good HEAD.
#
# DO NOT manually edit; the file is auto-generated.
