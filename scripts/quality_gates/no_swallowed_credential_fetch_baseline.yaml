# Baseline for check_no_swallowed_credential_fetch.py.
#
# This is a SHRINKING ratchet. `repos[<repo>].count` is the number of
# `2>/dev/null || true`-wrapped credential-fetch sites (WITHOUT a
# `# noqa: swallowed-credential-fetch` marker) the checker tolerates in
# that repo's `scripts/` dir. A repo whose live count EXCEEDS its baseline
# fails — a NEW swallow site landed; fail loud instead, or add
# `# noqa: swallowed-credential-fetch` with a one-line reason.
#
# LOWER a count (re-run `--update-baseline`) the moment sites are fixed.
# NEVER raise a count. Repos not listed default to count=0.
