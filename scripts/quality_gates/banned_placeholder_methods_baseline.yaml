  # writes the candle parquet directly via storage_client.upload_bytes(...) WITHOUT
  # routing through record_captured / the 4-pillar write-gate — but the class is not
  # instantiated anywhere on a live path (the live candle-write path is
  # CandleWriteMixin._write_candles → canonical_writer → record_captured per MRO; the
  # only references to OutputWriterService are its own class def + a doc-comment in
  # output_path_helpers.py). Baselined-as-warning so a NEW candle-module upload_bytes
  # bypass still fails CI; the residual occurrence clears when the dead class is deleted.
  - repo: market-data-processing-service
    file: market_data_processing_service/app/core/output_writer_service.py
    method: upload_bytes
    status: pending_removal
    successor:
      "writegate Phase 2.A — delete the dead OutputWriterService class (output_writer_service.py); the live
      candle-write path is CandleWriteMixin._write_candles → canonical_writer → record_captured"
