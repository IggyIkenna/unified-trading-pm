# Baseline for QG STEP 5.101 — .get("key", "") empty-string-fallback ratchet.
#
# This is a SHRINKING ratchet. `repos[<repo>].count` is the number of
# `.get("key", "")` / `.get('key', '')` empty-string-fallback call sites
# (WITHOUT a `# noqa: qg-empty-fallback` marker) the gate tolerates in that
# repo (tests/ + testing/ excluded). A repo whose live count EXCEEDS its
# baseline fails CI — a NEW site landed; rewrite it to fail fast (raise, or
# return None and let the caller decide), or add `# noqa: qg-empty-fallback`
# with a one-line reason for a genuinely deliberate, safe case.
#
# LOWER a count (re-run `--update-baseline`) the moment sites are fixed.
# NEVER raise a count. Repos not listed default to count=0.
#
# `repos[<repo>].commit` is that repo's own HEAD sha at the moment `count`
# was last set — used to git-diff-detect genuinely NEW over-baseline sites
# instead of an arbitrary positional tail-slice. Set automatically by
# `--update-baseline`; do not hand-edit.
#
