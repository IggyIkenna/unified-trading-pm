# Baseline for check_cloudbuild_template_drift.py.
#
# This is a SHRINKING ratchet. `repos[<repo>].count` is the number of
# content markers (whole steps, secretEnv/availableSecrets entries, step
# args/script lines) that repo's committed cloudbuild.yaml carries which
# its mapped configs/cloudbuild-*-template.yaml render does NOT. A repo
# whose live count EXCEEDS its baseline fails — the template fell FURTHER
# behind this repo (a new divergence landed).
#
# LOWER a count (re-run `--update-baseline`) the moment the template is
# forward-ported or the consumer is reconciled. NEVER raise a count.
# Repos not listed default to count=0. Intentional per-repo drift (e.g.
# deployment-api's vendor-deps/deploy/redeploy-monitor-jobs steps) is
# expected to live here PERMANENTLY, baselined rather than "fixed".
#
# SSOT: plans/active/issues/cloudbuild_template_behind_repos_rollout_would_regress_fleet_2026_07_20.md
# + plans/active/ci_satellite_ao_dispatch_batch1_2026_07_26.md.
# + plans/active/ci_satellite_ao_dispatch_batch5_2026_08_02.md (todo 1 — 2026-08-06).
#
# 2026-08-06: ratcheted DOWN fleet-wide by batch5 todo 1 (the re-scoped cloudbuild
# empty-tag-guard rollout). Template forward-ports landed (fetch-tags step, _RUN_INIMAGE_QG
# guard, auth-precheck gar_token persistence, publish-wheel git+hatch-vcs pin, api-template
# authenticated extract-version + availableSecrets, ui-template pnpm quality-gates, guard in
# api/infra/ui templates) and the empty-tag guard was hand-applied to every consumer's build
# step. The residual counts below are the category-(b) INTENTIONAL per-repo divergence set:
#   - deployment-api (16): the baseline's archetype — bespoke vendor-deps / deploy /
#     redeploy-monitor-jobs / operability-probe / fetch-ui steps + custom build (list-args ->
#     bash, SCM_PRETEND_VERSION=0.0.0) + custom pull-base-image / quality-gates / auth-precheck.
#   - execution-service (10): operability-probe, stage-siblings (vendored dep staging), custom
#     build (plain SCM arg vs template's dist-specific form) + extract-version / publish-wheel.
#   - features-service (12): operability-probe, redeploy-features-jobs, fetch-tags (hardcoded
#     REMOTE), custom build/extract-version/publish-wheel text.
#   - batch-live-reconciliation-service (9): operability-probe, fetch-tags, custom build.
#   - market-tick-data-service (8): image-import-smoke + stage-workspace-deps (dep-skew gates),
#     custom build/extract-version text.
#   - alerting/greeks/instruments/ml/strategy/trading-agent (5-8): operability-probe (per-service
#     health probe — probe target differs per service, not expressible in one template block),
#     plus per-service build/extract-version comment variations.
#   - client-reporting-api (3) / fund-admin + market-data-processing (5): custom api/service
#     build + auth-precheck text.
#   - ibkr-gateway-infra (1): build-wheel text variation.
# These are DELIBERATE per-repo customizations (baselined, never "fixed"); the template render
# is still refused for them by the rollout tool's would-drop-content guard, so their future
# cloudbuild edits must stay hand-applied or be forward-ported first.
