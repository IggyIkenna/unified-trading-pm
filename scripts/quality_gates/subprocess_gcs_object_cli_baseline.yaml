# Baseline for QG STEP 5.105 — subprocess/os.system GCS/S3 object-CLI ratchet.
#
# SHRINKING ratchet. `repos[<repo>].count` is the number of subprocess/os.system
# call sites invoking an OBJECT-level gcloud storage/gsutil/aws s3/s3api operation
# (WITHOUT a `# noqa: gcs-cli` marker) this gate tolerates in that repo. A repo
# whose live count EXCEEDS its baseline fails CI -- migrate to UTL's
# gcs_copy_object/gcs_delete_object/gcs_describe_object/list_blobs
# (unified_trading_library.cloud_interface), or add `# noqa: gcs-cli` with a
# one-line reason. NEVER raise a count.
