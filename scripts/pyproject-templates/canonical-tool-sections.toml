# Canonical pyproject [tool.*] sections — workspace SSOT for Python tooling.
#
# Decisions (2026-05-26, tooling_config_standardization_2026_05_26.md):
#   * ALL Python tool config lives in pyproject.toml (TOML). NO pyrightconfig.json,
#     NO ruff.toml, NO .coveragerc, NO [tool.mypy] (basedpyright is a superset of
#     the mypy functionality we use; none of the old mypy blocks used plugins).
#   * basedpyright is CONSOLIDATED here (delete every repo's pyrightconfig.json).
#     pyright honours [tool.basedpyright] once the JSON is gone, and QG STEP 5.21
#     already lints this section — so runtime + gate become consistent + strict.
#   * Build backend = hatchling (workspace standard; no setuptools).
#   * Per-repo variables are marked <LIKE_THIS>; per-TYPE floors are noted inline.
#   * pre-commit stays in .pre-commit-config.yaml (tool-mandated YAML).
#
# Rollout: merge these sections into each repo's pyproject.toml, fill the <...>
# placeholders, delete pyrightconfig.json, then run the repo's quality-gates.sh.

# ── ruff (lint + format) ────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".cursor", ".venv", ".venv-workspace", "build", "dist", "node_modules"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
# Rich union — the de-facto standard (the most-complete set, used by 6 repos as of
# the 2026-05-26 audit). E/F/W (pyflakes+pycodestyle), I (isort), N (pep8-naming),
# UP (pyupgrade), B (bugbear), C4 (comprehensions), SIM (simplify), RUF (ruff),
# G (logging-format), C90 (mccabe complexity). Security (S / flake8-bandit): pending.
#
# DTZ (flake8-datetimez) — UTC-datetime ban (harden_grepable_rules_into_ci_gates_2026_06_02.md
# Phase 3). Enforces CLAUDE.md "UTC datetimes always": `datetime.now(timezone.utc)`,
# never naive `datetime.now()` / `datetime.utcnow()` / `date.today()` / zone-less
# `strptime`. The exact approved code set (pinned — do NOT widen/narrow ad hoc):
#   DTZ001 datetime() w/o tzinfo · DTZ002 datetime.today() · DTZ003 datetime.utcnow()
#   DTZ004 datetime.utcfromtimestamp() · DTZ005 datetime.now() w/o tz
#   DTZ006 datetime.fromtimestamp() w/o tz · DTZ007 strptime() w/o %z
#   DTZ011 date.today() · DTZ012 date.fromtimestamp() · DTZ901 datetime.min/max w/o tz
# Until a repo's pre-existing DTZ sites are fixed, QG STEP 5.95 enforces this as a
# per-repo COUNT RATCHET (ruff_rule_ratchet_baseline.yaml) — new sites fail, the
# baselined set only shrinks.
#
# TID251 (flake8-tidy-imports banned-api) — direct cloud-SDK ban; see
# [tool.ruff.lint.flake8-tidy-imports.banned-api] below.
select = [
    "E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "G", "C90",
    "DTZ001", "DTZ002", "DTZ003", "DTZ004", "DTZ005", "DTZ006", "DTZ007",
    "DTZ011", "DTZ012", "DTZ901",
    "TID251",
]
extend-ignore = ["G003", "G004"]
ignore = ["E402"]

[tool.ruff.lint.mccabe]
max-complexity = 26

# ── Direct cloud-SDK ban (TID251) ────────────────────────────────────────────────
# CLAUDE.md "Cloud-agnostic I/O": all storage/secrets via get_storage_client() /
# get_secret_client() (the unified cloud interface in UTL `cloud_interface/`) —
# never `from google.cloud import …` / `import boto3` directly.
# SSOT: harden_grepable_rules_into_ci_gates_2026_06_02.md Phase 3.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"google.cloud".msg = "Direct cloud SDK banned — use get_storage_client()/get_secret_client() from unified_trading_library.cloud_interface (CLAUDE.md 'Cloud-agnostic I/O')."
"boto3".msg = "Direct cloud SDK banned — use get_storage_client()/get_secret_client() from unified_trading_library.cloud_interface (CLAUDE.md 'Cloud-agnostic I/O')."

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401", "E402"]
# DTZ exempt in tests (fixtures legitimately pin naive datetimes; matches the
# Phase-1 audit scope which measured the 121-violation baseline tests-excluded).
"tests/*" = ["F401", "F841", "F811", "DTZ"]
"tests/conftest.py" = ["E402"]
# unified-trading-library ONLY — the sanctioned cloud-interface wrapper internals
# legitimately import google.cloud/boto3 (there is no separate unified-cloud-interface
# repo; the wrapper lives inside UTL). Uncomment in UTL's pyproject.toml at rollout:
# "unified_trading_library/cloud_interface/**" = ["TID251"]

# ── basedpyright (typecheck) — CONSOLIDATED; delete pyrightconfig.json ──────────
[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["<PACKAGE_DIR>"]   # per-repo: the importable package dir, e.g. "unified_trading_library"
exclude = ["tests", "**/__pycache__", ".venv*", ".venv-workspace", "build", "dist", "node_modules"]
# ── Type-correctness rules → "error" (strict). The reportUnknown*/reportMissing*
#    family is the set that was relaxed to "none" in the deleted pyrightconfig.json;
#    restored to error per the canonical decision. QG STEP 5.21 asserts these = error.
reportAny = "error"
reportUnknownMemberType = "error"
reportUnknownVariableType = "error"
reportUnknownParameterType = "error"
reportUnknownArgumentType = "error"
reportUnknownLambdaType = "error"
reportMissingParameterType = "error"
reportMissingImports = "error"
reportArgumentType = "error"
reportReturnType = "error"
reportAssignmentType = "error"
reportCallIssue = "error"
reportGeneralTypeIssues = "error"
reportIndexIssue = "error"
reportOptionalMemberAccess = "error"
reportAttributeAccessIssue = "error"
reportIncompatibleVariableOverride = "error"
reportIncompatibleMethodOverride = "error"
# ── Owned by ruff (avoid double-reporting) / pragmatic softenings.
reportMissingTypeStubs = false
reportUnusedImport = "none"     # ruff F401 owns this
reportUnusedVariable = "none"   # ruff F841 owns this
reportUnusedFunction = "none"
reportPrivateUsage = "none"

# Cross-repo import resolution (replaces pyrightconfig.json executionEnvironments).
# Per-repo: list the sibling workspace repos this repo imports from.
[[tool.basedpyright.executionEnvironments]]
root = "."
pythonVersion = "3.13"
pythonPlatform = "All"
extraPaths = [
    # "../unified-trading-library",
    # "../unified-api-contracts",
    # ...per-repo workspace deps
]

# ── pytest ──────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "unit: mark test as unit test",
    "integration: integration tests requiring real GCP credentials and API keys",
    "smoke: mark test as smoke test",
]

# ── coverage (run + report — BOTH required in every repo) ────────────────────────
[tool.coverage.run]
source = ["<PACKAGE_DIR>"]
branch = true
# omit = [ ... ]  # per-repo: integration-only / I/O modules

[tool.coverage.report]
# FLOOR, not a fixed value: services >= 70, libraries >= 80. Repos may ratchet
# ABOVE their floor (e.g. UAC 84), never below. Set per repo:
fail_under = 70   # <- 70 for service repos, 80 for library repos
# omit = [ ... ]  # per-repo (usually mirrors [tool.coverage.run].omit)

# ── bandit (security SAST — every repo) ──────────────────────────────────────────
# Workspace keeps bandit (not ruff `S` rules) for now; ruff `S` may be added later.
[tool.bandit]
skips = []   # per-repo: add bandit check IDs WITH a comment explaining why (e.g. "B608: ...")
