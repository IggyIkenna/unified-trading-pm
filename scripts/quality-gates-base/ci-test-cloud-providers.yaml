      DEFI: "features-mtf-defi-test-account"
      PREDICTION: "features-mtf-pred-test-account"
      SPORTS: "features-mtf-sports-test-account"
    ml-models-store: "ml-models-store-test-test-account"
    ml-predictions-store: "ml-predictions-store-test-test-account"
    ml-configs-store: "ml-configs-store-test-test-account"
    # NOTE: ml-training-artifacts env-split ROLLED BACK — mirrors GCP rollback (Phase D).
