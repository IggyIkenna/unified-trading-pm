# Canonical pre-commit config for documentation repos (PM, codex).
# Template SSOT: unified-trading-pm/scripts/pre-commit-templates/
# Rollout: bash unified-trading-pm/scripts/propagation/rollout-pre-commit-configs.sh
# Setup: pre-commit install --install-hooks

default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  # Conventional commit validation (feat:/fix:/chore:/docs:/refactor:/test:/ci:)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Branch drift check - blocks commit if you're behind origin
  - repo: local
    hooks:
      - id: fix-commit-identity
        name: Enforce slot·host commit identity
        entry:
          bash -c 'HOOK="${WORKSPACE_ROOT:-$(cd "$(git rev-parse --show-toplevel)/.." &&
          pwd)}/unified-trading-pm/scripts/hooks/fix-commit-identity.sh"; [ -f "$HOOK" ] || exit 0; bash "$HOOK"'
        language: system
        always_run: true
        pass_filenames: false
        fail_fast: true # wrong identity -> STOP + re-run (git resolves author BEFORE hooks)

  - repo: local
    hooks:
      - id: check-branch-drift
        name: Check branch drift (are you behind origin?)
        entry:
          bash -c 'HOOK="${WORKSPACE_ROOT:-$(cd "$(git rev-parse --show-toplevel)/.." &&
          pwd)}/unified-trading-pm/scripts/hooks/check-branch-drift.sh"; [ -f "$HOOK" ] || exit 0; bash "$HOOK"'
        language: system
        always_run: true
        pass_filenames: false
        fail_fast: true # behind-origin -> STOP before any formatter mutates (no reflow residue that breaks slot FF-sync)

  # Plan hygiene — STAGED-FILES-ONLY frontmatter gate on plan commits (incl. docs(plans): flips
  # that skip full QG). The sweep computes the staged plans itself and validates only those, so a
  # pre-existing violation in an unrelated plan never blocks your commit (RULE-11 blast-radius
  # safety). Fast (<4s), local, no origin fetch, no sentinel needed (files:^plans/ is the skip).
  # The origin-compare (todo-regression) + LLM contradiction checks stay at CI, not pre-commit.
  - repo: local
    hooks:
      - id: plan-hygiene
        name: Plan hygiene (staged plans + runbooks — frontmatter/todo-format/runbook-fields)
        entry:
          bash -c 'SWEEP="${WORKSPACE_ROOT:-$(cd "$(git rev-parse --show-toplevel)/.." &&
          pwd)}/unified-trading-pm/scripts/plan-hygiene/run_hygiene_sweep.sh"; [ -f "$SWEEP" ] || exit 0; bash "$SWEEP"
          --precommit'
        language: system
        files: ^(plans/|codex/15-runbooks/incidents/)
        pass_filenames: false

  # Ruff - Python linter/formatter for scripts
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        name: Lint with Ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: Format with Ruff

  # Prettier - TypeScript/JSON/Markdown/YAML formatter (auto-stage wrapper).
  # Wrapper replaces upstream mirrors-prettier because that hook aborts the commit
  # when it reformats anything, forcing a manual re-stage + re-commit loop. The
  # wrapper runs prettier --write then re-stages the SUBSET of input files that
  # were already in the index (never touches foreign-dirty files held by other
  # parallel slots). SSOT: scripts/hooks/prettier-autostage.sh.
  - repo: local
    hooks:
      - id: prettier-autostage
        name: Format with Prettier (auto-stage)
        entry:
          bash -c 'HOOK="${WORKSPACE_ROOT:-$(cd "$(git rev-parse --show-toplevel)/.." &&
          pwd)}/unified-trading-pm/scripts/hooks/prettier-autostage.sh"; [ -f "$HOOK" ] || exit 0; bash "$HOOK" "$@"' --
        language: system
        types_or: [ts, tsx, javascript, jsx, json, markdown, yaml]

  # Secret scanning — gitleaks (catches GCP SA keys, GitHub PATs, API keys)
  # Config SSOT: unified-trading-pm/.gitleaks.toml (this repo IS the SSOT)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.27.2
    hooks:
      - id: gitleaks
        name: Detect secrets with gitleaks
        args: ["--config", ".gitleaks.toml"]

  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
