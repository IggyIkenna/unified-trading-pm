# Baseline for the referenced-doc-path existence check (docspec.validate_doc_references()).
#
# This is a SHRINKING ratchet, same convention as scripts/quality_gates/defi_address_citation_baseline.yaml.
# `known_broken` is the exact set of "<doc>::<field>::<entry>" keys check_frontmatter_schema.py
# tolerates today. A key NOT in this set (a NEW broken reference) fails the gate. A key IN this set
# that no longer reproduces (the reference got fixed) is harmless dead weight, not an error — but
# should be removed by re-running --update-doc-ref-baseline after a cleanup pass.
#
# WHY a baseline at all: seeding this check against the live corpus (2026-07-22) found 336 raw hits,
# 244 of which were references to a plan that had since been completed and archived (a normal
# lifecycle event docspec.validate_doc_references() already discounts via a plans/archive/** basename
# fallback) — the remaining 91 are genuine dead links, mostly pre-existing debt from unrelated work,
# not something to gate NEW pushes on before anyone has a chance to clean it up. Shipping this as a
# hard 0-tolerance gate on day one would have immediately reproduced the exact false-alarm failure
# mode (plans/active/issues/prek_plan_hygiene_hook_fail_open_unhooked_clone_2026_07_17.md) this whole
# frontmatter-gate lineage exists to prevent.
#
# NEVER add an entry here to silence a check you introduced yourself — this baseline is for
# PRE-EXISTING debt found at seed time, not a way to launder new breakage.
note: Seeded 2026-07-22 (ldr-docs-gate referenced-doc-path existence check, operator-suggested 2026-07-22).
known_broken:
