# Baseline for check_ag_closeout_linkage.py — every single-asset-group plan/issue
# doc must have a findable path to its tranche's consolidated closeout plan
# (operator request 2026-07-25).
#
# This is a SHRINKING ratchet. orphan_count is the number of pre-existing orphans
# the gate tolerates. A live count EXCEEDING this fails the check — a NEW doc
# landed with no path back to its tranche's closeout, fix it (add a related: link
# or a closeout-doc mention), don't raise the number. LOWER it (re-run
# --update-baseline) the moment orphans get fixed. NEVER hand-raise it.
#
# 2026-07-30 RE-SEED 0 -> 32 (operator ruling; the ONE documented exception to the
# never-raise rule). The old 0 was not a clean corpus — it was the artifact of a
# stale hand-listed REAL_AGS plus a filename-prefix bug that left 5 of 10 tranches
# enforcing NOTHING (cross-cutting, ao, ci, infrastructure, ui). Widening coverage
# and fixing both bugs surfaced 32 real pre-existing orphans that had always been
# there and were never measured. Per AUTONOMOUS_AGENT_RULES.md rule 11(a) the
# widened gate is seeded at its MEASURED count, then ratcheted DOWN as docs get
# linked — it is not a licence to raise this number again.
#
# 32 is the count measured against the tree at commit time on 2026-07-30 (per-tranche:
# cross-cutting 21/97, infrastructure 8/36, cefi 2/61, tradfi 1/38; defi, prediction,
# sports and ui are clean). Two earlier passes the same day recorded 31 and 34 against
# different corpus snapshots — this corpus is edited concurrently by several agents, so
# the number moves; 32 is the one this gate was actually verified green against (exit 0).
# Every one of the 32 pre-dates this change (verified `git cat-file -e HEAD:<path>`); the
# one NEW orphan this session would have introduced was fixed by adding a `related:` link,
# not by absorbing it into the baseline. A later run reading HIGHER than 32 means a new
# unlinked doc landed — link it, do not raise this.
#
# NOTE: `ao` and `ci` are still UNENFORCED (their closeout docs are archived, so no
# family resolves) — the run prints that loudly on every invocation. 32 therefore
# UNDER-counts the true corpus figure; expect it to rise once those two tranches
# get an active closeout family again, and record that raise here too.
orphan_count: 32
