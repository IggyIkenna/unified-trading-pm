name: major-bump-approval

# Triggered by a human (or admin script) to approve and dispatch a MAJOR version bump
# after the semver-agent.yml has opened a GitHub Issue requesting approval.
#
# Pre-conditions (enforced by this workflow):
#   - The approver must have write access to this repo (verified via GH API)
#   - The repo's codex/10-audit/repos/{repo}.yaml must confirm all v1.0.0 gate criteria
#     are either passed or declared N/A with documented reasons.
#
# Usage (human — GitHub UI):
#   Actions → major-bump-approval → Run workflow
#   Fill in: repo, proposed_version, reason, issue_number, approver
#
# Usage (admin script):
#   bash unified-trading-pm/scripts/approve-major-bump.sh {repo} {version} \
#     --reason "Breaking API change: removed /v1/orders endpoint" \
#     --issue 123 \
#     --admin-pat $GH_PAT
#
# On success: dispatches version-bump to unified-trading-pm; closes the GitHub Issue;
#             updates codex/10-audit/repos/{repo}.yaml with br8_user_approved.
#
# Requires: GH_PAT secret with repo write + issue write access.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repo name (e.g. execution-service)"
        required: true
        type: string
      proposed_version:
        description: "New MAJOR version (e.g. 2.0.0)"
        required: true
        type: string
      reason:
        description: "Why this is a MAJOR bump (e.g. removed /v1/orders endpoint)"
        required: true
        type: string
      issue_number:
        description: "GitHub Issue # from semver-agent (for auto-close on approval)"
        required: false
        type: string
      approver:
        description: "GitHub handle of approver (e.g. IggyIkenna)"
        required: true
        type: string

permissions:
  contents: write
  issues: write

jobs:
  approve-major-bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout unified-trading-pm
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Checkout unified-trading-codex (readiness checklists)
        uses: actions/checkout@v4
        with:
          repository: IggyIkenna/unified-trading-codex
          token: ${{ secrets.GH_PAT }}
          path: ../unified-trading-codex
        continue-on-error: true # advisory — workflow does not fail if codex unavailable

      - name: Verify approver has write access
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ inputs.repo }}
          APPROVER: ${{ inputs.approver }}
          GH_ORG: IggyIkenna
        run: |
          set -euo pipefail

          echo "Verifying $APPROVER has write access to $GH_ORG/$REPO..."
          HTTP_STATUS=$(curl -s -o /tmp/collab_response.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GH_ORG}/${REPO}/collaborators/${APPROVER}/permission")

          if [ "$HTTP_STATUS" = "404" ]; then
            echo "ERROR: $APPROVER is not a collaborator on $GH_ORG/$REPO"
            cat /tmp/collab_response.json || true
            exit 1
          fi

          PERMISSION=$(python3 -c "import json,sys; d=json.load(open('/tmp/collab_response.json')); print(d.get('permission','none'))" 2>/dev/null || echo "unknown")
          echo "Permission level: $PERMISSION"

          if [[ "$PERMISSION" != "write" && "$PERMISSION" != "maintain" && "$PERMISSION" != "admin" ]]; then
            echo "ERROR: $APPROVER has '$PERMISSION' access (write/maintain/admin required)"
            exit 1
          fi
          echo "✅ Access verified: $APPROVER has $PERMISSION on $GH_ORG/$REPO"

      - name: Check readiness gates in codex (advisory)
        id: readiness
        env:
          REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail

          CHECKLIST="../unified-trading-codex/10-audit/repos/${REPO}.yaml"
          if [ ! -f "$CHECKLIST" ]; then
            echo "⚠️  Readiness checklist not found: $CHECKLIST"
            echo "   Proceeding without gate verification (codex/10-audit/repos/${REPO}.yaml not present)"
            echo "gates_checked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Checking v1.0.0 readiness gates in $CHECKLIST..."
          MISSING_GATES=""

          check_gate() {
            local gate="$1"
            local status
            status=$(python3 -c "
          import sys, yaml
          try:
            data = yaml.safe_load(open('${CHECKLIST}'))
          except Exception as e:
            print('unknown')
            sys.exit(0)
          # Navigate nested structure to find the gate
          def find_gate(d, key):
            if isinstance(d, dict):
              if key in d:
                v = d[key]
                if isinstance(v, dict):
                  return v.get('status', 'unknown')
                return str(v)
              for v in d.values():
                result = find_gate(v, key)
                if result != 'not_found':
                  return result
            elif isinstance(d, list):
              for item in d:
                result = find_gate(item, key)
                if result != 'not_found':
                  return result
            return 'not_found'
          result = find_gate(data, '${gate}')
          print(result if result != 'not_found' else 'missing')
          " 2>/dev/null || echo "unknown")
            echo "$status"
          }

          # Install PyYAML if not present (ubuntu-latest usually has it)
          python3 -c "import yaml" 2>/dev/null || pip3 install pyyaml -q

          # Check mandatory v1.0.0 gates
          for GATE in cr5_quickmerge dr3_feature_env dr4_sit_pass br2_circuit_breaker br3_pnl_targets br4_batch_vs_live; do
            STATUS=$(check_gate "$GATE")
            if [[ "$STATUS" != "pass" && "$STATUS" != "na" && "$STATUS" != "n/a" ]]; then
              MISSING_GATES="${MISSING_GATES}\n  - ${GATE}: ${STATUS}"
            else
              echo "  ✅ ${GATE}: ${STATUS}"
            fi
          done

          if [ -n "$MISSING_GATES" ]; then
            echo ""
            echo "⚠️  Some v1.0.0 readiness gates are not yet met:"
            printf "$MISSING_GATES\n"
            echo ""
            echo "These gates are ADVISORY for this approval workflow."
            echo "The approver (${{ inputs.approver }}) is accepting responsibility for these gaps."
            echo "gates_checked=true" >> "$GITHUB_OUTPUT"
            echo "gates_all_passed=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ All v1.0.0 readiness gates are met or declared N/A"
            echo "gates_checked=true" >> "$GITHUB_OUTPUT"
            echo "gates_all_passed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch version-bump to unified-trading-pm
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ inputs.repo }}
          VERSION: ${{ inputs.proposed_version }}
          REASON: ${{ inputs.reason }}
          APPROVER: ${{ inputs.approver }}
          GH_ORG: IggyIkenna
        run: |
          set -euo pipefail

          echo "Dispatching MAJOR version-bump approval: $REPO → $VERSION"

          HTTP_STATUS=$(curl -s -o /tmp/dispatch_response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GH_ORG}/unified-trading-pm/dispatches" \
            -d "{
              \"event_type\": \"version-bump\",
              \"client_payload\": {
                \"repo\": \"${REPO}\",
                \"version\": \"${VERSION}\",
                \"branch\": \"staging\",
                \"commit_sha\": \"approved-major-bump\",
                \"approved_by\": \"${APPROVER}\",
                \"reason\": \"${REASON}\"
              }
            }")

          if [ "$HTTP_STATUS" = "204" ]; then
            echo "✅ Dispatched version-bump to unified-trading-pm ($REPO → $VERSION)"
          else
            echo "ERROR: HTTP $HTTP_STATUS dispatching to unified-trading-pm"
            cat /tmp/dispatch_response.json || true
            exit 1
          fi

      - name: Update codex readiness checklist (BR8 approved)
        env:
          REPO: ${{ inputs.repo }}
          APPROVER: ${{ inputs.approver }}
          VERSION: ${{ inputs.proposed_version }}
        run: |
          set -euo pipefail

          CHECKLIST="../unified-trading-codex/10-audit/repos/${REPO}.yaml"
          if [ ! -f "$CHECKLIST" ]; then
            echo "⚠️  Skipping BR8 update — $CHECKLIST not found"
            exit 0
          fi

          TODAY=$(date +%Y-%m-%d)

          # Use Python to update br8_user_approved fields (safe YAML round-trip)
          python3 - <<PYEOF
          import yaml, sys
          from datetime import date

          with open("${CHECKLIST}") as f:
              data = yaml.safe_load(f)

          # Update br8_user_approved in all business sections (batch/live)
          def update_br8(d):
              if isinstance(d, dict):
                  if "br8_user_approved" in d:
                      d["br8_user_approved"]["status"] = "pass"
                      d["br8_user_approved"]["approved_by"] = "${APPROVER}"
                      d["br8_user_approved"]["approved_date"] = "${TODAY}"
                      d["br8_user_approved"]["version"] = "${VERSION}"
                  for v in d.values():
                      update_br8(v)
              elif isinstance(d, list):
                  for item in d:
                      update_br8(item)

          update_br8(data)

          with open("${CHECKLIST}", "w") as f:
              yaml.dump(data, f, default_flow_style=False, sort_keys=False, allow_unicode=True)

          print(f"Updated BR8 in {CHECKLIST}: approved_by=${APPROVER} on ${TODAY}")
          PYEOF

          cd ../unified-trading-codex
          git config user.email "agent@ci.local"
          git config user.name "Rollout Agent"
          git add "10-audit/repos/${REPO}.yaml"
          git diff --staged --quiet || git commit -m "chore(readiness): approve BR8 for ${REPO} v${VERSION} [approved by ${APPROVER}]"
          git push origin main

      - name: Close GitHub Issue (major-bump approval fulfilled)
        if: inputs.issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ inputs.repo }}
          ISSUE: ${{ inputs.issue_number }}
          VERSION: ${{ inputs.proposed_version }}
          APPROVER: ${{ inputs.approver }}
          GH_ORG: IggyIkenna
        run: |
          set -euo pipefail

          TODAY=$(date +%Y-%m-%d)

          # Add approval comment
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GH_ORG}/${REPO}/issues/${ISSUE}/comments" \
            -d "{\"body\": \"✅ **APPROVED** by @${APPROVER} on ${TODAY}\\n\\nMajor bump to \`${VERSION}\` dispatched to unified-trading-pm.\\nBR8 updated in codex/10-audit/repos/${REPO}.yaml.\"}"

          # Close issue with state_reason = completed
          curl -s -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GH_ORG}/${REPO}/issues/${ISSUE}" \
            -d "{\"state\": \"closed\", \"state_reason\": \"completed\"}"

          echo "✅ Issue #${ISSUE} closed as completed"

      - name: Summary
        run: |
          echo "## Major Bump Approval Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Repo | \`${{ inputs.repo }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| New version | \`${{ inputs.proposed_version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Approved by | @${{ inputs.approver }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Reason | ${{ inputs.reason }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gates verified | ${{ steps.readiness.outputs.gates_checked }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.readiness.outputs.gates_all_passed }}" = "true" ]; then
            echo "| Gate status | ✅ All v1.0.0 gates passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Gate status | ⚠️  Some gates pending (approver accepted responsibility) |" >> $GITHUB_STEP_SUMMARY
          fi
