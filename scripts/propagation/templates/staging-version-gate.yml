name: Staging Version Gate

# Blocks PRs to staging when the repo's version is < 1.0.0.
#
# This is a per-repo gate. A repo at 1.0.0 merges freely even if other repos are
# still on 0.x.x. Version 1.0.0 is a deliberate human decision made via the
# production checklist plan — it is never auto-crossed by semver-agent.yml.
#
# Exemptions:
#   unified-trading-pm — manages the workspace manifest; has no semver gate.
#
# Python repos: reads version from pyproject.toml
# UI/TS repos:  reads version from package.json
#
# Required status check name: "Staging Version Gate / version-gate"
# Register this check on the staging branch protection rule of each repo.

on:
  pull_request:
    branches: [staging]

permissions:
  contents: read

jobs:
  version-gate:
    name: Check version >= 1.0.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check version >= 1.0.0
        run: |
          set -euo pipefail

          REPO="${{ github.event.repository.name }}"

          # PM repo is exempt — it manages the manifest and has no semver gate
          if [ "$REPO" = "unified-trading-pm" ]; then
            echo "Repo '$REPO' is exempt from staging version gate — pass."
            exit 0
          fi

          # Determine version source
          if [ -f pyproject.toml ]; then
            VERSION=$(grep -m1 '^version\s*=' pyproject.toml | sed 's/.*= *"\([^"]*\)".*/\1/')
            SOURCE="pyproject.toml"
          elif [ -f package.json ]; then
            VERSION=$(node -p "require('./package.json').version")
            SOURCE="package.json"
          else
            echo "::error::No version file found (pyproject.toml or package.json) in repo '$REPO'."
            exit 1
          fi

          echo "Version source: $SOURCE"
          echo "Version: $VERSION"

          python3 - <<'PYEOF'
          import sys
          from packaging.version import Version

          version_str = "$VERSION"
          try:
              v = Version(version_str)
          except Exception as e:
              print(f"::error::Could not parse version '{version_str}': {e}")
              sys.exit(1)

          if v < Version("1.0.0"):
              print(
                  f"::error::Version {v} < 1.0.0 — this repo is not yet production-ready. "
                  f"Reach 1.0.0 via the production checklist plan before merging to staging. "
                  f"Other repos at 1.0.0 are unaffected by this gate."
              )
              sys.exit(1)

          print(f"Version {v} >= 1.0.0 — staging gate passed.")
          PYEOF
