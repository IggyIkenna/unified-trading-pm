name: Feature Branch → Staging

# Auto-merges the active feature branch to staging once Quality Gates pass.
# The feature branch name is the SSOT from workspace-manifest.json
# (active_feature_branch field). Currently: live-defi-rollout.
#
# Pipeline position:
#   live-defi-rollout → [this workflow] → staging → SIT → main → semver bump
#
# Placeholders replaced by rollout-agent-workflows.sh:
#   {{SERVICE_NAME}}  — e.g. market-tick-data-service
#
# Secrets required:
#   GH_PAT  — cross-repo API calls and PR creation

on:
  workflow_run:
    workflows: ["Quality Gates"]
    types: [completed]
    branches: [live-defi-rollout]

env:
  GH_TOKEN: ${{ secrets.GH_PAT }}
  SERVICE_NAME: "{{SERVICE_NAME}}"
  GH_ORG: IggyIkenna
  FEATURE_BRANCH: live-defi-rollout

permissions:
  contents: read
  pull-requests: write

jobs:
  feature-to-staging:
    name: Merge feature branch → staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only proceed when QG passed
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Check staging lock in PM manifest
        id: lock-check
        run: |
          set -euo pipefail

          PM_MANIFEST=$(gh api "repos/${GH_ORG}/unified-trading-pm/contents/workspace-manifest.json" \
            --jq '.content' | base64 -d 2>/dev/null || echo "")

          if [ -z "$PM_MANIFEST" ]; then
            echo "WARNING: Could not fetch PM manifest — proceeding without lock check"
            echo "locked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LOCKED=$(echo "$PM_MANIFEST" | python3 -c "
          import json, sys
          m = json.load(sys.stdin)
          print(str(m.get('staging_status', {}).get('locked', False)).lower())
          " 2>/dev/null || echo "false")

          REASON=$(echo "$PM_MANIFEST" | python3 -c "
          import json, sys
          m = json.load(sys.stdin)
          print(m.get('staging_status', {}).get('locked_reason', '') or '')
          " 2>/dev/null || echo "")

          echo "locked=$LOCKED" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

          if [ "$LOCKED" = "true" ]; then
            echo "⚠️  Staging is locked: $REASON"
            echo "   Will create PR but NOT enable auto-merge until staging unlocks."
          fi

      - name: Create or update PR to staging
        id: pr
        run: |
          set -euo pipefail

          REPO="${GH_ORG}/${SERVICE_NAME}"
          HEAD="${FEATURE_BRANCH}"
          BASE="staging"
          SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${SHA:0:7}"

          echo "Creating PR: $HEAD → $BASE for $REPO (QG SHA: $SHORT_SHA)"

          # Check if a PR already exists for this branch → staging
          EXISTING_PR=$(gh pr list \
            --repo "$REPO" \
            --head "$HEAD" \
            --base "$BASE" \
            --state open \
            --json number,url \
            --jq '.[0]' 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            PR_NUMBER=$(echo "$EXISTING_PR" | python3 -c "import json,sys; print(json.load(sys.stdin)['number'])")
            PR_URL=$(echo "$EXISTING_PR" | python3 -c "import json,sys; print(json.load(sys.stdin)['url'])")
            echo "PR already exists: #$PR_NUMBER — $PR_URL"
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          else
            PR_URL=$(gh pr create \
              --repo "$REPO" \
              --head "$HEAD" \
              --base "$BASE" \
              --title "feat(defi-rollout): merge live-defi-rollout → staging [QG: $SHORT_SHA]" \
              --body "$(cat <<BODY
## Auto-merge: feature branch → staging

**Triggered by:** Quality Gates ✅ on \`${HEAD}\` @ \`${SHORT_SHA}\`
**Pipeline:** \`${HEAD}\` → \`staging\` → SIT → \`main\` → semver bump

This PR was created automatically after Quality Gates passed on \`${HEAD}\`.
Auto-merge is enabled — staging will update once all required checks pass.

> **Note:** If staging is locked (SIT running), auto-merge will queue and apply after unlock.
BODY
)" \
              --label "auto-merge" 2>/dev/null || true)

            if [ -z "$PR_URL" ]; then
              echo "ERROR: Failed to create PR. Check GH_PAT permissions."
              exit 1
            fi

            PR_NUMBER=$(gh pr view "$PR_URL" --repo "$REPO" --json number --jq '.number' 2>/dev/null || echo "")
            echo "PR created: #$PR_NUMBER — $PR_URL"
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Set ci_status to STAGING_PENDING (fresh QG required on staging)
        run: |
          set -euo pipefail
          echo "Dispatching ci-status-update: ${SERVICE_NAME} → STAGING_PENDING"
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GH_ORG}/unified-trading-pm/dispatches" \
            -d "{\"event_type\": \"ci-status-update\", \"client_payload\": {\"repo\": \"${SERVICE_NAME}\", \"status\": \"STAGING_PENDING\", \"branch\": \"staging\", \"sha\": \"${{ github.event.workflow_run.head_sha }}\"}}" \
            || echo "WARNING: ci-status-update dispatch failed"

      - name: Enable auto-merge (unless staging is locked)
        if: steps.lock-check.outputs.locked != 'true'
        run: |
          set -euo pipefail

          PR_NUMBER="${{ steps.pr.outputs.pr_number }}"
          REPO="${GH_ORG}/${SERVICE_NAME}"

          echo "Enabling auto-merge on PR #$PR_NUMBER"
          gh pr merge "$PR_NUMBER" \
            --repo "$REPO" \
            --squash \
            --auto \
            --subject "feat(defi-rollout): merge live-defi-rollout → staging [auto]" \
            || echo "WARNING: auto-merge enable failed (may already be enabled or PR not ready)"

      - name: Skip auto-merge (staging locked)
        if: steps.lock-check.outputs.locked == 'true'
        run: |
          PR_NUMBER="${{ steps.pr.outputs.pr_number }}"
          echo "Staging is locked (reason: ${{ steps.lock-check.outputs.reason }})"
          echo "PR #$PR_NUMBER created but auto-merge NOT enabled."
          echo "Auto-merge will be enabled once staging unlocks (sit-unlock.yml → staging-unlocked dispatch)."

      # ── TELEGRAM NOTIFY ───────────────────────────────────────────────────────
      - name: Notify Telegram
        if: always() && env.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
        run: |
          PR_URL="${{ steps.pr.outputs.pr_url }}"
          LOCKED="${{ steps.lock-check.outputs.locked }}"
          TEXT="*feature→staging* | {{SERVICE_NAME}} | ${STATUS} | locked=${LOCKED} | PR: ${PR_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${TEXT}" \
            -d parse_mode="Markdown" || true

      # ── CONFLICT DETECTION ────────────────────────────────────────────────────
      - name: Detect merge conflict and dispatch resolution agent
        # Runs always so it fires even when auto-merge was skipped (staging locked).
        # GitHub computes mergeable asynchronously — poll up to 3× before giving up.
        if: always() && steps.pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          REPO="${GH_ORG}/${SERVICE_NAME}"

          # Poll for mergeable state (GitHub computes asynchronously)
          MERGEABLE=""
          for _i in 1 2 3; do
            MERGEABLE=$(gh pr view "$PR_NUMBER" \
              --repo "$REPO" \
              --json mergeable \
              --jq '.mergeable' 2>/dev/null || echo "")
            [ "$MERGEABLE" != "null" ] && [ "$MERGEABLE" != "" ] && break
            sleep 5
          done

          echo "PR #$PR_NUMBER mergeable=$MERGEABLE"

          if [ "$MERGEABLE" = "CONFLICTING" ]; then
            echo "Merge conflict detected on PR #$PR_NUMBER — dispatching conflict-resolution-agent"

            # Telegram: immediate notification
            if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
              TEXT="⚠️ *Merge Conflict Detected*%0ARepo: \`${SERVICE_NAME}\`%0A\`${FEATURE_BRANCH}\` → \`staging\`%0APR: ${PR_URL}%0AAgent dispatched to resolve..."
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="${TELEGRAM_CHAT_ID}" \
                -d text="$TEXT" \
                -d parse_mode="Markdown" || true
            fi

            # Dispatch conflict-resolution-agent to PM
            curl -s -X POST \
              "https://api.github.com/repos/${GH_ORG}/unified-trading-pm/dispatches" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"event_type\":\"merge-conflict-detected\",\"client_payload\":{\"repo_name\":\"${SERVICE_NAME}\",\"source_branch\":\"${FEATURE_BRANCH}\",\"target_branch\":\"staging\",\"original_pr_url\":\"${PR_URL}\"}}" \
              && echo "Dispatched conflict-resolution-agent" \
              || echo "WARNING: Failed to dispatch conflict-resolution-agent"
          else
            echo "No merge conflict (mergeable=$MERGEABLE) — nothing to dispatch"
          fi
