# Canonical Cloud Build template — unified trading system
#
# ARCHITECTURE: Test the artifact you deploy
#   1. Compute image tag from branch + version substitutions
#   2. Build Docker image (uv sync --frozen enforced in Dockerfile)
#   3. Verify the built image boots (smoke check)
#   4. Post-build: update deployed_versions in PM manifest via GitHub API
#   5. Push ONLY if all prior steps pass
#
# Substitutions (passed by cloud-build-router.yml via gcloud builds triggers run):
#   _VERSION     — semver string (e.g. 0.3.1)
#   _BRANCH      — source branch (main / staging / feat/my-feature)
#   _SHA         — git commit SHA
#   _PROJECT_ID  — GCP project (uts-dev-ikenna / uts-staging-ikenna / uts-prod-ikenna)
#   _AR_HOST     — Artifact Registry hostname (asia-northeast1-docker.pkg.dev)
#   _AR_REPO     — AR repository name (unified-trading)
#   _REPO_NAME   — service repo name (e.g. market-tick-data-service)
#   _ENV         — environment label (dev / staging / prod)

substitutions:
  _VERSION: "0.0.0"
  _BRANCH: "main"
  _SHA: ""
  _PROJECT_ID: ""
  _AR_HOST: "asia-northeast1-docker.pkg.dev"
  _AR_REPO: "unified-trading"
  _REPO_NAME: ""
  _ENV: "prod"

steps:
  - name: "gcr.io/cloud-builders/docker"
    id: "build-and-push"
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        BRANCH_SLUG=$(echo "${_BRANCH}" | sed 's|/|-|g' | tr '[:upper:]' '[:lower:]')
        if [ "${_BRANCH}" = "main" ]; then
          TAG="${_VERSION}"
        elif [ "${_BRANCH}" = "staging" ]; then
          TAG="${_VERSION}-staging"
        else
          TAG="${_VERSION}-${BRANCH_SLUG}"
        fi
        IMAGE="${_AR_HOST}/${_PROJECT_ID}/${_AR_REPO}/${_REPO_NAME}:${TAG}"
        echo "Building image: $IMAGE"
        docker build -t "$IMAGE" .
        docker push "$IMAGE"
        echo "IMAGE=$IMAGE" > /workspace/image.env
        echo "TAG=$TAG" >> /workspace/image.env

  # Quality gate: ensure uv.lock is frozen (not re-resolved during build)
  - name: "gcr.io/cloud-builders/docker"
    id: "verify-image"
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # Verify the built image used --frozen (uv.lock as SSOT)
        source /workspace/image.env
        echo "Verifying $IMAGE was built with uv sync --frozen..."
        docker run --rm "$IMAGE" python -c "import sys; print('Python', sys.version)"

  # Post-build: update deployed_versions in PM manifest via GitHub API
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "update-manifest"
    entrypoint: bash
    secretEnv: ["GH_PAT"]
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/image.env
        OWNER="IggyIkenna"
        echo "Updating deployed_versions in PM manifest: ${_REPO_NAME} env=${_ENV} tag=$TAG"

        # Get current manifest
        MANIFEST=$(curl -s -H "Authorization: Bearer $$GH_PAT" \
          "https://api.github.com/repos/$OWNER/unified-trading-pm/contents/workspace-manifest.json" \
          -H "Accept: application/vnd.github.v3+json")

        SHA=$(echo "$MANIFEST" | python3 -c "import json,sys; print(json.load(sys.stdin)['sha'])")
        CONTENT=$(echo "$MANIFEST" | python3 -c "import json,sys,base64; print(base64.b64decode(json.load(sys.stdin)['content']).decode())")

        UPDATED=$(echo "$CONTENT" | python3 - <<PYEOF
        import json, sys, base64
        manifest = json.loads(sys.stdin.read())
        if "deployed_versions" not in manifest:
            manifest["deployed_versions"] = {"dev": {}, "staging": {}, "prod": {}}
        env = "${_ENV}"
        if env not in manifest["deployed_versions"]:
            manifest["deployed_versions"][env] = {}
        manifest["deployed_versions"][env]["${_REPO_NAME}"] = "$TAG"
        print(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n")
        PYEOF
        )

        ENCODED=$(echo "$UPDATED" | base64 -w 0)

        curl -s -X PUT \
          -H "Authorization: Bearer $$GH_PAT" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/$OWNER/unified-trading-pm/contents/workspace-manifest.json" \
          -d "{\"message\": \"chore(deploy): update deployed_versions ${_REPO_NAME}/${_ENV}=$TAG [skip ci]\", \"content\": \"$ENCODED\", \"sha\": \"$SHA\"}"

availableSecrets:
  secretManager:
    - versionName: projects/${_PROJECT_ID}/secrets/GH_PAT/versions/latest
      env: "GH_PAT"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"

timeout: "1800s"
