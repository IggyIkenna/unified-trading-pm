# Epic: resource_watchdog_host_guardian_2026_08_05
# Lifecycle: permanent
# Delete-when: NA
#
# systemd-tmpfiles age-based cleanup for /var/log/snapshots/kill_*.txt (the
# per-kill-event forensic capture resource-watchdog.sh writes via
# _rw_snapshot_process). These are individually-named per-incident files, not
# one growing log, so age-based deletion (not logrotate) is the right tool.
# 14d matches resource-watchdog.logrotate's local retention; each snapshot is
# also mirrored to GCS/S3 before it ages out (gcs_sync.upload_resource_watchdog_
# snapshots_to_gcs/_to_s3, via resource-history-backup.timer, every 10 min).
#
# Install target: /etc/tmpfiles.d/resource-watchdog-snapshots.conf (copied by
# bootstrap_vm.sh Step 4.8 / install-resource-watchdog-retention.sh; apply
# immediately with `systemd-tmpfiles --clean` or wait for the daily
# systemd-tmpfiles-clean.timer).

# Type Path                                Mode UID  GID  Age Argument
e     /var/log/snapshots/kill_*.txt        -    -    -    14d -
