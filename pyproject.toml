[project]
name = "unified-trading-pm"
version = "0.9.0"
requires-python = ">=3.13,<3.14"
description = "Unified Trading System - Project Management"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-timeout>=2.2",
    "pytest-xdist>=3.6",
    "pytest-cov>=4.1",
    "ruff==0.15.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "G"]

[tool.ruff.lint.per-file-ignores]
"tests/test_generate_workspace_dag.py" = ["E402"]

[tool.basedpyright]
extraPaths = ["scripts", "scripts/manifest", "scripts/validation", "scripts/propagation", "scripts/repo-management"]
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
parallel = true
source = ["scripts/manifest"]
omit = ["tests/*", "*.venv*/*"]

[tool.coverage.report]
skip_empty = true
show_missing = true
