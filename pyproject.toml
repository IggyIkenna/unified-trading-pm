[project]
name = "unified-trading-pm"
version = "1.2.0"
requires-python = ">=3.13,<3.14"
description = "Unified Trading System - Project Management"
dependencies = [
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest<10.0.0,>=9.0.1",
    "pytest-asyncio<2.0.0,>=0.25.0",
    "pytest-mock<4.0.0,>=3.15.0",
    "pytest-timeout<3.0.0,>=2.4.0",
    "pytest-xdist<4.0.0,>=3.6.0",
    "pytest-cov<8.0.0,>=7.0.0",
    "ruff==0.15.0",
    "basedpyright<2.0.0,>=1.21.0",
    "pip-audit>=2.7.0,<3.0.0",
    "bandit>=1.7.0,<2.0.0",
]

[tool.setuptools.packages.find]
include = []

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "G"]


[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.ruff.lint.per-file-ignores]
"tests/test_generate_workspace_dag.py" = ["E402"]

[tool.basedpyright]
extraPaths = ["scripts", "scripts/manifest", "scripts/validation", "scripts/propagation", "scripts/repo-management"]
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
parallel = true
source = ["scripts"]
omit = [
    "tests/*",
    "*.venv*/*",
    "scripts/manifest/generate_canonical_dependency_manifest.py",
    "scripts/manifest/sbom-store.py",
    "scripts/check-internal-advisories.py",
]

[tool.coverage.report]
skip_empty = true
show_missing = true
