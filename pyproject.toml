[project]
name = "unified-trading-pm"
version = "0.6.0"
requires-python = ">=3.13,<3.14"
description = "Unified Trading System - Project Management"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/test_generate_workspace_dag.py" = ["E402"]

[tool.basedpyright]
extraPaths = ["scripts"]
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
