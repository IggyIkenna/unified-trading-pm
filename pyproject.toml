[project]
name = "unified-trading-pm"
version = "1.2.0"
requires-python = ">=3.13,<3.14"
description = "Unified Trading System - Project Management"
dependencies = [
    "tomli-w>=1.0.0",
    "pytest<10.0.0,>=9.0.3",
    "pytest-asyncio<2.0.0,>=0.25.0",
    "pytest-mock<4.0.0,>=3.15.0",
    "pytest-timeout<3.0.0,>=2.4.0",
    "pytest-xdist<4.0.0,>=3.6.0",
    "pytest-cov<8.0.0,>=7.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
    "jsonschema>=4.0.0,<5.0.0",
    "ruff==0.15.0",
    "basedpyright==1.38.2",
    "pip-audit>=2.7.0,<3.0.0",
    "bandit>=1.7.0,<2.0.0",
    "duckdb>=1.2.0,<2.0.0",
    "aiohttp<4.0.0,>=3.13.4",
    "cryptography<47.0.0,>=46.0.7",
    "pygments>=2.20.0",
]
[tool.setuptools.packages.find]
include = []

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "G"]


[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.ruff.lint.per-file-ignores]
"tests/test_generate_workspace_dag.py" = ["E402"]
"scripts/propagation/rollout-ui-build-infra.py" = ["E501"]
"scripts/dev/seed_validator.py" = ["BLE001"]
"scripts/dev/seed_features.py" = ["BLE001"]
"scripts/dev/smoke-test-dev.py" = ["BLE001", "S102"]

[tool.basedpyright]
extraPaths = ["scripts", "scripts/manifest", "scripts/validation", "scripts/propagation", "scripts/repo-management", "../unified-internal-contracts", "../unified-api-contracts"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
# JSON-parsing / argparse scripts: reportAny suppressed — dict values from json.load()
# and argparse.Namespace attributes are intentionally Any at the JSON/CLI boundary.
ignore = [
    "scripts/propagation/rollout-quality-gates-unified.py",
    "scripts/propagation/rollout-buildspec.py",
    "scripts/propagation/rollout-cloudbuild.py",
    "scripts/propagation/add-cloudbuild-deploy-via-dispatch.py",
    "scripts/validation/check-integration-dep-coverage.py",
    "scripts/validation/check_manifest_import_alignment.py",
    "scripts/validation/check_schema_provenance.py",
    "scripts/validation/validate-build-auth.py",
    "scripts/ops/generate-freeze-calendar.py",
    "scripts/manifest/reverse-dependency-lookup.py",
    "scripts/manifest/auto-populate-tags.py",
    "scripts/manifest/check-strategy-instruments.py",
    "scripts/manifest/check-strategy-maturity.py",
    "scripts/checkers/check-data-availability.py",
    "scripts/checkers/check-strategy-maturity.py",
    "scripts/checkers/check_ui_api_flow_coverage.py",
    "scripts/checkers/fixture_drift_checker.py",
    "scripts/checkers/flow_coverage_scorecard.py",
    "scripts/checkers/network_evidence_parser.py",
    "scripts/checkers/triad_assertion_checker.py",
    "scripts/generators/generate_dependency_viz.py",
    "scripts/generators/generate_strategy_manifest_dag.py",
    "scripts/generators/reverse-dependency-lookup.py",
    "scripts/generate-ui-vision-pptx.py",
    "scripts/agents/rollup_resolved_pings.py",
    "scripts/cascade/invalidate-ci-status.py",
    "scripts/catalogue/sync-catalogue-yaml.py",
    "scripts/catalogue/sync-to-mock.py",
    "scripts/load-testing/synthetic_load_generator.py",
    "scripts/manifest/_align_workspace_manifest.py",
    "scripts/manifest/generate-strategy-instrument-matrix.py",
    "scripts/manifest/prune_removed_repositories.py",
    "scripts/manifest/validate-import-deps.py",
    "scripts/openapi/audit_api_ui_coverage.py",
    "scripts/openapi/audit_dead_code.py",
    "scripts/openapi/audit_type_usage.py",
    "scripts/openapi/generate_config_registry.py",
    "scripts/openapi/generate_instrument_snapshot.py",
    "scripts/openapi/generate_system_topology.py",
    "scripts/openapi/generate_ui_reference_data.py",
    "scripts/openapi/generate_unified_spec.py",
    "scripts/prediction/test_prediction_pipeline_e2e.py",
    "scripts/propagation/generate-strategy-instances-fixture.py",
    "scripts/propagation/sync_archetype_capability_to_ui.py",
    "scripts/propagation/sync_questionnaire_response_to_ui.py",
    "scripts/propagation/sync_restriction_profiles_to_ui.py",
    "scripts/qg/honest_coverage_ratchet.py",
    "scripts/quality_gates/audit_workspace_constraints_drift.py",
    "scripts/quality_gates/check_adapter_contract_regression.py",
    "scripts/quality_gates/check_banned_placeholder_methods.py",
    "scripts/quality_gates/check_canonical_futures_construction.py",
    "scripts/quality_gates/check_emission_policy_paired_callsites.py",
    "scripts/quality_gates/check_imports_inside_functions.py",
    "scripts/quality_gates/check_inline_bucket_uri.py",
    "scripts/quality_gates/check_mdps_bar_available_at_stamping.py",
    "scripts/quality_gates/check_mdps_bar_boundary_compliance.py",
    "scripts/quality_gates/check_pipeline_mode_explicit_at_record_calls.py",
    "scripts/quality_gates/check_removed_symbols.py",
    "scripts/quality_gates/check_uac_hard_required_fields.py",
    "scripts/quality_gates/qg_audit.py",
    "scripts/sports/migrate_player_mappings_to_canonical.py",
    "scripts/sports/migrate_sports_gcs_to_hive.py",
    "scripts/validation/sync_strategy_manifest_class_exists.py",
    "scripts/validation/validate-strategy-manifest.py",
    "scripts/workspace/cleanup-empty-dirs.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: PM integration tests (verify repo sync with PM scripts)"]

[tool.coverage.run]
parallel = true
source = ["scripts"]
omit = [
    "tests/*",
    "*.venv*/*",
    "scripts/manifest/generate_canonical_dependency_manifest.py",
    "scripts/manifest/sbom-store.py",
    "scripts/check-internal-advisories.py",
    "scripts/generate-cicd-diagram.py",  # Diagram generator; tested by execution in QG post-step
    "scripts/compute-epic-readiness.py",  # Reporting script; run manually, not unit-tested
    "scripts/check-cross-plan-gates.py",  # Plan-gate checker; requires live filesystem, not unit-tested
    "scripts/validate-manifest-dag.py",  # DAG validator; integration-only, not unit-tested
    "scripts/generate-ui-vision-pptx.py",  # Requires python-pptx which is not a project dependency
]

[tool.coverage.report]
skip_empty = true
show_missing = true
