[project]
name = "unified-trading-pm"
version = "1.2.0"
requires-python = ">=3.13,<3.14"
description = "Unified Trading System - Project Management"
dependencies = [
    "tomli-w>=1.0.0",
    "pytest<10.0.0,>=9.0.1",
    "pytest-asyncio<2.0.0,>=0.25.0",
    "pytest-mock<4.0.0,>=3.15.0",
    "pytest-timeout<3.0.0,>=2.4.0",
    "pytest-xdist<4.0.0,>=3.6.0",
    "pytest-cov<8.0.0,>=7.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
    "jsonschema>=4.0.0,<5.0.0",
    "ruff==0.15.0",
    "basedpyright==1.38.2",
    "pip-audit>=2.7.0,<3.0.0",
    "bandit>=1.7.0,<2.0.0",
    "duckdb>=1.2.0,<2.0.0",
]
[tool.setuptools.packages.find]
include = []

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "G"]


[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.ruff.lint.per-file-ignores]
"tests/test_generate_workspace_dag.py" = ["E402"]
"scripts/propagation/rollout-ui-build-infra.py" = ["E501"]
"scripts/dev/seed_validator.py" = ["BLE001"]
"scripts/dev/seed_features.py" = ["BLE001"]
"scripts/dev/smoke-test-dev.py" = ["BLE001", "S102"]

[tool.basedpyright]
extraPaths = ["scripts", "scripts/manifest", "scripts/validation", "scripts/propagation", "scripts/repo-management", "../unified-events-interface", "../unified-internal-contracts", "../unified-api-contracts"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
# JSON-parsing / argparse scripts: reportAny suppressed — dict values from json.load()
# and argparse.Namespace attributes are intentionally Any at the JSON/CLI boundary.
ignore = [
    "scripts/propagation/rollout-quality-gates-unified.py",
    "scripts/propagation/rollout-buildspec.py",
    "scripts/propagation/rollout-cloudbuild.py",
    "scripts/propagation/add-cloudbuild-deploy-via-dispatch.py",
    "scripts/validation/check-integration-dep-coverage.py",
    "scripts/validation/check_manifest_import_alignment.py",
    "scripts/validation/check_schema_provenance.py",
    "scripts/validation/validate-build-auth.py",
    "scripts/ops/generate-freeze-calendar.py",
    "scripts/manifest/reverse-dependency-lookup.py",
    "scripts/manifest/auto-populate-tags.py",
    "scripts/manifest/check-strategy-instruments.py",
    "scripts/manifest/check-strategy-maturity.py",
    "scripts/checkers/check-data-availability.py",
    "scripts/checkers/check-strategy-maturity.py",
    "scripts/checkers/check_ui_api_flow_coverage.py",
    "scripts/checkers/fixture_drift_checker.py",
    "scripts/checkers/flow_coverage_scorecard.py",
    "scripts/checkers/network_evidence_parser.py",
    "scripts/checkers/triad_assertion_checker.py",
    "scripts/generators/generate_dependency_viz.py",
    "scripts/generators/generate_strategy_manifest_dag.py",
    "scripts/generators/reverse-dependency-lookup.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: PM integration tests (verify repo sync with PM scripts)"]

[tool.coverage.run]
parallel = true
source = ["scripts"]
omit = [
    "tests/*",
    "*.venv*/*",
    "scripts/manifest/generate_canonical_dependency_manifest.py",
    "scripts/manifest/sbom-store.py",
    "scripts/check-internal-advisories.py",
    "scripts/generate-cicd-diagram.py",  # Diagram generator; tested by execution in QG post-step
    "scripts/compute-epic-readiness.py",  # Reporting script; run manually, not unit-tested
    "scripts/check-cross-plan-gates.py",  # Plan-gate checker; requires live filesystem, not unit-tested
    "scripts/validate-manifest-dag.py",  # DAG validator; integration-only, not unit-tested
]

[tool.coverage.report]
skip_empty = true
show_missing = true
