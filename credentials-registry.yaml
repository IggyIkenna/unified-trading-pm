# Credentials Registry
# SSOT for all external API keys and credentials required by the unified trading system.
# Actual secret values are stored in GCP Secret Manager and AWS Secrets Manager.
# This file documents: what each credential is for, the secret manager key name,
# which services require it, the credential type, and provisioning status.
#
# DO NOT store actual secret values here. Reference secret_manager_key only.
#
# Naming convention SSOT: unified-trading-codex/07-security/secret-naming-convention.md
# Secret access pattern:  get_secret_client() from unified_cloud_interface
# Provisioning script:    bash unified-trading-pm/scripts/setup_secret.sh -p $GCP_PROJECT_ID -n <key> -v <value>

version: 2
last_updated: "2026-03-09"
owner: unified-trading-pm

# ---------------------------------------------------------------------------
# SECTION 1 — Exchange Credentials (CeFi)
# Pattern: exec-{client}-{venue}-{account_type}  (client-scoped execution keys)
#          {venue}-api-credentials                (system-wide read-only keys)
# ---------------------------------------------------------------------------
exchange_credentials:
  # --- CeFi Execution (per-client, Tranche B) ---
  - name: exec-odum-binance-cefi
    description: >
      Binance CeFi execution credentials for client "odum". Contains JSON blob with api_key and api_secret. Used by
      execution-service via tranche_router.py Tranche B (Secret Manager live execution path).
    secret_manager_key: exec-odum-binance-cefi
    type: api_key_secret_json
    required_for:
      - execution-service (Tranche B live execution)
    status: needs_provisioning
    notes: >
      JSON format: {"api_key": "...", "api_secret": "..."}. Generate on Binance account settings → API Management.
      Enable Spot + Futures trading permissions. Restrict to known IPs. Store via: bash
      unified-trading-pm/scripts/setup_secret.sh -p $GCP_PROJECT_ID -n exec-odum-binance-cefi -v
      '{"api_key":"...","api_secret":"..."}'

  - name: exec-odum-deribit-cefi
    description: >
      Deribit CeFi execution credentials for client "odum". JSON blob with client_id and client_secret (Deribit uses
      OAuth2 client credentials, not API key/secret).
    secret_manager_key: exec-odum-deribit-cefi
    type: oauth2_client_credentials_json
    required_for:
      - execution-service (Tranche B live execution)
    status: needs_provisioning
    notes: >
      JSON format: {"client_id": "...", "client_secret": "..."}. Generate on Deribit Account → API Keys. Enable
      trade+read permissions. Deribit OAuth tokens expire — execution-service refreshes automatically via
      UnifiedTradeExecutionInterface.

  - name: exec-odum-okx-cefi
    description: >
      OKX CeFi execution credentials for client "odum". JSON blob with api_key, secret_key, and passphrase (OKX requires
      all three).
    secret_manager_key: exec-odum-okx-cefi
    type: api_key_secret_passphrase_json
    required_for:
      - execution-service (Tranche B live execution)
    status: needs_provisioning
    notes: >
      JSON format: {"api_key": "...", "secret_key": "...", "passphrase": "..."}. Generate on OKX Account → API → Create
      V5 API Key. Enable trade permissions.

  - name: exec-odum-hyperliquid-defi
    description: >
      Hyperliquid DeFi execution credentials for client "odum". Contains EIP-712 wallet private key and optional agent
      wallet address.
    secret_manager_key: exec-odum-hyperliquid-defi
    type: eip712_wallet_json
    required_for:
      - execution-service (Tranche B DeFi live execution via UnifiedDefiExecutionInterface)
    status: needs_provisioning
    notes: >
      JSON format: {"private_key": "0x...", "agent_address": "0x..."}. Never commit private key. Generate a dedicated
      trading wallet — never use primary wallet. Hyperliquid supports agent wallets for reduced exposure.

  - name: exec-odum-ibkr-tradfi
    description: >
      IBKR TradFi brokerage credentials for client "odum". Contains account number and paper/live trading mode flag.
      IBKR Gateway uses TWS OAuth/token auth managed by ibkr-gateway-infra — actual gateway credentials stored
      separately.
    secret_manager_key: exec-odum-ibkr-tradfi
    type: account_credentials_json
    required_for:
      - execution-service (Tranche B TradFi live execution)
      - ibkr-gateway-infra (gateway configuration)
    status: needs_provisioning
    notes: >
      JSON format: {"account_id": "...", "mode": "paper|live"}. IBKR Gateway manages the actual TWS connection. See
      ibkr_gateway_rollout.plan.md for full provisioning guide.

  - name: exec-odum-betfair-sports
    description: >
      Betfair sports betting exchange credentials for client "odum". Contains app_key and session_token. Betfair uses a
      login API for session tokens (not static API keys).
    secret_manager_key: exec-odum-betfair-sports
    type: api_key_session_json
    required_for:
      - execution-service (Tranche B sports execution)
      - features-sports-service (market data via UnifiedSportsExecutionInterface)
    status: needs_provisioning
    notes: >
      JSON format: {"app_key": "...", "username": "...", "password": "..."}. Session tokens are obtained at runtime via
      Betfair Identity API. Note: canonical name uses hyphen, not underscore (betfair_app_key is a known violation — see
      secret-naming-convention.md).

  # --- System-wide Read Keys (market data, non-execution) ---
  - name: binance-api-credentials
    description: >
      Binance system-wide read-only credentials for market data ingestion. Used by market-tick-data-service and
      unified-market-interface for public + authenticated endpoints (order book snapshots, klines).
    secret_manager_key: binance-api-credentials
    type: api_key_secret_json
    required_for:
      - market-tick-data-service (live market data)
      - unified-market-interface (venue adapter)
    status: needs_provisioning
    notes: Read-only permissions only. JSON format same as exec-odum-binance-cefi.

  - name: deribit-read-api-key
    description: >
      Deribit read-only API key for market data. Separate from execution credentials.
    secret_manager_key: deribit-read-api-key
    type: oauth2_client_credentials_json
    required_for:
      - market-tick-data-service (options data)
      - unified-reference-data-interface (instrument definitions)
    status: needs_provisioning
    notes: Read-only scope. JSON format same as exec-odum-deribit-cefi.

  - name: bybit-house-key
    description: >
      Bybit house/pooled trading credentials. Bybit does not split read vs. trade permissions (unlike Binance/Deribit,
      which split read/trade/write), so a single shared key pair serves both live execution (house/pooled Bybit
      positions) and market-data ingestion. No client segment — this is pooled/house money, not a specific client's, so
      it does not follow the exec-{client}-{venue}-{field} client-scoped pattern used for OKX/Binance client execution
      keys.
    secret_manager_keys:
      api_key: bybit-api-key
      api_secret: bybit-api-secret
    type: api_key_secret_pair
    required_for:
      - execution-service (Tranche B live execution — house/pooled Bybit positions)
      - market-tick-data-service (live market data)
    status: needs_provisioning
    notes: >
      Canonical names are bybit-api-key / bybit-api-secret (hyphenated, two separate Secret Manager entries — not a
      combined JSON blob). This is the rename target for the legacy underscored bybit_api_key / bybit_api_secret pair
      (the GCP rename itself — clone + verify + delete — is a separate operation, not yet performed as of this doc
      update). This single entry replaces two prior entries that each misidentified the canonical name:
      exec-odum-bybit-cefi (wrong — implied odum-client-scoped keying and a single JSON-blob secret; Bybit has no client
      segment) and bybit-api-credentials (wrong — implied a read-only-only scope; this key is shared for both execution
      and market-data reads).

  - name: ibkr-account-credentials
    description: >
      IBKR TWS Gateway authentication credentials (system-level, not per-client). Used by ibkr-gateway-infra to
      authenticate the gateway process against Interactive Brokers.
    secret_manager_key: ibkr-account-credentials
    type: account_credentials_json
    required_for:
      - ibkr-gateway-infra (gateway auth)
    status: needs_provisioning
    notes: >
      Rename from ibkr-tws-key per secret-naming-convention.md known violations table. JSON format: {"username": "...",
      "password": "...", "trading_mode": "paper|live"}.

