    notes: Enroll in T4 Batch F.

  - name: position-balance-monitor-service-s2s-token
    description: Phase 0 S2S bearer token for position-balance-monitor-service.
    secret_manager_key: position-balance-monitor-service-s2s-token
    type: static_bearer_token
