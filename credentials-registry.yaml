# ---------------------------------------------------------------------------
# SECTION 4 — API Tokens (third-party services)
# Pattern: {vendor}-api-key  or  {vendor}-api-credentials
# ---------------------------------------------------------------------------
api_tokens:
  - name: anthropic-api-key
    description: >
      Anthropic API key for claude-3-5-haiku used by ai-report-summaries feature in UIs. Not a backend service — used by
      the ai_summary.py module in reporting UIs.
    secret_manager_key: anthropic-api-key
    type: api_key
    required_for:
      - client-reporting-ui (ai_summary.py executive summaries — T6 Agent 8)
    status: needs_provisioning
    notes: >
      Generate at https://console.anthropic.com/api-keys. Model: claude-3-5-haiku (cost- efficient for batch report
      summarization). Store via setup_secret.sh.

  - name: databento-api-key
    description: >
      Databento market data API. Provides institutional-grade OHLCV data for CME futures (GLBX.MDP3 schema) and crypto
      venues. Required by market-data-processing-service for historical backfill and live bar construction feeding into
      delta-one calculators.
    secret_manager_key: databento-api-key
    type: api_key
    cost_estimate: "$100-500/month (usage-based; GLBX.MDP3 historical backfill is the largest cost driver)"
    required_for:
      - market-data-processing-service (OHLCV + CME futures ingestion)
      - features-delta-one-service (upstream input data)
    status: needs_provisioning
    notes: >
      Sign up at https://databento.com. Generate API key from dashboard. Store in GCP/AWS Secret Manager as
      databento-api-key. Set DATABENTO_API_KEY in service deployment env.

  - name: cryptopanic-api-key
    description: >
      CryptoPanic news aggregator API. Provides real-time crypto news feed with sentiment scores
      (bullish/bearish/important). Used by features-cross-instrument-service for news sentiment features.
    secret_manager_key: cryptopanic-api-key
    type: api_key
    cost_estimate: "$0-50/month (free tier available; paid plans for higher rate limits)"
    required_for:
      - features-cross-instrument-service (news sentiment features)
    status: needs_provisioning

  - name: lunarcrush-api-key
    description: >
      LunarCrush social intelligence API. Provides social volume, engagement, and sentiment metrics for crypto assets.
      Used for social sentiment features.
    secret_manager_key: lunarcrush-api-key
    type: api_key
    cost_estimate: "$50-200/month depending on plan tier"
    required_for:
      - features-cross-instrument-service (social sentiment features)
    status: needs_provisioning

  - name: cryptoquant-api-key
    description: >
      CryptoQuant on-chain metrics API. Provides Bitcoin/Ethereum on-chain indicators: exchange flows, miner data, whale
      wallet tracking.
    secret_manager_key: cryptoquant-api-key
    type: api_key
    cost_estimate: "$200-500/month (professional tier required for programmatic access)"
    required_for:
      - features-cross-instrument-service (on-chain metrics features)
    status: needs_provisioning

  - name: coinglass-api-key
    description: >
      Coinglass derivatives data API. Provides liquidation heatmap data, open interest, funding rates, and long/short
      ratios.
    secret_manager_key: coinglass-api-key
    type: api_key
    cost_estimate: "$50-200/month depending on plan tier"
    required_for:
      - features-delta-one-service (liquidation_levels.py calculator)
    status: needs_provisioning

  - name: oddspapi-api-key
    description: >
      OddsPapi odds aggregation API. Provides pre-match and historical odds from 348+ bookmakers including Asian sharps
      (Pinnacle with limits, Singbet, SBObet). Tick-level historical snapshots with bookmaker timestamps. Free tier: 250
      req/mo. Pro: $49/mo (customizable volume). Used by market-tick-data-service for sports odds backfill and
      e2e-testing for data validation.
    secret_manager_key: oddspapi-api-key
    type: api_key
    cost_estimate: "$0-49/month (free tier: 250 req/mo; Pro: $49/mo customizable)"
    required_for:
      - market-tick-data-service (sports odds backfill — Asian sharps + Betfair exchange depth)
      - e2e-testing (odds data validation scripts)
    status: provisioned
    notes: >
      Sign up at https://oddspapi.io (free, no credit card). API key via dashboard. Base URL:
      https://api.oddspapi.io/v4. Key features: Pinnacle with bet limits, Betfair exchange order book
      (availableToBack/Lay ladders), Singbet historical (5K+ snapshots/fixture), 66 markets for soccer. Asian sharp data
      validated 2026-03-28 (Pinnacle: 36K snapshots, Singbet: 5.5K snapshots per fixture). SBObet listed but no data
      observed on free tier — investigate on paid tier.

  - name: thegraph-api-key
    description: >
      The Graph protocol subgraph query API key. Used for DeFi on-chain data (Uniswap, Aave, Compound pool data) by
      features-onchain-service.
    secret_manager_key: thegraph-api-key
    type: api_key
    cost_estimate: "$0-100/month (free tier generous; paid for high-volume queries)"
    required_for:
      - features-onchain-service (DeFi subgraph queries)
    status: needs_provisioning
    notes: Canonical name is thegraph-api-key (rename from graph-api-key — deprecated alias).

  - name: alchemy-api-key
    description: >
      Alchemy Ethereum RPC endpoint API key. Used by features-onchain-service for direct on-chain reads (wallet
      balances, contract calls, block data).
    secret_manager_key: alchemy-api-key
    type: api_key
    cost_estimate: "$0-200/month (free tier generous for read-only RPC)"
    required_for:
      - features-onchain-service (Ethereum RPC)
    status: needs_provisioning

  - name: fred-api-key
    description: >
      FRED (Federal Reserve Economic Data) API. Provides macro indicators: CPI, Fed Funds Rate, yield curves,
      unemployment. Used for macro regime features.
    secret_manager_key: fred-api-key
    type: api_key
    cost_estimate: "Free — FRED API is free but requires registration for a key"
    required_for:
      - features-cross-instrument-service (macro regime features)
    status: needs_provisioning

  - name: tardis-api-key
    description: >
      Tardis.dev historical tick data API. Provides L2 order book snapshots and trade data for backtesting. Used by
      market-data-processing-service for historical fills.
    secret_manager_key: tardis-api-key
    type: api_key
    cost_estimate: "$200-500/month (data plan pricing)"
    required_for:
      - market-data-processing-service (historical L2 data for backtesting)
    status: needs_provisioning

  # --- No-key-needed (public APIs) ---
  - name: defillama-public-api
    description: >
      DefiLlama DeFi protocol data API. Free, no API key required. Direct HTTP calls to https://api.llama.fi.
    secret_manager_key: null
    type: public_api_no_key
    required_for:
      - features-cross-instrument-service (DeFi TVL features)
    status: no_key_needed

  - name: yahoo-finance-public-api
    description: >
      Yahoo Finance via yfinance library. Free public endpoints, no key required. Provides equity prices, macro indices
      (VIX, SPY, DXY) for cross-asset correlation features.
    secret_manager_key: null
    type: public_api_no_key
    required_for:
      - features-cross-instrument-service (macro/equity correlation features)
    status: no_key_needed

# ---------------------------------------------------------------------------
# SECTION 5 — Infrastructure / Database Credentials
# Pattern: {env}-{resource}-{type}
# ---------------------------------------------------------------------------
infrastructure_credentials:
  - name: prod-redis-password
    description: >
      Redis cluster password for production. Used by execution-service for order state caching and
      position-balance-monitor-service for hot balance state.
    secret_manager_key: prod-redis-password
    type: database_password
    required_for:
      - execution-service (order state Redis cache)
      - position-balance-monitor-service (hot balance state)
    status: needs_provisioning
    notes: >
      Generate: openssl rand -hex 32. Apply to Redis AUTH config. Store in SM. Cloud Run services access via
      REDIS_PASSWORD env var from secretKeyRef.

  - name: staging-redis-password
    description: Redis cluster password for staging environment.
    secret_manager_key: staging-redis-password
    type: database_password
    required_for:
      - execution-service (staging)
      - position-balance-monitor-service (staging)
    status: needs_provisioning

  - name: prod-postgres-password
    description: >
      PostgreSQL instance password for production. Used by deployment-service for deployment state tracking (if DB
      backend configured).
    secret_manager_key: prod-postgres-password
    type: database_password
    required_for:
      - deployment-service (deployment state DB — optional)
    status: needs_provisioning
    notes: >
      Only required if deployment-service is configured with a Postgres backend. Default deployment state uses GCS;
      Postgres is optional.

