# ---------------------------------------------------------------------------
# SECTION 3 — Service-to-Service Auth Tokens (Phase 0 Static Bearer)
# Pattern: {service}-s2s-token
# See: unified-trading-codex/07-security/service-to-service-auth.md
# ---------------------------------------------------------------------------
s2s_tokens:
  - name: execution-service-s2s-token
    description: >
      Phase 0 S2S bearer token for execution-service /internal/* routes. Callers include strategy-service and
      risk-and-exposure-service. 32-byte hex minimum.
    secret_manager_key: execution-service-s2s-token
    type: static_bearer_token
    env_var: SERVICE_AUTH_TOKEN
    required_for:
      - execution-service (receiver — X-Service-Token validation)
      - strategy-service (caller — X-Service-Token header)
      - risk-and-exposure-service (caller — X-Service-Token header)
    status: implemented
    notes: >
      Implemented in execution_service/auth_s2s.py. Rotate with: bash unified-trading-pm/scripts/setup_secret.sh -p
      $GCP_PROJECT_ID -n execution-service-s2s-token -v $(openssl rand -hex 32)

  - name: risk-and-exposure-service-s2s-token
    description: >
      Phase 0 S2S bearer token for risk-and-exposure-service /internal/* routes.
    secret_manager_key: risk-and-exposure-service-s2s-token
    type: static_bearer_token
    env_var: SERVICE_AUTH_TOKEN
    required_for:
      - risk-and-exposure-service (receiver)
      - execution-service (caller — risk check endpoints)
      - alerting-service (caller — risk event endpoints)
    status: implemented
    notes: Implemented in risk_and_exposure_service/auth_s2s.py.

  - name: strategy-service-s2s-token
    description: >
      Phase 0 S2S bearer token for strategy-service /internal/* routes.
    secret_manager_key: strategy-service-s2s-token
    type: static_bearer_token
    env_var: SERVICE_AUTH_TOKEN
    required_for:
      - strategy-service (receiver)
      - execution-service (caller — strategy signal endpoints)
    status: needs_provisioning
    notes: >
      Enroll in T4 Batch E per phase3_service_hardening_integration.plan.md. Add auth_s2s.py, provision token, run auth
      smoke test.

  - name: alerting-service-s2s-token
