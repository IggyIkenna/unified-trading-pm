# Credentials Registry
# SSOT for all external API keys and credentials required by the unified trading system.
# Actual secret values are stored in GCP Secret Manager and AWS Secrets Manager.
# This file documents: what each key is for, estimated cost, the secret manager key name,
# which services/calculators require it, and provisioning status.
#
# DO NOT store actual secret values here. Reference secret_manager_key only.
# Provisioning instructions: unified-trading-pm/plans/active/multi_tf_cascade_signal_architecture.plan.md
# (hft-provision-api-keys-setup todo)

version: 1
last_updated: "2026-03-06"
owner: unified-trading-pm

credentials:
  - name: databento-api-key
    description: >
      Databento market data API. Provides institutional-grade OHLCV data for CME futures
      (GLBX.MDP3 schema) and crypto venues. Required by market-data-processing-service
      for historical backfill and live bar construction feeding into delta-one calculators.
    secret_manager_key: databento-api-key
    cost_estimate: "$100-500/month (usage-based; GLBX.MDP3 historical backfill is the largest cost driver)"
    required_for:
      - market-data-processing-service (OHLCV + CME futures ingestion)
      - features-delta-one-service (upstream input data)
    status: needs_provisioning
    notes: >
      Sign up at https://databento.com. Generate API key from dashboard. Store in GCP/AWS
      Secret Manager as databento-api-key. Set DATABENTO_API_KEY in service deployment env.

  - name: cryptopanic-api-key
    description: >
      CryptoPanic news aggregator API. Provides real-time crypto news feed with sentiment
      scores (bullish/bearish/important). Used by features-cross-instrument-service for
      news sentiment features.
    secret_manager_key: cryptopanic-api-key
    cost_estimate: "$0-50/month (free tier available; paid plans for higher rate limits)"
    required_for:
      - features-cross-instrument-service (news sentiment features)
    status: needs_provisioning
    notes: >
      Sign up at https://cryptopanic.com/developers/api. Free tier provides limited
      requests/day. Store as cryptopanic-api-key in secret manager.

  - name: lunarcrush-api-key
    description: >
      LunarCrush social intelligence API. Provides social volume, engagement, and sentiment
      metrics for crypto assets. Used for social sentiment features feeding into
      features-cross-instrument-service.
    secret_manager_key: lunarcrush-api-key
    cost_estimate: "$50-200/month depending on plan tier"
    required_for:
      - features-cross-instrument-service (social sentiment features)
    status: needs_provisioning
    notes: >
      Sign up at https://lunarcrush.com/developers. Generate key from API dashboard.
      Store as lunarcrush-api-key in secret manager.

  - name: cryptoquant-api-key
    description: >
      CryptoQuant on-chain metrics API. Provides Bitcoin/Ethereum on-chain indicators:
      exchange flows, miner data, whale wallet tracking. Used for on-chain metric features.
    secret_manager_key: cryptoquant-api-key
    cost_estimate: "$200-500/month (professional tier required for programmatic access)"
    required_for:
      - features-cross-instrument-service (on-chain metrics features)
    status: needs_provisioning
    notes: >
      Sign up at https://cryptoquant.com. API access requires a paid subscription.
      Store as cryptoquant-api-key in secret manager.

  - name: coinglass-api-key
    description: >
      Coinglass derivatives data API. Provides liquidation heatmap data, open interest,
      funding rates, and long/short ratios. Required by liquidation_levels.py calculator.
    secret_manager_key: coinglass-api-key
    cost_estimate: "$50-200/month depending on plan tier"
    required_for:
      - features-delta-one-service (liquidation_levels.py calculator)
    status: needs_provisioning
    notes: >
      Sign up at https://coinglass.com/pricing. Generate API key from dashboard.
      Store as coinglass-api-key in secret manager.

  - name: defillama-api-key
    description: >
      DefiLlama DeFi protocol data API. Provides TVL, protocol metrics, and yield data.
      Free tier with no API key required.
    secret_manager_key: null
    cost_estimate: "Free — no API key required"
    required_for:
      - features-cross-instrument-service (DeFi TVL features)
    status: no_key_needed
    notes: >
      DefiLlama public API is open and does not require authentication.
      Base URL: https://api.llama.fi — use directly without a key.

  - name: yahoo-finance-api-key
    description: >
      Yahoo Finance market data. Provides equity prices, macro indices (VIX, SPY, DXY),
      and historical OHLCV for equities. Used for cross-asset correlation features.
    secret_manager_key: null
    cost_estimate: "Free — no API key required (yfinance library uses public endpoints)"
    required_for:
      - features-cross-instrument-service (macro/equity correlation features)
    status: no_key_needed
    notes: >
      Access via the yfinance Python library (public endpoints, no auth required).
      Rate limits apply; implement exponential backoff. No key to store.

  - name: fred-api-key
    description: >
      FRED (Federal Reserve Economic Data) API. Provides macro indicators: CPI, Fed Funds
      Rate, yield curves, unemployment. Used for macro regime features.
    secret_manager_key: fred-api-key
    cost_estimate: "Free — FRED API is free but requires registration for a key"
    required_for:
      - features-cross-instrument-service (macro regime features)
    status: needs_provisioning
    notes: >
      Register at https://fred.stlouisfed.org/docs/api/api_key.html to get a free key.
      Key is required but the service itself is free and has generous rate limits.
      Store as fred-api-key in secret manager despite being free.
