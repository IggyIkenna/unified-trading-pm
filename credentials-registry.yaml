service_accounts:
  - name: execution-service-service-account
    description: >
      GCP service account for execution-service. Used for Cloud Run identity, GCS access (execution results bucket),
      PubSub publish (order events), and Secret Manager access.
    secret_manager_key: execution-service-service-account
    type: gcp_service_account_json
    required_for:
      - execution-service (Cloud Run service identity)
    status: needs_provisioning
    iam_roles:
      - roles/run.invoker
      - roles/storage.objectAdmin (on execution results bucket)
      - roles/pubsub.publisher (on order-events topic)
      - roles/secretmanager.secretAccessor

  - name: strategy-service-service-account
