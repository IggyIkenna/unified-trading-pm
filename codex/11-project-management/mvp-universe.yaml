validation:
  checklist_item: BASE-22
  automated_checks:
    - Service config supports all MVP instruments (BTC, ETH + variants per category)
    - "CEFI: BTC, ETH, wBTC"
    - "DEFI: wBTC, ETH, WETH, stETH, wstETH, cbETH, rETH, weETH"
    - "TRADFI: ES, MES, SPY, CME BTC futures, BTC ETFs (IBIT, GBTC, BITO), VIX"
    - Service config supports all MVP venues per category (including SPORTS: BETFAIR, POLYMARKET)
    - Service respects expected_start_dates.yaml for date skipping
    - Service has per-service observability docs documenting MVP coverage
  manual_checks:
    - Service functionality supports FULL scope (not just MVP) - e.g., options code exists even if not tested for MVP
    - "Service testing covers MVP data extensively: BTC/ETH + all variants across all MVP venues"
    - Service deployment uses MVP data for initial validation
    - "instruments-service code already handles ETH variant mappings (WETH→ETH, stETH→ETH, etc.) - verify in adapters"
  validator_script: scripts/validators/validate_mvp_coverage.py
phasing:
  mvp_phase:
    description: Initial production launch with minimum viable data
    scope:
      BTC/ETH only, 6 CEFI venues, 3 DeFi protocols, 3 TradFi venues, 2 Sports venues (BETFAIR, POLYMARKET), 4 DeFi
      strategies, Sports arb
    timeline: Q1 2026 (current)
    success_criteria:
      - All 32 production services/libraries pass quality gates
      - "Data pipeline delivers MVP data end-to-end (instruments \u2192 features \u2192\
        \ signals \u2192 execution)"
      - Live trading operational for BTC/ETH on MVP venues
      - Batch backfill complete for MVP data (2019-present for CEFI, 2020-present for DeFi/TradFi)
  expansion_phase:
    description: Add non-MVP instruments, venues, strategies
    scope:
      Altcoins, stablecoins, additional CEFI venues (Deribit, Bybit), additional DeFi protocols (Curve, Balancer),
      NASDAQ/ICE TradFi
    timeline: Q2-Q3 2026
    dependencies:
      - MVP phase complete
      - Post-trade services operational
      - Regulatory compliance live
  commercialization_phase:
    description: Sports betting, options, advanced strategies
    scope: Sports services, TradFi options, advanced CEFI/TradFi strategies, client onboarding
    timeline: Q4 2026 - Q1 2027
    dependencies:
      - Expansion phase complete
      - FCA compliance reporting operational
      - DR/BCP tested
maintenance:
  review_cycle: "After each phase (MVP \u2192 Expansion \u2192 Commercialization)"
  owner: Production Readiness Working Group
  update_triggers:
    - New venue added to venues.yaml (evaluate for MVP inclusion)
    - New service added to service-registry.yaml (evaluate for MVP scope)
    - MVP success criteria change (e.g., add instrument, venue, or strategy)
    - Conflict reconciliation identifies new MVP scope issue
  related_documents:
    - deployment-service/configs/venues.yaml (available data)
    - deployment-service/configs/expected_start_dates.yaml (data availability)
    - unified-trading-pm/codex/10-audit/ssot-reference-mapping.md (SSOT hierarchy)
    - unified-trading-pm/codex/11-project-management/service-registry.yaml (service metadata)
    - unified-trading-pm/codex/10-audit/alignment-resolution-decisions.yaml (conflict resolutions)
architectural_changes:
  expected_start_dates_migration:
    current_location: deployment-service/configs/expected_start_dates.yaml
    target_location: unified-domain-client/data/expected_start_dates.yaml
    rationale: "All services (including UTD v2) should import this centralized data availability info.

      Better separation of concerns - domain data belongs in unified-domain-client.

      Services import at runtime to ensure validations align.

      "
    action_required:
      - Move expected_start_dates.yaml to unified-domain-client package
      - Add to unified-domain-client/data/ as package data
      - "Export via unified-domain-client API: get_expected_start_dates()"
      - Update all services to import from UDS instead of loading from UTD v2 configs
    impact: All 32 services need import update, UTD v2 deployment scripts need update
  post_trade_sharding:
    services_needing_configs:
      - position-balance-monitor-service
      - risk-and-exposure-service
    action_required:
      - "Create sharding.position-balance-monitor-service.yaml (likely category\xD7\
        venue\xD7date)"
      - "Create sharding.risk-and-exposure-service.yaml (likely category\xD7venue\xD7\
        date)"
      - Create unified-trading-pm/codex/10-audit/repos/position-balance-monitor-service.yaml (codex v3.0 schema)
      - Create unified-trading-pm/codex/10-audit/repos/risk-and-exposure-service.yaml (codex v3.0 schema)
      - Create data-catalogue.position-balance-monitor-service.yaml
      - Create data-catalogue.risk-and-exposure-service.yaml
    rationale:
      These services calculate positions and risk (domain data) used by strategy-service for execution decisions. Must
      support sharded parallel processing.
service_code_adjustments:
  instruments_service_tradfi:
    service: instruments-service
    issue: Currently no CME S&P futures, no micro/macro ES futures inclusion in adapters
    required_instruments:
      - ES (E-mini S&P 500 futures) - macro contract
      - MES (Micro E-mini S&P 500 futures) - micro contract
    venue: CME
    adapter_file: instruments-service/adapters/tradfi_databento_adapter.py
    action_required: "Add ES and MES futures to CME adapter:

      - Check Databento GLBX.MDP3 dataset for ES/MES availability

      - Add to instruments list in adapter

      - Verify data availability from 2020-01-01 (per expected_start_dates)

      "
    priority: P0-critical (required for MVP TradFi)
  market_tick_data_handler_orderbook_by_category:
    service: market-tick-data-service
    issue: MVP uses different orderbook depths per category - book_snapshot_5 for CEFI, book_snapshot_10 for TRADFI
    rationale: "CEFI (Tardis): book_snapshot_5 sufficient for centralized exchange orderbooks

      TRADFI (Databento): book_snapshot_10 for deeper traditional market orderbooks

      No book_snapshot_25/100 needed for MVP - top 5/10 levels adequate

      "
    action_required: "Verify correct orderbook depth per category:

      - CEFI: book_snapshot_5 only (from Tardis)

      - TRADFI: book_snapshot_10 + tbbo (from Databento)

      - Remove any code excluding book_snapshot_10 for TRADFI

      - Ensure no book_snapshot_25/100 processing for MVP (not needed)

      - Update documentation to clarify orderbook depth by category

      "
    files_to_update:
      - market-tick-data-service/adapters/databento_adapter.py
      - market-tick-data-service/adapters/tardis_adapter.py
      - market-data-processing-service/config.py (if it filters data types)
      - unified-trading-pm/codex/02-data/data-types.md (clarify per-category usage)
    priority: P1-high (correct orderbook depth critical for execution quality)
  defi_uniswap_v2:
    service: instruments-service, features-*-service
    issue: MVP includes UNISWAP_V2_ETH but may not be fully tested
    action_required: "Verify UNISWAP_V2_ETH support across pipeline:

      - instruments-service: Confirm V2 protocol adapter exists

      - features services: Confirm V2 data processing works

      - Test with V2 data (start date: 2020-05-18)

      "
    priority: P2-medium (V2 is established protocol)
  cefi_liquidations:
    services: market-tick-data-service, market-data-processing-service
    issue: Liquidations previously marked as non-critical; now required for MVP
    action_required: "Ensure liquidations data type is processed for CEFI venues:

      - Verify Tardis API liquidations channel subscribed

      - Verify downstream processing (features services) handle liquidations

      - Add to MVP test data fixtures

      "
    priority: P1-high (critical for risk monitoring)
runtime_imports:
  expected_start_dates_import:
    description: Services should import expected_start_dates at runtime (not hardcode)
    current_pattern: Load from deployment-service/configs/expected_start_dates.yaml
    target_pattern: "Import from unified-domain-client: from unified_domain_client import get_expected_start_dates"
    rationale: Ensures all services use same data availability criteria; changes propagate automatically
    migration_timeline: After expected_start_dates migrated to unified-domain-client
