    issue: Verify ASTER is in venues.yaml under categories.CEFI.venues (or if it has different name)
    status: resolved
    resolution: "✅ ASTER confirmed present in venues.yaml (line 19). No action needed."
    resolved_date: "2026-02-21"
  - protocols:
      - CURVE
      - BALANCER
      - EULER
      - FLUID
      - PLASMA
    category: DEFI
    issue: These protocols ARE in venues.yaml (available data) but excluded from MVP
    status: resolved
    resolution: Correct behavior - venues.yaml tracks available data, MVP tracks minimum viable scope. No action needed.
  - service: features-service (sports family)
    issue: Previously excluded from MVP
    status: resolved
    resolution: Sports arb in scope for MVP (March 2026). features-service (sports family) now included.
  - services:
      - position-balance-monitor-service
      - risk-and-exposure-service
      - pnl-attribution-service
    issue: Listed in service-registry.yaml but no sharding configs or operational checklists
