mvp_version: "1.0"
last_updated: "2026-03-04"
reviewer: Ikenna
instruments:
  cefi:
    description: Native and wrapped crypto instruments on centralized exchanges
    included:
      - BTC (Bitcoin - native)
      - ETH (Ethereum - native)
      - wBTC (Wrapped Bitcoin - on Ethereum)
    rationale: Core crypto instruments traded on CEFI venues. wBTC included for cross-chain exposure.
    examples:
      - BINANCE-SPOT:BTC-USDT, BINANCE-FUTURES:BTC-USDT-PERP
      - COINBASE:ETH-USD, HYPERLIQUID:ETH-USD-PERP
  defi:
    description: Native, wrapped, and staked crypto instruments on DeFi protocols
    btc_variants:
      - wBTC (Wrapped Bitcoin - primary BTC representation on Ethereum)
    eth_variants:
      - ETH (native Ethereum)
      - WETH (Wrapped ETH - ERC-20 version)
      - stETH (Lido Staked ETH - rebasing)
      - wstETH (Wrapped Staked ETH - non-rebasing wrapper for stETH)
      - cbETH (Coinbase Staked ETH)
      - rETH (Rocket Pool Staked ETH)
      - weETH (ether.fi Wrapped eETH)
    rationale:
      "All ETH variants represent ETH exposure with different staking/wrapping mechanisms. Code already handles these
      (see instruments-service/app/core/instrument_processing_service.py lines 2286-2310). DeFi protocols (Uniswap,
      Aave, Compound) support pools with these variants."
    examples:
      - UNISWAPV3-ETHEREUM:WETH-USDC (spot pair)
      - UNISWAPV3-ETHEREUM:wstETH-WETH (staked ETH / wrapped ETH)
      - AAVEV3_ETHEREUM:WETH (lending pool)
      - COMPOUND_V3_ETH:WETH (lending market)
  tradfi:
    description: Traditional finance futures, ETFs, and derivatives
    sp500_exposure:
      - ES (E-mini S&P 500 futures - macro contract, CME)
      - MES (Micro E-mini S&P 500 futures - 1/10th size, CME)
      - SPY (S&P 500 ETF - SPDR, NYSE)
    btc_exposure:
      - BTC futures (CME Bitcoin futures)
      - IBIT (iShares Bitcoin Trust ETF)
      - GBTC (Grayscale Bitcoin Trust)
      - BITO (ProShares Bitcoin Strategy ETF)
    volatility:
      - VIX (CBOE Volatility Index)
    rationale:
      "ES/MES futures provide S&P 500 exposure (24/7 trading), SPY ETF for equities, BTC futures/ETFs for crypto
      exposure in TradFi accounts. VIX for volatility hedging."
    priority: "P0-critical: ES/MES/SPY required for MVP TradFi strategies"
    examples:
      - CME:ES (E-mini S&P 500 futures)
      - CME:MES (Micro E-mini S&P 500 futures)
      - NYSE:SPY (S&P 500 ETF)
      - CME:BTC (Bitcoin futures)
  excluded:
    - All other altcoins (SOL, AVAX, MATIC, etc.)
    - Stablecoins (USDT, USDC, DAI - except as quote currencies)
    - Memecoins (DOGE, SHIB, PEPE, etc.)
    - Individual equities (AAPL, TSLA, NVDA, etc.)
    - TradFi options (CME ES options, SPY options, etc.)
  rationale:
    Focus on BTC/ETH exposure across all three categories (CEFI, DEFI, TRADFI). Other instruments added
    post-commercialization.
venues:
  cefi:
    description: Centralized exchanges (Tardis API) and on-chain CLOBs
    included:
      - BINANCE-SPOT
      - BINANCE-FUTURES
      - OKX
      - UPBIT
      - COINBASE
      - HYPERLIQUID
      - ASTER
    excluded:
      - DERIBIT
      - BYBIT
    rationale:
      6 CEFI venues covering major centralized exchanges plus 2 on-chain CLOBs. Excludes options-focused venues and
      late-starting venues.
    alignment_notes:
      - All included venues exist in venues.yaml under categories.CEFI.venues
      - ASTER confirmed present in venues.yaml (line 19) - RESOLVED
  defi:
    description: DeFi protocols on Ethereum mainnet (The Graph API)
    included:
      - AAVEV3_ETHEREUM
      - UNISWAPV2-ETHEREUM
      - UNISWAPV3-ETHEREUM
      - COMPOUND_V3_ETH
    excluded:
      - CURVE
      - BALANCER
      - EULER
      - FLUID
      - PLASMA
      - SUSHISWAP_ETH
    rationale:
      3 core DeFi protocols (2 lending, 1 DEX) for MVP strategies. User explicitly excluded 5 protocols (Curve,
      Balancer, Euler, Fluid, Plasma).
    alignment_notes:
      - Excluded protocols ARE in venues.yaml (available data) but excluded from MVP scope
      - This is expected and correct - venues.yaml tracks available data, MVP tracks minimum viable scope
  tradfi:
    description: Traditional finance exchanges (Databento API) and external providers
    included:
      - CME
      - CBOE
      - NYSE
    excluded:
      - NASDAQ
      - ICE
      - FX
    rationale: CME ES futures (24/7 trading), VIX (volatility index), SPY (S&P 500 ETF). No options for MVP.
    alignment_notes:
      - CME ES includes both micro and macro futures (specified in user requirements)
      - All included venues exist in venues.yaml under categories.TRADFI.venues
      - "SERVICE CODE ADJUSTMENT NEEDED: Currently no CME S&P futures, no micro/macro futures inclusion in
        instruments-service adapters. Code must be updated to support ES micro/macro futures for MVP."
  sports:
    description: Sports betting exchanges (odds, markets)
    included:
      - BETFAIR
      - POLYMARKET
    rationale: Arb strategy MVP. BETFAIR exchange, POLYMARKET prediction markets.
    alignment_notes:
      - See venue_data_types.yaml SPORTS section

asset_groupes:
  included:
    - CRYPTO_CEFI
    - DEFI
    - TRADFI_FUTURES
    - TRADFI_ETFS
    - SPORTS
  excluded:
    - TRADFI_OPTIONS
    - TRADFI_EQUITIES
  rationale:
    Focus on crypto (CEFI + DeFi) and tradfi derivatives (futures, ETFs). No options, no individual equities. Sports arb
    in scope for MVP (March 2026).
data_types:
  included:
    - trades
    - book_snapshot_5
    - book_snapshot_10
    - liquidations
    - ohlcv_1m
    - ohlcv_15m
    - derivative_ticker
    - tbbo
  excluded:
    - book_snapshot_25
    - book_snapshot_100
    - options_chain
    - ohlcv_24h
  rationale:
    Core data types for trading. CEFI uses book_snapshot_5 (Tardis), TRADFI uses book_snapshot_10 and tbbo (Databento).
    Liquidations critical for CEFI risk monitoring.
  data_type_per_category:
    CEFI:
      - trades
      - book_snapshot_5
      - liquidations
      - derivative_ticker
    TRADFI:
      - trades
      - book_snapshot_10
      - tbbo
      - ohlcv_1m
      - ohlcv_15m
    DEFI:
      - swaps
      - rate_indices
      - oracle_prices
      - utilization
      - liquidity
      - risk_params
    SPORTS:
      - odds
      - markets
strategies:
  defi_mvp:
    - staking
    - lending
    - recursive_staking_with_flash_loans
    - basis_trade_long_spot_short_perp
  cefi_mvp:
    description: ML prediction-based strategies
    timeframes:
      - 1m
      - 5m
      - 15m
      - 4h
      - 24h
    predictions:
      - swing_high_breakout
      - swing_low_breakout
      - swing_high_reversion
      - swing_low_reversion
    rationale: ML models predict swing high/low breakouts vs reversions across 5 timeframes
    implementation_ref: Check ml-training-service, ml-inference-service for model specs
  tradfi_mvp:
    description: ML prediction-based strategies (same as CEFI)
    timeframes:
      - 1m
      - 5m
      - 15m
      - 4h
      - 24h
    predictions:
      - swing_high_breakout
      - swing_low_breakout
      - swing_high_reversion
      - swing_low_reversion
    rationale: ML models for futures/ETFs - same prediction framework as CEFI
    implementation_ref: Check ml-training-service, ml-inference-service for model specs
  sports_mvp:
    - arb
  rationale:
    4 DeFi strategies (manual/rule-based). ML predictions for CEFI/TradFi (swing high/low breakout vs reversion across 5
    timeframes). No ML in DeFi for MVP.
services:
  included:
    - features-service (sports family)
  excluded:
    - sports-betting-services
  rationale:
    Position/risk services are engines that calculate domain data used by strategy-service. Must have sharding for
    parallel processing. pnl-attribution-service may need review separately.
  requires_sharding:
    - position-balance-monitor-service
    - risk-and-exposure-service
  action_required:
    - "Create sharding.position-balance-monitor-service.yaml (likely category\xD7venue\xD7\
      date)"
    - "Create sharding.risk-and-exposure-service.yaml (likely category\xD7venue\xD7\
      date)"
    - Create unified-trading-pm/codex/10-audit/repos/position-balance-monitor-service.yaml (codex v3.0 schema)
    - Create unified-trading-pm/codex/10-audit/repos/risk-and-exposure-service.yaml (codex v3.0 schema)
