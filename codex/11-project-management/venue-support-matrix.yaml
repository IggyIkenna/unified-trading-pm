# Status codes:
#   ✅ full - Fully supported (batch + live)
#   🟡 batch-only - Batch mode only
#   🟡 live-only - Live mode only
#   ⚪ planned - Planned but not implemented
#   ⛔ n/a - Not applicable (platform/UI services support ALL venues)
#
# ==============================================================================

