# Stage 3B — UAC Combo Rules Registry Schema (sketch)
#
# This YAML is the data shape the eventual UAC PR ships. Stage 3C's derivation
# engine reads from `combo_registry.yaml` (or an equivalent protobuf/avro) whose
# structure matches this sketch. Companion prose spec:
#   codex/16-strategy-playbooks/infra-spec/stage-3b-uac-combo-rules.md
#
# Validation target:
#   python -c "import yaml; yaml.safe_load(open('codex/16-strategy-playbooks/infra-spec/stage-3b-combo-rules-schema.yaml'))"
#
# When UAC ships the real registry, this file becomes a fixture under
# `unified-api-contracts/tests/fixtures/combo_registry/` and the live registry
# lives under `unified-api-contracts/unified_api_contracts/registry/
# combo_registry.py` with a loader that validates against this shape.

schema_version: "stage-3b.v1"
generated_at: "2026-04-20"
source_rules:
  - _ssot-rules/03-same-system-principle.md
  - _ssot-rules/04-dart-commercial-axes.md
  - _ssot-rules/05-building-block-dimensions.md
  - _ssot-rules/07-data-licensing-boundaries.md
  - _ssot-rules/10-strategy-instruction-schema-principles.md
  - 09-strategy/architecture-v2/category-instrument-coverage.md
  - 09-strategy/architecture-v2/cross-cutting/strategy-availability-and-locking.md
  - 02-venues/venue-registry-reference.md

# -----------------------------------------------------------------------------
# Dimensions
# -----------------------------------------------------------------------------
dimensions:
  category:
    type: enum
    values:
      - CEFI
      - TRADFI
      - DEFI
      - SPORTS
      - PREDICTION

  instrument_type:
    type: enum
    values:
      - spot
      - perp
      - dated_future
      - option
      - lending
      - staking
      - lp
      - event_settled

  venue:
    type: object
    fields:
      id:
        type: string
        description: stable venue identifier, lowercase snake_case
      category:
        type: category
      venue_type:
        type: enum
        values: [SINGLE_VENUE, META_BROKER, DATA_AGGREGATOR]
      supported_operations:
        type: list[enum]
        values:
          [
            TRADE,
            SWAP,
            LEND,
            BORROW,
            STAKE,
            UNSTAKE,
            QUOTE,
            TRANSFER,
            BRIDGE,
            ATOMIC,
            CANCEL,
            TICKS,
            OHLC,
            ORDERBOOK,
            TRADES,
            FUNDING,
            LIQUIDATIONS,
            REFERENCE_DATA,
          ]
      supported_instruments:
        type: list[instrument_type]
      supported_chains:
        type: list[chain]
        optional: true
        description: DeFi venues only
      data_license_tier:
        type: data_license_tier
      lay_side_capable:
        type: bool
        optional: true
        description: sports/prediction venues only
      quote_capable:
        type: bool
        description: whether the venue exposes a quoting API (used by BL-6)
      multi_leg_capability:
        type: object
        fields:
          max_legs: int
          calendar_spread_combo_listed: bool
      pricing_fidelity:
        type: enum
        values: [tick, snapshot, derived]

  chain:
    type: enum
    values:
      - ethereum
      - arbitrum
      - optimism
      - base
      - polygon
      - avalanche
      - solana

  strategy_archetype:
    type: object
    fields:
      id:
        type: enum
        values:
          - ML_DIRECTIONAL_CONTINUOUS
          - ML_DIRECTIONAL_EVENT_SETTLED
          - RULES_DIRECTIONAL_CONTINUOUS
          - RULES_DIRECTIONAL_EVENT_SETTLED
          - CARRY_BASIS_DATED
          - CARRY_BASIS_PERP
          - CARRY_STAKED_BASIS
          - CARRY_RECURSIVE_STAKED
          - YIELD_ROTATION_LENDING
          - YIELD_STAKING_SIMPLE
          - ARBITRAGE_PRICE_DISPERSION
          - LIQUIDATION_CAPTURE
          - STAT_ARB_PAIRS_FIXED
          - STAT_ARB_CROSS_SECTIONAL
          - MARKET_MAKING_CONTINUOUS
          - MARKET_MAKING_EVENT_SETTLED
          - VOL_TRADING_OPTIONS
          - EVENT_DRIVEN
      family:
        type: enum
        values:
          - ML_DIRECTIONAL
          - RULES_DIRECTIONAL
          - CARRY_AND_YIELD
          - ARBITRAGE_STRUCTURAL
          - STAT_ARB_PAIRS
          - MARKET_MAKING
          - VOL_TRADING
          - EVENT_DRIVEN
      valid_pairs:
        type: list[object]
        fields:
          category: category
          instrument_type: instrument_type
          status: enum
          values: [SUPPORTED, PARTIAL, BLOCKED, N/A]
      supported_venues:
        type: list[string]
      supported_signal_variants:
        type: dict[instrument_type, list[string]]

  feature_group:
    type: string
    description: opaque identifier from UAC FeatureGroupRegistry

  model_family:
    type: string
    description: opaque identifier; versioned with v{N} on slot_label

  exec_algo:
    type: string
    description: identifier from execution-service algo_library/

  entitlement:
    type: object
    description: 13 building blocks from rule 05
    fields:
      block_id:
        type: enum
        values:
          - reporting_core
          - regulatory_umbrella_reporting
          - im_allocator_reporting
          - strategy_service_entry
          - instructions_integration
          - research_promote_pipeline
          - execution_layer
          - venue_packs
          - chain_packs
          - instrument_type_packs
          - analytics_packs
          - exclusivity_premium
          - custom_solution_premium
      sub_scope:
        type: dict
        optional: true
        examples:
          instructions_integration:
            schema_depth: minimal | standard | rich
          venue_packs:
            venue: <venue_id>
          chain_packs:
            chain: <chain_id>
          instrument_type_packs:
            instrument_type: <type>
          analytics_packs:
            analytic_family: exposure | execution_quality | factor_attribution | regime_classification | liquidity
      tier:
        type: enum
        values: [TIER_A, TIER_B]
      data_license_tier:
        type: data_license_tier
        description: rule 07 constraint flag per block

  lock_state:
    type: enum
    values:
      - PUBLIC
      - INVESTMENT_MANAGEMENT_RESERVED
      - CLIENT_EXCLUSIVE
      - RETIRED

  maturity:
    type: enum
    values:
      - CODE_NOT_WRITTEN
      - CODE_WRITTEN
      - CODE_AUDITED
      - BACKTESTED
      - PAPER_TRADING
      - PAPER_TRADING_VALIDATED
      - LIVE_TINY
      - LIVE_ALLOCATED

  lifecycle_phase:
    type: enum
    values:
      - research
      - paper
      - live

  org_scope:
    type: string
    description: JWT claim — odum_internal | client:<id> | prospect:<session_id>

  fund_structure:
    type: enum
    values:
      - POOLED
      - SMA

  data_license_tier:
    type: enum
    values:
      - retail_ok
      - institutional_only
      - odum_proprietary

  instruction_schema_fit:
    type: enum
    values:
      - signals_only
      - client_strategy_and_downstream
      - full_pipeline
    sub_dimensions:
      schema_depth:
        type: enum
        values: [minimal, standard, rich]
        applies_when: instruction_schema_fit == signals_only

# -----------------------------------------------------------------------------
# Slot definition — one row per entry in the strategy catalogue
# -----------------------------------------------------------------------------
slot_schema:
  type: object
  fields:
    slot_label:
      type: string
      description: "see 09-strategy/architecture-v2/category-instrument-coverage.md §Slot label grammar"
      example: "CARRY_BASIS_PERP@binance-btc-usdt-prod"
    archetype: strategy_archetype.id
    family: strategy_archetype.family
    category: category
    instrument_type: instrument_type
    venues: list[string]
    chains:
      type: list[chain]
      optional: true
    timeframe:
      type: string
      optional: true
    share_class:
      type: string
      description: terminal settlement currency — usdt | usdc | usd | gbp | eur | eth | btc | sol
    version:
      type: string
      description: v1 | v2 | ... — increments on material dep change (model swap, venue swap)
    env:
      type: enum
      values: [prod, uat, paper, shadow]
    lock_state: lock_state
    maturity: maturity
    lifecycle_phase: lifecycle_phase
    fund_structure:
      type: fund_structure
      optional: true
    exclusive_client_id:
      type: org_scope
      optional: true
      description: required when lock_state == CLIENT_EXCLUSIVE
    reserving_business_unit_id:
      type: string
      optional: true
      description: required when lock_state == INVESTMENT_MANAGEMENT_RESERVED
    feature_groups: list[feature_group]
    model_family:
      type: model_family
      optional: true
    exec_algo: exec_algo
    representative_future:
      type: object
      optional: true
      description: populated for -dated- slots when RepresentativeFutureRegistry ships (UAC gap #11)
      fields:
        underlying_id: string
        current_contract: string
        liquidity_feature_group: feature_group
        roll_threshold_pct: float

