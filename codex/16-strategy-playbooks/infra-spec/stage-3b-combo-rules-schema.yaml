# -----------------------------------------------------------------------------
# Valid-combo resolution
# -----------------------------------------------------------------------------
valid_combo:
  description: |
    Stage 3C derivation engine applies this formula to resolve the visible slot
    universe for (viewer, action) queries. Pure function of (registry, context).
  formula: |
    valid_strategies(venue, instrument_type, category) =
      { archetype ∈ StrategyArchetype
          : (category, instrument_type) ∈ archetype.valid_pairs
          ∧ venue ∈ archetype.supported_venues
          ∧ venue.category == category
          ∧ instrument_type ∈ venue.supported_instruments
          ∧ ¬ blocked(archetype, venue, instrument_type, category)
          ∧ data_license_tier_compatible(venue, client.entitlement_scope)
          ∧ (if signals_only:
               required_fields_present(client.schema)
               ∧ archetype.instruction_schema_fit ⊆ {minimal, standard, rich})
      }
  resolution_order:
    - step: cartesian_expansion
      cardinality_estimate: "~21600"
      shape: "archetype × category × instrument_type × venue"
    - step: filter_by_valid_pairs
      cardinality_estimate: "~1000"
    - step: filter_by_venue_compatibility
      cardinality_estimate: "~400"
    - step: apply_blockers
      cardinality_estimate: "~130 representative slots"
      citation: "09-strategy/architecture-v2/category-instrument-coverage.md §changelog — 130 fully-spelled slots"
    - step: apply_visibility_filters
      depends_on: [viewer.org_scope, lock_state, maturity, lifecycle_phase]

# -----------------------------------------------------------------------------
# Four derivations (Stage 3C consumes)
# -----------------------------------------------------------------------------
derivations:
  pricing_quote:
    inputs: [commercial_path, blocks, tier]
    rule_refs: [rule_05, rule_08, rule_07]
    shape:
      line_items:
        - block_id: string
          tier: TIER_A | TIER_B
          sub_scope: dict
          monthly: decimal
          upfront:
            type: decimal
            applies_when: tier == TIER_B
          internal_cost:
            type: decimal
            codex_private: true
          data_license_tier: data_license_tier
      premiums:
