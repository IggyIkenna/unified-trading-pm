# ==============================================================================
# Unified Trading Codex - Enhanced Master Audit Checklist Template (v2.0)
# ==============================================================================
#
# Copy this file to checklist.{service}.yaml and assess each item.
#
# ENHANCEMENTS (v2.0):
#   - validator_id: Which validator script checks this item
#   - ssot_ref: Which codex document/config is the single source of truth
#   - automation_status: manual, semi-automated, automated
#   - criticality: critical, high, medium, low
#   - Organized into sections for easier navigation
#
# Status values:
#   pass          - Item fully satisfied; evidence confirms compliance
#   fail          - Item not satisfied; remediation required
#   partial       - Partially satisfied; some aspects need work
#   not_assessed  - Not yet evaluated
#   na            - Not applicable to this service (document reason in notes)
#
# Priority levels:
#   P0 - Critical: blocks production deployment
#   P1 - High: must fix before live trading
#   P2 - Medium: technical debt; fix when capacity allows
#   P3 - Low: best-practice polish
#
# Automation status:
#   automated      - Fully automated validator exists and runs in CI
#   semi-automated - Partial automation (some manual checks required)
#   manual         - Manual assessment only (no automated checks)
#
# Criticality:
#   critical - Failure causes system crash, data loss, or incorrect behavior
#   high     - Failure degrades system reliability or performance
#   medium   - Failure increases technical debt or maintenance burden
#   low      - Failure is cosmetic or minor polish issue
#
# ==============================================================================

