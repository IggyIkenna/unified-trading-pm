# ==============================================================================
# ASSET CLASS READINESS
# ==============================================================================
# Tracks which asset classes this repo supports and what is available per class.
# Drives epic-level aggregation: compute-epic-readiness.py reads these fields to
# compute per-epic completion %.
#
# supported_asset_classes: list of asset classes this repo participates in.
#   Valid values: cefi | defi | tradfi | sports | core
#   "core" = required by all epics (infrastructure/shared repos).
#
# Per asset class block (repeat for each class in supported_asset_classes):
#   mvp_ready: true once all sub-fields are satisfied for MVP scope.
#   data.historical_available: batch historical data exists for this asset class.
#   data.historical_start_date: ISO date of earliest available data (from mvp-universe.yaml).
#   data.live_available: live streaming data available.
#   data.mock_available: mock/fixture data available for tests (CLOUD_MOCK_MODE=true).
#   data.testnet_available: testnet environment exists (DeFi protocols).
#   data.testnet_env: testnet name (e.g. "sepolia", "arbitrum-goerli").
#   feature_groups: feature group IDs this repo produces/consumes for this asset class.
#   ml_models: model IDs from ml-training-service configs (services only).
#   venue_deps: venues/protocols this repo directly depends on for this asset class.
#   branch_status: manually updated; reflects current git state.
#     qg_passed: CR4 (bash scripts/quality-gates.sh) is green on this branch.
#     quickmerged: CR5 (quickmerge PR merged) achieved on this branch.
#
# Epic gate: epic = 100% when all required repos have
#   asset_class_readiness.{class}.branch_status.main.quickmerged: true
#   AND business_readiness.current_stage >= br5 (for service repos).
#
# AGENTS: do NOT set mvp_ready: true autonomously — derive it from sub-fields.
# ==============================================================================

asset_class_readiness:
  supported_asset_classes: [] # list of: cefi | defi | tradfi | sports | core

  # Template block — copy and rename key per asset class in supported_asset_classes.
  # Example shown for "defi"; replace with "cefi", "tradfi", "sports", or "core".
  defi: # replace key with actual asset class
    mvp_ready: false
    data:
      historical_available: false
      historical_start_date: null # ISO date or null; from mvp-universe.yaml data_availability
      live_available: false
      mock_available: false
      testnet_available: false
      testnet_env: null # e.g. "sepolia", "arbitrum-goerli"; null for non-DeFi
    feature_groups: [] # e.g. [onchain_lending, tvl_metrics, staking_yield]
    ml_models: [] # model IDs from ml-training-service configs (empty for libs)
    venue_deps: [] # venues/protocols this repo depends on (from mvp-universe.yaml)
    branch_status:
      feature:
        reached: false
        qg_passed: false # CR4 green on this branch
        quickmerged: false # CR5 achieved
      staging:
        reached: false
        qg_passed: false
        quickmerged: false
      main:
        reached: false
        qg_passed: false
        quickmerged: false # true = epic gate satisfied for this repo

