# ==============================================================================
# Unified Trading System — Repo Readiness Checklist Template (v3.0)
# ==============================================================================
#
# SSOT for all per-repo readiness state in the workspace.
# Copy to repos/{repo-name}.yaml and fill in each field.
#
# Schema version: 3.0
# Supersedes: deployment-service/configs/checklist.*.yaml (readiness criteria only)
# Supersedes: 10-audit/batch/*.yaml + 10-audit/live/*.yaml
#
# IMPORTANT NOTES:
#   - deployment-service/configs/ remains SSOT for: sharding, venues, data-catalogue
#     operational data. This file owns READINESS criteria only.
#   - Status values: pass | fail | partial | not_assessed | na
#   - Agents MUST NOT set br8_user_approved.status = "pass" autonomously.
#
# Status values:
#   pass         - Item fully satisfied; evidence confirms compliance
#   fail         - Item not satisfied; remediation required
#   partial      - Partially satisfied; some aspects need work
#   not_assessed - Not yet evaluated
#   na           - Not applicable (document reason in na_reason)
#
# repo_type values:
#   library-t0   - Tier 0: zero-dep base libraries (UAC, UIC, UEI, UCI, EAL, MEL)
#   library-t1   - Tier 1: single-dep libraries (UTL, URDI, USEI)
#   library-t2   - Tier 2: multi-dep libraries (UMI, UTEI, UML, UFCL, UDEI, UPI)
#   library-t3   - Tier 3: domain clients (UDC)
#   service      - T4 production services
#   api          - T5 API gateway services
#   ui           - T6 frontend UI repos
#   infra        - Infrastructure/devops repos (deployment-service, PM, codex, SIT)
#
# deployment_modes values:
#   null         - Libraries (not deployed as Cloud Run services)
#   ["batch"]    - Batch-only services
#   ["live"]     - Live-only services
#   ["batch", "live"] - Services supporting both modes
#
# ==============================================================================

schema_version: "3.0"
repo: "{REPO_NAME}"
repo_type: "library-t0|library-t1|library-t2|library-t3|service|api|ui|infra"
arch_tier: null # 0 | 1 | 2 | 3 | service | api | ui | infra
deployment_modes: null # null for libraries; ["batch"] | ["live"] | ["batch","live"] for services
business_modes: null # null for libraries; ["batch"] | ["live"] | ["batch","live"]
version: "0.0.0"
status: "active" # active | scaffolded | future
last_updated: "YYYY-MM-DD"

# ==============================================================================
# CODE READINESS (CR1–CR5)
# ==============================================================================
# Progresses independently from DR and BR.
# CR3 rule: count dependencies[] in workspace-manifest.json — each dep must have
#           a test in tests/integration/. Zero-dep repos satisfy CR3 automatically.
# ==============================================================================

code_readiness:
  current_stage: "CR0" # CR0 | CR1 | CR2 | CR3 | CR4 | CR5
  readiness_note: ""

  cr1_functionality:
    status: "not_assessed"
    criteria: |
      Zero NotImplementedError in core paths; zero stub handlers returning {} or pass;
      no TODO/FIXME markers in production-path code. Audit §2 passes.
      Every stub must be tracked in an active plan.
    evidence: ""
    notes: ""

  cr2_unit_tests:
    status: "not_assessed"
    criteria: |
      QG unit stage green; coverage >= floor (80% for libraries, 70% for services);
      zero skipped tests without documented reason; --cov-report=xml written to disk.
    coverage_pct: null
    coverage_floor_pct: null # 80 for libraries, 70 for services
    evidence: ""
    notes: ""

  cr3_integration_tests:
    status: "not_assessed"
    criteria: |
      Every direct manifest dependency exercised by at least one integration test
      in tests/integration/. Tests run credential-free (CLOUD_PROVIDER=local
      CLOUD_MOCK_MODE=true). Zero-dep repos satisfy CR3 automatically.
    manifest_dep_count: 0
    manifest_deps_covered: []
    manifest_deps_missing: []
    evidence: ""
    notes: ""

  cr4_quality_gate:
    status: "not_assessed"
    criteria: |
      bash scripts/quality-gates.sh Pass 1 fully green: ruff (0 errors), basedpyright
      (0 errors), coverage floor, codex checks, security scan, all tests pass.
      No || : bypasses added to reach green.
    last_run_date: null
    basedpyright_errors: null
    ruff_errors: null
    evidence: ""
    notes: ""

  cr5_quickmerge:
    status: "not_assessed"
    criteria: |
      bash scripts/quickmerge.sh merged to feat/code-readiness-{repo} or main via
      cascade. PR created and CI passes. For v1.0.0 gate: CR5 means merged to main,
      not just feat/*.
    branch: null
    ci_url: null
    merged_to_main: false
    evidence: ""
    notes: ""

