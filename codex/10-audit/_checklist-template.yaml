# ==============================================================================
# Unified Trading Codex - Master Audit Checklist Template
# ==============================================================================
#
# Copy this file to checklist.{service}.yaml and assess each item.
#
# Status values:
#   pass          - Item fully satisfied; evidence confirms compliance
#   fail          - Item not satisfied; remediation required
#   partial       - Partially satisfied; some aspects need work
#   not_assessed  - Not yet evaluated
#   na            - Not applicable to this service (document reason in notes)
#
# Priority levels:
#   P0 - Critical: blocks production deployment
#   P1 - High: must fix before live trading
#   P2 - Medium: technical debt; fix when capacity allows
#   P3 - Low: best-practice polish
#
# Mode:
#   batch - Applies only to batch/pipeline services
#   live  - Applies only to live trading services
#   both  - Applies to all services
#
# Cross-references:
#   - Original checklist: deployment-service/configs/checklist.template.yaml
#   - Audit findings:     .cursor/audits/MASTER_AUDIT_SUMMARY_2026-02-09.md
#   - Remediation plan:   .cursor/audits/REMEDIATION_ROADMAP_2026-02-09.md
#   - Codex principles:   unified-trading-pm/codex/01-domain through 09-analysis
#
# ==============================================================================

