# Epic-to-Checklist-to-Audit Mapping Registry
#
# Purpose: Map between epic tasks, checklist items, audit items, and validators
#
# Three ID schemes unified:
#   - Epic tasks: "epic-name:task-id" (e.g., "data-io:1.1")
#   - Checklist items: "item_XX_name" (e.g., "item_03b_unified_config_class")
#   - Audit items: "CATEGORY-NN" (e.g., "BASE-01", "OBS-05")
#   - Validators: "validator_name" (e.g., "no_os_getenv_validator")
#
# This file enables bidirectional sync between:
#   - Epic task completion → checklist item status
#   - Checklist item status → epic task blockers
#   - Validator results → audit YAML status
#   - Audit status → checklist items
#
# Format:
#   epic_task: Unique epic:task_id reference
#   service: Service repo name
#   classification: IMPLEMENT | VALIDATE | REFACTOR
#   checklist_items: List of related checklist item IDs
#   audit_items: List of related audit YAML item IDs
#   validator_ids: List of validators that check this task
#
# Last Updated: 2026-02-21
# Schema Version: 1.0

