    area: "06-coding-standards"
    priority: P1-high
    title: "Config management via UnifiedCloudServicesConfig"
    description: |
      Service uses UnifiedCloudServicesConfig for ALL configuration.
      No os.getenv(), no hardcoded project IDs, no empty fallbacks.

      ✅ Pass: All config via config.py or config/ package extending UnifiedCloudServicesConfig
      ❌ Fail: os.getenv() found, hardcoded project IDs, empty string defaults
    evidence: "Check config.py or config/, search for os.getenv in production code"
    codex_ref: "06-coding-standards/configuration-management.md"

