  - id: HARDENING-01
    area: "06-coding-standards"
    priority: P0-critical
    title: "No fallback imports (single import path per dependency)"
    description: |
      Every dependency has exactly ONE import path. No try-except fallback imports.

      ❌ FORBIDDEN:
        try:
            from unified_events_interface import log_event
        except ImportError:
            from unified_trading_library.observability import log_event

      ✅ REQUIRED:
        from unified_events_interface import log_event

      ✅ Pass: All imports are direct, no try-except patterns
      ❌ Fail: Fallback imports found
    evidence: "Grep for 'try:.*import' patterns in production code"
    codex_ref: ".cursor/rules/hardening-standards.mdc"
