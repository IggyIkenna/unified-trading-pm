# ==============================================================================
# Service Baseline Template - ALL Services Must Pass These Checks
# ==============================================================================
#
# This template defines the baseline checklist that EVERY service in the
# Unified Trading System must satisfy, regardless of type (pipeline/platform/UI).
#
# Usage:
#   - Copy this template when creating a new service audit file
#   - Extend with group-specific items (see _service-pipeline-*.yaml, _service-ui-*.yaml)
#   - Run sync-issues.py to create GitHub issues from fail/partial items
#
# ==============================================================================

template_version: "2.0"
last_updated: "2026-02-21"
applies_to: "ALL services"

# ==============================================================================
# Baseline Checklist Items
# BASE-01 through BASE-32: Core standards
# HARDENING-01 through HARDENING-06: Hardening & defensive code elimination
# REGULATORY-01 through REGULATORY-04: FCA compliance & audit trail
# DR-01 through DR-03: Disaster recovery & business continuity
# SECURITY-03 through SECURITY-05: Additional security standards
# ==============================================================================

