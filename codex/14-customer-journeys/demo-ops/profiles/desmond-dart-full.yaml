# Demo toggle pairing
plan_toggle:
  paired_persona_id: desmond-signals-in
  tier: full
  paired_tier: signals-in

# Sales context — what the team already knows about Desmond from Telegram
# conversations. Do not duplicate CRM data here; this is demo-hygiene context so
# the operator running the walkthrough can frame the session.
notes: |
  - Likely fits: funding-rate arb (CARRY_BASIS_PERP on CeFi perps) + stable
    yield (CARRY_STAKED_BASIS, YIELD_STAKING_SIMPLE on DeFi).
  - May start Signals-In (keeps strategy IP) and upgrade to DART Full later if
    he wants Odum ML backtest + Promote. Toggle lets him preview both tiers in
    one demo.
  - Reg Umbrella candidate on a longer horizon — UK-regulated prop desk, FCA
    exposure via Odum's permissions plausible once mandate lands.
  - Risk profile "low" + leverage "low" → SUPPORTED-only coverage filter;
    option instruments NOT excluded (low vs none).
  - neutral → Explore tab rules-expansion adds ARBITRAGE_STRUCTURAL alongside
    carry + stat_arb, surfaces Lido-only CARRY_STAKED_BASIS (recursive-staked
    locked as next-tier expansion stub).

# Surfaces + walkthrough hints for the operator
walkthrough_hints:
  - Land on /services/strategy-catalogue?tab=explore&from=questionnaire with the banner "Showing strategies that match
    your questionnaire profile".
  - Demonstrate CARRY_BASIS_PERP + CARRY_STAKED_BASIS tearsheets; point to "Full + Signals-In" emerald tier badge on
    both cards.
  - Flip DemoPlanToggle to desmond-signals-in; same universe renders but Research + Promote tabs in the DART tile row
    become locked (click → /services/dart/locked?from=research or ?from=promote).
  - Discuss ML_DIRECTIONAL archetypes with Desmond as the upgrade hook (amber "DART Full only" badge; available on Full
    but not Signals-In).
  - On /services/reports/strategy/{instance_id}, highlight that P&L and returns always link out of the FOMO card into
    the reporting service — one source of truth for performance.
