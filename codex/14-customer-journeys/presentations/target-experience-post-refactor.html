      ## Slide 1 — Cover + user directive

      ## Slide 15 — The 3 internal one-liners + expansions

      Rule 09. Internal use verbatim; external docs expand using the three-sentence pattern (positioning / mechanism / proof).

      **DART** (internal one-liner):

      > An accelerator for strategy, research, execution, and control — the same system Odum uses internally.

      **DART** (external expansion):

      > DART is the set of services Odum uses to build, research, promote, execute, and monitor its own systematic strategies, packaged for client use. Clients who operate their own strategies can plug their signals into Odum's execution and reporting stack, or they can use the full research and promotion pipeline. The underlying components are the same as Odum's internal operation — one system, partitioned views.

      **IM** (internal one-liner):

      > Allocate capital to Odum-managed strategies; reporting is built in because it is the same reporting system Odum uses itself.

      **IM** (external expansion):

      > Investment Management allocates client capital to Odum-run systematic strategies operating under Odum's FCA permissions. Reporting — positions, exposures, P&L, reconciliation — comes from the same surface Odum uses to run its own operation, with allocator-side views filtered by entitlement. The minimum engagement is twelve months; the onboarding path sets up the fund structure (Pooled or SMA), capital allocation, and reporting at the same time.

      **Reg Umbrella** (internal one-liner):

      > Operate your regulated activity under Odum's FCA permissions; onboarding, compliance, MLRO, supervision, and reporting included.

      **Reg Umbrella** (external expansion):

      > Firms running regulated activity that want operational coverage without seeking direct FCA authorisation can operate under Odum's permissions. Onboarding handles regulatory scope, compliance setup, MLRO coverage, and supervisory reporting. Reporting surfaces use the same component tree as IM and DART reporting, filtered to the firm's regulated-activity view.

      Rule 02 voice throughout: present tense, specific over evocative, no adverbs, no forward-tense marketing hedges.

    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>

    <script>
      // Read embedded markdown source, split into slides, create <section data-markdown> elements.
      // Splitting at "\n---\n" between slides; the mermaid xychart `---` in slide 10 is wrapped in
      // a `%%{init:...}%%` comment instead of YAML-front-matter, so there's no ambiguity.
      (function hydrateDeck() {
        const source = document.getElementById("deck-source").textContent;
        const parts = source.split(/\n---\n/);
        const container = document.getElementById("slides-container");
        parts.forEach((md) => {
          const trimmed = md.trim();
          if (!trimmed) return;
          const section = document.createElement("section");
          section.setAttribute("data-markdown", "");
          const textarea = document.createElement("textarea");
          textarea.setAttribute("data-template", "");
          textarea.textContent = trimmed;
          section.appendChild(textarea);
          container.appendChild(section);
        });
      })();

      Reveal.initialize({
        hash: true,
        slideNumber: "c/t",
        controls: true,
        controlsTutorial: true,
        progress: true,
        center: false,
        transition: "slide",
        plugins: [RevealMarkdown, RevealNotes],
        markdown: {
          gfm: true,
          smartypants: true,
        },
      });

      mermaid.initialize({
        startOnLoad: false,
        theme: "default",
        securityLevel: "loose",
        flowchart: { useMaxWidth: true, htmlLabels: true, curve: "basis" },
        themeVariables: {
          primaryColor: "#eaf1fb",
          primaryBorderColor: "#1a5d9f",
          primaryTextColor: "#1a1a1a",
          lineColor: "#1a5d9f",
          fontSize: "14px",
        },
      });

      Reveal.on("ready", renderMermaidInCurrentSlide);
      Reveal.on("slidechanged", renderMermaidInCurrentSlide);

      async function renderMermaidInCurrentSlide() {
        // Walk all unrendered mermaid code blocks in the deck; convert <pre><code class=language-mermaid>
        // into <div class="mermaid"> so mermaid.run() picks them up.
        const candidates = document.querySelectorAll("pre code.language-mermaid:not([data-mermaid-hydrated])");
        candidates.forEach((codeEl) => {
          codeEl.dataset.mermaidHydrated = "true";
          const source = codeEl.textContent;
          const div = document.createElement("div");
          div.className = "mermaid";
          div.textContent = source;
          const preEl = codeEl.closest("pre");
          (preEl || codeEl).replaceWith(div);
        });
        try {
          await mermaid.run({ querySelector: ".mermaid:not([data-processed])" });
        } catch (err) {
          console.error("Mermaid render failed:", err);
        }
      }
    </script>
