      v1-style strategy_type strings (AAVE_LENDING etc.) to v2 archetype + slot identity. This is the live
      archetype-slot resolver. Phase 3 work: rename to archetype_slot_resolver.py and migrate every caller from v1
      strategy_type strings to direct StrategyArchetype + slot.
    known_import_count: 4
    replacement: archetype_slot_resolver (rename) + caller migration to StrategyArchetype
    target_wave: V1-RETIRE Phase 3 (rename + caller migration)
    ready_to_delete: false

