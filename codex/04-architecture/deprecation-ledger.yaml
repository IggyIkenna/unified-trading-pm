# Deprecation Ledger — workspace-wide retirement tracker
#
# Workspace audit P4.8 (2026-05-01). Single grep-discoverable file
# tracking every shim, archived path, parallel implementation, or
# transitional config that's intentionally still alive but should retire
# under a known condition. Prevents "temporary shim forever" syndrome.
#
# Update protocol:
#   - Add an entry whenever you ship a shim, dual-path, or `_archived_*`
#     directory that consumers must keep importing for a while.
#   - When deletion lands, remove the entry from this file in the same
#     commit (do not just mark "deleted" -- the ledger lists what's still
#     on the chopping block).
#   - When a target_wave or delete_condition flips to satisfied, leave
#     the entry but set ``ready_to_delete: true``.
#
# Schema:
#   - id:                short slug for cross-referencing
#     component:         path or fully-qualified module name
#     repo:              owning repo
#     status:            shim | archived | parallel | transitional_config
#     owner:             github handle or team
#     replaces_what:     short description of the system it succeeds
#     delete_condition:  one-line predicate that must be true before delete
#     known_import_count: 0  # populated by grep at audit time
#     replacement:       path of the new thing (if any)
#     target_wave:       P-tag from a workspace audit / plan
#     ready_to_delete:   false  # flip when delete_condition is met
#     notes:             freeform context
#
# ─────────────────────────────────────────────────────────────────────────────

ledger:
  - id: strategy_archived_pre_v2
    component: strategy_service/engine/strategies/_archived_pre_v2/
    repo: strategy-service
    status: deleted
    owner: ikenna
    replaces_what: "v1 strategy implementations (~63 files / ~18k LoC)"
    delete_condition: ALREADY DELETED 2026-05-01 (V1-RETIRE Phase 2 commit a7f6f79)
    known_import_count: 0
    replacement: strategy_service/engine/strategies/v2/
    target_wave: V1-RETIRE Phase 2
    ready_to_delete: true
    notes: >
      DELETED 2026-05-01 in commit strategy-service a7f6f79 (V1-RETIRE Phase 2). Total surface area removed: 63 v1
      source files + 38 v1 test files + 145-symbol re-export block in engine/strategies/__init__.py + 5 inline imports
      in batch_handler.py + create_strategy_instance factory body + v2_shadow dispatch mode. 1414 tests pass
      post-deletion. Pre-deletion state recoverable at git tag v1-removal-phase2-pre-delete-2026-05-01. Listed for
      audit-trail completeness; safe to remove from ledger in a future cleanup pass.

  - id: strategy_legacy_type_to_archetype
