# Epic keyword-surface SSOT for check_parent_epic_alignment.py
#
# Each epic entry lists the distinctive tokens that characterise plans
# belonging to that epic. Used for soft parent_epic mismatch detection.
# keyword matching is case-insensitive substring; shorter tokens (e.g.
# "defi") must be distinctive enough to avoid false positives — prefer
# compound terms or service names over single-letter acronyms.
#
# repos: the canonical git repo(s) touched by plans under this epic.
#
# Seeded 2026-05-30 by scanning plans/epics/<slug>.md + active child plans.
# Regenerate by re-running scripts/plan-hygiene/check_parent_epic_alignment.py
# with --emit-surface.

