meta:
  title: Unified Trading System — CI/CD Pipeline (as-built)
  subtitle: "LDR-trunk decoupling — commit → LDR → staging → SIT → main → image"
  version: "2026-06-18"
  source: docs/repo-management/cicd-pipeline-definition.yaml
  regenerate: python3 scripts/generate-cicd-diagram.py
# CANONICAL diagram = the mermaid in codex/08-workflows/ci-cd-flow.md § "Branch model" (hand-maintained, renders
# natively in GitHub). This YAML renders the SAME as-built model as a standalone SVG companion (gitignored, regenerated
# by the QG post-gate). Per-workflow drill-down: docs/repo-management/CICD-WORKFLOW-CATALOG.md.
swimlanes:
  - id: slot
    label: "Slot clone

      (Path-B / LDR)"
    color: "#f0f4ff"
    border: "#6c9bd2"
  - id: gha_pm
    label: "GHA

      (PM / promote bots)"
    color: "#f0fff4"
    border: "#5daf51"
  - id: sit
    label: "SIT

      (breaking only)"
    color: "#fff0f0"
    border: "#e05c5c"
  - id: cloud_build
    label: "Cloud Build

      / image"
    color: "#f5f0ff"
    border: "#8e5cb4"
nodes:
  - id: commit
    label: "agent commit

      on slot clone (LDR)"
    type: start
    swimlane: slot
    col: 0
    branch: feat_star
    tooltip: "Each slot is a Path-B git clone --reference checked out on live-defi-rollout. Agent commits here."
  - id: pass1
    label: "Pass 1

      quality-gates.sh

      writes .qg_last_passed_sha"
    type: process
    swimlane: slot
    col: 1
    branch: feat_star
    tooltip: "Local full gate (REQUIRED). On green it writes the sentinel; the commit is the per-repo quality boundary."
  - id: quickmerge
    label: "Pass 2

      quickmerge --agent --files

      stamps Quickmerge: trailer"
    type: process
    swimlane: slot
    col: 2
    branch: feat_star
    tooltip: "Verifies sentinel, commits ONLY the named files, lands on LDR. The ONLY sanctioned code path to LDR."
  - id: ldr
    label: "live-defi-rollout (LDR)

      integration trunk

      no server QG"
    type: process
    swimlane: slot
    col: 3
    branch: feat_star
    tooltip: "The unit of work lands here and STOPS. LDR is the integration SSOT; staging/main are projections of it."
  - id: tierc
    label: "ldr-to-staging-promote

      cron 2,17,32,47 (15m)

      dep-order + Tier-A/B gated"
    type: process
    swimlane: gha_pm
    col: 4
    branch: staging
    tooltip: "Tier-C drain: opens a LDR→staging PR per repo when deps are on staging and LDR CI is not red."
  - id: staging_pr
    label: "LDR→staging PR

      quality-gates-v2

      = SERVER GATE"
    type: decision
    swimlane: gha_pm
    col: 5
    branch: staging
    actor: "head=LDR, base=staging\nv2 is the only server gate"
    tooltip: "quality-gates-v2 runs on the drain PR (head=live-defi-rollout, base=staging). LDR itself never runs it."
  - id: staging
    label: "staging"
    type: process
    swimlane: gha_pm
    col: 6
    branch: staging
    tooltip: "Drain target for service repos. Its only inbound is the Tier-C drain PR — never a per-unit feat/* PR."
  - id: breaking
    label: "breaking

      public surface?"
    type: decision
    swimlane: sit
    col: 7
    branch: staging
    actor: "scripts/cicd/detect_breaking_change.py\n(AST public-surface differ)"
    tooltip: "Content-based: removed/renamed export, incompatible signature, schema/route change → SIT. Else skip SIT."
  - id: sit_run
    label: "SIT

      sit-gate locks →

      system-integration-tests → sit-unlock"
    type: process
    swimlane: sit
    col: 8
    branch: staging
    tooltip:
      "sit-gate sets staging_status.locked; on pass sit-unlock dispatches staging-validated; on fail clears lock."
  - id: s2m
    label: "staging-to-main

      topo-order promote

      clears lock"
    type: process
    swimlane: gha_pm
    col: 9
    branch: main
    tooltip:
      "Triggered by staging-validated (+ a */15 drain-tick). Promotes staging_versions → versions, clears the SIT lock."
  - id: main
    label: "main

      reconciled output"
    type: process
    swimlane: gha_pm
    col: 10
    branch: main
    tooltip: "The reconciled output — semver bump + image-build trigger. Never raw; only reached after the gate."
  - id: image
    label: "cloud-build-router

      Cloud Build / CodeBuild

      image"
    type: process
    swimlane: cloud_build
    col: 11
    branch: main
    tooltip: "On main push, routes to the prod image build (GCP Cloud Build / AWS CodeBuild)."
  - id: ldrmain
    label: "ldr-to-main-promote

      cron */15

      PM Option-B (no staging)"
    type: process
    swimlane: gha_pm
    col: 4
    branch: agent
    tooltip: "PM has no staging — a standing LDR→main PR (v2-gated) drains PM's LDR directly to main."
  - id: backmerge
    label: "main-backmerge-to-ldr

      on push + hourly drift-tick"
    type: process
    swimlane: gha_pm
    col: 11
    branch: agent
    tooltip: "Feeds the reconciled main result back to LDR (FF-only, never force) so every slot converges."
connections:
  - from: commit
    to: pass1
    branch: feat_star
  - from: pass1
    to: quickmerge
    label: "Pass 1 ✓"
    branch: feat_star
  - from: quickmerge
    to: ldr
    branch: feat_star
  - from: ldr
    to: tierc
    label: "service repo"
    branch: staging
  - from: tierc
    to: staging_pr
    branch: staging
  - from: staging_pr
    to: staging
    label: "v2 green"
    branch: staging
    outcome: "yes"
  - from: staging
    to: breaking
    branch: staging
  - from: breaking
    to: sit_run
    label: "breaking"
    branch: staging
    outcome: "yes"
  - from: breaking
    to: s2m
    label: "non-breaking"
    branch: main
    outcome: "no"
  - from: sit_run
    to: s2m
    label: "pass: staging-validated"
    branch: main
  - from: s2m
    to: main
    branch: main
  - from: main
    to: image
    label: "main push"
    branch: main
    style: dashed
  - from: ldr
    to: ldrmain
    label: "PM (Option-B)"
    branch: agent
    style: dashed
  - from: ldrmain
    to: main
    branch: agent
    style: dashed
  - from: main
    to: backmerge
    branch: agent
    style: dashed
  - from: backmerge
    to: ldr
    label: "FF-only"
    branch: agent
    style: dashed
annotations:
  - node: ldr
    text: "integration SSOT;

      staging/main = projections"
    position: below
  - node: staging_pr
    text: "LDR never runs

      server QG"
    position: above
  - node: breaking
    text: "SIT fires only on a

      real public-surface change"
    position: below
legend:
  branches:
    - id: feat_star
      label: slot / LDR (integration trunk)
      color: "#6c9bd2"
    - id: staging
      label: staging drain
      color: "#e8a838"
    - id: main
      label: main + image
      color: "#5daf51"
    - id: agent
      label: PM Option-B / backmerge
      color: "#9b59b6"
  node_types:
    - type: start
      label: Start / trigger
    - type: process
      label: Process / action
    - type: decision
      label: Decision (if/else)
    - type: end
      label: Terminal state
